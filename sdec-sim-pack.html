<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SDEC Simulation Pack — twelve replicable 10-minute scenarios for the unselected medical take, each with sim card, MRCP-style SBA reinforcement, and faculty crib sheet.">
<title>SDEC Simulation Pack · Unselected medical take</title>

<!-- ═══════════════════════════════════════════════════════════════
     DEPLOYMENT NOTES
     ═══════════════════════════════════════════════════════════════
     Single-file HTML. No CDN dependencies (except Google Fonts).
     No localStorage, no analytics, no tracking.
     Works in iframes (no X-Frame-Options issues from your end).

     1. Upload sdec-sim-pack.html to a static host (GitHub Pages
        recommended — SharePoint blocks JavaScript on uploaded HTML
        in most NHS tenants).
     2. Share the resulting URL. No configuration required.
     3. Faculty mode toggle in the header reveals the crib sheet
        for facilitators. Off by default for shared screens.
     4. Each scenario is deep-linkable: /#1 to /#12 plus optional
        /sba, /crib, e.g. /#5/sba.
     ═══════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #F7F3EA;
  --paper-warm: #EFE9DA;
  --paper-deep: #E8E1CF;
  --ink: #0F1F2E;
  --ink-soft: #2C3E50;
  --ink-muted: #5A6B7E;
  --rule: #D6CFBF;
  --rule-soft: #E5DFCF;
  --accent: #4A6E5D;
  --accent-deep: #2F4A3D;
  --accent-soft: #E8E4D6;
  --warm: #B45309;
  --warm-soft: #FAEBC8;
  --red: #9A2A20;
  --red-soft: #F4E4E0;
  --green: #2F5D3C;
  --shadow: 0 1px 2px rgba(15, 31, 46, 0.04), 0 8px 24px rgba(15, 31, 46, 0.06);
  --shadow-lift: 0 4px 12px rgba(15, 31, 46, 0.08), 0 16px 40px rgba(15, 31, 46, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--paper);
  background-image:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(74, 110, 93, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 100% 100%, rgba(180, 83, 9, 0.04) 0%, transparent 50%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Grain overlay for paper feel */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.35;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.55 0 0 0 0 0.45 0 0 0 0.06 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.wrap {
  position: relative;
  z-index: 2;
  max-width: 1160px;
  margin: 0 auto;
  padding: 28px 32px 64px;
}

a { color: var(--ink); text-decoration: none; }
a:hover { color: var(--accent-deep); }

/* ────────────────── HEADER ────────────────── */
header.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 56px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  text-transform: uppercase;
  gap: 16px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.brand-mark {
  width: 34px; height: 34px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-weight: 600; font-size: 18px; color: var(--ink);
  background: var(--paper);
}
.brand-text { line-height: 1.2; }
.brand-text .b-main { color: var(--ink); font-weight: 500; }
.brand-text .b-sub { color: var(--ink-muted); font-size: 10.5px; margin-top: 2px; }

.header-controls { display: flex; align-items: center; gap: 12px; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--paper);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  transition: all 0.2s ease;
}
.toggle:hover { border-color: var(--ink); color: var(--ink); }
.toggle.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toggle .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ink-muted);
  display: inline-block;
}
.toggle.on .dot { background: var(--warm-soft); }

/* ────────────────── HOME — HERO ────────────────── */
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.18em;
  color: var(--accent-deep);
  text-transform: uppercase;
  margin-bottom: 22px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.eyebrow:before {
  content: '';
  width: 32px; height: 1px;
  background: var(--accent);
}

.hero {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 56px;
  align-items: end;
  margin-bottom: 80px;
}
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; gap: 32px; }
}

h1.hero-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: clamp(40px, 6vw, 76px);
  line-height: 0.97;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin-bottom: 24px;
}
h1.hero-title em {
  font-style: italic;
  font-variation-settings: 'opsz' 144, 'SOFT' 100;
  color: var(--accent-deep);
}
.lede {
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink-soft);
  max-width: 560px;
  margin-bottom: 0;
}

.hero-figure {
  background: var(--paper-warm);
  border: 1px solid var(--rule);
  padding: 36px 32px;
  position: relative;
  box-shadow: var(--shadow);
  font-family: 'Fraunces', serif;
}
.hero-figure::before {
  content: '';
  position: absolute;
  top: 14px; right: 14px;
  width: 22px; height: 22px;
  border-top: 1.5px solid var(--accent);
  border-right: 1.5px solid var(--accent);
}
.figure-num {
  font-size: 84px;
  line-height: 0.85;
  font-weight: 500;
  color: var(--ink);
  font-variation-settings: 'opsz' 144;
  letter-spacing: -0.04em;
}
.figure-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  letter-spacing: 0.05em;
  color: var(--ink-muted);
  text-transform: uppercase;
  margin-top: 6px;
  margin-bottom: 22px;
}
.figure-divider {
  height: 1px;
  background: var(--rule);
  margin: 22px 0;
}
.figure-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 24px;
  font-family: 'DM Sans', sans-serif;
}
.figure-stat .num {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1;
  display: block;
}
.figure-stat .lbl {
  font-size: 11.5px;
  color: var(--ink-muted);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 6px;
}

/* ────────────────── SECTION TITLE ────────────────── */
.section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 28px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.section-title .roman {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.04em;
  text-transform: none;
}

/* ────────────────── HOW TO RUN STRIP ────────────────── */
.howto {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-bottom: 80px;
}
@media (max-width: 720px) { .howto { grid-template-columns: 1fr; } }
.howto-step {
  background: var(--paper);
  padding: 28px 26px;
}
.howto-step .step-n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.howto-step .step-t {
  font-family: 'Fraunces', serif;
  font-size: 21px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 10px;
  line-height: 1.2;
}
.howto-step .step-d {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.55;
}

/* ────────────────── SCENARIO GRID ────────────────── */
.scenarios {
  margin-bottom: 80px;
}
.scenario-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.sc-card {
  background: var(--paper);
  padding: 30px 26px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  min-height: 240px;
  transition: background 0.2s ease;
  position: relative;
}
.sc-card:hover { background: var(--paper-warm); }
.sc-card .sc-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.sc-card .sc-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
}
.sc-card .sc-domain {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-deep);
  padding: 4px 9px;
  border: 1px solid var(--accent);
  border-radius: 3px;
  background: var(--accent-soft);
}
.sc-card .sc-title {
  font-family: 'Fraunces', serif;
  font-size: 23px;
  font-weight: 500;
  line-height: 1.18;
  color: var(--ink);
  letter-spacing: -0.01em;
  margin-bottom: 10px;
}
.sc-card .sc-tagline {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-muted);
  margin-bottom: auto;
  padding-bottom: 22px;
}
.sc-card .sc-action {
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
}
.sc-card .arrow { transition: transform 0.2s ease; }
.sc-card:hover .arrow { transform: translateX(4px); }

/* ────────────────── ABOUT BLOCK ────────────────── */
.about {
  padding-top: 16px;
}
.about p {
  max-width: 720px;
  font-size: 15px;
  color: var(--ink-soft);
  line-height: 1.65;
  margin-bottom: 14px;
}
.about p strong { color: var(--ink); font-weight: 600; }

/* ────────────────── FOOTER ────────────────── */
footer {
  margin-top: 96px;
  padding-top: 32px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  flex-wrap: wrap;
  gap: 12px;
}
footer .colophon {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0.01em;
  color: var(--accent);
}

/* ────────────────── SCENARIO PAGE ────────────────── */
.crumb {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 28px;
  cursor: pointer;
  transition: color 0.2s ease;
  background: none;
  border: none;
}
.crumb:hover { color: var(--ink); }
.crumb .arr { transition: transform 0.2s ease; }
.crumb:hover .arr { transform: translateX(-3px); }

.scenario-head {
  margin-bottom: 36px;
}
.scenario-head .sh-meta {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.scenario-head .sh-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}
.scenario-head .sh-domain {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-deep);
  padding: 4px 9px;
  border: 1px solid var(--accent);
  border-radius: 3px;
  background: var(--accent-soft);
}
.scenario-head .sh-target {
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  color: var(--ink-muted);
  letter-spacing: 0.04em;
}
.scenario-head h2 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: clamp(34px, 5vw, 56px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin-bottom: 14px;
}
.scenario-head h2 em {
  font-style: italic;
  color: var(--accent-deep);
}
.scenario-head .sh-tagline {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 21px;
  font-weight: 400;
  color: var(--ink-soft);
  line-height: 1.4;
  max-width: 720px;
}

/* ────────────────── TABS ────────────────── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 40px;
  flex-wrap: wrap;
}
.tab {
  background: none;
  border: none;
  padding: 14px 22px 14px 0;
  margin-right: 24px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--ink-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s ease, border-color 0.15s ease;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tab:hover { color: var(--ink); }
.tab.active {
  color: var(--ink);
  border-bottom-color: var(--ink);
  font-weight: 600;
}
.tab .tab-icon {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.05em;
  color: var(--accent);
  padding: 2px 7px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--paper-warm);
  text-transform: uppercase;
}
.tab.active .tab-icon { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.tab.locked { opacity: 0.4; cursor: not-allowed; }
.tab.locked:hover { color: var(--ink-muted); }

/* ────────────────── PANEL ────────────────── */
.panel {
  display: none;
  animation: fadeIn 0.25s ease;
}
.panel.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ────────────────── SIM CARD CONTENT ────────────────── */
.section-h {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent-deep);
  margin: 36px 0 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}
.section-h:first-child { margin-top: 0; }

.obj-list { list-style: none; padding: 0; }
.obj-list li {
  padding: 6px 0 6px 22px;
  position: relative;
  font-size: 15.5px;
  line-height: 1.55;
  color: var(--ink-soft);
}
.obj-list li:before {
  content: '◆';
  position: absolute;
  left: 0; top: 6px;
  color: var(--accent);
  font-size: 10px;
}

.brief-quote {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 18px;
  line-height: 1.45;
  color: var(--ink);
  padding: 14px 22px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  margin: 14px 0 6px;
}

.patient-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 14.5px;
}
.patient-table tr { border-bottom: 1px solid var(--rule-soft); }
.patient-table tr:last-child { border-bottom: none; }
.patient-table th {
  text-align: left;
  width: 30%;
  vertical-align: top;
  padding: 12px 14px 12px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.patient-table td {
  padding: 12px 0;
  color: var(--ink-soft);
  line-height: 1.55;
}

.script-list {
  list-style: none;
  padding: 0;
  margin-top: 6px;
}
.script-list li {
  padding: 8px 0 8px 22px;
  position: relative;
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-soft);
  border-bottom: 1px dashed var(--rule-soft);
}
.script-list li:last-child { border-bottom: none; }
.script-list li:before {
  content: '"';
  position: absolute;
  left: 0; top: 4px;
  font-family: 'Fraunces', serif;
  color: var(--accent);
  font-size: 22px;
  line-height: 1;
}

.trigger-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 14.5px;
}
.trigger-table th {
  text-align: left;
  padding: 10px 14px;
  background: var(--paper-warm);
  border: 1px solid var(--rule);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.trigger-table th:first-child { width: 22%; }
.trigger-table td {
  padding: 14px;
  border: 1px solid var(--rule);
  vertical-align: top;
  color: var(--ink-soft);
  line-height: 1.55;
  background: var(--paper);
}
.trigger-table td.when {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--accent-deep);
}

.actions-list {
  list-style: none;
  padding: 0;
  margin-top: 6px;
  counter-reset: act;
}
.actions-list li {
  padding: 8px 0 8px 32px;
  position: relative;
  counter-increment: act;
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-soft);
  border-bottom: 1px dashed var(--rule-soft);
}
.actions-list li:last-child { border-bottom: none; }
.actions-list li:before {
  content: counter(act, decimal-leading-zero);
  position: absolute;
  left: 0; top: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.04em;
}

/* Debrief blocks */
.debrief-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-top: 8px;
}
@media (max-width: 760px) { .debrief-grid { grid-template-columns: 1fr; } }
.debrief-block {
  background: var(--paper);
  padding: 22px 22px 20px;
}
.debrief-block h4 {
  font-family: 'Fraunces', serif;
  font-size: 19px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.debrief-block .timing {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.debrief-block p, .debrief-block li {
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-soft);
}
.debrief-block ol {
  padding-left: 22px;

const app = document.getElementById('app');
let facultyMode = false;
let activeTab = 'sim';

function getRoute() {
  const hash = window.location.hash.replace(/^#\/?/, '').trim();
  if (!hash) return { view: 'home' };
  const parts = hash.split('/');
  const n = parseInt(parts[0], 10);
  if (isNaN(n) || n < 1 || n > 12) return { view: 'home' };
  const tab = parts[1] || 'sim';
  return { view: 'scenario', n, tab };
}

function navigate(hash) {
  window.location.hash = hash;
}

function render() {
  const route = getRoute();
  if (route.view === 'home') {
    renderHome();
    document.getElementById('timer-toggle').classList.remove('visible');
  } else {
    renderScenario(route.n, route.tab);
    document.getElementById('timer-toggle').classList.add('visible');
  }
  window.scrollTo(0, 0);
}

// SBA PANEL
// ═══════════════════════════════════════════════════════════════

function renderSBAPanel(s) {
  const sba = s.sba;
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const optsHTML = sba.options.map((opt, i) => `
    <li class="sba-option" data-letter="${letters[i]}">
      <span class="letter">${letters[i]}</span>
      <span class="text">${opt}</span>
    </li>
  `).join('');
  const distractHTML = sba.distract.map(d => `<li>${d}</li>`).join('');

  return `
    <p class="sba-intro">A written reinforcement of today&rsquo;s scenario. Pick the best answer, then reveal the explanation.</p>
    <p class="sba-stem">${sba.stem}</p>
    <p class="sba-question">${sba.question}</p>
    <ul class="sba-options" id="sba-options">${optsHTML}</ul>

    <div class="sba-reveal">
      <button class="btn" id="sba-reveal-btn">Reveal answer &amp; explanation</button>
      <button class="btn ghost" id="sba-reset-btn" style="display:none;">Reset</button>
    </div>

    <div class="sba-explain" id="sba-explain">
      <div class="answer-stamp">
        <span class="lbl">Correct answer</span>
        <span class="val">${sba.answer}</span>
      </div>
      <h4>Why this is the answer</h4>
      <p>${sba.rationale}</p>
      <h4>Why not the others</h4>
      <ul class="sba-distract">${distractHTML}</ul>
      <div class="pearl"><span class="pearl-label">Pearl</span> ${sba.pearl}</div>
    </div>
  `;
}

function wireSBA() {
  const optsEl = document.getElementById('sba-options');
  const revealBtn = document.getElementById('sba-reveal-btn');
  const resetBtn = document.getElementById('sba-reset-btn');
  const explainEl = document.getElementById('sba-explain');
  if (!optsEl || !revealBtn) return;

  const route = getRoute();
  const s = SIMS[route.n - 1];
  if (!s) return;
  const correct = s.sba.answer;
  let picked = null;

  optsEl.querySelectorAll('.sba-option').forEach(opt => {
    opt.addEventListener('click', () => {
      if (opt.classList.contains('revealed')) return;
      optsEl.querySelectorAll('.sba-option').forEach(o => o.classList.remove('picked'));
      opt.classList.add('picked');
      picked = opt.dataset.letter;
    });
  });

  revealBtn.addEventListener('click', () => {
    optsEl.querySelectorAll('.sba-option').forEach(opt => {
      opt.classList.add('revealed');
      const l = opt.dataset.letter;
      if (l === correct) opt.classList.add('correct');
      else if (l === picked) opt.classList.add('wrong');
    });
    explainEl.classList.add('show');
    revealBtn.style.display = 'none';
    resetBtn.style.display = 'inline-flex';
  });

  resetBtn.addEventListener('click', () => {
    optsEl.querySelectorAll('.sba-option').forEach(opt => {
      opt.classList.remove('revealed', 'correct', 'wrong', 'picked');
    });
    explainEl.classList.remove('show');
    revealBtn.style.display = 'inline-flex';
    resetBtn.style.display = 'none';
    picked = null;
  });
}

// ═══════════════════════════════════════════════════════════════
// 10-MIN TIMER
// ═══════════════════════════════════════════════════════════════

const TIMER_TOTAL = 600; // 10 minutes in seconds
const PHASES = [
  { name: 'Pre-brief', start: 0,  end: 60 },
  { name: 'Run',        start: 60, end: 360 },
  { name: 'Debrief',    start: 360, end: 600 }
];

const timerToggle = document.getElementById('timer-toggle');
const timerPanel = document.getElementById('timer-panel');
const timerClose = document.getElementById('timer-close');
const timerValueEl = document.getElementById('timer-value');
const timerPhaseEl = document.getElementById('timer-phase');
const timerTTVal = document.getElementById('timer-tt-val');
const timerStartBtn = document.getElementById('timer-start');
const timerResetBtn = document.getElementById('timer-reset');
const timerBar = document.getElementById('timer-bar');

let timerState = { running: false, elapsed: 0, lastTick: 0, raf: null };

timerToggle.addEventListener('click', () => {
  timerPanel.classList.toggle('open');
});
timerClose.addEventListener('click', () => timerPanel.classList.remove('open'));

timerStartBtn.addEventListener('click', () => {
  if (timerState.running) {
    pauseTimer();
  } else {
    startTimer();
  }
});
timerResetBtn.addEventListener('click', resetTimer);

function startTimer() {
  if (timerState.elapsed >= TIMER_TOTAL) timerState.elapsed = 0;
  timerState.running = true;
  timerState.lastTick = performance.now();
  timerStartBtn.textContent = 'Pause';
  tick();
}
function pauseTimer() {
  timerState.running = false;
  if (timerState.raf) cancelAnimationFrame(timerState.raf);
  timerStartBtn.textContent = timerState.elapsed >= TIMER_TOTAL ? 'Done' : 'Resume';
}
function resetTimer() {
  timerState.running = false;
  if (timerState.raf) cancelAnimationFrame(timerState.raf);
  timerState.elapsed = 0;
  timerStartBtn.textContent = 'Start';
  updateTimerDisplay();
}
function tick() {
  if (!timerState.running) return;
  const now = performance.now();
  const dt = (now - timerState.lastTick) / 1000;
  timerState.lastTick = now;
  timerState.elapsed = Math.min(TIMER_TOTAL, timerState.elapsed + dt);
  updateTimerDisplay();
  if (timerState.elapsed >= TIMER_TOTAL) {
    timerState.running = false;
    timerStartBtn.textContent = 'Done';
    return;
  }
  timerState.raf = requestAnimationFrame(tick);
}
function updateTimerDisplay() {
  const remaining = Math.max(0, TIMER_TOTAL - timerState.elapsed);
  const mm = Math.floor(remaining / 60);
  const ss = Math.floor(remaining % 60);
  const txt = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  timerValueEl.textContent = txt;
  timerTTVal.textContent = txt;

  // Phase
  const e = timerState.elapsed;
  const phase = PHASES.find(p => e >= p.start && e < p.end) || PHASES[PHASES.length - 1];
  timerPhaseEl.textContent = e >= TIMER_TOTAL ? 'Complete' : phase.name;

  // Segments
  const segs = timerBar.querySelectorAll('.timer-segment');
  PHASES.forEach((p, i) => {
    const seg = segs[i];
    seg.classList.remove('complete', 'active');
    if (e >= p.end) {
      seg.classList.add('complete');
    } else if (e >= p.start) {
      seg.classList.add('active');
      const pct = Math.min(100, ((e - p.start) / (p.end - p.start)) * 100);
      seg.style.setProperty('--p', `${pct}%`);
    }
  });
}

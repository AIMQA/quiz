<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acute Medicine Team Quiz — MRCP(UK) SCE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/dist/msal-browser.min.js"></script>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --ink:#1a2332; --ink-2:#506074; --ink-3:#8c98a8;
  --line:#e3e8ef; --line-2:#cdd5e0; --accent:#0b5fae; --accent-h:#094a89;
  --good:#1a7f37; --good-bg:#e6f4ea; --bad:#c5272d; --bad-bg:#fbe9e9;
  --warn:#a05a00; --warn-bg:#fff3e0; --shadow:0 1px 2px rgba(15,30,55,.06),0 1px 3px rgba(15,30,55,.04);
  --radius:10px; --radius-sm:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{max-width:980px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:22px;font-weight:600;letter-spacing:-0.01em}
h2{font-size:18px;font-weight:600;margin-bottom:10px}
h3{font-size:15px;font-weight:600;margin-bottom:6px}
p{margin:0 0 8px}
small,.muted{color:var(--ink-2);font-size:13px}
.tiny{color:var(--ink-3);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid-2{grid-template-columns:1fr}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0b5fae,#1a7f37);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:0.5px}
.brand .title{font-weight:600}
.brand .sub{font-size:12px;color:var(--ink-2)}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:#fff;color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:border-color .12s}
input[type=text]:focus{border-color:var(--accent)}
label.field{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:#fff;color:var(--ink);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .12s;text-decoration:none}
.btn:hover:not(:disabled){background:#f6f8fb;border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover:not(:disabled){background:var(--bad-bg)}
.btn.sm{padding:6px 10px;font-size:13px}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f0f3f7;padding:2px 6px;border-radius:4px;font-size:13px;color:var(--ink)}
.banner{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:#f0c98c;color:var(--warn)}
.banner.good{background:var(--good-bg);border-color:#a8d4b3;color:var(--good)}
.banner.bad{background:var(--bad-bg);border-color:#e8a3a6;color:var(--bad)}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;background:#f6f8fb;border-radius:var(--radius)}
.qr-wrap .room-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:28px;letter-spacing:4px;font-weight:600;color:var(--accent)}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:600;font-size:18px;padding:6px 12px;border-radius:var(--radius-sm);background:#f0f3f7;color:var(--ink)}
.timer.urgent{background:var(--bad-bg);color:var(--bad)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:all .12s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent);background:#f0f6fc}
.opt.selected{border-color:var(--accent);background:#e7f0fa;font-weight:500}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.incorrect{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt .letter{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;font-weight:600;background:#f0f3f7;border-radius:50%;margin-right:10px;font-size:12px}
.opt.selected .letter{background:var(--accent);color:#fff}
.opt.correct .letter{background:var(--good);color:#fff}
.opt.incorrect .letter{background:var(--bad);color:#fff}
.stem{font-size:15px;line-height:1.6;margin-bottom:14px;white-space:pre-wrap}
.stem-img{max-width:100%;max-height:300px;border-radius:var(--radius-sm);border:1px solid var(--line);margin:10px 0;display:block;background:#fff}
.specialty-tag{display:inline-block;padding:3px 10px;background:#eef2f7;color:var(--ink-2);border-radius:999px;font-size:12px;font-weight:500;margin-bottom:10px}
.leaderboard{list-style:none}
.leaderboard li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.leaderboard li:last-child{border-bottom:0}
.leaderboard .pos{font-weight:600;color:var(--ink-2);width:30px}
.leaderboard .name{flex:1;font-weight:500}
.leaderboard .score{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
.leaderboard li.you{background:#e7f0fa}
.dist-bar{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.dist-bar .bar{flex:1;height:6px;background:#eef2f7;border-radius:3px;overflow:hidden}
.dist-bar .fill{height:100%;background:var(--accent);transition:width .3s}
.dist-bar .fill.correct{background:var(--good)}
.explanation{padding:14px;background:#f6f8fb;border-left:3px solid var(--accent);border-radius:var(--radius-sm);font-size:14px;line-height:1.6;margin-top:12px;white-space:pre-wrap}
.references{margin-top:10px;padding:10px 12px;background:#fff;border:1px solid #e2e6ec;border-radius:var(--radius-sm);font-size:13px}
.references strong{display:block;color:var(--text-soft);margin-bottom:6px;font-size:12px;text-transform:uppercase;letter-spacing:0.5px}
.references ul{margin:0;padding:0;list-style:none}
.references li{padding:3px 0;line-height:1.4}
.references a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.references a:hover{background:#eef3fb}
.references a:after{content:" ↗";font-size:10px;opacity:0.6}
.image-caption{font-size:11px;color:var(--text-soft);text-align:center;margin-top:4px;font-style:italic}
.setup-steps{counter-reset:step}
.setup-steps li{counter-increment:step;list-style:none;position:relative;padding:8px 0 8px 36px;font-size:14px;color:var(--ink)}
.setup-steps li::before{content:counter(step);position:absolute;left:0;top:8px;width:24px;height:24px;line-height:24px;text-align:center;background:var(--accent);color:#fff;border-radius:50%;font-weight:600;font-size:12px}
pre.config{background:#1a2332;color:#e3e8ef;padding:14px;border-radius:var(--radius-sm);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.5;overflow-x:auto;margin:10px 0}
.players-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#eef2f7;border-radius:999px;font-size:12px;color:var(--ink-2);margin:2px}
.divider{height:1px;background:var(--line);margin:16px 0}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #cdd5e0;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fade .3s ease}

/* ───────── FIT-ON-ONE-SCREEN QUESTION LAYOUT ─────────
   When showing a live question, lock the layout to viewport
   height so header (timer) and options always remain visible.
   The stem is the only element allowed to scroll internally
   in the unusual case it overflows. */
body.qmode{overflow:hidden;height:100vh}
body.qmode .container{height:100vh;display:flex;flex-direction:column;padding-top:8px;padding-bottom:8px}
body.qmode .brand-bar{flex-shrink:0;margin-bottom:8px}
.q-card{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:14px 18px;margin-bottom:0}
.q-card .qhead{flex-shrink:0;margin-bottom:6px}
.q-card .qhead .specialty-tag{margin-bottom:4px}
.q-card .qbody{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:stretch}
.q-card .stem-pane{min-height:0;overflow-y:auto;padding-right:8px;display:flex;flex-direction:column}
.q-card .stem-pane::-webkit-scrollbar{width:6px}
.q-card .stem-pane::-webkit-scrollbar-thumb{background:#cdd5e0;border-radius:3px}
.q-card .stem{font-size:14.5px;line-height:1.55;margin-bottom:10px;white-space:pre-wrap}
.q-card .stem-img{max-width:100%;max-height:32vh;object-fit:contain;border-radius:var(--radius-sm);border:1px solid var(--line);margin:8px 0;display:block;background:#fff}
.q-card .options-pane{display:flex;flex-direction:column;justify-content:center;min-height:0}
.q-card .opt{padding:11px 13px;font-size:14px;margin-bottom:7px}
.q-card .qfoot{flex-shrink:0;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px}

@media (max-width: 900px) {
  .q-card .qbody{grid-template-columns:1fr;gap:10px}
  .q-card .options-pane{justify-content:flex-start}
  .q-card .stem{font-size:14px;line-height:1.45}
  .q-card .opt{padding:9px 11px;font-size:13.5px;margin-bottom:5px}
  .q-card .stem-img{max-height:22vh}
}

@media (max-height: 700px) {
  .q-card .stem{font-size:13.5px;line-height:1.45}
  .q-card .opt{padding:9px 12px;font-size:13.5px;margin-bottom:5px}
  .q-card .stem-img{max-height:24vh}
}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
table.coverage{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.coverage th,table.coverage td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.coverage th{font-weight:600;color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:0.04em}
table.coverage td.num{text-align:right;font-variant-numeric:tabular-nums}
table.coverage tr:last-child td{border-bottom:0}
table.coverage tr.total{background:#f6f8fb;font-weight:600}
.cov-bar{display:inline-block;vertical-align:middle;width:80px;height:6px;background:#eef2f7;border-radius:3px;overflow:hidden;margin-right:8px}
.cov-bar .fill{display:block;height:100%;background:var(--accent);transition:width .3s}
.cov-bar .fill.full{background:var(--good)}
details summary{cursor:pointer;font-weight:500;color:var(--accent);padding:6px 0;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸ ';transition:transform .15s}
details[open] summary::before{content:'▾ '}

/* ───────── LANDING PAGE EDITORIAL STYLING ─────────
   Scoped to body.landing so other screens (question, reveal,
   leaderboard) retain their current functional design. */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&display=swap');

body.landing { 
  background: #F7F3EA;
  background-image: 
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(74, 110, 93, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 100% 100%, rgba(180, 83, 9, 0.04) 0%, transparent 50%);
}
body.landing #root { max-width: 880px; margin: 0 auto; padding: 32px 24px 48px; }

.l-hero { text-align: center; padding: 24px 0 40px; }
.l-hero .l-date {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #5A6B7E;
  text-transform: uppercase;
  margin-bottom: 18px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.l-hero .l-date::before, .l-hero .l-date::after {
  content: '';
  width: 32px;
  height: 1px;
  background: #4A6E5D;
  display: inline-block;
}
.l-hero h1 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: clamp(36px, 6vw, 56px);
  line-height: 1.0;
  letter-spacing: -0.025em;
  color: #0F1F2E;
  margin: 0 0 14px;
}
.l-hero h1 em {
  font-style: italic;
  font-variation-settings: 'opsz' 144, 'SOFT' 100;
  color: #2F4A3D;
}
.l-hero .l-sub {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 16px;
  color: #2C3E50;
  max-width: 540px;
  margin: 0 auto;
  line-height: 1.55;
}

.l-modes { display: grid; gap: 18px; margin-bottom: 32px; }
@media (min-width: 720px) { .l-modes { grid-template-columns: 1fr 1fr; } }

.l-mode {
  background: #fff;
  border: 1px solid #D6CFBF;
  border-radius: 8px;
  padding: 28px 26px;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  box-shadow: 0 1px 2px rgba(15, 31, 46, 0.04);
}
.l-mode:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(15, 31, 46, 0.08);
  border-color: #B8AC8E;
}
.l-mode.l-mode-feature {
  background: linear-gradient(135deg, #fff 0%, #F7F3EA 100%);
  border-color: #4A6E5D;
  border-left: 3px solid #4A6E5D;
}
@media (min-width: 720px) {
  .l-mode.l-mode-feature { grid-column: 1 / -1; flex-direction: row; gap: 24px; align-items: stretch; }
  .l-mode.l-mode-feature .l-mode-text { flex: 1.4; }
  .l-mode.l-mode-feature .l-mode-input-group { flex: 1; display: flex; flex-direction: column; justify-content: center; }
}

.l-mode-num {
  font-family: 'DM Sans', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: #5A6B7E;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.l-mode-num .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #4A6E5D;
  margin-right: 8px;
  vertical-align: middle;
}
.l-mode-feature .l-mode-num .dot { background: #B45309; }

.l-mode h2 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 26px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: #0F1F2E;
  margin: 0 0 8px;
}
.l-mode p {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  color: #5A6B7E;
  margin: 0 0 16px;
  flex: 1;
}
.l-mode .l-tag {
  position: absolute;
  top: 24px; right: 24px;
  font-family: 'DM Sans', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: #5A6B7E;
  text-transform: uppercase;
  background: rgba(74, 110, 93, 0.08);
  padding: 3px 8px;
  border-radius: 3px;
}
.l-mode-feature .l-tag {
  background: rgba(180, 83, 9, 0.08);
  color: #B45309;
}

.l-mode .l-input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #D6CFBF;
  border-radius: 5px;
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 14px;
  background: #fff;
  margin-bottom: 12px;
  transition: border-color 0.15s ease;
  box-sizing: border-box;
}
.l-mode .l-input:focus { outline: none; border-color: #4A6E5D; }

.l-mode .l-input-label {
  font-family: 'DM Sans', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: #5A6B7E;
  text-transform: uppercase;
  margin-bottom: 6px;
  display: block;
}

.l-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 22px;
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.01em;
  text-decoration: none;
  border-radius: 5px;
  border: 1.5px solid #0F1F2E;
  cursor: pointer;
  transition: all 0.15s ease;
  background: transparent;
  color: #0F1F2E;
  width: 100%;
}
.l-btn:hover {
  background: #0F1F2E;
  color: #F7F3EA;
}
.l-btn-primary {
  background: #4A6E5D;
  color: #fff;
  border-color: #4A6E5D;
}
.l-btn-primary:hover {
  background: #2F4A3D;
  border-color: #2F4A3D;
}
.l-btn-arrow { transition: transform 0.15s ease; }
.l-btn:hover .l-btn-arrow { transform: translateX(3px); }

.l-stats {
  background: rgba(255,255,255,0.5);
  border: 1px solid #D6CFBF;
  border-radius: 6px;
  padding: 18px 22px;
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 13px;
  color: #5A6B7E;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.l-stats strong { color: #0F1F2E; font-weight: 600; }
.l-stats .l-coverage-link {
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #4A6E5D;
  text-decoration: none;
}
</style>

    LISTENERS[path] = unsub;
    return () => { unsub(); delete LISTENERS[path]; };
  }
};

  {section:"cardiovascular", specialty:"Cardiology", topic:"Inferior STEMI with RV involvement",
   stem:"A 68-year-old man presents with 2 hours of central crushing chest pain. ECG: 3 mm ST elevation in leads II, III and aVF with reciprocal ST depression in I and aVL. Right-sided ECG: ST elevation in V4R. BP 86/54 mmHg, JVP elevated, lungs clear. He has been loaded with aspirin 300 mg.\n\nWhich is the most appropriate next step?",

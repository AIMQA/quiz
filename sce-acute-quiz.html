   explanation:"STUDY DESIGNS in MEDICAL RESEARCH — choosing the right design balances research question, feasibility, ethics, cost, time, and validity. ECOLOGICAL STUDY — uses POPULATION-LEVEL data (groups, regions, countries) rather than individual data; correlates exposures and outcomes at population level; HYPOTHESIS-GENERATING; subject to ECOLOGICAL FALLACY (population-level associations may not apply at individual level); examples — geographical comparisons of disease rates and exposures. Cohort better (concentrate exposed people). (2) Is the OUTCOME RARE? PROSPECTIVE COHORT would be impractical given the long latency (20-30 years) and rarity of the outcome (would need to follow huge populations for decades).\n\n(A) Cross-sectional: doesn't establish temporality; cannot study rare outcomes well.\n\n(C) Prospective cohort: impractical for very rare outcomes with long latency — would need millions of years of person-time; expensive, slow.\n\n(D) RCT: cannot ETHICALLY randomise people to harmful exposure; impractical for rare outcomes; not suited to occupational exposure questions.\n\n(E) Ecological: population-level only; subject to ecological fallacy; cannot establish individual-level association for these rare conditions.\n\n💎 PEARL: Rare exposure + rare outcome + limited time / funds = case-control study (start with cases and controls, look back at exposure — efficient for both). Cohort is better when exposure is rare. Cross-sectional measures prevalence not incidence. RCT is gold standard for intervention effects but unethical/impractical for harms.",
   references:[{label:"Cochrane Handbook — Study Design Chapter", url:"https://training.cochrane.org/handbook"},{label:"BMJ Best Practice — Epidemiology", url:"https://bestpractice.bmj.com/info/toolkit/learn-ebm/"}]},

  {section:"other", specialty:"Statistics", topic:"Number needed to harm calculation",
   stem:"In a randomised controlled trial of a new biologic agent for moderate-to-severe psoriasis, 4% of treated patients develop a serious infection requiring hospitalisation over 1 year, compared with 1% of those receiving placebo. The trial reported a clinically meaningful PASI-75 response in 60% of treated vs 5% of placebo patients. Approximately how many people need to be treated for 1 year for one additional serious infection to occur (number needed to harm)?",
   options:["3","30","33","100","300"],
   correct:"C",
   explanation:"NUMBER NEEDED TO HARM (NNH): a key measure of risk in clinical trials, mirroring the more familiar NNT (number needed to treat for benefit). FORMULAE: ABSOLUTE RISK INCREASE (ARI) = risk in treatment group − risk in control group; NNH = 1 / ARI. INTERPRETATION: 33 patients need to receive the biologic for 1 year for 1 additional serious infection to occur (compared with placebo). LIMITATIONS: depends on baseline risk (may not generalise across populations); time-dependent (NNT/NNH at 1 year vs 5 years differs); event rates may differ in real-world populations vs trial.\n\n(A) 3: would be NNH if 100% − 67% absolute increase — wrong.\n\n(B) 30: close but inaccurate; precise calculation = 33.\n\n(D) 100: would be 1% absolute increase — wrong.\n\n(E) 300: would be 0.33% absolute increase — wrong.\n\n💎 PEARL: NNH = 1 / absolute risk increase. 4% − 1% = 3% ARI → NNH 33. Compare against the NNT (here ~2 for PASI-75 response — clear net benefit). Both NNT and NNH depend on baseline risk and time-frame; quote them together when discussing a treatment with patients.",
   references:[{label:"BMJ — How to calculate NNT/NNH", url:"https://www.bmj.com/content/318/7197/1492"},{label:"Cochrane Handbook — Effect measures", url:"https://training.cochrane.org/handbook"}]},

  {section:"other", specialty:"Ethics", topic:"Confidentiality and DVLA reporting",
   stem:"A 65-year-old taxi driver has had a witnessed first generalised tonic-clonic seizure. He has full mental capacity. The medical team explains he must inform the DVLA and stop driving immediately (group 2 licence requires 5 years seizure-free off medication for reinstatement). He refuses, saying his livelihood depends on driving and he will not inform the DVLA, and continues to plan to work that evening.\n\nWhich is the most appropriate course of action?",
   options:["Continued counselling, document discussion, give him opportunity to inform DVLA himself; if he persists in driving, inform him you will report, then notify dvla's medical adviser",
"Inform the DVLA immediately without telling the patient",
"Take no action — confidentiality is absolute",
"Inform his employer (the taxi company) directly",
"Detain him under the Mental Health Act"],
   correct:"A",
   explanation:"GMC CONFIDENTIALITY guidance (2017, updated): doctor-patient confidentiality is fundamental but NOT ABSOLUTE. Disclosure WITHOUT consent is justified when failure to disclose may expose others to a RISK OF DEATH OR SERIOUS HARM. DVLA STANDARDS for FITNESS TO DRIVE (Assessing Fitness to Drive — 'At a Glance Guide'): GROUP 1 (cars / motorcycles, ordinary licence): single seizure — 6 months off driving; epilepsy diagnosis (recurrent seizures) — 12 months seizure-free required to drive; medication withdrawal — 6 months off driving while withdrawing and 6 months after if seizure-free. Specific advice for many other conditions.\n\n(B) Reporting without telling the patient is unprofessional and breaches trust where reasonable counselling has not been attempted.\n\n(C) Confidentiality is NOT absolute — overriding public interest can require disclosure.\n\n(D) Telling the employer is INAPPROPRIATE — disclosure should be to DVLA only via medical channel; employer disclosure breaches confidentiality unjustifiably.\n\n(E) Mental Health Act inappropriate — patient has full capacity, no mental disorder, no detention criteria.\n\n💎 PEARL: GMC: confidentiality is fundamental but NOT absolute. Disclose without consent if failure to disclose risks death or serious harm. Counsel and document, give the patient the chance to inform DVLA themselves; if they continue to drive, warn them and notify DVLA's medical adviser. Single seizure = 6 months off Group 1, 12 months off Group 2 (Group 2 single seizure rule may differ — check current DVLA).",
   references:[{label:"DVLA Assessing Fitness to Drive (medical professionals' guide)", url:"https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals"},{label:"GMC Confidentiality Guidance (2017)", url:"https://www.gmc-uk.org/professional-standards/professional-standards-for-doctors/confidentiality"}]},

  {section:"other", specialty:"Ethics", topic:"Best interests decision under the Mental Capacity Act",
   stem:"An 80-year-old woman with severe alzheimer's dementia has lost capacity (assessed by the responsible clinician using the 4-step MCA test — diagnostic + understanding / retaining / weighing / communicating). She has no advance decision to refuse treatment, no Lasting Power of Attorney for health and welfare, and no close family or friends willing to be consulted. She has gangrenous ischaemia of the right foot and needs a major decision about whether to undergo below-knee amputation (surgical opinion: amputation is life-saving but radically alters quality of life; conservative care leads to death within weeks).\n\nWhich is the most appropriate next step?",
   options:["The on-call consultant decides alone",
"Refer to and consult an independent mental capacity advocate (IMCA); the responsible clinician then makes a best-interests decision per the MCA 2005 framework",
"Defer the decision indefinitely",
"Refer to the Court of Protection routinely",
"Two doctors sign a Deprivation of Liberty Safeguards (dols) authorisation"],
   correct:"B",
   explanation:"MENTAL CAPACITY ACT (MCA) 2005: governs decision-making for people aged 16+ who lack capacity in England and Wales. CAPACITY ASSESSMENT — DECISION-SPECIFIC and TIME-SPECIFIC: TWO-STAGE TEST: STAGE 1 (DIAGNOSTIC): does the person have an impairment or disturbance of brain / mind (dementia, learning disability, brain injury, psychosis, intoxication, severe illness)? STAGE 2 (FUNCTIONAL): can the person UNDERSTAND the relevant information; RETAIN the information long enough to use it; USE / WEIGH the information as part of the decision; COMMUNICATE the decision (any means)? Document carefully. LPAs must be REGISTERED with the Office of the Public Guardian.\n\n(A) Consultant deciding alone without IMCA breaches statutory duty — IMCA is mandatory for unbefriended patients facing serious medical treatment.\n\n(C) Indefinite deferral inappropriate — gangrene needs timely decision.\n\n(D) Court of Protection rarely needed — MCA framework handles most decisions; reserve for genuine disputes.\n\n(E) DOLS is for deprivation of liberty (eg. preventing leaving) — not for medical treatment decisions; different mechanism.\n\n💎 PEARL: Lacks capacity + serious medical decision (amputation, ceiling of care, change of accommodation) + no family/friend/LPA → instruct an Independent Mental Capacity Advocate (IMCA). The clinician still makes the best-interests decision; the IMCA represents the unbefriended patient's perspective.",
   references:[{label:"Mental Capacity Act 2005 Code of Practice", url:"https://www.gov.uk/government/publications/mental-capacity-act-code-of-practice"},{label:"NICE NG108 — Decision-making and mental capacity", url:"https://www.nice.org.uk/guidance/ng108"}]},

  {section:"other", specialty:"Patient Safety", topic:"Never events — wrong-route chemotherapy",
   stem:"A patient on the haematology ward receives an overdose of intrathecal vincristine in error (vincristine should only ever be given intravenously — intrathecal vincristine is uniformly fatal due to demyelination). The patient subsequently dies. The error is recognised within hours but no antidote exists. Which classification best describes this incident?",
   options:["A near miss",
"A 'never event' — must be reported nationally, trigger Patient Safety Incident Investigation, full duty of candour, systemic learning",
"Routine drug error — local reporting only",
"Acceptable complication of chemotherapy",
"An adverse event, but not formally reportable"],
   correct:"B",
   explanation:"NEVER EVENTS: serious, largely PREVENTABLE patient safety incidents that should NOT occur if available preventative measures have been implemented (NHS England NEVER EVENTS LIST — updated periodically; current list contains ~15 specified events). MANAGEMENT of a NEVER EVENT: (1) IMMEDIATE care for the patient — clinical management of error / harm;\n(2) DUTY OF CANDOUR — open disclosure to patient (or family if death/inability) within 10 working days, sincere apology, true factual account, explanation, follow-up in writing, support; mandatory under Health and Social Care Act 2008 / Regulation 20 of Care Quality Commission regulations; criminal offence to fail.\n\n(A) Near miss: incident that COULD have caused harm but was intercepted before reaching patient — different category.\n\n(C) 'Local reporting only' inappropriate for never event.\n\n(D) NOT acceptable complication — fatal medication error preventable by systems.\n\n(E) NOT 'just an adverse event' — meets criteria for never event.\n\n💎 PEARL: Intrathecal vincristine = uniformly fatal, no antidote. Wrong-route chemo is on the NHS England Never Events list. Triggers Patient Safety Incident Investigation under PSIRF, full duty of candour, and systemic learning. Designed-out by NPSA double-check protocols and dedicated sleeve packaging.",
   references:[{label:"NHS England Never Events List (2018, current)", url:"https://www.england.nhs.uk/patient-safety/patient-safety-insight/never-events/"}]},

  {section:"other", specialty:"Patient Safety", topic:"Swiss cheese model — error analysis",
   stem:"A serious medication error reaches a patient despite multiple safeguards in the medication system: electronic prescribing (failed because the prescribing protocol allowed an unusual dose to be approved with override); pharmacy dispensing checks (busy day, junior pharmacist did not catch the dose); ward check by nurse (newly qualified, did not query); administration check (single nurse, unfamiliar with drug). Investigation reveals each defensive layer failed for a different reason — staffing, training, fatigue, IT design. Which systems-thinking framework best describes how this error reached the patient?",
   options:["Person approach (focus on individual culpability)",
"Reason's swiss cheese model of organisational accidents — alignment of latent and active failures across multiple defensive layers; systems improvement focus",
"Just culture",
"Black-box thinking",
"Hindsight bias"],
   correct:"B",
   explanation:"JAMES REASON'S SWISS CHEESE MODEL OF ORGANISATIONAL ACCIDENTS (1990): foundational human-factors model in patient safety. CORE CONCEPT — defensive layers in any system have HOLES (failures, weaknesses, gaps). Layered defences typically include: training / education / competency, equipment design (forcing functions, lock-outs), procedures / protocols, double-checks, electronic systems, supervision, audit, leadership. SHARP-END individuals usually try to do the right thing within the constraints provided. RARELY a single error / individual; usually CASCADES of multiple weaknesses. INVESTIGATION TOOLS: ROOT CAUSE ANALYSIS (RCA — five whys); FISHBONE / Ishikawa diagram; AcciMap; Healthcare Failure Mode and Effect Analysis (HFMEA); SEIPS analysis.\n\n(A) Person approach is the OPPOSITE — counterproductive; modern safety science rejects in favour of systems approach.\n\n(C) Just culture is COMPLEMENTARY but doesn't describe how the error reached the patient — describes accountability framework.\n\n(D) Black-box thinking (Matthew Syed) — borrowed from aviation, encourages learning from failure; related but not the specific descriptive model.\n\n(E) Hindsight bias — cognitive bias where outcome influences perception of foreseeability; relevant but not descriptive of accident causation.\n\n💎 PEARL: Reason's Swiss Cheese model: defensive layers all have holes; serious harm occurs when holes align. Look for LATENT system failures (staffing, training, design, protocol gaps) not just the sharp-end individual. Investigation: human-factors framework, system fixes — not blame.",
   references:[{label:"Reason — Human Error and Organisational Accidents (BMJ 2000)", url:"https://www.bmj.com/content/320/7237/768"},{label:"NHS England — Patient Safety Incident Response Framework (PSIRF, 2022)", url:"https://www.england.nhs.uk/patient-safety/patient-safety-incident-response-framework/"}]},

  {section:"other", specialty:"Psychiatry", topic:"Mental Health Act — Section 5(2) holding power",
   stem:"An informal voluntary medical inpatient on the AMU is admitted with severe pneumonia and is acutely psychotic (auditory hallucinations, paranoid delusions, suicidal ideation). He becomes increasingly distressed, attempts to leave the ward to harm himself, and refuses to stay or accept psychiatric review. The on-call medical registrar (in charge of his care) wants to detain him to await formal Mental Health Act assessment by the duty psychiatrist and Approved Mental Health Practitioner (AMHP) team.\n\nWhich is the most appropriate Mental Health Act section?",
   options:["Section 2 — formal assessment, 28 days, requires AMHP and 2 doctors",
"Section 5(2) — doctor's holding power, up to 72 hours, used by the doctor in charge of an informal inpatient pending formal mha assessment",
"Section 3 — treatment, 6 months",
"Section 136 — police power, public place",
"Common law restraint indefinitely"],
   correct:"B",
   explanation:"MENTAL HEALTH ACT (MHA) 1983 (amended 2007) — provides legal framework for detention and treatment of people with mental disorder where consent / voluntary engagement not possible. SECTION 5(4) — NURSE'S HOLDING POWER: 6 hours; applied by qualified mental health / learning disability nurse; for emergency situations where doctor not immediately available; less commonly used.\n\n(A) Section 2 requires AMHP + 2 doctors — not immediately available; not appropriate for immediate detention.\n\n(C) Section 3 same paperwork requirement; not for emergencies.\n\n(D) Section 136 is for police use in public place — not appropriate when patient is already an inpatient.\n\n(E) Common law allows restraint to prevent immediate harm but is not a formal long-term detention authority — should immediately move to MHA / MCA framework as appropriate.\n\n💎 PEARL: Section 5(2) — doctor's holding power up to 72 hours, applied by the doctor in charge of an INFORMAL inpatient awaiting MHA assessment. Section 5(4) is the nurse's 6-hour holding power. Section 2 (28-day assessment) and Section 3 (6-month treatment) need AMHP + 2 doctors. Section 136 is for police use in public places.",
   references:[{label:"Mental Health Act 1983 Code of Practice (2015)", url:"https://www.gov.uk/government/publications/code-of-practice-mental-health-act-1983"}]},

  {section:"other", specialty:"Psychiatry", topic:"Delirium tremens — alcohol withdrawal management",
   stem:"A 50-year-old man with chronic alcohol misuse (drinks ~30 units/day for 10 years) is admitted with pneumonia and stops drinking abruptly (no alcohol on admission, no withdrawal regimen prescribed at first). Forty-eight hours later he develops profuse tremor, autonomic hyperactivity (sweating, tachycardia, hypertension), severe agitation, vivid visual hallucinations of small animals (zoopsia / 'Lilliputian' — characteristic), disorientation (does not know date / location), one witnessed grand mal seizure. T 38.3°C, HR 124, BP 168/96, glucose 4.2, normal Na, Mg 0.55 (low), K 3.2 (low). Ciwa-ar score 22 (severe).\n\nWhich is the most appropriate management?",
   options:["Reassurance and observation only",
"IV pabrinex (high-potency thiamine) before any glucose; benzodiazepine (chlordiazepoxide / IV lorazepam); fluid + electrolyte replacement; ICU referral if severe",
"IV haloperidol alone",
"IV glucose first to correct presumed hypoglycaemia",
"SSRI antidepressant"],
   correct:"B",
   explanation:"DELIRIUM TREMENS (DTs): the most severe form of alcohol withdrawal; medical EMERGENCY with mortality up to 5-15% if untreated. \n\nMANAGEMENT: (1) THIAMINE FIRST — Pabrinex (high-potency vitamin B+C) 2 ampoules of pair 1 + 2 in 50-100 mL 0.9% saline over 30 minutes IV, 3 TIMES DAILY for 3-5 days minimum (maximum 2 weeks); CRITICAL — give BEFORE ANY GLUCOSE (giving glucose first depletes already low thiamine → acute Wernicke encephalopathy; classic test trap); risk of anaphylaxis low but possible — give in resuscitative environment; observe for 30 minutes.\n\n(A) Reassurance / observation alone risks death — DTs is medical emergency.\n\n(C) Haloperidol alone inadequate (lowers seizure threshold; doesn't address withdrawal mechanism).\n\n(D) Glucose first WITHOUT thiamine = WERNICKE — classic teaching error.\n\n(E) SSRI not relevant in acute withdrawal.\n\n💎 PEARL: Heavy chronic alcohol + abrupt cessation + 48–72 h + tremor + autonomic hyperactivity + zoopsia/Lilliputian visual hallucinations + disorientation + seizures = delirium tremens. Pabrinex BEFORE any glucose (glucose first triggers acute Wernicke). Benzodiazepines (chlordiazepoxide), fluids, electrolytes, ICU if severe.",
   references:[{label:"NICE CG100 — Alcohol-use disorders: physical complications (2010, updated)", url:"https://www.nice.org.uk/guidance/cg100"},{label:"NICE CG115 — Alcohol-use disorders: harmful drinking and dependence", url:"https://www.nice.org.uk/guidance/cg115"}]},

  {section:"other", specialty:"Genetics", topic:"BRCA1/2 — hereditary breast/ovarian cancer",
   stem:"A 40-year-old woman has a striking family history: her mother and maternal aunt both had ovarian cancer in their forties; a maternal cousin had breast cancer aged 35. She undergoes genetic counselling and testing — found to carry a pathogenic BRCA1 mutation (deleterious frame-shift, exon 11). She has one sister and two daughters (ages 16 and 18). She has no current cancer; recent breast / pelvic ultrasound and CA-125 normal.\n\nWhich is the most appropriate next step?",
   options:["No specific intervention required — observe yearly",
"Discuss multidisciplinary risk-reducing strategy: enhanced surveillance, risk-reducing salpingo-oophorectomy from age 35-40, risk-reducing mastectomy as option, cascade testing of relatives",
"Risk applies only to ovarian cancer",
"BRCA1 is recessive — daughters not at risk",
"No family screening required"],
   correct:"B",
   explanation:"BRCA1 / BRCA2 GENES: tumour suppressor genes located on chromosomes 17q21 (BRCA1) and 13q12 (BRCA2); function in DNA double-strand break repair (homologous recombination); LOSS OF FUNCTION mutations confer high-penetrance susceptibility to breast / ovarian / other cancers. MANAGEMENT options for asymptomatic BRCA carriers — TAILORED MULTIDISCIPLINARY approach: (1) ENHANCED SURVEILLANCE: BREAST — annual MRI plus mammography from age 30 (MRI more sensitive in dense premenopausal breast tissue) until 50, then mammography; clinical breast examination; some centres offer ultrasound. (3) CHEMOPREVENTION — TAMOXIFEN for 5 years reduces breast cancer risk in high-risk women; ANASTROZOLE (postmenopausal); modest evidence in BRCA.\n\n(A) No intervention loses opportunity for prevention.\n\n(C) BRCA1 increases BOTH breast AND ovarian (and other) cancer risks.\n\n(D) BRCA is AUTOSOMAL DOMINANT — daughters at 50% risk regardless of unaffected father.\n\n(E) Family screening (cascade testing) is central to BRCA management.\n\n💎 PEARL: Pathogenic BRCA1 mutation: lifetime breast cancer risk ~70%, ovarian ~40%. Multidisciplinary management — enhanced surveillance (annual MRI + mammo from 30), risk-reducing salpingo-oophorectomy from 35–40, optional risk-reducing mastectomy, cascade testing of first-degree relatives, PARP inhibitors if cancer arises.",
   references:[{label:"NICE CG164 — Familial breast cancer (2013, updated 2023)", url:"https://www.nice.org.uk/guidance/cg164"}]},

  {section:"other", specialty:"Genetics", topic:"Long QT syndrome — LQT1 (KCNQ1)",
   stem:"A 17-year-old girl had an unexplained syncopal episode while swimming (witnessed by friends; collapsed mid-stroke, brief loss of consciousness with rapid recovery; no postictal phase, no tongue-biting, no incontinence, no aura). She has had two prior near-syncopes during exertion. Family history: maternal uncle sudden cardiac death age 35. ECG today: prolonged QTc 510 ms (normal <450 women, <440 men). Electrolytes normal; not on QT-prolonging drugs.\n\nWhich is the most appropriate management?",
   options:["Reassurance only — no intervention",
"Beta-blocker (e.g. Nadolol or propranolol); avoid QT-prolonging drugs and competitive swimming; consider ICD if recurrent syncope on therapy / cardiac arrest survivor; cascade family screening",
"Pacemaker only",
"Verapamil",
"Long-term anticoagulation"],
   correct:"B",
   explanation:"CONGENITAL LONG QT SYNDROME (LQTS): inherited cardiac channelopathy with prolonged QT interval and predisposition to POLYMORPHIC VENTRICULAR TACHYCARDIA — particularly TORSADES DE POINTES (TdP); can cause syncope, cardiac arrest, sudden death. \n\nDIAGNOSIS: SCHWARTZ SCORE — clinical / ECG / family history weighted score; ≥3.5 = high probability LQTS. MANAGEMENT — RISK-STRATIFIED, multidisciplinary cardiology / electrophysiology: (1) BETA-BLOCKER for ALL clinically affected (and most genotype positive even if asymptomatic, especially LQT1, LQT2): NADOLOL preferred (long half-life, good evidence) or PROPRANOLOL; first-line evidence-based therapy; reduces sudden death by ~50-80%. LIFELONG specialist follow-up.\n\n(A) Reassurance alone misses opportunity to prevent SCD.\n\n(C) Pacemaker alone doesn't prevent VT — ICD for primary / secondary prevention.\n\n(D) Verapamil non-selective; not first-line; can prolong QT.\n\n(E) Anticoagulation no role here (different from atrial arrhythmias).\n\n💎 PEARL: Young person + exertional or aquatic syncope + family history of unexplained sudden death + QTc >450 (women) / >440 (men) + KCNQ1 mutation = LQT1. Beta-blocker (nadolol or propranolol) for ALL clinically affected — avoid QT-prolonging drugs and competitive swimming (LQT1 trigger). ICD if syncope on therapy or aborted arrest.",
   references:[{label:"ESC 2022 Ventricular Arrhythmias and SCD Guidelines", url:"https://academic.oup.com/eurheartj/article/43/40/3997/6675633"},{label:"CredibleMeds list (QT-prolonging drugs)", url:"https://www.crediblemeds.org/"}]},

  {section:"other", specialty:"Genetics", topic:"Hereditary haemochromatosis (HFE C282Y)",
   stem:"A 50-year-old man presents with 12 months of fatigue, polyarthralgia particularly in the second and third metacarpophalangeal joints (chronic, mechanical pain — characteristic), and noticeable bronze / greyish skin pigmentation (especially face / hands), new erectile dysfunction (low libido — hypogonadism). Examination: bronze skin, hepatomegaly, joint examination consistent with arthropathy. Investigations: serum ferritin 1800 µg/L (markedly elevated), transferrin saturation 78% (saturated; normal <45%), serum iron raised, total iron-binding capacity reduced, ALT 95 (mildly raised), HBV / HCV negative, glucose 9.2 (impaired — pancreatic involvement).\n\nWhich is the most appropriate management?",
   options:["Wilson disease — penicillamine",
"Hereditary haemochromatosis — regular venesection until ferritin <50 (induction), then maintenance to keep ferritin <100; cascade genetic testing of first-degree relatives",
"Alpha-1 antitrypsin deficiency — alpha-1 augmentation",
"Autoimmune hepatitis — corticosteroid",
"Primary biliary cholangitis — ursodeoxycholic acid"],
   correct:"B",
   explanation:"HEREDITARY HAEMOCHROMATOSIS (HH): autosomal recessive iron overload disorder; most common single-gene disorder in people of Northern European descent (~1 in 200 homozygotes; ~1 in 8 carriers in Ireland / Scandinavia). Can lead to severe end-organ damage if undiagnosed; if treated early, normal life expectancy. \n\nDIAGNOSIS: SCREENING with iron studies (TRANSFERRIN SATURATION + SERUM FERRITIN — best initial test): TS >45% (men >50%) and FERRITIN raised (>300 men, >200 women) → likely iron overload — investigate further with HFE GENETIC TESTING.\n\n(A) Wilson disease (Cu): different phenotype — neurological, Kayser-Fleischer rings, lower ceruloplasmin; penicillamine / zinc.\n\n(C) Alpha-1 antitrypsin deficiency: emphysema and liver disease; alpha-1 augmentation IV; not iron overload.\n\n(D) Autoimmune hepatitis: positive autoimmune markers, raised IgG, lymphocytic interface hepatitis on biopsy; corticosteroid.\n\n(E) PBC: middle-aged women, AMA positive, cholestatic LFTs, ursodeoxycholic acid.\n\n💎 PEARL: Bronze pigmentation + 2nd/3rd MCP arthropathy + hypogonadism + raised ferritin + transferrin saturation >45% (men >50%) + HFE C282Y homozygote = hereditary haemochromatosis. Venesection weekly until ferritin <50, then maintenance <100. Cascade test first-degree relatives. Cirrhosis or diabetes risk if missed.",
   references:[{label:"BSG Iron Overload Guideline (2018, Gut)", url:"https://www.bsg.org.uk/clinical-resource/iron-overload-the-bsg-guidelines-on-the-management/"}]},

  {section:"other", specialty:"Ophthalmology", topic:"Acute angle-closure glaucoma",
   stem:"A 65-year-old hypermetropic (long-sighted) East Asian woman attends the ED with sudden onset severe right eye pain, frontal headache, nausea / vomiting, blurred vision and halos around lights. Symptoms started 4 hours ago in a darkened cinema. Examination: right eye red with ciliary injection (perilimbal flush), mid-dilated fixed pupil (not reactive to light), cloudy cornea (ground-glass appearance from oedema), eye rock-hard on palpation. Visual acuity: right 6/60 (markedly reduced from baseline); left 6/9. Intraocular pressure measured by Tonopen: right 56 mmHg (normal <21); left 18 mmHg.\n\nWhich is the most appropriate immediate management?",
   options:["Topical antibiotic eye drops",
"Same-day ophthalmology — iop reduction with topical pilocarpine + topical beta-blocker + oral / IV acetazolamide, analgesia / antiemetics, definitive laser peripheral iridotomy (typically bilateral)",
"Outpatient ophthalmology in 2 weeks",
"Oral steroid",
"Mydriatic drops to dilate the pupil"],
   correct:"B",
   explanation:"ACUTE ANGLE-CLOSURE GLAUCOMA (AACG): a SIGHT-THREATENING OPHTHALMIC EMERGENCY caused by sudden BLOCKAGE OF AQUEOUS HUMOUR DRAINAGE through the trabecular meshwork; results in rapidly RISING INTRAOCULAR PRESSURE (IOP — normal 10-21 mmHg), optic nerve damage, and rapid permanent VISUAL LOSS if untreated. PRESENTATION — typically rapid onset over hours: SEVERE EYE PAIN (sometimes referred as headache), HALOES around lights (corneal oedema diffracting light), BLURRED VISION, RED EYE, HEADACHE (often FRONTAL), nausea / vomiting (vagal — can mimic intra-abdominal pathology). MANAGEMENT — TIME-CRITICAL: SAME-DAY URGENT OPHTHALMOLOGY referral / on-call OPHTHALMOLOGY — does the saving treatment.\n\n(A) Topical antibiotic for conjunctivitis — wrong; would not address IOP / angle closure.\n\n(C) Outpatient delay = blindness.\n\n(D) Oral steroid alone doesn't address closed angle.\n\n(E) MYDRIATIC drops would WORSEN angle closure — ABSOLUTELY CONTRAINDICATED.\n\n💎 PEARL: Hyperopic East Asian woman + dim light + sudden severe eye pain + halos + cloudy cornea + mid-dilated fixed pupil + rock-hard eye = acute angle-closure glaucoma. Same-day ophthalmology — pilocarpine + topical beta-blocker + acetazolamide to reduce IOP, then definitive laser peripheral iridotomy (usually bilateral).",
   references:[{label:"RCOphth — Acute Angle Closure Pathway", url:"https://www.rcophth.ac.uk/standards-publications-research/clinical-guidelines/"}]},

  {section:"other", specialty:"Ophthalmology", topic:"Central retinal artery occlusion",
   stem:"A 72-year-old man with hypertension and known paroxysmal atrial fibrillation (untreated — non-adherent with previously prescribed apixaban; cha₂DS₂-vasc 4) presents with sudden, painless, profound loss of vision in his right eye 90 minutes ago ('like a curtain came down'); now seeing only hand movements in that eye. No headache, no scalp tenderness, no jaw claudication. Examination: visual acuity 6/60 right (counting fingers), 6/9 left; right rapd (relative afferent pupillary defect) — Marcus Gunn pupil; fundoscopy of the right eye: pale retina with a cherry-red spot at the macula (because the macula is supplied by the underlying choroid which remains perfused, vs the surrounding pale ischaemic inner retina); attenuated arterioles, segmentation of arterial blood ('boxcarring'). Investigations: BP 175/95, HR 88 irregularly irregular (AF on ECG), inflammatory markers normal (CRP 4, ESR 12 — excludes giant cell arteritis), normal glucose.\n\nWhich is the most likely diagnosis?",
   options:["Acute angle-closure glaucoma",
"Central retinal artery occlusion (crao) — manage as stroke equivalent",
"Retinal detachment",
"Optic neuritis",
"Vitreous haemorrhage"],
   correct:"B",
   explanation:"CENTRAL RETINAL ARTERY OCCLUSION (CRAO): a STROKE EQUIVALENT of the eye — sudden interruption of blood supply to the inner retina via the central retinal artery (a branch of the ophthalmic artery, itself a branch of internal carotid). \n\nPRESENTATION: SUDDEN, PAINLESS, PROFOUND MONOCULAR vision loss; often described as 'curtain coming down' or complete loss; can be precipitated by transient ischaemic events; often associated with prior TIA / stroke / cardiovascular disease. URGENT REFERRAL: SAME-DAY ophthalmology / on-call OR HYPERACUTE STROKE pathway — many centres now manage CRAO via stroke pathway.\n\n(A) AACG: severe pain, red eye, raised IOP, cloudy cornea — different.\n\n(C) Retinal detachment: floaters, flashes, curtain field defect, retinal tear / fold visible on fundoscopy.\n\n(D) Optic neuritis: pain on eye movement, often associated with MS / NMO / MOG; central scotoma, not whole field; younger patients.\n\n(E) Vitreous haemorrhage: floaters / cobwebs / sudden blurring; red reflex obscured; underlying causes — diabetic retinopathy, retinal tear, trauma.\n\n💎 PEARL: Sudden painless monocular vision loss + RAPD + cherry-red spot = central retinal artery occlusion — a STROKE equivalent of the eye. Within 4.5 hours of onset → hyperacute stroke pathway with consideration of thrombolysis. Investigate as TIA: carotid imaging, ECG/AF, lipids, BP. Don't manage as 'just an eye problem'.",
   references:[{label:"RCOphth — CRAO Pathway", url:"https://www.rcophth.ac.uk/standards-publications-research/clinical-guidelines/"},{label:"NICE NG128 — Stroke and TIA (CRAO is a stroke equivalent)", url:"https://www.nice.org.uk/guidance/ng128"}]},

  {section:"other", specialty:"ENT", topic:"Sudden sensorineural hearing loss",
   stem:"A 50-year-old woman presents with sudden unilateral right-sided hearing loss developing over 12 hours. No vertigo, no tinnitus initially (now mild), no ear pain or discharge, no recent urti, no trauma, no medication change. Examination: normal otoscopy bilaterally (no wax, intact tympanic membranes, no effusion); weber test (512 Hz tuning fork on forehead) lateralises to the left (unaffected) ear; rinne test air > bone bilaterally. Pure-tone audiometry (urgent, same day): right ear 50 dB hearing loss across 500-4000 Hz (severe), left ear normal.\n\nWhich is the most appropriate management?",
   options:["Outpatient ent review in 6 weeks",
"Same-week ent referral, urgent audiogram, oral or intratympanic steroid; MRI internal auditory meatus to exclude vestibular schwannoma",
"Empirical antibiotics for otitis media",
"Antihistamines",
"Earwax removal alone"],
   correct:"B",
   explanation:"SUDDEN SENSORINEURAL HEARING LOSS (SSNHL): rapid-onset hearing loss of NEURAL / cochlear origin (vs conductive — outer / middle ear); ≥30 dB across 3 contiguous frequencies developing within 72 HOURS. \n\nPRESENTATION: sudden hearing loss (often noticed on waking or during phone call); TINNITUS (~80%); ear FULLNESS / PRESSURE sensation; sometimes VERTIGO (often less severe than vestibular causes); rarely associated facial nerve / other neurological symptoms. \n\nINVESTIGATIONS: PURE-TONE AUDIOMETRY (PTA) — urgent within 24-48 hours (ideally same day) — quantifies the loss, distinguishes sensorineural from conductive, follows recovery; SPEECH AUDIOMETRY (word recognition); TYMPANOMETRY (middle ear function); STAPEDIAL REFLEX.\n\n(A) Outpatient delay loses critical treatment window.\n\n(C) Antibiotics for otitis media — wrong diagnosis; otoscopy normal and pattern is sensorineural.\n\n(D) Antihistamines for vestibular symptoms — not first-line for SSNHL.\n\n(E) Wax removal alone irrelevant — otoscopy clear.\n\n💎 PEARL: Sudden unilateral sensorineural hearing loss (≥30 dB across 3 contiguous frequencies within 72 h) + Weber lateralises away from affected ear → same-week ENT, urgent audiogram, oral or intratympanic steroid. MRI internal auditory meatus to exclude vestibular schwannoma. Time-critical — early steroid improves recovery.",
   references:[{label:"ENT UK / Royal College of Surgeons SSNHL Guidance", url:"https://www.entuk.org/_userfiles/pages/files/professionals/audit_and_research/clinical_guidelines/sudden_sensorineural_hearing_loss.pdf"}]},

  {section:"other", specialty:"Allergy", topic:"Peri-operative anaphylaxis — mast cell tryptase",
   stem:"A 34-year-old woman undergoing elective laparoscopic cholecystectomy has a sudden cardiovascular collapse 5 minutes after induction of general anaesthesia (received midazolam, fentanyl, propofol, rocuronium, then co-amoxiclav and chlorhexidine skin preparation). Sudden hypotension (BP 65/35), tachycardia, profuse erythematous rash on chest / abdomen, severe bronchospasm (high airway pressures, wheeze). Treated as anaphylaxis by anaesthetist with IM adrenaline 0.5 mg, IV fluid bolus, IV hydrocortisone 200 mg, IV chlorphenamine 10 mg; recovers over 20 minutes. Serum mast cell tryptase: at 90 minutes 45 ng/mL (markedly elevated; normal <11.4); at 24 hours 3.2 ng/mL (normal baseline).\n\nWhich is the most appropriate next step?",
   options:["Anaphylaxis is excluded by tryptase normalising",
"Confirm anaphylaxis (mast cell activation evidenced); refer to specialist allergy clinic for skin-prick / specific IgE / basophil activation testing of suspected agents (NMBA, antibiotic, latex, chlorhexidine) before any future anaesthetic",
"Diagnose carcinoid syndrome",
"Diagnose phaeochromocytoma",
"Mastocytosis cannot be considered"],
   correct:"B",
   explanation:"PERI-OPERATIVE ANAPHYLAXIS: a serious anaesthetic complication; incidence ~1 in 10,000-20,000 anaesthetics; mortality 4-10%. \n\nDIAGNOSIS: clinical recognition often + supportive investigations. SERUM MAST CELL TRYPTASE: enzyme released from mast cells during degranulation; PEAKS at 1-2 HOURS after onset; returns to BASELINE within 6-24 HOURS (this patient — typical pattern: raised at 90 min, normal at 24h). \n\nINVESTIGATIONS: serum tryptase (as above); also consider HISTAMINE (returns to normal in <60 minutes — less practical); urinary methylhistamine; specific IgE for suspected drugs (some available — penicillin, latex, chlorhexidine); BASOPHIL ACTIVATION TEST (BAT — newer, in vitro, useful for some drugs).\n\n(A) Tryptase pattern of acute rise + return to baseline supports mast cell activation — does NOT exclude anaphylaxis (it CONFIRMS).\n\n(C) Carcinoid: chronic flushing, diarrhoea, raised 5-HIAA — different presentation.\n\n(D) Phaeochromocytoma: episodic hypertension, headaches, palpitations, raised metanephrines — different.\n\n(E) Mastocytosis cannot be diagnosed from this acute episode but ELEVATED baseline tryptase (which should be checked at follow-up) would suggest investigation.\n\n💎 PEARL: Suspected anaphylaxis under anaesthesia: take serum tryptase at three points — at 1–2 h (peak), at 4 h, and at 24 h or baseline. A rise and fall confirms mast cell activation. NMBAs (rocuronium especially), antibiotics, latex and chlorhexidine are the commonest triggers. Refer to allergy clinic BEFORE any future anaesthetic.",
   references:[{label:"Resuscitation Council UK Anaphylaxis Guidelines (2021)", url:"https://www.resus.org.uk/library/2021-resuscitation-guidelines/emergency-treatment-anaphylaxis"},{label:"BSACI Anaphylaxis Guidelines (2021)", url:"https://onlinelibrary.wiley.com/doi/10.1111/cea.14005"}]},

  {section:"other", specialty:"Patient Safety", topic:"Statutory duty of candour",
   stem:"A surgical patient suffers an avoidable major bleeding complication after a clinician failed to stop apixaban pre-operatively (omission of medication review). The patient survives but with significant harm — required emergency re-operation, transfusion of 8 units of blood, ICU admission for 5 days, prolonged hospital stay (3 weeks), and discharge with reduced functional status. The trust's incident management system has flagged this as a notifiable patient safety incident.\n\nWhich is the most appropriate next step under the statutory duty of candour?",
   options:["Disclosure only if the patient asks",
"Open disclosure to patient (or family / representative); apology; clear factual explanation; explanation of next steps; written follow-up; ongoing support; full documentation",
"Disclosure only after legal advice and only via lawyer",
"No disclosure — protect the team from blame",
"Disclosure only if a formal complaint is made"],
   correct:"B",
   explanation:"DUTY OF CANDOUR (DoC): the legal and professional obligation to be open and honest with patients (and their families) when something goes wrong with their care that has caused, or has the potential to cause, harm or distress. INVESTIGATION — separate from but informed by DoC; PATIENT SAFETY INCIDENT INVESTIGATION (PSII) under PSIRF (Patient Safety Incident Response Framework, replacing Serious Incident Framework 2022); SHARE FINDINGS with patient / family.\n\n(A) Disclosure only if asked — fails DoC; statutory duty applies regardless of patient request.\n\n(C) Legal advice / lawyer-only disclosure inappropriate — clinical leadership should disclose; legal input on documentation, but should NOT delay or replace open conversation.\n\n(D) Non-disclosure / protection of team is unethical, illegal under statute, and damaging to staff long-term (concealment exacerbates personal / professional stress and litigation risk).\n\n(E) Disclosure only if complaint made fails proactive DoC duty.\n\n💎 PEARL: Statutory Duty of Candour (Health and Social Care Act 2008, Reg 20): when something has caused or could cause harm — open disclosure, sincere apology, factual account, written follow-up, and ongoing support. Mandatory regardless of whether the patient asks. Failure breaches CQC regulation and is a regulatory offence.",
   references:[{label:"Care Quality Commission — Regulation 20 / Duty of Candour", url:"https://www.cqc.org.uk/guidance-providers/regulations-enforcement/regulation-20-duty-candour"},{label:"GMC Openness and Honesty (Duty of Candour)", url:"https://www.gmc-uk.org/professional-standards/professional-standards-for-doctors/candour-openness-and-honesty-when-things-go-wrong"}]},

  {section:"other", specialty:"Allergy", topic:"Penicillin allergy de-labelling in sepsis",
   stem:"A 40-year-old patient is admitted with severe sepsis (suspected source = community-acquired pneumonia; lactate 4.0; NEWS2 8). Medical record shows label 'penicillin allergic' from a childhood rash age 5 (no further details documented; no anaphylaxis history; no swelling, breathing difficulty, or hypotension on questioning). Patient now urgently requires effective broad-spectrum antibiotics. The on-call team is uncertain about safest choice and contacts microbiology / antimicrobial stewardship for advice.\n\nWhich is the most appropriate approach?",
   options:["Avoid all beta-lactams indefinitely; use vancomycin alone",
"Take a structured allergy history; for life-threatening sepsis, use the most clinically appropriate antibiotic; refer to allergy clinic post-recovery for testing and de-labelling",
"Use broad-spectrum vancomycin universally for all 'penicillin-allergic' patients regardless of history",
"Wait for skin test results before any antibiotic",
"Avoid all carbapenems"],
   correct:"B",
   explanation:"PENICILLIN ALLERGY LABELLING — a major patient safety and antimicrobial stewardship issue: ~10% of UK hospital inpatients carry a 'penicillin allergic' label, but >90% of these are INACCURATE (after specialist testing). (1) Many 'reactions' are actually NON-ALLERGIC drug side effects (GI upset, headache, candidiasis);\n(2) MOST CHILDHOOD 'penicillin rashes' are VIRAL EXANTHEMS;\n(3) SENSITIVITY WANES over decades — even those with documented penicillin allergy in childhood often lose sensitivity (~80% lose IgE-mediated allergy by 10 years);\n(4) Family history of allergy mistakenly transferred to patient;\n(5) Misreading / mistranslation of medical records;\n(6) Cross-reactivity confusion.\n\n(A) Avoiding all beta-lactams indefinitely loses entire class options; vancomycin-only inadequate for many infections.\n\n(C) Universal vancomycin for all 'penicillin-allergic' is over-broad antimicrobial use, drives resistance, suboptimal for many infections.\n\n(D) Waiting for skin tests before treating sepsis = death; testing must be done in elective setting.\n\n(E) Carbapenems have minimal cross-reactivity — generally safe even in documented penicillin allergy.\n\n💎 PEARL: ~10% of inpatients carry a 'penicillin allergy' label; >90% are inaccurate. Childhood rashes are usually viral; sensitivity wanes ~80% by 10 years. In life-threatening sepsis, use the most clinically appropriate antibiotic (calculated risk) and refer post-recovery for skin-prick / oral challenge to de-label.",
   references:[{label:"UK SPS / NICE Antimicrobial Stewardship — Penicillin allergy de-labelling", url:"https://www.sps.nhs.uk/articles/penicillin-allergy-assessment-and-de-labelling/"},{label:"PEN-FAST Score (Trubiano JAMA Internal Medicine 2020)", url:"https://jamanetwork.com/journals/jamainternalmedicine/article-abstract/2761041"}]},

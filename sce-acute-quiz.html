  {section:"endocrine", specialty:"Endocrinology", topic:"Graves' disease",
   stem:"A 38-year-old woman presents with 3 months of palpitations, 5 kg unintentional weight loss despite increased appetite, heat intolerance, anxiety, and a fine tremor. Examination: pulse 110 irregular (AF), warm sweaty palms, fine resting tremor, smooth diffuse goitre with audible bruit, lid lag, mild proptosis bilaterally with sclera visible above the iris, and 'thyroid stare'. Investigations: TSH <0.01 mU/L (suppressed), free T4 42 pmol/L (high), free T3 18 pmol/L (high), tsh-receptor antibodies (trab) strongly positive. Thyroid uptake scan: diffuse increased uptake throughout the gland.\n\nWhich is the most likely diagnosis?",
   options:["Toxic multinodular goitre","Graves' disease","Subacute (de Quervain's) thyroiditis","Toxic adenoma","Factitious thyrotoxicosis"],
   correct:"B",
   explanation:"GRAVES' DISEASE: most common cause of hyperthyroidism (~70% of cases in non-iodine-deficient countries), an autoimmune disease with autoantibodies (TRAb) stimulating the TSH receptor → thyroid hyperplasia and excess hormone production. \n\nPRESENTATION: thyrotoxicosis; plus EXTRATHYROIDAL features specific to Graves' — DIFFUSE GOITRE with bruit (audibly hyperaemic gland), THYROID EYE DISEASE / Graves' ophthalmopathy, PRETIBIAL MYXOEDEMA (rare), thyroid acropachy (rare). \n\nDIAGNOSIS: suppressed TSH + raised T4/T3 + TRAb POSITIVE; thyroid uptake scan shows DIFFUSE increased uptake (vs FOCAL in toxic adenoma, MULTIFOCAL 'patchy' in TMNG, REDUCED uptake in thyroiditis).\n\n(A) TMNG: older patients, nodular goitre, no eye disease, no TRAb, multifocal uptake.\n\n(C) De Quervain's: viral prodrome, painful tender goitre, REDUCED uptake (release of preformed hormone), self-limiting.\n\n(D) Toxic adenoma: solitary nodule, focal uptake, no eye disease, no TRAb.\n\n(E) Factitious: ingested thyroxine — suppressed TSH, raised T4 but LOW THYROGLOBULIN, REDUCED uptake.\n\n💎 PEARL: Hyperthyroidism + DIFFUSE goitre with audible bruit + thyroid eye disease + TRAb positive + diffuse uptake on scan = Graves' disease. Carbimazole first-line (PTU in pregnancy 1st trimester or for storm). Definitive: radioiodine (avoid in active TED) or thyroidectomy. TED treated separately.",
   references:[{label:"BTA Hyperthyroidism Guidelines", url:"https://www.british-thyroid-association.org/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Primary aldosteronism (Conn syndrome)",
   stem:"A 45-year-old man has resistant hypertension (BP 168/98 on amlodipine, ramipril, indapamide and doxazosin) and persistent hypokalaemia (K 2.9 mmol/L despite oral supplementation). Plasma aldosterone:renin ratio (ARR) markedly elevated (aldosterone high, renin suppressed) — performed off interfering medications. CT abdomen: 1.4 cm right adrenal nodule (hypodense, well-defined). Adrenal venous sampling: lateralises to the right side (right:left aldosterone:cortisol ratio >4). 24-hour urinary cortisol normal; metanephrines normal.\n\nWhich is the most likely diagnosis?",
   options:["Bilateral adrenal hyperplasia","Unilateral aldosterone-producing adenoma (Conn syndrome)","Phaeochromocytoma","Cushing syndrome","Liddle syndrome"],
   correct:"B",
   explanation:"PRIMARY ALDOSTERONISM (Conn syndrome): the most common cause of SECONDARY hypertension (~5–10% of all hypertension, ~20% of resistant hypertension). Excess aldosterone causes sodium retention (hypertension) and potassium / hydrogen ion loss (hypokalaemia, metabolic alkalosis). SCREENING — ARR (aldosterone:renin ratio) — performed OFF INTERFERING MEDICATIONS where possible: stop spironolactone / eplerenone for 4–6 weeks; ACE-i, ARB, beta-blocker, NSAIDs, K-sparing diuretics ideally also stopped; calcium-channel blockers (e.g. amlodipine, doxazosin, hydralazine) acceptable; correct hypokalaemia first. CONFIRMATORY testing — saline suppression test, captopril challenge, fludrocortisone suppression. \n\nMANAGEMENT: UNILATERAL — laparoscopic adrenalectomy. Lifestyle (sodium restriction). All patients need ongoing antihypertensive management; some require multiple agents.\n\n(A) Bilateral hyperplasia: AVS shows no lateralisation; managed medically.\n\n(C) Phaeochromocytoma: episodic hypertension with headache / palpitations / sweating, raised metanephrines (normal here).\n\n(D) Cushing's: hypertension + hypokalaemia possible but with cushingoid features and abnormal cortisol (normal here).\n\n(E) Liddle syndrome: rare autosomal dominant ENaC channel mutation — hypertension, hypokalaemia, but LOW aldosterone AND LOW renin (vs raised aldosterone in Conn's); treat with amiloride.\n\n💎 PEARL: Resistant hypertension + hypokalaemia + raised aldosterone + suppressed renin (high ARR) = primary aldosteronism. Adrenal CT identifies adenoma; adrenal venous sampling LATERALISES disease (gold standard for surgical decisions). Unilateral disease → laparoscopic adrenalectomy. Bilateral hyperplasia → spironolactone.",
   references:[{label:"Endocrine Society Primary Aldosteronism Guidelines (2016)", url:"https://academic.oup.com/jcem/article/101/5/1889/2804729"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"DKA — initial management",
   stem:"A 19-year-old man with type 1 diabetes presents 24 hours into a vomiting illness. Examination: dehydrated, RR 32 with Kussmaul breathing, GCS 14. Glucose 28 mmol/L, capillary ketones 5.4 mmol/L, pH 7.12, hco₃ 8 mmol/L, K⁺ 5.4 mmol/L, Na⁺ 132 mmol/L, creatinine 110 µmol/L. Weight 70 kg.\n\nWhich is the most appropriate immediate management?",
   options:["IV insulin 0.1 U/kg/hr; no fluids","0.9% saline 1 L over 1 hour, then fixed-rate IV insulin 0.1 U/kg/hr; add KCl when K⁺ <5.5","IV bicarbonate to correct the acidosis","IV potassium replacement before any fluids","Subcutaneous rapid-acting insulin and oral fluids"],
   correct:"B",
   explanation:"JBDS DKA pathway: fluid resuscitation FIRST — 0.9% saline 1 L over 1 hour for the first bag, then start fixed-rate IV insulin 0.1 U/kg/hr. Continue any pre-existing long-acting (basal) insulin. Add potassium to subsequent bags once K⁺ falls below 5.5 (start KCl 40 mmol/L when K⁺ 3.5–5.5; hold and seek help if K⁺ <3.5). Switch to a glucose-containing infusion when blood glucose <14.\n\n(A) Insulin without fluid resuscitation worsens haemodynamics in a volume-depleted patient and risks pulmonary oedema as fluid shifts later.\n\n(C) Bicarbonate is NOT routinely indicated in adult DKA — pH normalises with insulin and fluids; bicarbonate carries risks of paradoxical CSF acidosis and hypokalaemia.\n\n(D) Potassium needs are anticipated as insulin shifts K⁺ intracellularly — but giving K⁺ alone before fluids and insulin does not treat the underlying problem.\n\n(E) Subcutaneous insulin is unreliable in shock; oral rehydration is unsafe with vomiting and severe acidosis.\n\n💎 PEARL: DKA: 0.9% saline 1 L over 1 h FIRST, then fixed-rate IV insulin 0.1 U/kg/h. Continue any pre-existing long-acting (basal) insulin throughout. Add KCl when K⁺ <5.5 (hold and seek help if K⁺ <3.5). Switch to glucose-containing fluid when BG <14. Bicarbonate not routinely indicated.",
   references:[{label:"JBDS-IP DKA Guidelines (2023 update)", url:"https://abcd.care/joint-british-diabetes-societies-jbds-inpatient-care-group"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Cranial diabetes insipidus",
   stem:"A 30-year-old woman complains of 6 weeks of severe polyuria (>5 L/day, including waking several times at night) and intense polydipsia (preferring iced water). Past history: head trauma 6 months ago. Examination: clinically dehydrated. Investigations: serum sodium 148 mmol/L (high), plasma osmolality 308 mOsm/kg (high), urine osmolality 110 mOsm/kg (low — inappropriately dilute given high serum osmolality), urine sodium 12, glucose normal, calcium normal. Water deprivation test: urine osmolality remains <300 after 8 hours of water deprivation. After desmopressin administration: urine osmolality rises to 720 mOsm/kg (>50% increase, robust response).\n\nWhich is the most likely diagnosis?",
   options:["Primary polydipsia","Cranial (central) diabetes insipidus","Nephrogenic diabetes insipidus","Siadh","Osmotic diuresis (e.g. Uncontrolled diabetes)"],
   correct:"B",
   explanation:"DIABETES INSIPIDUS (DI) — now formally renamed by the Endocrine Society as 'arginine vasopressin deficiency' (AVP-D) for cranial DI and 'arginine vasopressin resistance' (AVP-R) for nephrogenic DI, but 'diabetes insipidus' remains in widespread clinical use. \n\nPRESENTATION: polyuria (typically >3 L/day, often 5–10 L), polydipsia (often preferring ICED WATER), nocturia, hypernatraemia if access restricted (drowsiness, confusion, seizures, coma). \n\nDIAGNOSIS: confirm POLYURIA (>3 L/24h), exclude osmotic diuresis (glucose, mannitol — normal here), exclude hypercalcaemia / hypokalaemia. Newer alternative: COPEPTIN (stable byproduct of AVP) measurement after hypertonic saline stimulation has good performance and is replacing water deprivation in some centres.\n\n(A) Primary polydipsia: low urine and plasma osmolality (overhydrated); urine osmolality DOES rise with water deprivation.\n\n(C) Nephrogenic DI: would not respond to desmopressin.\n\n(D) SIADH: HYPONATRAEMIA, low plasma osmolality, concentrated urine — opposite biochemistry.\n\n(E) Osmotic diuresis: glucose was normal.\n\n💎 PEARL: Polyuria >3 L/day + low urine osmolality despite high serum osmolality + water deprivation test fails to concentrate urine but DESMOPRESSIN DOES → cranial DI. Nephrogenic DI fails to respond to desmopressin. Copeptin (stable AVP byproduct) is increasingly used. Replace with intranasal/oral desmopressin.",
   references:[{label:"Society for Endocrinology — Arginine Vasopressin Disease (2024 update; renamed from DI)", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Hyperosmolar hyperglycaemic state",
   stem:"A 78-year-old man with type 2 diabetes (on metformin and gliclazide) presents with progressive confusion over 5 days, polyuria, and reduced oral intake. He is profoundly dehydrated (dry mucous membranes, sunken eyes, reduced skin turgor; urine output minimal), GCS 12. Investigations: glucose 52 mmol/L (markedly raised), Na 158 (high — beware of corrected sodium for glucose), urea 18 (raised), creatinine 180 (AKI), ketones 0.6 mmol/L (not high), pH 7.32, HCO3 22 (normal — no significant acidosis), calculated osmolality 348 mOsm/kg (very high; >320 is diagnostic). Weight 65 kg.\n\nWhich is the most appropriate immediate management?",
   options:["IV insulin 0.1 U/kg/hr immediately, no fluids","Slow IV 0.9% saline over 24–48 hours, KCl as needed, prophylactic LMWH; insulin only if glucose not falling with fluid alone","IV bicarbonate","Rapid correction of hypernatraemia with hypotonic fluids","Oral metformin only"],
   correct:"B",
   explanation:"HYPEROSMOLAR HYPERGLYCAEMIC STATE (HHS) — formerly hyperosmolar non-ketotic state (HONK). DIAGNOSTIC CRITERIA (JBDS UK guideline): (1) HYPOVOLAEMIA / DEHYDRATION (often profound, total body water deficit ~10% body weight = ~7–10 L);\n(2) MARKED HYPERGLYCAEMIA (typically ≥30 mmol/L) WITHOUT significant ketosis (ketones <3 mmol/L) or acidosis (pH ≥7.3, HCO3 ≥15);\n(3) OSMOLALITY ≥320 mOsm/kg. Distinguishes from DKA where ACIDOSIS and KETOSIS dominate. MANAGEMENT — JBDS HHS guideline (key principles): SLOWER and more CAUTIOUS than DKA. Insulin is only added IF the glucose is NOT falling adequately with fluids alone, OR if significant ketosis is present (≥1 mmol/L).\n\n(A) Insulin without fluid is dangerous in shocked, hyperosmolar patients — collapses circulation.\n\n(C) Bicarbonate not indicated (no acidosis).\n\n(D) Hypotonic fluids risk osmotic demyelination from rapid sodium correction.\n\n(E) Oral metformin contraindicated in AKI and inadequate to replace fluid losses.\n\n💎 PEARL: Type 2 DM + profound dehydration + glucose ≥30 + osmolality ≥320 + NO significant ketones or acidosis = HHS. Slow IV 0.9% saline over 24–48 h (NOT aggressive — risk of cerebral oedema). Insulin only if glucose not falling with fluids alone. Prophylactic LMWH (very high VTE risk).",
   references:[{label:"JBDS-IP HHS Guidelines", url:"https://abcd.care/joint-british-diabetes-societies-jbds-inpatient-care-group"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Thyroid storm",
   stem:"A 35-year-old woman with poorly controlled Graves' disease (recently stopped carbimazole non-adherence) is admitted following a viral pharyngitis. She is markedly agitated, T 39.5°C, HR 160 in fast AF, BP 96/60, jaundiced with mildly raised bilirubin and ALT, vomiting, and confused. CXR clear. CRP 32, WCC 12. Burch-wartofsky point score 65 (highly suggestive of thyroid storm). Investigations confirm severe thyrotoxicosis (TSH suppressed, free T4 markedly elevated, free T3 elevated).\n\nWhich is the most appropriate immediate management?",
   options:["Carbimazole alone","Propylthiouracil + Lugol's iodine (≥1 hour after ptu) + propranolol + IV hydrocortisone + cooling and treat precipitant","Total thyroidectomy as first step","Radioiodine ablation","Levothyroxine"],
   correct:"B",
   explanation:"THYROID STORM (thyrotoxic crisis): severe, life-threatening exacerbation of thyrotoxicosis with multi-organ decompensation. \n\nINVESTIGATIONS: confirm with TFTs (severely thyrotoxic) — but TREAT ON CLINICAL SUSPICION, do NOT wait for results. MANAGEMENT — multi-modal, emergency: (1) ANTITHYROID DRUG: PROPYLTHIOURACIL (PTU) PREFERRED in storm (200 mg ORAL or via NG tube every 4–6 hours), because PTU also blocks PERIPHERAL T4→T3 CONVERSION (carbimazole only blocks new hormone synthesis). Carbimazole 20 mg every 4–6 hours is an alternative if PTU unavailable. (2) IODINE — LUGOL'S IODINE (potassium iodide solution) 5–10 drops every 6 hours, started ≥1 HOUR AFTER PTU.\n\n(A) Carbimazole alone is insufficient — multi-modal therapy required for storm.\n\n(C) Surgery in storm is hazardous — stabilise medically first; thyroidectomy as definitive treatment is for after recovery.\n\n(D) Radioiodine for storm is inappropriate (delayed effect, can transiently worsen).\n\n(E) Levothyroxine is the wrong direction entirely (this is hyperthyroidism).\n\n💎 PEARL: Thyroid storm: PROPYLTHIOURACIL preferred over carbimazole (PTU also blocks peripheral T4→T3 conversion). Lugol's iodine ≥1 hour AFTER PTU (otherwise iodine fuels hormone synthesis). Propranolol for tachycardia/tremor. IV hydrocortisone (blocks T4→T3 + treats relative adrenal insufficiency). Cool. Treat precipitant.",
   references:[{label:"Society for Endocrinology Emergency Endocrine Guidance — Thyroid Storm", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"},{label:"Burch-Wartofsky Point Scale", url:"https://academic.oup.com/jcem/article/77/2/263/2649984"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Addisonian (adrenal) crisis",
   stem:"A 42-year-old woman with established autoimmune Addison disease (on hydrocortisone 20 mg / 10 mg / 5 mg + fludrocortisone 100 mcg) develops gastroenteritis with vomiting and is unable to keep down her oral hydrocortisone for 2 days. She presents to the ED collapsed. Examination: GCS 13, pale, BP 76/44 (recumbent; no postural reading), HR 124, T 37.6, dehydrated, pigmented buccal mucosa. Bloods: Na 124 (low), K 5.8 (high), urea 12, creatinine 138 (AKI), glucose 3.2 (hypoglycaemia), HCO3 18, capillary cortisol pending.\n\nWhich is the most appropriate immediate management?",
   options:["IV hydrocortisone 100 mg stat then 200 mg/24 h, IV 0.9% saline resuscitation, IV dextrose for hypoglycaemia, identify precipitant","IV fludrocortisone","Oral prednisolone","Vasopressors first","CT adrenals before any treatment"],
   correct:"A",
   explanation:"ADDISONIAN (ADRENAL) CRISIS: an endocrine emergency, often fatal if not recognised. MANAGEMENT — TREAT EMPIRICALLY ON CLINICAL SUSPICION, do not delay for confirmatory tests: (1) IV HYDROCORTISONE — 100 mg STAT BOLUS, followed by 200 mg over 24 hours by continuous infusion OR 50 mg every 6 hours IV; provides both glucocorticoid and (at this dose) some mineralocorticoid activity. (2) IV FLUID resuscitation — 0.9% saline 1 L over 1 hour, then 1 L over 2 hours, etc., titrated to BP and clinical response (typical deficit 2–5 L). 5% DEXTROSE / 10% dextrose for HYPOGLYCAEMIA.\n\n(B) Oral fludrocortisone alone is insufficient — needs urgent IV glucocorticoid; mineralocorticoid replacement is secondary in acute crisis.\n\n(C) Oral prednisolone is unreliable absorption in vomiting / shock — needs IV.\n\n(D) Vasopressors will be ineffective without cortisol replacement — refractory hypotension is the typical scenario.\n\n(E) Imaging may follow but should not delay treatment.\n\n💎 PEARL: Addisonian crisis: hypotension + hyponatraemia + hyperkalaemia + hypoglycaemia + pigmentation. IV hydrocortisone 100 mg STAT then 200 mg/24 h, IV 0.9% saline (typical 2–5 L deficit), IV dextrose for hypoglycaemia. Treat empirically — don't wait for cortisol/Synacthen results.",
   references:[{label:"Endocrine Society Adrenal Insufficiency Guideline (2016)", url:"https://academic.oup.com/jcem/article/101/2/364/2810222"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Phaeochromocytoma — pre-operative blockade",
   stem:"A 38-year-old woman has a 6-month history of episodic severe headaches, palpitations, sweating and pallor lasting 15–60 minutes, occurring 3–5 times per week. Between episodes she is well. BP 196/120 mmHg in clinic during an episode, otherwise 130/80. 24-hour urine metanephrines: noradrenaline metabolites 5× upper limit of normal, adrenaline metabolites 3× ULN. Plasma metanephrines also markedly elevated. Adrenal CT: 4 cm right adrenal mass with high attenuation (HU >20). No family history of MEN.\n\nWhich is the most appropriate management before surgical resection?",
   options:["Beta-blocker first-line for hypertension","Alpha-blockade with phenoxybenzamine for 10–14 days, liberal salt and fluid, add beta-blocker only if needed after alpha-blockade, then adrenalectomy","ACE inhibitor","Loop diuretic","Surgery within 24 hours without medical preparation"],
   correct:"B",
   explanation:"PHAEOCHROMOCYTOMA: rare catecholamine-secreting tumour of CHROMAFFIN cells of the adrenal MEDULLA (90%) or extra-adrenal sympathetic ganglia (PARAGANGLIOMA, ~10%). 'RULE OF 10' (now somewhat outdated): 10% bilateral, 10% extra-adrenal, 10% malignant, 10% familial — actually closer to 30–40% have an inherited cause (MEN2, VHL, NF1, SDHB/D, FH, MAX) — GENETIC TESTING for ALL patients regardless of family history. SECRETES catecholamines (noradrenaline >> adrenaline; episodic dopamine in malignant disease). \n\nPRESENTATION: classic triad of EPISODIC HEADACHES + PALPITATIONS + SWEATING (specificity ~90%, sensitivity ~70%); HYPERTENSION; pallor (NOT flushing — vasoconstriction); orthostatic hypotension (chronic volume contraction); panic-attack-like episodes; weight loss, hyperglycaemia. Genetic counselling.\n\n(A) Beta-blockers WITHOUT prior alpha-blockade can precipitate hypertensive crisis.\n\n(C) ACE inhibitors are insufficient and not the first-line approach in phaeo.\n\n(D) Diuretics worsen the volume contraction.\n\n(E) Surgery without medical preparation has very high mortality.\n\n💎 PEARL: Phaeochromocytoma: episodic headaches + palpitations + sweating + raised plasma/urinary metanephrines = catecholamine excess. Pre-op ALPHA-blockade (phenoxybenzamine 10–14 days, with liberal salt and fluid) BEFORE beta-blockade — beta first causes UNOPPOSED alpha vasoconstriction → hypertensive crisis. ALL patients need genetic testing (~30–40% inherited).",
   references:[{label:"Endocrine Society Phaeochromocytoma & Paraganglioma Guideline (2014)", url:"https://academic.oup.com/jcem/article/99/6/1915/2537399"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Acute symptomatic hypocalcaemia",
   stem:"A 65-year-old woman is 24 hours post-total thyroidectomy for multinodular goitre. She develops peri-oral paraesthesia, numbness in fingers and toes, and carpopedal spasm (Trousseau's sign positive — carpal spasm after BP cuff inflation for 3 min). Chvostek's sign positive (twitch of facial muscles on tapping facial nerve over parotid). Bloods: calcium 1.7 mmol/L (corrected for albumin 38 g/L; severely low), phosphate 1.6 mmol/L (high), magnesium 0.62 mmol/L (low). ECG: prolonged QT interval (QTc 520 ms). Capillary glucose 5.4.\n\nWhich is the most appropriate immediate management?",
   options:["Oral calcium carbonate alone","IV calcium gluconate 10% 10 mL over 10 min, followed by infusion if symptoms persist; replace magnesium; alfacalcidol; check PTH","Vitamin D3 high-dose stat","Cinacalcet","IV bisphosphonate"],
   correct:"B",
   explanation:"ACUTE SYMPTOMATIC HYPOCALCAEMIA: medical EMERGENCY due to risk of seizures, laryngospasm, cardiac arrhythmia (prolonged QT, torsades de pointes, refractory cardiac arrest). \n\nINVESTIGATIONS: CALCIUM (corrected for albumin: corrected Ca = measured Ca + 0.02 × (40 - albumin in g/L); IONISED Ca more accurate but less available); PHOSPHATE (high in hypoPTH and CKD; LOW in vitamin D deficiency / oncological causes); MAGNESIUM; PTH (to differentiate causes — LOW in hypoPTH; HIGH in vitamin D deficiency, CKD, pseudohypoPTH); creatinine; ECG (QT prolongation); vitamin D levels.\n\n(A) Oral alone is too slow for severe symptomatic hypocalcaemia.\n\n(C) Cholecalciferol takes weeks to produce effect — too slow for acute crisis.\n\n(D) Cinacalcet would WORSEN hypocalcaemia (calcimimetic — used in HYPERparathyroidism).\n\n(E) Bisphosphonates LOWER calcium — wrong direction.\n\n💎 PEARL: Post-thyroidectomy + perioral paraesthesia + Trousseau/Chvostek + Ca <1.9 + prolonged QT = acute symptomatic hypocalcaemia. IV calcium gluconate 10% 10 mL over 10 min, then infusion if symptoms persist. Replace MAGNESIUM too (Mg <0.5 prevents PTH release). Check PTH to determine cause.",
   references:[{label:"Society for Endocrinology Emergency Endocrine Guidance — Hypocalcaemia", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"endocrine", specialty:"Renal", topic:"Severe hyperkalaemia — emergency management",
   stem:"A 72-year-old man with stage 4 CKD on ramipril, spironolactone and atenolol is admitted feeling unwell. Pulse 56, BP 134/82. Bedside potassium 7.2 mmol/L. The 12-lead ECG is shown:",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/ECG_in_hyperkalemia.svg",
   imageAlt:"ECG showing tall peaked T waves with broadened QRS complexes — features of hyperkalaemia",
   options:["Oral patiromer and recheck K⁺ in 4 hours","IV calcium gluconate 10% 10 mL first, then insulin–dextrose and salbutamol nebulisers; stop offending drugs; consider definitive K⁺ removal","IV insulin–dextrose alone","Urgent haemodialysis without prior medical management","IV sodium bicarbonate alone"],
   correct:"B",
   explanation:"Severe hyperkalaemia (K⁺ ≥6.5) with ECG changes (peaked T waves, prolonged PR, broadened QRS) is a medical emergency. Sequence: (1) IV calcium gluconate 10% 10 mL stabilises the cardiac membrane within minutes — does NOT lower K⁺ — repeat if ECG remains abnormal.\n(2) Insulin 10 U with 25 g dextrose IV shifts K⁺ intracellularly (monitor BG).\n(3) Nebulised salbutamol 10–20 mg gives an additive shift. Stop ACEi, K⁺-sparing diuretic, NSAIDs. Definitive removal: loop diuretic if euvolaemic, oral K⁺ binder, or dialysis.\n\n(A) Oral binders (patiromer, sodium zirconium cyclosilicate) are for chronic management or mild-moderate hyperkalaemia, not acute K⁺ ≥6.5 with ECG changes.\n\n(C) Insulin without calcium leaves the heart unprotected during the K⁺-shift period — calcium first.\n\n(D) Dialysis is appropriate for refractory hyperkalaemia, but cardiac membrane stabilisation comes first while it is being arranged.\n\n(E) Bicarbonate alone has limited efficacy outside concurrent metabolic acidosis.\n\n💎 PEARL: K⁺ ≥6.5 with ECG changes: IV calcium gluconate 10% 10 mL FIRST stabilises cardiac membrane (does NOT lower K⁺) — repeat if ECG remains abnormal. THEN insulin 10 U + 25 g dextrose IV + nebulised salbutamol 10–20 mg (additive shift). Stop ACE-i, MRA, NSAID. Definitive removal: loop diuretic, oral binder, or dialysis.",
   references:[{label:"UK Kidney Association — Treatment of Acute Hyperkalaemia (2023)", url:"https://ukkidney.org/health-professionals/guidelines/treatment-acute-hyperkalaemia-adults"},{label:"Resuscitation Council UK — Periarrest algorithms", url:"https://www.resus.org.uk/library/2021-resuscitation-guidelines/peri-arrest-arrhythmia-algorithms"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Hypercalcaemia of malignancy",
   stem:"A 65-year-old woman with metastatic non-small-cell lung cancer (recently diagnosed, presumed PTHrP-mediated humoral hypercalcaemia of malignancy) presents with progressive confusion (4at 8/16), polyuria, vomiting, and constipation over 5 days. Examination: clinically dehydrated, GCS 13. Investigations: calcium 3.8 mmol/L (corrected; severely high — 'calcium >3.5 = hypercalcaemic crisis'), albumin 32 g/L, phosphate normal, eGFR 30 ml/min/1.73m² (AKI from dehydration; baseline 75), ECG: short QT interval. PTH suppressed (<1 pmol/L), PTHrP elevated; ACE / 1,25-OH vit D normal.\n\nWhich is the most appropriate immediate management?",
   options:["Oral bisphosphonate","Aggressive IV 0.9% saline rehydration over 24 hours, then IV zoledronic acid 4 mg once volume restored, treat underlying cancer","IV loop diuretic before rehydration","Long-term calcitonin alone","Cinacalcet"],
   correct:"B",
   explanation:"HYPERCALCAEMIA: serum corrected calcium >2.6 mmol/L. SEVERITY: mild 2.6–3.0; moderate 3.0–3.5; severe / crisis >3.5 mmol/L (this patient — emergency). MANAGEMENT — SEVERE (>3.5 or symptomatic): (1) AGGRESSIVE IV 0.9% SALINE REHYDRATION — the CORNERSTONE; typically 4–6 L over 24 hours (titrate to clinical status, cardiac function, urine output); restores volume, increases GFR, increases CALCIURESIS via sodium load (calcium follows sodium in proximal tubule). (2) IV BISPHOSPHONATE — once volume-restored: ZOLEDRONIC ACID 4 mg IV over 15 min (preferred — single dose, longer effect) OR PAMIDRONATE 60–90 mg IV over 4 hours.\n\n(A) Oral bisphosphonate too slow for severe acute hypercalcaemia.\n\n(C) Loop diuretic first risks worsening dehydration / AKI.\n\n(D) Calcitonin alone has transient effect only.\n\n(E) Cinacalcet (calcimimetic) is for parathyroid carcinoma and refractory primary HPT — not first-line in malignant hypercalcaemia.\n\n💎 PEARL: Hypercalcaemia >3.5 mmol/L = crisis. AGGRESSIVE IV 0.9% saline 4–6 L over 24 h is the cornerstone (volume + sodium-driven calciuresis). Bisphosphonate (zoledronic acid 4 mg IV) once volume restored. Denosumab if eGFR <30 or refractory. Treat the cancer.",
   references:[{label:"Endocrine Society Primary Hyperparathyroidism Guidelines (2014)", url:"https://academic.oup.com/jcem/article/99/10/3561/2836268"},{label:"Society for Endocrinology Emergency Endocrine Guidance — Hypercalcaemia", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Pituitary apoplexy",
   stem:"A 50-year-old man (with previously undiagnosed pituitary macroadenoma in retrospect — he had been investigated 1 year earlier for headaches and visual disturbance, lost to follow-up) develops sudden severe thunderclap headache, right-eye visual loss (only counting fingers in the right eye, full visual fields lost on confrontation in the right eye, normal in left), bilateral ophthalmoplegia (right CN III palsy with ptosis, fixed dilated pupil, eye 'down and out'), nausea, vomiting. BP 86/52, HR 56, T 36.2. CT head (without contrast): hyperdense pituitary mass with surrounding sellar enlargement, suspected acute haemorrhage; no SAH; no hydrocephalus. Bloods: Na 130 (low), glucose 3.6 (low), random cortisol 80 nmol/L (very low — should be >550 in stress); other pituitary hormones pending.\n\nWhich is the most appropriate immediate management?",
   options:["Outpatient endocrinology referral","IV hydrocortisone 100 mg STAT to cover likely secondary adrenal insufficiency, urgent MRI pituitary, urgent neurosurgical and ophthalmological referral","IV aciclovir","IV mannitol","Carbamazepine for seizure prophylaxis"],
   correct:"B",
   explanation:"PITUITARY APOPLEXY: a NEUROENDOCRINE EMERGENCY caused by sudden HAEMORRHAGE OR INFARCTION within the pituitary gland, typically into a pre-existing (often previously undiagnosed) PITUITARY ADENOMA — most commonly a macroadenoma. \n\nINVESTIGATIONS: URGENT MRI PITUITARY — gold standard; T1 / T2 / DWI — shows haemorrhage / infarction within tumour; far more sensitive than CT (CT shows haemorrhage in only ~50%).\n\n(A) Outpatient referral inappropriate for emergency.\n\n(C) Aciclovir for HSV — wrong diagnosis.\n\n(D) Mannitol for raised ICP, not for pituitary apoplexy primarily.\n\n(E) Carbamazepine — no role for pituitary apoplexy.\n\n💎 PEARL: Sudden thunderclap headache + visual loss + ophthalmoplegia (often CN III) + previously known or unknown pituitary macroadenoma = pituitary apoplexy. IV hydrocortisone 100 mg STAT (covers likely secondary adrenal insufficiency). Urgent MRI pituitary (more sensitive than CT). Neurosurgical + ophthalmology referral.",
   references:[{label:"Society for Endocrinology Emergency Endocrine Guidance", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Type 2 diabetes — escalation with cardiorenal disease",
   stem:"A 58-year-old man with type 2 diabetes (HbA1c 78 mmol/mol despite metformin 1 g BD for 2 years), hypertension on ramipril, established atherosclerotic cardiovascular disease (previous anterior STEMI 3 years ago, on aspirin and atorvastatin), and CKD stage 3a (eGFR 48 ml/min/1.73 m², stable, acr 8 mg/mmol). BMI 32. He has not achieved target glycaemic control. No history of euglycaemic DKA. He attends diabetes review.\n\nWhich is the most appropriate next step in escalation?",
   options:["Add a sulfonylurea","Add an SGLT2 inhibitor (empagliflozin or dapagliflozin)","Increase metformin to 2 g BD","Switch from metformin to insulin","Stop metformin"],
   correct:"B",
   explanation:"TYPE 2 DIABETES MANAGEMENT — NICE NG28 (updated 2022), ADA / EASD consensus, KDIGO 2022. Step 2 (one of the following based on comorbidity): (a) ESTABLISHED CARDIOVASCULAR DISEASE / HF / CKD (this patient meets multiple criteria) — ADD SGLT2 INHIBITOR (empagliflozin, dapagliflozin) at FIRST escalation step REGARDLESS of HbA1c (i.e. cardiovascular indication trumps glycaemic indication); (b) HIGH cardiovascular risk (e.g. high QRISK3, multiple risk factors) without established disease — consider SGLT2 inhibitor alongside metformin; (c) NO cardiovascular indication — choice based on cost, side effects, patient preference.\n\n(A) Sulfonylurea adds hypoglycaemia risk (especially in older adults), weight gain, no CV benefit — not first choice in CVD/CKD.\n\n(C) Increasing metformin alone misses CV/renal protection opportunity.\n\n(D) Switching to insulin is unnecessary at this stage and lacks CV benefit.\n\n(E) Stopping metformin loses its mortality benefit and dual therapy is appropriate.\n\n💎 PEARL: T2DM + established ASCVD/HF/CKD: add SGLT2 inhibitor (empagliflozin or dapagliflozin) at FIRST escalation step REGARDLESS of HbA1c (cardiovascular indication trumps glycaemic — EMPA-REG, DAPA-CKD, EMPEROR). GLP-1 RA also evidence-based for ASCVD (semaglutide). Sulfonylureas no longer preferred.",
   references:[{label:"NICE NG28 — Type 2 diabetes in adults (2015, updated)", url:"https://www.nice.org.uk/guidance/ng28"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Cushing syndrome — investigation",
   stem:"A 42-year-old woman has 18 months of central obesity (weight gain 15 kg, abdominal striae purple and >1 cm wide), thinning of skin and easy bruising, proximal muscle weakness (difficulty climbing stairs, arising from a chair), facial plethora and 'moon face', new hypertension (BP 168/96), new diabetes (HbA1c 62 mmol/mol), oligomenorrhoea, and depression. No exogenous glucocorticoid use (no inhaled / topical / oral steroids). First-line biochemical screening: late-night salivary cortisol elevated on two occasions; 24-hour urinary free cortisol elevated 4× ULN; overnight 1 mg dexamethasone suppression test: failure to suppress (cortisol 380 nmol/L; should be <50). Cushing syndrome is biochemically confirmed.\n\nWhich is the most appropriate next step in investigation?",
   options:["Reassure — no further investigation needed","Measure plasma ACTH; if suppressed → adrenal CT; if normal/raised → high-dose dexamethasone, CRH, pituitary MRI ± inferior petrosal sinus sampling","CT chest first","Renal MRI","Treat empirically with metyrapone"],
   correct:"B",
   explanation:"CUSHING SYNDROME (CS): clinical and biochemical state of CHRONIC EXCESS GLUCOCORTICOID. Repeat / use multiple modalities to confirm.\n\nSTEP 2 — DETERMINE CAUSE: PLASMA ACTH (random + at 9 am) is the KEY discriminator: (i) ACTH SUPPRESSED (<5 pg/mL or <1.1 pmol/L) → ACTH-INDEPENDENT (adrenal source) → ADRENAL CT/MRI to identify adenoma vs carcinoma vs hyperplasia. \n\nMANAGEMENT: SURGERY first-line — transsphenoidal adenomectomy for pituitary disease (~80% remission), unilateral / bilateral adrenalectomy for adrenal disease, resection of ectopic source if identifiable. Bilateral adrenalectomy as last resort. RADIOTHERAPY for refractory pituitary disease.\n\n(A) Reassurance after positive screening tests inappropriate.\n\n(C) CT chest premature — FIRST distinguish ACTH-dependent vs independent, then localise.\n\n(D) Renal MRI not relevant.\n\n(E) Empirical metyrapone before diagnosis is wrong — confirm cause and source first.\n\n💎 PEARL: Confirmed Cushing's syndrome: measure ACTH next. SUPPRESSED → adrenal source (CT adrenals). NORMAL/RAISED → ACTH-dependent → high-dose dexamethasone suppression + CRH stim + pituitary MRI ± inferior petrosal sinus sampling (gold standard for distinguishing pituitary from ectopic ACTH).",
   references:[{label:"Endocrine Society Cushing Syndrome Guidelines (2015)", url:"https://academic.oup.com/jcem/article/100/8/2807/2814796"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Acromegaly — initial management",
   stem:"A 45-year-old man has 5 years of progressive coarsening of facial features (prognathism, frontal bossing, prominent supraorbital ridge), enlargement of hands and feet (changing ring size from M to XL, shoes from 9 to 11), profuse sweating, headache, snoring with witnessed apnoeas (suggestive of OSA), new-onset diabetes (HbA1c 64), and arthralgias. Examination: tongue macroglossia, large fleshy hands and feet, skin tags, hypertension. Investigations: random IGF-1 markedly elevated 4× ULN; oral glucose tolerance test: GH fails to suppress below 1 µg/L (confirms autonomous GH excess).\n\nWhich is the most appropriate first-line management?",
   options:["Outpatient observation only","Refer to specialist endocrinologist for transsphenoidal surgery as first-line","Aspirin alone","Levothyroxine","Empirical antibiotics"],
   correct:"B",
   explanation:"ACROMEGALY: chronic GH excess from a pituitary somatotroph adenoma (~95% of cases; rare ectopic GHRH from neuroendocrine tumour <1%). \n\nDIAGNOSIS: SCREENING with random IGF-1 (more reliable than random GH due to pulsatility); CONFIRMATION with OGTT — GH should suppress below 0.4 µg/L (some labs <1) following 75 g oral glucose at 60 / 120 minutes; FAILURE to suppress = acromegaly. Pituitary MRI to localise adenoma. MANAGEMENT — multidisciplinary: (1) FIRST-LINE TRANSSPHENOIDAL SURGERY by experienced pituitary neurosurgeon — typically curative for microadenomas (~80%); 50–60% remission for macroadenomas; aim for IGF-1 normalisation and GH <1 µg/L. Lifelong endocrinology follow-up.\n\n(A) Observation alone is inappropriate given mortality risk and reversibility.\n\n(C) Aspirin treats nothing in acromegaly.\n\n(D) Levothyroxine for thyroid disease — not relevant here.\n\n(E) Antibiotics — wrong indication.\n\n💎 PEARL: Acromegaly diagnosis: raised IGF-1 + failure of GH to suppress <0.4 µg/L on OGTT + pituitary MRI. First-line: TRANSSPHENOIDAL SURGERY (~80% cure for microadenoma, 50–60% for macroadenoma). Medical (somatostatin analogues, pegvisomant, cabergoline) and radiotherapy as second-line for refractory disease.",
   references:[{label:"Endocrine Society Acromegaly Guideline (2014)", url:"https://academic.oup.com/jcem/article/99/11/3933/2836524"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Hypopituitarism — replacement order",
   stem:"A 55-year-old woman with a previously surgically treated craniopharyngioma (transsphenoidal resection 5 years ago, then external-beam radiotherapy) presents with 6 months of progressive fatigue, cold intolerance, weight gain, low libido, amenorrhoea, and orthostatic dizziness. Examination: pale, BP 96/60, no goitre. Investigations: free T4 8 pmol/L (low), TSH 0.6 mU/L (not elevated as would be expected with primary hypothyroidism), 09:00 cortisol 80 nmol/L (low — should be >550 in normal stress; suggests adrenal insufficiency), FSH/LH inappropriately low for menopausal status, prolactin slightly raised, IGF-1 low.\n\nWhich is the most appropriate sequence of hormone replacement?",
   options:["Start levothyroxine first","Replace cortisol before thyroid hormone — hydrocortisone first, then levothyroxine after stabilisation","Siadh-pattern fluid restriction","Sex hormone replacement only","No treatment, observe"],
   correct:"B",
   explanation:"HYPOPITUITARISM: deficiency of one or more anterior pituitary hormones (and sometimes posterior pituitary hormones — diabetes insipidus). \n\nDIAGNOSIS: paired baseline hormones (TFTs, cortisol / ACTH, FSH/LH/sex hormones, IGF-1, prolactin, urea / electrolytes / urine and plasma osmolality); DYNAMIC TESTING for cortisol axis — short Synacthen (limited utility in acute pituitary failure as adrenals not yet atrophied), insulin-tolerance test, glucagon stimulation test, CRH stimulation; for GH — insulin-tolerance, glucagon, GHRH-arginine; pituitary MRI for structural cause.\n\n(A) Levothyroxine first risks adrenal crisis.\n\n(C) SIADH wrong diagnosis.\n\n(D) Sex hormones don't address the immediately life-threatening adrenal axis.\n\n(E) No treatment leads to worsening / crisis.\n\n💎 PEARL: Replace cortisol BEFORE thyroid hormone in panhypopituitarism — levothyroxine first risks adrenal crisis (it increases cortisol clearance). Hydrocortisone first, levothyroxine when stable, then sex hormones, GH last. Always carry steroid card; sick day rules; double dose for stress.",
   references:[{label:"Endocrine Society Hypopituitarism Guidelines (2016)", url:"https://academic.oup.com/jcem/article/101/11/3888/2764891"},{label:"Society for Endocrinology Emergency Endocrine Guidance", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Subclinical hypothyroidism in older adults",
   stem:"A 65-year-old woman attends for review with fatigue. Investigations: TSH 7.2 mU/L (mildly elevated, normal range typically 0.4–4.0), free T4 normal (16 pmol/L), anti-tpo antibodies negative. Repeat at 8 weeks confirms persistent mild TSH elevation (TSH 6.8). She has no symptoms of overt hypothyroidism (no constipation, weight gain, cold intolerance, dry skin, bradycardia), no goitre, no cardiovascular disease, no plans for pregnancy.\n\nWhich is the most appropriate management?",
   options:["Start levothyroxine 100 mcg immediately","Do not initiate routine levothyroxine; observe with periodic TFT review","Antithyroid drug","Radioiodine","No follow-up needed"],
   correct:"B",
   explanation:"SUBCLINICAL HYPOTHYROIDISM (SCH): biochemical pattern of MILDLY RAISED TSH with NORMAL FREE T4 (and normal free T3). Common — prevalence increases with age (~10% women >60, lower in men); often discovered incidentally. EVIDENCE BASE for treatment is mixed and IMPORTANT for the SCE: TRUST trial (Stott et al., NEJM 2017): >700 older adults (≥65) with mild SCH (TSH 4.6–19.99, mean 6.4) randomised to levothyroxine vs placebo for 1 year. RESULTS: NO improvement in HYPOTHYROID-SPECIFIC SYMPTOMS, FATIGUE, COGNITION, QUALITY OF LIFE, MUSCLE STRENGTH, BMI, BP, OR LIPIDS.\n\n(A) Immediate full-dose levothyroxine in asymptomatic older adult with TSH <10 contradicts evidence (TRUST).\n\n(C) Antithyroid drugs are for hyperthyroidism — wrong direction entirely.\n\n(D) Radioiodine ablates the thyroid — also for hyperthyroidism, opposite to need here.\n\n(E) No follow-up misses the small chance of progression to overt disease.\n\n💎 PEARL: Older adult + TSH 4–10 + normal T4 + asymptomatic + no ischaemic heart disease + no pregnancy plans = mild SCH — DO NOT routinely treat (TRUST trial, NEJM 2017: no benefit on symptoms, fatigue, cognition, QoL, lipids). Treat if TSH >10, symptomatic, ischaemic heart disease, or pregnancy planning.",
   references:[{label:"BTA Subclinical Hypothyroidism Position Statement", url:"https://www.british-thyroid-association.org/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Amiodarone-induced thyrotoxicosis (type 2)",
   stem:"A 70-year-old man on long-term amiodarone (200 mg daily for 4 years for paroxysmal AF) develops new thyrotoxicosis with weight loss (4 kg in 6 weeks), tachycardia, tremor and anxiety. No previous history of thyroid disease; no eye signs. Investigations: TSH suppressed <0.01, free T4 markedly elevated (52 pmol/L), free T3 elevated. Thyroid doppler ultrasound: reduced or absent vascularity (no hyperaemia). Interleukin-6 elevated. Anti-tpo and trab antibodies negative. Thyroid uptake scan: globally suppressed (consistent with destructive thyroiditis). No pre-existing nodules or goitre.\n\nWhich is the most likely diagnosis?",
   options:["Type 1 amiodarone-induced thyrotoxicosis (iodine-induced hyperthyroidism in pre-existing thyroid disease)","Type 2 amiodarone-induced thyrotoxicosis (destructive thyroiditis)","Hashimoto thyroiditis","Graves disease","Toxic adenoma"],
   correct:"B",
   explanation:"AMIODARONE-INDUCED THYROID DISEASE: amiodarone is highly iodine-rich (~75 mg per 200 mg tablet — provides 6 mg of free iodine daily; physiological intake is ~150 mcg) and accumulates in tissues with very long half-life (~50 days; effects persist months after discontinuation). Easy to manage with LEVOTHYROXINE while continuing amiodarone. TYPE 2 AIT — DESTRUCTIVE THYROIDITIS in a previously NORMAL thyroid; amiodarone DIRECTLY TOXIC to follicular cells → release of preformed hormone; REDUCED OR ABSENT vascularity on Doppler, REDUCED or absent uptake on scan, often raised IL-6 (inflammatory marker); treated with GLUCOCORTICOIDS (prednisolone 40 mg/day, gradually tapered over 3 months).\n\n(A) Type 1 AIT: increased vascularity on Doppler — opposite of this patient.\n\n(C) Hashimoto causes hypothyroidism typically, not thyrotoxicosis (though Hashitoxicosis early phase rare); anti-TPO negative excludes.\n\n(D) Graves: TRAb positive, increased vascularity, eye disease — none here.\n\n(E) Toxic adenoma: focal hot nodule on scan, not relevant to diffuse pathology here.\n\n💎 PEARL: Amiodarone-induced thyrotoxicosis: TYPE 1 (iodine load on pre-existing thyroid disease) → Doppler INCREASED vascularity, treat with carbimazole + perchlorate. TYPE 2 (destructive thyroiditis on previously normal thyroid) → ABSENT vascularity, raised IL-6, treat with PREDNISOLONE 40 mg. Mixed forms common. Decision to stop amiodarone is cardiology call.",
   references:[{label:"BTA Guidelines for Hyperthyroidism (2024)", url:"https://www.british-thyroid-association.org/"},{label:"Society for Endocrinology Emergency Endocrine Guidance", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Type 1 diabetes — structured education",
   stem:"A 28-year-old man with type 1 diabetes is reviewed in the diabetes clinic. He is on multiple daily injections (basal-bolus regimen — insulin glargine once daily plus insulin aspart with meals). HbA1c 72 mmol/mol (suboptimal). He reports difficulty with carbohydrate estimation and dose adjustment, several recent hypoglycaemic episodes (one severe requiring help), and reduced confidence in self-management. He has no significant complications. He has not had structured education since diagnosis 5 years ago.\n\nWhich is the most appropriate intervention?",
   options:["No structured education needed","Refer to a structured education programme (e.g. Dafne for type 1; desmond for type 2) and offer technology support (continuous glucose monitoring, hybrid closed-loop)","Switch to a mixed insulin regimen","Stop insulin","Long-term oral steroid"],
   correct:"B",
   explanation:"STRUCTURED EDUCATION programmes are evidence-based, NICE-recommended interventions that should be offered to ALL adults with diabetes — at diagnosis and periodically thereafter. They IMPROVE clinical outcomes, quality of life, and self-efficacy. TECHNOLOGY: CONTINUOUS GLUCOSE MONITORING (CGM) — now widely funded for ALL adults with type 1 diabetes per NICE NG17 update (Feb 2022 onwards) — sensor measures interstitial glucose, alerts for hypo / hyperglycaemia, allows time-in-range targeting (>70% time 3.9–10 mmol/L is desirable target); reduces severe hypoglycaemia and improves HbA1c (DIAMOND, IMPACT trials); also funded for selected type 2 (those on intensive insulin, frequent hypoglycaemia, problematic disease).\n\n(A) No education denies the patient evidence-based therapy.\n\n(C) Mixed insulin is less flexible — not appropriate for type 1 with high HbA1c needing better control.\n\n(D) Stopping insulin in type 1 = DKA / death.\n\n(E) Steroids worsen glycaemic control.\n\n💎 PEARL: T1DM with suboptimal control + hypoglycaemia: refer to STRUCTURED EDUCATION (DAFNE for T1DM; DESMOND for T2DM) + offer technology — continuous glucose monitoring is now NICE-funded for ALL T1DM (NG17, Feb 2022). Hybrid closed-loop systems further reduce HbA1c and severe hypoglycaemia (CLOuD).",
   references:[{label:"NICE NG17 — Type 1 diabetes in adults (2015, updated)", url:"https://www.nice.org.uk/guidance/ng17"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Inpatient hypoglycaemia — JBDS protocol",
   stem:"A 78-year-old woman with type 2 diabetes on glimepiride 4 mg daily and a fixed-rate IV insulin infusion (5 units/h, started for hyperglycaemic emergency 12 hours ago) is found unresponsive on the ward by night staff. Capillary blood glucose 1.8 mmol/L. She has IV access patent. She has no swallow (GCS 6 — unable to protect airway).\n\nWhich is the most appropriate immediate management?",
   options:["Oral glucose gel under the tongue","Wait and recheck glucose in 15 minutes","100 mL of 20% glucose IV (or 200 mL of 10%)","IV insulin","IV potassium first"],
   correct:"C",
   explanation:"INPATIENT HYPOGLYCAEMIA: a common, dangerous, often preventable complication; associated with prolonged length of stay and inpatient mortality. MANAGEMENT — JBDS PROTOCOL stratified by symptoms / severity / swallow / IV access: (1) CONSCIOUS, ORIENTATED, ABLE TO SWALLOW: 15–20 g FAST-ACTING ORAL GLUCOSE — examples: 4–7 GlucoGel tubes, 200 mL pure (NOT diet) FRUIT JUICE, 5–7 dextrose tablets, 4–5 jelly babies; recheck blood glucose at 10–15 minutes; if still <4.0, REPEAT (up to 3 cycles); ONCE recovered, give LONG-ACTING CARBOHYDRATE (slice of bread, biscuits, glass of milk, normal meal).\n\n(A) Oral glucose gel needs swallow capacity.\n\n(B) Waiting in unconscious hypoglycaemia is unsafe — neuroglycopenia and seizure risk increase rapidly.\n\n(D) IV insulin would worsen hypoglycaemia catastrophically.\n\n(E) Potassium not a treatment for hypoglycaemia; risk of arrhythmia.\n\n💎 PEARL: Inpatient hypoglycaemia + unable to swallow / IV access: 100 mL of 20% glucose IV (or 200 mL of 10%, or 50 mL of 50% — last least preferred). NEVER add insulin to glucose. Recheck at 10–15 min; repeat if still <4. Long-acting carbohydrate once recovered. Identify cause.",
   references:[{label:"JBDS-IP Inpatient Hypoglycaemia Guidance", url:"https://abcd.care/joint-british-diabetes-societies-jbds-inpatient-care-group"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Peri-operative diabetes — VRIII",
   stem:"A 60-year-old man with type 2 diabetes on metformin 1 g BD and a basal-bolus insulin regimen is admitted for emergency laparotomy for small bowel obstruction. He is fasting (NBM since admission 18 hours ago, expected to remain NBM ≥24 hours post-operatively). HbA1c 80 mmol/mol (poor control), current glucose 14 mmol/L, capillary ketones 0.4 mmol/L, eGFR 50, urea 12.\n\nWhich is the most appropriate peri-operative diabetes management?",
   options:["Continue oral hypoglycaemic agents","Variable-rate IV insulin infusion (vriii) with concurrent IV glucose substrate","No insulin during fasting","Stop all insulin","Subcutaneous sliding-scale insulin alone"],
   correct:"B",
   explanation:"PERI-OPERATIVE DIABETES MANAGEMENT — JBDS-IP / Centre for Perioperative Care (CPOC) guideline. Diabetes management around surgery aims to: (1) AVOID hypo- and hyperglycaemia;\n(2) PREVENT DKA in type 1 diabetes (a key safety concern — never omit insulin in T1DM); (3) maintain glucose 6–10 mmol/L (acceptable up to 12); (4) ensure timely safe surgery; (5) facilitate prompt return to usual self-management when recovered. SGLT2 INHIBITORS — STOP at least 3 DAYS before elective surgery, longer for major surgery. DPP-4 inhibitors — generally safe to continue. RATE: 80–100 mL/h (3) Capillary glucose 1–2 hourly when stable, more frequently if labile.\n\n(A) Oral hypoglycaemics in fasting major surgery risks hypoglycaemia, lactic acidosis, euglycaemic DKA.\n\n(C) No insulin in T1DM = DKA; even in T2DM, fasting + hyperglycaemia + ketones requires intervention.\n\n(D) Stop all insulin in T2DM with hyperglycaemia / borderline ketones is wrong — insulin is needed.\n\n(E) Subcutaneous sliding-scale alone is inferior to VRIII in this context.\n\n💎 PEARL: Diabetes + emergency surgery + prolonged NBM (more than one missed meal): VRIII (variable-rate IV insulin infusion) + concurrent IV glucose substrate. NEVER omit insulin in T1DM (DKA risk). Stop SGLT2 inhibitors ≥3 days before elective surgery (euglycaemic DKA risk). Target glucose 6–10 mmol/L.",
   references:[{label:"JBDS-IP Peri-operative Diabetes Guidance", url:"https://abcd.care/joint-british-diabetes-societies-jbds-inpatient-care-group"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Alcohol-induced hypoglycaemia",
   stem:"A 45-year-old man with chronic alcohol misuse (3 bottles of vodka over 4 days, no oral intake) presents drowsy (GCS 11) with capillary glucose 1.6 mmol/L. He is on no insulin or sulfonylurea (no diabetes). Examination: malnourished, BMI 18, ketones on breath. Investigations: ethanol level 350 mg/dL (significantly raised), B12 normal, thiamine status presumed deficient (clinically suggested), no head injury, no infection signs. The on-call team is preparing to give IV glucose.\n\nWhich is the most appropriate immediate management?",
   options:["IV insulin","IV thiamine (Pabrinex) before giving glucose, then IV glucose; sustain with 10% glucose infusion","IV glucagon as first-line","Wait and observe","IV potassium first"],
   correct:"B",
   explanation:"ALCOHOL-INDUCED HYPOGLYCAEMIA: a serious and often missed cause of severe hypoglycaemia in patients with alcohol misuse. RISK: malnutrition, prolonged fasting + binge drinking (this patient — classic), liver disease, intercurrent illness. \n\nPRESENTATION: from confusion through coma; often misattributed to intoxication itself; CHECK GLUCOSE in any unconscious patient with alcohol misuse. Wernicke is significantly UNDER-RECOGNISED and under-treated. MANAGEMENT — SEQUENCE MATTERS: (1) IV THIAMINE FIRST: PABRINEX 1+2 — UK standard; OR thiamine 200–500 mg IV TID. (2) IV GLUCOSE: typically 100 mL of 20% glucose (or 50 mL of 50%, or 200 mL of 10%). RECHECK glucose at 10–15 minutes.\n\n(A) Insulin would WORSEN hypoglycaemia.\n\n(C) Glucagon ineffective without glycogen stores.\n\n(D) Waiting risks prolonged neuroglycopenia and Wernicke / death.\n\n(E) Potassium not first-line for hypoglycaemia.\n\n💎 PEARL: Chronic alcohol misuse + binge + fasting + hypoglycaemia: IV THIAMINE (Pabrinex) FIRST, then IV glucose. Reverse order risks precipitating Wernicke encephalopathy. 10% glucose infusion to sustain. Always check glucose in any unconscious patient with alcohol misuse — never assume intoxication alone.",
   references:[{label:"JBDS-IP Inpatient Hypoglycaemia Guidance", url:"https://abcd.care/joint-british-diabetes-societies-jbds-inpatient-care-group"},{label:"NICE CG100 — Alcohol-use disorders: physical complications", url:"https://www.nice.org.uk/guidance/cg100"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Macroprolactinoma — first-line therapy",
   stem:"A 38-year-old man has 6 months of progressive bitemporal visual field loss (worse on confrontation in superior temporal quadrants bilaterally), low libido, erectile dysfunction, fatigue, and a 6-month headache. No exogenous medications causing hyperprolactinaemia. Prolactin 8000 mU/L (markedly raised; >5000 highly suggestive of true prolactinoma rather than 'stalk effect'); other anterior pituitary hormones suppressed (low testosterone, low LH/FSH, free T4 low, 9 am cortisol low). Visual fields confirm bitemporal hemianopia.\n\nWhich is the most appropriate first-line treatment?",
   options:["Urgent transsphenoidal surgery","Dopamine agonist (cabergoline) as first-line","Stereotactic radiotherapy","Long-term prednisolone","Aspirin"],
   correct:"B",
   explanation:"PROLACTINOMA: the MOST COMMON pituitary adenoma (~40% of pituitary tumours). Classification by SIZE: MICROPROLACTINOMA <10 mm; MACROPROLACTINOMA ≥10 mm. DOPAMINE AGONIST CHOICES: CABERGOLINE — preferred; start 0.5 mg twice weekly, titrate to prolactin response; BROMOCRIPTINE — older, BD/TID dosing, more side effects but cheaper; QUINAGOLIDE — alternative. VALVULAR HEART DISEASE — high-dose cabergoline (e.g. for Parkinson's) associated with valvular regurgitation; dose used for prolactinoma is much lower, but echocardiogram surveillance recommended for prolonged use at higher doses (>3 mg/week). MONITORING: prolactin at 4–6 weeks, then 3–6 monthly; MRI at 6 months, then annually if responding.\n\n(A) Surgery as first-line is wrong; medical therapy preferred.\n\n(C) Radiotherapy is third-line.\n\n(D) Steroids treat nothing here.\n\n(E) Aspirin irrelevant.\n\n💎 PEARL: Macroprolactinoma + chiasmal compression: DOPAMINE AGONIST (cabergoline) is FIRST-LINE — even with visual loss; tumour shrinkage with cabergoline restores vision in ~80%. Surgery only for cabergoline failure, intolerance, or apoplexy. Echo monitoring for cabergoline use at higher doses.",
   references:[{label:"Endocrine Society Hyperprolactinaemia Guideline (2011)", url:"https://academic.oup.com/jcem/article/96/2/273/2709485"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Type 1 diabetes — sick day rules",
   stem:"A 25-year-old man with type 1 diabetes (on multiple daily injections — insulin glargine 24 units nocte + insulin aspart with meals) telephones the diabetes specialist nurse helpline. He has a 24-hour viral illness with reduced appetite, intermittent vomiting (twice in the past 8 hours), and feels unwell but not severely so. He has reduced his insulin doses substantially because he is eating less and is worried about hypoglycaemia. He has not checked ketones (no meter at home).\n\nWhich is the most appropriate advice?",
   options:["Stop insulin entirely while eating less","Never stop insulin — check capillary glucose and blood ketones every 2–4 hours, take supplemental rapid-acting insulin if ketones rising, maintain hydration, escalate if unwell","Increase oral hypoglycaemic","Reduce both food and insulin proportionally","Aspirin"],
   correct:"B",
   explanation:"TYPE 1 DIABETES SICK DAY RULES: critical patient education to PREVENT DKA — diabetes UK / JBDS-IP / NICE NG17 / TREND-UK and ABCD guidelines. CORE RULES (5 'S's used in some patient education): SUGAR — monitor capillary glucose every 2–4 hours; KETONES — check blood ketones every 2–4 hours (preferred over urine ketones — more accurate, real-time, identifies trend); SICK DAY DOSE — never stop insulin, often need MORE; SUSTAIN HYDRATION — sugary fluids if not eating, water / clear fluids; SEEK HELP — clear escalation triggers.\n\n(A) Stopping insulin precipitates DKA — fatal, the leading avoidable error in T1DM management.\n\n(C) Oral hypoglycaemics ineffective in T1DM and not relevant here.\n\n(D) Reducing both food and insulin proportionally fails to account for stress-hormone-driven insulin resistance during illness.\n\n(E) Aspirin no role.\n\n💎 PEARL: T1DM sick day rules: NEVER STOP INSULIN (often need MORE — illness raises requirements). Check capillary glucose AND ketones every 2–4 hours. Maintain hydration. Take supplemental rapid-acting if ketones rising. Escalate if vomiting, ketones >3, glucose unmanageable, or dehydration.",
   references:[{label:"NICE NG17 — Type 1 diabetes in adults (2015, updated)", url:"https://www.nice.org.uk/guidance/ng17"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Multiple endocrine neoplasia — MEN2A",
   stem:"A 32-year-old man with newly diagnosed primary hyperparathyroidism (calcium 2.95 mmol/L, PTH inappropriately raised; 4-gland multiglandular parathyroid hyperplasia at parathyroidectomy — not a single adenoma) has a striking family history: his father died at 35 from 'a thyroid cancer' (medullary thyroid carcinoma on retrospective review), and a paternal uncle had hypertension and underwent adrenal surgery (right adrenalectomy) at age 40 (presumed phaeochromocytoma). The patient himself has had no other significant illness. Plasma metanephrines: pending; calcitonin: pending.\n\nWhich is the most likely underlying syndrome?",
   options:["Familial isolated hyperparathyroidism","Multiple endocrine neoplasia type 2A (MEN2A)","Primary aldosteronism","Cushing syndrome","Sporadic disease — no syndrome"],
   correct:"B",
   explanation:"MULTIPLE ENDOCRINE NEOPLASIA (MEN) syndromes: AUTOSOMAL DOMINANT cancer-predisposition syndromes affecting multiple endocrine glands. FEATURES: MTC — earlier and MORE AGGRESSIVE than MEN2A (often present at <10 years); PHAEOCHROMOCYTOMA — same as MEN2A; MUCOSAL NEUROMAS (lips, tongue); MARFANOID HABITUS; intestinal ganglioneuromatosis; NO PARATHYROID involvement (key differentiator from MEN2A).\n\n(A) Familial isolated HPT exists (HRPT2 / CDC73 mutations, often with parathyroid carcinoma) but doesn't explain the family history.\n\n(C) Conn's: aldosterone-driven hypertension and hypokalaemia, not in this family pattern.\n\n(D) Cushing's: cortisol excess, different pattern.\n\n(E) Sporadic: doesn't account for striking family history.\n\n💎 PEARL: Medullary thyroid cancer + phaeochromocytoma + primary hyperparathyroidism (4-gland hyperplasia) = MEN2A (RET proto-oncogene). MEN2B = MTC + phaeo + mucosal neuromas + Marfanoid habitus + intestinal ganglioneuromatosis (NO parathyroid disease). Genetic testing for index case + cascade family. Prophylactic thyroidectomy in childhood for affected RET carriers.",
   references:[{label:"Endocrine Society MEN Position Paper", url:"https://academic.oup.com/jcem/"}]},

  {section:"endocrine", specialty:"Endocrinology", topic:"Thyroid nodule — BTA U5 classification",
   stem:"A 50-year-old woman has an incidental 2.5 cm right thyroid nodule discovered on cervical ultrasound performed for unrelated reasons (carotid symptoms, normal carotid Doppler). TSH is normal; free T4 normal. Ultrasound features: solid hypoechoic nodule with irregular margins, microcalcifications, taller-than-wide shape, and possible breach of the thyroid capsule. Two enlarged lymph nodes in level IV with abnormal architecture (loss of fatty hilum, microcalcifications). British Thyroid Association U classification: U5 (highly suspicious for malignancy).\n\nWhich is the most appropriate next step?",
   options:["Discharge — likely benign","Fine-needle aspiration cytology of the nodule and the suspicious lymph nodes; refer to MDT","TFTs only and reassure","Long-term levothyroxine","Aspirin"],
   correct:"B",
   explanation:"THYROID NODULES are COMMON (incidental finding in ~50% of adults on imaging). Priority is identifying the small minority (~5%) that are MALIGNANT. If TSH NORMAL or RAISED, proceed to ULTRASOUND-BASED RISK STRATIFICATION (this patient). U3, U4, U5 → FINE-NEEDLE ASPIRATION CYTOLOGY (FNAC); U1, U2 → no FNAC, follow up clinically. MULTIDISCIPLINARY thyroid cancer team: endocrinology, ENT / head and neck surgery, oncology, pathology, radiology, nuclear medicine. PROGNOSIS: DIFFERENTIATED thyroid cancer >95% 10-year survival; medullary depends on stage and CALCITONIN response; anaplastic <1 year median survival; lymphoma good response to chemo / radiotherapy if MALT-type.\n\n(A) Discharge of U5 nodule unsafe.\n\n(C) TFTs alone insufficient — risk of malignancy is high with U5 features.\n\n(D) Levothyroxine doesn't shrink nodules and risks osteoporosis / AF — no longer used for nodule suppression.\n\n(E) Aspirin not relevant.\n\n💎 PEARL: Thyroid nodule U3–U5 (suspicious ultrasound features — solid hypoechoic, irregular margins, microcalcifications, taller-than-wide, capsule breach) → fine-needle aspiration cytology + suspicious lymph nodes. MDT referral. Differentiated thyroid cancer >95% 10-year survival; total thyroidectomy ± radioactive iodine + TSH suppression.",
   references:[{label:"BTA Thyroid Nodule Guidelines (U classification)", url:"https://www.british-thyroid-association.org/"},{label:"ATA Thyroid Nodule and DTC Guidelines (2015)", url:"https://www.liebertpub.com/doi/10.1089/thy.2015.0020"}]},

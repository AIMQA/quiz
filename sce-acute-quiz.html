   explanation:"Ulcerative colitis: a relapsing-remitting inflammatory bowel disease characterised by CONTINUOUS mucosal inflammation starting at the rectum and extending proximally to a defined transition point. Histology shows mucosal-only inflammation with crypt distortion, crypt abscesses, and goblet cell depletion — and importantly NO granulomas. Extra-intestinal manifestations: arthropathy (peripheral, axial), erythema nodosum, pyoderma gangrenosum, anterior uveitis, primary sclerosing cholangitis. Management: induction with topical / oral 5-ASA (mesalazine) for mild-moderate disease; corticosteroids for moderate-severe flares; biologics (anti-TNF, vedolizumab, ustekinumab) and JAK inhibitors (tofacitinib, upadacitinib) for refractory disease; colectomy in severe / treatment-resistant disease or dysplasia. Surveillance colonoscopy (long-standing extensive UC carries colorectal cancer risk).\n\n(A) Crohn's disease typically shows skip lesions, transmural inflammation, granulomas, terminal ileal involvement, fistulae and perianal disease — none described here.\n\n(C) Ischaemic colitis: older patients, sudden onset, watershed-area distribution (splenic flexure), thumb-printing on imaging; histology shows mucosal infarction, not chronic crypt distortion.\n\n(D) Pseudomembranous colitis: C. difficile toxin-mediated; pseudomembranes on endoscopy; toxin-positive (negative here).\n\n(E) Microscopic colitis: chronic watery non-bloody diarrhoea; macroscopically normal mucosa; histology shows lymphocytic or collagenous infiltration — does not produce ulceration or bloody stools.\n\n💎 PEARL: Continuous mucosal inflammation from rectum proximally + crypt distortion + crypt abscesses + NO granulomas = ulcerative colitis. Rectum is always involved. Smoking is mildly PROTECTIVE in UC (opposite of Crohn's). Look for PSC and other extra-intestinal manifestations.",
   references:[{label:"NICE NG130 — Ulcerative colitis (2019)", url:"https://www.nice.org.uk/guidance/ng130"},{label:"BSG IBD Guidelines (2019)", url:"https://www.bsg.org.uk/clinical-resource/bsg-consensus-guidelines-on-the-management-of-inflammatory-bowel-disease-in-adults/"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Primary sclerosing cholangitis",
   stem:"A 56-year-old man with a 10-year history of ulcerative colitis presents with 4 months of progressive jaundice, fatigue, weight loss and steatorrhoea. ALP markedly elevated, GGT raised, bilirubin 60 µmol/L, transaminases mildly raised. P-ANCA positive. IgG4 normal.\n\nWhich is the most likely diagnosis?",
   options:["Primary biliary cholangitis","Primary sclerosing cholangitis","IgG4-related sclerosing cholangitis","Cholangiocarcinoma","Autoimmune hepatitis"],
   correct:"B",
   explanation:"Primary sclerosing cholangitis (PSC): chronic progressive cholestatic disease with multifocal intra- and extrahepatic biliary stricturing. Diagnosis: MRCP showing the classic 'beaded' appearance (alternating strictures and dilatations) with cholestatic LFTs (predominant ALP rise). PSC is strongly associated with inflammatory bowel disease, particularly ulcerative colitis (~70–80% of PSC patients have IBD); p-ANCA positive in ~70%. Markedly increased risk of cholangiocarcinoma (annual incidence ~1–2% of patients) — surveillance is essential. Liver transplantation for advanced disease (no medical therapy alters disease progression — ursodeoxycholic acid does not change long-term outcomes).\n\n(A) PBC is typically a middle-aged woman with cholestatic LFTs, anti-mitochondrial antibody (AMA) positive in ~95%, and isolated INTRAhepatic small-duct disease (NOT extrahepatic strictures); IBD association is uncommon.\n\n(C) IgG4-related sclerosing cholangitis can mimic PSC clinically and on imaging but has elevated serum IgG4 (>2× ULN) and IgG4-positive lymphoplasmacytic infiltrate on biopsy; responds to steroids — this patient has normal IgG4.\n\n(D) Cholangiocarcinoma can develop on the background of PSC, but typically presents as a focal stricture rather than the diffuse multifocal beading; staging imaging would identify a mass.\n\n(E) Autoimmune hepatitis is a hepatocellular pattern (transaminase rise > ALP rise) with positive ANA / anti-smooth-muscle / anti-LKM1, raised IgG, and interface hepatitis on biopsy — different LFT pattern and no biliary strictures.\n\n💎 PEARL: UC + cholestatic LFTs (predominant ALP rise) + 'beaded' biliary strictures on MRCP + p-ANCA = primary sclerosing cholangitis. ~70–80% of PSC patients have IBD. Cholangiocarcinoma risk ~1–2%/year — surveillance essential. UDCA does NOT alter outcomes; transplant for advanced disease.",
   references:[{label:"BSG/UK-PSC Guidelines on Management of PSC (Gut 2019)", url:"https://www.bsg.org.uk/clinical-resource/uk-psc-bsg-clinical-guidelines-on-the-management-of-primary-sclerosing-cholangitis/"},{label:"EASL Sclerosing Cholangitis Guidelines (2022)", url:"https://easl.eu/publication/easl-clinical-practice-guidelines-on-sclerosing-cholangitis/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Giardiasis — diagnosis",
   stem:"A 28-year-old man returns from a 3-week hiking trip in northern Pakistan. He has 3 weeks of foul-smelling, bulky, pale stools that float, with bloating, flatulence and 4 kg weight loss. No fever, no blood in the stool. Stool microscopy: pear-shaped flagellated trophozoites with two nuclei.\n\nWhich is the most likely diagnosis?",
   options:["Cryptosporidium","Giardia lamblia","Entamoeba histolytica","Strongyloides stercoralis","Cyclospora cayetanensis"],
   correct:"B",
   explanation:"Giardia lamblia (Giardia duodenalis): protozoan transmitted by faecally contaminated water (classic in returning travellers, hikers, day-care). Mechanism: trophozoites colonise the duodenum and jejunum, blunt the villi, and cause malabsorption (especially of fat — explaining the foul-smelling steatorrhoea, weight loss and bulky pale floating stools) and lactose intolerance. Diagnosis: pear-shaped binucleate trophozoites or oval cysts with four nuclei on stool microscopy (often need three samples — intermittent shedding); stool antigen / PCR tests have higher sensitivity. Treatment: metronidazole (5 days) or single-dose tinidazole; nitazoxanide is an alternative.\n\n(A) Cryptosporidium causes watery (not steatorrhoeic) diarrhoea, often self-limiting in immunocompetent patients but severe in HIV; oocysts on modified Ziehl-Neelsen — different morphology.\n\n(C) Entamoeba histolytica typically causes bloody dysentery with mucus or invasive amoebic liver abscess; trophozoites contain ingested red cells.\n\n(D) Strongyloides causes chronic eosinophilia, abdominal pain, cutaneous larva currens, and risk of disseminated infection in the immunosuppressed; larvae visible on stool / serology.\n\n(E) Cyclospora cayetanensis causes prolonged watery diarrhoea after travel (especially Nepal, Peru, fresh produce); oocysts autofluoresce — different microscopy.\n\n💎 PEARL: Returning traveller/hiker + ≥3 weeks of foul-smelling, bulky, pale, floating stools + bloating + weight loss + pear-shaped binucleate trophozoites on stool micro = giardiasis. Metronidazole 5 days OR single-dose tinidazole. Stool antigen/PCR more sensitive than microscopy.",
   references:[{label:"BSG Diarrhoea Investigation Guidelines (Gut 2018)", url:"https://www.bsg.org.uk/clinical-resource/diagnosis-investigation-management-of-acute-non-infective-diarrhoea/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Barrett's oesophagus — surveillance",
   stem:"A 48-year-old man with a 12-year history of reflux symptoms on long-term PPI has an OGD that shows a 4 cm tongue of salmon-coloured mucosa above the gastro-oesophageal junction. Quadrantic Seattle-protocol biopsies confirm columnar-lined oesophagus with goblet cells (intestinal metaplasia) and no dysplasia. He is otherwise asymptomatic.\n\nWhich is the most appropriate management?",
   options:["Discharge — no further endoscopic follow-up needed","Repeat endoscopy with quadrantic biopsies in 3–5 years","Endoscopic mucosal resection","Radiofrequency ablation now","Refer for oesophagectomy"],
   correct:"B",
   explanation:"BSG / NICE Barrett's oesophagus surveillance. Long-segment Barrett's (≥3 cm) without dysplasia: endoscopic surveillance every 3–5 years with Seattle-protocol biopsies (quadrantic biopsies every 2 cm plus targeted biopsies of any visible lesions). Short-segment Barrett's (<3 cm) without intestinal metaplasia: discharge or 5-year surveillance per BSG. Long-term PPI to reduce reflux exposure. Lifestyle measures (weight loss, smoking cessation, reduced alcohol). Endoscopic therapy is reserved for confirmed dysplasia or early neoplasia: endoscopic mucosal resection (EMR) for visible lesions, radiofrequency ablation (RFA) for flat dysplasia (low-grade or high-grade) — typically combined treatment. Surgical oesophagectomy reserved for invasive (T1b+) disease unsuitable for endoscopic therapy.\n\n(A) Long-segment Barrett's carries a small but real cancer risk (~0.3% per year for non-dysplastic disease) — surveillance is justified.\n\n(C) EMR is for visible lesions or nodular dysplasia — not for flat non-dysplastic Barrett's.\n\n(D) RFA is for confirmed dysplasia — premature in non-dysplastic disease (no proven benefit; procedural risk).\n\n(E) Oesophagectomy is for invasive cancer or unresectable high-grade dysplasia where endoscopic therapy is not feasible — disproportionate here.\n\n💎 PEARL: Long-segment Barrett's (≥3 cm) without dysplasia: surveillance every 3–5 years with Seattle-protocol biopsies (quadrantic every 2 cm + targeted). Confirmed dysplasia → endoscopic therapy (EMR for visible lesions + RFA for flat dysplasia). Long-term PPI to reduce reflux.",
   references:[{label:"BSG Barrett's Oesophagus Guidelines (Gut 2014, updated)", url:"https://www.bsg.org.uk/clinical-resource/bsg-guidelines-on-the-diagnosis-and-management-of-barretts-oesophagus/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Suspected variceal UGI bleed — initial management",
   stem:"A 58-year-old man with known alcoholic cirrhosis presents with massive haematemesis and melaena. BP 88/52, HR 122, Hb 78 g/L, urea 14 mmol/L, INR 1.6. Spider naevi and ascites are present. Glasgow-Blatchford 15. Which combination should be initiated immediately, before endoscopy?",
   options:["IV PPI alone","Crystalloid resuscitation, blood transfusion (target Hb 70–80), terlipressin and prophylactic broad-spectrum antibiotics, then OGD within 12 hours","IV tranexamic acid alone","FFP and platelets only","Watchful waiting and routine outpatient endoscopy"],
   correct:"B",
   explanation:"Suspected variceal bleed in cirrhosis: terlipressin (or octreotide) PLUS prophylactic broad-spectrum antibiotics (e.g. ceftriaxone) BEFORE endoscopy improves outcomes — antibiotics independently reduce mortality, infection and rebleeding (Cochrane). Restrictive transfusion (Hb 70 g/L target, 80 if cardiovascular disease — Villanueva 2013). Urgent OGD within 12 hours for variceal band ligation; rescue with TIPS if refractory.\n\n(A) IV PPI is appropriate for non-variceal causes (peptic ulcer); does not address variceal bleeding.\n\n(C) Tranexamic acid is NOT recommended in UGI bleeding — HALT-IT showed no mortality benefit and increased VTE risk.\n\n(D) FFP and platelets only correct severe coagulopathy or thrombocytopenia and risk overload; they do not stop variceal bleeding.\n\n(E) Outpatient management risks exsanguination — this is a medical emergency.\n\n💎 PEARL: Suspected variceal bleed: terlipressin + prophylactic broad-spectrum antibiotics (e.g. ceftriaxone) BEFORE endoscopy — antibiotics independently reduce mortality. Restrictive transfusion (Hb 70–80). OGD <12 h. Tranexamic acid does NOT help (HALT-IT trial).",
   references:[{label:"BSG UK Variceal Haemorrhage Guidelines (2015)", url:"https://www.bsg.org.uk/clinical-resource/uk-guidelines-on-the-management-of-variceal-haemorrhage-in-cirrhotic-patients/"},{label:"Baveno VII Consensus (J Hepatol 2022)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(21)02299-6/fulltext"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Variceal bleed — secondary prevention",
   stem:"A 56-year-old man with alcohol-related cirrhosis (Child-Pugh B, MELD 14) has just survived his first variceal bleed; bands were placed at endoscopy 48 hours ago. He is now haemodynamically stable, alert, eating normally and ready for discharge. He is not on any antithrombotic therapy.\n\nWhich is the most appropriate strategy to reduce the risk of rebleeding?",
   options:["Aspirin 75 mg daily","Non-selective beta-blocker (carvedilol or propranolol) plus scheduled endoscopic band ligation until varices are eradicated","Long-term oral PPI alone","Statin therapy alone","No further treatment needed"],
   correct:"B",
   explanation:"After a first variceal bleed, the rebleed risk is high (60–70% within 1 year without secondary prevention). Standard secondary prevention combines a non-selective beta-blocker (carvedilol preferred where tolerated, alternatively propranolol — titrated to HR 55–60 or maximum tolerated) with serial endoscopic band ligation every 2–4 weeks until varices are eradicated, then surveillance. NSBBs reduce portal pressure (HVPG ≥20% reduction or absolute <12 mmHg correlates with reduced rebleeding). Avoid NSAIDs (renal and bleeding risk). Pre-emptive 'early' TIPS within 72 hours is considered for high-risk patients (Child-Pugh C up to 13, or B with active bleeding at endoscopy — García-Pagán 2010).\n\n(A) Aspirin would increase rebleed risk without offsetting benefit in cirrhosis.\n\n(C) PPI alone reduces post-banding ulcer bleeding (typically given for 2–4 weeks after banding) but does not prevent variceal rebleeding.\n\n(D) Statin therapy is increasingly recognised as having pleiotropic benefits in cirrhosis (some HVPG reduction) but is adjunctive — not standard first-line secondary prevention.\n\n(E) Without secondary prevention, rebleed risk is unacceptably high.\n\n💎 PEARL: After first variceal bleed, rebleed risk is 60–70% at 1 year. Secondary prevention = non-selective beta-blocker (carvedilol preferred, titrate HR 55–60) PLUS serial band ligation every 2–4 weeks until varices eradicated. Pre-emptive TIPS within 72 h for high-risk (Child-Pugh C up to 13).",
   references:[{label:"BSG UK Variceal Haemorrhage Guidelines (2015)", url:"https://www.bsg.org.uk/clinical-resource/uk-guidelines-on-the-management-of-variceal-haemorrhage-in-cirrhotic-patients/"},{label:"Baveno VII Consensus (2022, J Hepatol)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(21)02299-6/fulltext"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Acute pancreatitis — severity assessment",
   stem:"A 60-year-old man presents with 2 days of severe epigastric pain radiating to the back. Lipase 1200 U/L. Glasgow-Imrie score within 48 hours: PaO₂ 7.6 kPa (1), age >55 (1), WCC 16 (1), calcium 1.96 mmol/L (1), urea 16 mmol/L (1), LDH 800 (1), albumin 24 g/L (1), glucose 11 mmol/L (1). CRP 250.\n\nWhich is the correct severity classification and disposition?",
   options:["Mild — discharge with safety-netting","Moderate — short-stay ward observation","Severe — Glasgow-Imrie ≥3, refer to HDU/ICU","Acute on chronic — minimal intervention","Diagnosis incorrect — repeat lipase"],
   correct:"C",
   explanation:"Glasgow-Imrie score ≥3 within 48 hours of admission indicates severe acute pancreatitis. He scores 8/8. Other validated severity scores: APACHE II (≥8), BISAP (≥3), CTSI (Balthazar). Management: aggressive isotonic crystalloid; early adequate analgesia; HDU / ICU referral; identify aetiology (gallstones, alcohol, post-ERCP, drugs, hypertriglyceridaemia, hypercalcaemia, autoimmune); urgent ERCP only if cholangitis (NOT for sterile necrosis). Antibiotics for documented infection only — prophylactic antibiotics are not recommended. CECT 72+ hours after onset to assess for necrosis (earlier imaging underestimates extent). Late drainage / debridement of infected necrosis.\n\n(A) Mild pancreatitis (Glasgow <3) with full recovery may allow discharge — this patient scores 8 with multiple deranged values.\n\n(B) Severity ≥3 mandates HDU/ICU not ward observation.\n\n(D) 'Acute on chronic' is rare — chronic pancreatitis presents with chronic abdominal pain, calcifications, exocrine/endocrine insufficiency; an acute severe episode still requires acute management.\n\n(E) Lipase 1200 (>3× ULN) with classical symptoms is diagnostic — repeat does not change management.\n\n💎 PEARL: Severe acute pancreatitis: Glasgow-Imrie ≥3 within 48 hours, OR APACHE II ≥8, OR BISAP ≥3. HDU/ICU; aggressive isotonic crystalloid; CECT 72+ hours after onset (earlier underestimates necrosis). Antibiotics ONLY for documented infection. ERCP only for cholangitis, NOT for sterile necrosis.",
   references:[{label:"BSG/UK Guidelines on Acute Pancreatitis (2005, updated)", url:"https://www.bsg.org.uk/"},{label:"IAP/APA Acute Pancreatitis Guidelines (2013)", url:"https://www.pancreatology.net/article/S1424-3903(13)00400-7/abstract"},{label:"ACG Acute Pancreatitis Guideline (2024)", url:"https://journals.lww.com/ajg/fulltext/2024/03000/acg_clinical_guideline__management_of_acute.10.aspx"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Clostridioides difficile — first non-severe episode",
   stem:"A 75-year-old woman has 10 days of watery diarrhoea (>6 stools/day) following a 5-day course of co-amoxiclav for a chest infection. Stool C. difficile toxin A/B PCR positive. Mild abdominal pain, no rigors, T 37.4. WCC 9.5, creatinine 80 (baseline 75), lactate normal. Examination: soft abdomen, no peritonism.\n\nWhich is the most appropriate treatment?",
   options:["Stop the offending antibiotic; oral vancomycin 125 mg four times daily for 10 days","Oral metronidazole 400 mg three times daily for 14 days","IV vancomycin","Faecal microbiota transplantation","Continue current antibiotic regimen and add IV ciprofloxacin"],
   correct:"A",
   explanation:"NICE NG199 / IDSA / ESCMID for first-episode non-severe Clostridioides difficile infection: oral vancomycin 125 mg four times daily for 10 days is preferred first-line — superior to metronidazole for cure and lower recurrence rates. Oral fidaxomicin (200 mg BD for 10 days) is an alternative with lower recurrence (especially relevant for recurrent CDI) but is more expensive. Stop the offending broad-spectrum antibiotic where possible. Severe CDI (any of: WCC ≥15, creatinine ≥1.5× baseline, severe colitis on imaging) — same regimen, monitor closely; surgery for fulminant disease (toxic megacolon, perforation, refractory shock).\n\n(B) Metronidazole is no longer first-line for CDI — inferior outcomes; reserved for resource-limited settings or as adjunct in fulminant disease.\n\n(C) IV vancomycin is INEFFECTIVE for CDI — vancomycin must be given orally to reach the colon; reserved for ileus or severe colitis as adjunctive intracolonic therapy.\n\n(D) FMT is for recurrent CDI (typically after ≥2 recurrences) — not first episode.\n\n(E) Continuing the precipitating antibiotic and adding ciprofloxacin (high-CDI-risk antibiotic) would worsen the disease.\n\n💎 PEARL: First non-severe CDI: oral vancomycin 125 mg QDS for 10 days first-line (NICE/IDSA — superior to metronidazole, fewer recurrences). Stop offending broad-spectrum antibiotic. Fidaxomicin alternative (lower recurrence — relevant for recurrent disease).",
   references:[{label:"NICE NG199 — Clostridioides difficile infection: antimicrobial prescribing (2021)", url:"https://www.nice.org.uk/guidance/ng199"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Acute severe ulcerative colitis (Truelove-Witts)",
   stem:"A 24-year-old woman with known ulcerative colitis presents with 12 bloody stools per day, abdominal tenderness, fever 38.4°C, HR 110, Hb 96 g/L, CRP 142, albumin 26 g/L. Plain abdominal X-ray: transverse colon diameter 5.5 cm. CT: pancolitis without perforation. Stool C. difficile / CMV negative.\n\nWhich is the most appropriate immediate management?",
   options:["Oral prednisolone 40 mg daily","IV hydrocortisone 100 mg four times daily, VTE prophylaxis, daily AXR, surgical review, day-3 reassessment","Sulfasalazine alone","Immediate emergency colectomy","Mesalazine alone"],
   correct:"B",
   explanation:"Acute severe UC (Truelove-Witts criteria — ≥6 bloody stools/day plus any of: HR >90, T >37.8, Hb <105, ESR >30 / CRP >30) — medical emergency requiring inpatient management. IV hydrocortisone 100 mg QDS is first-line (or IV methylprednisolone). Concurrent VTE prophylaxis (despite bleeding — IBD flare carries very high VTE risk; LMWH is safe). Daily AXR to monitor for toxic megacolon (transverse colon ≥5.5 cm or caecum ≥9 cm — already developing here). Exclude infection (C. difficile, CMV). Surgical review on admission. Total parenteral nutrition is not indicated in colitis (bowel rest is not therapeutic in UC, unlike Crohn's).\n\n(A) Oral prednisolone is for moderate flares — inadequate for severe disease (poor absorption in active colitis).\n\n(C) Sulfasalazine / 5-ASA are NOT for severe flares — induction inadequate.\n\n(D) Immediate colectomy without medical trial is reserved for perforation, free intra-abdominal pus, or refractory toxic megacolon — many patients respond to medical therapy.\n\n(E) Mesalazine alone is for mild-moderate disease only.\n\n💎 PEARL: Acute severe UC (Truelove-Witts: ≥6 bloody stools/day + any of HR>90, T>37.8, Hb<105, ESR>30/CRP>30): IV hydrocortisone 100 mg QDS, VTE prophylaxis (despite bleeding — IBD flare carries very high VTE risk), daily AXR for toxic megacolon, surgical review, day-3 reassessment.",
   references:[{label:"NICE NG130 — Ulcerative colitis (2019)", url:"https://www.nice.org.uk/guidance/ng130"},{label:"BSG IBD Guidelines (2019)", url:"https://www.bsg.org.uk/clinical-resource/bsg-consensus-guidelines-on-the-management-of-inflammatory-bowel-disease-in-adults/"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Spontaneous bacterial peritonitis",
   stem:"A 58-year-old man with alcohol-related cirrhosis (Child-Pugh B) is admitted with new confusion, abdominal pain and fever 38.2°C. Examination: tense ascites, mild abdominal tenderness, no rebound. Urgent diagnostic ascitic tap: PMN count 480 cells/mm³, no organisms on Gram stain (cultures pending). Bloods: Na⁺ 128, creatinine 110 (baseline 75), bilirubin 80, INR 1.6.\n\nWhich is the most appropriate management?",
   options:["Urgent CT abdomen first to look for pancreatitis","IV cefotaxime plus 20% IV human albumin solution","Watch and wait for ascitic culture results","Diagnose hepatocellular carcinoma — refer for transplant workup","IV hydrocortisone alone"],
   correct:"B",
   explanation:"Spontaneous bacterial peritonitis (SBP) is diagnosed on ascitic neutrophil count ≥250 cells/mm³, irrespective of Gram stain or culture (cultures are negative in 30–50%). Empirical IV third-generation cephalosporin (cefotaxime 2 g TDS) — start within hours; piperacillin-tazobactam if recent quinolone exposure or hospital-acquired SBP; carbapenem for ESBL-producing organisms or critical illness. CRITICAL ADJUNCT: 20% human albumin infusion 1.5 g/kg on day 1 and 1 g/kg on day 3 reduces hepatorenal syndrome and mortality (Sort 1999) — classic SCE point. Concurrent hepatic encephalopathy: lactulose, treat precipitants. Long-term oral norfloxacin / ciprofloxacin prophylaxis after recovery.\n\n(A) CT delays definitive antibiotic treatment in confirmed SBP — the diagnosis is biochemical (ascitic neutrophils) not radiological.\n\n(C) Cultures are negative in many SBP cases; treatment must not wait for results — empirical therapy starts on diagnosis.\n\n(D) HCC is a chronic surveillance issue (6-monthly USS + AFP) — not an acute presentation with confusion + raised ascitic neutrophils.\n\n(E) Hydrocortisone has no role in SBP — would worsen infection.\n\n💎 PEARL: SBP = ascitic neutrophil count ≥250/mm³ regardless of culture (cultures negative in 30–50%). Empirical IV cefotaxime PLUS 20% albumin 1.5 g/kg day 1 + 1 g/kg day 3 (Sort 1999 — reduces hepatorenal syndrome and mortality). Long-term norfloxacin/ciprofloxacin prophylaxis after recovery.",
   references:[{label:"BSG Cirrhosis Guidelines", url:"https://www.bsg.org.uk/clinical-resource/cirrhosis-of-the-liver/"},{label:"EASL Decompensated Cirrhosis Guidelines (2018)", url:"https://easl.eu/publication/easl-clinical-practice-guidelines-management-decompensated-cirrhosis/"}]},

  {section:"gastro", specialty:"Hepatology", topic:"King's College Criteria — non-paracetamol ALF",
   stem:"A 45-year-old woman with subacute jaundice over 4 weeks (idiopathic — extensive workup negative) has progressed to grade 3 hepatic encephalopathy. INR 6.8 (off any anticoagulant), bilirubin 380 µmol/L, creatinine 95 µmol/L, ALT 1200, lactate 2.5. Time from jaundice onset to encephalopathy: 7 days. No paracetamol exposure documented. She is being assessed for emergency liver transplantation. Does she meet the King's College Criteria for liver transplantation?",
   options:["Yes — meets non-paracetamol criteria (INR >6.5)","Yes — but only paracetamol-overdose criteria apply to acute liver failure","No — INR criterion not met","Cannot be assessed without serum creatinine","Cannot be assessed without lactate"],
   correct:"A",
   explanation:"King's College Criteria for emergency liver transplantation in NON-paracetamol acute liver failure: INR >6.5 alone is sufficient, OR three of the following five criteria: (1) age <10 or >40 years; (2) non-A non-B hepatitis or drug-induced aetiology; (3) jaundice-to-encephalopathy interval >7 days; (4) bilirubin >300 µmol/L;\n(5) INR >3.5. She meets the INR >6.5 criterion AND additional criteria (age >40, idiopathic / non-A non-B, jaundice-to-encephalopathy >7 days, bilirubin >300, INR >3.5). PARACETAMOL criteria are different: arterial pH <7.3 (after resuscitation, regardless of encephalopathy grade), OR ALL three of: INR >6.5, creatinine >300 µmol/L, AND grade 3–4 encephalopathy.\n\n(B) Both paracetamol AND non-paracetamol criteria exist — they are different sets, and the non-paracetamol criteria apply here.\n\n(C) INR >6.5 is met (INR 6.8).\n\n(D) Creatinine is required for paracetamol criteria, NOT for non-paracetamol — the INR alone suffices here.\n\n(E) Lactate informs paracetamol prognosis but is not a non-paracetamol KCC component.\n\n💎 PEARL: King's College Criteria for non-paracetamol ALF: INR >6.5 ALONE, OR three of: age <10 or >40, non-A/non-B or drug aetiology, jaundice→encephalopathy >7 days, bilirubin >300, INR >3.5. Paracetamol criteria differ: pH <7.3 alone, OR all of INR >6.5 + creatinine >300 + grade 3–4 encephalopathy.",
   references:[{label:"AASLD Acute Liver Failure Position Paper", url:"https://aasldpubs.onlinelibrary.wiley.com/doi/10.1002/hep.31144"},{label:"Larson et al. — Acetaminophen-induced ALF (Hepatology 2005)", url:"https://aasldpubs.onlinelibrary.wiley.com/doi/10.1002/hep.20948"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Coeliac disease in IgA deficiency",
   stem:"A 32-year-old woman has 6 months of bloating, intermittent diarrhoea and 5 kg weight loss. Hb 102 g/L (microcytic, MCV 72), ferritin 8 µg/L (deficient). Total serum IgA is below the reference range (selective IgA deficiency). Anti-tTG IgG is strongly positive. She has been on a normal gluten-containing diet.\n\nWhich is the most appropriate next step?",
   options:["Stool culture for enteric pathogens","Hydrogen breath test for sibo","Duodenal biopsy on a gluten-containing diet","Empirical gluten-free diet trial","Colonoscopy"],
   correct:"C",
   explanation:"Coeliac disease serology is normally based on IgA antibodies (anti-tissue transglutaminase IgA, anti-endomysial IgA), with concurrent total IgA measurement to exclude selective IgA deficiency (~2% of coeliacs — anti-tTG IgA will be falsely negative). In IgA deficiency, IgG-based serology is used (anti-tTG IgG, anti-deamidated gliadin peptide IgG). The patient must remain on gluten until biopsy. NICE NG20: in selected adults with very high anti-tTG (>10× ULN) plus positive endomysial antibody, biopsy may be omitted, but most adults still require biopsy.\n\n(A) Stool culture is for acute infective diarrhoea — does not investigate the malabsorption picture or iron deficiency.\n\n(B) Hydrogen breath test investigates SIBO or lactose intolerance — does not address the strongly positive serology and iron deficiency pointing to coeliac.\n\n(D) Empirical GFD trial without biopsy is inadequate — diagnosis must be confirmed before lifelong dietary change with social, financial and medical surveillance implications; once gluten-free, biopsy and serology become unreliable.\n\n(E) Colonoscopy investigates lower GI pathology — coeliac disease is small-bowel mucosal disease.\n\n💎 PEARL: Coeliac serology relies on IgA antibodies — selective IgA deficiency (~2% of coeliacs) gives FALSELY NEGATIVE anti-tTG IgA. ALWAYS check total IgA. If deficient → IgG-based serology (anti-tTG IgG, anti-DGP IgG). Patient must remain on a gluten-containing diet for biopsy.",
   references:[{label:"NICE NG20 — Coeliac disease (2015)", url:"https://www.nice.org.uk/guidance/ng20"},{label:"BSG Coeliac Disease Guidelines (2014, Gut)", url:"https://www.bsg.org.uk/clinical-resource/coeliac-disease/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Non-variceal UGI bleed — Glasgow-Blatchford",
   stem:"A 72-year-old man on aspirin and naproxen presents with melaena and one episode of haematemesis. He is alert, BP 110/72 mmHg, HR 92, Hb 96 g/L, urea 12 mmol/L, no syncope, no liver disease. Glasgow-Blatchford score 8.\n\nWhich is the most appropriate management?",
   options:["Outpatient management with oral PPI","Admit; resuscitate; restrictive transfusion (Hb 70 g/L, or 80 if cardiovascular disease); OGD within 24 hours; stop NSAID; test for and eradicate H. Pylori","Crystalloid 3 L stat","Liberal transfusion to Hb 100","CT angiogram first before any other intervention"],
   correct:"B",
   explanation:"NICE CG141 / BSG management of acute upper GI bleed. Glasgow-Blatchford score 0 may permit outpatient management; score ≥1 indicates need for inpatient assessment / intervention. Score 8 is significant — admit. Resuscitation: crystalloid as needed, blood when haemodynamically required. OGD within 24 hours; if a high-risk lesion is found (active bleeding, visible vessel, adherent clot — Forrest Ia–IIb), endoscopic therapy (combination treatment — clips and/or thermal coagulation, with or without adrenaline). Review the indication for aspirin — usually restart within 1–7 days post-bleeding (continued antiplatelet may improve cardiovascular outcomes despite small bleeding risk).\n\n(A) Score 8 is too high for outpatient management.\n\n(C) 3 L crystalloid bolus risks dilutional coagulopathy and hypothermia in active bleeding — judicious resuscitation balanced with blood product use is preferred.\n\n(D) Liberal transfusion to Hb 100 increases mortality and rebleeding (Villanueva).\n\n(E) CT angiogram is for refractory bleeding / unidentified source after endoscopy or for lower GI bleed — endoscopy is the first investigation in UGI bleed.\n\n💎 PEARL: Glasgow-Blatchford ≥1 = admit. Restrictive transfusion (Hb 70 g/L; 80 if cardiovascular disease). OGD within 24 h with combination endoscopic therapy for high-risk lesions (Forrest Ia–IIb). Restart aspirin within 1–7 days post-bleed when CV indication exists.",
   references:[{label:"NICE CG141 — Acute upper GI bleeding (Glasgow-Blatchford)", url:"https://www.nice.org.uk/guidance/cg141"},{label:"Blatchford et al. — Original validation (Lancet 2000)", url:"https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(00)02816-6/fulltext"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Helicobacter pylori — eradication therapy",
   stem:"A 38-year-old man with dyspepsia has an OGD showing a duodenal ulcer (no malignancy on biopsy). H. Pylori urea breath test is positive. He has no penicillin allergy and has not received clarithromycin in the past 12 months. EGFR is normal.\n\nWhich is the most appropriate treatment?",
   options:["A single PPI for 4 weeks","PPI + amoxicillin + clarithromycin for 7 days, with confirmation of eradication ≥4 weeks after completion","Long-term PPI alone","Bismuth monotherapy","Surgical vagotomy"],
   correct:"B",
   explanation:"NICE recommended H. pylori eradication: 7-day TRIPLE therapy of full-dose PPI + amoxicillin 1 g BD + clarithromycin 500 mg BD (or metronidazole 400 mg BD if clarithromycin used in past 12 months — to avoid resistance). Bismuth-containing quadruple therapy (PPI + bismuth + tetracycline + metronidazole for 10–14 days) is second-line if eradication fails or in high clarithromycin-resistance areas. Confirmation of eradication at LEAST 4 WEEKS after completion of therapy is recommended after a peptic ulcer (or persistent symptoms) — by urea breath test or stool antigen (NOT serology — antibody titres remain elevated for years after eradication).\n\n(A) PPI alone heals ulcer but does not eradicate H. pylori — recurrence rate >70%.\n\n(C) Long-term PPI alone is not eradication and exposes to long-term PPI side effects (B12 / Mg / Ca deficiency, increased fracture risk, pneumonia, CDI).\n\n(D) Bismuth alone is inadequate eradication monotherapy.\n\n(E) Surgery is now obsolete for uncomplicated peptic ulcer disease — reserved for refractory complications (perforation, uncontrollable bleeding, gastric outlet obstruction).\n\n💎 PEARL: H. pylori first-line: 7-day TRIPLE therapy = full-dose PPI + amoxicillin 1 g BD + clarithromycin 500 mg BD (use metronidazole if clarithromycin in past 12 months). Confirm eradication ≥4 weeks post-treatment by urea breath or stool antigen — NOT serology (antibodies persist for years).",
   references:[{label:"NICE CG184 — Gastro-oesophageal reflux disease and dyspepsia in adults", url:"https://www.nice.org.uk/guidance/cg184"},{label:"Maastricht VI Florence Consensus (Gut 2022)", url:"https://gut.bmj.com/content/71/9/1724"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Crohn's disease — first presentation",
   stem:"A 24-year-old woman who smokes 10 cigarettes/day has 8 weeks of right iliac fossa pain, 6 kg weight loss, intermittent diarrhoea (occasionally with blood), perianal pain and a healing perianal fissure. She had recent oral aphthous ulcers. Colonoscopy: discontinuous, deep linear and aphthous ulcers in the terminal ileum and patchy involvement of the right colon, with rectal sparing.\n\nWhich is the most likely diagnosis?",
   options:["Ulcerative colitis","Crohn's disease","Coeliac disease","Microscopic colitis","Diverticular disease"],
   correct:"B",
   explanation:"Crohn's disease: a relapsing-remitting transmural inflammatory bowel disease with characteristic features here — skip lesions, deep / linear / aphthous ulcers, terminal ileal involvement, rectal sparing, perianal disease (fissures, fistulae, abscesses), oral aphthous ulcers, and granulomas on biopsy. Smoking is a strong risk factor (UNLIKE UC, where smoking is somewhat protective). Extra-intestinal manifestations: arthropathy, erythema nodosum, pyoderma gangrenosum, uveitis, primary sclerosing cholangitis (less than UC). Induction: corticosteroids; exclusive enteral nutrition for paediatric / adolescent disease (effective and avoids steroid side-effects). Maintenance: thiopurines (azathioprine, mercaptopurine) — check TPMT / NUDT15 first to identify high-risk metaboliser status; methotrexate; biologics.\n\n(A) UC is mucosal-only inflammation, CONTINUOUS, starts at the rectum and extends proximally, NO granulomas, no skip lesions, no perianal disease.\n\n(C) Coeliac disease is small-bowel mucosal disease driven by gluten — duodenal villous atrophy, no transmural inflammation, no granulomas.\n\n(D) Microscopic colitis: chronic non-bloody watery diarrhoea, normal mucosa macroscopically, lymphocytic / collagenous infiltrate on biopsy — no granulomas, no transmural disease.\n\n(E) Diverticular disease: older patients, sigmoid disease, no granulomas, no transmural inflammation outside acute diverticulitis.\n\n💎 PEARL: Skip lesions + deep linear/aphthous ulcers + terminal ileal involvement + perianal disease + transmural inflammation + non-caseating granulomas = Crohn's. Smoking is a strong RISK factor (opposite of UC). Induction: corticosteroids; paeds = exclusive enteral nutrition (avoids steroid side-effects).",
   references:[{label:"NICE NG129 — Crohn's disease (2019)", url:"https://www.nice.org.uk/guidance/ng129"},{label:"BSG IBD Guidelines (2019)", url:"https://www.bsg.org.uk/clinical-resource/bsg-consensus-guidelines-on-the-management-of-inflammatory-bowel-disease-in-adults/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Refractory coeliac disease",
   stem:"A 38-year-old woman with biopsy-confirmed coeliac disease has been on a strict gluten-free diet for 18 months but has persistent diarrhoea, weight loss and ongoing villous atrophy on repeat duodenal biopsy. Anti-tTG IgA has fallen but remains mildly positive. A specialist dietitian has confirmed strict adherence with no inadvertent gluten exposure.\n\nWhich is the most appropriate next step?",
   options:["Continue gluten-free diet alone — reassure","Specialist tertiary referral; flow cytometry / TCR studies of intra-epithelial lymphocytes to distinguish type I from type II refractory coeliac disease","Empirical immunosuppression without further workup","Switch to low-fodmap diet","Discharge — symptoms are functional"],
   correct:"B",
   explanation:"Refractory coeliac disease (RCD): persistent or recurrent malabsorption with villous atrophy despite ≥12 months of strict gluten-free diet, after exclusion of inadvertent gluten exposure (most common reason for persistent symptoms — assess with specialist dietitian; serology may help but can lag). Two types distinguished by intra-epithelial lymphocyte (IEL) phenotype (flow cytometry / TCR rearrangement studies on duodenal biopsy): RCD type I (normal IEL phenotype) — managed with budesonide and nutrition; RCD type II (aberrant clonal IEL — pre-lymphoma state) — high risk of progression to enteropathy-associated T-cell lymphoma (EATL); management with cladribine or autologous stem-cell transplantation in specialist centres.\n\n(A) Persistent villous atrophy with ongoing symptoms after confirmed adherence is NOT reassurance territory — needs specialist workup.\n\n(C) Empirical immunosuppression without distinguishing RCD-I from RCD-II misses the chance to identify pre-lymphoma disease.\n\n(D) Low-FODMAP diet helps IBS-type symptoms but does not address villous atrophy.\n\n(E) Discharging with persistent objective abnormality and weight loss is unsafe — EATL must be excluded.\n\n💎 PEARL: Persistent symptoms + villous atrophy after ≥12 months strict GFD: most often inadvertent gluten exposure — assess with specialist dietitian first. True refractory coeliac: tertiary referral, IEL flow cytometry. Type II (clonal aberrant IELs) = pre-EATL — cladribine, autologous SCT.",
   references:[{label:"NICE NG20 — Coeliac disease (2015)", url:"https://www.nice.org.uk/guidance/ng20"},{label:"BSG Coeliac Disease Guidelines (2014, Gut)", url:"https://www.bsg.org.uk/clinical-resource/coeliac-disease/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Acute mesenteric ischaemia",
   stem:"A 72-year-old woman with AF (off anticoagulation after a recent fall) presents with sudden severe central abdominal pain disproportionate to clinical signs, vomiting, and now bloody diarrhoea. Lactate 6.2, WCC 22, pH 7.25, hco₃ 14. Examination: relatively soft abdomen with mild tenderness only. CT mesenteric angiography: sma occlusion at its origin.\n\nWhich is the most appropriate management?",
   options:["Conservative IV fluids and oral antibiotics","Urgent surgical or endovascular revascularisation, IV broad-spectrum antibiotics, anticoagulation, ICU/HDU support","Colonoscopy","Laxatives and observation","Stool culture and ward observation"],
   correct:"B",
   explanation:"Acute mesenteric ischaemia: classic 'pain out of proportion to clinical signs' often in patients with AF (embolism — most common, often a left-atrial thrombus when off anticoagulation), recent MI, vasculopathy, or hypercoagulability. Causes by frequency: (1) arterial embolism from cardiac source (often AF); (2) arterial thrombosis on chronic atherosclerosis (presents subacutely with chronic mesenteric angina); (3) mesenteric venous thrombosis; (4) non-occlusive mesenteric ischaemia (low-flow states — sepsis, vasopressors). Treatment: revascularisation (open thrombectomy, endovascular thrombectomy / aspiration / stenting), IV broad-spectrum antibiotics covering gut flora, anticoagulation (heparin), resection of frankly necrotic bowel (often as a 'second-look' laparotomy), ICU/HDU support.\n\n(A) Conservative management is fatal in occlusive ischaemia.\n\n(C) Colonoscopy could perforate ischaemic bowel and delays treatment.\n\n(D) Laxatives are inappropriate — this is acute infarct, not constipation.\n\n(E) Stool culture has no role in occlusive arterial ischaemia and ward observation lets bowel infarct.\n\n💎 PEARL: AF off anticoagulation + sudden severe pain OUT OF PROPORTION to clinical signs + raised lactate + bloody diarrhoea = acute mesenteric ischaemia (often SMA embolus). CT mesenteric angiography urgently → revascularisation (open or endovascular), broad-spectrum antibiotics, anticoagulation. Mortality >50%.",
   references:[{label:"ACG Acute Mesenteric Ischemia Guideline (Am J Gastroenterol 2017)", url:"https://journals.lww.com/ajg/Fulltext/2017/01000/Acute_Mesenteric_Ischemia.4.aspx"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Severe alcoholic hepatitis",
   stem:"A 55-year-old man with chronic heavy alcohol use (recent escalation) presents with new jaundice, ascites and grade 1 hepatic encephalopathy. Bilirubin 285 µmol/L, INR 2.4, albumin 22 g/L, creatinine 110 µmol/L, neutrophils 14. Maddrey discriminant function 58. Active infection has been excluded (cultures negative, no SBP); no GI bleeding.\n\nWhich is the most appropriate management?",
   options:["IV broad-spectrum antibiotics alone","Prednisolone 40 mg daily for 28 days, with day-7 Lille score reassessment","IV pentoxifylline","Immediate liver transplantation","Lactulose alone"],
   correct:"B",
   explanation:"Severe alcoholic hepatitis is defined by Maddrey discriminant function ≥32 OR MELD >20. STOPAH trial (NEJM 2015) — the largest RCT in this field: prednisolone 40 mg daily for 28 days conferred a modest short-term (28-day) mortality benefit; pentoxifylline did NOT improve outcomes (counter to earlier hopes). Reassess with Lille score at day 7 — if ≥0.45 the patient is a steroid non-responder, steroids should be stopped (no benefit, ongoing infection risk). MANDATORY before steroids: exclude active infection (especially SBP — diagnostic ascitic tap), GI bleeding, and uncontrolled diabetes. N-acetylcysteine may be added to corticosteroids in selected patients.\n\n(A) Antibiotics alone do not address the inflammatory liver injury; reserved for documented infection.\n\n(C) Pentoxifylline does NOT confer benefit (STOPAH).\n\n(D) Immediate transplantation requires extensive multidisciplinary assessment, robust abstinence programme, and is reserved for highly selected patients after non-response to medical therapy.\n\n(E) Lactulose addresses encephalopathy but does not modify the underlying disease.\n\n💎 PEARL: Severe alcoholic hepatitis (Maddrey ≥32 or MELD >20): prednisolone 40 mg × 28 days (STOPAH — modest 28-day mortality benefit). Lille score at day 7 — stop steroids if ≥0.45 (non-responder). MANDATORY before steroids: exclude infection (especially SBP), GI bleed, uncontrolled DM. Pentoxifylline does NOT help.",
   references:[{label:"BASL/BSG Alcoholic Hepatitis Position Paper (Frontline Gastroenterol)", url:"https://fg.bmj.com/"},{label:"EASL Alcohol-related Liver Disease (J Hepatol 2018)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(18)31958-1/fulltext"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Chronic hepatitis B — treatment threshold",
   stem:"A 45-year-old man originally from East Asia is found on routine screening to be HBsAg-positive. Further evaluation: HBeAg-negative, anti-HBe positive, ALT 80 U/L (sustained), HBV dna 80,000 IU/mL. Transient elastography 7.2 kPa (no significant fibrosis). HCC alpha-fetoprotein normal. He is asymptomatic.\n\nWhich is the most appropriate management?",
   options:["No treatment indicated; monitor only","Entecavir or tenofovir disoproxil/alafenamide (oral nucleos(t)ide analogue)","Pegylated interferon alpha for 48 weeks","Glecaprevir-pibrentasvir","Lifelong corticosteroids"],
   correct:"B",
   explanation:"NICE / BASL / EASL guidance: chronic hepatitis B treatment is indicated when HBV DNA >2000 IU/mL PLUS persistently elevated ALT, OR significant fibrosis / cirrhosis on imaging or biopsy (or any detectable DNA in cirrhosis). This patient has DNA 80,000 IU/mL with elevated ALT — meets treatment criteria. First-line: oral nucleos(t)ide analogue with a HIGH GENETIC BARRIER to resistance — entecavir or tenofovir disoproxil fumarate / alafenamide. Well tolerated, indefinite duration. HCC surveillance every 6 months in cirrhosis, in Asian men >40, Asian women >50, family history of HCC, sub-Saharan African background — by ultrasound ± AFP.\n\n(A) HBV DNA 80,000 + raised ALT meets treatment criteria — monitoring alone misses the window to prevent fibrosis.\n\n(C) Pegylated interferon would be considered but is rarely first-line; orals are simpler, better tolerated, more effective long-term.\n\n(D) Glecaprevir-pibrentasvir is for hepatitis C, not B.\n\n(E) Steroids would cause HBV reactivation.\n\n💎 PEARL: Chronic HBV treatment threshold: HBV DNA >2000 IU/mL + persistently raised ALT, OR significant fibrosis/cirrhosis. First-line: oral nucleos(t)ide analogue with HIGH genetic barrier — entecavir or tenofovir DF/AF. HCC surveillance every 6 months in cirrhosis and high-risk groups (Asian men >40, Asian women >50, sub-Saharan African, family history).",
   references:[{label:"NICE TA710 — Treatment of chronic hepatitis B", url:"https://www.nice.org.uk/"},{label:"EASL Hepatitis B Guidelines (J Hepatol 2017)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(17)30185-1/fulltext"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Hepatitis C — direct-acting antiviral therapy",
   stem:"A 40-year-old man has chronic hepatitis C (genotype 1a) with detectable HCV rna. He has no cirrhosis on transient elastography (5.6 kPa). HBsAg has been confirmed negative. He has no significant comorbidities and no concurrent medications likely to interact with antivirals.\n\nWhich is the most appropriate treatment?",
   options:["Pegylated interferon plus ribavirin for 48 weeks","Pan-genotypic daa combination (sofosbuvir/velpatasvir or glecaprevir/pibrentasvir) for 8–12 weeks","Lifelong nucleoside analogue","No treatment available — observation only","Liver transplantation"],
   correct:"B",
   explanation:"Modern hepatitis C treatment: direct-acting antivirals (DAAs) achieve sustained virological response (SVR — durable cure) in >95% across all genotypes with 8–12 weeks of well-tolerated oral therapy. Pan-genotypic combinations: sofosbuvir/velpatasvir (Epclusa) for 12 weeks; glecaprevir/pibrentasvir (Maviret) for 8 weeks in non-cirrhotic disease. Genotype-specific options exist but are largely superseded by pan-genotypic. Pegylated interferon + ribavirin is no longer used in routine practice (lower SVR, much worse side effects, contraindications). Decompensated cirrhosis: AVOID protease inhibitor-containing regimens (glecaprevir, voxilaprevir); use sofosbuvir-based regimens with ribavirin. Drug interactions are clinically important — review concomitant medications (statins, amiodarone with sofosbuvir, OCP).\n\n(A) Peg-IFN/ribavirin is now obsolete — DAAs supplanted them.\n\n(C) Nucleoside analogues (e.g. entecavir) treat hepatitis B, not C.\n\n(D) Hepatitis C is now curable in nearly all patients — non-treatment is no longer the standard.\n\n(E) Transplantation is for decompensated cirrhosis or HCC — not for chronic hepatitis C without these complications.\n\n💎 PEARL: Chronic HCV: pan-genotypic DAAs (sofosbuvir/velpatasvir 12 weeks, OR glecaprevir/pibrentasvir 8 weeks if non-cirrhotic) achieve SVR >95%. Decompensated cirrhosis: AVOID protease inhibitors (glecaprevir, voxilaprevir); use sofosbuvir-based + ribavirin. Pegylated interferon obsolete.",
   references:[{label:"EASL Hepatitis C Guidelines (J Hepatol 2020)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(20)30357-5/fulltext"}]},

  {section:"gastro", specialty:"Hepatology", topic:"MASLD with advanced fibrosis",
   stem:"A 52-year-old man with type 2 diabetes (HbA1c 64 mmol/mol on metformin), hypertension and BMI 35 has incidental fatty liver on abdominal ultrasound. ALT 70, AST 55. Hepatitis serology negative. FIB-4 score 2.8 (intermediate-high). FibroScan elastography 12.5 kPa, indicating advanced fibrosis.\n\nWhich is the most appropriate management?",
   options:["No further investigation; reassure that fatty liver is benign","Refer to hepatology; aggressive cardiometabolic management with weight loss and a GLP-1 receptor agonist or SGLT2 inhibitor","Long-term NSAID for inflammation","Repeat ultrasound in 5 years","Lifelong oral prednisolone"],
   correct:"B",
   explanation:"NAFLD has been reframed as MASLD (metabolic-dysfunction-associated steatotic liver disease) — emphasising the metabolic driver. Risk stratification: FIB-4 (low-cost screening — <1.3 reassuring, ≥2.67 high-risk; he is intermediate-high); FibroScan (≥8 kPa suggests significant fibrosis, ≥12 advanced); ELF blood test as alternative. Aggressive cardiometabolic management is the cornerstone — weight loss ≥10% is the SINGLE MOST EFFECTIVE intervention, can resolve steatohepatitis and reverse fibrosis. SGLT2 inhibitors (empagliflozin, dapagliflozin) and GLP-1 receptor agonists (semaglutide — Wegovy / Ozempic; tirzepatide) are increasingly favoured in diabetes/MASLD; semaglutide improves steatohepatitis on biopsy. Pioglitazone improves histology but has side effects (weight gain, fluid retention).\n\n(A) Advanced fibrosis on FibroScan is NOT benign — risk of cirrhosis, decompensation, HCC and cardiovascular events warrants intervention.\n\n(C) NSAIDs increase liver and renal harm; have no role.\n\n(D) FibroScan 12.5 kPa needs hepatology review now, not delayed reassessment.\n\n(E) Steroids worsen metabolic syndrome and have no role in MASLD.\n\n💎 PEARL: MASLD risk-stratify with FIB-4 (≥2.67 high-risk) and FibroScan (≥8 significant, ≥12 advanced). Refer hepatology if intermediate-high. Cornerstone = ≥10% weight loss (can resolve steatohepatitis and reverse fibrosis). GLP-1 RAs (semaglutide) and SGLT2i favoured in DM/MASLD.",
   references:[{label:"AASLD MASLD/MASH Practice Guidance (2024)", url:"https://journals.lww.com/hep/fulltext/2024/05000/aasld_practice_guidance_on_the_clinical_assessment.31.aspx"},{label:"EASL/EASD/EASO MASLD Clinical Practice Guidelines (J Hepatol 2024)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(24)00329-5/fulltext"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Wilson disease — diagnosis",
   stem:"A 24-year-old man presents with new tremor, dysarthria and altered behaviour over 6 months. There is family history of unexplained 'liver disease' in a sibling. Examination: postural and intention tremor, mild rigidity. Slit-lamp examination: Kayser-Fleischer rings bilaterally. Bloods: caeruloplasmin 0.10 g/L (low), 24-hour urinary copper 4.5 µmol/24h (raised), ALT 88, AST 76, INR 1.2. Hepatitis virology and autoimmune liver screen negative.\n\nWhich is the most likely diagnosis?",
   options:["Wilson disease","Hereditary haemochromatosis","Alpha-1 antitrypsin deficiency","Autoimmune hepatitis","Primary biliary cholangitis"],
   correct:"A",
   explanation:"Wilson disease: autosomal recessive ATP7B gene mutation → defective hepatocyte biliary copper excretion and reduced caeruloplasmin synthesis → systemic copper accumulation. Presentations: hepatic, neurological (parkinsonism, tremor, dysarthria, dystonia, ataxia), psychiatric (behavioural change, depression, psychosis). Diagnostic workup: low serum caeruloplasmin (<0.20 g/L); elevated 24-hour urinary copper (>1.6 µmol/24h, >0.6 µmol after penicillamine challenge); Kayser-Fleischer rings on slit lamp (~95% with neurological disease); liver biopsy quantitative copper (>250 µg/g dry weight); confirmatory ATP7B genetic testing. Leipzig score combines criteria. Treatment: chelators (penicillamine — historically first-line; trientine — better tolerated), zinc as maintenance therapy (blocks intestinal copper absorption), copper-restricted diet. LIFELONG therapy.\n\n(B) Hereditary haemochromatosis (HFE C282Y/H63D): iron overload, raised ferritin and transferrin saturation, bronzed skin, diabetes — different metabolic pattern, no KF rings.\n\n(C) Alpha-1 antitrypsin deficiency: liver disease + early panacinar emphysema, low alpha-1 antitrypsin level, PiZZ phenotype — no copper handling abnormality.\n\n(D) Autoimmune hepatitis: ANA / anti-smooth-muscle / anti-LKM1 positive, raised IgG, interface hepatitis — different serology, no KF rings.\n\n(E) PBC: middle-aged women, cholestatic LFT pattern (ALP rise > AST rise), AMA positive — different age, sex and pattern.\n\n💎 PEARL: Young adult + neuro/psych/hepatic symptoms + Kayser-Fleischer rings + LOW caeruloplasmin + RAISED 24-h urinary copper + family history = Wilson disease (autosomal recessive, ATP7B). Treatment: chelators (penicillamine, trientine), zinc maintenance, urgent transplant if fulminant.",
   references:[{label:"EASL Wilson Disease Guidelines (J Hepatol 2012)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(11)00772-2/fulltext"},{label:"AASLD Wilson Disease Guideline (Hepatology 2023)", url:"https://aasldpubs.onlinelibrary.wiley.com/doi/10.1097/HEP.0000000000000408"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Familial adenomatous polyposis",
   stem:"A 22-year-old man whose father had FAP and was diagnosed with colorectal cancer at 38 undergoes screening colonoscopy. Hundreds of adenomatous polyps (>200 visualised) are seen throughout the colon and rectum, several with low-grade dysplasia. APC gene mutation confirmed on genetic testing. He is asymptomatic.\n\nWhich is the most appropriate management?",
   options:["Watchful waiting with annual colonoscopy","Refer for prophylactic colectomy in early adulthood","Long-term aspirin alone as definitive treatment","No further intervention required","Repeat colonoscopy in 10 years"],
   correct:"B",
   explanation:"Familial adenomatous polyposis (FAP): autosomal dominant, APC gene mutation on chromosome 5q21. Phenotype: hundreds to thousands of colonic adenomas (typically appearing in adolescence), with NEAR-100% lifetime risk of colorectal cancer if untreated — often by age 40. Prophylactic colectomy is recommended in early adulthood (typically late teens to mid-20s, timed by polyp burden / dysplasia). Surgical options: restorative PROCTO-colectomy with ileal pouch-anal anastomosis (IPAA — eliminates rectal cancer risk but pouchitis may occur); colectomy with ileorectal anastomosis (preserved continence but continued surveillance of retained rectum is mandatory). Other surveillance: thyroid (papillary thyroid cancer), desmoid tumours, hepatoblastoma in childhood.\n\n(A) Watchful waiting with annual scopes does not prevent cancer in a young patient already with hundreds of polyps with dysplasia — colectomy is the standard.\n\n(C) Aspirin / NSAIDs (sulindac, celecoxib) reduce polyp burden modestly but do NOT replace colectomy — the cancer risk is too high.\n\n(D) Doing nothing carries near-100% colorectal cancer risk.\n\n(E) 10-year interval is wholly inappropriate for FAP — regular surveillance and timely surgery save lives.\n\n💎 PEARL: FAP: APC mutation, autosomal dominant. Hundreds of adenomas from adolescence; near-100% lifetime CRC risk untreated, often by age 40. Prophylactic colectomy in early adulthood (IPAA or ileorectal anastomosis with retained-rectum surveillance). Screen thyroid (papillary), duodenum, desmoids.",
   references:[{label:"BSG/ACPGBI/UKCGG Hereditary CRC Guidelines (Gut 2020)", url:"https://gut.bmj.com/content/69/3/411"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Achalasia",
   stem:"A 45-year-old man has 12 months of progressive dysphagia for both solids and liquids together (since onset), regurgitation of undigested food (especially at night), nocturnal cough, and 8 kg weight loss. OGD: mild oesophagitis but no obstructing lesion; resistance crossing the lower oesophageal sphincter ('pop' on entry to stomach). Barium swallow: dilated oesophagus with smooth tapering at the gastro-oesophageal junction ('bird's beak'). High-resolution manometry: aperistalsis with failure of los relaxation (median irp raised).\n\nWhich is the most likely diagnosis?",
   options:["Eosinophilic oesophagitis","Achalasia","Gastro-oesophageal reflux disease","Oesophageal squamous cell carcinoma","Barrett's oesophagus"],
   correct:"B",
   explanation:"Achalasia: failure of LOS relaxation with absent oesophageal peristalsis (loss of inhibitory neurones in the myenteric plexus). Investigations: barium swallow ('bird's beak' tapering at GOJ, dilated proximal oesophagus); OGD MANDATORY to exclude PSEUDOACHALASIA from cancer infiltrating the GOJ (especially in patients aged >55, rapid onset, marked weight loss); high-resolution manometry (gold standard) — Chicago classification subtypes (I, II, III) guide treatment choice. Treatment options with broadly similar efficacy: pneumatic dilatation (graded balloon dilatation under fluoroscopy); laparoscopic Heller myotomy with partial fundoplication; per-oral endoscopic myotomy (POEM — increasingly favoured, particularly for type III; high efficacy but more reflux).\n\n(A) Eosinophilic oesophagitis: food impaction, atopy; histology shows ≥15 eosinophils/HPF; rings/furrows on OGD — different histology and response.\n\n(C) GORD: predominant heartburn, response to PPI, no aperistalsis on manometry.\n\n(D) Oesophageal cancer: progressive dysphagia (solids → liquids), older age — must be excluded but visualised on OGD.\n\n(E) Barrett's: salmon-coloured columnar epithelium above GOJ, intestinal metaplasia — does not cause aperistalsis.\n\n💎 PEARL: Dysphagia for solids AND liquids together (from onset) + nocturnal regurgitation + 'bird's beak' on barium + LOS aperistalsis on manometry = achalasia. OGD MANDATORY to exclude PSEUDOACHALASIA from cancer at GOJ (especially if >55, rapid onset, marked weight loss). POEM, Heller, or pneumatic dilatation.",
   references:[{label:"ACG Achalasia Clinical Guideline (2020, Am J Gastroenterol)", url:"https://journals.lww.com/ajg/Fulltext/2020/09000/ACG_Clinical_Guidelines__Diagnosis_and_Management.13.aspx"},{label:"BSG Oesophageal Manometry Position", url:"https://www.bsg.org.uk/"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Autoimmune hepatitis (type 1)",
   stem:"A 38-year-old woman has 3 months of fatigue, mild ruq discomfort and new jaundice. ALT 480, AST 420 (transaminase predominant), bilirubin 110 µmol/L, ALP only mildly raised, GGT 90, INR 1.3. Immunoglobulins: IgG markedly elevated. Hepatitis A/B/C/E negative; ANA and anti-smooth-muscle antibodies positive (1:320). Anti-LKM1 negative. Ultrasound: normal liver, normal biliary tree.\n\nWhich is the most likely diagnosis?",
   options:["Primary biliary cholangitis","Autoimmune hepatitis (type 1)","Wilson disease","Hereditary haemochromatosis","Drug-induced liver injury"],
   correct:"B",
   explanation:"Autoimmune hepatitis (AIH): chronic immune-mediated liver disease, predominantly affecting women. Type 1 AIH (~80%): ANA and/or anti-smooth-muscle antibody positive (often with raised IgG); type 2 AIH: anti-LKM1 and/or anti-LC1 positive (more often paediatric). Pattern: TRANSAMINASE-predominant (ALT/AST much higher than ALP — hepatocellular pattern, distinguishing from cholestatic disease such as PBC); raised IgG (highly characteristic — present in ~85%). Treatment: induction with prednisolone tapered (or budesonide in non-cirrhotic disease — fewer side-effects via first-pass clearance) PLUS azathioprine (check TPMT first to avoid severe myelosuppression); maintenance with azathioprine (often lifelong). Increased HCC risk in cirrhosis — surveillance every 6 months.\n\n(A) PBC: middle-aged women, CHOLESTATIC pattern (ALP rise > ALT rise), AMA positive (~95%), bile duct injury on biopsy — different LFT pattern.\n\n(C) Wilson disease: tremor, KF rings, low caeruloplasmin, raised urinary copper, ATP7B mutation — different copper-handling picture.\n\n(D) Haemochromatosis: iron overload, raised ferritin and transferrin saturation, HFE mutation — no autoantibodies.\n\n(E) DILI: temporal relationship to drug exposure (paracetamol, antibiotics, herbal products, methotrexate), often resolves on withdrawal — no autoantibodies / IgG rise.\n\n💎 PEARL: Young/middle-aged woman + transaminase-predominant hepatitis + raised IgG + ANA / anti-smooth-muscle Ab + interface hepatitis with plasma cells = AIH type 1. Prednisolone (or budesonide if non-cirrhotic) + azathioprine after TPMT screen. Anti-LKM1 = type 2 (more often paediatric).",
   references:[{label:"BSG/BASL Autoimmune Hepatitis Guidelines (2011, Gut)", url:"https://www.bsg.org.uk/"},{label:"AASLD AIH Guideline (2019)", url:"https://aasldpubs.onlinelibrary.wiley.com/doi/10.1002/hep.31065"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Primary biliary cholangitis — first-line therapy",
   stem:"A 55-year-old woman has 9 months of progressive fatigue and pruritus. ALT 60, AST 50, ALP 480 (markedly raised), GGT 320, bilirubin 18, albumin 38, INR 1.0. Anti-mitochondrial antibody (M2 subtype) strongly positive at 1:640. IgM raised. Liver ultrasound: normal biliary tree. FibroScan 7.2 kPa (no advanced fibrosis).\n\nWhich is the most appropriate first-line treatment?",
   options:["Ursodeoxycholic acid 13–15 mg/kg/day","Obeticholic acid","Long-term oral prednisolone","Cholestyramine alone","Liver transplantation now"],
   correct:"A",
   explanation:"Primary biliary cholangitis (PBC, formerly primary biliary cirrhosis): chronic autoimmune cholestatic liver disease, predominantly affecting middle-aged women. Liver biopsy is rarely needed unless atypical (typically chronic non-suppurative destructive cholangitis with bile duct loss). \n\nFIRST-LINE: ursodeoxycholic acid (UDCA) 13–15 mg/kg/day — improves biochemistry, slows histological progression, improves transplant-free survival (multiple meta-analyses; the standard of care). Inadequate response is assessed at 12 months by validated criteria (UK-PBC, GLOBE, Toronto, Paris II — typically based on ALP / bilirubin reduction). Symptom management: pruritus — cholestyramine first-line (separated from UDCA by 4 hours), rifampicin or naltrexone or sertraline second-line; fatigue is harder to treat.\n\n(B) Obeticholic acid is SECOND-LINE — for inadequate UDCA response (or UDCA-intolerant).\n\n(C) Long-term steroids have no role unless overlap autoimmune hepatitis.\n\n(D) Cholestyramine treats pruritus only — does not modify the disease.\n\n(E) FibroScan 7.2 kPa is non-cirrhotic — transplant is for end-stage disease.\n\n💎 PEARL: Middle-aged woman + cholestatic LFTs (raised ALP) + AMA M2-positive + raised IgM = primary biliary cholangitis. UDCA 13–15 mg/kg/day first-line — improves transplant-free survival. Assess response at 12 months (UK-PBC, GLOBE). Pruritus: cholestyramine first-line.",
   references:[{label:"BSG/UK-PBC Treatment Guidelines (2018)", url:"https://www.bsg.org.uk/"},{label:"EASL PBC Guidelines (J Hepatol 2017)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(17)30186-3/fulltext"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Acute lower GI bleeding — ongoing",
   stem:"A 78-year-old man on aspirin and warfarin (INR 2.4) presents with painless passage of large-volume fresh red blood per rectum 4 times in 6 hours. BP 110/70 mmHg, HR 92, Hb 92 g/L (baseline 138). Oakland score 16 (high-risk). Bleeding has continued since admission.\n\nWhich is the most appropriate next investigation?",
   options:["Outpatient flexible sigmoidoscopy","CT angiography","Standalone aspirin therapy","Antiemetic alone","Bowel preparation alone with no further intervention"],
   correct:"B",
   explanation:"BSG / AUGIS lower GI bleed pathway. Risk stratification: Oakland score guides admission and intervention — score ≤8 may allow outpatient management; ≥8 requires admission. He scores 16 (significant). Common causes: diverticular disease (most common), angiodysplasia, ischaemic colitis, neoplasia, post-polypectomy, haemorrhoids, IBD. Investigation strategy: STABLE patients with self-limiting bleed → colonoscopy after bowel preparation (within 24 h ideal). SIGNIFICANT ONGOING BLEEDING (this patient — high Oakland, persistent passage of fresh blood) → CT ANGIOGRAPHY first. Rapid, identifies active extravasation in ~85% when actively bleeding ≥0.3 mL/min, localises the source for therapeutic angiography (mesenteric embolisation) or directed colonoscopy.\n\n(A) Outpatient flexible sigmoidoscopy is wholly inappropriate for ongoing significant bleeding with high Oakland score.\n\n(C) Aspirin would worsen bleeding.\n\n(D) Antiemetic does not address haemorrhage.\n\n(E) Bowel preparation alone neglects active source localisation in ongoing bleed; for stable patients colonoscopy is staged after preparation, but with active bleeding CT angiography comes first.\n\n💎 PEARL: Significant ongoing lower GI bleed (high Oakland) → CT angiography FIRST (identifies extravasation if bleeding ≥0.3 mL/min, localises for therapeutic angiography). Stable self-limiting bleed → colonoscopy after prep within 24 h. Diverticular disease is the most common cause.",
   references:[{label:"BSG Lower GI Bleeding Guidelines (Gut 2019)", url:"https://gut.bmj.com/content/68/5/776"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Refractory GORD — confirming the diagnosis",
   stem:"A 50-year-old man has classical reflux symptoms (heartburn, regurgitation) despite 8 weeks of high-dose PPI (omeprazole 40 mg twice daily, taken 30 minutes before meals — adherence confirmed) plus lifestyle measures (weight loss, raised head of bed, no late meals). Endoscopy: normal oesophageal mucosa, no Barrett's, no hiatus hernia. He is otherwise well.\n\nWhich is the most appropriate next investigation?",
   options:["Increase PPI to four times daily indefinitely","24-hour pH-impedance testing off PPI plus high-resolution oesophageal manometry","Lifelong empirical PPI without further investigation","Reassure and discharge","Long-term oral prednisolone"],
   correct:"B",
   explanation:"Refractory GORD: persistent symptoms despite at least 8 weeks of optimal PPI. Approach is to confirm — or refute — pathological reflux with OBJECTIVE testing before escalating therapy or considering surgery. 24-hour pH-IMPEDANCE testing (off PPI for 1 week) identifies acid AND non-acid reflux events and assesses symptom-reflux association (DeMeester score, AET, symptom index). HIGH-RESOLUTION OESOPHAGEAL MANOMETRY excludes a motility disorder (achalasia, ineffective oesophageal motility, scleroderma oesophagus) BEFORE any anti-reflux surgery — fundoplication is contraindicated in significant motility disorders. Functional symptoms WITHOUT objective reflux — consider neuromodulators (low-dose tricyclic, SSRI) for visceral hypersensitivity; refer for hypnotherapy or CBT.\n\n(A) Increasing PPI without confirming pathological reflux exposes the patient to long-term PPI side-effects without proven benefit.\n\n(C) Indefinite empirical therapy bypasses the chance to reach a precise diagnosis.\n\n(D) Reassurance with persistent symptoms is unhelpful.\n\n(E) Steroids have no role in GORD.\n\n💎 PEARL: Refractory GORD on optimal PPI: confirm with 24-h pH-impedance OFF PPI + high-resolution manometry BEFORE escalating or considering surgery. Manometry MANDATORY before fundoplication — surgery contraindicated in significant motility disorders (achalasia, scleroderma oesophagus).",
   references:[{label:"NICE CG184 — GORD and dyspepsia in adults (2014)", url:"https://www.nice.org.uk/guidance/cg184"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Post-polypectomy surveillance",
   stem:"A 60-year-old man undergoes screening colonoscopy with removal of three adenomas: largest 8 mm, all tubular, low-grade dysplasia, all completely resected. Bowel preparation was good (Boston Bowel Preparation Scale 8/9), the caecum was reached, and there are no other findings. He has no family history of colorectal cancer or polyposis syndrome.\n\nWhich is the most appropriate surveillance interval?",
   options:["Surveillance colonoscopy in 1 year","Return to age-based screening (no early surveillance colonoscopy)","Surveillance colonoscopy in 3 years","No further surveillance ever","Surveillance colonoscopy in 6 months"],
   correct:"B",
   explanation:"BSG 2020 / NICE NG151 post-polypectomy surveillance algorithm — major change from previous practice of 3-yearly surveillance after any adenoma. Now, only HIGH-RISK findings trigger surveillance colonoscopy at 3 years: ≥2 premalignant polyps with at least 1 ADVANCED, OR ≥5 premalignant polyps. Definition of ADVANCED polyp: serrated polyp ≥10 mm OR with dysplasia, OR adenoma ≥10 mm OR with HIGH-grade dysplasia, OR adenoma with villous component. Outcome: NO early surveillance — return to standard age-based bowel cancer screening (currently FIT-based in England, every 2 years from age 50–74, expanding to 50–74).\n\n(A) 1-year surveillance is for incomplete polypectomy or piecemeal resection of large lesions for follow-up scar examination — not standard post-polypectomy interval.\n\n(C) 3-year surveillance is for high-risk findings — not met here.\n\n(D) 'No further surveillance ever' is wrong — return to standard age-based screening is required.\n\n(E) 6 months is for incomplete resection requiring early reassessment.\n\n💎 PEARL: BSG 2020 post-polypectomy surveillance: only HIGH-RISK findings → 3-year surveillance (≥2 polyps with ≥1 advanced, OR ≥5 polyps). Otherwise return to age-based screening. Advanced = polyp ≥10 mm OR high-grade dysplasia OR villous component.",
   references:[{label:"BSG Surveillance of Adenomas Following Colonoscopy (Gut 2020)", url:"https://gut.bmj.com/content/69/2/201"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Suspicious focal liver lesion in cirrhosis",
   stem:"A 60-year-old man with cirrhosis from chronic hepatitis C (Child-Pugh A, abstinent from alcohol, SVR achieved 3 years ago) is in the HCC surveillance programme. Six-monthly liver ultrasound now shows a new 2.5 cm focal lesion in segment VII not previously seen. Alpha-fetoprotein 80 µg/L (rising from 6 µg/L six months ago).\n\nWhich is the most appropriate next investigation?",
   options:["No further investigation; reassure that surveillance imaging is unreliable","Multiphase contrast-enhanced CT or MRI of the liver","Repeat ultrasound in 12 months","Empirical systemic chemotherapy","Liver biopsy as first-line"],
   correct:"B",
   explanation:"HCC surveillance in cirrhosis: 6-monthly ultrasound ± alpha-fetoprotein. Suspicious findings (any new lesion ≥1 cm, OR rising AFP) → MULTIPHASE contrast-enhanced CT or MRI. Diagnosis is often imaging-based using LI-RADS criteria — non-invasive imaging diagnosis is acceptable in cirrhotic livers without biopsy if imaging is classic: arterial-phase HYPERENHANCEMENT plus PORTAL-VENOUS / DELAYED-PHASE WASHOUT (with or without enhancing capsule) → LI-RADS 5 (definite HCC). Indeterminate findings → biopsy or short-interval imaging. Staging: Barcelona Clinic Liver Cancer (BCLC) algorithm guides treatment. BRIDGING / DOWNSTAGING to transplant: TACE (transarterial chemoembolisation), TARE / SIRT (yttrium-90 radioembolisation). Multidisciplinary care via specialist liver MDT.\n\n(A) New 2.5 cm lesion + rising AFP demand workup, not reassurance.\n\n(C) 12-month interval misses curative window for an HCC.\n\n(D) Empirical chemotherapy is wholly inappropriate without diagnosis or staging.\n\n(E) Biopsy is reserved for indeterminate imaging — classic LI-RADS 5 features on multiphase CT/MRI in a cirrhotic liver give a non-invasive diagnosis without biopsy.\n\n💎 PEARL: New ≥1 cm liver lesion or rising AFP in cirrhosis surveillance → multiphase contrast CT or MRI. Arterial hyperenhancement + portal-venous/delayed-phase washout = LI-RADS 5 (HCC, no biopsy needed). BCLC algorithm guides treatment.",
   references:[{label:"BSG Cirrhosis Decompensation Guidelines", url:"https://www.bsg.org.uk/clinical-resource/cirrhosis-of-the-liver/"},{label:"EASL Decompensated Cirrhosis Guidelines (2018)", url:"https://easl.eu/publication/easl-clinical-practice-guidelines-management-decompensated-cirrhosis/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Irritable bowel syndrome — diagnosis",
   stem:"A 30-year-old woman has 8 months of intermittent crampy abdominal pain, occurring most days, associated with altered bowel habit (alternating constipation and loose stool) and bloating. Pain is improved by defecation. No nocturnal symptoms, no weight loss, no rectal bleeding, no anaemia, no family history of colorectal cancer or IBD. Examination normal. FBC, CRP, coeliac serology (anti-tTG IgA with normal total IgA), faecal calprotectin and basic biochemistry all normal.\n\nWhich is the most likely diagnosis?",
   options:["Crohn's disease","Irritable bowel syndrome (Rome IV)","Colorectal cancer","Coeliac disease","Microscopic colitis"],
   correct:"B",
   explanation:"NICE CG61 / Rome IV IBS: POSITIVE clinical diagnosis after exclusion of red flags and basic investigations — not a diagnosis of exclusion alone. Management: education and reassurance (a positive diagnosis is therapeutic); dietary measures; soluble fibre (ispaghula husk) for constipation, reduce insoluble fibre for diarrhoea; antispasmodic (peppermint oil, hyoscine, mebeverine) for pain; loperamide for diarrhoea-predominant; laxative for constipation-predominant; tricyclic (amitriptyline 10–30 mg nocte) or SSRI for refractory pain or psychological component (gut-brain axis modulation); gut-directed CBT and hypnotherapy. Avoid unnecessary repeat investigations once positive diagnosis is made — drives anxiety.\n\n(A) Crohn's: weight loss, raised CRP, raised faecal calprotectin, often perianal disease — none here.\n\n(C) Colorectal cancer: red flags would be present, and screening would suggest abnormality.\n\n(D) Coeliac: negative serology with normal total IgA largely excludes.\n\n(E) Microscopic colitis: typically older women with chronic non-bloody watery diarrhoea, often nocturnal — different clinical picture.\n\n💎 PEARL: IBS is a POSITIVE clinical diagnosis (Rome IV) after exclusion of red flags + basic investigations (FBC, CRP, coeliac, calprotectin) — NOT a diagnosis of exclusion alone. Confirming the diagnosis is itself therapeutic. Avoid repeated unnecessary investigations.",
   references:[{label:"NICE CG61 — Irritable bowel syndrome (2008, updated)", url:"https://www.nice.org.uk/guidance/cg61"},{label:"BSG IBS Guidelines (Gut 2021)", url:"https://gut.bmj.com/content/70/7/1214"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Diabetic gastroparesis",
   stem:"A 45-year-old woman with long-standing type 1 diabetes (24 years; current HbA1c 92 mmol/mol; established peripheral neuropathy and retinopathy) has 8 months of post-prandial fullness, early satiety, nausea, vomiting of recently ingested food (sometimes hours after eating), and 6 kg weight loss. Glycaemic control has become erratic with frequent hypoglycaemia. OGD: retained food in the stomach despite an overnight fast; no obstruction, no inflammation. Gastric emptying scintigraphy: severe delay (50% retention at 4 hours; normal <10%).\n\nWhich is the most likely diagnosis?",
   options:["Mechanical gastric outlet obstruction","Diabetic gastroparesis","Achalasia","Functional dyspepsia","Eosinophilic gastritis"],
   correct:"B",
   explanation:"Gastroparesis: delayed gastric emptying without mechanical obstruction. \n\nDIAGNOSIS: gastric emptying SCINTIGRAPHY is the gold standard (>10% retention at 4 hours; >60% at 2 hours = severe). OGD MUST exclude mechanical obstruction first. Management: GLYCAEMIC OPTIMISATION; DIETARY modification — small frequent low-fat low-fibre meals; liquid / blended consistency in severe disease; PROKINETIC agents — metoclopramide short-term <12 weeks (tardive dyskinesia risk; MHRA restrictions), erythromycin (motilin agonist; tachyphylaxis limits long-term use), domperidone (caution about QT prolongation and cardiac death — restricted use), prucalopride (5-HT4 agonist); ANTIEMETICS. Specialist multidisciplinary input.\n\n(A) Mechanical obstruction excluded by OGD — no obstructing lesion.\n\n(C) Achalasia is OESOPHAGEAL aperistalsis with failure of LOS relaxation — different anatomy and presentation; barium would show 'bird's beak'.\n\n(D) Functional dyspepsia: similar symptoms but normal gastric emptying; usually shorter duration and less severe weight loss.\n\n(E) Eosinophilic gastritis: dense eosinophilic infiltrate on biopsy; rare; would be diagnosed at endoscopy.\n\n💎 PEARL: Long-standing diabetes + post-prandial fullness, vomiting + erratic glycaemic control: gastroparesis. OGD MUST exclude obstruction first. Gastric emptying scintigraphy = gold standard. Glycaemic optimisation + small low-fat low-fibre meals; metoclopramide <12 weeks (tardive dyskinesia).",
   references:[{label:"ACG Gastroparesis Clinical Guideline (Am J Gastroenterol 2022)", url:"https://journals.lww.com/ajg/Fulltext/2022/08000/ACG_Clinical_Guideline__Gastroparesis.10.aspx"}]},

  {section:"gastro", specialty:"Hepatology", topic:"Drug-induced liver injury (co-amoxiclav)",
   stem:"A 50-year-old woman presents with new jaundice, malaise and pruritus. ALT 380 U/L, AST 320, ALP 220, bilirubin 80 µmol/L, INR 1.3. Six weeks earlier she completed a 7-day course of co-amoxiclav for a chest infection. Hepatitis A, B, C, E, EBV and CMV serology all negative. Autoimmune liver screen, caeruloplasmin and ferritin normal. Liver ultrasound: normal liver, normal biliary tree (no obstruction). She takes no other medications, no herbal supplements, no alcohol.\n\nWhich is the most likely diagnosis?",
   options:["Acute viral hepatitis","Drug-induced liver injury (co-amoxiclav)","Cholangiocarcinoma","Autoimmune hepatitis","Wilson disease"],
   correct:"B",

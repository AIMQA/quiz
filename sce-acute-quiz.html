   options:["Aspirin alone","Therapeutic anticoagulation with LMWH, then transition to warfarin or DOAC","No anticoagulation (because of intracerebral haemorrhage)","Empirical IV broad-spectrum antibiotics","Long-term oral prednisolone"],
   correct:"B",
   explanation:"CEREBRAL VENOUS SINUS THROMBOSIS (CVST): venous outflow obstruction → raised intracranial pressure, venous infarction (often haemorrhagic — distinguishing feature from arterial stroke), seizures. IMAGING: CT/MR VENOGRAPHY is the gold standard. CRITICAL TEACHING POINT: ANTICOAGULATION IS APPROPRIATE EVEN WITH ASSOCIATED HAEMORRHAGE — anticoagulation does NOT worsen and IMPROVES outcomes (ISCVT registry, Cochrane meta-analysis); the underlying Acute management: LMWH (enoxaparin 1 mg/kg BD or therapeutic dose) initially, then transition to warfarin (target INR 2.0–3.0) for 3–12 months depending on cause; DOACs (rivaroxaban, dabigatran) are increasingly accepted (RE-SPECT-CVT trial — non-inferior to warfarin). ANTIBIOTICS for septic CVST. Prognosis: ~80% achieve full recovery.\n\n(A) Aspirin is inadequate — venous thrombus needs therapeutic anticoagulation.\n\n(C) Withholding anticoagulation because of haemorrhage is a common but WRONG instinct in CVST — the haemorrhage is secondary to venous obstruction, anticoagulation improves outcomes.\n\n(D) Antibiotics are for septic CVST (this patient is not described as septic).\n\n(E) Steroid has no proven role in non-infective CVST.\n\n💎 PEARL: OCP + dehydration + headache + seizures + lobar haemorrhage = cerebral venous sinus thrombosis. CT/MR venography is gold standard. CRITICAL: anticoagulate even WITH associated haemorrhage (ISCVT, Cochrane — improves outcomes). LMWH initially → warfarin (INR 2–3) or DOAC for 3–12 months depending on cause.",
   references:[{label:"ESO Cerebral Venous Sinus Thrombosis Guideline (Eur Stroke J 2017)", url:"https://journals.sagepub.com/doi/10.1177/2396987317719364"}]},

  {section:"neurology", specialty:"Neurology", topic:"Restless legs syndrome",
   stem:"A 55-year-old woman has 6 months of an irresistible urge to move her legs in the evenings and at night, accompanied by uncomfortable 'crawling' sensations, relieved by movement and worse at rest. Symptoms have a strong evening / night predominance and are severely disrupting her sleep (insomnia, partner relocated). She is on no relevant medications. Bloods: Hb normal 134, ferritin 22 µg/L, transferrin saturation 14% (low iron stores despite normal Hb). Renal function and B12 normal.\n\nWhich is the most appropriate first-line management?",
   options:["Long-term oral oxycodone","Iron replacement (oral ferrous sulfate, with vitamin C; consider IV iron if oral intolerated or rapid replacement needed); review medications","Long-term oral prednisolone","Long-term oral antibiotic","Stimulant medication"],
   correct:"B",
   explanation:"RESTLESS LEGS SYNDROME (Willis-Ekbom disease): a sensorimotor disorder. Diagnosis is clinical — URGE criteria (IRLSSG): (1) URGE to move legs (often with uncomfortable sensations); (2) at REST or during inactivity;\n(3) RELIEVED by movement;\n(4) EVENING / night predominance. Underlying mechanisms: dopamine and IRON dysregulation (iron is a cofactor for tyrosine hydroxylase — rate-limiting in dopamine synthesis). Brain iron deficiency can occur with normal serum / Hb. STEPWISE MANAGEMENT (NICE / international RLS Study Group / AASM): FIRST — assess and TREAT REVERSIBLE CAUSES; replace iron; REVIEW medications.\n\n(A) Long-term opioids are reserved for refractory disease — not first-line; addiction risk and respiratory depression.\n\n(C) Steroids have no role.\n\n(D) Antibiotics have no role.\n\n(E) Stimulants would worsen RLS.\n\n💎 PEARL: Urge to move legs + relieved by movement + worse at rest + evening/night predominance = restless legs syndrome (URGE criteria). Iron and dopamine dysregulation. Treat REVERSIBLE causes first: replace iron (target ferritin >100, transferrin saturation >20%) — even when Hb is normal. Review meds (antidepressants, antipsychotics, antihistamines).",
   references:[{label:"AAN Restless Legs Syndrome Guideline (Neurology 2016)", url:"https://n.neurology.org/content/87/24/2585"}]},

  {section:"neurology", specialty:"Neurology", topic:"Huntington disease",
   stem:"A 38-year-old man has had 18 months of progressive involuntary movements (writhing, dance-like chorea of his face, hands and trunk), behavioural change (apathy, irritability, recent disinhibition leading to job loss), and mild cognitive decline (impaired executive function on bedside testing). Family history: father died at 55 in a 'nursing home with movement disorder'; paternal grandmother similarly. Caeruloplasmin and 24-hour urinary copper normal; slit-lamp examination normal.\n\nWhich is the most likely diagnosis?",
   options:["Idiopathic Parkinson disease","Huntington disease","Wilson disease","Tardive dyskinesia","Sydenham chorea"],
   correct:"B",
   explanation:"HUNTINGTON DISEASE (HD): autosomal DOMINANT neurodegenerative disorder caused by CAG TRINUCLEOTIDE REPEAT EXPANSION (>36 repeats) in the HUNTINGTIN (HTT) gene on chromosome 4p. Mean onset age ~40 (juvenile-onset <20 is rare and severe). \n\nDIAGNOSIS: GENETIC TESTING (CAG repeat count) — referred via specialist neurogenetics with formal pre-test counselling (significant ethical, family, insurance, employment, reproductive implications). \n\nMANAGEMENT: NO disease-modifying therapy currently approved; SYMPTOMATIC — chorea: tetrabenazine, deutetrabenazine, valbenazine (VMAT2 inhibitors); psychiatric: SSRIs for depression, antipsychotics (quetiapine, olanzapine, risperidone) for psychosis / aggression / chorea; benzodiazepines for severe chorea / dystonia; speech and language therapy, dietitian, OT, physio.\n\n(A) Idiopathic PD: bradykinesia + resting tremor + rigidity, asymmetric onset, levodopa response — different movement disorder phenotype, no chorea.\n\n(C) Wilson disease: tremor, dystonia, dysarthria; KAYSER-FLEISCHER RINGS, low caeruloplasmin, raised urinary copper — all NORMAL here, excluding Wilson.\n\n(D) Tardive dyskinesia: orobuccolingual stereotypic movements (chewing, lip-smacking, tongue protrusion) following exposure to dopamine receptor antagonists (antipsychotics, metoclopramide); no neuropsychiatric / cognitive component, no caudate atrophy.\n\n(E) Sydenham chorea: post-streptococcal rheumatic fever sequela in CHILDREN, self-limiting, no progressive course.\n\n💎 PEARL: Adult-onset chorea + behavioural change + cognitive decline + family history + caudate atrophy on MRI = Huntington disease. CAG repeat expansion in HTT gene (>36 repeats; autosomal dominant). Genetic testing requires formal pre-test counselling (insurance, employment, reproductive implications). Symptomatic — tetrabenazine for chorea, SSRIs for depression.",
   references:[{label:"EHDN Huntington Disease Guidelines", url:"https://www.ehdn.org/clinical/standards-of-care/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Non-convulsive status epilepticus",
   stem:"An 80-year-old woman with mild dementia is admitted with a 4-day history of fluctuating confusion. She has had no recent infections, no falls, no medication changes. Examination: confused (AMT 4/10), occasional subtle facial twitching and eyelid fluttering, no other focal neurological signs. CT head, urinalysis, CXR, FBC, U&E, glucose, calcium, magnesium, LFTs, B12, folate, thyroid function, and CSF analysis are all unremarkable.\n\nWhich is the most likely diagnosis?",
   options:["Delirium of unknown cause — observe","Non-convulsive status epilepticus","Acute ischaemic stroke","Toxic-metabolic encephalopathy","Functional neurological disorder"],
   correct:"B",
   explanation:"NON-CONVULSIVE STATUS EPILEPTICUS (NCSE): a frequently MISSED reversible cause of unexplained or prolonged altered mental state, especially in older adults. Estimated to be present in up to 8–15% of unexplained encephalopathy / coma in ITU populations. Often missed because there are NO OVERT TONIC-CLONIC MOTOR FEATURES — only subtle automatisms, facial twitching, eyelid fluttering, nystagmus, lip-smacking, perseveration, mutism, fluctuating consciousness. \n\nTREATMENT: IV BENZODIAZEPINE (lorazepam 4 mg or buccal midazolam) — both diagnostic and therapeutic; followed by LOADING with an antiepileptic — LEVETIRACETAM 60 mg/kg, SODIUM VALPROATE 40 mg/kg, OR PHENYTOIN 20 mg/kg with cardiac monitoring (ESETT showed equivalence).\n\n(A) Delirium of unknown cause is a non-diagnosis once clinical / EEG features point to NCSE — investigate further.\n\n(C) Stroke would typically have focal signs and abnormal imaging.\n\n(D) Toxic-metabolic encephalopathy was actively excluded by negative metabolic workup.\n\n(E) FND would have rule-in clinical signs and normal EEG.\n\n💎 PEARL: Older patient with unexplained or prolonged altered mental state + subtle facial twitching/eyelid fluttering + EEG showing continuous epileptiform activity = non-convulsive status epilepticus. Frequently MISSED — present in 8–15% of unexplained encephalopathy in ITU. IV benzodiazepine is diagnostic AND therapeutic; then load with antiepileptic.",
   references:[{label:"NICE NG217 — Epilepsies (2022)", url:"https://www.nice.org.uk/guidance/ng217"}]},

  {section:"neurology", specialty:"Neurology", topic:"Cervical spondylotic myelopathy",
   stem:"A 65-year-old man has 18 months of progressive gait disturbance (broad-based, unsteady, falls), clumsy hands (difficulty buttoning shirts, dropping objects, deteriorating handwriting), bilateral hand paraesthesia, and recent urinary urgency. Examination: bilateral upper-limb wasting in a C6/C7 distribution with reduced biceps reflexes; bilateral lower-limb spasticity with brisk knee jerks, ankle clonus, extensor plantar responses (Babinski positive), positive hoffmann sign, and a positive lhermitte sign on neck flexion. Sensation: reduced vibration sense bilaterally below the neck.\n\nWhich is the most likely diagnosis?",
   options:["Bilateral carpal tunnel syndrome","Cervical spondylotic myelopathy","Multiple sclerosis","Motor neurone disease","Subacute combined degeneration of the cord"],
   correct:"B",
   explanation:"CERVICAL SPONDYLOTIC MYELOPATHY (CSM): the most common cause of NON-TRAUMATIC SPINAL CORD DYSFUNCTION in adults aged >55. Caused by progressive cervical degenerative changes (osteophytes, disc protrusion, ligamentum flavum hypertrophy, ossified posterior longitudinal ligament) compressing the cord. \n\nDIAGNOSIS: MRI cervical spine showing canal stenosis, cord compression, and SIGNAL CHANGE (myelomalacia) on T2 — the latter portends poorer surgical outcome. JOA / Nurick / mJOA scores grade severity. \n\nMANAGEMENT: SURGICAL DECOMPRESSION is the definitive treatment for moderate-severe disease, progressive symptoms, or significant cord compression with myelomalacia (CSM-S trial — surgery superior for moderate-severe disease). Address comorbidities (B12, RA, OA).\n\n(A) Carpal tunnel: distal median sensory in thumb/index/middle, no UMN signs, no gait disturbance.\n\n(C) MS: brain demyelinating lesions, optic neuritis, sensory levels but no spondylotic compression.\n\n(D) MND: pure motor with UMN+LMN, NO sensory features, no Hoffmann/Lhermitte, no spondylotic compression.\n\n(E) SCDC: dorsal columns + corticospinal tracts; megaloblastic anaemia, low B12, no canal stenosis.\n\n💎 PEARL: Older adult + progressive gait disturbance + clumsy hands + spasticity + Hoffmann sign + Lhermitte sign = cervical spondylotic myelopathy. The most common cause of non-traumatic spinal cord dysfunction in adults >55. MRI cervical spine — T2 cord signal change (myelomalacia) portends poorer surgical outcome. Surgical decompression for moderate-severe disease.",
   references:[{label:"AOSpine North American & International Clinical Practice Guideline for Cervical Spondylotic Myelopathy (2017)", url:"https://journals.sagepub.com/doi/10.1177/2192568217701914"}]},

  {section:"neurology", specialty:"Neurology", topic:"Bell's palsy",
   stem:"A 35-year-old man presents 18 hours after acute-onset unilateral right facial weakness. Examination: complete right LMN facial palsy — he cannot wrinkle his forehead (forehead involved — distinguishing from umn, which spares the forehead due to bilateral cortical innervation of the upper face), cannot fully close his right eye (lagophthalmos with positive Bell's phenomenon — eye rolls upward), drooping of the right corner of the mouth, flattening of nasolabial fold. There is no vesicular rash in the ear or palate (excluding Ramsay Hunt syndrome), no other cranial nerve involvement, no other neurological deficit. Otoscopy normal; audiogram normal.\n\nWhich is the most appropriate management?",
   options:["Empirical broad-spectrum antibiotics","Oral prednisolone 50 mg daily for 10 days, started within 72 hours of symptom onset; eye protection (artificial tears, lubricating ointment, eye taping at night)","No treatment indicated","Empirical IV aciclovir","Surgical decompression of the facial canal"],
   correct:"B",
   explanation:"BELL'S PALSY: ACUTE IDIOPATHIC LMN facial nerve palsy, presumed inflammatory / immune-mediated / post-viral (HSV reactivation in geniculate ganglion implicated). DIAGNOSIS IS CLINICAL — investigation only if ATYPICAL features: slow / progressive onset over weeks (suspects malignancy), other cranial nerves involved, vesicles in the ear / palate / tongue, bilateral facial palsy (sarcoidosis, Lyme disease, Guillain-Barré, leukaemic infiltration, basal meningitis, HIV seroconversion), preserved upper face with lower face weakness (UMN — stroke / tumour). REVIEW at 1 week and 6 weeks; ENT / neurology if NO improvement at 3 weeks, or if features are progressive or atypical.\n\n(A) Antibiotics treat infection — Bell's palsy is not bacterial.\n\n(C) No treatment forfeits the early steroid benefit (window 72 h).\n\n(D) Empirical antivirals add limited benefit in mild-moderate Bell's; reserve for Ramsay Hunt / severe disease.\n\n(E) Surgical decompression is highly contentious / not standard; reserved for severe persistent disease at specialist centres.\n\n💎 PEARL: LMN facial palsy with FOREHEAD INVOLVEMENT (UMN spares the forehead due to bilateral cortical innervation) + no other cranial nerve signs + no vesicles = Bell's palsy. Oral prednisolone 50 mg × 10 days started within 72 hours. EYE PROTECTION (artificial tears, ointment, taping at night). Atypical features (slow onset, vesicles, bilateral) → look for cause.",
   references:[{label:"NICE CKS — Bell's palsy", url:"https://cks.nice.org.uk/topics/bells-palsy/"},{label:"AAN Bell's Palsy Guidelines (Neurology 2012)", url:"https://n.neurology.org/content/79/22/2209"}]},

  {section:"neurology", specialty:"Neurology", topic:"Brown-Séquard syndrome",
   stem:"A 40-year-old man sustains a stab wound to the right side of his back at the level of T10 in an assault. On arrival at the emergency department, he is haemodynamically stable. Examination of motor and sensory function: ipsilateral (right) loss of motor function and dorsal column sensation (vibration and proprioception) below T10; contralateral (left) loss of pain and temperature sensation starting a few segments below the level of injury; preserved sphincter function.\n\nWhich is the most likely diagnosis?",
   options:["Anterior cord syndrome","Brown-Séquard syndrome","Central cord syndrome","Cauda equina syndrome","Conus medullaris syndrome"],
   correct:"B",
   explanation:"BROWN-SÉQUARD SYNDROME: HEMICORD lesion. Causes: PENETRATING TRAUMA (stab wound — classic; gunshot), MULTIPLE SCLEROSIS plaque, TUMOUR (extramedullary or intramedullary), epidural ABSCESS, transverse myelitis (asymmetric), spinal cord infarction (asymmetric), radiation. May also have IPSILATERAL segmental LMN signs and zone of complete sensory loss AT the level of injury. \n\nINVESTIGATIONS: urgent MRI of the relevant cord level. \n\nMANAGEMENT: depends on cause — TRAUMATIC penetrating injury requires neurosurgical input (debridement, decompression if compressive haematoma); methylprednisolone (NASCIS protocols) is now controversial and not routinely recommended due to limited efficacy and complications; rehabilitation, bladder / bowel management, pressure care, VTE prophylaxis.\n\n(A) ANTERIOR CORD syndrome (anterior spinal artery infarction): BILATERAL motor and spinothalamic loss below the lesion, with PRESERVED dorsal columns — bilateral, not hemicord.\n\n(C) CENTRAL CORD syndrome (cervical hyperextension in older patients with pre-existing spondylosis): UPPER LIMB > lower limb weakness, variable sensory loss, sometimes bladder retention; classic 'man-in-a-barrel' pattern; not hemicord.\n\n(D) CAUDA EQUINA syndrome (below conus, L1): bilateral leg pain / weakness / numbness, saddle anaesthesia, bladder / bowel dysfunction; LMN signs only; not hemicord.\n\n(E) CONUS MEDULLARIS syndrome (T12-L1 cord termination): mixed UMN + LMN, early bladder / bowel dysfunction, perineal sensory loss; not hemicord.\n\n💎 PEARL: Hemicord lesion (penetrating trauma, MS plaque, tumour, abscess) → ipsilateral motor + dorsal column loss + contralateral pain/temperature loss below lesion = Brown-Séquard. Urgent MRI to identify cause; management depends on aetiology.",
   references:[{label:"ABN Spinal Cord Disease Guidance", url:"https://www.theabn.org/"}]},

  {section:"renal", specialty:"Renal", topic:"IgA nephropathy",
   stem:"A 24-year-old man develops painless macroscopic haematuria (Coca-Cola coloured urine) 36 hours after onset of a sore throat (urti). He recalls a previous similar episode 2 years ago, also after a viral illness. BP 138/86, no oedema, no rash. Investigations: urine dipstick blood +++, protein +; urine PCR 70 mg/mmol (mildly raised, sub-nephrotic), dysmorphic red cells and occasional RBC casts on microscopy; creatinine 96 µmol/L (normal-mild rise from baseline 75); aso titre normal, complement (C3, C4) normal; ANA, anti-dsdna negative; anti-GBM negative, ANCA negative; HIV / hepatitis screen negative.\n\nWhich is the most likely diagnosis?",
   options:["Post-streptococcal glomerulonephritis","IgA nephropathy","Anti-GBM (Goodpasture) disease","Minimal change disease","Membranous nephropathy"],
   correct:"B",
   explanation:"IgA NEPHROPATHY (Berger's disease): the MOST COMMON primary glomerulonephritis worldwide; particular high prevalence in East Asia (Japan, Korea, China — ~40% of biopsied GN), intermediate in Europe / North America, lower in Africa. \n\nINVESTIGATIONS: urinalysis (hallmark: blood, may have red cell casts, proteinuria), 24-hour urine or spot PCR for proteinuria quantification, BP, renal function (creatinine, eGFR), serum IgA (raised in 50%), complement (NORMAL — distinguishes from post-strep, SLE), ANA, ANCA (negative), serum cryoglobulins, hepatitis serology, HIV. PROGNOSIS: highly variable — some never progress; ~30% develop ESRD over 20-30 years.\n\n(A) Post-streptococcal GN: typically 1-3 WEEKS post-infection; LOW C3 / C4; ASO / anti-DNase B raised; usually resolves; not synpharyngitic.\n\n(C) Anti-GBM: linear IgG on IF (vs IgA mesangial); rapid AKI; pulmonary haemorrhage.\n\n(D) Minimal change: nephrotic syndrome, normal LM, podocyte foot process effacement on EM, no immune deposits.\n\n(E) Membranous: nephrotic syndrome, subepithelial deposits, anti-PLA2R; not synpharyngitic haematuria pattern.\n\n💎 PEARL: Macroscopic haematuria 24–72 hours after URTI ('synpharyngitic') + dysmorphic RBCs / RBC casts + raised serum IgA + NORMAL complement (distinguishes from post-strep / SLE) = IgA nephropathy. Most common primary GN worldwide. Risk-stratify with proteinuria/eGFR/biopsy. ACE inhibitor for proteinuria.",
   references:[{label:"KDIGO Glomerular Diseases Guideline (2021)", url:"https://kdigo.org/guidelines/gd/"}]},

  {section:"renal", specialty:"Renal", topic:"Diabetic nephropathy with proteinuria",
   stem:"A 58-year-old man with type 2 diabetes (15 years duration, HbA1c 78 mmol/mol — poorly controlled), hypertension (BP 148/90 today, persistently 145-155 systolic at home), and background diabetic retinopathy presents with peripheral oedema. Urine PCR 480 mg/mmol (heavy proteinuria, near nephrotic), serum albumin 22 g/L (low), creatinine 110 µmol/L (mildly raised, eGFR 60 ml/min/1.73m²), urine dipstick: protein +++, blood trace, no red cell casts; HbA1c 78. Current medication: metformin 1 g BD, amlodipine 5 mg daily. No nephrotoxic drugs, no recent contrast.\n\nWhich is the most appropriate next intervention?",
   options:["Increase amlodipine","Add an ACE inhibitor (or ARB)","Add a thiazide diuretic","Add a beta-blocker","Refer for renal biopsy"],
   correct:"B",
   explanation:"DIABETIC NEPHROPATHY (DN, also termed DIABETIC KIDNEY DISEASE — DKD): the leading cause of end-stage kidney disease in the UK and globally. DIAGNOSIS — usually clinical (long-standing diabetes + retinopathy + proteinuria); RENAL BIOPSY indicated when atypical features: (a) absence of retinopathy in T1DM (most T1DM-DN have retinopathy); (b) abrupt onset of proteinuria; (c) rapidly declining eGFR; (d) active urine sediment (RBC casts); (e) features suggesting alternative diagnosis (low complement, ANCA, anti-GBM, dysmorphic RBCs). (6) GLYCAEMIC CONTROL — target HbA1c 53-58 mmol/mol typically (less stringent in older / frail with hypoglycaemia risk); revise diabetes regimen to include cardio-renal-protective agents.\n\n(A) Increasing amlodipine improves BP but doesn't address proteinuria-mediated progression.\n\n(C) Thiazide useful adjunct for BP, but not primary intervention.\n\n(D) Beta-blocker not first-line in DKD; reserved for cardiac indications.\n\n(E) Biopsy not needed in classical DKD with diabetes + retinopathy + slow progression.\n\n💎 PEARL: Long-standing diabetes + heavy proteinuria + retinopathy + bland urinary sediment = diabetic nephropathy. ACE inhibitor or ARB reduces proteinuria and slows progression. Add SGLT2 inhibitor (CREDENCE, DAPA-CKD, EMPA-KIDNEY). Atypical features (no retinopathy in T1, abrupt onset, RBC casts, low complement) → biopsy for alternative diagnosis.",
   references:[{label:"KDIGO Diabetes & CKD Guidelines (2022)", url:"https://kdigo.org/guidelines/diabetes-ckd/"}]},

  {section:"renal", specialty:"Renal", topic:"NSAID-induced acute interstitial nephritis",
   stem:"A 72-year-old man with osteoarthritis on long-term ibuprofen 400 mg TDS for 8 months presents with non-specific malaise, low-grade fever, mild rash on trunk and limbs, and recently noticed reduced urine output. AKI: creatinine 410 µmol/L (baseline 90 — eGFR 12), urea 22, K 5.4, no metabolic acidosis. Urine dipstick: blood +, protein +, leucocytes ++, no nitrites; urine microscopy: sterile pyuria, eosinophils visible (Hansel stain), no red cell casts; peripheral eosinophilia 0.6 × 10⁹/L (raised). No hypotension; no nephrotoxic radio-contrast; no obstruction on ultrasound (normal-sized kidneys, no hydronephrosis); not on ace-i, no recent illness. ANCA, anti-GBM, anti-dsdna negative.\n\nWhich is the most likely diagnosis?",
   options:["Acute tubular necrosis","Pre-renal AKI","Acute interstitial nephritis","Rapidly progressive glomerulonephritis","Renal artery stenosis"],
   correct:"C",
   explanation:"ACUTE INTERSTITIAL NEPHRITIS (AIN): inflammation of the renal tubulointerstitium causing AKI; accounts for ~5-15% of biopsy-proven AKI; ~70% drug-induced. (4) Idiopathic. PRESENTATION — variable, often non-specific: AKI (usually subacute, days-weeks); ± non-oliguric or oliguric; FEVER (~30%), RASH (~15%), EOSINOPHILIA (~30%) — the classic 'triad' present in only ~10%; ABSENCE does NOT rule out AIN; haematuria, sterile pyuria, mild proteinuria (sub-nephrotic), arthralgia. \n\nDIAGNOSIS: clinical suspicion in AKI + recent / ongoing drug exposure (especially NSAIDs, PPI, antibiotics); culture-negative pyuria; eosinophilia; rash. \n\nMANAGEMENT: (1) IDENTIFY AND DISCONTINUE the OFFENDING AGENT — most important step; many patients improve over days-weeks after stopping.\n\n(A) ATN: typically follows ischaemia / shock / nephrotoxin exposure; muddy brown granular casts; absence of pyuria typically; no eosinophilia.\n\n(B) Pre-renal AKI: history of volume depletion / hypotension; bland urine sediment; responds to fluid resuscitation; FENa <1%.\n\n(D) RPGN: red cell casts, dysmorphic red cells, glomerular features, often immune-mediated (ANCA / anti-GBM / SLE / IgA); biopsy shows crescents.\n\n(E) Renal artery stenosis: typically peripheral vascular disease, refractory hypertension, asymmetric kidneys, AKI with ACE-i exposure (not relevant here); imaging shows stenosis.\n\n💎 PEARL: Long-term NSAID/PPI/antibiotic + AKI + sterile pyuria + eosinophilia + rash + fever = acute interstitial nephritis. Classic triad present in only ~10% — absence doesn't rule out AIN. Withdraw culprit drug; corticosteroids for severe or non-recovering cases. Eosinophiluria insensitive but supportive.",
   references:[{label:"KDIGO AKI Guideline", url:"https://kdigo.org/guidelines/acute-kidney-injury/"},{label:"UK Kidney Association Drug-Induced AIN Resources", url:"https://ukkidney.org/"}]},

  {section:"renal", specialty:"Renal", topic:"AKI staging — KDIGO criteria",
   stem:"A 72-year-old man is admitted with severe sepsis (urinary source, E. coli urosepsis). Past medical history: hypertension, type 2 DM, baseline creatinine 90 µmol/L (eGFR 75) from clinic 2 months ago. On admission: creatinine 180 µmol/L (2× baseline), BP 90/60, HR 115, urine output measured via catheter has been 0.4 mL/kg/h for the last 8 hours (subnormal — average target adult >0.5 mL/kg/h). He weighs 80 kg. He is volume-depleted, febrile (39.0°C), and being resuscitated with IV crystalloid; antibiotics started. Which KDIGO AKI stage is he?",
   options:["KDIGO Stage 1","KDIGO Stage 2","KDIGO Stage 3","CKD only — not AKI","Insufficient data to stage"],
   correct:"B",
   explanation:"ACUTE KIDNEY INJURY (AKI): an abrupt decline in kidney function over hours to days, characterised by reduced glomerular filtration leading to retention of nitrogenous waste, electrolyte / acid-base disturbance, and disturbed fluid homeostasis. CHARACTERISED BY: HIGH urine osmolality (>500), LOW urine sodium (<20 mmol/L), LOW FENa (<1%), HIGH urea:creatinine ratio (>100:1 in mass units; >20 mol/mol — suggests pre-renal), bland urine sediment; RAPIDLY REVERSIBLE with fluid resuscitation. INVESTIGATION OF AKI: HISTORY — fluid balance, recent medications (nephrotoxins — ACE-i, ARB, NSAIDs, diuretics, contrast, antibiotics), bleeding, infection, urinary symptoms (obstruction, prostatism), comorbidity, baseline renal function.\n\n(A) Stage 1 — would require lower threshold (creatinine 1.5-1.9× baseline OR urine output <0.5 for 6-12h).\n\n(C) Stage 3 — would require ≥3× creatinine or RRT or anuria.\n\n(D) CKD — patient had baseline eGFR 75 normal-mild, now acute rise — this is AKI on top of mild CKD.\n\n(E) Sufficient data to stage.\n\n💎 PEARL: KDIGO AKI staging (worst of creatinine OR urine output): Stage 1 = creatinine 1.5–1.9× baseline OR ≥26.5 µmol/L rise OR UO <0.5 mL/kg/h for 6–12 h. Stage 2 = 2–2.9× OR UO <0.5 for ≥12 h. Stage 3 = ≥3× OR ≥354 OR RRT initiation OR UO <0.3 for ≥24 h or anuria ≥12 h.",
   references:[{label:"NICE NG148 — Acute kidney injury: prevention, detection and management (2019)", url:"https://www.nice.org.uk/guidance/ng148"},{label:"KDIGO Clinical Practice Guideline for Acute Kidney Injury (2012)", url:"https://kdigo.org/guidelines/acute-kidney-injury/"}]},

  {section:"renal", specialty:"Hepatology", topic:"Hepatorenal syndrome",
   stem:"A 58-year-old man with decompensated cirrhosis (Child-Pugh C, MELD 24, ascites, varices, prior hepatic encephalopathy) was recently treated for SBP (E. coli, IV ceftriaxone 5 days, completed). His creatinine has risen from 90 to 180 µmol/L over 2 weeks. He has been off diuretics (spironolactone, furosemide stopped 5 days ago) and given 48 hours of volume expansion with 20% albumin (1 g/kg per day) — no improvement in creatinine. Urine sodium <10 mmol/L (very low), no proteinuria (<0.5 g/day), no haematuria, normal renal ultrasound (no obstruction, normal-sized kidneys). No shock (BP 100/60), no recent contrast, no nephrotoxic drugs. Examination: tense ascites, jaundice, asterixis (mild encephalopathy).\n\nWhich is the most appropriate management?",
   options:["More IV saline / volume expansion","Acute tubular necrosis — supportive care","Terlipressin plus albumin; assess for liver transplantation","Membranous nephropathy — start steroids","Acute interstitial nephritis"],
   correct:"C",
   explanation:"HEPATORENAL SYNDROME (HRS): functional renal failure occurring in advanced cirrhosis / acute liver failure, characterised by intense INTRA-RENAL VASOCONSTRICTION on a background of SPLANCHNIC VASODILATION; KIDNEYS ARE STRUCTURALLY NORMAL (vs ATN, glomerulonephritis); RAPID functional improvement may follow effective treatment of underlying liver disease (or reversal of haemodynamic abnormality with vasoconstrictors / transplant).\n\n(A) More saline alone may worsen ascites and not address vasoconstrictor pathophysiology.\n\n(B) ATN: typically muddy brown casts, FENa >2%, after shock / nephrotoxin — distinct.\n\n(D) Membranous: nephrotic-range proteinuria — patient has minimal proteinuria.\n\n(E) AIN: typically drug-related; sterile pyuria, eosinophilia — different pattern.\n\n💎 PEARL: Decompensated cirrhosis + rising creatinine NOT improving with diuretic withdrawal + 48 h of albumin volume expansion + low urine sodium <10 + bland sediment = hepatorenal syndrome. Functional — kidneys structurally normal. Treatment: terlipressin + albumin; refer for transplant. SBP is a common precipitant.",
   references:[{label:"EASL Decompensated Cirrhosis Guidelines (2018)", url:"https://easl.eu/publication/easl-clinical-practice-guidelines-management-decompensated-cirrhosis/"},{label:"CONFIRM Trial — Terlipressin in HRS-1 (NEJM 2021)", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2008290"}]},

  {section:"renal", specialty:"Renal", topic:"ANCA-associated vasculitis with renal involvement",
   stem:"A 65-year-old man has 8 weeks of fatigue, recurrent sinusitis with nasal crusting, intermittent epistaxis, hoarseness, and now haemoptysis, dyspnoea, and reduced urine output. Investigations: creatinine 380 µmol/L (rapidly rising from baseline 80 over 4 weeks), urinalysis: blood +++, protein +++, red cell casts on microscopy (active sediment), acr 350; ANA negative; cANCA positive with anti-PR3 strongly positive (titre >100); mpo-anca negative; anti-GBM negative; complement (C3, C4) normal. CXR: bilateral cavitating nodules (multiple, 1-3 cm).\n\nWhich is the most likely diagnosis?",
   options:["Systemic lupus erythematosus","Anti-GBM (Goodpasture) disease","Granulomatosis with polyangiitis","IgA nephropathy","Acute tubular necrosis"],
   correct:"C",
   explanation:"GRANULOMATOSIS WITH POLYANGIITIS (GPA, formerly WEGENER GRANULOMATOSIS): an ANCA-ASSOCIATED VASCULITIS (AAV) characterised by GRANULOMATOUS necrotising small-vessel vasculitis affecting upper airways, lungs, and kidneys. KEY POINTS for renal SBA — this presentation is CLASSIC GPA with the diagnostic TRIAD: (1) UPPER airway — sinusitis, nasal crusting, septal perforation, saddle nose, hearing loss, subglottic stenosis;\n(2) LOWER respiratory — cavitating nodules (pathognomonic), pulmonary haemorrhage;\n(3) RENAL — pauci-immune focal necrotising / crescentic glomerulonephritis with rapidly progressive AKI. (3) MAINTENANCE (18-24+ months): rituximab every 6 months (MAINRITSAN) or azathioprine 2 mg/kg (CYCAZAREM).\n\n(A) SLE: ANA, anti-dsDNA, anti-Sm positive; LOW C3 / C4; mucocutaneous + multisystem features; immune complex (full house) deposition on biopsy.\n\n(B) Anti-GBM (Goodpasture): linear IgG along GBM on biopsy; pulmonary haemorrhage common; anti-GBM antibody POSITIVE (negative here); rapidly progressive AKI; doesn't typically cause cavitating lung nodules / chronic upper airway disease.\n\n(D) IgA nephropathy: IgA mesangial deposition; synpharyngitic haematuria; doesn't cause cavitating lung disease / sinusitis.\n\n(E) ATN: tubular not glomerular pattern; muddy brown casts; precipitated by ischaemia / nephrotoxin; doesn't cause systemic features.\n\n💎 PEARL: Sinusitis + nasal crusting + cavitating lung nodules + RPGN with red cell casts + cANCA/PR3 positive = granulomatosis with polyangiitis. RAVE/PEXIVAS: induction with rituximab (preferred) or cyclophosphamide + steroids; plasma exchange in severe renal disease (eGFR <50, dialysis-dependent) or pulmonary haemorrhage. Maintenance: rituximab for 18–24 months.",
   references:[{label:"EULAR/ERA-EDTA AAV Guidelines (2023 update)", url:"https://ard.bmj.com/content/82/1/30"},{label:"KDIGO Glomerular Diseases Guideline (2021)", url:"https://kdigo.org/guidelines/gd/"}]},

  {section:"renal", specialty:"Renal", topic:"Rhabdomyolysis with AKI",
   stem:"A 22-year-old man is found unconscious at home for 18 hours after a heroin overdose (now reversed with naloxone in ED). On admission GCS 14, T 36.4°C, BP 100/65, HR 100. He has bruising on his right buttock and lateral thigh from where he was lying. Investigations: CK 65,000 U/L (markedly raised — normal <200), creatinine 280 µmol/L (no baseline available; AKI assumed), urea 12, K 6.4 (hyperkalaemia — peaked T waves on ECG), Ca 1.85 (mild hypocalcaemia), phosphate 2.6 (raised), urate 0.65 (raised), pH 7.28, HCO3 16 (metabolic acidosis); urine dipstick: blood +++, protein +; urine microscopy: no red cells visible (myoglobinuria — dipstick reacts with myoglobin); urine output reduced (50 mL in last hour). No compartment swelling clinically yet but pain on passive stretch developing.\n\nWhich is the most appropriate management?",
   options:["Aggressive isotonic crystalloid (target urine output 200-300 mL/h), monitor / treat hyperkalaemia and acidosis, RRT if refractory or oliguric, monitor for compartment syndrome","Furosemide alone to drive diuresis","Routine mannitol","Mandatory urinary alkalinisation","Restrict fluids"],
   correct:"A",
   explanation:"RHABDOMYOLYSIS: clinical syndrome resulting from skeletal muscle breakdown with release of muscle cellular contents into the circulation, including MYOGLOBIN, CREATINE KINASE (CK), POTASSIUM, PHOSPHATE, URATE, LDH. NON-TRAUMATIC: HYPOXIA / ISCHAEMIA — vascular occlusion, embolism, prolonged tourniquet, compartment syndrome. \n\nDIAGNOSIS: CK >5× upper limit (>1000 typical, often 10,000s-100,000s); presence of myoglobin in urine / serum; clinical history. (6) AVOID nephrotoxins — NSAIDs, contrast. (8) COMPARTMENT SYNDROME — measure compartment pressures (>30 mmHg, or perfusion pressure <20-30 mmHg = surgical emergency); FASCIOTOMY indicated to relieve pressure, salvage muscle; orthopaedic / surgical consult.\n\n(B) Furosemide: no evidence of benefit; may worsen volume status.\n\n(C) Mannitol: no longer routinely recommended (insufficient evidence, risk).\n\n(D) Mandatory alkalinisation: not mandatory; consider but not first-line.\n\n(E) Restricting fluids would WORSEN AKI.\n\n💎 PEARL: Long-lie or crush injury + CK markedly raised (often 10,000s–100,000s) + AKI + hyperkalaemia + hyperphosphataemia + metabolic acidosis = rhabdomyolysis. Aggressive isotonic crystalloid (target urine output 200–300 mL/h), treat hyperkalaemia, RRT if refractory. Watch for compartment syndrome — fasciotomy if compartment pressures elevated.",
   references:[{label:"UK Kidney Association — Rhabdomyolysis", url:"https://ukkidney.org/"}]},

  {section:"renal", specialty:"Renal", topic:"Indications for urgent renal replacement therapy",
   stem:"A 70-year-old man with septic AKI (Stage 3) has been on the ICU 3 days. He has refractory pulmonary oedema (now requiring 80% FiO2 with non-invasive ventilation) despite 250 mg IV furosemide; serum potassium 6.8 mmol/L (with peaked T waves, prolonged PR) despite medical management (calcium gluconate, insulin-dextrose, salbutamol nebs, calcium resonium); arterial pH 7.10, HCO3 12 (severe metabolic acidosis) despite adequate resuscitation. Urine output 8 mL over the past 4 hours (effectively anuric). Creatinine 580 µmol/L, urea 38, lactate 4.2. Renal team is in attendance.\n\nWhich is the most appropriate management?",
   options:["Wait until completely anuric for >24 hours before considering RRT","Start IV bicarbonate alone","Refer urgently for renal replacement therapy — multiple aeiou criteria met","Continue current medical management","Repeat IV furosemide bolus only"],
   correct:"C",
   explanation:"RENAL REPLACEMENT THERAPY (RRT) for ACUTE KIDNEY INJURY: indicated when complications of AKI cannot be managed medically. Some include U — UREA >35-40 mmol/L (less stringent — depends on clinical state). CLEAR INDICATION for urgent RRT. (3) PROLONGED INTERMITTENT RRT (PIRRT) / SLED (Sustained Low-Efficiency Dialysis) — hybrid approach, 6-12 hours; used in some centres for patients between IHD and CRRT. (5) DOSE — KDIGO recommends total effluent volume / dialysis dose ~20-25 mL/kg/h for CRRT; intermittent — 3 sessions/week typically (more frequent for severe). POST-DISCHARGE follow-up critical — CKD progression, cardiovascular risk.\n\n(A) Anuria for 24+ hours WITHOUT other indications would warrant RRT, but waiting until then in this patient with multiple other indications is harmful delay.\n\n(B) IV bicarbonate alone won't address fluid overload or refractory hyperkalaemia; modest acidosis correction.\n\n(D) Continuing current management has clearly failed.\n\n(E) Furosemide bolus — already failed; AKI with fluid overload often ineffective.\n\n💎 PEARL: Urgent RRT indications (AEIOU): Acidosis (refractory), Electrolytes (refractory hyperkalaemia), Intoxications (lithium, salicylate, methanol, ethylene glycol, metformin), Overload (refractory pulmonary oedema), Uraemia (encephalopathy, pericarditis). Multiple criteria here mandate urgent RRT.",
   references:[{label:"NICE NG107 — Renal replacement therapy and conservative management (2018)", url:"https://www.nice.org.uk/guidance/ng107"}]},

  {section:"renal", specialty:"Renal", topic:"Anti-GBM (Goodpasture) disease",
   stem:"A 28-year-old man develops over 2 weeks of rapidly progressive AKI with haemoptysis (massive earlier today), dyspnoea, and anaemia (Hb fallen from 13.5 to 8.5 g/dL). He is a smoker. Investigations: creatinine 320 µmol/L (normal 2 weeks ago, baseline 75; severe AKI), urinalysis: blood ++++, protein +++, red cell casts on microscopy; anti-gbm antibody positive at high titre (>100 U/mL); ANCA negative; ANA negative; complement normal; HIV negative. CXR: bilateral diffuse pulmonary infiltrates (alveolar haemorrhage pattern).\n\nWhich is the most appropriate management?",
   options:["Pulse methylprednisolone followed by oral prednisolone plus cyclophosphamide plus daily plasma exchange","Steroids alone","Rituximab alone","Conservative supportive care","Immediate renal transplantation"],
   correct:"A",
   explanation:"ANTI-GBM (GLOMERULAR BASEMENT MEMBRANE) DISEASE / GOODPASTURE'S SYNDROME: a rare AUTOIMMUNE small-vessel VASCULITIS where AUTOANTIBODIES (IgG) target the NON-COLLAGENOUS DOMAIN of the alpha-3 chain of TYPE IV COLLAGEN — present in glomerular basement membrane and alveolar basement membrane. \n\nDIAGNOSIS: SEROLOGY — anti-GBM antibody (sensitive ~95%, specific ~99% — RIA / ELISA; titre correlates with severity, response to plasma exchange); RAPID turnaround in tertiary centres (decision-making typically within 24h). Some IgG kappa / lambda staining; complement deposition variable.\n\n(B) Steroids alone — inadequate; combination essential.\n\n(C) Rituximab alone — alternative / adjunct, but PLEX still essential; NOT first-line monotherapy.\n\n(D) Conservative care — death from pulmonary haemorrhage / progressive renal failure.\n\n(E) Renal transplantation contraindicated until antibody undetectable for 6 months.\n\n💎 PEARL: Rapidly progressive AKI + alveolar haemorrhage + anti-GBM antibody (>95% specific) = Goodpasture's. TRIPLE therapy: pulse methylprednisolone + cyclophosphamide + DAILY plasma exchange (removes antibody). Smoking and lung disease worsen pulmonary haemorrhage. Anti-GBM antibody titre tracks response.",
   references:[{label:"KDIGO Glomerular Diseases Guideline (2021)", url:"https://kdigo.org/guidelines/gd/"}]},

  {section:"renal", specialty:"Renal", topic:"Membranous nephropathy",
   stem:"A 58-year-old man presents with 6 weeks of progressive peripheral oedema (ankle, then to thighs and abdomen — anasarca), frothy urine, and 3 kg weight gain. Investigations: urine PCR 800 mg/mmol (nephrotic range — >300), serum albumin 18 g/L (low — nephrotic syndrome by all 3 classical criteria), cholesterol 9.5 (raised — hyperlipidaemia), creatinine 90 (normal), urine: protein +++, no significant blood, no red cell casts; HbA1c 32 (no diabetes), HBV / HCV / HIV negative, ANA negative, complement normal, no recent malignancy markers; ANTI-PLA2R (phospholipase A2 receptor) antibody positive (high titre 250 U/mL).\n\nWhich is the most likely diagnosis?",
   options:["Minimal change disease","Primary membranous nephropathy","Focal segmental glomerulosclerosis","Diabetic nephropathy","AL amyloidosis"],
   correct:"B",
   explanation:"MEMBRANOUS NEPHROPATHY (MN): a chronic glomerular disease characterised by THICKENED GLOMERULAR BASEMENT MEMBRANE due to subepithelial immune deposit formation. \n\nINVESTIGATIONS: urinalysis (protein, blood, casts), spot / 24-h PCR / ACR, lipid profile, albumin, complement (often normal in primary; may be low in lupus / post-infectious), full immunology workup; renal ultrasound; AGE / RISK-appropriate cancer screening (CT, colonoscopy, mammography). MODERATE-HIGH RISK : start immunosuppression.\n\n(A) Minimal change: classic presentation in CHILDREN (vs older adult here); LM normal, EM foot process effacement, NO immune deposits; rapid steroid response.\n\n(C) FSGS: focal segmental scarring on LM; risk factors include obesity / HIV / heroin / sickle cell; nephrotic.\n\n(D) Diabetic nephropathy: usually preceded by long DM history, retinopathy, gradual progression; biopsy shows nodular glomerulosclerosis (Kimmelstiel-Wilson); no anti-PLA2R.\n\n(E) AL amyloidosis: typically older, paraprotein on electrophoresis, Congo red apple-green birefringence, multi-organ involvement (cardiac, neuropathy).\n\n💎 PEARL: Adult-onset nephrotic syndrome + thickened GBM with subepithelial deposits + anti-PLA2R antibody positive = primary membranous nephropathy. ALWAYS exclude SECONDARY causes — malignancy (age-appropriate cancer screening), HBV/HCV, lupus, drugs (NSAIDs). Risk-stratify by proteinuria/eGFR/PLA2R; immunosuppression for moderate-high risk.",
   references:[{label:"KDIGO Glomerular Diseases Guideline (2021)", url:"https://kdigo.org/guidelines/gd/"}]},

  {section:"renal", specialty:"Renal", topic:"Severe symptomatic hyponatraemia",
   stem:"A 40-year-old woman on a thiazide diuretic (started 8 weeks ago for hypertension) and an SSRI (sertraline, started 3 months ago for depression) presents with confusion, headache, nausea and a witnessed generalised tonic-clonic seizure in the emergency department. Investigations: sodium 110 mmol/L (severe hyponatraemia), plasma osmolality 232 mOsm/kg (low — true hyponatraemia, not pseudo); urine osmolality 480 (inappropriately concentrated in face of low plasma osm — suggests ADH activity); urine sodium 65 mmol/L (not volume-depleted — appropriate for euvolaemic / siadh-pattern; vs <10 in hypovolaemic / cardiac / cirrhotic). She is clinically euvolaemic (no oedema, normal JVP, mucous membranes moist, no postural hypotension). Cortisol normal, TFTs normal, no recent vomiting / diarrhoea, no excessive water intake. Duration of hyponatraemia estimated >48 hours (chronic).\n\nWhich is the most appropriate immediate management?",
   options:["Free water restriction alone","Hypertonic 3% saline 100-150 mL bolus, repeat to achieve 4-6 mmol/L sodium rise; then limit total correction to <10 mmol/L in 24 h","Tolvaptan first-line","Rapid 0.9% saline 1 L bolus","Sodium bicarbonate"],
   correct:"B",
   explanation:"HYPONATRAEMIA: serum sodium <135 mmol/L; one of the COMMONEST electrolyte disturbances in hospital, with significant morbidity / mortality.\n\nSTEP 2 — assess VOLUME STATUS: HYPOVOLAEMIC HYPOTONIC HYPONATRAEMIA — extra-renal loss (vomiting, diarrhoea, third-space — pancreatitis, burns) with urine sodium <20 OR renal loss (DIURETICS — esp.\n\nSTEP 3 — assess SYMPTOMS and CHRONICITY: chronic / asymptomatic vs acute / symptomatic. AFTER initial 4-6 mmol/L rise — LIMIT TOTAL CORRECTION to <10 mmol/L in FIRST 24 HOURS, AND <18 mmol/L in 48 HOURS — to PREVENT OSMOTIC DEMYELINATION SYNDROME (ODS — formerly central pontine myelinolysis).\n\n(A) Free water restriction alone is too slow and inadequate for life-threatening symptomatic hyponatraemia with seizures.\n\n(C) Tolvaptan: too potent / unpredictable for first-line in seizure; needs hospital inpatient setting.\n\n(D) 0.9% saline: not effective in SIADH (urine osm > infusate osm — actually worsens hyponatraemia); ineffective for severe symptoms requiring urgent correction.\n\n(E) Bicarbonate doesn't address sodium.\n\n💎 PEARL: Severe symptomatic hyponatraemia (seizures, coma): hypertonic 3% saline 100–150 mL bolus to achieve a 4–6 mmol/L rise — don't wait for cause. THEN limit total correction to <10 mmol/L per 24 h to prevent osmotic demyelination syndrome (formerly central pontine myelinolysis). Stop SSRI + thiazide.",
   references:[{label:"European Society Hyponatraemia Guideline (Eur J Endocrinol 2014)", url:"https://academic.oup.com/ejendo/article/170/3/G1/6660525"},{label:"Society for Endocrinology Emergency Endocrine Guidance — Hyponatraemia", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"renal", specialty:"Renal", topic:"Tumour lysis syndrome — onconephrology",
   stem:"A 45-year-old man with newly diagnosed bulky high-grade non-Hodgkin lymphoma (burkitt-like pattern, multiple large nodal masses, mediastinal mass 12 cm, splenomegaly, generalised lymphadenopathy) is being prepared to start chemotherapy. Pre-treatment investigations: serum urate 650 µmol/L (raised; normal <420 men), LDH 4500 U/L (markedly raised; bulk + proliferative), creatinine 110 (mildly raised), K 4.5, phosphate 1.4 (raised), Ca 2.0 (low-normal), white cell count 35; G6PD status — known G6PD deficiency (Mediterranean variant); HbS negative. He is at high risk for tumour lysis syndrome.\n\nWhich is the most appropriate prophylactic strategy?",
   options:["Vigorous IV hydration, allopurinol prophylaxis (not rasburicase — risk of severe haemolysis in G6PD deficiency), 6-12 hourly electrolyte monitoring","Rasburicase","Furosemide alone","No prophylaxis","Allopurinol contraindicated"],
   correct:"A",
   explanation:"TUMOUR LYSIS SYNDROME (TLS): an oncological / nephrological EMERGENCY characterised by RAPID release of intracellular contents from dying tumour cells, causing characteristic METABOLIC DERANGEMENT and ACUTE KIDNEY INJURY. CAIRO-BISHOP DEFINITION: LABORATORY TLS — at least 2 of: urate >476 OR ↑25%; K >6.0 OR ↑25%; phosphate >1.45 (adults) OR ↑25%; calcium <1.75 OR ↓25%; arising within 3 days BEFORE to 7 DAYS AFTER chemotherapy. \n\nPRESENTATION: usually within 12-72 hours of treatment initiation; symptoms — nausea, vomiting, lethargy, oliguria, fluid overload, arrhythmia, seizure, tetany.\n\n(B) Rasburicase: contraindicated in G6PD deficiency (severe haemolysis risk); would normally be ideal for high-risk TLS.\n\n(C) Furosemide alone: doesn't address urate; risks hypovolaemia.\n\n(D) No prophylaxis: high-risk patient — failure to prevent likely results in TLS.\n\n(E) Allopurinol is NOT contraindicated in G6PD — it is the safe alternative.\n\n💎 PEARL: Bulky high-grade lymphoma + G6PD deficiency = AVOID rasburicase (severe haemolysis risk). Use vigorous IV hydration + allopurinol for prophylaxis. Cairo-Bishop laboratory TLS: ↑urate, ↑K, ↑phosphate, ↓calcium 3 days before to 7 days after chemo. Aggressive prophylaxis in high-risk disease.",
   references:[{label:"BCSH Guidelines on Tumour Lysis Syndrome", url:"https://b-s-h.org.uk/guidelines/"},{label:"Cairo-Bishop Criteria (Coiffier 2008)", url:"https://ascopubs.org/doi/10.1200/JCO.2008.16.0010"}]},

  {section:"renal", specialty:"Renal", topic:"Lupus nephritis Class IV — induction therapy",
   stem:"A 28-year-old Afro-Caribbean woman with a 6-month history of established SLE (malar rash, polyarthralgia, oral ulcers, cytopenias) presents with new bilateral lower-limb oedema. Examination: BP 152/96, peripheral oedema to mid-shin. Urinalysis: blood ++, protein +++, urine PCR 320 mg/mmol (nephrotic-range proteinuria); creatinine 130 (rising from baseline 75). Investigations: ANA, anti-dsdna strongly positive; anti-Sm positive; complement low (C3 0.4, C4 0.05). No chronicity yet.\n\nWhich is the most appropriate induction therapy?",
   options:["High-dose steroid alone","High-dose corticosteroid plus mycophenolate mofetil OR low-dose IV cyclophosphamide (Euro-Lupus regimen), with hydroxychloroquine and ace-i","Lifelong cyclosporine","No biopsy needed","Steroid-only short course"],
   correct:"B",
   explanation:"LUPUS NEPHRITIS: a major manifestation of SLE; develops in 30–50% of SLE patients, more common and severe in Afro-Caribbean / Asian / Hispanic populations. Critical PROGNOSTIC factor in SLE — accounts for substantial morbidity / mortality. ISN/RPS 2003 CLASSIFICATION (revised 2018): I — minimal mesangial; II — mesangial proliferative; III — focal proliferative (<50% of glomeruli, often A=active, C=chronic); IV — DIFFUSE proliferative (≥50% of glomeruli, most COMMON severe form, this patient); V — membranous (subepithelial deposits, nephrotic syndrome); VI — advanced sclerosing (>90% chronic). KEY: classes III and IV ('proliferative') and class V often coexist; biopsy reports activity\n\n(A) and chronicity\n\n(C) indices guiding immunosuppression intensity.\n\n(A) Steroid alone is inadequate for class IV — needs immunosuppressant.\n\n(C) Cyclosporine not first-line; voclosporin in newer trials but as add-on.\n\n(D) Biopsy IS essential — informs class and intensity.\n\n(E) Short steroid alone insufficient for active proliferative disease.\n\n💎 PEARL: SLE + nephrotic-range proteinuria + raised creatinine + low complement + anti-dsDNA + Class IV biopsy (diffuse proliferative — most common severe form): induction = high-dose steroid + MMF or low-dose IV cyclophosphamide (Euro-Lupus regimen). Hydroxychloroquine + ACE-i. ALMS, ACCESS trials.",
   references:[{label:"KDIGO Lupus Nephritis Guideline (2024 update)", url:"https://kdigo.org/guidelines/gd/"}]},

  {section:"renal", specialty:"Renal", topic:"Contrast-associated acute kidney injury — prevention",
   stem:"A 75-year-old man with type 2 diabetes and stable CKD (eGFR 38, creatinine 165, urine acr 35) is referred for an elective CT pulmonary angiogram with iodinated contrast (suspected chronic PE; V/Q non-diagnostic). He takes metformin, ramipril, atorvastatin. He is well-hydrated, no recent diuretic use, no nephrotoxic exposure, no AKI. The radiology team asks about the appropriate management.\n\nWhich is the most appropriate strategy?",
   options:["Pre-procedure IV hydration with isotonic crystalloid, careful contrast volume, hold ace-i / nephrotoxics around procedure, avoid routine N-acetylcysteine or sodium bicarbonate","Mandatory N-acetylcysteine pre-contrast","Routine sodium bicarbonate infusion","Empirical haemodialysis post-contrast","No precautions needed"],
   correct:"A",
   explanation:"CONTRAST-ASSOCIATED ACUTE KIDNEY INJURY (CA-AKI / CIN — contrast-induced nephropathy): defined as a rise in creatinine ≥26 µmol/L or ≥50% within 48–72 hours of intravascular iodinated contrast (KDIGO criteria), without alternative cause. RISK FACTORS — KEY: pre-existing CKD (especially eGFR <30 — strongest), diabetes mellitus (especially with nephropathy), age >75, heart failure / haemodynamic instability, hypovolaemia / dehydration, concurrent NEPHROTOXINS (NSAIDs, ACE-i / ARB in ill patients, aminoglycosides, amphotericin), repeat contrast within 72 hours, large contrast volume, intraarterial > intravenous administration.\n\n(B) NAC abandoned per PRESERVE.\n\n(C) Sodium bicarbonate not superior to saline.\n\n(D) Empirical dialysis is unwarranted prophylactically.\n\n(E) No precautions in eGFR 38 + diabetes is risky; isotonic hydration recommended.\n\n💎 PEARL: Contrast-AKI prevention in CKD/diabetes: pre-procedure isotonic crystalloid + minimise contrast volume + hold ACE-i and nephrotoxins around procedure. N-acetylcysteine and sodium bicarbonate routines have been ABANDONED (PRESERVE trial — no benefit). Risk: eGFR <30 strongest predictor.",
   references:[{label:"NICE NG148 — AKI (2019)", url:"https://www.nice.org.uk/guidance/ng148"},{label:"KDIGO AKI Guideline (2012)", url:"https://kdigo.org/guidelines/acute-kidney-injury/"}]},

  {section:"renal", specialty:"Renal", topic:"Renal replacement therapy modality choice",
   stem:"A 58-year-old man with established CKD stage 5 (eGFR 8 mL/min/1.73m², creatinine 580) due to diabetic nephropathy is being prepared for renal replacement therapy. He has heart failure (EF 35%), peripheral neuropathy, and previous CABG. He works full-time as a teacher and wants to maintain his job and as much independence as possible. He has supportive family. No contraindications to dialysis or transplantation. EGFR has declined steadily over 18 months from 25 to 8.\n\nWhich is the most appropriate next step?",
   options:["Mandate in-centre haemodialysis only","Discuss all RRT options (pre-emptive transplant, home modalities, in-centre HD, conservative management); refer for transplant assessment, plan AV fistula, MDT","Lifelong conservative management only","Continue current management without intervention","Sole referral for kidney transplant without other options"],
   correct:"B",
   explanation:"RENAL REPLACEMENT THERAPY (RRT) PLANNING — NICE NG107: planning should begin when eGFR ~20 mL/min (or earlier with rapid progression) — typically 6-12 months before need for RRT to allow vascular access creation, transplant workup, modality choice, and education / preparation. EARLY referral to a renal centre is essential. (2) IN-CENTRE HAEMODIALYSIS (HD) — typically 4 hours x 3 sessions per week in dedicated dialysis unit; reliable; staff support; suitable for patients without home-care support, frail; BUT lifestyle disruption (3 days per week dialysis), cardiovascular risk (haemodynamic shifts), vascular access issues. PD CATHETER — surgical placement 2 weeks before use.\n\n(A) Mandating one modality removes patient choice / autonomy.\n\n(C) Conservative inappropriate at age 58 with no severe contraindications.\n\n(D) Continuing current management at eGFR 8 means impending uraemic emergency.\n\n(E) Sole transplant assessment doesn't account for waiting time / interim dialysis needs.\n\n💎 PEARL: RRT planning: start when eGFR ~20 (or earlier with rapid progression). Discuss ALL options — pre-emptive transplant (best outcomes), home modalities (PD/home HD — independence), in-centre HD, conservative management. AV fistula needs 6–12 months to mature. MDT approach.",
   references:[{label:"NICE NG107 — Renal replacement therapy and conservative management (2018)", url:"https://www.nice.org.uk/guidance/ng107"}]},

  {section:"renal", specialty:"Renal", topic:"Acute renal colic — first ureteric stone",
   stem:"A 35-year-old man (no prior stones, no significant comorbidity) presents with sudden-onset severe right loin-to-groin colic (8/10 pain, restless and writhing), nausea and one episode of vomiting. No fever, no sepsis features. Urinalysis: microscopic haematuria, no leucocytes, no nitrites. Examination: tender right renal angle, no peritonism. Investigations: non-contrast CT kub (gold standard imaging): 5 mm radiopaque calculus at the right vesicoureteric junction (vuj) with mild proximal hydronephrosis and perinephric stranding; no second stone. Bloods: WCC normal, CRP 25, urea / creatinine normal (no AKI), urate 380 (normal), calcium 2.40 (normal). No obstruction with sepsis.\n\nWhich is the most appropriate immediate management?",
   options:["Surgery for all stones immediately","Strong analgesia (NSAID first-line — diclofenac IM or PR), antiemetic, IV fluids, alpha-blocker for medical expulsive therapy, urgent intervention only if obstruction with sepsis / AKI / intractable pain","Empirical antibiotics alone","Long-term thiazide diuretic","No analgesia, observation only"],
   correct:"B",
   explanation:"NEPHROLITHIASIS / URETERIC COLIC: common; ~10% lifetime risk; M:F 3:1; peak age 30-60; recurrence 50% within 10 years. \n\nPRESENTATION: SEVERE LOIN-TO-GROIN COLICKY pain — often described as worst pain ever experienced; restless and writhing (vs peritonitis where patients lie still); nausea, vomiting; haematuria (90% — micro or gross); urinary symptoms if stone in lower ureter (frequency, urgency); rarely fever (think obstructed sepsis = emergency). Initial workup: FBC, U&E (assess for AKI / single kidney), CRP, urinalysis (MSU for culture if infection suspected), serum calcium / urate.\n\n(A) Surgery is NOT first-line for small (5 mm) ureteric stones — most pass spontaneously with conservative management.\n\n(C) Antibiotics not indicated without infection.\n\n(D) Thiazide is for prevention, not acute.\n\n(E) Inadequate analgesia delays recovery.\n\n💎 PEARL: Acute renal colic + small (<10 mm) ureteric stone + no sepsis or AKI: NSAID first-line analgesia (diclofenac IM/PR — superior to opioid), antiemetic, IV fluids, alpha-blocker for medical expulsive therapy. Urgent intervention only for obstructed kidney with sepsis, AKI or intractable pain.",
   references:[{label:"NICE NG118 — Renal and ureteric stones (2019)", url:"https://www.nice.org.uk/guidance/ng118"},{label:"EAU Urolithiasis Guidelines", url:"https://uroweb.org/guidelines/urolithiasis"}]},

  {section:"renal", specialty:"Renal", topic:"ADPKD — autosomal dominant polycystic kidney disease",
   stem:"A 38-year-old man with a strong family history of polycystic kidney disease (father required dialysis age 55, paternal grandmother also affected, maternal aunt died of subarachnoid haemorrhage at 48 — likely ruptured berry aneurysm) presents with newly diagnosed hypertension (resting BP 158/96), bilateral flank discomfort, and modestly progressive CKD (eGFR 60, baseline 75 two years ago). Examination: enlarged palpable kidneys bilaterally; abdominal masses. Investigations: renal ultrasound — multiple bilateral renal CYSTS (>10 in each kidney; consistent with ADPKD); hepatic CYSTS visible. No proteinuria, no haematuria, total kidney volume calculated at MRI (480 mL — large kidney volume — predicts faster decline).\n\nWhich is the most appropriate next step?",
   options:["No further intervention","Aggressive BP control with ace-i / ARB, consider tolvaptan in high-risk patients, screen for cerebral aneurysms given family history, cascade testing of relatives, plan RRT","Long-term steroid","Routine cerebral aneurysm screening for all ADPKD patients","Long-term prophylactic antibiotic"],
   correct:"B",
   explanation:"AUTOSOMAL DOMINANT POLYCYSTIC KIDNEY DISEASE (ADPKD): the MOST COMMON inherited kidney disease (prevalence ~1 in 1000); accounts for ~5-10% of all CKD requiring RRT in the UK. INHERITANCE: autosomal dominant; 50% offspring risk; spontaneous mutations in 5-10%. New genes — GANAB, DNAJB11, IFT140 (rare). \n\nDIAGNOSIS: family history + ultrasound criteria; genetic testing for ambiguous cases / family planning / PGD. MANAGEMENT — KDIGO ADPKD 2024 / NICE: (1) HYPERTENSION CONTROL — aggressive — ACE-i or ARB FIRST-LINE; avoid CCB monotherapy (less effective); LIFESTYLE — reduced salt (<5 g/day), weight management, exercise.\n\n(A) No intervention misses opportunity for BP control / risk stratification.\n\n(C) Steroids no role in ADPKD.\n\n(D) Universal cerebral aneurysm screening NOT cost-effective (low background risk in absence of family history); only with family history / specific concerns.\n\n(E) Antibiotics only for cyst infection.\n\n💎 PEARL: ADPKD: autosomal dominant; 50% offspring risk; ~5–10% of UK CKD requiring RRT. Aggressive BP control with ACE-i/ARB. Tolvaptan (vasopressin V2 antagonist) slows progression in high-risk progressors (TEMPO 3:4). Screen for cerebral aneurysms (MRA) if family history of SAH or aneurysm.",
   references:[{label:"NICE TA358 — Tolvaptan for ADPKD", url:"https://www.nice.org.uk/guidance/ta358"}]},

  {section:"renal", specialty:"Renal", topic:"Atypical haemolytic uraemic syndrome (post-partum)",
   stem:"A 28-year-old woman, 5 days postpartum after a normal vaginal delivery (uncomplicated pregnancy, no pre-eclampsia features antepartum), develops rapidly progressive AKI (creatinine 320 µmol/L, baseline 60), microangiopathic haemolytic anaemia (Hb 84 g/L, schistocytes ++ on blood film, raised LDH 1800, low haptoglobin <0.1, indirect bilirubin raised, direct Coombs negative), thrombocytopenia (platelets 60 × 10⁹/L), and new hypertension (BP 170/110). Investigations: ADAMTS13 activity normal (>10%, excludes TTP); stool culture and Shiga-toxin testing negative (excludes typical HUS); coagulation normal (PT, APTT, fibrinogen — excludes DIC); LFTs only mildly raised (excludes hellp — that should have presented antepartum and improved with delivery). Urinalysis: blood ++, protein ++.\n\nWhich is the most likely diagnosis?",
   options:["Thrombotic thrombocytopenic purpura (TTP)","Atypical haemolytic uraemic syndrome (complement-mediated tma)","Disseminated intravascular coagulation (DIC)","Hellp syndrome","Sepsis-induced coagulopathy"],
   correct:"B",
   explanation:"THROMBOTIC MICROANGIOPATHY (TMA): a syndrome characterised by MICROANGIOPATHIC HAEMOLYTIC ANAEMIA, THROMBOCYTOPENIA (consumption), and END-ORGAN ISCHAEMIA (kidney AKI, neurological deficits, cardiac, GI). \n\nTREATMENT: PLASMA EXCHANGE (replaces ADAMTS13 + removes inhibitor — start within 4-6 hours of suspicion; daily until platelet recovery), STEROID, RITUXIMAB (anti-CD20 for autoimmune), CAPLACIZUMAB (anti-vWF nanobody — HERCULES trial; reduces refractory disease, recurrence, mortality; given urgently). COLI O157:H7 or other STEC, Shigella); typically children, 5-7 days after bloody diarrhoea; MAHA + thrombocytopenia + AKI; SUPPORTIVE care typically (most recover).\n\n(A) TTP excluded by NORMAL ADAMTS13.\n\n(C) DIC excluded by NORMAL coagulation.\n\n(D) HELLP would be antepartum with raised LFTs / improving with delivery.\n\n(E) Sepsis would have systemic infection signs.\n\n💎 PEARL: Postpartum AKI + MAHA (schistocytes, raised LDH, low haptoglobin) + thrombocytopenia + ADAMTS13 NORMAL (excludes TTP) + STEC-negative = atypical HUS (complement-mediated TMA). Eculizumab is transformative (C5 inhibitor — CHAMPION trial). Plasma exchange while diagnosis confirmed.",
   references:[{label:"BSH Haemolytic Anaemia Guidelines", url:"https://b-s-h.org.uk/guidelines/"}]},

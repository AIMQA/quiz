   explanation:"GOUT: a CRYSTAL-INDUCED ARTHROPATHY caused by deposition of MONOSODIUM URATE (MSU) crystals in joints / soft tissues, due to chronic HYPERURICAEMIA (serum urate >416 µmol/L in men, >360 in women). \n\nDIAGNOSIS: GOLD STANDARD = JOINT ASPIRATION with POLARISED MICROSCOPY: MSU CRYSTALS — needle-shaped, NEGATIVELY birefringent — distinguishes from CPPD (pseudogout — RHOMBOID, weakly POSITIVELY birefringent — opposite colours). MANAGEMENT — TWO PHASES: (1) ACUTE FLARE TREATMENT (this question): aim — pain relief, anti-inflammatory; START EARLY (within 24 hours of symptom onset best); options (NICE NG219 / EULAR / BSR): A. B. C. D.\n\n(A) Allopurinol started during acute flare prolongs the attack.\n\n(C) Antibiotics not appropriate without infection (already excluded by aspiration).\n\n(D) Methotrexate not used in gout.\n\n(E) Aspirin makes gout worse (low-dose impairs uric acid excretion).\n\n💎 PEARL: Sudden hot swollen first MTP (podagra) ± thiazide ± alcohol ± purine-rich diet = acute gout. NSAID, colchicine 500 mcg BD-TDS, or short oral steroid. DO NOT start urate-lowering during a flare. Polarised microscopy: needle-shaped, NEGATIVELY birefringent MSU crystals (vs CPPD: rhomboid, weakly POSITIVELY birefringent).",
   references:[{label:"BSR Guidelines for Gout (2017)", url:"https://academic.oup.com/rheumatology/article/56/7/e1/3855056"},{label:"ACR Gout Guideline (2020)", url:"https://www.rheumatology.org/Practice-Quality/Clinical-Support/Clinical-Practice-Guidelines/Gout"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Calcium pyrophosphate deposition (pseudogout)",
   stem:"A 78-year-old woman presents with an acutely painful right knee that became swollen and stiff over 24 hours. She has a background of osteoarthritis in both knees but this is much more acute and severe than usual. Examination: knee warm, tense effusion, restricted painful movement; afebrile, no signs of sepsis. Investigations: WCC 11, CRP 80, urate normal, calcium normal. Joint aspirate: yellow turbid fluid, WCC 25,000/mm³ (neutrophil predominant); polarised microscopy shows rhomboid-shaped, weakly positively birefringent crystals (blue when parallel to red compensator). X-ray of the knee: linear calcification within the meniscus and articular cartilage (chondrocalcinosis), plus underlying OA changes. No bacteria on Gram stain, culture pending.\n\nWhich is the most likely diagnosis?",
   options:["Acute gout","Calcium pyrophosphate deposition disease (pseudogout) with chondrocalcinosis","Septic arthritis","Reactive arthritis","Acute osteoarthritis flare"],
   correct:"B",
   explanation:"CALCIUM PYROPHOSPHATE DEPOSITION DISEASE (CPPD) — formerly 'PSEUDOGOUT' for acute attacks; the umbrella term encompasses asymptomatic chondrocalcinosis, acute CPP crystal arthritis (pseudogout), chronic CPP crystal inflammatory arthritis, and OA-with-CPPD. Female slight predominance. PRESENTATION patterns: (1) ASYMPTOMATIC CHONDROCALCINOSIS — incidental on X-ray; common in elderly. INVESTIGATIONS for SECONDARY causes (in younger patients, polyarticular, recurrent): FERRITIN / transferrin saturation (haemochromatosis), CALCIUM / PTH (HPT), magnesium, phosphate, ALP (hypophosphatasia — LOW ALP), TFTs, glucose / HbA1c.\n\n(A) Acute gout: needle-shaped NEGATIVELY birefringent crystals; this patient has positively birefringent crystals — WRONG crystal type.\n\n(C) Septic arthritis: WCC typically >50,000 (this patient 25,000), Gram stain often positive, more systemically unwell — possible co-existing but exclude with culture.\n\n(D) Reactive arthritis: post-infective, asymmetric oligoarthritis with extra-articular features (urethritis, conjunctivitis); doesn't show crystals.\n\n(E) Osteoarthritis flare: usually less acute, less inflammatory, no crystals.\n\n💎 PEARL: Older patient + acute hot knee + chondrocalcinosis on X-ray + rhomboid weakly POSITIVELY birefringent crystals = pseudogout (CPPD). NSAID, colchicine, or intra-articular steroid (often most effective in elderly). Investigate secondary causes if young/recurrent: haemochromatosis, hyperparathyroidism, hypomagnesaemia, hypophosphatasia (low ALP).",
   references:[{label:"EULAR Calcium Pyrophosphate Recommendations (Ann Rheum Dis 2011)", url:"https://ard.bmj.com/content/70/4/563"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Polymyalgia rheumatica",
   stem:"A 72-year-old woman has 4 weeks of progressive bilateral shoulder and hip-girdle pain and stiffness, much worse in the morning (lasting >1 hour), with difficulty rising from a chair, getting out of bed, and combing her hair. She has lost 3 kg, fatigued, low-grade fever. No temporal headache, no scalp tenderness, no jaw claudication, no visual symptoms. Examination: tender shoulder and hip girdle muscles, painful restricted shoulder abduction, no synovitis, normal muscle power (pain-limited only). Investigations: ESR 78 mm/h (markedly raised), CRP 65, CK normal (excludes myositis), TFTs normal, FBC mild anaemia (Hb 110), albumin 33; ANA / RF / anti-CCP negative. CXR clear.\n\nWhich is the most appropriate first-line management?",
   options:["Methotrexate","Oral prednisolone 15 mg daily, expecting rapid (within 1 week) symptomatic improvement; slow taper over 1-2 years","High-dose IV methylprednisolone","NSAIDs alone","Hydroxychloroquine"],
   correct:"B",
   explanation:"POLYMYALGIA RHEUMATICA (PMR): a common inflammatory disorder of the elderly characterised by proximal pain and stiffness, raised inflammatory markers, and dramatic response to low-dose corticosteroid. PRESENTATION (CLASSIC features): SUBACUTE onset (weeks); SYMMETRICAL pain and stiffness in the SHOULDER and HIP girdles (NECK, lower back may also be involved); MORNING STIFFNESS prominently >45 min, often hours; difficulty performing overhead activities (combing hair, dressing), rising from chair, climbing stairs; CONSTITUTIONAL features — fatigue, malaise, low-grade fever, weight loss (10-15%), depression, anorexia. NO single diagnostic test.\n\n(A) Methotrexate alone is steroid-sparing, not first-line.\n\n(C) IV high-dose steroid for severe disease (e.g. GCA with vision loss) — overkill for typical PMR.\n\n(D) NSAIDs alone are inadequate — won't control inflammation, risks GI / renal in elderly.\n\n(E) Hydroxychloroquine not effective in PMR.\n\n💎 PEARL: Older patient + bilateral shoulder/hip-girdle pain + morning stiffness >45 min + raised inflammatory markers + dramatic response to low-dose steroid = polymyalgia rheumatica. Prednisolone 15 mg daily — expect improvement within a week. Slow taper over 1–2 years. Always ask about GCA features; bone protection.",
   references:[{label:"BSR Polymyalgia Rheumatica Guidelines (2010)", url:"https://academic.oup.com/rheumatology/article/49/1/186/1784739"},{label:"ACR/EULAR 2012 PMR Classification Criteria", url:"https://ard.bmj.com/content/71/4/484"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Ankylosing spondylitis (axSpA)",
   stem:"A 25-year-old man has a 6-month history of inflammatory low back pain — gradual onset, worse at night (often wakes him in the second half of the night), worse with rest, improves with exercise, with prolonged morning stiffness lasting 2 hours; intermittent buttock pain (alternating sides — sacroiliitis). Examination: reduced lumbar flexion (modified Schober's test <5 cm), reduced chest expansion (<2.5 cm), reduced neck rotation. No peripheral joint synovitis but left achilles tendon tenderness (enthesitis). Family history positive for father with 'spinal arthritis'. Investigations: CRP 35 (raised), ESR 50, RF / anti-CCP negative; HLA-B27 positive. Plain pelvis x-ray: bilateral sacroiliitis (grade 2-3, sclerosis without complete fusion).\n\nWhich is the most likely diagnosis?",
   options:["Mechanical low back pain","Ankylosing spondylitis (radiographic axial spondyloarthritis)","Disc prolapse","Fibromyalgia","Multiple myeloma"],
   correct:"B",
   explanation:"AXIAL SPONDYLOARTHRITIS (axSpA): an inflammatory rheumatic disease primarily affecting the spine and sacroiliac joints, characterised by INFLAMMATORY BACK PAIN, sacroiliitis, ENTHESITIS (inflammation at insertion of tendons / ligaments into bone), and characteristic RADIOGRAPHIC changes. \n\nDIAGNOSIS: BACKGROUND of inflammatory back pain in young adult (<45) + ANY of: SACROILIITIS on imaging, HLA-B27 positivity, RAISED inflammatory markers, response to NSAIDs, family history, peripheral features (uveitis, psoriasis, IBD, dactylitis, enthesitis), inflammatory back pain features (insidious, age <40, etc.).\n\n(A) Mechanical back pain: improves with rest, worse with movement, NO night pain, normal inflammatory markers — opposite pattern.\n\n(C) Disc prolapse: typically radicular pain, dermatomal sensory loss, LMN signs, leg pain dominant, MRI shows disc protrusion — different.\n\n(D) Fibromyalgia: chronic widespread pain, multiple tender points, fatigue, normal inflammatory markers, no synovitis or sacroiliitis.\n\n(E) Multiple myeloma: older patients, CRAB features (Calcium, Renal, Anaemia, Bone — lytic), monoclonal gammopathy, normal inflammatory pattern.\n\n💎 PEARL: Young man + inflammatory back pain (worse at rest, IMPROVES with exercise, prolonged morning stiffness) + alternating buttock pain + reduced Schober + HLA-B27 = axial spondyloarthritis. Sacroiliitis on MRI = nr-axSpA; on X-ray = AS. NSAIDs first-line; biologics (TNFi, IL-17i) if NSAID-refractory. Physiotherapy throughout.",
   references:[{label:"ACR/SAA/SPARTAN AS Treatment Recommendations (2019)", url:"https://www.rheumatology.org/Practice-Quality/Clinical-Support/Clinical-Practice-Guidelines/Spondyloarthritis"},{label:"ASAS-EULAR Recommendations (2022)", url:"https://ard.bmj.com/content/82/1/19"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Antiphospholipid syndrome — anticoagulation",
   stem:"A 32-year-old woman with established SLE has now had two unprovoked deep vein thromboses (left calf 2 years ago, right popliteal 6 months ago) and three first-trimester miscarriages (≥10 weeks gestation each, no fetal abnormalities). Investigations: lupus anticoagulant positive on two occasions, 12 weeks apart; anticardiolipin IgG strongly positive on two occasions, 12 weeks apart; anti-β2-glycoprotein-i IgG positive on two occasions, 12 weeks apart (triple positive). She is currently on apixaban prescribed by another team after the most recent DVT. No active lupus flare; renal function normal.\n\nWhich is the most appropriate long-term antithrombotic management?",
   options:["Aspirin 75 mg daily alone","Switch to lifelong warfarin (target INR 2.5)","Continue direct oral anticoagulant","No long-term anticoagulation","Hydroxychloroquine alone"],
   correct:"B",
   explanation:"ANTIPHOSPHOLIPID SYNDROME (APS): an acquired AUTOIMMUNE thrombophilia characterised by recurrent VENOUS or ARTERIAL THROMBOSIS and / or PREGNANCY MORBIDITY in the presence of persistently positive antiphospholipid antibodies. \n\nDIAGNOSIS: clinical features + persistent positive aPL panel; exclude alternative thrombophilias and pregnancy losses; rule out lupus / other connective tissue disease (relevant to this patient — known SLE). MANAGEMENT — depends on the manifestation: (1) ASYMPTOMATIC POSITIVE aPL — no thrombosis, no pregnancy morbidity: low-dose ASPIRIN 75 mg daily considered (controversial — evidence weak; balance bleeding vs benefit); HYDROXYCHLOROQUINE in SLE-associated cases (some thrombotic protection in SLE patients; foundation in SLE management).\n\n(A) Aspirin alone is INADEQUATE for established thrombosis — needs anticoagulation.\n\n(C) DOAC contraindicated in triple-positive APS as above.\n\n(D) No long-term treatment risks recurrence with high mortality.\n\n(E) Hydroxychloroquine alone is adjunctive — does not replace anticoagulation.\n\n💎 PEARL: APS + thrombotic event (especially triple-positive: lupus anticoagulant + anti-cardiolipin + anti-β2GP-I): WARFARIN target INR 2.5 lifelong. DOACs INFERIOR (TRAPS, RAPS — apixaban worse than warfarin, especially in triple-positive and arterial events). Add hydroxychloroquine if SLE-associated.",
   references:[{label:"EULAR Recommendations for APS (2019)", url:"https://ard.bmj.com/content/78/10/1296"},{label:"BCSH Guidelines on APS Diagnosis and Management", url:"https://b-s-h.org.uk/"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Drug-induced lupus",
   stem:"A 55-year-old woman has been on hydralazine 50 mg TDS for 6 months for resistant hypertension (added to amlodipine and ramipril, BP previously poorly controlled). Over the past 4 months she has developed progressive arthralgia (symmetric, mainly hands and wrists), malar rash, pleuritic chest pain (with small pleural effusion on CXR), and fatigue. No renal involvement (urinalysis normal, creatinine normal). No CNS features. Investigations: ANA positive 1:640 (homogeneous pattern), anti-histone antibodies strongly positive; anti-dsdna negative, anti-Sm negative; complements (C3, C4) normal; FBC mild lymphopenia. CXR: small bilateral pleural effusions.\n\nWhich is the most appropriate management?",
   options:["Continue hydralazine and add hydroxychloroquine","Stop hydralazine — symptoms typically resolve over weeks-months; switch antihypertensive to alternative class","Start methotrexate","Renal biopsy","Start biologic therapy"],
   correct:"B",
   explanation:"DRUG-INDUCED LUPUS ERYTHEMATOSUS (DILE): a lupus-like syndrome triggered by certain medications, with characteristic clinical and immunological features that resolve on drug discontinuation. INVESTIGATIONS — KEY DIFFERENTIATING IMMUNOLOGY: ANA POSITIVE — sensitive (>95%) but not specific; typically HOMOGENEOUS pattern. MONITORING — clinical assessment, ANA / inflammatory markers periodically — typically resolution within months but can take 1-2 years for serology.\n\n(A) Continuing hydralazine perpetuates the immune trigger — central principle is to STOP.\n\n(C) Methotrexate is for primary SLE / RA; not first-line for DILE which resolves on drug withdrawal.\n\n(D) Renal biopsy not indicated — no renal involvement; DILE rarely affects kidneys.\n\n(E) Biologic therapy not warranted — this is a self-limiting drug reaction.\n\n💎 PEARL: Hydralazine, procainamide, isoniazid, minocycline, anti-TNF + lupus features (rash, arthralgia, serositis) but NO renal/CNS involvement + ANA + anti-HISTONE positive + anti-dsDNA negative + complement normal = drug-induced lupus. STOP the drug — symptoms resolve over weeks. Switch to alternative class.",
   references:[{label:"BSR SLE Guidelines (2017)", url:"https://academic.oup.com/rheumatology/article/57/1/e1/4566103"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Granulomatosis with polyangiitis (GPA)",
   stem:"A 50-year-old man has 3 months of progressive nasal crusting, epistaxis, sinusitis, hoarseness, and a saddle-nose deformity (collapse of nasal bridge from cartilage erosion). Now also reports haemoptysis, dyspnoea, and fatigue. Examination: saddle-nose, conductive hearing loss bilaterally (granulomas in middle ear), purpuric rash on lower legs. Investigations: high CRP (180), creatinine 220 (raised from baseline 80, AKI), urinalysis blood ++++, protein +++ with red cell casts (active sediment); cANCA positive with PR3-ANCA strongly positive (titre >100); mpo-anca negative. CXR: bilateral cavitating lung nodules; renal ultrasound: normal-sized kidneys, no obstruction.\n\nWhich is the most appropriate management?",
   options:["Methotrexate alone","Induction with pulse methylprednisolone followed by oral steroid + (cyclophosphamide OR rituximab); maintenance with rituximab or azathioprine","Allergy clinic referral","NSAIDs alone","Hydroxychloroquine"],
   correct:"B",
   explanation:"GRANULOMATOSIS WITH POLYANGIITIS (GPA, formerly WEGENER'S GRANULOMATOSIS): a SMALL- to MEDIUM-VESSEL ANCA-ASSOCIATED NECROTISING VASCULITIS characterised by GRANULOMATOUS INFLAMMATION of the upper airways, lungs, and other organs, often with NECROTISING GLOMERULONEPHRITIS. \n\nINVESTIGATIONS: ANCA — IIF (immunofluorescence) pattern + antigen-specific testing: cANCA — cytoplasmic — typically PR3-ANCA — strongly suggestive of GPA (sensitivity 90%, specificity 95%); pANCA — perinuclear — typically MPO-ANCA — MPA, EGPA, sometimes other (drug-induced, IBD-associated).\n\n(A) Methotrexate alone is for LIMITED GPA (no organ-threatening disease) — inadequate for severe disease.\n\n(C) Allergy not relevant.\n\n(D) NSAIDs treat nothing here.\n\n(E) Hydroxychloroquine has no role in AAV.\n\n💎 PEARL: GPA induction (saddle nose + cavitating lung nodules + RPGN + cANCA/PR3): pulse methylprednisolone + cyclophosphamide OR rituximab + oral steroid (RAVE, RITUXVAS — rituximab non-inferior). Plasma exchange for severe renal disease (eGFR <50) or pulmonary haemorrhage (PEXIVAS). Maintenance: rituximab (RITAZAREM, MAINRITSAN).",
   references:[{label:"EULAR/ERA-EDTA AAV Guidelines (2023 update)", url:"https://ard.bmj.com/content/82/1/30"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Reactive arthritis",
   stem:"A 28-year-old man develops asymmetric oligoarthritis of the left knee and right ankle (acute onset, swollen, painful), plus bilateral conjunctivitis, urethral discharge (now treated chlamydia), and a circinate balanitis (psoriasiform rash on glans penis), 3 weeks after an episode of bacterial gastroenteritis (positive stool culture for shigella flexneri 4 weeks ago). Examination: also notes heel pain (Achilles enthesitis) and dactylitis ('sausage digit') of the right second toe. Investigations: ESR 50, CRP 65, RF and anti-CCP negative, HLA-B27 positive, urethral PCR confirms recent chlamydia (treated), HIV negative. Joint aspirate: sterile inflammatory effusion (no crystals, no bacteria, WCC 25,000 neutrophil-predominant); cultures negative. X-rays: normal joint surfaces; periosteal reaction at calcaneus consistent with enthesitis.\n\nWhich is the most likely diagnosis?",
   options:["Septic arthritis","Reactive arthritis","Rheumatoid arthritis","Disseminated gonococcal arthritis","Crystal arthropathy"],
   correct:"B",
   explanation:"REACTIVE ARTHRITIS (formerly REITER SYNDROME — name discontinued due to STRONG ASSOCIATION with HLA-B27 (~50-70% of patients positive — vs ~8% UK population; HLA-B27+ patients have more severe and chronic disease). PRESENTATION — typically 1-4 WEEKS post-infection (this patient — 3 weeks): JOINT — ASYMMETRIC OLIGOARTHRITIS (typically <5 joints) of LOWER LIMB predominantly (knees, ankles, feet); SACROILIITIS / spondylitis (~50% chronic disease); ENTHESITIS (Achilles tendinopathy, plantar fasciitis); DACTYLITIS ('sausage digits' — diffuse swelling of finger / toe — also seen in psoriatic arthritis).\n\n(A) Septic arthritis: similar acute hot joint, but EXCLUDED by sterile aspiration here; would have positive cultures.\n\n(C) RA: symmetrical small joint, RF / anti-CCP positive, MCP / PIP / wrist; this asymmetric large lower joint pattern with extra-articular features is different.\n\n(D) Disseminated gonococcal: triad of tenosynovitis, dermatitis (small pustules on extremities), arthritis (often migratory); DGI from urethral / pharyngeal / cervical N. gonorrhoeae detectable on PCR / culture; treated with ceftriaxone — important DDx.\n\n(E) Crystal arthropathy: gout / pseudogout — crystal-positive aspirate; this is sterile non-crystal.\n\n💎 PEARL: Asymmetric lower-limb oligoarthritis + conjunctivitis + urethritis + circinate balanitis/keratoderma + dactylitis + enthesitis 1–4 weeks after enteric (Shigella, Salmonella, Campylobacter, Yersinia) or genitourinary (Chlamydia) infection in HLA-B27+ patient = reactive arthritis. NSAIDs first-line; sulfasalazine/MTX/anti-TNF for chronic. Treat triggering infection.",
   references:[{label:"BSR Spondyloarthritis Guidelines", url:"https://www.rheumatology.org.uk/practice-quality/guidelines"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Polyarteritis nodosa",
   stem:"A 50-year-old man has 8 weeks of constitutional symptoms (fever 38.2°C, weight loss 6 kg), postprandial abdominal pain (mesenteric ischaemia after meals — 'intestinal angina'), severe hypertension (BP 195/110, new-onset), mononeuritis multiplex with right foot drop (sudden), painful palpable purpura on his lower legs, and testicular pain (right testicle, no mass). Examination: livedo reticularis on thighs. Investigations: hepatitis B surface antigen positive (HBV dna 8 log10), ANCA negative (both p-ANCA and c-ANCA), Hb 102 (anaemia), CRP 110 (raised), creatinine 130 (mildly raised), urinalysis: protein +, no red cell casts, no active sediment. Mesenteric angiography (CT angio): multiple microaneurysms in renal and mesenteric arteries (2-5 mm — 'beaded' pattern).\n\nWhich is the most likely diagnosis?",
   options:["Granulomatosis with polyangiitis","Polyarteritis nodosa (PAN)","Systemic lupus erythematosus","Microscopic polyangiitis","Behçet syndrome"],
   correct:"B",
   explanation:"POLYARTERITIS NODOSA (PAN): MEDIUM-VESSEL necrotising vasculitis affecting muscular arteries (without involvement of small vessels — capillaries, venules — or aorta / large vessels in pure PAN). \n\nDIAGNOSIS: NO single diagnostic test; based on combination of clinical features, exclusion of mimics, ARTERIOGRAPHY findings, BIOPSY findings. MANAGEMENT — DEPENDS on IDIOPATHIC PAN: similar to ANCA-associated vasculitis treatment — INDUCTION with HIGH-DOSE PREDNISOLONE (1 mg/kg) + CYCLOPHOSPHAMIDE (oral or IV pulsed; rituximab less established in PAN); MAINTENANCE with azathioprine, methotrexate, or mycophenolate; treatment continued for ~18-24 months. RELAPSE common.\n\n(A) GPA: granulomatous, ANCA-positive (c-ANCA / PR3), upper airway / lung / kidney glomerulonephritis.\n\n(C) SLE: ANA / dsDNA positive, immune complex glomerulonephritis, low complement, multi-system but DIFFERENT pattern.\n\n(D) MPA: ANCA-positive (p-ANCA / MPO typically), small-vessel, glomerulonephritis prominent, pulmonary capillaritis.\n\n(E) Behçet: oral / genital ulcers, uveitis, pathergy, large vessel involvement (not classic medium-vessel pattern of PAN).\n\n💎 PEARL: Medium-vessel vasculitis: constitutional symptoms + 'intestinal angina' + new severe hypertension + mononeuritis multiplex + livedo + testicular pain + ANCA NEGATIVE + HBV-positive = polyarteritis nodosa. Strongly associated with HBV. Steroids + cyclophosphamide; antiviral therapy for HBV-associated PAN; brief plasma exchange if life-threatening.",
   references:[{label:"EULAR/ERA-EDTA Vasculitis Guidelines", url:"https://ard.bmj.com/"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Behçet syndrome",
   stem:"A 28-year-old man originally from Turkey has 3 years of recurrent painful oral aphthae (>3 episodes per year, healing in 1-2 weeks; now ~8 ulcers in mouth), recurrent painful genital ulcers (scrotal scars from prior episodes), anterior uveitis (intermittent — current episode confirmed by ophthalmology with hypopyon), erythema nodosum-like skin lesions on shins, and a positive pathergy test (papule formation 24-48 hours after sterile needle prick — classic). He has a history of unprovoked DVT 2 years ago. He has no significant comorbidity, no IBD symptoms.\n\nWhich is the most likely diagnosis?",
   options:["Behçet syndrome","Reactive arthritis","Crohn's disease","Systemic lupus erythematosus","Pemphigus vulgaris"],
   correct:"A",
   explanation:"BEHÇET SYNDROME (BEHÇET'S DISEASE): a chronic relapsing multisystem inflammatory disorder of unknown aetiology, often classified as a 'variable vessel vasculitis' (CHCC 2012) — affects vessels of all sizes, both arterial and venous. Peak onset 20-40 years; M:F roughly equal, but men have more severe disease. KEY POINT — vascular thrombosis in Behçet's is felt to result from VASCULAR INFLAMMATION (vasculitis with thrombosis) rather than a hypercoagulable state — IMMUNOSUPPRESSION is the cornerstone of therapy, not anticoagulation alone. MANAGEMENT (EULAR 2018 guidelines): ORGAN-SPECIFIC; multidisciplinary care.\n\n(B) Reactive arthritis: post-infectious; conjunctivitis, urethritis, asymmetric oligoarthritis; not the relapsing oral / genital ulcer pattern.\n\n(C) Crohn's: GI symptoms predominant, oral ulcers common but pattern differs; biopsy needed if GI involvement.\n\n(D) SLE: ANA-positive, malar rash, nephritis, multi-system but different.\n\n(E) Pemphigus: blistering skin / mucosal autoimmune disease, with positive antibodies (anti-desmoglein); biopsy / direct immunofluorescence different.\n\n💎 PEARL: Recurrent oral aphthae + genital ulcers + uveitis (often hypopyon) + erythema nodosum + positive pathergy + DVT + Silk Road geography = Behçet syndrome. Vascular thrombosis is from VASCULITIS — IMMUNOSUPPRESSION (not anticoagulation alone) is cornerstone. Colchicine for mucocutaneous; azathioprine or anti-TNF for severe organ involvement.",
   references:[{label:"EULAR Behçet Recommendations (2018)", url:"https://ard.bmj.com/content/77/6/808"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Methotrexate toxicity (overdose)",
   stem:"A 60-year-old woman on methotrexate 15 mg once weekly for rheumatoid arthritis presents with painful mouth ulcers (severe — unable to eat), nausea, vomiting, and pancytopenia (Hb 84, WCC 1.6, neutrophils 0.4, platelets 70). On detailed history, she has been mistakenly taking methotrexate daily (15 mg/day rather than weekly) for the past 2 weeks (cumulative dose ~210 mg vs intended 30 mg). Examination: febrile (38.0°C), oral mucositis, no rash. Investigations: ALT 220 (raised), creatinine 110 (mild AKI), neutrophils 0.4 — significantly low.\n\nWhich is the most appropriate immediate management?",
   options:["Continue methotrexate at lower dose","Stop methotrexate, hospital admission for folinic acid rescue (calcium folinate), supportive blood products / G-CSF, hydration with urinary alkalinisation, glucarpidase if severe","Folic acid 5 mg daily and discharge","Steroid alone","Aspirin"],
   correct:"B",
   explanation:"METHOTREXATE TOXICITY from inadvertent DAILY rather than weekly dosing is a recognised PATIENT SAFETY EVENT — listed as a 'NEVER EVENT' in primary care prescribing in some healthcare systems. Beneficial in inflammatory disease at low doses (~7.5–25 mg weekly). HALF-LIFE 3-10 hours but accumulates in tissues with active metabolites (polyglutamated MTX). Eliminated 90% by KIDNEY — renal impairment dramatically increases toxicity risk. (5) PULMONARY — METHOTREXATE PNEUMONITIS. (10) TERATOGENICITY — abortifacient, congenital malformations (neural tube defects, craniofacial, limb); pregnancy CONTRAINDICATED; STOP 3-6 months pre-conception (men and women); reliable contraception throughout. MANAGEMENT of OVERDOSE / SEVERE TOXICITY: (1) STOP METHOTREXATE immediately.\n\n(A) Continue MTX worsens toxicity.\n\n(C) Folic acid alone insufficient — needs folinic acid.\n\n(D) Steroid not standard treatment for MTX toxicity.\n\n(E) Aspirin no role; could worsen renal / GI toxicity.\n\n💎 PEARL: DAILY (instead of weekly) methotrexate dosing → cumulative toxicity: mucositis + pancytopenia + LFT derangement + AKI. STOP MTX. FOLINIC ACID (calcium folinate) rescue immediately. Supportive: G-CSF, blood products, hydration with urinary alkalinisation. Glucarpidase for severe overdose with renal failure. Wrong-dose methotrexate is a Never Event in primary care prescribing.",
   references:[{label:"BSR Methotrexate Guideline", url:"https://www.rheumatology.org.uk/practice-quality/guidelines"},{label:"TOXBASE — Methotrexate", url:"https://www.toxbase.org/"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Adult-onset Still disease",
   stem:"A 30-year-old woman presents with 4 weeks of daily evening fevers (peaking 39.8°C, defervescing to normal each morning — quotidian), an evanescent 'salmon-pink' macular rash on her trunk and proximal limbs (appears with the fever, fades when fever subsides), polyarthralgia (knees, wrists, ankles), persistent sore throat, generalised lymphadenopathy, and hepatosplenomegaly. Investigations: WCC 24 × 10⁹/L (neutrophil-predominant, 90% neutrophils — striking neutrophilia), CRP 280 (markedly raised), ESR 90, ALT 180 (raised), ferritin 18,000 µg/L (markedly elevated), low glycosylated ferritin fraction (<20%); ANA, RF, anti-CCP negative; blood cultures negative x 3; viral / parasitic / TB screen negative; CT — no malignancy; bone marrow normal.\n\nWhich is the most likely diagnosis?",
   options:["Adult-onset Still disease","Bacterial sepsis","Systemic lupus erythematosus","Lymphoma","Autoimmune hepatitis"],
   correct:"A",
   explanation:"ADULT-ONSET STILL DISEASE (AOSD): a rare, systemic AUTOINFLAMMATORY (rather than autoimmune) disorder, the adult counterpart of SYSTEMIC JUVENILE IDIOPATHIC ARTHRITIS (sJIA — formerly 'Still's disease' Incidence ~1 per million / year. Bimodal age peaks: 15-25 and 36-45; F:M ~1:1. PRESENTATION — CLASSIC TRIAD: (1) HIGH SPIKING FEVER — typically once or twice daily ('quotidian' or 'double-quotidian'), often evening, peaking >39°C, defervescing fully to normal between spikes (KEY differentiator from continuous fever of infection); duration ≥1 week. \n\nMANAGEMENT: PRIMARY CARE — analgesia, observation, refer to rheumatology. PROGNOSIS: variable.\n\n(B) Bacterial sepsis: persistent / continuous fever, focal source identifiable, positive cultures expected.\n\n(C) SLE: ANA-positive, malar rash (DIFFERENT from AOSD evanescent rash), nephritis, autoantibodies.\n\n(D) Lymphoma: B-symptoms, lymphadenopathy, splenomegaly — important DDx; CT and biopsy / bone marrow exclude.\n\n(E) Autoimmune hepatitis: ANA / SMA / LKM positive, plasmacytic infiltrate on biopsy, gradual onset; LFT pattern more cholestatic-mixed.\n\n💎 PEARL: Quotidian (daily evening) high spiking fever + EVANESCENT salmon-pink rash (appears WITH the fever, fades when fever subsides) + arthralgia + sore throat + lymphadenopathy + neutrophil leukocytosis + ferritin >5× ULN (often >10,000) = adult-onset Still disease. Yamaguchi criteria. NSAIDs/steroids; anakinra, canakinumab or tocilizumab for refractory.",
   references:[{label:"EULAR Recommendations Adult-Onset Still's Disease", url:"https://ard.bmj.com/"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Psoriatic arthritis",
   stem:"A 45-year-old man with a 10-year history of chronic plaque psoriasis (treated with topicals, mostly stable) develops 4 months of progressive asymmetric oligoarthritis — affecting the right knee (effusion) and the second and third DIP joints of his right hand (swollen, painful), with dactylitis ('sausage finger' — diffuse swelling of the right second finger from base to tip). Examination: nail pitting and onycholysis (lifting of nail bed) on multiple fingers; psoriatic plaques on extensor surfaces; achilles tendon enthesitis. Investigations: RF and anti-CCP negative, CRP 32 (raised), ESR 35; x-rays — pencil-in-cup deformity at right second DIP, fluffy periostitis at calcaneal enthesis. HLA-B27 negative.\n\nWhich is the most likely diagnosis?",
   options:["Rheumatoid arthritis","Psoriatic arthritis","Septic arthritis","Reactive arthritis","Gout"],
   correct:"B",
   explanation:"PSORIATIC ARTHRITIS (PsA): inflammatory arthritis associated with PSORIASIS. IBD association (overlap with spondyloarthropathy). DIAGNOSIS — CASPAR CRITERIA (ClASsification criteria for Psoriatic ARthritis): inflammatory articular disease (joint, spine, or entheseal) + ≥3 points from: current psoriasis (2 points) / personal history (1) / family history (1); psoriatic NAIL dystrophy (1); RF NEGATIVE (1); current or history of DACTYLITIS (1); juxta-articular new bone formation on radiographs of hand or foot (1).\n\n(A) RA: symmetric small joint, RF / anti-CCP positive in most, no skin / nail psoriasis pattern.\n\n(C) Septic arthritis: monoarticular (usually) hot joint, fever, rapid onset; positive aspirate cultures.\n\n(D) Reactive arthritis: post-infectious 1-4 weeks; conjunctivitis / urethritis; HLA-B27 strong association.\n\n(E) Gout: monoarticular acute, MTP1 'podagra'; crystal-positive aspirate.\n\n💎 PEARL: Asymmetric oligoarthritis + DIP involvement + dactylitis ('sausage digit') + nail pitting/onycholysis + enthesitis + plaque psoriasis = psoriatic arthritis (CASPAR criteria). Spondylitis in ~30%. NSAIDs + intra-articular steroid for mild; methotrexate or sulfasalazine for peripheral; biologics (TNFi, IL-17i, IL-23i, JAKi) for axial or refractory.",
   references:[{label:"EULAR PsA Recommendations (2023)", url:"https://ard.bmj.com/content/82/1/3"},{label:"GRAPPA PsA Treatment Recommendations (2021)", url:"https://onlinelibrary.wiley.com/doi/10.1002/art.42061"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Fibromyalgia",
   stem:"A 42-year-old woman has 2 years of widespread musculoskeletal pain (above and below waist, both sides of body, axial — neck, lower back), severe fatigue, non-restorative sleep, cognitive difficulties ('fibro-fog' — concentration, word-finding, short-term memory), tender points throughout her body on examination (>11 of 18 classic tender points sensitive), low mood, and irritable bowel symptoms. No joint swelling, no rash, no objective neurology. Investigations completely normal: CRP, ESR, FBC, U&E, LFTs, TFTs, ANA, RF, anti-CCP, vitamin D, ferritin all within range. Acr 2016 criteria: widespread pain index 14, symptom severity score 9 — meets criteria.\n\nWhich is the most appropriate management?",
   options:["Long-term opioid analgesia","Patient education and validation, graded aerobic exercise, CBT, with adjunctive amitriptyline / duloxetine / pregabalin if symptoms refractory","Long-term oral steroid","Methotrexate","Long-term NSAID"],
   correct:"B",
   explanation:"FIBROMYALGIA: a chronic central pain syndrome characterised by WIDESPREAD MUSCULOSKELETAL PAIN, FATIGUE, SLEEP DISTURBANCE, and COGNITIVE SYMPTOMS, in the ABSENCE of inflammatory or structural disease. FATIGUE — disabling; not relieved by rest. STIFFNESS — generalised, prolonged. DIAGNOSIS — CLINICAL — based on characteristic symptoms in absence of alternative explanation. PHARMACOLOGICAL (adjunct, modest evidence; significant placebo response in trials): AMITRIPTYLINE 10-50 mg nocte — TCA; modulates pain and improves sleep; SE — anticholinergic (dry mouth, constipation, retention, drowsiness, confusion in elderly), QT prolongation, weight gain.\n\n(A) Long-term opioids: harmful, ineffective, addictive — SHOULD AVOID.\n\n(C) Steroid: no inflammation; harm from chronic steroid; NO role.\n\n(D) Methotrexate: DMARD for inflammatory arthritis; no role here; harm from immunosuppression.\n\n(E) Long-term NSAID: limited efficacy; harm from chronic use.\n\n💎 PEARL: Widespread pain + fatigue + non-restorative sleep + 'fibro-fog' + tender points + NORMAL inflammatory markers + NORMAL imaging = fibromyalgia. Diagnosis is CLINICAL — no specific test. Cornerstone: education, validation, graded aerobic exercise, CBT. Adjunctive amitriptyline, duloxetine or pregabalin if symptoms refractory.",
   references:[{label:"EULAR Fibromyalgia Recommendations (2017)", url:"https://ard.bmj.com/content/76/2/318"},{label:"ACR Fibromyalgia Diagnostic Criteria (2016)", url:"https://www.rheumatology.org/Practice-Quality/Clinical-Support/Clinical-Practice-Guidelines/Fibromyalgia"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Antiphospholipid syndrome — pregnancy planning",
   stem:"A 32-year-old woman with confirmed antiphospholipid syndrome (APS) is planning pregnancy. Background: two unprovoked DVTs (one with PE) over the past 5 years; persistent triple-positive antiphospholipid antibodies — lupus anticoagulant, anti-cardiolipin IgG and anti-β2gp-i IgG, all confirmed positive on two occasions ≥12 weeks apart. She is on warfarin (target INR 2.5; well-controlled); she is currently HIV negative, no other illness. She has had no obstetric losses. She has stopped warfarin while planning conception.\n\nWhich is the most appropriate management strategy?",
   options:["Continue warfarin throughout pregnancy","Pre-pregnancy counselling, switch to therapeutic LMWH plus low-dose aspirin from confirmation of pregnancy, throughout pregnancy and 6 weeks postpartum","Aspirin alone","Stop all anticoagulation","Switch to a direct oral anticoagulant (DOAC)"],
   correct:"B",
   explanation:"ANTIPHOSPHOLIPID SYNDROME (APS): autoimmune prothrombotic disorder defined by VASCULAR THROMBOSIS (arterial or venous) and / or PREGNANCY MORBIDITY in the presence of PERSISTENT antiphospholipid antibodies. SAPPORO / SYDNEY CLASSIFICATION CRITERIA (revised 2006; new 2023 ACR / EULAR criteria emerging): CLINICAL — vascular thrombosis (any vessel), and / or pregnancy morbidity; LABORATORY — at least 1 of: lupus anticoagulant; anti-cardiolipin IgG / IgM (medium / high titre); anti-β2-glycoprotein-I IgG / IgM (medium / high titre); positive on ≥2 occasions ≥12 WEEKS apart (to exclude transient positivity from infection / drug reaction). MANAGEMENT IN PREGNANCY: REGIMENS depend on APS pattern:\n\n(A) APS with PRIOR THROMBOSIS (this patient): THERAPEUTIC-DOSE LMWH (e.g. tinzaparin 175 units/kg or dalteparin 200 units/kg or enoxaparin 1 mg/kg twice daily — based on booking weight) + LOW-DOSE ASPIRIN 75-100 mg daily.\n\n(B) APS WITH OBSTETRIC MORBIDITY ONLY (recurrent miscarriages, late fetal loss, severe pre-eclampsia related to APS) but NO prior thrombosis: PROPHYLACTIC-dose LMWH + LOW-DOSE ASPIRIN 75-100 mg from confirmation of pregnancy through to 6 weeks postpartum.\n\n(C) ASYMPTOMATIC POSITIVE antibodies: low-dose aspirin throughout pregnancy as primary prevention; no LMWH unless other risk factors.\n\n(A) Continue warfarin: TERATOGENIC in pregnancy — significant fetal harm; must switch.\n\n(C) Aspirin alone: insufficient for triple-positive with prior thromboses — high recurrence risk.\n\n(D) Stop all anticoagulation: unacceptable — thrombosis recurrence guaranteed.\n\n(E) DOAC: contraindicated in APS (TRAPS) and in pregnancy.\n\n💎 PEARL: APS + planning pregnancy: switch to therapeutic LMWH + low-dose aspirin from confirmation of pregnancy, throughout pregnancy and 6 weeks postpartum. AVOID warfarin in 1st trimester (teratogenic). DOACs CONTRAINDICATED in pregnancy. Continue hydroxychloroquine if SLE-associated.",
   references:[{label:"EULAR Recommendations for APS (2019)", url:"https://ard.bmj.com/content/78/10/1296"},{label:"BCSH Guidelines on APS Diagnosis and Management", url:"https://b-s-h.org.uk/"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Vertebral fragility fracture — bone protection",
   stem:"A 68-year-old postmenopausal woman has acute thoracic back pain after lifting a moderate weight (groceries from car boot). CT spine shows a new T8 vertebral compression fracture (~30% loss of height; no posterior cortex involvement). No trauma proportionate to the injury — this is a fragility fracture. Investigations: routine bloods normal, calcium 2.40 (normal), phosphate normal, ALP 95 (normal), vitamin D 38 nmol/L (suboptimal — replete >50), TSH normal, immunoglobulins / serum electrophoresis normal (no myeloma), coeliac negative, no other secondary causes identified. She is otherwise well; weight 60 kg; no falls in past year; no smoking, moderate alcohol; no steroid history.\n\nWhich is the most appropriate management?",
   options:["No further investigation","Investigate for secondary osteoporosis, supplement calcium and vitamin D, start oral alendronic acid 70 mg weekly, falls assessment, address underlying causes","Long-term oral steroid","Aspirin 75 mg daily","No follow-up needed"],
   correct:"B",
   explanation:"OSTEOPOROSIS and FRAGILITY FRACTURES: a major public health problem; Defined as 'a skeletal disorder of compromised bone strength predisposing to increased risk of fracture'. KEY POINT — VERTEBRAL FRAGILITY FRACTURE is the STRONGEST predictor of further fracture (>4-fold increased risk over 1-2 years; 'cascade' phenomenon — one vertebral fracture predicts the next). \n\nDIAGNOSIS: PRESENCE of FRAGILITY FRACTURE in older adults DEFINES osteoporosis CLINICALLY (regardless of DEXA result). Z-score (compared to age-matched) used in pre-menopausal women / younger men / children.\n\n(A) No investigation: misses secondary causes; risks ongoing fracture.\n\n(C) Long-term steroid: CAUSES osteoporosis — opposite intervention.\n\n(D) Aspirin: no role in OP.\n\n(E) No follow-up: misses cascade fracture risk; 4x risk of further fractures.\n\n💎 PEARL: Postmenopausal woman + new vertebral fracture from minor trauma = fragility fracture (defines clinical osteoporosis regardless of DEXA). Strongest predictor of further fracture (>4× over 1–2 years). Investigate secondary causes (vitamin D, TSH, PTH, myeloma, coeliac). Calcium + vitamin D + alendronate 70 mg weekly. Falls assessment.",
   references:[{label:"NICE NG104 / NG12 — Fragility fractures, bone health", url:"https://www.nice.org.uk/guidance/ng104"},{label:"NOGG 2021 Guidelines for Osteoporosis", url:"https://www.nogg.org.uk/"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Sjögren syndrome",
   stem:"A 50-year-old woman has 18 months of progressive DRY eyes (gritty sensation, foreign body, photophobia, recurrent corneal erosions) and DRY mouth (difficulty swallowing dry food, increased dental caries, oral candidiasis), plus intermittent bilateral parotid swelling (non-tender), arthralgia of small joints (no swelling), fatigue, and Raynaud's phenomenon. Examination: dry oral mucosa with frothy saliva, parotid enlargement, no synovitis. Investigations: schirmer test <5 mm in 5 minutes (positive — confirmed reduced tear production), reduced salivary flow rate. Autoantibodies: ANA positive (1:640), anti-Ro (SSA) and anti-La (SSB) positive, rheumatoid factor positive, anti-CCP negative, low C4. Minor salivary gland biopsy (lower lip): focal lymphocytic sialadenitis with focus score ≥1. ACR/EULAR criteria score 6 (≥4 = primary Sjögren).\n\nWhich is the most likely diagnosis?",
   options:["Sjögren syndrome (primary)","Systemic lupus erythematosus","Rheumatoid arthritis","Mixed connective tissue disease","IgG4-related disease"],
   correct:"A",
   explanation:"SJÖGREN SYNDROME (SS): a chronic autoimmune EXOCRINOPATHY characterised by lymphocytic infiltration of EXOCRINE GLANDS (especially lacrimal and salivary), causing progressive glandular dysfunction with SICCA SYMPTOMS (dry eyes, dry mouth) and a wide range of EXTRAGLANDULAR / SYSTEMIC manifestations. 05-0.1% (~1 per 1000); F:M 9:1; peak onset 40-60. MANAGEMENT — primarily SUPPORTIVE for sicca symptoms: OCULAR — ARTIFICIAL TEARS (preservative-free preferred) frequently; LIPID-CONTAINING tears for tear film stability; OCULAR LUBRICANT GEL nocte; punctal occlusion plugs (silicone or permanent cautery); cyclosporine eye drops (Restasis) for moderate-severe; lifitegrast; evening primrose oil (modest); regular OPHTHALMOLOGY review for corneal complications; humidify environment; avoid drying medications.\n\n(B) SLE: malar rash, glomerulonephritis, dsDNA / Sm specific; sicca symptoms can occur but not the primary feature.\n\n(C) RA: synovitis, erosive arthritis, RF / anti-CCP positive; sicca can be SECONDARY Sjögren overlay (~10-15% of RA).\n\n(D) MCTD: anti-RNP positive, features of SLE / scleroderma / myositis overlap.\n\n(E) IgG4-related disease: chronic infiltrative disease (autoimmune pancreatitis, retroperitoneal fibrosis, Riedel thyroiditis); high IgG4; storiform fibrosis on biopsy; can cause sialadenitis (Mikulicz disease) — important DDx for parotid enlargement; need exclusion before Sjögren diagnosis.\n\n💎 PEARL: Dry eyes (Schirmer <5 mm) + dry mouth + parotid enlargement + arthralgia + Raynaud + ANA + anti-Ro/SSA + anti-La/SSB + raised IgG = primary Sjögren syndrome. ~20× increased lymphoma risk (especially MALT) — investigate persistent parotid enlargement. Symptomatic: artificial tears, pilocarpine. Hydroxychloroquine for arthralgia/fatigue.",
   references:[{label:"EULAR Sjögren Recommendations (2020)", url:"https://ard.bmj.com/content/79/1/3"},{label:"BSR Sjögren Guidelines (2017)", url:"https://academic.oup.com/rheumatology/article/56/12/2089/4222137"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Limited cutaneous systemic sclerosis with ILD",
   stem:"A 45-year-old woman has a 3-year history of severe raynaud's phenomenon (digital pallor → cyanosis → reactive hyperaemia, triggered by cold, with prior digital ulceration), sclerodactyly (skin thickening of fingers, distal to MCPs), telangiectasias (face, lips, hands), calcinosis cutis (subcutaneous calcium deposits on fingertips), dysphagia (heartburn, regurgitation, dysphagia for solids — oesophageal dysmotility), and slowly worsening dyspnoea on exertion (now NYHA class II). Examination: skin thickening confined to fingers, hands, and face (limited cutaneous pattern — does not extend proximal to elbows / knees or to trunk). Investigations: anti-centromere antibody positive, anti-Scl-70 negative, ANA positive (centromere pattern); PFTs — restrictive pattern with reduced DLCO (60% predicted); HRCT chest: bibasal nsip-pattern interstitial lung disease (ground-glass + reticulation); echo — normal LV function, RVSP 32 (borderline; serial monitoring planned).\n\nWhich is the most likely diagnosis?",
   options:["Limited cutaneous systemic sclerosis (crest features) with interstitial lung disease","Diffuse cutaneous systemic sclerosis","Mixed connective tissue disease","Eosinophilic fasciitis","Primary Raynaud's phenomenon"],
   correct:"A",
   explanation:"SYSTEMIC SCLEROSIS (SSc / SCLERODERMA): a connective tissue disease characterised by VASCULOPATHY, AUTOIMMUNITY (specific autoantibodies), and progressive FIBROSIS of skin and internal organs. Strong association with ANTI-CENTROMERE antibody (~70% lcSSc patients positive). CONSTITUTIONAL — fatigue, weight loss. \n\nDIAGNOSIS: ACR / EULAR 2013 criteria (more sensitive than 1980 ARA criteria); skin thickening proximal to MCPs is itself diagnostic (SCORE 9 — sufficient alone); plus other points for sclerodactyly, fingertip lesions, telangiectasias, abnormal nailfold capillaries, ILD / PAH, Raynaud's, SSc-related antibodies. RENAL CRISIS — HIGH-DOSE ACE INHIBITOR (captopril) immediately and continuously; AVOID >15 mg/day prednisolone in dcSSc to prevent precipitation.\n\n(B) Diffuse cutaneous SSc: skin thickening proximal to elbows / knees + trunk; anti-Scl-70 / anti-RNAP III; faster progression; this patient has limited pattern.\n\n(C) MCTD: anti-RNP positive; SLE / SSc / myositis overlap features.\n\n(D) Eosinophilic fasciitis (Shulman): skin thickening with peripheral eosinophilia; spares fingers / face (UNLIKE SSc); after exertion / trauma; biopsy fascia; treated with steroids.\n\n(E) Primary Raynaud's: idiopathic; younger women; no associated features; nailfold capillaroscopy normal; no autoantibodies; no progression.\n\n💎 PEARL: Raynaud + sclerodactyly + telangiectasias + calcinosis + oesophageal dysmotility + skin involvement DISTAL to elbows/knees + anti-centromere = limited cutaneous SSc / CREST. PAH and ILD are major mortality contributors — annual PFTs/HRCT and echo screening. Mycophenolate or cyclophosphamide for ILD; nintedanib for progressive ILD (SENSCIS). AVOID high-dose steroids — scleroderma renal crisis.",
   references:[{label:"EULAR Recommendations for Systemic Sclerosis (2024 update)", url:"https://ard.bmj.com/content/early/2024/01/18/ard-2023-225050"},{label:"BSR Scleroderma Guidelines", url:"https://academic.oup.com/rheumatology/"}]},

  // ═══════════════════════════════════════════════════════════
  // CANCER / PALLIATIVE / HAEMATOLOGY  (target 18 — current 18 ✓)
  // ═══════════════════════════════════════════════════════════
  {section:"haem_onc", specialty:"Haematology", topic:"Multiple myeloma — CRAB criteria",
   stem:"A 68-year-old man presents with progressive fatigue and 4 weeks of severe thoracic back pain (not relieved by rest, worse at night). Examination: pale, tender at T8 vertebra. Investigations: Hb 92 g/L (anaemia), MCV 88 (normocytic), calcium 2.86 mmol/L (raised), creatinine 198 µmol/L (raised from baseline 90 — acute kidney injury), albumin 32, total protein 92 (raised). Serum protein electrophoresis: IgG-kappa monoclonal band 38 g/L; serum free light chains: kappa 280 mg/L (markedly raised), kappa:lambda ratio 35:1 (very abnormal). Urine Bence Jones positive.\n\nWhich is the most likely diagnosis?",
   options:["Monoclonal gammopathy of undetermined significance (MGUS)","Smouldering (asymptomatic) myeloma","Multiple myeloma","Waldenström macroglobulinaemia","Solitary plasmacytoma"],
   correct:"C",
   explanation:"PLASMA CELL DISORDERS form a spectrum from benign (MGUS) to malignant (myeloma). WALDENSTRÖM MACROGLOBULINAEMIA — different. \n\nDIAGNOSIS: serum and urine protein electrophoresis with IMMUNOFIXATION (more sensitive than basic SPE — identifies low-level monoclonal proteins); SERUM FREE LIGHT CHAIN assay (sensitive for light-chain only or non-secretory disease); BONE MARROW aspirate and trephine (plasma cells, cytogenetics — FISH for t(4;14), t(14;16), del 17p — high-risk markers; MYC translocations); IMAGING — preferred: WHOLE-BODY LOW-DOSE CT or WHOLE-BODY MRI (PET-CT also good) — replace skeletal survey. SUPPORTIVE: BISPHOSPHONATES (zoledronic acid 4 mg IV monthly, or denosumab) reduce skeletal-related events; renal-protected dose.\n\n(A) MGUS: paraprotein <30 g/L, marrow plasma cells <10%, no CRAB — does not fit.\n\n(B) Smouldering myeloma: meets paraprotein / marrow criteria but NO CRAB features — this patient has CRAB.\n\n(D) Waldenström: IgM paraprotein not IgG; lymphoplasmacytic; different histology.\n\n(E) Solitary plasmacytoma: single plasma cell tumour without diffuse marrow involvement; this patient has multifocal disease and 35% marrow plasma cells.\n\n💎 PEARL: CRAB (hyperCalcaemia, Renal impairment, Anaemia, Bone lesions) + monoclonal protein on serum/urine electrophoresis + raised free light chain ratio + plasma cell infiltration on marrow = multiple myeloma. Whole-body low-dose CT or MRI (replaces skeletal survey). Triplet/quadruplet induction (VRd, Dara-VRd) ± autologous SCT for fit patients. Bisphosphonates for bone disease.",
   references:[{label:"BSH Myeloma Guidelines (2022 update, Br J Haematol)", url:"https://b-s-h.org.uk/guidelines/"},{label:"NICE NG35 — Myeloma: diagnosis and management (2016)", url:"https://www.nice.org.uk/guidance/ng35"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Iron deficiency anaemia",
   stem:"A 35-year-old woman presents with progressive fatigue, breathlessness on exertion (climbing two flights of stairs from previously asymptomatic), pallor, brittle hair, and angular cheilitis. She reports heavy menstrual bleeding (using 8 sanitary pads on heaviest days, with passing of clots, lasting 7-8 days each cycle for the past 18 months). Examination: pale conjunctivae, koilonychia (spoon-shaped nails) of all fingers. Investigations: Hb 82 g/L (low), MCV 68 fL (microcytic), MCH 23 pg (hypochromic), platelets 480 (mild reactive thrombocytosis common in iron deficiency), ferritin 6 µg/L (very low), transferrin saturation 8% (low), serum iron low, total iron-binding capacity raised, soluble transferrin receptor raised. Reticulocytes inappropriately low. No GI symptoms; coeliac screen negative; no overt blood loss other than menses.\n\nWhich is the most likely diagnosis?",
   options:["Anaemia of chronic disease","Iron deficiency anaemia","Beta-thalassaemia trait","Sideroblastic anaemia","Vitamin B12 deficiency"],
   correct:"B",
   explanation:"IRON DEFICIENCY ANAEMIA (IDA): the most common cause of anaemia worldwide; affects ~30% women of reproductive age globally; in UK ~5% women, ~2% men. \n\nDIAGNOSIS: classic FBC pattern: low Hb, low MCV (<80 fL — microcytic), low MCH (hypochromic), HIGH RDW (red cell distribution width — anisocytosis from mixed populations of normal and iron-poor cells; useful early sign); BLOOD FILM: hypochromic, microcytic, with target cells, pencil cells, anisocytosis. RETICULOCYTE Hb content (CHr) — low. MANAGEMENT — once diagnosed and cause investigated: ORAL IRON REPLACEMENT — FERROUS SULPHATE 200 mg (65 mg elemental iron) once daily.\n\n(A) ACD: ferritin normal or HIGH, low transferrin saturation, normal MCV (or normocytic) typically; secondary to chronic inflammation.\n\n(C) Beta-thalassaemia trait: similar microcytic hypochromic picture but IRON STUDIES NORMAL; high RBC count; abnormal Hb electrophoresis (raised HbA2 >3.5%); NO benefit from iron replacement (and risk of overload).\n\n(D) Sideroblastic anaemia: ringed sideroblasts on marrow; iron studies often raised (paradoxical iron loading despite anaemia); variable causes (lead, B6 deficiency, MDS, drugs).\n\n(E) B12 deficiency: MACROCYTIC anaemia with neurological features.\n\n💎 PEARL: Microcytic hypochromic anaemia + low ferritin + raised TIBC + low transferrin saturation = iron deficiency. Cause MUST be sought — heavy menses, GI loss (always investigate >50 or postmenopausal — bidirectional endoscopy), malabsorption (coeliac), poor intake. Oral ferrous sulphate (alternate-day dosing improves absorption); IV iron for intolerance, malabsorption, ongoing loss or rapid replacement.",
   references:[{label:"BSG Guidelines for Management of Iron Deficiency Anaemia (Gut 2021)", url:"https://www.bsg.org.uk/clinical-resource/iron-deficiency/"},{label:"BCSH Guideline on Diagnosis & Management of Iron Deficiency", url:"https://b-s-h.org.uk/guidelines/guidelines/"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Polycythaemia vera",
   stem:"A 60-year-old man has a routine full blood count showing: Hb 178 g/L (raised), Hct 0.55 (raised, normal <0.48 men), WCC 12.4 (mildly raised, neutrophil predominant), platelets 540 × 10⁹/L (raised). He has noted facial plethora, intense pruritus particularly after hot showers ('aquagenic pruritus'), and occasional erythromelalgia (burning pain in feet). No history of cardiovascular event but he smokes 20 cigarettes/day. Examination: splenomegaly (3 cm below costal margin), conjunctival injection, no lymphadenopathy. Investigations: JAK2 V617F mutation detected (homozygous); erythropoietin level suppressed (1 mU/L, normal 4-25); SaO2 96% on air, no hypoxia; abdominal ultrasound — no renal mass; bone marrow biopsy: hypercellular with panmyelosis, megakaryocyte clustering.\n\nWhich is the most likely diagnosis?",
   options:["Secondary polycythaemia from hypoxia","Polycythaemia vera","Essential thrombocythaemia","Chronic myeloid leukaemia","Relative (Gaisbock) polycythaemia"],
   correct:"B",
   explanation:"POLYCYTHAEMIA: increased red cell mass; presents with raised haemoglobin and haematocrit. LATE TRANSFORMATION (~10-20 years): MYELOFIBROSIS (post-PV myelofibrosis — 'spent phase' — bone marrow fibrosis, splenomegaly, anaemia, weight loss); ACUTE MYELOID LEUKAEMIA (~3% lifetime risk; higher with cytotoxic therapy especially busulfan, P32). MANAGEMENT (BSH 2018, ELN 2018 GUIDELINES): RISK STRATIFICATION — HIGH-RISK (≥1 of: age ≥60, prior thrombosis); LOW-RISK (other). (2) LOW-DOSE ASPIRIN 75 mg daily — for ALL patients without contraindication (ECLAP trial — reduced thrombotic events). ALLOPURINOL for hyperuricaemia. PROGNOSIS: median survival now 14-20 years (improved with modern management).\n\n(A) Secondary polycythaemia from hypoxia: EPO RAISED (appropriate response); chronic hypoxia (COPD, smoking) — but this patient SaO2 96% and EPO suppressed.\n\n(C) Essential thrombocythaemia: predominantly RAISED PLATELETS (>450, typically much higher), Hb less raised; JAK2 (~50%), CALR, MPL mutations; treatment similar principles.\n\n(D) CML: BCR-ABL t(9;22), high WCC with myelocytes / promyelocytes, basophilia, splenomegaly; tyrosine kinase inhibitors (imatinib).\n\n(E) Relative polycythaemia: normal red cell mass but reduced plasma volume; secondary to dehydration, diuretics, smoking; addressed by treating cause.\n\n💎 PEARL: Raised Hb/Hct + facial plethora + AQUAGENIC pruritus (after hot showers) + erythromelalgia + splenomegaly + raised WCC/platelets + JAK2 V617F (95%) = polycythaemia vera. ALL get aspirin 75 mg + venesection (target Hct <0.45). Add cytoreduction (hydroxycarbamide; ruxolitinib if intolerant) if HIGH-RISK (age ≥60 or prior thrombosis).",
   references:[{label:"BSH Guidelines for Investigation and Management of Polycythaemia (2018)", url:"https://b-s-h.org.uk/guidelines/"},{label:"ELN PV Recommendations (Blood 2022)", url:"https://ashpublications.org/blood/article/140/16/1739/483856"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Neutropenic sepsis",
   stem:"A 55-year-old woman receiving r-chop chemotherapy for diffuse large B-cell lymphoma presents to the AMU on day 10 of cycle 2 with sudden-onset fever (38.4°C), rigors, sore throat, and dry cough. She has had no other unwell contacts. Examination: pale, tachycardic (HR 110), BP 102/62 (her baseline 130/80), RR 22, T 38.4°C, alert (GCS 15), no clear source on examination — no skin / soft tissue infection, no overt UTI symptoms, no clinical line infection signs. Investigations: neutrophils 0.4 × 10⁹/L (severe neutropenia), Hb 102, platelets 90, CRP 65, lactate 2.4 (raised), creatinine 110.\n\nWhich is the most appropriate management?",
   options:["Wait for blood culture results before any antibiotics","Within 1 hour — take blood cultures, give empirical IV broad-spectrum antibiotic (per local protocol), resuscitation, source identification, MASCC risk stratification","Discharge home on oral co-amoxiclav","G-CSF alone, no antibiotics","Withhold further chemotherapy only — no acute treatment"],
   correct:"B",
   explanation:"NEUTROPENIC SEPSIS (febrile neutropenia): a MEDICAL EMERGENCY. TIME-CRITICAL — 'GOLDEN HOUR' principle: BROAD-SPECTRUM ANTIBIOTICS WITHIN 1 HOUR of presentation (NICE CG151 quality standard); DO NOT WAIT for blood culture results, or for the differential / neutrophil count from the lab — empirical antibiotics first. MANAGEMENT (combined NICE / 'sepsis-6' / oncology emergency protocol — locally adapted): TIME ZERO — recognise: (1) BLOOD CULTURES — peripheral + line sample (paired);\n(2) FBC, U&E, LFTs, CRP, coagulation, lactate, glucose;\n(3) URINE culture;\n(4) ROUTE OF FEVER source: SPUTUM if cough, STOOL if diarrhoea (incl. Other supportive measures?\n\n(A) Waiting for cultures before treatment is unsafe and against guidelines — antibiotics first, cultures concurrently.\n\n(C) Discharge with oral antibiotics inappropriate for high-risk patient with severe neutropenia and sepsis features.\n\n(D) G-CSF alone treats nothing acutely — does not replace antibiotics in active infection.\n\n(E) Withholding chemotherapy is appropriate but does not address the immediate emergency.\n\n💎 PEARL: Neutropenic sepsis = MEDICAL EMERGENCY. Within 1 HOUR: blood cultures + empirical IV broad-spectrum antibiotic (typically piperacillin-tazobactam; meropenem if resistant). Don't wait for the differential. Sepsis-6 + source identification. MASCC score risk-stratifies for outpatient candidacy. Add antifungal at day 4–7 if persistent fever.",
   references:[{label:"NICE CG151 — Neutropenic sepsis (2012)", url:"https://www.nice.org.uk/guidance/cg151"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Tumour lysis syndrome",
   stem:"A 28-year-old man with newly diagnosed burkitt lymphoma (stage IV with bulky abdominal disease, very high LDH 4500, raised baseline urate) develops, 12 hours after starting chemotherapy (r-codox-m), the following abnormalities: K 6.4 mmol/L (raised), phosphate 3.0 mmol/L (raised, normal <1.5), calcium 1.7 mmol/L corrected (low — secondary to phosphate binding), urate 950 µmol/L (markedly raised), creatinine 220 (raised from baseline 80 — AKI), lactate normal, urine output 0.3 mL/kg/h. ECG: peaked T waves consistent with hyperkalaemia.\n\nWhich is the most appropriate management?",
   options:["Aggressive IV hydration, urgent rasburicase, correct hyperkalaemia, manage AKI, renal replacement if refractory","Allopurinol alone","Sodium bicarbonate alone","Reduce hydration to prevent fluid overload","Steroids alone"],
   correct:"A",
   explanation:"TUMOUR LYSIS SYNDROME (TLS): an oncological emergency caused by RAPID RELEASE of intracellular contents from large numbers of malignant cells lysing — typically following chemotherapy initiation, but can occur SPONTANEOUSLY in highly proliferative tumours. CAIRO-BISHOP CRITERIA — define LABORATORY TLS as ≥2 of: hyperuricaemia (>475), hyperkalaemia (>6.0), hyperphosphataemia (>1.45 adults), hypocalcaemia (<1.75), within 3 DAYS BEFORE to 7 DAYS AFTER chemotherapy. MANAGEMENT of established TLS (this patient — at least laboratory TLS with creatinine rise = clinical TLS): (1) URGENT IV HYDRATION — 3 L/m²/day; monitor urine output strictly. (8) ICU / HDU monitoring.\n\n(B) Allopurinol alone is INADEQUATE for established / high-risk TLS (does not lower preformed urate; needs days to take effect); rasburicase preferred.\n\n(C) Bicarbonate causes calcium-phosphate precipitation — no longer routinely used.\n\n(D) Reducing hydration is contrary to management — aggressive hydration is FOUNDATION of TLS treatment.\n\n(E) Steroids do not treat TLS (though may be part of underlying chemotherapy).\n\n💎 PEARL: Bulky chemo-sensitive tumour (Burkitt, ALL, CLL on venetoclax) + raised K + raised phosphate + raised urate + low calcium + AKI within 7 days of chemo = tumour lysis syndrome. Aggressive IV hydration. RASBURICASE — but CONTRAINDICATED in G6PD deficiency (severe haemolysis). Manage hyperkalaemia. RRT if refractory. Allopurinol prophylaxis for lower-risk; rasburicase for higher-risk.",
   references:[{label:"BCSH Guidelines on Tumour Lysis Syndrome", url:"https://b-s-h.org.uk/guidelines/"},{label:"Cairo-Bishop Criteria (Coiffier 2008)", url:"https://ascopubs.org/doi/10.1200/JCO.2008.16.0010"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Disseminated intravascular coagulation",
   stem:"A 60-year-old man admitted with E. coli urosepsis (BP 90/55, lactate 4) develops, on day 2, bleeding from venepuncture sites and large spreading bruises on his arms and abdomen. Examination: peripheral cyanosis of toes (2 — purpura fulminans), oozing from cannula sites, petechiae on lower limbs. Investigations: PT prolonged (28 sec, control 13), APTT prolonged (60 sec, control 28), fibrinogen 0.6 g/L (low, normal 1.5-4), platelets 35 × 10⁹/L (low), d-dimer markedly elevated (>20 mg/L feu), schistocytes on blood film, antithrombin reduced; isth overt-DIC score 7 (≥5 = overt DIC). Other causes excluded: no warfarin, no recent surgery, no liver disease.\n\nWhich is the most likely diagnosis?",
   options:["Idiopathic thrombocytopenic purpura (ITP)","Thrombotic thrombocytopenic purpura (TTP)","Disseminated intravascular coagulation","Heparin-induced thrombocytopenia (HIT)","Haemophilia A"],
   correct:"C",
   explanation:"DISSEMINATED INTRAVASCULAR COAGULATION (DIC): a SECONDARY syndrome characterised by SIMULTANEOUS systemic activation of COAGULATION (with consumption of factors and platelets → bleeding) and FIBRINOLYSIS, with widespread microvascular fibrin deposition (→ thrombosis, organ ischaemia). Always SECONDARY to underlying cause. PRESENTATION — variable, ranges from compensated 'low-grade' DIC (laboratory abnormalities only) to ACUTE FULMINANT DIC: BLEEDING (most apparent — venepuncture sites, mucosal, GI, GU, surgical wounds, ICH), THROMBOSIS (DVT, ischaemic toes / fingers, organ infarction), end-organ failure (AKI, ARDS, hepatic encephalopathy). Schistocytes / red cell fragments on FILM (microangiopathic haemolysis from fibrin strands); thrombocytopenia.\n\n(A) ITP: isolated thrombocytopenia, NORMAL coagulation, NORMAL fibrinogen, normal D-dimer; immune-mediated platelet destruction.\n\n(B) TTP: thrombocytopenia + microangiopathic haemolysis + NORMAL coagulation (key distinguishing feature) + neurological / renal involvement; ADAMTS13 deficient.\n\n(D) HIT: thrombocytopenia + thrombosis post-heparin (5-10 days), normal coagulation.\n\n(E) Haemophilia A: factor VIII deficiency; isolated APTT prolongation; normal PT, normal platelets, normal fibrinogen.\n\n💎 PEARL: Sepsis / malignancy / obstetric catastrophe + bleeding + microvascular thrombosis + prolonged PT/APTT + LOW fibrinogen + low platelets + raised D-dimer + schistocytes = DIC. Treat the UNDERLYING CAUSE — DIC will not resolve without source control. Blood products targeted to bleeding: FFP for INR >1.5, cryoprecipitate for fibrinogen <1.5, platelets if <50 with bleeding (or <20 prophylactic).",
   references:[{label:"BSH DIC Guidelines (Br J Haematol 2009)", url:"https://b-s-h.org.uk/guidelines/"},{label:"ISTH DIC Score", url:"https://onlinelibrary.wiley.com/doi/10.1111/j.1538-7836.2007.02469.x"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Thrombotic thrombocytopenic purpura",
   stem:"A 35-year-old woman presents with fever (38.0°C), fluctuating confusion (alternates between alert and disoriented over hours), jaundice, widespread petechial rash and bruising, and AKI (creatinine 220, baseline 70). No infection / drug history identified. Investigations: Hb 78 g/L (microangiopathic haemolytic anaemia), reticulocytes raised (15%), platelets 14 × 10⁹/L (severe thrombocytopenia), schistocytes ++ on blood film (red cell fragmentation), LDH markedly elevated (2400, normal <250), unconjugated bilirubin raised, haptoglobin undetectable, direct coombs negative (excludes autoimmune haemolytic anaemia), PT and APTT normal (excludes DIC), fibrinogen normal. ADAMTS13 activity <10% (severe deficiency); anti-ADAMTS13 antibodies positive (IgG inhibitor) — confirms acquired immune-mediated TTP.\n\nWhich is the most appropriate immediate management?",
   options:["Platelet transfusion (high-dose)","Urgent plasma exchange + high-dose steroid + caplacizumab; avoid platelet transfusion","Heparin alone","Antibiotics alone","Splenectomy"],
   correct:"B",
   explanation:"THROMBOTIC THROMBOCYTOPENIC PURPURA (TTP): a life-threatening THROMBOTIC MICROANGIOPATHY with mortality >90% UNTREATED but <10% with prompt treatment. Other: jaundice, abdominal pain, fatigue, purpura, mucosal bleeding. \n\nDIAGNOSIS: clinical SUSPICION key — MAHA + thrombocytopenia + no other clear cause; calculate PLASMIC SCORE (platelet, lysis, MCV, INR, malignancy, transplant, creatinine) — risk-stratifies severity / likelihood of severe ADAMTS13 deficiency; ADAMTS13 ACTIVITY (<10% diagnostic) and ANTIBODIES (acquired immune); KEY: NORMAL COAGULATION (PT, APTT, fibrinogen) — distinguishes TTP from DIC (where coagulation deranged). Use red cell transfusion as needed (separately from PLEX).\n\n(A) Platelet transfusion CONTRAINDICATED in TTP (worsens microthrombi).\n\n(C) Heparin alone treats nothing — TTP is platelet-driven aggregation, not standard thrombosis.\n\n(D) Antibiotics inappropriate — not infection-driven.\n\n(E) Splenectomy historically used in refractory cases but now superseded by rituximab; not first-line.\n\n💎 PEARL: Pentad (rarely all 5): fever + fluctuating neuro + AKI + MAHA + thrombocytopenia + NORMAL coagulation (KEY: distinguishes TTP from DIC) = TTP. ADAMTS13 <10% confirms. URGENT plasma exchange (within 4–6 h) + steroid + caplacizumab (HERCULES). AVOID platelet transfusion — precipitates thrombosis. Mortality >90% untreated, <10% treated.",
   references:[{label:"BSH TTP Guideline (2023)", url:"https://b-s-h.org.uk/guidelines/"},{label:"ISTH TTP Definition (2017)", url:"https://onlinelibrary.wiley.com/doi/10.1111/jth.13571"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Heparin-induced thrombocytopenia",
   stem:"A 60-year-old man admitted 7 days ago with pneumonia (now resolving) on prophylactic unfractionated heparin since admission. On day 7, his platelet count drops from 220 → 60 × 10⁹/L (>50% drop), and he develops a new DVT in his right lower limb (presents with calf swelling, ultrasound confirmed proximal DVT). His 4Ts score is 7 (high probability of HIT — Thrombocytopenia 2, Timing 2, Thrombosis 2, oTher causes 1). Investigations: ANTI-PF4 antibody elisa strongly positive (OD 2.5); serotonin release assay (sra) positive (functional confirmatory test). No bleeding. Renal function normal.\n\nWhich is the most appropriate management?",
   options:["Increase heparin dose","Stop all heparin and switch to a non-heparin anticoagulant (argatroban, fondaparinux, or danaparoid); avoid platelet transfusion unless major bleeding","Continue heparin and add aspirin","Stop heparin and start warfarin alone with no bridging","Routine prophylactic platelet transfusion"],
   correct:"B",
   explanation:"HEPARIN-INDUCED THROMBOCYTOPENIA (HIT): an IMMUNE-MEDIATED prothrombotic complication of heparin therapy. KEY POINT — paradoxically, despite the thrombocytopenia, HIT causes THROMBOSIS (arterial and venous; HIT with thrombosis = HITT) — patients DO NOT BLEED but rather form clots. 1-1% with LMWH; 1-5% with unfractionated heparin (10x higher with UFH); higher in surgical / cardiac / dialysis patients.\n\n(A) Increasing heparin would worsen disease.\n\n(C) Continuing heparin + aspirin: continues the offending agent — fatal.\n\n(D) Warfarin alone without bridging risks venous limb gangrene / skin necrosis from protein C deficiency in HIT prothrombotic state.\n\n(E) Prophylactic platelet transfusion fuels thrombosis.\n\n💎 PEARL: Heparin (UFH > LMWH) + platelet drop ≥50% on day 5–10 + new thrombosis + 4Ts score high + anti-PF4 antibody positive = HIT. PARADOXICAL thrombosis (HITT) — patients CLOT, don't bleed. Stop ALL heparin; switch to non-heparin anticoagulant (argatroban, fondaparinux, danaparoid). AVOID warfarin alone (venous limb gangrene). AVOID platelet transfusion.",
   references:[{label:"BSH Adult ITP Guideline (2019, Br J Haematol)", url:"https://onlinelibrary.wiley.com/doi/10.1111/bjh.16035"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Acute promyelocytic leukaemia",
   stem:"A 42-year-old woman presents with 2 weeks of progressive fatigue, easy bruising, gingival bleeding, and epistaxis. Examination: pale, multiple bruises, mucosal bleeding from gums. Investigations: Hb 78 g/L, platelets 22 × 10⁹/L (severe thrombocytopenia), WCC 15 × 10⁹/L (with abnormal cells on film). Coagulation deranged — PT prolonged 30s, APTT prolonged 60s, fibrinogen 0.8 g/L (very low), d-dimer markedly elevated, schistocytes — disseminated intravascular coagulation (DIC) features. No infection.\n\nWhich is the most appropriate management?",
   options:["Standard 7+3 AML chemotherapy","All-trans retinoic acid (ATRA) + arsenic trioxide, urgent blood-product support, monitor for differentiation syndrome","Imatinib","Allogeneic stem cell transplantation immediately","Watch and wait"],
   correct:"B",
   explanation:"ACUTE PROMYELOCYTIC LEUKAEMIA (APL, AML M3 in old FAB classification): a SUBTYPE of acute myeloid leukaemia with a UNIQUE genetic, clinical, and therapeutic profile. CYTOGENETICS — defining: balanced TRANSLOCATION t(15;17) creating PML-RARα FUSION GENE on derivative chromosome 15. \n\nDIAGNOSIS: peripheral blood / marrow morphology — promyelocytes with prominent granules, AUER RODS (cytoplasmic inclusions); classic 'faggot' cells; flow cytometry — HLA-DR negative, CD34 negative (vs other AML — both usually positive), CD33+, CD13+, MPO+.\n\n(A) Standard 7+3 AML chemotherapy (cytarabine + daunorubicin) historically used but ATRA-based regimens are now the standard with vastly superior outcomes; chemotherapy added only for high-risk disease alongside ATRA / ATO.\n\n(C) Imatinib treats CML / Ph+ ALL (BCR-ABL fusion) — wrong target.\n\n(D) Allogeneic SCT not first-line; reserved for refractory / relapsed disease.\n\n(E) Watch and wait — FATAL within days from bleeding.\n\n💎 PEARL: AML + DIC + Auer rods or 'faggot cells' + hypergranular promyelocytes + t(15;17) PML-RARα = APL. ATRA + arsenic trioxide cures most low/intermediate-risk APL (no cytotoxic chemo needed). Watch for DIFFERENTIATION SYNDROME (fever, dyspnoea, pulmonary infiltrates, weight gain) — treat with dexamethasone. Aggressive blood-product support for DIC.",
   references:[{label:"BSH Acute Leukaemia Guidelines", url:"https://b-s-h.org.uk/guidelines/"},{label:"ELN Recommendations 2022 (AML)", url:"https://ashpublications.org/blood/article/140/12/1345/485842"}]},

  {section:"haem_onc", specialty:"Palliative Medicine", topic:"Opioid conversion — oral morphine to subcutaneous",
   stem:"A 76-year-old woman with metastatic breast cancer is on the end-of-life pathway and stable on oral morphine immediate-release 10 mg six times daily (i.e. 60 mg total daily oral morphine) for pain. Pain is well controlled. She is becoming unable to swallow reliably (drowsiness, decreased oral intake, missed last 2 doses). The team plans to convert to a continuous subcutaneous infusion (csci) of morphine over 24 hours via syringe driver to maintain steady analgesia.\n\nWhich is the most appropriate 24-hour csci morphine dose?",
   options:["60 mg / 24 h SC","30 mg / 24 h SC","20 mg / 24 h SC","10 mg / 24 h SC","120 mg / 24 h SC"],
   correct:"B",
   explanation:"OPIOID CONVERSION in palliative care — the SCE often tests these calculations. ORAL MORPHINE : SUBCUTANEOUS OXYCODONE = 3 : 1. FENTANYL — GROSS approximation: 25 mcg/h fentanyl PATCH (transdermal) ≈ 60-90 mg oral morphine per day. BUPRENORPHINE — 35 mcg/h patch ≈ 60 mg oral morphine (rough). CALCULATION : total daily oral morphine dose = 10 mg × 6 = 60 mg/day; CONVERTING TO SC MORPHINE — DIVIDE BY 2 = 30 mg over 24 hours; therefore 30 mg/24h CSCI MORPHINE.\n\n(A) 60 mg/24h SC = same dose as oral, ignores 2:1 conversion ratio — would represent dose doubling.\n\n(C) 20 mg/24h SC = 3:1 ratio, would be correct only for DIAMORPHINE conversion.\n\n(D) 10 mg/24h SC = excessive reduction.\n\n(E) 120 mg/24h = doubling — would be dangerous overdose.\n\n💎 PEARL: Opioid conversion in palliative care: ORAL morphine to SC morphine — divide by 2. Oral morphine to SC DIAMORPHINE — divide by 3. Oral morphine to SC oxycodone — divide by 1.5–2. So 60 mg oral morphine/day = 30 mg/24h SC morphine. Always specify route. Consider rotation if uncontrolled pain or unacceptable side-effects.",
   references:[{label:"Palliative Adult Network Guidelines (Yorkshire and Humber)", url:"https://book.pallcare.info/"},{label:"BNF — Prescribing in palliative care (opioid conversion)", url:"https://bnf.nice.org.uk/"}]},

  {section:"haem_onc", specialty:"Palliative Medicine", topic:"End-of-life anticipatory medications",
   stem:"An 84-year-old man with metastatic prostate cancer (declined further treatment, deteriorating; multidisciplinary review confirms last days of life) is being managed in the community by the palliative care team. He is currently comfortable with no significant symptoms but the team plans to prescribe anticipatory ('just-in-case') subcutaneous medications to ensure prompt symptom relief if needed in the last days. He is on regular oral morphine modified-release 30 mg BD for bone pain currently; eGFR 50; on no other significant medications.\n\nWhich is the most appropriate set of anticipatory subcutaneous medications?",
   options:["Morphine SC PRN (pain / breathlessness), midazolam SC PRN (agitation), glycopyrronium or hyoscine butylbromide SC PRN (respiratory secretions), levomepromazine or haloperidol SC PRN (nausea / vomiting)","IV paracetamol PRN only","Oral tramadol only","Sertraline","Diazepam orally"],
   correct:"A",
   explanation:"END-OF-LIFE CARE — recognising and addressing the FOUR COMMON TERMINAL SYMPTOMS: NICE NG31 (Care of dying adults in the last days of life, 2015) provides comprehensive guidance. FOUR COMMON TERMINAL SYMPTOMS and their treatment: (a) PAIN AND/OR BREATHLESSNESS — OPIOID: MORPHINE 2.5-5 mg SC PRN if opioid-naive; other opioids — DIAMORPHINE (more concentrated, useful for higher doses), OXYCODONE (renal impairment), ALFENTANIL (severe renal failure / dialysis — not renally accumulated). (b) AGITATION / TERMINAL RESTLESSNESS / DISTRESS — MIDAZOLAM 2.5-5 mg SC PRN (or 10-30 mg/24h CSCI if regular need); short-acting benzodiazepine; alternative — LORAZEPAM SL if can swallow.\n\n(B) IV paracetamol alone misses key terminal symptoms.\n\n(C) Oral tramadol fails when patient cannot swallow.\n\n(D) Sertraline is for chronic depression — irrelevant in last days of life.\n\n(E) Oral diazepam fails when patient cannot swallow.\n\n💎 PEARL: End-of-life anticipatory ('just-in-case') subcutaneous medications cover four common terminal symptoms: PAIN/breathlessness — morphine (oxycodone if low eGFR; alfentanil if dialysis); AGITATION — midazolam; RESPIRATORY SECRETIONS — glycopyrronium or hyoscine butylbromide; NAUSEA — levomepromazine or haloperidol. Doses titrated; review regularly (NICE NG31).",
   references:[{label:"NICE NG31 — Care of dying adults in last days of life (2015)", url:"https://www.nice.org.uk/guidance/ng31"},{label:"NICE NG142 — End of life care for adults", url:"https://www.nice.org.uk/guidance/ng142"}]},

  {section:"haem_onc", specialty:"Oncology", topic:"Immune checkpoint inhibitor colitis (irAE)",
   stem:"A 60-year-old man with metastatic melanoma on pembrolizumab (anti-PD-1) develops 6 weeks into therapy: profuse watery diarrhoea (10 stools/day, increasing from baseline 1/day) with intermittent blood-streaked stools, abdominal cramping, fatigue. No fever. Examination: mild abdominal tenderness, no peritonism, normal bowel sounds. Investigations: stool culture and parasites negative, clostridioides difficile toxin negative, CMV PCR negative; FBC normal; CRP 65 (raised); creatinine 90; flexible sigmoidoscopy: continuous mucosal inflammation from rectum proximally — erythema, ulceration, friability — biopsy shows lymphocytic infiltrate consistent with immune-mediated colitis; cortisol normal (no hypophysitis); TSH normal (no thyroiditis); LFTs and renal function normal.\n\nWhich is the most appropriate management?",
   options:["Continue pembrolizumab unchanged","Withhold pembrolizumab, give high-dose corticosteroid; if steroid-refractory after 3-5 days add infliximab or vedolizumab","Continue and observe","Empirical antibiotics (broad-spectrum)","Aspirin alone"],
   correct:"B",
   explanation:"IMMUNE CHECKPOINT INHIBITORS (ICIs): a TRANSFORMATIVE class of cancer therapy that releases 'brakes' on T-cell mediated anti-tumour immunity by blocking inhibitory checkpoint receptors. ANY ORGAN can be affected. TIMING: irAEs typically occur within 12 weeks of starting therapy but can occur ANYTIME during treatment AND for MONTHS to YEARS AFTER STOPPING (delayed presentation common — endocrinopathies particularly). MANAGEMENT FRAMEWORK (ESMO / SITC / NCCN / NICE national guidance — graded by severity and site): GRADE 1 (mild) — continue ICI with close monitoring; symptomatic management.\n\n(A) Continuing pembrolizumab unchanged ignores significant irAE.\n\n(C) Continue and observe risks progression to grade 4 / fulminant.\n\n(D) Empirical antibiotics: appropriate to take stool samples to exclude infection but irAE colitis is treated with steroid not antibiotics.\n\n(E) Aspirin: no role.\n\n💎 PEARL: Patient on immune checkpoint inhibitor (anti-PD-1/PD-L1 or anti-CTLA-4) + new diarrhoea ± blood + colitis on flexi sig + infections excluded = immune-related colitis. Withhold ICI + high-dose steroid (prednisolone 1–2 mg/kg). Steroid-refractory after 3–5 days: add infliximab or vedolizumab. ANY organ can be affected; irAEs occur up to months-years after stopping.",

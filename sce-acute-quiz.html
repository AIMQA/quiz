  {section:"infectious", specialty:"Infectious Diseases", topic:"Severe falciparum malaria",
   stem:"A 28-year-old man returns from a 3-week trip to The Gambia (took no malaria prophylaxis) with 5 days of fever, rigors, frontal headache, vomiting and confusion. Examination: GCS 14 (drowsy, easily roused), T 39.5°C, HR 118, BP 102/64, jaundiced. Investigations: glucose 3.8 (low normal), lactate 4.2 (raised), Hb 92 g/L, platelets 65 × 10⁹/L (low), bilirubin 60 µmol/L, creatinine 145 (AKI). The Giemsa-stained thin blood film shown demonstrates multiple ring-form trophozoites, some red cells with multiple parasites, parasitaemia estimated at 6%.\n\nWhich is the most appropriate immediate antimalarial therapy?",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Plasmodium_falciparum_01.png",
   imageAlt:"Giemsa-stained thin blood film showing Plasmodium falciparum ring-form trophozoites within red blood cells",
   options:["Oral artemether-lumefantrine","IV artesunate","IV quinine + doxycycline","Oral chloroquine","Oral atovaquone-proguanil"],
   correct:"B",
   explanation:"FALCIPARUM MALARIA: the most lethal malaria species; UK travellers from sub-Saharan Africa most at risk. \n\nPRESENTATION: typically 1–4 weeks after exposure (can be longer with prophylaxis); fever often quotidian (daily) initially, classic 'tertian' (every 48 hours) periodicity less common with falciparum. SIDE EFFECTS: post-artesunate delayed haemolysis (~13% — monitor Hb weekly for 4 weeks; transfusion if needed). NOTIFIABLE DISEASE — UK Health Security Agency.\n\n(A) Oral therapy is INADEQUATE for severe disease — vomiting, GI absorption unreliable, slow onset; oral is for uncomplicated only.\n\n(C) IV quinine inferior mortality vs artesunate; reserved for unavailable artesunate.\n\n(D) Chloroquine: P. falciparum is RESISTANT in most areas including Africa.\n\n(E) Atovaquone-proguanil is for prophylaxis or uncomplicated treatment, NOT severe disease.\n\n💎 PEARL: Severe falciparum malaria (any of: GCS <11, seizures, parasitaemia >2%, lactate >5, AKI, hypoglycaemia, anaemia, jaundice, ARDS, shock, DIC): IV ARTESUNATE (NOT quinine — superior mortality, AQUAMAT/SEAQUAMAT). Monitor for post-artesunate delayed haemolysis weekly for 4 weeks. Notifiable disease.",
   references:[{label:"UK Malaria Treatment Guidelines (PHE/UKHSA 2016)", url:"https://www.gov.uk/government/publications/malaria-prevention-guidelines-for-travellers-from-the-uk"},{label:"WHO Guidelines for Malaria (2024)", url:"https://www.who.int/publications/i/item/guidelines-for-the-treatment-of-malaria"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Acute HIV seroconversion",
   stem:"A 35-year-old man who has sex with men presents with 7 days of fever (38.8°C), maculopapular rash on his trunk and palms, painful pharyngitis, lymphadenopathy (cervical, axillary), myalgia, headache, and an oral ulcer. Symptoms started 4 weeks after a high-risk unprotected sexual encounter. Investigations: HIV antibody (4th-generation Ag/Ab combination) negative, but HIV rna viral load 2.5 million copies/mL (very high), p24 antigen positive, CD4 480, ALT mildly raised, EBV / CMV / monospot negative.\n\nWhich is the most likely diagnosis?",
   options:["Acute HIV seroconversion","Secondary syphilis","Infectious mononucleosis (EBV)","Disseminated gonococcal infection","Cytomegalovirus infection"],
   correct:"A",
   explanation:"ACUTE HIV SEROCONVERSION (acute retroviral syndrome): the symptomatic primary HIV-1 infection, occurring 1–4 weeks after exposure. Spontaneous resolution over 1–4 weeks, then prolonged 'asymptomatic' chronic infection (years) before AIDS-defining illness. DIAGNOSIS — \n\nKEY POINT: in acute infection, HIV ANTIBODY may STILL BE NEGATIVE (window period — typically 2–4 weeks for current 4th-generation tests; longer for older 3rd-generation antibody-only); reliance on antibody alone in early seroconversion FAILS — leading to missed diagnosis. HIV RNA (viral load) is the FIRST marker of infection — turns positive at 7–14 days. \n\nMANAGEMENT: REFER URGENTLY to HIV / GUM clinic.\n\n(B) Secondary syphilis: rash often involves palms / soles, mucous patches, condyloma lata, generalised lymphadenopathy — but RPR / VDRL would be positive; HIV testing always recommended in syphilis (often co-infection).\n\n(C) EBV: monospot or EBV serology positive; lymphocytosis with atypical lymphocytes; doesn't account for viral load.\n\n(D) Disseminated gonococcal: tenosynovitis, septic arthritis, pustular skin lesions; gram-negative diplococci on culture.\n\n(E) CMV: similar mononucleosis-like illness; CMV IgM positive; HIV viral load wouldn't be high.\n\n💎 PEARL: Maculopapular rash (trunk + palms) + fever + pharyngitis + lymphadenopathy + oral ulcer + recent risk = acute HIV seroconversion. HIV antibody can be NEGATIVE early (window period); HIV RNA viral load is the FIRST marker (positive at 7–14 days). Refer urgently to GUM/ID; rapid-start ART is now standard.",
   references:[{label:"BHIVA Guidelines (2023)", url:"https://www.bhiva.org/guidelines"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Native-valve viridans streptococcal endocarditis",
   stem:"A 42-year-old woman with known mitral valve prolapse develops fever (38.5°C), malaise, weight loss (3 kg), and night sweats 3 weeks after dental extraction without antibiotic prophylaxis. Examination: a new pansystolic murmur radiating to the axilla, splinter haemorrhages on her nail beds. Three sets of blood cultures taken from separate sites — all grow streptococcus viridans (mitis group, fully penicillin-sensitive, mic <0.125 mg/L). Transthoracic echo: 9 mm vegetation on the anterior mitral leaflet with mild MR. TOE confirms vegetation, no abscess. Renal function normal.\n\nWhich is the most appropriate antimicrobial regimen?",
   options:["IV vancomycin and gentamicin for 6 weeks","IV benzylpenicillin and gentamicin for 4 weeks","Oral amoxicillin for 6 weeks","IV flucloxacillin for 4 weeks","IV ceftriaxone for 2 weeks"],
   correct:"B",
   explanation:"INFECTIVE ENDOCARDITIS (IE): infection of the endocardial surface, most commonly affecting native or prosthetic valves. PRESENTATION — Roth spots, Janeway lesions, Osler nodes, splinter haemorrhages, splenomegaly, microscopic haematuria, glomerulonephritis (immune-complex), embolic phenomena (stroke, mycotic aneurysm, pulmonary emboli in right-sided), heart failure, fevers, night sweats, weight loss. DIAGNOSIS — DUKE CRITERIA (modified Duke 2023 update, Duke-ISCVID); MAJOR — typical organism in 2 sets of cultures OR persistent bacteraemia; endocardial involvement (vegetation, abscess, dehiscence) on echo; new regurgitation; MINOR — predisposing condition, fever ≥38°C, vascular phenomena, immunological phenomena, microbiological evidence not meeting major. PROSTHETIC VALVE STREPTOCOCCAL IE: longer 6 weeks.\n\n(A) Vancomycin + gentamicin for 6 weeks: prosthetic-valve regimen, not first-line for native sensitive viridans.\n\n(C) Oral amoxicillin: oral switch only after IV induction; not appropriate for full course in IE.\n\n(D) Flucloxacillin: for staphylococcal IE — wrong organism.\n\n(E) Ceftriaxone 2 weeks: too short for endocarditis (4 weeks minimum).\n\n💎 PEARL: Native-valve viridans streptococcal endocarditis (penicillin-sensitive, MIC <0.125): IV benzylpenicillin + gentamicin for 4 weeks (synergy reduces duration; gentamicin shortened to 2 weeks in many regimens). Modified Duke criteria for diagnosis. Echo (TTE first; TOE if prosthetic valve, inconclusive TTE, or complications).",
   references:[{label:"ESC 2023 Endocarditis Guidelines", url:"https://academic.oup.com/eurheartj/article/44/39/3948/7227687"},{label:"BSAC UK Endocarditis Guidelines", url:"https://academic.oup.com/jac/article/67/2/269/735731"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Necrotising fasciitis",
   stem:"A 56-year-old man with type 2 diabetes presents with 12 hours of rapidly spreading erythema and pain out of proportion to clinical signs in his right lower leg following a minor abrasion. Now patches of grey, dusky skin with bullae, anaesthetic skin patches, and crepitus on palpation. T 39.0°C, HR 130, BP 88/54, RR 28, SpO₂ 94%, lactate 4.0 (raised), WCC 24, CRP 380, creatinine 220 (AKI), glucose 18, HCO3 16. CT of the leg: gas in soft tissue planes, fascial thickening with surrounding inflammatory change. Lrinec score 9 (high risk).\n\nWhich is the most appropriate immediate management?",
   options:["Outpatient oral antibiotics","Urgent surgical debridement plus IV broad-spectrum antibiotics including clindamycin (toxin suppression), aggressive resuscitation, ICU","IV antibiotics alone, no surgery","Hyperbaric oxygen alone","Topical antiseptic and observation"],
   correct:"B",
   explanation:"NECROTISING FASCIITIS (NF) — also termed necrotising soft tissue infection (NSTI): a rapidly progressive, life-threatening infection of the deep soft tissues, characterised by widespread fascial necrosis with relative sparing of overlying skin (until late). TYPE III — gram-negative monomicrobial (Vibrio vulnificus — seafood / sea-water exposure; Aeromonas in fresh water); marine / immunocompromised. MANAGEMENT — TIME-CRITICAL: (1) URGENT SURGICAL DEBRIDEMENT — the SINGLE most important intervention; mortality DOUBLES with each hour of delay beyond 24 hours; aim for early aggressive debridement with serial 'second-look' surgeries every 24–48 hours until no further necrotic tissue; may require amputation.\n\n(A) Outpatient oral antibiotics for fulminant necrotising infection is fatal.\n\n(C) IV antibiotics alone — without surgical debridement, antibiotics fail because of poor penetration into avascular necrotic tissue and ongoing toxin release.\n\n(D) Hyperbaric oxygen alone is inadequate — adjunctive.\n\n(E) Topical / observation guarantees death.\n\n💎 PEARL: Pain OUT OF PROPORTION + dusky skin/bullae + crepitus + sepsis = necrotising fasciitis. URGENT SURGICAL DEBRIDEMENT is the single most important intervention — mortality DOUBLES with each hour of delay beyond 24 hours. Add CLINDAMYCIN (toxin suppression) to broad-spectrum cover. Imaging should NOT delay surgery.",
   references:[{label:"UK 5 Nations Necrotising Fasciitis Guidance", url:"https://www.britishinfection.org/"},{label:"LRINEC Score reference", url:"https://pubmed.ncbi.nlm.nih.gov/15241098/"}]},

  {section:"infectious", specialty:"Respiratory", topic:"Active pulmonary tuberculosis",
   stem:"A 32-year-old man, recent migrant from Afghanistan (UK 6 months), presents with 3 months of cough productive of small amounts of blood-streaked sputum, weight loss (8 kg), night sweats, and low-grade fever. Examination: cachectic, BMI 18, right upper zone bronchial breathing. CXR: right upper lobe cavitation with surrounding infiltrate. Sputum smear positive for acid-fast bacilli (3+ on Ziehl-Neelsen). Sputum culture pending. Sputum NAAT (Xpert MTB/rif) confirms M. tuberculosis, rifampicin sensitive. HIV negative. He has not been treated for TB before. Liver function and visual acuity normal.\n\nWhich is the most appropriate antimicrobial therapy?",
   options:["Rifampicin alone","Ripe (rifampicin + isoniazid + pyrazinamide + ethambutol) for 2 months induction, then RH (rifampicin + isoniazid) for 4 months continuation, plus pyridoxine throughout","Isoniazid prophylaxis only (latent TB regimen)","Carbapenem","Linezolid first-line"],
   correct:"B",
   explanation:"PULMONARY TUBERCULOSIS (TB): caused by M. tuberculosis complex; remains a leading cause of infectious mortality globally (~1.3 million deaths annually); UK incidence ~8 per 100,000 (higher in foreign-born populations, deprivation, HIV co-infection, IVDU, homeless). \n\nPRESENTATION: classical features — cough (often >3 weeks; productive ± haemoptysis), weight loss, NIGHT SWEATS, FEVER, malaise, anorexia; CXR — typical features include UPPER LOBE CAVITATION (post-primary TB), Ghon focus / complex (primary), miliary pattern (disseminated), pleural effusion, hilar lymphadenopathy.\n\n(A) Rifampicin alone risks RAPID RESISTANCE — never single agent.\n\n(C) Latent TB regimen (isoniazid 6 months, or rifampicin 4 months, or RH 3 months) is for LATENT (positive IGRA, no active disease) — wrong here.\n\n(D) Carbapenem has minimal activity; not standard.\n\n(E) Linezolid is reserved for MDR-TB / drug-resistant TB.\n\n💎 PEARL: Active pulmonary TB: 6 months total — RIPE (rifampicin, isoniazid, pyrazinamide, ethambutol) for 2 months induction + RH (rifampicin, isoniazid) for 4 months continuation. Add pyridoxine throughout to prevent isoniazid-induced peripheral neuropathy. NEVER monotherapy (resistance). Notifiable. Contact tracing.",
   references:[{label:"NICE NG33 — Tuberculosis (2016)", url:"https://www.nice.org.uk/guidance/ng33"}]},

  {section:"infectious", specialty:"Cardiology", topic:"Infective endocarditis — Duke criteria diagnosis",
   stem:"A 45-year-old man (active intravenous drug user) presents with a 1-week history of fever (39.0°C), malaise, breathlessness, and small splinter haemorrhages on his nail beds. Examination reveals a new pansystolic murmur at the lower left sternal edge that increases on inspiration (Carvallo's sign — tricuspid regurgitation). T 38.4, HR 110, BP 110/70. Investigations: three sets of blood cultures taken from separate sites, all grow staphylococcus aureus (MSSA, fully sensitive). Transthoracic echocardiogram: 12 mm vegetation on the tricuspid valve with moderate tricuspid regurgitation; CXR: multiple peripheral cavitating nodules consistent with septic pulmonary emboli. Which diagnostic category does this patient meet under Duke criteria?",
   options:["Possible infective endocarditis","Definite infective endocarditis (meets two major Duke criteria)","Diagnosis rejected","Insufficient data — need ≥2 weeks fever","Need to repeat cultures in 1 week"],
   correct:"B",
   explanation:"INFECTIVE ENDOCARDITIS DIAGNOSIS — DUKE CRITERIA (Modified Duke 2000; revised Duke-ISCVID 2023): clinical algorithm to assess probability of IE. (2) ENDOCARDIAL INVOLVEMENT — vegetation, abscess, or new partial dehiscence of prosthetic valve on echo; or new valvular regurgitation. The 2023 update extends imaging criteria — PET-CT (¹⁸F-FDG abnormal uptake on prosthetic valve >3 months post-implant), cardiac CT (vegetation, abscess, pseudoaneurysm). Therefore DEFINITE IE per Duke criteria. \n\nMANAGEMENT: (1) IV ANTIBIOTICS — typically 4–6 weeks for native-valve, 6 weeks for prosthetic; specific regimens by organism; MRSA: IV vancomycin or daptomycin.\n\n(A) Possible IE = 1 major + 1 minor or 3 minor — this patient meets more.\n\n(C) Rejected IE = firm alternative diagnosis — not the case.\n\n(D) No requirement for 2 weeks fever; one of the minor criteria is fever ≥38°C.\n\n(E) Repeat cultures unnecessary — 3 are positive.\n\n💎 PEARL: Modified Duke criteria — DEFINITE IE: 2 major OR 1 major + 3 minor OR 5 minor criteria. MAJOR: typical organism in 2 cultures OR persistent bacteraemia; endocardial involvement on echo (vegetation, abscess, dehiscence) or new regurgitation. MINOR: predisposition, fever, vascular phenomena, immunological phenomena, suggestive micro. 2023 ISCVID update extends imaging criteria.",
   references:[{label:"ESC 2023 Endocarditis Guidelines", url:"https://academic.oup.com/eurheartj/article/44/39/3948/7227687"},{label:"Duke ISCVID 2023 Endocarditis Diagnostic Criteria", url:"https://academic.oup.com/cid/article/77/4/518/7100013"},{label:"BSAC UK Endocarditis Guidelines", url:"https://academic.oup.com/jac/article/67/2/269/735731"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Cellulitis — Eron classification",
   stem:"A 60-year-old man presents to the same-day emergency clinic with cellulitis: well-demarcated erythema, warmth and pain in the right lower leg, expanding over 24 hours from a small abrasion. No systemic toxicity (afebrile 36.8°C, HR 78, BP 130/80, RR 14, alert), no comorbidity (no diabetes, no peripheral vascular disease, no immunosuppression), NEWS2 = 0. Limb has good capillary return, no crepitus, no bullae, no anaesthesia. White cell count and CRP mildly raised. Urinalysis clear. Eron Class I (uncomplicated cellulitis).\n\nWhich is the most appropriate management?",
   options:["Outpatient oral flucloxacillin (or clarithromycin if penicillin-allergic) for 5–7 days, mark the border, safety-net for deterioration","Admission for IV vancomycin","Surgical debridement","14 days of oral co-amoxiclav","Hyperbaric oxygen"],
   correct:"A",
   explanation:"CELLULITIS: acute infection of skin and subcutaneous tissue, typically caused by group A streptococci (S. PYOGENES) and STAPHYLOCOCCUS AUREUS. PREDISPOSING FACTORS: prior cellulitis (recurrent — 30% within 3 years), VENOUS DISEASE / lymphoedema, peripheral vascular disease, diabetes, obesity, immunosuppression, IVDU, tinea pedis (athlete's foot — common gateway). ANTIBIOTIC CHOICE — UK / NICE NG141: FIRST-LINE oral — FLUCLOXACILLIN 500 mg–1 g 4 times daily for 5–7 days (covers staph and strep); PENICILLIN-ALLERGIC alternatives — CLARITHROMYCIN 500 mg BD or DOXYCYCLINE 100 mg BD or ERYTHROMYCIN. DURATION: typically 5–7 days; longer (10–14 days) for slower response or extensive disease.\n\n(B) IV vancomycin admission unwarranted for Eron I — escalation should match severity.\n\n(C) Surgical debridement is for necrotising / abscess — not simple cellulitis.\n\n(D) 14 days routine excessive — NICE recommends 5–7 days; longer only if slow response.\n\n(E) Hyperbaric O2 not standard for uncomplicated cellulitis.\n\n💎 PEARL: Eron Class I cellulitis (afebrile, no comorbidity, no systemic toxicity): outpatient oral flucloxacillin (or clarithromycin/doxycycline if penicillin-allergic) for 5–7 days. Class II = comorbidity. Class III = systemic toxicity. Class IV = septic / limb-threatening. Mark border, safety-net for deterioration.",
   references:[{label:"NICE NG141 — Cellulitis and erysipelas: antimicrobial prescribing", url:"https://www.nice.org.uk/guidance/ng141"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Catheter-related bloodstream infection",
   stem:"A 55-year-old man on long-term home parenteral nutrition through a tunnelled central line (Hickman, in situ 8 months for short-bowel syndrome) is admitted with rigors and fever (38.5°C) shortly after a line flush. Examination: line site clean, no overlying erythema or tenderness; no exit-site infection; no tunnel inflammation; mild systemic upset, BP 110/70, HR 100, RR 18, well perfused. Investigations: WCC 13.5, CRP 95. Paired blood cultures — both line and peripheral vein cultures grow staphylococcus epidermidis (coagulase-negative staphylococcus). Differential time-to-positivity: line culture flagged positive 3 hours before the peripheral culture (>2 hours suggests clabsi).\n\nWhich is the most appropriate next step?",
   options:["Discard culture as contaminant and discharge","IV vancomycin (or teicoplanin) empirically; consider line removal vs salvage with antibiotic lock","Oral antibiotics","Replace the line immediately without antibiotics","Aspirin only"],
   correct:"B",
   explanation:"CATHETER-RELATED BLOODSTREAM INFECTION (CLABSI / CRBSI): bloodstream infection with a catheter being the suspected source. \n\nDIAGNOSIS: SEMI-QUANTITATIVE CULTURE methods (rarely used now): (1) PAIRED BLOOD CULTURES from line and peripheral vein simultaneously — DIFFERENTIAL TIME-TO-POSITIVITY (DTP) >2 HOURS earlier from line vs peripheral suggests catheter source (this patient — supportive of CLABSI);\n(2) QUANTITATIVE CULTURES — line culture colony count ≥3× peripheral (rarely used now);\n(3) SEMI-QUANTITATIVE catheter tip culture (Maki — rolled tip) ≥15 CFU after removal. REVIEW EMPIRIC therapy at 48–72 hours when sensitivities back. CATHETER REMOVAL — when MANDATORY: (1) S.\n\n(A) Discharge as contaminant despite paired positive cultures and DTP supportive of CLABSI is unsafe.\n\n(C) Oral inadequate for bacteraemia.\n\n(D) Replace line without antibiotics — incomplete treatment.\n\n(E) Aspirin no role.\n\n💎 PEARL: CRBSI suspected: paired blood cultures from line and peripheral vein — DTP >2 hours from line vs peripheral suggests catheter source. Empirical IV vancomycin/teicoplanin (covers coag-neg staph + MRSA). Tunnelled-line salvage with antibiotic lock for coag-neg staph if no metastatic infection; REMOVE for S. aureus, fungaemia, persistent bacteraemia, or sepsis.",
   references:[{label:"epic3: National Evidence-Based Guidelines for Preventing HCAI (2014)", url:"https://www.journalofhospitalinfection.com/article/S0195-6701(13)60012-2/fulltext"},{label:"IDSA Vascular Catheter-related Infection Guidelines", url:"https://academic.oup.com/cid/article/49/1/1/421479"}]},

  {section:"infectious", specialty:"Respiratory", topic:"Influenza in older adults",
   stem:"A 78-year-old care-home resident presents during peak influenza season (mid-December) with 24 hours of fever (38.5°C), myalgia, dry cough, severe fatigue and headache. SpO₂ 92% on air (baseline 96), HR 110, RR 22, BP 130/80. CXR: clear, no consolidation. Bloods: WCC 9 (lymphocyte-predominant), CRP 45 (modest rise). Nasopharyngeal PCR: influenza A positive (subtype H3N2). She is unvaccinated this year. She is otherwise well, on amlodipine and atorvastatin.\n\nWhich is the most appropriate management?",
   options:["Oral oseltamivir 75 mg twice daily for 5 days, supportive care, isolate, vaccinate on recovery","Antibiotic mandatory in all patients","Oral prednisolone","Aspirin","Observation only"],
   correct:"A",
   explanation:"INFLUENZA: seasonal viral infection caused by INFLUENZA A or B viruses; A subtypes H1N1 and H3N2 dominate seasonal epidemics; antigenic DRIFT (small mutations) drives annual variation, antigenic SHIFT (genetic reassortment of haemagglutinin / neuraminidase) drives pandemic potential. \n\nPRESENTATION: ABRUPT onset (vs gradual cold), fever (often >39°C), MYALGIA, headache, fatigue, dry cough, sore throat, NASAL congestion. \n\nDIAGNOSIS: nasopharyngeal swab for VIRAL PCR (sensitivity ~95%, specificity ~99%; rapid antigen tests less sensitive); flu / RSV / COVID-19 multiplex PCR commonly used. AUREUS suspected. ISOLATION: side-room with droplet precautions; staff PPE; cohort if multiple cases; resolve over 5–7 days.\n\n(B) Antibiotics not routinely required in pure viral influenza — only if secondary bacterial infection suspected.\n\n(C) Oral steroid is not routinely used; may worsen viral shedding (different from severe COVID-19 where dexamethasone helps).\n\n(D) Aspirin in children with viral illness = REYE SYNDROME (rare hepatic encephalopathy); generally avoid in viral illnesses; not first-line antipyretic.\n\n(E) Observation alone misses opportunity for antiviral benefit in at-risk patient.\n\n💎 PEARL: Influenza in older or at-risk adults + within 48 hours of symptom onset: oseltamivir 75 mg BD for 5 days reduces complications and mortality. Confirm with nasopharyngeal multiplex PCR. Watch for secondary S. aureus pneumonia (especially after a 'dry' viral phase). Annual vaccination is the prevention.",
   references:[{label:"NICE TA158 — Oseltamivir, amantadine, zanamivir for influenza", url:"https://www.nice.org.uk/guidance/ta168"},{label:"UKHSA Influenza Guidance", url:"https://www.gov.uk/government/collections/seasonal-influenza-guidance-data-and-analysis"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Lyme disease — disseminated infection",
   stem:"A 38-year-old hiker in the Scottish Highlands removed an attached tick from her thigh 3 weeks ago. She noticed an erythematous rash with central clearing that gradually spread from the bite site to ~15 cm diameter ('bullseye' / target appearance — erythema migrans — see image). She now presents with new right-sided facial droop (bilateral facial weakness on examination — both forehead and lower face involved, peripheral CN VII), arthralgia in both knees with mild effusions, and palpitations. ECG: 1st-degree AV block (PR 240 ms). Lyme serology two-tier: elisa positive, immunoblot positive for IgM and IgG. CSF (LP performed): mild lymphocytic pleocytosis, raised protein, intrathecal Borrelia antibody synthesis confirmed.\n\nWhich is the most appropriate antimicrobial therapy?",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Bullseye_Lyme_Disease_Rash.jpg",
   imageAlt:"Classic bullseye / target appearance erythema migrans rash of early Lyme disease, with central clearing and expanding erythematous border",
   options:["Oral doxycycline 100 mg twice daily for 21–28 days, with IV ceftriaxone for severe neurological disease","Oral steroid alone","Penicillin V short course","No treatment if asymptomatic","Chloramphenicol"],
   correct:"A",
   explanation:"LYME DISEASE (Lyme borreliosis): tick-borne ZOONOTIC infection caused by spirochaete BORRELIA BURGDORFERI (B. burgdorferi sensu stricto in North America; B. afzelii / B. garinii / B. burgdorferi sensu lato in Europe / UK). \n\nDIAGNOSIS: STAGE 1 (erythema migrans) — CLINICAL diagnosis only; serology often negative (lags clinical presentation by weeks). \n\nMANAGEMENT: ERYTHEMA MIGRANS or non-specific stage 1 — ORAL DOXYCYCLINE 100 mg BD for 14 DAYS (NICE NG95); doxycycline is preferred (also covers other tick-borne illness — anaplasmosis, ehrlichiosis); ALTERNATIVES: amoxicillin 500 mg TDS for 14 days (in children, pregnancy, doxycycline-allergic), cefuroxime, azithromycin (if other contraindications).\n\n(B) Steroids alone do not treat the underlying spirochaetal infection; may suppress immune response.\n\n(C) Penicillin V short course is inadequate.\n\n(D) No treatment in disseminated disease risks chronic complications.\n\n(E) Chloramphenicol not first-line for Lyme.\n\n💎 PEARL: Erythema migrans + facial palsy / radiculopathy / heart block / arthritis after Highland tick bite = Lyme disease. Stage 1 (EM): clinical diagnosis, no serology needed (lags presentation). Treatment: oral doxycycline 100 mg BD for 21–28 days; IV ceftriaxone for severe neurological or cardiac disease.",
   references:[{label:"NICE NG95 — Lyme disease (2018)", url:"https://www.nice.org.uk/guidance/ng95"}]},

  {section:"infectious", specialty:"Gastroenterology", topic:"Fulminant Clostridioides difficile colitis",
   stem:"An 80-year-old woman on long-term proton pump inhibitor plus recent broad-spectrum antibiotics (co-amoxiclav for UTI, ciprofloxacin for cellulitis) is admitted with severe abdominal pain, distension and rigors after 5 days of profuse watery diarrhoea. Now passing no stool for 24 hours (developing ileus). Examination: rigid abdomen with marked tenderness, T 38.9°C, HR 130, BP 88/52 (hypotensive), RR 28. Investigations: lactate 4.5, WCC 28 (markedly raised), CRP 380, creatinine 280 (AKI from baseline 90), albumin 22, lactate 4.5. AXR: colonic dilatation 7 cm (toxic megacolon — caecum). CT abdomen: pancolitis with marked wall thickening ('thumbprinting') and free fluid; no perforation yet. Stool test: C. difficile toxin positive and PCR positive.\n\nWhich is the most appropriate management?",
   options:["Oral metronidazole alone","Oral vancomycin via NG (because of ileus) plus IV metronidazole, urgent surgical referral, ICU admission","IV vancomycin alone","Oral fidaxomicin alone","Continue current antibiotics and observe"],
   correct:"B",
   explanation:"CLOSTRIDIOIDES DIFFICILE INFECTION (CDI) — formerly Clostridium difficile. Particularly virulent strain RIBOTYPE 027 / NAP1 (epidemic in 2000s, declining now); BINARY TOXIN-positive strains. RECURRENT — symptoms return ≥3 days but ≤8 weeks after completing therapy. \n\nDIAGNOSIS: stool TESTING — CDI laboratory algorithm (PHE / NICE): TWO-STEP testing — initial sensitive screening test (GDH antigen OR PCR for toxin gene) + confirmatory specific test (toxin A/B EIA — detects ACTIVE toxin production). SEVERE: oral VANCOMYCIN 125 mg QDS or FIDAXOMICIN 200 mg BD; consider higher-dose vancomycin (500 mg QDS) in fulminant.\n\n(A) Oral metronidazole alone: outdated, less effective than vancomycin in modern guidelines; inadequate for fulminant disease.\n\n(C) IV vancomycin: NOT EFFECTIVE for CDI — it's not absorbed orally, but giving IV does NOT result in luminal concentration in colon (excretion not via gut); ALWAYS oral/NG for vancomycin in CDI.\n\n(D) Oral fidaxomicin alone: not standard for fulminant disease (limited evidence).\n\n(E) Continue antibiotics and observe: harmful — failure to escalate in fulminant disease.\n\n💎 PEARL: Fulminant CDI (ileus, hypotension, lactate ≥5, WCC ≥35, megacolon): oral vancomycin via NG (because of ileus — high-dose 500 mg QDS) PLUS IV metronidazole. Urgent surgical referral (sub-total colectomy may be life-saving). ICU. Severe (non-fulminant) CDI: WCC ≥15 or creatinine ≥1.5× baseline. Stop offending antibiotic.",
   references:[{label:"NICE NG199 — Clostridioides difficile infection: antimicrobial prescribing (2021)", url:"https://www.nice.org.uk/guidance/ng199"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Multidrug-resistant Pseudomonas — escalation",
   stem:"A 70-year-old man on the AMU has been on piperacillin-tazobactam 4.5 g 8-hourly for 72 hours for hospital-acquired pneumonia (worsened during admission for COPD exacerbation). He remains pyrexial (38.6°C), with rising CRP (320 from 240), WCC 22, and worsening clinical condition (oxygen requirement increasing to 8 L/min via venturi mask). Repeat sputum culture today: pan-resistant pseudomonas aeruginosa — sensitive only to colistin and ceftolozane-tazobactam (resistant to piperacillin-tazobactam, meropenem, ceftazidime, ciprofloxacin, gentamicin); blood cultures pending. He has no penicillin allergy. Source control review: no abscess or empyema on imaging.\n\nWhich is the most appropriate management?",
   options:["Continue piperacillin-tazobactam","Escalate per microbiology / ID input — change to ceftolozane-tazobactam or colistin per sensitivities, monitor closely, ensure source control","Switch to oral co-amoxiclav","Stop antibiotics","Add fluconazole only"],
   correct:"B",
   explanation:"ANTIMICROBIAL STEWARDSHIP and ESCALATION in failing therapy: a structured approach when a patient is not responding to current antibiotics. APPROACH ('STAR' or similar frameworks): (1) REVIEW the diagnosis — is the underlying problem actually infection? Could there be alternative or additional pathology (PE, malignancy, drug fever, autoimmune)? (2) REVIEW microbiology — current and (3) REVIEW drug — adequate dose for severity / weight / renal function? Therapeutic drug monitoring (vancomycin, gentamicin, voriconazole)? Drug-drug interactions reducing efficacy? Sub-therapeutic levels? Antibiotic absorption issues (oral vs IV)? (6) Consider HOST factors — immunosuppression, neutropenia, drug levels, renal / hepatic dysfunction. IMIPENEM-CILASTATIN-RELEBACTAM.\n\n(A) Continuing failing therapy ignores the worsening trajectory and resistance pattern.\n\n(C) Oral co-amoxiclav has NO activity against MDR Pseudomonas — wrong direction.\n\n(D) Stopping antibiotics in a deteriorating patient is unsafe.\n\n(E) Fluconazole adds nothing for bacterial pneumonia.\n\n💎 PEARL: Failing to respond on antibiotics + new MDR organism: liaise microbiology/ID urgently. Review diagnosis (is it really infection?), microbiology (any new culture data?), drug (correct dose for severity/weight/renal function?), source control (drainage, line removal, abscess?). MDR Pseudomonas: ceftolozane-tazobactam, ceftazidime-avibactam, colistin per sensitivities.",
   references:[{label:"BNF — Antibacterial drugs (Pseudomonas-active)", url:"https://bnf.nice.org.uk/"},{label:"BSAC Antimicrobial Stewardship", url:"https://bsac.org.uk/"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"HIV — antiretroviral therapy initiation",
   stem:"A 35-year-old man is newly diagnosed with HIV (4th-generation antibody/antigen test reactive, confirmed by Western blot; HIV-1 subtype B). CD4 count 200 cells/µL, viral load 80,000 copies/mL. He has no opportunistic infection (no TB symptoms, no oral thrush, no Kaposi's, no PCP). Resistance testing is pending. He is otherwise well, has no significant comorbidity, and has good adherence potential. Hepatitis B and C negative; latent TB IGRA negative.\n\nWhich is the most appropriate next step?",
   options:["Wait until CD4 falls below 100 before starting therapy","Start antiretroviral therapy immediately with insti-based regimen (e.g. Bictegravir/FTC/taf), arrange PCP prophylaxis, partner notification, vaccination programme","Aspirin alone","Treat only when an opportunistic infection occurs","Long-term oral steroid"],
   correct:"B",
   explanation:"HIV TREATMENT — RAPID-START ANTIRETROVIRAL THERAPY (ART) is now the global standard. FIRST-LINE REGIMENS (BHIVA, EACS, WHO, DHHS guidelines) — INTEGRASE STRAND TRANSFER INHIBITOR (INSTI)-based: BICTEGRAVIR / EMTRICITABINE / TENOFOVIR ALAFENAMIDE (BIKTARVY) — single tablet daily, FIRST-LINE; high genetic barrier to resistance, well tolerated, fewer drug interactions; DOLUTEGRAVIR-BASED — Triumeq (DTG/abacavir/lamivudine — needs HLA-B*5701 testing for abacavir hypersensitivity), or DOVATO (DTG/lamivudine — 2-drug regimen for those with viral load <500,000 and no resistance — TANGO and SALSA trials); RALTEGRAVIR (older INSTI, BD dosing — limited use now).\n\n(A) Waiting until CD4 <100 contradicts modern evidence — early ART improves outcomes regardless of CD4.\n\n(C) Aspirin treats nothing in HIV.\n\n(D) Treating only after opportunistic infection results in poor outcomes and missed prevention.\n\n(E) Steroids are not standard HIV therapy.\n\n💎 PEARL: Newly diagnosed HIV: rapid-start ART is now global standard regardless of CD4 (START trial). FIRST-LINE: INSTI-based (bictegravir/emtricitabine/tenofovir alafenamide — Biktarvy) — single tablet, high genetic barrier, well tolerated. CD4 <200 → PCP prophylaxis (co-trimoxazole). Vaccinate, partner notification, latent TB/HBV/HCV screening.",
   references:[{label:"BHIVA Guidelines (2023)", url:"https://www.bhiva.org/guidelines"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Pyrexia of unknown origin",
   stem:"A 50-year-old man has had daily fever (>38.3°C, often spiking >39°C) for over 3 weeks despite an extensive outpatient and 1-week inpatient workup. Initial blood and urine cultures (multiple sets), CXR, abdominal ultrasound, transthoracic echocardiogram, autoimmune screen (ANA, ANCA, RF, complement), HIV antibody, hepatitis serology, throat swab, sputum AFB and routine MCS — all negative. He has had occasional night sweats, weight loss 4 kg, mild anaemia (Hb 110), raised CRP (140) and ESR (88). Examination unremarkable today.\n\nWhich is the most appropriate next step?",
   options:["Empirical broad-spectrum antibiotics","Structured PUO investigation — repeated focused history and exam, targeted second-line tests (echo, CT thorax/abdo/pelvis, fdg-pet-ct, biopsy abnormal lesions)","Empirical glucocorticoid (prednisolone 40 mg)","Discharge with outpatient follow-up","Empirical chemotherapy"],
   correct:"B",
   explanation:"PYREXIA OF UNKNOWN ORIGIN (PUO): the classic Petersdorf 1961 definition (and modifications) — TEMPERATURE >38.3°C / >38.0°C, persistent for >3 WEEKS, NO DIAGNOSIS after appropriate inpatient or outpatient investigation. SUBTYPES (Durack-Street modification): (1) CLASSIC PUO — adults outside hospital;\n(2) NOSOCOMIAL PUO — hospital-acquired;\n(3) NEUTROPENIC PUO — neutrophils <500;\n(4) HIV-ASSOCIATED PUO. DRUG FEVER — withdrawal of suspected agent often diagnostic; resolves within 48–72 hours if drug-related. SUPPORTIVE — multidisciplinary involvement (ID, rheumatology, oncology, haematology, surgery as needed); psychosocial — anxiety / depression common in chronic PUO. PROGNOSIS: good for most; about 50% spontaneously resolve without diagnosis.\n\n(A) Empirical broad-spectrum antibiotics may suppress / partially treat undiagnosed infection, complicating diagnosis and creating resistance; reserve for septic deterioration.\n\n(C) Empirical steroids similarly mask diagnosis (lymphoma, vasculitis); only specific exception is suspected GCA.\n\n(D) Discharge without diagnosis is unsatisfactory but appropriate for outpatient continuation if clinically stable.\n\n(E) Empirical chemotherapy without tissue diagnosis is unsafe.\n\n💎 PEARL: PUO = T >38.3 + >3 weeks undiagnosed despite workup. Causes: infection (TB, abscess, IE), malignancy (lymphoma, RCC), inflammatory (vasculitis, AOSD), drug fever (resolves 48–72 h after withdrawal). Targeted second-line: echo, CT TAP, FDG-PET.",
   references:[{label:"Mulders-Manders et al. — PUO Approach (Med Clin North Am)", url:"https://pubmed.ncbi.nlm.nih.gov/26142780/"}]},

  {section:"infectious", specialty:"Gastroenterology", topic:"Typhoid (enteric) fever",
   stem:"A 28-year-old man returns from 4 weeks in northern India (he ate street food and drank tap water; no malaria prophylaxis taken) with 8 days of progressively rising stepwise fever (now 39.8°C with 'staircase' pattern), severe frontal headache, abdominal pain, initial constipation followed by loose stools, dry cough. Examination: relative bradycardia for the temperature (HR 88 with T 39.5°C — should normally be ~110), 2 cm splenomegaly, scattered rose-coloured spots on the trunk and abdomen (~10 erythematous blanching macules), mild abdominal tenderness, no peritonism. Investigations: WCC 4 (lymphocyte-predominant, neutropenia), platelets 95 (low), ALT 110 (mildly raised), CRP 95. Blood cultures (taken on admission) grow salmonella typhi after 3 days; stool culture also positive.\n\nWhich is the most likely diagnosis?",
   options:["Travel-acquired bacterial gastroenteritis","Typhoid (enteric) fever","Amoebic liver abscess","Falciparum malaria","Hepatitis A"],
   correct:"B",
   explanation:"TYPHOID FEVER (enteric fever): caused by SALMONELLA ENTERICA serovar TYPHI; PARATYPHOID by S. INCUBATION: 7–21 days. Investigations: BLOOD CULTURES — POSITIVE in 60–80% of cases in WEEK 1 (sensitivity falls in later weeks); STOOL and URINE cultures more sensitive in weeks 2–3; BONE MARROW culture is most sensitive (90%) — used in suspected disease with negative blood cultures, especially after partial antibiotic treatment. PCR available. \n\nTREATMENT: ANTIBIOTIC RESISTANCE is a MAJOR concern — multidrug-resistant (MDR; chloramphenicol-, ampicillin-, co-trimoxazole-resistant) and EXTENSIVELY DRUG-RESISTANT (XDR — additionally fluoroquinolone and 3rd-generation cephalosporin resistant) strains, particularly from Pakistan, India, parts of Africa.\n\n(A) Routine bacterial gastroenteritis: short course, profuse diarrhoea early, rarely systemic toxicity, typically self-limiting.\n\n(C) Amoebic liver abscess: RUQ pain, fever, abnormal LFTs, hepatomegaly, ultrasound shows abscess; metronidazole + paromomycin treatment.\n\n(D) Falciparum malaria: critical to exclude (always test in febrile returned traveller from endemic area); fever paroxysms, parasitaemia on film.\n\n(E) Hepatitis A: jaundice, raised ALT often >1000, contact / food source; not the typhoid-typical pattern.\n\n💎 PEARL: Returning traveller from Indian subcontinent + stepwise fever + relative bradycardia (Faget sign) + rose spots + splenomegaly + constipation→diarrhoea = typhoid (S. typhi). Blood culture week 1 (60–80% yield), bone marrow most sensitive. Empirical ceftriaxone or azithromycin — rising MDR/XDR.",
   references:[{label:"WHO Typhoid Treatment Guidelines", url:"https://www.who.int/publications/i/item/9789241549585"},{label:"UKHSA Enteric Fever Guidance", url:"https://www.gov.uk/government/publications/typhoid-and-paratyphoid-clinical-guidance"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Dengue fever in returned traveller",
   stem:"A 32-year-old presents with sudden-onset high fever (40°C), severe myalgia ('breakbone'), retro-orbital headache, and a maculopapular rash (truncal, sparing palms/soles, blanching) 7 days after returning from a 2-week trip to Brazil (Salvador, Bahia state). He noticed mosquito bites during the trip. Investigations: WCC 3.0 (leukopenia), platelets 80 × 10⁹/L (thrombocytopenia), ALT 110 / AST 130 (mildly raised transaminases), normal renal function, CRP 32. NS1 antigen positive, dengue IgM positive on rapid test. Falciparum malaria smear negative; HIV negative; typhoid serology negative. Lactate 1.8.\n\nWhich is the most appropriate management?",
   options:["Empirical antibiotics for typhoid","Supportive care with careful fluid management; monitor for warning signs of severe dengue; avoid NSAIDs and aspirin","Aspirin 75 mg daily","Long-term oral steroid","Doxycycline alone"],
   correct:"B",
   explanation:"DENGUE FEVER: arthropod-borne FLAVIVIRUS (single-stranded RNA, 4 serotypes DENV-1 to DENV-4) infection transmitted by AEDES AEGYPTI mosquito (urban / peri-urban; daytime biters; also Aedes albopictus in Europe / temperate areas). INCUBATION: 4–10 days. WARNING SIGNS for severe dengue. \n\nDIAGNOSIS: NS1 ANTIGEN — positive day 1–5 of fever, useful for early diagnosis; IgM — positive from day 4–5, for several weeks; IgG — appears later, indicates past infection; PCR — viral RNA, days 1–5. \n\nMANAGEMENT: NO SPECIFIC ANTIVIRAL therapy. PROGNOSIS: most cases self-limiting over 7–10 days with full recovery; mortality of severe dengue 1–5% with good care, higher in resource-limited settings.\n\n(A) Antibiotics inappropriate for viral disease; would be reasonable to await typhoid screen but treatment of confirmed dengue is supportive.\n\n(C) ASPIRIN INCREASES BLEEDING and worsens prognosis.\n\n(D) Steroid not standard treatment; some role in severe complications under specialist supervision.\n\n(E) Doxycycline doesn't treat dengue (covers leptospirosis, rickettsiae).\n\n💎 PEARL: Returning traveller + high fever + retro-orbital headache + 'breakbone' myalgia + rash + leukopenia + thrombocytopenia + transaminitis = dengue. Supportive — careful fluid management. AVOID NSAIDs and aspirin. Watch for warning signs (severe abdo pain, mucosal bleeding, rapid Hct rise) at defervescence (day 4–6).",
   references:[{label:"WHO Dengue Guidelines", url:"https://www.who.int/publications/i/item/9789240080739"},{label:"UKHSA Dengue Guidance", url:"https://www.gov.uk/government/collections/dengue-guidance-data-and-analysis"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Latent tuberculosis infection",
   stem:"A 30-year-old man, healthcare worker (medical secondary care), is identified as a close contact of a hospital colleague with newly diagnosed smear-positive pulmonary TB. Initial screening: interferon-gamma release assay (IGRA) positive (Quantiferon-Gold-Plus). He is asymptomatic (no cough, weight loss, fever, night sweats, fatigue). Examination unremarkable. CXR normal (no parenchymal disease, lymphadenopathy or pleural effusion); sputum AFB and culture negative; HIV negative; LFTs normal; no prior TB treatment; no immunosuppression. He had childhood BCG vaccination.\n\nWhich is the most appropriate management?",
   options:["No treatment — observe with periodic IGRA","Offer treatment for latent TB infection (e.g. 3 months isoniazid + rifampicin)","Active TB therapy (full ripe regimen for 6 months)","BCG re-vaccination only","Long-term oral steroid"],
   correct:"B",
   explanation:"LATENT TUBERCULOSIS INFECTION (LTBI): asymptomatic infection with M. tuberculosis without active disease. Approximately ONE QUARTER of the world's population has LTBI; LIFETIME RISK of REACTIVATION ~10% in immunocompetent individuals (5% within 2 years of infection, 5% later); RISK MUCH HIGHER in: HIV (~8% per year if untreated), immunosuppression, biologics (anti-TNF — infliximab, adalimumab, etanercept; risk reduced by screening and treatment before starting), TRANSPLANT recipients, HAEMODIALYSIS, malignancy / chemotherapy, DIABETES, malnutrition, smoking, alcohol misuse, age <5, RECENT INFECTION (this patient — close contact).\n\n(A) No treatment — misses opportunity to prevent reactivation in healthcare worker close contact (high-risk individual); ongoing risk to colleagues / patients if reactivates.\n\n(C) Active TB therapy (RIPE) is for ACTIVE disease — overtreatment; would be 4-drug for 2 months then 2-drug for 4 months; unnecessary side effect / drug interaction burden.\n\n(D) BCG vaccination is for primary prevention; does not treat LTBI.\n\n(E) Steroid would WORSEN risk of reactivation — relevant in immunosuppressed.\n\n💎 PEARL: Latent TB (positive IGRA + asymptomatic + normal CXR) → treat to prevent reactivation (~10% lifetime risk; far higher in HIV, biologics, transplant, dialysis). Regimens: 3 months isoniazid + rifampicin (3HR), 6 months isoniazid (6H), or 3-month weekly isoniazid + rifapentine (3HP).",
   references:[{label:"NICE NG33 — Tuberculosis (2016)", url:"https://www.nice.org.uk/guidance/ng33"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Secondary syphilis",
   stem:"A 30-year-old man who has sex with men presents with a 2-week history of generalised non-itchy maculopapular rash including palms and soles (copper-coloured, blanching), generalised lymphadenopathy, mucous patches on the tongue, condyloma lata in the perianal area, and patchy ('moth-eaten') alopecia. He recalls a painless genital ulcer 2 months ago that healed spontaneously without treatment. Investigations: syphilis serology — tppa (Treponema pallidum particle agglutination) strongly positive; RPR (rapid plasma reagin) reactive 1:128 (high titre); HIV antibody negative.\n\nWhich is the most likely diagnosis?",
   options:["Primary syphilis","Secondary syphilis","Tertiary syphilis","Latent syphilis","Reactive serology only (false positive)"],
   correct:"B",
   explanation:"SYPHILIS: caused by spirochaete TREPONEMA PALLIDUM subspecies pallidum. PRIMARY SYPHILIS (3 weeks post-exposure, range 9–90 days): PAINLESS, INDURATED genital / oral / anal CHANCRE (single, well-defined, clean base, NON-tender — distinguishes from chancroid which is painful) plus regional lymphadenopathy; resolves spontaneously over 3–6 weeks. RESOLVES untreated over weeks-months. \n\nDIAGNOSIS: SEROLOGY — TWO TYPES of test, both needed for accurate diagnosis: (1) NON-TREPONEMAL (LIPOIDAL) — RPR, VDRL — reactive in active disease; titre falls with successful treatment (used to monitor response — 4-fold drop = adequate response); FALSE POSITIVES with autoimmune disease (SLE), pregnancy, infection (EBV, malaria, HIV, TB), IVDU, age.\n\n(A) Primary syphilis: chancre alone — already resolved 2 months ago.\n\n(C) Tertiary syphilis: gummas / cardiovascular / neurosyphilis manifestations years later — not this presentation.\n\n(D) Latent syphilis: asymptomatic seropositive — this patient has clinical features.\n\n(E) False-positive serology unlikely with both tests strongly positive AND clinical features.\n\n💎 PEARL: Painless genital ulcer 2 months ago (primary chancre that healed) + non-itchy maculopapular rash on PALMS AND SOLES + condyloma lata + 'moth-eaten' alopecia + lymphadenopathy = secondary syphilis. IM benzathine penicillin G 2.4 MU single dose. Watch for Jarisch-Herxheimer 12–24 h after first dose.",
   references:[{label:"BASHH Syphilis Guidelines (2024)", url:"https://www.bashh.org/guidelines"}]},

  {section:"infectious", specialty:"Renal", topic:"Acute pyelonephritis",
   stem:"A 32-year-old woman has 24 hours of right-sided loin pain (severe, tender to palpation in the right renal angle), rigors, fever 39.0°C, dysuria, frequency, and one episode of vomiting (now able to keep oral fluids down). BP 110/72, HR 108, RR 18, T 39.0°C, lactate 1.6 (normal), no shock. Urinalysis: leucocytes ++++, nitrites positive, blood ++. Pregnancy test negative. EGFR normal. No history of stones, structural urinary tract abnormality, recent instrumentation, immunosuppression, or recurrent UTIs. Urine microscopy and culture sent.\n\nWhich is the most appropriate management?",
   options:["Outpatient oral co-amoxiclav for 7 days","Admit for IV antibiotic per local guideline (e.g. Cefuroxime, co-amoxiclav, gentamicin), de-escalate to culture-directed oral therapy when stable","Topical antibiotic","Long-term low-dose prophylactic antibiotic only","Aspirin only"],
   correct:"B",
   explanation:"ACUTE PYELONEPHRITIS: ascending UTI involving the renal parenchyma — KIDNEY infection (vs LOWER UTI = cystitis = bladder infection). \n\nPRESENTATION: classic triad — FEVER (often >38°C, with rigors), LOIN PAIN (often unilateral; severe; tender on palpation in renal angle / costovertebral angle — Murphy's punch), and LOWER URINARY TRACT SYMPTOMS (dysuria, frequency, urgency). IMAGING — ULTRASOUND OR CT urinary tract IF: pregnant, men, children, complicated infection (recurrent, immunosuppressed, structural abnormality, transplant, neurogenic bladder), poor response to 48 hours of antibiotics, suspected obstruction (severe pain, hydronephrosis, anuria), abscess suspicion.\n\n(A) Outpatient management may be appropriate for very mild Eron-class-I pyelonephritis but vomiting + rigors + fever 39 + tachycardia argue for at least initial inpatient assessment.\n\n(C) Topical antibiotic treats nothing.\n\n(D) Prophylactic antibiotic without acute treatment fails to address the active infection.\n\n(E) Aspirin treats nothing here.\n\n💎 PEARL: Loin pain + rigors + fever + dysuria + pyuria + nitrites = acute pyelonephritis. Admit for IV antibiotic (cefuroxime, co-amoxiclav, or gentamicin per local guideline) until stable, then de-escalate. Image with USS or CT if pregnant, male, complicated, or no response after 48 h — exclude obstruction.",
   references:[{label:"NICE NG111 — Pyelonephritis (acute): antimicrobial prescribing", url:"https://www.nice.org.uk/guidance/ng111"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Vertebral osteomyelitis with epidural abscess",
   stem:"A 65-year-old man with type 2 diabetes had S. aureus bacteraemia (MSSA) 4 weeks ago from a tunnelled dialysis catheter (now removed). Treated with 2 weeks IV flucloxacillin and discharged. He now presents with 3 weeks of progressive thoracic back pain (constant, severe, worse at night, unrelieved by analgesia), fever (38.2°C), and a new neurological deficit (mild bilateral leg weakness MRC 4/5, hyperreflexia, equivocal Babinski). Examination: T8–T9 spinal tenderness, sensory level at T10. Investigations: CRP 240 (markedly raised), WCC 16, ESR 95, blood cultures pending.\n\nWhich is the most appropriate management?",
   options:["Outpatient oral antibiotics","Admit, urgent neurosurgical referral, image-guided biopsy or surgical drainage, prolonged targeted IV antibiotics (~6 weeks)","Conservative management with NSAIDs and physiotherapy","Routine high-dose oral steroid","Lumbar puncture for CSF analysis"],
   correct:"B",
   explanation:"VERTEBRAL OSTEOMYELITIS / DISCITIS / EPIDURAL ABSCESS: spinal infection involving vertebral body, intervertebral disc, and / or epidural space. DIAGNOSIS — \n\nKEY POINT: CONSIDER in any patient with bacteraemia + new back pain, OR back pain + raised inflammatory markers + risk factor; LOW threshold for imaging.\n\n(A) Oral antibiotics outpatient: inadequate without urgent neurosurgical input given cord compression.\n\n(C) Conservative / NSAIDs misses life-threatening / function-threatening infection.\n\n(D) Steroids in spinal infection generally avoided except short course for severe cord compression while definitive treatment arranged (controversial — concern about immunosuppression).\n\n(E) Lumbar puncture rarely diagnostic and can spread infection if performed through infected tissue.\n\n💎 PEARL: S. aureus bacteraemia + new back pain ± fever ± neurology = vertebral osteomyelitis ± epidural abscess until proven otherwise. Urgent MRI whole spine. Image-guided biopsy or surgical drainage. Targeted IV antibiotics ~6 weeks. Operate before more deficit develops.",
   references:[{label:"UK Bone Infection Guidance — BSAC/BAOS/BOA", url:"https://academic.oup.com/jac/"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Non-tuberculous mycobacterial pulmonary disease (MAC)",
   stem:"A 60-year-old non-smoking woman with known bronchiectasis has 6 months of chronic productive cough (purulent sputum), increasing fatigue, slow weight loss (4 kg) and intermittent low-grade fever. Examination: thin, BMI 19, wide-spread crackles bilaterally. Investigations: three separate sputum samples grow mycobacterium avium complex (MAC); HRCT chest: nodular bronchiectasis in right middle lobe and lingula ('Lady Windermere' pattern), tree-in-bud opacities, no cavitation. HIV negative, immunoglobulins normal, CFTR negative. Liver function and visual acuity normal.\n\nWhich is the most appropriate management?",
   options:["Standard 4-drug anti-tuberculous therapy (ripe) for 6 months","Multi-drug NTM therapy (azithromycin + ethambutol + rifampicin) — for ~12 months past culture conversion","Single-agent macrolide alone","No treatment in any case","Long-term oral steroid"],
   correct:"B",
   explanation:"NON-TUBERCULOUS MYCOBACTERIAL (NTM) PULMONARY DISEASE: increasingly recognised — INCREASING incidence in many regions (improved detection, ageing population, more bronchiectasis, more immunosuppression). MAJOR PATHOGENS: M. DIAGNOSIS — BTS / ATS-IDSA criteria (must meet ALL): CLINICAL — pulmonary or systemic symptoms; RADIOLOGICAL — nodular / cavitary opacities, multifocal bronchiectasis with multiple small nodules; MICROBIOLOGICAL — at least ONE of: ≥2 separate POSITIVE SPUTUM CULTURES; or ≥1 BAL / wash positive culture; or BIOPSY with granulomatous inflammation OR positive culture from biopsy. DURATION: continued for ~12 MONTHS past sputum culture conversion (negative cultures); typically 18–24 months total.\n\n(A) Standard TB therapy (RIPE) is for active TB — NTM has DIFFERENT susceptibilities (e.g. MAC is largely resistant to isoniazid and pyrazinamide).\n\n(C) Single-agent macrolide guarantees rapid emergence of resistance.\n\n(D) Withholding treatment in symptomatic, progressive disease misses opportunity.\n\n(E) Steroids inappropriate as primary treatment; can WORSEN by suppressing immunity.\n\n💎 PEARL: Older non-smoking woman + bronchiectasis + chronic productive cough + nodular bronchiectasis ('Lady Windermere' pattern) + ≥2 sputum cultures positive for MAC = NTM pulmonary disease. Multi-drug therapy: azithromycin + ethambutol + rifampicin for ~12 months PAST sputum culture conversion. Don't treat asymptomatic colonisation.",
   references:[{label:"BTS NTM Pulmonary Disease Guidelines (Thorax 2017)", url:"https://thorax.bmj.com/content/72/Suppl_2/ii1"},{label:"ATS/ERS/ESCMID/IDSA NTM Pulmonary Disease Guidelines (2020)", url:"https://academic.oup.com/cid/article/71/4/e1/5867952"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Hospitalised COVID-19 — RECOVERY treatment",
   stem:"A 70-year-old man with hypertension and CKD stage 3b presents with 7 days of fever, dry cough and progressively worsening breathlessness. Sars-coV-2 PCR positive. SpO₂ 88% on air, requiring 4 L/min via nasal cannulae to maintain saturations >94%; RR 26, HR 102, BP 130/80, temp 38.4°C. CXR: bilateral peripheral and lower-zone infiltrates (consistent with COVID-19 pneumonitis). Inflammatory markers elevated — CRP 180, WCC 12, lymphocyte count 0.4 (lymphopenia), D-dimer 1500, ferritin 1200. He is unvaccinated.\n\nWhich is the most appropriate management?",
   options:["No specific therapy required — supportive only","Dexamethasone, oxygen titration, consider IL-6 antagonist or jak inhibitor for rapid progression, antiviral if early-window high-risk, VTE prophylaxis","Hydroxychloroquine","Long-term azithromycin","Aspirin alone"],
   correct:"B",
   explanation:"COVID-19 (SARS-CoV-2): respiratory virus first identified Wuhan, China, December 2019; declared pandemic March 2020. \n\nPRESENTATION: incubation 2–14 days (variable by variant); FEVER, dry cough, dyspnoea, fatigue, myalgia, anosmia / ageusia (less common in newer variants), GI symptoms, headache. \n\nDIAGNOSIS: PCR (gold standard); rapid antigen tests (lower sensitivity, useful for screening); chest imaging — bilateral peripheral and lower-zone GROUND-GLASS opacities ± consolidation, classic 'COVID' pattern. (2) DEXAMETHASONE 6 mg DAILY (oral or IV) for UP TO 10 DAYS for any patient REQUIRING SUPPLEMENTAL OXYGEN OR VENTILATION — RECOVERY TRIAL (Horby NEJM 2020): mortality reduction (NNT~30 in oxygen patients, NNT~9 in ventilated).\n\n(A) No therapy is appropriate only for asymptomatic / very mild ambulatory cases; this patient meets criteria for active treatment.\n\n(C) HYDROXYCHLOROQUINE was tested in RECOVERY and other large RCTs — NO BENEFIT, possible harm; abandoned.\n\n(D) AZITHROMYCIN — RECOVERY (and PRINCIPLE in primary care) showed NO benefit; not used.\n\n(E) Aspirin — RECOVERY no significant mortality benefit; not standard.\n\n💎 PEARL: Hospitalised COVID-19 with hypoxaemia: dexamethasone 6 mg daily for up to 10 days (RECOVERY). Add tocilizumab or baricitinib for rapid progression / high CRP / requiring oxygen. Antiviral (nirmatrelvir/ritonavir, remdesivir) for early disease in high-risk patients. VTE prophylaxis throughout.",
   references:[{label:"WHO COVID-19 Living Guidelines", url:"https://www.who.int/publications/i/item/WHO-2019-nCoV-therapeutics-2024.1"},{label:"RECOVERY Trial Reports", url:"https://www.recoverytrial.net/"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"MRSA bacteraemia",
   stem:"A 70-year-old man with a tunnelled central line (Hickman, in situ 6 months for chemotherapy in colorectal cancer) develops fever (39.0°C) and rigors during a line flush. Examination: line site shows mild surrounding erythema; no tunnel infection; well-perfused, BP 110/70, HR 100, RR 20. Two sets of blood cultures (one from line, one peripheral) both grow methicillin-resistant staphylococcus aureus (MRSA, vancomycin mic 1.0). DTP not significantly different. Repeat blood cultures at 48 hours still positive for MRSA despite 48 hours of empirical IV vancomycin therapy.\n\nWhich is the most appropriate management?",
   options:["Outpatient oral co-trimoxazole","IV vancomycin (target trough 15–20) or daptomycin, urgent line removal, transoesophageal echocardiogram, ID input","Linezolid orally short course","Penicillin V","Aspirin alone"],
   correct:"B",
   explanation:"S. KEY POINTS — S. aureus has unique virulence factors that make bacteraemia particularly dangerous: ability to seed virtually any tissue (METASTATIC INFECTION — endocarditis, osteomyelitis, septic arthritis, abscesses, septic emboli), TOXIN production (PVL, TSST), biofilm formation on prosthetic / foreign material. \n\nPRESENTATION: high fever, rigors, signs of source (skin / soft tissue infection, line, urinary, pneumonia, joint, prosthetic device); SEPSIS / septic shock; metastatic features may be subtle. MANAGEMENT — INFECTIOUS DISEASES INPUT IS RECOMMENDED FOR ALL S. (5) DURATION: UNCOMPLICATED bacteraemia — 14 days IV from FIRST NEGATIVE BLOOD CULTURE.\n\n(A) Oral antibiotics inadequate for bacteraemia.\n\n(C) Linezolid is bacteriostatic — not first-line for bacteraemia / endocarditis.\n\n(D) MRSA is by definition resistant to penicillin.\n\n(E) Aspirin no role.\n\n💎 PEARL: MRSA bacteraemia: IV vancomycin (target trough 15–20) or daptomycin. URGENT line removal — no salvage. TOE recommended (high endocarditis rate). Repeat blood cultures until negative. Duration 14 days from first negative culture for uncomplicated; 4–6 weeks for endocarditis or metastatic infection.",
   references:[{label:"UK Guidance for MRSA Bacteraemia and SSTI", url:"https://www.britishinfection.org/"}]},

  {section:"infectious", specialty:"Gastroenterology", topic:"Strongyloides hyperinfection syndrome",
   stem:"A 60-year-old man, originally from Sub-Saharan Africa (lived in UK 20 years; previous travel to Ethiopia, Kenya — childhood barefoot exposure to soil), is started on high-dose prednisolone (60 mg/day) for an autoimmune flare. Two weeks later, he develops gram-negative sepsis with E. coli bacteraemia, severe abdominal pain, new purpuric and serpiginous rash on the trunk migrating rapidly (larva currens), eosinophilia (1.6 × 10⁹/L — though may be suppressed by steroids), bilateral pulmonary infiltrates with haemoptysis on CXR, and cough productive of bronchial casts. Stool microscopy: motile filariform larvae of strongyloides stercoralis visible.\n\nWhich is the most likely diagnosis?",
   options:["Strongyloides stercoralis hyperinfection / disseminated disease","Routine bacterial sepsis","Drug-induced rash and sepsis","Connective tissue flare","Allergic reaction to steroid"],
   correct:"A",
   explanation:"STRONGYLOIDES STERCORALIS — soil-transmitted intestinal NEMATODE (roundworm), endemic in tropical / subtropical regions (sub-Saharan Africa, SE Asia, Latin America, parts of southern USA, southern Europe). Most chronic carriers are asymptomatic / minimally symptomatic. Eosinophilia and gut symptoms common. \n\nDIAGNOSIS: STOOL OVA / PARASITE microscopy — sensitivity 30% on single sample; multiple samples increase yield (~3 separate); BARMANN-MORAES funnel concentration; AGAR PLATE culture — increases yield (larvae move and create tracks visible under microscope); SEROLOGY (ELISA-IgG) sensitive (~90%) but not 100%; cross-reacts with other filarial / helminthic infections; takes time to revert to negative after cure (so cannot easily monitor response).\n\n(B) Routine bacterial sepsis: would not explain larva currens or pulmonary haemorrhage with bronchial casts.\n\n(C) Drug-induced rash: larva currens is pathognomonic of strongyloidiasis.\n\n(D) Connective tissue flare — rash and pulmonary haemorrhage could mimic vasculitis (pulmonary-renal syndromes), but stool finding is diagnostic.\n\n(E) Allergic reaction: not the mechanism.\n\n💎 PEARL: Patient from endemic area + new steroids/immunosuppression + Gram-negative sepsis + larva currens rash + pulmonary infiltrates ± haemoptysis + eosinophilia (often suppressed by steroids) = Strongyloides hyperinfection. Mortality >80%. Ivermectin until larvae clear. Screen serology BEFORE starting steroids/biologics in patients from endemic regions.",
   references:[{label:"UKHSA Imported Parasitic Infections Guidance", url:"https://www.gov.uk/government/publications/imported-parasitic-diseases"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"Schistosomiasis (Katayama fever)",
   stem:"A 32-year-old returning traveller from East Africa (Lake Malawi — swam in fresh water 6 weeks ago, then went on safari) has 4 weeks of intermittent fever (peaking 38.5°C), urticaria, eosinophilia (1.6 × 10⁹/L — markedly raised), abdominal pain, mild hepatosplenomegaly, and haematuria (intermittent terminal haematuria). Bloods: ALT 80 (mildly raised), normal renal function. Stool ova and parasites: schistosoma mansoni eggs detected (lateral spine — characteristic). Urine microscopy: schistosoma haematobium eggs (terminal spine — characteristic).\n\nWhich is the most appropriate management?",
   options:["Long-term oral steroid","Oral praziquantel — single-day or two-day course; evaluate for organ involvement; follow-up serology and microscopy","Aspirin alone","Long-term metronidazole","No specific treatment indicated"],
   correct:"B",
   explanation:"SCHISTOSOMIASIS (BILHARZIA): parasitic flatworm (TREMATODE) infection from FRESHWATER contact in endemic regions. mansoni, S. haematobium), parts of South America (Brazil — S. mansoni), Caribbean, parts of Asia (S. japonicum — China, Philippines, Indonesia), Middle East. \n\nDIAGNOSIS: (1) DIRECT — stool MICROSCOPY for ova (multiple samples — Kato-Katz technique increases yield; eggs may be intermittent — repeat); urine microscopy for ova (terminal spine of S. haematobium); BIOPSY (rectal mucosa, bladder mucosa) more sensitive than ova.\n\n(A) Steroid alone misses the parasitic infection.\n\n(C) Aspirin no role.\n\n(D) Metronidazole has no activity against schistosomes.\n\n(E) No treatment risks chronic disease and complications.\n\n💎 PEARL: Freshwater swim in endemic region + 4–12 weeks later: fever + urticaria + eosinophilia + haematuria (S. haematobium) or hepatosplenic disease (S. mansoni) = schistosomiasis (Katayama fever). Praziquantel 40–60 mg/kg single- or two-day course. Steroids for severe Katayama.",
   references:[{label:"WHO Schistosomiasis Guidelines", url:"https://www.who.int/publications/i/item/9789240041608"},{label:"PHE Schistosomiasis Guidance", url:"https://www.gov.uk/government/publications/schistosomiasis-public-health-information"}]},

  {section:"infectious", specialty:"Infectious Diseases", topic:"HIV pre-exposure prophylaxis (PrEP)",
   stem:"A 28-year-old hiv-negative man who has sex with men (multiple partners, recent condomless anal intercourse, recent rectal gonorrhoea diagnosed and treated) attends his sexual health clinic and requests pre-exposure prophylaxis (PrEP). He has no significant comorbidity. Investigations: HIV antibody/antigen negative, eGFR >90, urine acr normal, hepatitis B surface antibody positive (vaccinated), hepatitis C antibody negative, syphilis serology negative, gonorrhoea / chlamydia screen treated and now clear.\n\nWhich is the most appropriate management?",
   options:["No prophylaxis available — counsel safer sex only","Daily oral tenofovir disoproxil/emtricitabine (or 'event-based' dosing for selected MSM), 3-monthly review for HIV / STIs / renal function","Daily oral azithromycin","Long-term oral steroid","No follow-up needed"],
   correct:"B",
   explanation:"HIV PRE-EXPOSURE PROPHYLAXIS (PrEP): antiretroviral therapy taken by HIV-NEGATIVE individuals at substantial ONGOING risk of HIV exposure to PREVENT HIV ACQUISITION. APPROVED REGIMENS: (1) DAILY ORAL TENOFOVIR DISOPROXIL FUMARATE / EMTRICITABINE (Truvada or generic; TDF/FTC) — taken once daily; protective levels typically achieved within 7 days for receptive anal sex, ~21 days for receptive vaginal / penile sex; first approved 2012 (FDA), 2020 (NHS England). STOPPING PrEP: continue for 28 days after last potential exposure (vaginal / penile) or 2 days after last sex (anal — for event-based) before stopping; some advocate longer to ensure clearance.\n\n(A) PrEP IS available — denying it leaves the patient at unnecessary risk.\n\n(C) Azithromycin doesn't prevent HIV.\n\n(D) Steroid is harmful and irrelevant.\n\n(E) PrEP without follow-up risks undetected seroconversion / resistance / STIs.\n\n💎 PEARL: MSM with ongoing HIV risk: daily oral tenofovir/emtricitabine (Truvada) — protective at ~7 days for receptive anal sex, ~21 days for vaginal. 'On-demand' 2-1-1 dosing for selected MSM only. 3-monthly review: HIV/STI, eGFR, urine ACR, hepatitis. Continue 28 days after last exposure.",
   references:[{label:"BHIVA Guidelines (2023)", url:"https://www.bhiva.org/guidelines"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Early rheumatoid arthritis — DMARD initiation",
   stem:"A 32-year-old woman has 4 months of progressive symmetric small-joint pain affecting MCPs, PIPs and wrists bilaterally with morning stiffness lasting >2 hours. Examination: synovitis (boggy swelling) of multiple MCPs and PIPs, soft-tissue swelling, warm joints, with reduced grip strength. Investigations: anti-CCP antibodies strongly positive, rheumatoid factor positive (high titre), CRP raised (45), ESR 60. X-rays: periarticular erosions of the MCPs and bilateral wrists. ACR/EULAR 2010 criteria score 8 (≥6 = definite RA). She has not had any previous rheumatology input. No infections, no contraindications to dmards.\n\nWhich is the most appropriate first-line management?",
   options:["Hydroxychloroquine monotherapy","Methotrexate plus short-course oral prednisolone bridging","NSAIDs alone","Sulfasalazine monotherapy","Anti-TNF biologic first-line"],
   correct:"B",
   explanation:"RHEUMATOID ARTHRITIS (RA): chronic systemic autoimmune inflammatory polyarthritis with symmetrical small-joint synovitis, progressive joint destruction without treatment, and increased cardiovascular and infection mortality. Female:male 3:1. PRESENTATION — INSIDIOUS small-joint POLYARTHRITIS — MCPs, PIPs, wrists, MTPs spared; SYMMETRICAL; MORNING STIFFNESS >30 min (often hours); SOFT TISSUE SWELLING and tenderness; reduced grip; FATIGUE, malaise, low-grade fever; less commonly large joints. WINDOW OF OPPORTUNITY — early aggressive treatment (within 12 weeks of symptom onset) prevents joint damage and improves long-term outcomes.\n\n(A) Hydroxychloroquine alone is too weak for active erosive disease.\n\n(C) NSAIDs control symptoms but DO NOT modify disease — joint damage continues.\n\n(D) Sulfasalazine monotherapy is reasonable in milder disease but not first-line in this aggressive seropositive erosive disease.\n\n(E) Anti-TNF first-line not currently NICE-funded for new-onset RA — must trial conventional DMARDs first.\n\n💎 PEARL: Symmetric small-joint synovitis + morning stiffness + anti-CCP/RF positive + raised CRP = rheumatoid arthritis. WINDOW OF OPPORTUNITY (<12 weeks): start methotrexate + bridging prednisolone immediately — prevents erosions. Add biologic or JAK inhibitor at 3–6 months if treat-to-target failed. Folic acid alongside methotrexate.",
   references:[{label:"NICE NG100 — Rheumatoid arthritis in adults (2018, updated 2020)", url:"https://www.nice.org.uk/guidance/ng100"},{label:"EULAR 2022 Recommendations for RA Management", url:"https://ard.bmj.com/content/82/1/3"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"SLE with lupus nephritis",
   stem:"A 28-year-old woman of Afro-Caribbean ethnicity presents with 3 months of malar (butterfly) rash sparing the nasolabial folds, painless oral ulcers, polyarthralgia (symmetrical small joint, non-erosive), pleuritic chest pain (pleurisy), and fatigue. She has lost 4 kg and has new ankle swelling. Investigations: Hb 96 g/L (anaemia), WCC 3.0 × 10⁹/L (leukopenia), platelets 90 × 10⁹/L (thrombocytopenia); creatinine 130 (raised from baseline 70), urinalysis protein +++, blood ++ (active urine sediment), urine PCR 350 mg/mmol (significant proteinuria); ANA 1:1280 high-titre, anti-dsdna strongly positive, anti-Sm positive, low C3 (0.4) and C4 (0.05), direct Coombs positive.\n\nWhich is the most likely diagnosis?",
   options:["Sjögren syndrome","Systemic sclerosis","Systemic lupus erythematosus with lupus nephritis","Dermatomyositis","Mixed connective tissue disease"],
   correct:"C",
   explanation:"SYSTEMIC LUPUS ERYTHEMATOSUS (SLE): a chronic AUTOIMMUNE multisystem inflammatory disease affecting nearly any organ, characterised by IMMUNE-COMPLEX deposition and complement-mediated tissue damage. RENAL BIOPSY — essential for any patient with proteinuria (PCR ≥50 mg/mmol or ACR ≥30 mg/mmol) or haematuria with renal impairment; classifies lupus nephritis and guides immunosuppression. MANAGEMENT — multidisciplinary (rheumatology, nephrology, dermatology, cardiology, obstetrics for pregnancy planning): GENERAL — sun protection (SPF 50+), smoking cessation, vaccination (avoid live vaccines on immunosuppression), cardiovascular risk reduction, vitamin D, contraception with consideration of antiphospholipid status, pregnancy planning (delay until disease quiescent ≥6 months; particular monitoring for anti-Ro positive mothers).\n\n(A) Sjögren: dry eyes / mouth, anti-Ro / La.\n\n(B) Scleroderma: skin tightening, Raynaud's, anti-Scl-70 / anti-centromere.\n\n(D) Dermatomyositis: heliotrope rash, Gottron's, raised CK, proximal weakness.\n\n(E) MCTD: features of multiple CTDs, anti-RNP.\n\n💎 PEARL: SLE + active urinary sediment + raised creatinine = lupus nephritis. RENAL BIOPSY essential to classify. Class III/IV: high-dose steroids + MMF or low-dose IV cyclophosphamide (Euro-Lupus regimen). Hydroxychloroquine for ALL SLE; ACE-i for proteinuria. Goal: preserve renal function and prevent ESRD.",
   references:[{label:"KDIGO Lupus Nephritis Guideline (2024 update)", url:"https://kdigo.org/guidelines/gd/"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Giant cell arteritis with visual loss",
   stem:"A 75-year-old woman attends the same-day emergency clinic with new severe temporal headache for 3 weeks, scalp tenderness (notices when combing hair), jaw claudication (pain on chewing), and 2 episodes of transient monocular visual loss in the right eye yesterday (amaurosis fugax — described as 'curtain coming down for several minutes, then resolved'). Examination: tender, thickened, pulseless right temporal artery; visual acuity currently 6/9 right and 6/6 left; fundi normal. Investigations: ESR 92 mm/h, CRP 110, platelets 480 (raised), Hb 105 (anaemia of chronic disease), albumin 32. Neurological examination otherwise unremarkable.\n\nWhich is the most appropriate immediate management?",
   options:["Wait for temporal artery biopsy result before starting steroid","Start immediate oral prednisolone 60 mg daily, then arrange urgent temporal artery biopsy within 7-14 days, ophthalmology review same day","Start aspirin 75 mg and review in clinic in 2 weeks","Pulse IV methylprednisolone for 3 days only","MRI brain to exclude other causes first"],
   correct:"B",
   explanation:"GIANT CELL ARTERITIS (GCA, formerly TEMPORAL ARTERITIS): a chronic large- and medium-vessel granulomatous vasculitis predominantly affecting branches of the EXTERNAL CAROTID artery (especially temporal, ophthalmic, posterior ciliary arteries) and the AORTA / its major branches. \n\nINVESTIGATIONS: INFLAMMATORY MARKERS — ESR (often >50, frequently >100; markedly raised); CRP; PLATELETS (often raised — thrombocytosis); ANAEMIA of chronic disease; ALP raised in 30%; LFT derangement. REGIMEN — BSR (British Society for Rheumatology) GUIDELINES: WITHOUT VISUAL SYMPTOMS — ORAL PREDNISOLONE 40-60 mg DAILY (single morning dose). Add ASPIRIN 75 mg daily (some controversy — possible reduction in ischaemic events; bleeding risk). PPI cover.\n\n(A) Awaiting biopsy delays treatment and risks vision loss — biopsy yield not affected by 1-2 weeks of steroid.\n\n(C) Aspirin alone is INADEQUATE — must give steroid.\n\n(D) IV pulse alone for 3 days then nothing inadequate — must continue oral.\n\n(E) MRI brain not first-line — clinical syndrome diagnostic; investigations should not delay treatment.\n\n💎 PEARL: Older patient + new temporal headache + scalp tenderness + jaw claudication + amaurosis fugax + raised ESR/CRP = GCA. With visual symptoms: IV methylprednisolone 500–1000 mg × 3 days (BSR). Without: oral prednisolone 40–60 mg. Don't delay for biopsy — start steroids now, biopsy within 7–14 days.",
   references:[{label:"BSR Giant Cell Arteritis Guidelines (2020)", url:"https://academic.oup.com/rheumatology/article/59/3/e1/5709545"},{label:"ACR/EULAR 2022 Classification Criteria GCA", url:"https://ard.bmj.com/content/81/12/1647"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Septic arthritis",
   stem:"A 65-year-old man with seropositive rheumatoid arthritis on methotrexate 20 mg weekly + adalimumab presents with a 24-hour history of an acutely red, hot, swollen and exquisitely tender right knee. He cannot weight-bear. Examination: T 38.6°C, HR 110, BP 130/80; right knee with marked effusion, restricted painful movement, surrounding erythema. Investigations: WCC 15, CRP 280, urate normal. Urgent joint aspiration: turbid fluid, WCC 80,000/mm³ (95% neutrophils), gram stain shows gram-positive cocci in clusters; culture pending. No prosthetic joint. Blood cultures sent.\n\nWhich is the most appropriate immediate management?",
   options:["Start oral prednisolone","IV flucloxacillin (or vancomycin if MRSA risk / penicillin allergy), urgent orthopaedic referral for joint washout, hold methotrexate / biologic","Outpatient oral antibiotics","Intra-articular steroid injection","Conservative management with NSAIDs"],
   correct:"B",
   explanation:"SEPTIC ARTHRITIS: an ORTHOPAEDIC EMERGENCY — bacterial infection within a joint cavity causes RAPID JOINT DESTRUCTION (within hours via inflammatory cytokine release and bacterial toxins) and high mortality (10-15%); long-term joint damage in 50% of survivors even with treatment. \n\nPRESENTATION: acute monoarticular hot, swollen, painful joint with severely restricted active and passive movement; FEVER (often present, may be absent in elderly / immunosuppressed); systemic toxicity. MANAGEMENT — TIME-CRITICAL (BSR / BOA guidelines): (1) JOINT ASPIRATION before antibiotics if practicable. ADD CEFTRIAXONE if gonococcal suspected. Refine with culture / sensitivities.\n\n(A) Steroid alone WITHOUT antibiotic / drainage risks worsening sepsis.\n\n(C) Outpatient oral antibiotics inappropriate for septic arthritis.\n\n(D) INTRA-ARTICULAR STEROID INTO INFECTED JOINT IS DEVASTATING — accelerates joint destruction.\n\n(E) Conservative management with NSAIDs FAILS — infection progresses, joint destroyed.\n\n💎 PEARL: Acute hot swollen tender joint + can't weight-bear + fever = septic arthritis until proven otherwise (subtle in immunosuppressed). URGENT joint aspiration (turbid, WCC >50,000) BEFORE antibiotics. Empirical IV flucloxacillin (vancomycin if MRSA risk or penicillin allergy). Orthopaedic washout. Hold biologic. Mortality 10–15%.",
   references:[{label:"BSR Septic Arthritis Guideline (2006, Rheumatology)", url:"https://academic.oup.com/rheumatology/article/45/8/1039/1788464"}]},

  {section:"musculoskeletal", specialty:"Rheumatology", topic:"Acute gout — flare management",
   stem:"A 58-year-old man with hypertension on a thiazide diuretic (bendroflumethiazide 2.5 mg) presents with a sudden onset, overnight, of an exquisitely painful, red, swollen, hot first metatarsophalangeal joint (podagra — the classic location). Pain so severe that even bedsheet contact unbearable. He drinks 30 units/week alcohol (mostly beer), is overweight (BMI 32), eats meat / shellfish heavily. No history of gout previously. No joint trauma; no signs of infection (afebrile, well systemically). Investigations: serum urate 480 µmol/L (raised), CRP 65, normal renal function. Joint aspiration: needle-shaped, negatively birefringent (yellow when parallel to red compensator) crystals — confirming monosodium urate crystals.\n\nWhich is the most appropriate flare management?",
   options:["Start allopurinol immediately at full dose","Oral NSAID (e.g. Naproxen 500 mg BD) OR colchicine 500 mcg BD-TDS for the acute attack; do not start urate-lowering therapy during the acute attack","Empirical IV antibiotics","Methotrexate","Aspirin 75 mg daily"],
   correct:"B",

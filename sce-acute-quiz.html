   explanation:"Drug-induced liver injury (DILI) is one of the most common causes of unexplained liver test abnormalities and the leading cause of acute liver failure requiring transplantation in the UK / US. CO-AMOXICLAV is the leading single drug cause in the UK — typically MIXED cholestatic-hepatitic pattern, often with DELAYED ONSET 1–8 WEEKS AFTER the course is completed (immune-mediated idiosyncratic reaction; HLA-DRB1*15:01 association). Diagnosis is one of EXCLUSION: rule out viral, autoimmune, metabolic, vascular, and biliary obstruction. Management: WITHDRAW the offending drug; supportive care; report to MHRA Yellow Card scheme; specialist hepatology input for severe disease; transplantation for fulminant failure.\n\n(A) Negative viral serology excludes acute viral hepatitis.\n\n(C) Cholangiocarcinoma would show biliary tree abnormalities on imaging.\n\n(D) AIH typically has raised IgG and positive autoantibodies (ANA, anti-smooth-muscle, anti-LKM1) — negative here.\n\n(E) Wilson disease has low caeruloplasmin (normal here), copper deposition, KF rings, and typically a younger patient.\n\n💎 PEARL: Co-amoxiclav is the leading single drug cause of DILI in the UK. DELAYED onset 1–8 weeks AFTER the course is completed (immune-mediated, idiosyncratic; HLA-DRB1*15:01 association). Mixed cholestatic-hepatitic pattern. Diagnosis of exclusion. Withdraw drug; report via Yellow Card.",
   references:[{label:"EASL Drug-induced Liver Injury Guidelines (J Hepatol 2019)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(19)30143-7/fulltext"},{label:"LiverTox NIH Database", url:"https://www.ncbi.nlm.nih.gov/books/NBK547852/"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Acute uncomplicated diverticulitis (Hinchey 1A)",
   stem:"A 65-year-old man with known diverticulosis presents with 24 hours of left iliac fossa pain, fever 38.4°C, WCC 13.5, CRP 95. He is haemodynamically stable, eating and drinking. CT abdomen / pelvis: pericolonic inflammation around sigmoid diverticula, no abscess, no free fluid, no perforation, no obstruction (Hinchey 1A — uncomplicated diverticulitis with phlegmon only).\n\nWhich is the most appropriate management?",
   options:["Urgent emergency Hartmann's resection","Admit; supportive care; targeted oral antibiotics; outpatient colonoscopy at 6–8 weeks","Long-term colonoscopy avoidance","Discharge with no follow-up","Long-term oral prednisolone"],
   correct:"B",
   explanation:"Diverticular disease classification: simple diverticulosis (asymptomatic), symptomatic uncomplicated diverticular disease, acute diverticulitis (uncomplicated or complicated), diverticular bleeding. Acute diverticulitis severity (HINCHEY classification): 1A — pericolic phlegmon (this patient); 1B — pericolic abscess <3 cm; II — pelvic / retroperitoneal abscess >3 cm; III — purulent peritonitis; IV — faecal peritonitis. Management of UNCOMPLICATED diverticulitis (1A): supportive care, analgesia, fluids, low-residue diet. Colonoscopy 6–8 weeks AFTER recovery to exclude underlying neoplasm (especially in first episode after age 50, atypical features, or persistent symptoms).\n\n(A) Hartmann's is for Hinchey III/IV (peritonitis) — disproportionate for 1A.\n\n(C) Avoiding follow-up colonoscopy misses the chance to exclude underlying cancer.\n\n(D) Discharge without follow-up is unsafe.\n\n(E) Steroids would worsen the infectious / inflammatory process.\n\n💎 PEARL: Hinchey 1A (uncomplicated diverticulitis with phlegmon only): supportive care, oral antibiotics, low-residue diet — most resolve. Colonoscopy 6–8 weeks AFTER recovery to exclude underlying neoplasm. Hinchey 1B (abscess <3 cm): conservative; ≥3 cm needs drainage.",
   references:[{label:"NICE NG147 — Diverticular disease (2019)", url:"https://www.nice.org.uk/guidance/ng147"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Microscopic colitis",
   stem:"A 65-year-old woman has 6 months of chronic non-bloody watery diarrhoea (8–10 stools daily, including 2–3 nocturnal episodes) and 3 kg unintentional weight loss. She takes long-term lansoprazole, sertraline and naproxen. Stool cultures and C. difficile negative. Coeliac serology negative. Faecal calprotectin mildly raised. Colonoscopy: macroscopically normal mucosa throughout. Random biopsies (mandatory): increased intra-epithelial lymphocytes (>20 per 100 epithelial cells; lymphocytic colitis pattern); no thickened collagen band.\n\nWhich is the most likely diagnosis?",
   options:["Irritable bowel syndrome","Microscopic colitis (lymphocytic type)","Crohn's disease","Bacterial enteritis","Coeliac disease"],
   correct:"B",
   explanation:"Microscopic colitis: chronic non-bloody watery diarrhoea with MACROSCOPICALLY NORMAL colon at endoscopy and CHARACTERISTIC HISTOLOGY. Most common in older women. Diagnosis REQUIRES BIOPSY of macroscopically normal-looking colon — this is the take-home for SCE: always take random biopsies in patients investigated for chronic non-bloody diarrhoea, even when the colonoscopy looks normal (an easy point to miss). Treatment: review and withdraw precipitating drugs; first-line BUDESONIDE (locally acting 9 mg daily for 6–8 weeks) — highly effective, relapse common (may need maintenance dose); loperamide for symptomatic relief; bile-acid sequestrants (cholestyramine, colesevelam) in selected cases (overlap with bile-acid diarrhoea). Long-term follow-up.\n\n(A) IBS does not have nocturnal symptoms or weight loss; faecal calprotectin would be normal; biopsy would be normal.\n\n(C) Crohn's: macroscopic abnormalities at colonoscopy (skip lesions, ulcers, transmural inflammation, granulomas) — none here.\n\n(D) Bacterial enteritis: acute onset, positive cultures, self-limiting; not chronic 6-month course.\n\n(E) Coeliac: small-bowel disease with positive serology and duodenal villous atrophy; negative serology here, and biopsy taken from colon (not duodenum).\n\n💎 PEARL: Chronic non-bloody watery diarrhoea + macroscopically NORMAL colonoscopy + characteristic histology = microscopic colitis. ALWAYS take random biopsies in chronic non-bloody diarrhoea even with normal-looking mucosa. Budesonide first-line; review NSAIDs/PPIs/SSRIs.",
   references:[{label:"BSG Microscopic Colitis Guidelines (Gut 2023)", url:"https://gut.bmj.com/content/72/8/1473"},{label:"UEG Microscopic Colitis Position Paper (2021)", url:"https://onlinelibrary.wiley.com/doi/10.1177/2050640620951905"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Eosinophilic oesophagitis",
   stem:"A 25-year-old man has 18 months of intermittent solid-food dysphagia, food-bolus impaction (one prior episode 3 months ago requiring endoscopic disimpaction), and chest discomfort with eating. He has childhood asthma, atopic eczema and seasonal allergic rhinitis. He has been on omeprazole 20 mg daily for 8 weeks with no improvement. OGD: ringed ('trachealised') oesophagus with longitudinal furrows and white exudates; biopsies: ≥15 eosinophils per high-power field at multiple levels; gastric and duodenal biopsies normal.\n\nWhich is the most likely diagnosis?",
   options:["Achalasia","Eosinophilic oesophagitis","GORD only","Oesophageal squamous cell carcinoma","Hereditary angioedema"],
   correct:"B",
   explanation:"Eosinophilic oesophagitis (EoE): chronic immune / antigen-mediated oesophageal disease characterised by eosinophilic infiltration limited to the oesophagus. Classically affects ATOPIC YOUNG MEN (the 'four As' — asthma, allergic rhinitis, atopic dermatitis, food allergy). SYMPTOMS: solid-food dysphagia, food-bolus impaction (a key presenting feature — always biopsy a patient presenting with bolus obstruction even if endoscopy looks normal), chest discomfort, occasional heartburn. DIAGNOSIS requires ≥15 EOSINOPHILS per high-power field on oesophageal biopsy (multiple levels — proximal AND distal) AND exclusion of other causes.\n\n(A) Achalasia: dysphagia for solids AND liquids, manometry shows aperistalsis with failure of LOS relaxation; not eosinophil-driven.\n\n(C) GORD alone: eosinophil count <15/HPF, classical heartburn picture, responds to PPI.\n\n(D) Oesophageal cancer: older age, weight loss, progressive dysphagia, mass lesion on OGD.\n\n(E) Hereditary angioedema: episodic mucocutaneous swelling with C1-INH deficiency — not chronic dysphagia / impaction with biopsy eosinophilia.\n\n💎 PEARL: Atopic young man + solid-food dysphagia + food-bolus impaction + ringed/'trachealised' oesophagus + ≥15 eosinophils/HPF on biopsy = eosinophilic oesophagitis. ALWAYS biopsy after bolus impaction even if endoscopy looks normal. Treatment: PPI, swallowed topical steroid, or 6-food elimination diet.",
   references:[{label:"BSG Eosinophilic Oesophagitis Guidelines (Gut 2022)", url:"https://gut.bmj.com/content/71/8/1459"},{label:"AGA/JTF EoE Guidelines (Gastroenterology 2020)", url:"https://www.gastrojournal.org/article/S0016-5085(20)30270-4/fulltext"}]},

  // ═══════════════════════════════════════════════════════════
  // NEUROLOGY & OPHTHALMOLOGY  (target 36 — current 36 ✓)

  {section:"neurology", specialty:"Neurology", topic:"Guillain-Barré syndrome",
   stem:"A 28-year-old woman has a 3-week history of progressive ascending weakness, starting in the legs and now affecting both hands. She had a diarrhoeal illness 4 weeks ago. Examination: symmetrical lower limb power 3/5, upper limb 4/5, generalised areflexia, intact sensation. FVC 2.4 L (predicted 3.5 L) and falling. CSF: protein 1.4 g/L, WCC 2/mm³, glucose normal.\n\nWhich is the most likely diagnosis?",
   options:["Multiple sclerosis","Guillain-Barré syndrome","Myasthenia gravis","Motor neurone disease","Acute transverse myelitis"],
   correct:"B",
   explanation:"Guillain-Barré syndrome (GBS): acute immune-mediated polyradiculoneuropathy, classically triggered by Campylobacter jejuni (most common) — preceding diarrhoeal illness here is the clue. Other triggers: CMV, EBV, Mycoplasma, Zika, COVID-19, occasionally vaccines (very rare). Hallmarks: progressive ASCENDING WEAKNESS over <4 weeks (vs CIDP — chronic), AREFLEXIA, relatively preserved sensation. Severe cases: ventilatory failure (monitor FVC every 4 hours — intubate if <20 mL/kg or rapid decline), autonomic dysfunction (BP and HR lability — major mortality cause), bulbar involvement. Treatment: IV IMMUNOGLOBULIN (0.4 g/kg/day for 5 days) OR PLASMA EXCHANGE — equivalent efficacy; steroids do NOT work.\n\n(A) MS is a CNS disease — UMN signs, no global areflexia.\n\n(C) Myasthenia: fluctuating fatigable weakness, ocular/bulbar onset, normal reflexes, anti-AChR antibodies.\n\n(D) MND: mixed UMN + LMN signs, fasciculations, normal CSF.\n\n(E) Transverse myelitis: sensory level, sphincter involvement, T2 cord lesion on MRI.\n\n💎 PEARL: Ascending weakness + areflexia + recent diarrhoeal illness (Campylobacter most common) + albuminocytological dissociation in CSF = GBS. Monitor FVC every 4 hours — intubate if <20 mL/kg or rapidly falling. Autonomic instability is a major killer. IVIg or plasma exchange (equivalent).",
   references:[{label:"EAN/PNS Guideline on Diagnosis & Treatment of GBS (2023)", url:"https://onlinelibrary.wiley.com/doi/10.1111/jns.12536"}]},

  {section:"neurology", specialty:"Neurology", topic:"Multiple sclerosis — McDonald criteria",
   stem:"A 24-year-old woman has had two clinical episodes 6 months apart: (1) painful unilateral vision loss with afferent pupillary defect that improved over 6 weeks; (2) ascending paraesthesiae with a sensory level at T6 lasting 4 weeks. AQP4 and MOG antibodies negative.\n\nWhich is the most likely diagnosis?",
   options:["Neuromyelitis optica spectrum disorder","Multiple sclerosis","CNS vasculitis","Acute disseminated encephalomyelitis","Neurosarcoidosis"],
   correct:"B",
   explanation:"Multiple sclerosis: chronic demyelinating CNS disease. Diagnosis (revised McDonald criteria 2017) requires DISSEMINATION IN TIME and DISSEMINATION IN SPACE (DIS — lesions in ≥2 of 4 typical CNS locations: periventricular, cortical/juxtacortical, infratentorial, spinal cord). She fulfils both: 2 clinical attacks separated in time + characteristic MRI lesions + oligoclonal bands. Most common phenotype is RELAPSING-REMITTING MS (~85%), often progressing to secondary progressive over time; ~10% primary progressive. Disease-modifying therapies (DMTs): platform — interferon-beta, glatiramer; oral — dimethyl fumarate, teriflunomide, fingolimod, siponimod, ozanimod, cladribine; high-efficacy — natalizumab, ocrelizumab, ofatumumab, alemtuzumab. Early aggressive treatment improves long-term outcomes (epoch effect).\n\n(A) NMOSD has longitudinally extensive (>3 vertebrae) cord lesions and AQP4 antibodies (negative here).\n\n(C) CNS vasculitis: subacute course, multiple infarcts of different ages, often raised inflammatory markers.\n\n(D) ADEM: monophasic, post-infectious, often paediatric, large confluent lesions.\n\n(E) Neurosarcoidosis: meningeal/cranial nerve involvement, raised ACE, often pulmonary disease.\n\n💎 PEARL: MS = dissemination in time AND space (revised McDonald 2017). Two attacks separated in time + characteristic MRI lesions in ≥2 of 4 typical CNS sites + oligoclonal bands. Most common phenotype: relapsing-remitting (~85%). DMT escalation by activity; ocrelizumab/cladribine for highly active disease.",
   references:[{label:"NICE NG220 — MS in adults (2022)", url:"https://www.nice.org.uk/guidance/ng220"},{label:"ABN MS DMT Guidance", url:"https://www.theabn.org/page/MS_DMT_guidelines"}]},

  {section:"neurology", specialty:"Neurology", topic:"Myasthenia gravis with thymoma",
   stem:"A 32-year-old woman has 3 months of fluctuating bilateral ptosis worse at the end of the day, fatigable weakness on sustained upgaze, and progressive difficulty chewing and swallowing toward the end of meals. Anti-acetylcholine receptor antibodies strongly positive. Repetitive nerve stimulation: decremental response. CT thorax: 4 cm anterior mediastinal mass consistent with thymoma. FVC normal; no current bulbar crisis.\n\nWhich is the most appropriate management?",
   options:["Pyridostigmine alone","Pyridostigmine plus thymectomy","Plasma exchange only","Long-term high-dose IV corticosteroids","Rituximab"],
   correct:"B",
   explanation:"Myasthenia gravis: autoimmune disorder with antibodies against the post-synaptic nicotinic acetylcholine receptor (~85%) or against MuSK (~5%) or LRP4. Hallmark: FATIGABLE WEAKNESS (worsens with use, improves with rest) of ocular, bulbar and limb muscles. THYMOMA in 10–15%. Thymic hyperplasia common in younger AChR-positive patients. Diagnosis: anti-AChR antibodies, repetitive nerve stimulation showing decremental response, single-fibre EMG (most sensitive); ice-pack test for ptosis at the bedside. Management: SYMPTOMATIC — pyridostigmine (acetylcholinesterase inhibitor); IMMUNOSUPPRESSION — corticosteroids titrated up slowly (rapid escalation can precipitate transient worsening); steroid-sparing — azathioprine, mycophenolate, methotrexate, ciclosporin; refractory disease — rituximab (especially MuSK-positive), eculizumab (complement inhibitor), efgartigimod (FcRn antagonist).\n\n(A) Pyridostigmine alone misses the THYMOMA (oncological imperative — local invasion / spread risk).\n\n(C) Plasma exchange is for crisis, not maintenance.\n\n(D) High-dose IV steroids alone don't address thymoma; long-term IV is impractical.\n\n(E) Rituximab is for refractory disease, particularly MuSK-positive — not first-line in AChR-positive disease with thymoma.\n\n💎 PEARL: Fluctuating fatigable weakness (worse end of day, improves with rest) + ptosis + bulbar symptoms + anti-AChR antibodies = myasthenia gravis. Thymoma in 10–15% — CT thorax mandatory at diagnosis. Pyridostigmine + thymectomy. Crisis: IVIg or plasma exchange + ICU.",
   references:[{label:"ABN Myasthenia Gravis Guidelines (2014, J R Coll Physicians Edinb)", url:"https://www.theabn.org/"},{label:"MGFA International Consensus (2021)", url:"https://n.neurology.org/content/96/3/114"}]},

  {section:"neurology", specialty:"Stroke", topic:"Acute ischaemic stroke — thrombolysis",
   stem:"A 65-year-old man presents with sudden-onset right hemiparesis (face, arm, leg power 2/5) and expressive dysphasia. Last seen well 90 minutes ago. NIHSS 14. CT head: no haemorrhage; early ischaemic changes in the left MCA territory (ASPECTS 9). He takes aspirin only (no anticoagulant). BP 168/92 mmHg, glucose 6.8 mmol/L. INR normal, platelets 280. No recent surgery, no recent stroke, no GI bleeding.\n\nWhich is the most appropriate immediate next step?",
   options:["Mechanical thrombectomy alone without thrombolysis","IV thrombolysis (alteplase or tenecteplase) now, with concurrent CT angiography to assess for thrombectomy","Aspirin 300 mg orally and admit to stroke unit","Clopidogrel 300 mg loading","IV labetalol to reduce BP first"],
   correct:"B",
   explanation:"Acute ischaemic stroke pathway (NICE NG128 / ESO / AHA). IV THROMBOLYSIS within 4.5 hours of symptom onset (or last seen well) significantly improves outcomes (NINDS, ECASS III); window may extend to 9 hours in select patients with mismatch on perfusion imaging (EXTEND, WAKE-UP). Tenecteplase is increasingly used (single bolus, simpler). Thrombectomy improves outcomes up to 6 hours from onset (HERMES meta-analysis), and up to 24 hours with imaging mismatch (DAWN, DEFUSE-3 trials). CONTRAINDICATIONS to thrombolysis: recent intracranial haemorrhage, recent major surgery (<14 days), active bleeding, BP >185/110 (treat to <185/110 first), platelets <100, INR >1.7, recent stroke <3 months.\n\n(A) Thrombectomy without thrombolysis is for patients ineligible for thrombolysis (out of window, on anticoagulation, contraindications) — this patient is eligible.\n\n(C) Aspirin alone is for those NOT eligible for reperfusion therapy, or after thrombolysis (24-hour delay).\n\n(D) Clopidogrel loading is for non-cardioembolic minor stroke / TIA combined with aspirin (CHANCE / POINT) — not in eligible-for-thrombolysis large strokes.\n\n(E) BP 168/92 does NOT exceed 185/110 — no need to lower before thrombolysis; aggressive lowering risks worsening ischaemia.\n\n💎 PEARL: Acute ischaemic stroke ≤4.5 h, no haemorrhage, no contraindication: IV thrombolysis (alteplase or tenecteplase) + concurrent CT angiography to assess for thrombectomy. Window extends to 9 h with imaging mismatch (EXTEND, WAKE-UP); thrombectomy up to 24 h with mismatch (DAWN, DEFUSE-3). BP <185/110 first.",
   references:[{label:"NICE NG128 — Stroke and TIA in over 16s (2019)", url:"https://www.nice.org.uk/guidance/ng128"},{label:"RCP National Clinical Guideline for Stroke (2023)", url:"https://www.strokeguideline.org/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Status epilepticus — established (stage 2)",
   stem:"A 28-year-old man with epilepsy presents with continuous tonic-clonic seizures lasting 8 minutes. He has had IV lorazepam 4 mg, then 4 mg again 10 minutes later, with no effect. Glucose 5.4, sodium 138, normal calcium. He is now post-second-benzodiazepine and continues to seize. ABG: pH 7.28, lactate 4.5 (post-ictal). He is anaesthetic-aware and IV access is secure.\n\nWhich is the most appropriate next step?",
   options:["IV lorazepam 4 mg again (third dose)","IV phenytoin 20 mg/kg loading (or levetiracetam 60 mg/kg, or sodium valproate 40 mg/kg)","IV propofol bolus to induce general anaesthesia","IM diazepam","Rectal paraldehyde"],
   correct:"B",
   explanation:"Status epilepticus is now defined operationally as: t1 (continuous seizure activity ≥5 min) — initiate treatment; t2 (≥30 min) — risk of long-term neuronal injury and pharmacoresistance. STAGED treatment (NICE NG217 / ILAE): STAGE 1 (0–5 min) — supportive (ABC, oxygen, glucose check, IV thiamine if alcohol risk, IV access). STAGE 2 (5–30 min, 'established') — first-line BENZODIAZEPINE: lorazepam 4 mg IV (or buccal midazolam, rectal diazepam if no IV) — REPEATED ONCE if needed.\n\n(A) A third benzodiazepine dose risks respiratory depression without further benefit — escalate to second-line antiepileptic.\n\n(C) Propofol induction is for stage 4 (super-refractory) after second-line drugs fail.\n\n(D) IM diazepam is for non-IV-access scenarios; access is secure here.\n\n(E) Rectal paraldehyde is largely obsolete — no longer recommended in modern guidelines.\n\n💎 PEARL: Established status (5–30 min) after 2 doses of benzodiazepine: load with second-line antiepileptic — IV phenytoin 20 mg/kg, OR levetiracetam 60 mg/kg, OR sodium valproate 40 mg/kg (ESETT — all three equivalent). A third benzo dose just causes respiratory depression.",
   references:[{label:"NICE NG217 — Epilepsies (2022)", url:"https://www.nice.org.uk/guidance/ng217"}]},

  {section:"neurology", specialty:"Neurology", topic:"Bacterial meningitis — first action",
   stem:"A 22-year-old student presents with 12 hours of severe headache, fever 39.2°C, photophobia, neck stiffness and a non-blanching purpuric rash. He is alert, GCS 14. BP 96/58, HR 122, lactate 3.2.\n\nWhich is the most appropriate immediate action?",
   options:["CT head before any antibiotics","IV ceftriaxone 2 g (with dexamethasone), then arrange CT and lumbar puncture","Lumbar puncture before antibiotics","Oral ciprofloxacin","IV aciclovir alone"],
   correct:"B",
   explanation:"Suspected bacterial meningitis with sepsis features and a purpuric rash (likely meningococcal) — IV antibiotics must be given within minutes, NOT delayed for imaging or LP. IV ceftriaxone 2 g is the empirical adult choice; add IV amoxicillin if age >50 or immunocompromised (Listeria cover); IV dexamethasone 10 mg is given before/with the first antibiotic dose for likely pneumococcal meningitis. Notify Public Health.\n\n(A) CT head delays antibiotics and is only required pre-LP if focal signs, GCS ≤12, immunocompromise or seizures — not before antibiotics.\n\n(C) LP delays antibiotics.\n\n(D) Oral antibiotics are inadequate for invasive meningococcal sepsis.\n\n(E) Aciclovir treats viral encephalitis; this clinical picture (rash, neck stiffness, sepsis) is bacterial meningitis.\n\n💎 PEARL: Suspected bacterial meningitis with sepsis or purpuric rash: IV ceftriaxone 2 g + dexamethasone WITHIN MINUTES — do NOT delay for CT or LP. Add amoxicillin if >50 or immunocompromised (Listeria). Notifiable. CT only required pre-LP if focal signs, GCS ≤12, immunocompromise or seizures.",
   references:[{label:"NICE CG102 — Meningitis (bacterial) and meningococcal septicaemia in under 16s", url:"https://www.nice.org.uk/guidance/cg102"},{label:"UK Joint Specialist Societies Bacterial Meningitis (Lancet ID)", url:"https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(16)00100-9/fulltext"}]},

  {section:"neurology", specialty:"Neurology", topic:"Subarachnoid haemorrhage — confirmed CT",
   stem:"A 45-year-old woman presents 4 hours after a sudden severe ('thunderclap') occipital headache with vomiting and mild neck stiffness. GCS 14, no focal deficit. The non-contrast CT head is shown:",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/CT_of_subarachnoid_hemorrhage.png",
   imageAlt:"Non-contrast CT head showing hyperdense blood in the basal cisterns consistent with subarachnoid haemorrhage",
   options:["Discharge with outpatient migraine review","CT angiography to identify aneurysm; transfer to a neurosurgical centre; nimodipine; BP control","Lumbar puncture before any further imaging","MRI brain to confirm","Empirical aspirin"],
   correct:"B",
   explanation:"CT shows hyperdense blood in the basal cisterns — diagnostic of subarachnoid haemorrhage. Next step is CT angiography to identify the underlying aneurysm (~85% of spontaneous SAH) and urgent transfer to a neurosurgical centre for definitive treatment (endovascular coiling preferred over clipping in most aneurysms — ISAT trial). Adjuncts: nimodipine 60 mg PO 4-hourly (reduces vasospasm-related ischaemia), BP control, management of hydrocephalus, seizure prevention.\n\n(A) The CT confirms a serious diagnosis — discharge would be negligent.\n\n(C) LP is for negative or equivocal CT >6 hours from headache onset; it adds nothing when CT already shows blood.\n\n(D) MRI is unnecessary — CT has confirmed SAH.\n\n(E) Aspirin is contraindicated in active intracranial haemorrhage.\n\n💎 PEARL: Thunderclap headache + hyperdense blood in basal cisterns on CT = subarachnoid haemorrhage. Next: CT angiography (find aneurysm — ~85% of cases), neurosurgical centre transfer, nimodipine 60 mg 4-hourly, BP control. Endovascular coiling preferred over clipping for most aneurysms (ISAT trial).",
   references:[{label:"NICE NG228 — Subarachnoid haemorrhage caused by ruptured aneurysm (2022)", url:"https://www.nice.org.uk/guidance/ng228"}]},

  {section:"neurology", specialty:"Neurology", topic:"Herpes simplex encephalitis",
   stem:"A 38-year-old woman presents with 3 days of fever 38.6°C, severe headache, confusion (GCS 13, disorientated to time), and a focal motor seizure of the right arm in the department. CSF: opening pressure normal, WCC 80/mm³ (90% lymphocytes), protein 1.0 g/L, glucose 3.0 (paired serum 5.4), no organisms on Gram stain. CT head: subtle left temporal lobe oedema.\n\nWhich is the most appropriate immediate management?",
   options:["IV ceftriaxone 2 g BD alone","IV aciclovir 10 mg/kg three times daily, with empirical broad-spectrum antibacterial cover until cultures return","Oral aciclovir 800 mg five times daily","IV foscarnet","IV dexamethasone alone"],
   correct:"B",
   explanation:"Herpes simplex encephalitis (HSE): the most common viral encephalitis in immunocompetent adults, predominantly HSV-1. Subacute presentation: fever, headache, behavioural change, confusion, seizures (particularly focal — temporal lobe), focal deficits. CSF: lymphocytic pleocytosis, raised protein, normal glucose, often raised red cell count (haemorrhagic temporal involvement). Diagnosis: CSF HSV PCR (sensitivity ~95% by 24–48 hours of symptoms; can be falsely negative very early — repeat if clinical suspicion remains). Treatment is TIME-CRITICAL: IV ACICLOVIR 10 mg/kg TDS empirically, started immediately on suspicion (do NOT wait for PCR result). Duration: 14–21 days. Adequate IV hydration to reduce nephrotoxicity (crystalluria); monitor renal function.\n\n(A) Antibiotic alone misses HSV — would be fatal in HSE.\n\n(C) Oral aciclovir is for mucocutaneous HSV — bioavailability inadequate for CNS infection.\n\n(D) Foscarnet is for aciclovir-resistant HSV (rare, mostly in immunocompromised).\n\n(E) Dexamethasone alone has no antiviral activity; routine adjunctive steroids in HSE are not standard (some emerging evidence, e.g. GERMANNCH study).\n\n💎 PEARL: Fever + headache + behavioural change + focal seizures + temporal lobe oedema/T2 changes = herpes simplex encephalitis. Time-critical: IV aciclovir 10 mg/kg TDS empirically — do NOT wait for PCR. CSF HSV PCR can be falsely negative very early — repeat if clinical suspicion remains.",
   references:[{label:"ABN/BIA Encephalitis Guidelines (2012)", url:"https://www.encephalitis.info/healthcare-professionals"}]},

  {section:"neurology", specialty:"Neurology", topic:"Metastatic spinal cord compression",
   stem:"A 65-year-old man with castrate-resistant prostate cancer (known bone metastases) presents with 7 days of progressive thoracic back pain (worse on lying flat, worse coughing) and 24 hours of bilateral leg weakness with new urinary retention. Examination: bilateral lower-limb power 3/5, hyper-reflexia, upgoing plantars, sensory level T8, palpable bladder. CT thorax 2 weeks ago showed T7 sclerotic vertebral metastasis.\n\nWhich is the most appropriate immediate next step?",
   options:["Outpatient MRI within 4 weeks","Oral analgesia and physiotherapy referral","IV/PO dexamethasone 16 mg STAT (with PPI cover), urgent whole-spine MRI within 24 hours, urgent oncology and spinal team referral","Lumbar puncture","CT thorax repeat"],
   correct:"C",
   explanation:"Metastatic spinal cord compression (MSCC) is a NEURO-ONCOLOGY EMERGENCY. NICE NG75 / CG75: immediate management is DEXAMETHASONE 16 mg STAT (then 8 mg BD reducing course; PPI cover for gastric protection) — given on CLINICAL SUSPICION, do NOT delay awaiting imaging. Definitive management within 24–48 hours of suspicion: SURGICAL DECOMPRESSION (typically posterior decompression and stabilisation) for those with reasonable prognosis (>3 months expected survival), single level of compression, mechanically unstable spine, or radioresistant histology — provides better functional outcome than radiotherapy alone (Patchell 2005). VTE prophylaxis (high risk in malignancy with reduced mobility). Catheterise for retention.\n\n(A) Outpatient MRI within 4 weeks risks irreversible paraplegia.\n\n(B) Conservative management is wholly inadequate — this is an emergency.\n\n(D) LP risks transtentorial / cord herniation if mass and is contraindicated.\n\n(E) Repeat CT thorax does not address the cord — MRI is the imaging modality.\n\n💎 PEARL: Cancer + thoracic back pain (worse lying flat, worse coughing) + bilateral leg weakness + retention/sensory level = MSCC. NICE NG75: dexamethasone 16 mg STAT on clinical suspicion, BEFORE imaging. Whole-spine MRI within 24 hours. Surgical decompression beats radiotherapy alone in fit patients (Patchell 2005).",
   references:[{label:"NICE NG234 — Spinal Metastases and Metastatic Spinal Cord Compression (2023)", url:"https://www.nice.org.uk/guidance/ng234"}]},

  {section:"neurology", specialty:"Neurology", topic:"Cauda equina syndrome",
   stem:"A 42-year-old man with previous mechanical low back pain develops 3 days of acute exacerbation after lifting at work, plus 24 hours of bilateral leg numbness and weakness, perineal numbness ('saddle anaesthesia'), and difficulty initiating urination with a sense of incomplete emptying. Examination: bilateral lower-limb 4/5 power, reduced perianal sensation, reduced anal tone. Bedside post-void residual bladder volume 380 mL.\n\nWhich is the most appropriate immediate management?",
   options:["Outpatient physiotherapy referral","Urgent MRI lumbosacral spine and same-day spinal surgical referral","IV antibiotics for presumed discitis","Lumbar puncture","Local epidural steroid injection"],
   correct:"B",
   explanation:"Cauda equina syndrome (CES) is a SURGICAL EMERGENCY caused by compression of the lumbosacral nerve roots below the conus (typically L4/5 or L5/S1 level). Classical features (BSG / NICE / NHS England guidance): bilateral leg pain / numbness / weakness; SADDLE anaesthesia (perianal, scrotal/labial, perineal); URINARY symptoms (retention, overflow incontinence, loss of urge to void) — POST-VOID RESIDUAL >100–200 mL is a key red flag that distinguishes CES from non-CES back pain (HE-PASS pathway emphasises this); FAECAL incontinence or loss of anal tone; sexual dysfunction. Catheterise for retention while imaging arranged.\n\n(A) Outpatient physiotherapy with red-flag bladder dysfunction risks permanent incontinence.\n\n(C) Antibiotics treat infection — clinical features here are mechanical compression.\n\n(D) LP risks worsening any compression, has no diagnostic role here.\n\n(E) Epidural steroid does not relieve compression.\n\n💎 PEARL: Bilateral leg pain/weakness + saddle anaesthesia + urinary retention/incontinence + reduced anal tone = cauda equina syndrome. Post-void residual >100–200 mL is the key red flag. SURGICAL EMERGENCY: urgent MRI lumbosacral spine + same-day spinal surgery referral. Catheterise while imaging arranged.",
   references:[{label:"NICE Spinal Pain Pathway", url:"https://www.nice.org.uk/"},{label:"Society of British Neurological Surgeons CES Standards", url:"https://www.sbns.org.uk/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Wernicke encephalopathy",
   stem:"A 56-year-old man with chronic alcohol misuse and recurrent admissions is brought in confused after a 2-week binge with poor oral intake. Examination: confused (AMTS 3/10), bilateral lateral rectus palsy, horizontal nystagmus, ataxic gait. He is haemodynamically stable. Glucose 4.6 mmol/L, Na 134, K 3.6, Mg 0.6 mmol/L (low). The on-call SHO has prepared an IV glucose infusion to start.\n\nWhich is the most appropriate immediate management?",
   options:["Oral thiamine 100 mg daily","IV Pabrinex (high-potency thiamine + B vitamins + vitamin C) before any glucose","Start the IV glucose first, then oral thiamine","IV lorazepam for delirium","CT head before any treatment"],
   correct:"B",
   explanation:"Wernicke encephalopathy: medical emergency caused by THIAMINE (vitamin B1) deficiency. Classic TRIAD: CONFUSION + OPHTHALMOPLEGIA (lateral rectus, conjugate gaze palsies, nystagmus) + ATAXIA — only ~10% of patients have all three; ANY ONE feature in a high-risk patient should prompt empirical treatment (Caine criteria). HIGH-RISK groups: chronic alcohol misuse, hyperemesis gravidarum, anorexia nervosa, prolonged starvation, refeeding, post-bariatric surgery, malabsorption (Crohn's, post-gastrectomy), HIV/AIDS, dialysis, chemotherapy. Treatment: IV Pabrinex (high-potency thiamine + B vitamins + vitamin C), 2 pairs (vials) IV TDS for 5 days minimum (longer in confirmed Wernicke), then oral thiamine 100 mg TDS for at least 6–8 weeks.\n\n(A) Oral thiamine bioavailability is too low for treatment of acute Wernicke.\n\n(C) Glucose first is potentially DEVASTATING in this patient — could precipitate or worsen Wernicke.\n\n(D) Lorazepam may be needed for alcohol withdrawal but does NOT replace thiamine; sedating without thiamine masks deterioration.\n\n(E) CT delays time-critical treatment; investigate alongside, not instead of.\n\n💎 PEARL: Confusion + ophthalmoplegia + ataxia in alcohol misuse / hyperemesis / starvation / refeeding = Wernicke. Only ~10% have all three — ANY ONE feature in a high-risk patient mandates treatment. IV Pabrinex BEFORE any glucose (glucose without thiamine precipitates Wernicke). Replace magnesium too.",
   references:[{label:"NICE CG100 — Alcohol-use disorders: physical complications", url:"https://www.nice.org.uk/guidance/cg100"},{label:"Royal College of Physicians Wernicke-Korsakoff Position", url:"https://www.rcplondon.ac.uk/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Idiopathic intracranial hypertension",
   stem:"A 28-year-old woman (BMI 38) presents with daily holocranial headache (worse on waking and bending forward), brief transient visual obscurations (lasting seconds, with postural change), and pulsatile tinnitus. Examination: bilateral grade 2 papilloedema, normal visual acuity 6/6, full visual fields on confrontation, no other focal neurological deficit. Lumbar puncture (lateral decubitus): opening pressure 32 cmH₂O, normal CSF constituents.\n\nWhich is the most appropriate first-line management?",
   options:["Acetazolamide titrated up, weight loss, ophthalmology surveillance with formal visual fields","Lumboperitoneal shunt as first-line surgery","Optic nerve sheath fenestration immediately","IV mannitol","Long-term oral prednisolone"],
   correct:"A",
   explanation:"Idiopathic intracranial hypertension (IIH, formerly 'pseudotumour cerebri'): typically obese women of reproductive age. Imaging signs that support IIH: empty sella, posterior globe flattening, distended optic nerve sheaths, narrowed transverse sinuses. FIRST-LINE management: ACETAZOLAMIDE (250 mg BD titrated up to 1–4 g/day; carbonic anhydrase inhibitor — reduces CSF production); WEIGHT LOSS (10% body weight can be curative — IIHTT and BMI-WL trials); SERIAL VISUAL FIELD TESTING (Humphrey perimetry) to monitor for visual deterioration (the major morbidity). Topiramate is alternative (also weight loss). Discontinue any precipitating drugs (vitamin A excess, tetracyclines, growth hormone, lithium, danazol). Bariatric surgery for severe obesity.\n\n(B) Lumboperitoneal shunt is for failing medical therapy or rapidly deteriorating vision — not first-line.\n\n(C) Optic nerve sheath fenestration is for vision-threatening IIH refractory to medical therapy.\n\n(D) Mannitol is for acutely raised ICP from mass / oedema — not chronic IIH.\n\n(E) Steroids are not used long-term — rebound IIH on withdrawal is well documented.\n\n💎 PEARL: Obese woman of reproductive age + headache + transient visual obscurations + papilloedema + raised CSF opening pressure with normal CSF composition and no mass = IIH. First-line: acetazolamide titrated up + weight loss (≥10% can be curative — IIHTT). Serial visual fields; visual loss is the major morbidity.",
   references:[{label:"Mollan et al. — IIH Consensus Guidelines (J Neurol Neurosurg Psychiatry 2018)", url:"https://jnnp.bmj.com/content/89/10/1088"}]},

  {section:"neurology", specialty:"Stroke", topic:"Lateral medullary (Wallenberg) syndrome",
   stem:"A 72-year-old man with AF (not anticoagulated, refused warfarin years ago) and hypertension presents with sudden-onset vertigo, dysarthria and ataxia. Examination 30 minutes after onset: ipsilateral (left) Horner syndrome (miosis, partial ptosis, ipsilateral facial anhidrosis), ipsilateral facial pain and temperature loss, contralateral (right) loss of pain and temperature sensation in the trunk and limbs, severe dysphagia and palatal weakness, ipsilateral cerebellar ataxia. Limb power and tone preserved bilaterally.\n\nWhich is the most likely diagnosis?",
   options:["Cerebellar haemorrhage","Lateral medullary (Wallenberg) syndrome","Anterior cerebral artery infarct","Lacunar stroke (pure motor)","Basilar migraine with aura"],
   correct:"B",
   explanation:"Lateral medullary syndrome (Wallenberg syndrome) — classic posterior circulation stroke caused by occlusion of the POSTERIOR INFERIOR CEREBELLAR ARTERY (PICA) or the vertebral artery. The lesion involves the lateral medulla, sparing the corticospinal tracts (which lie medially), so MOTOR POWER IS PRESERVED — a key teaching point. Posterior-circulation strokes are commonly MISSED in the ED — vertigo with dysarthria, ataxia, or cranial nerve signs should prompt urgent imaging. Investigations: MRI brain with DWI; CT/MR angiography to identify vertebral artery dissection (a not-uncommon cause in younger patients, with neck pain) or atherosclerotic disease. SLT assessment for dysphagia (high aspiration risk).\n\n(A) Cerebellar haemorrhage gives ataxia and headache but not the cranial nerve / sensory pattern.\n\n(C) ACA infarct: contralateral leg weakness, urinary incontinence — wholly different territory.\n\n(D) Lacunar stroke: pure motor or pure sensory (small, deep penetrating arteries) — not the brainstem syndrome here.\n\n(E) Migraine doesn't cause structural fixed deficits with crossed sensory pattern.\n\n💎 PEARL: Vertigo + dysphagia + dysarthria + ipsilateral Horner + ipsilateral facial pain/temperature loss + contralateral body pain/temperature loss + ataxia + PRESERVED limb power = lateral medullary (Wallenberg) syndrome — PICA territory. Posterior circulation strokes are commonly missed in ED.",
   references:[{label:"NICE NG128 — Stroke and TIA in over 16s (2019)", url:"https://www.nice.org.uk/guidance/ng128"},{label:"RCP National Clinical Guideline for Stroke (2023)", url:"https://www.strokeguideline.org/"}]},

  {section:"neurology", specialty:"Stroke", topic:"TIA — immediate management",
   stem:"A 70-year-old man presents 2 hours after a fully resolved 30-minute episode of right-sided arm and face weakness with expressive dysphasia. Examination is now normal. CT head: no haemorrhage, no acute infarct. ECG in the department: irregularly irregular, new atrial fibrillation. BP 168/92 mmHg. He is on no antiplatelet or anticoagulant. EGFR 65, no bleeding history.\n\nWhich is the most appropriate management?",
   options:["Aspirin 75 mg long-term only","Aspirin 300 mg STAT and daily for 14 days; specialist TIA clinic within 24 hours; carotid imaging; once intracerebral haemorrhage definitively excluded, anticoagulation (DOAC) for AF; address vascular risk factors","Clopidogrel monotherapy","Discharge with GP follow-up","Warfarin to INR 3.5"],
   correct:"B",
   explanation:"NICE NG128 TIA / acute stroke guidance. Risk of stroke after TIA: ~10% within 7 days if untreated; reduced to ~2% with aggressive secondary prevention (EXPRESS, SOS-TIA studies). STATIN, BP control, glycaemic control, lifestyle. DRIVING: cannot drive for at least 1 month following TIA (DVLA Group 1); inform DVLA.\n\n(A) Aspirin 75 mg alone misses the loading dose and the cardio-embolic source needing anticoagulation.\n\n(C) Clopidogrel monotherapy is for non-cardioembolic TIA — this patient has AF needing anticoagulation.\n\n(D) Discharge without specialist review breaches NG128 24-hour pathway and carries early stroke risk.\n\n(E) Warfarin INR target 3.5 is for mechanical valves; for non-valvular AF target is 2.0–3.0, and DOAC is preferred.\n\n💎 PEARL: TIA: aspirin 300 mg STAT and daily for 14 days; specialist clinic within 24 hours; carotid imaging. AF source → anticoagulate (DOAC) once intracerebral haemorrhage definitively excluded. Cannot drive for 1 month (DVLA Group 1). Stroke risk ~10% within 7 days untreated; ~2% with aggressive secondary prevention.",
   references:[{label:"NICE NG128 — Stroke and TIA in over 16s (2019)", url:"https://www.nice.org.uk/guidance/ng128"},{label:"RCP National Clinical Guideline for Stroke (2023)", url:"https://www.strokeguideline.org/"}]},

  {section:"neurology", specialty:"Toxicology", topic:"Opioid toxicity",
   stem:"A 28-year-old woman is brought in by ambulance, found unconscious in a public toilet. GCS 6 (E1 V1 M4). Pupils pinpoint bilaterally, RR 6, SpO₂ 88% on room air. Track marks on her arms; needle and empty wrap nearby. BP 110/68, HR 78, T 36.4. Glucose 5.2. Bloods (point-of-care): paracetamol pending; salicylate negative.\n\nWhich is the most appropriate immediate management?",
   options:["CT head before any treatment","IV/IM/intranasal naloxone titrated 0.4 mg every 2–3 minutes, with bag-valve-mask ventilation, observation ≥4–6 hours, and consider infusion","IV flumazenil","IV thiamine alone","Activated charcoal"],
   correct:"B",
   explanation:"OPIOID TOXIDROME: pinpoint pupils + bradypnoea + reduced consciousness — classic triad. Doses: 0.4 mg IV / IM / intranasal every 2–3 minutes; can give 0.04–0.1 mg in chronic users to minimise withdrawal. Total >2 mg without effect → reconsider diagnosis. CRITICAL CAVEAT: NALOXONE HAS A SHORTER HALF-LIFE (~30–90 min) than most opioids, especially LONG-ACTING ones (methadone 24–60 hr; fentanyl variable; sustained-release morphine; synthetic novel opioids). RE-SEDATION IS COMMON. Always observe ≥4–6 HOURS after symptom resolution; longer (24 hr) for methadone, fentanyl, or extended-release preparations. CONSIDER NALOXONE INFUSION (typically two-thirds of the effective bolus dose per hour) for prolonged toxicity.\n\n(A) CT head delays time-critical reversal; the diagnosis is clinical.\n\n(C) Flumazenil is for benzodiazepine reversal — generally AVOIDED in mixed overdose because of seizure risk (especially in chronic benzodiazepine users or with co-ingested epileptogenic drugs — TCAs, cocaine).\n\n(D) Thiamine is for Wernicke / alcohol — does not reverse opioid effect.\n\n(E) Charcoal does not reverse established CNS depression and risks aspiration in unprotected airway.\n\n💎 PEARL: Pinpoint pupils + bradypnoea + reduced consciousness = opioid toxidrome. IV/IM/intranasal naloxone 0.4 mg every 2–3 min (smaller doses 0.04–0.1 mg in chronic users to avoid withdrawal). Naloxone half-life is SHORTER than most opioids — observe ≥4–6 h; longer (24 h) for methadone, fentanyl, extended-release. Often need infusion.",
   references:[{label:"NICE CG52 — Drug misuse: opioid detoxification", url:"https://www.nice.org.uk/guidance/cg52"},{label:"TOXBASE — Opioid toxicity", url:"https://www.toxbase.org/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Miller Fisher syndrome",
   stem:"A 34-year-old man develops over 5 days a triad of bilateral ophthalmoplegia (impaired conjugate gaze in all directions), gait and limb ataxia, and areflexia, after a self-limiting gastroenteritis (Campylobacter culture positive on stool sample) 3 weeks ago. Limb power and sensation are preserved. CSF: protein 0.9 g/L, WCC 1/mm³ (albuminocytological dissociation). Anti-GQ1b ganglioside antibody is strongly positive.\n\nWhich is the most likely diagnosis?",
   options:["Myasthenia gravis","Multiple sclerosis","Miller Fisher syndrome","Botulism","Wernicke encephalopathy"],
   correct:"C",
   explanation:"Miller Fisher syndrome (MFS) — a Guillain-Barré variant characterised by the classic triad of OPHTHALMOPLEGIA + ATAXIA + AREFLEXIA, often preceded by Campylobacter jejuni gastroenteritis. ANTI-GQ1b antibodies positive in ~90%. MFS represents one end of a CONTINUOUS SPECTRUM with classical GBS — overlap syndromes exist, and progression to limb weakness is well described. CSF shows ALBUMINOCYTOLOGICAL DISSOCIATION (raised protein, normal cells) as in classical GBS. Treatment: IVIg (0.4 g/kg/day for 5 days) or plasma exchange — equivalent to GBS regimens. Most cases recover spontaneously over 8–12 weeks even without treatment, but immunotherapy speeds recovery. Monitor for progression (FVC, bulbar function).\n\n(A) Myasthenia: fluctuating fatigable weakness, normal reflexes, anti-AChR antibodies, decremental EMG response — different mechanism (post-synaptic NMJ).\n\n(B) MS: CNS demyelinating disease, typically with optic neuritis, sensory levels, normal CSF protein but oligoclonal bands; MRI brain shows white-matter lesions.\n\n(D) Botulism: descending flaccid paralysis with prominent autonomic features (dry mouth, fixed dilated pupils — a key distinguishing feature: MFS pupils typically REACT) — toxin-mediated pre-synaptic block.\n\n(E) Wernicke: ophthalmoplegia + ataxia + confusion in alcohol misuse / nutritional depletion — different context, no anti-GQ1b.\n\n💎 PEARL: Ophthalmoplegia + ataxia + areflexia after Campylobacter gastroenteritis + anti-GQ1b antibody + albuminocytological dissociation in CSF = Miller Fisher syndrome (a GBS variant). IVIg or plasma exchange. Most recover spontaneously over 8–12 weeks even without treatment.",
   references:[{label:"EAN/PNS GBS / Miller Fisher Guideline (2023)", url:"https://onlinelibrary.wiley.com/doi/10.1111/jns.12536"}]},

  {section:"neurology", specialty:"Neurology", topic:"Migraine — preventative therapy",
   stem:"A 32-year-old woman has had migraine without aura for 10 years. Over the last 6 months she has experienced 8 attacks per month with significant disability (midas score >21). Acute attacks are partially controlled by paracetamol and ibuprofen. She tried propranolol for 3 months and discontinued because of fatigue and exercise intolerance. She is otherwise well, has no contraindications.\n\nWhich is the most appropriate next step in preventative therapy?",
   options:["Continue current acute therapy alone","Topiramate or amitriptyline (next preventative agent after first failure)","Long-term oral codeine","High-dose oral prednisolone","Intranasal lidocaine"],
   correct:"B",
   explanation:"Migraine: NICE CG150 management. ACUTE THERAPY: triptan PLUS NSAID is more effective than either alone; add an antiemetic (metoclopramide, prochlorperazine — also helps gastric stasis-related drug absorption); aspirin 900 mg with antiemetic is an alternative for those without triptan tolerance. PREVENTATIVE THERAPY indicated for ≥4 attacks per month or significant disability. First-line oral preventatives (NICE NG150): PROPRANOLOL, TOPIRAMATE, AMITRIPTYLINE (off-label), CANDESARTAN (off-label). After failure of one, switch to another (this patient has tried propranolol — try topiramate or amitriptyline next). Botulinum toxin (PREEMPT protocol) for chronic migraine. Address medication overuse headache (analgesic >15 days/month, triptan/opioid >10 days/month).\n\n(A) 8 attacks/month with disability mandates preventative therapy escalation.\n\n(C) Long-term opioids cause medication overuse headache and dependence.\n\n(D) Long-term oral steroid has no role in migraine prevention.\n\n(E) Intranasal lidocaine is not standard therapy.\n\n💎 PEARL: Migraine prevention indicated for ≥4 attacks/month or significant disability. First-line oral: propranolol, topiramate, amitriptyline, candesartan. Switch on failure rather than add. Acute: triptan + NSAID + antiemetic beats single agent. CGRP mAbs for refractory chronic migraine.",
   references:[{label:"NICE CG150 — Headaches in over 12s (2012)", url:"https://www.nice.org.uk/guidance/cg150"},{label:"BASH Guidelines on Headaches (2022)", url:"https://bash.org.uk/guidelines/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Cluster headache",
   stem:"A 38-year-old man has had bouts of severe, strictly unilateral, retro-orbital and temporal pain lasting 60–90 minutes, occurring 2–3 times daily for the past 2 weeks (often waking him at the same time each night). Pain is associated with ipsilateral lacrimation, conjunctival injection, ptosis, miosis, nasal congestion and rhinorrhoea. He becomes restless and pacing during attacks. He has had similar 'bouts' lasting 6–8 weeks once or twice yearly for several years, separated by long pain-free periods.\n\nWhich is the most likely diagnosis?",
   options:["Migraine without aura","Cluster headache","Trigeminal neuralgia","Tension-type headache","Giant cell arteritis"],
   correct:"B",
   explanation:"CLUSTER HEADACHE: a trigeminal autonomic cephalalgia (TAC) — classic features of strictly UNILATERAL severe orbital / supraorbital / temporal pain lasting 15–180 MINUTES, with ipsilateral CRANIAL AUTONOMIC FEATURES. RESTLESSNESS / agitation during attacks (vs migraine where patients prefer dark and stillness). Triggers: alcohol during a cluster, glyceryl trinitrate, histamine. ACUTE \n\nTREATMENT: high-flow 100% OXYGEN via non-rebreather mask (12–15 L/min for 15 min — aborts ~70% of attacks); subcutaneous or nasal SUMATRIPTAN (oral triptans too slow). Avoid opioids. PREVENTATIVE THERAPY: VERAPAMIL first-line (titrate up to 240–960 mg/day; ECG monitoring required for AV block at higher doses); LITHIUM, TOPIRAMATE as alternatives.\n\n(A) Migraine: longer attacks (4–72 hr), nausea / photophobia / phonophobia, prefer dark and rest, no prominent autonomic features.\n\n(C) Trigeminal neuralgia: brief seconds-long electric-shock pains in trigeminal distribution triggered by light touch / chewing.\n\n(D) Tension-type: bilateral, band-like, pressing, no autonomic features, no severity.\n\n(E) GCA: older patients (>50), scalp tenderness, jaw claudication, raised ESR/CRP, vision threat — different demographic and pattern.\n\n💎 PEARL: Severe strictly UNILATERAL retro-orbital pain 15–180 min + ipsilateral autonomic features + RESTLESSNESS during attacks (vs migraine — patients want stillness) = cluster headache. Acute: high-flow 100% O₂ 12–15 L/min via NRB + SC sumatriptan. Prevention: verapamil first-line. Avoid opioids.",
   references:[{label:"NICE CG150 — Headaches in over 12s (2012)", url:"https://www.nice.org.uk/guidance/cg150"},{label:"BASH Cluster Headache Guidelines", url:"https://bash.org.uk/guidelines/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Trigeminal neuralgia — first-line therapy",
   stem:"A 65-year-old woman has 6 weeks of paroxysmal, severe, electric-shock-like pain in the right cheek and lower jaw (V2 and V3 distribution), each paroxysm lasting seconds, triggered reliably by chewing, brushing teeth, light touch, and wind on the face. Multiple attacks per day with refractory periods between. No sensory deficit on examination, no other cranial nerve abnormality.\n\nWhich is the most appropriate first-line treatment?",
   options:["Carbamazepine","Long-term opioid (tramadol or morphine)","Topical lidocaine cream","Sumatriptan","NSAID alone"],
   correct:"A",
   explanation:"CLASSIC (idiopathic) trigeminal neuralgia: paroxysmal, brief (seconds), severe, electric-shock or stabbing pain in trigeminal distribution (most commonly V2/V3, almost never V1 alone), triggered by INNOCUOUS stimuli — light touch, chewing, brushing teeth, wind, cold drinks. CARBAMAZEPINE 100 mg BD up-titrated is FIRST-LINE (number needed to treat 1.7 — among the most effective drug responses in neurology). OXCARBAZEPINE is better tolerated alternative. Refractory or intolerant cases: SURGICAL OPTIONS — MICROVASCULAR DECOMPRESSION (Janetta procedure — most effective long-term cure for vascular contact disease, ~85–90% pain-free at 1 year), radiofrequency thermocoagulation of the Gasserian ganglion, glycerol injection, gamma knife radiosurgery.\n\n(B) Long-term opioids are ineffective in neuropathic pain like TN and cause dependence — not first-line.\n\n(C) Topical lidocaine has minimal efficacy in TN (deep neural pathology, not surface).\n\n(D) Sumatriptan is for migraine — wrong mechanism.\n\n(E) NSAIDs are ineffective for neuropathic pain.\n\n💎 PEARL: Paroxysmal electric-shock pain in V2/V3 distribution triggered by INNOCUOUS stimuli (light touch, chewing, brushing teeth, wind) = classic trigeminal neuralgia. Carbamazepine first-line (NNT 1.7 — among the most effective drug responses in neurology). Microvascular decompression (Janetta) for refractory disease.",
   references:[{label:"NICE CG173 — Neuropathic pain in adults (2013, updated)", url:"https://www.nice.org.uk/guidance/cg173"},{label:"EFNS/EAN Trigeminal Neuralgia Guidelines (2019)", url:"https://onlinelibrary.wiley.com/doi/10.1111/ene.13950"}]},

  {section:"neurology", specialty:"Neurology", topic:"Dementia with Lewy bodies",
   stem:"A 72-year-old man has progressive cognitive decline over 3 years. His wife reports fluctuating attention and alertness day-to-day, recurrent vivid visual hallucinations of children playing in the garden (which he believes are real), and recently developed mild parkinsonism (rigidity, shuffling gait, slow movements; no resting tremor). For many years before cognitive symptoms began, he has had vivid dreams during which he shouts and acts out (rem sleep behaviour disorder — once injured his wife while dreaming). When given haloperidol previously for agitation, he developed profound rigidity and worsening confusion lasting days. DaTscan: reduced striatal dopamine transporter uptake bilaterally.\n\nWhich is the most likely diagnosis?",
   options:["Alzheimer disease","Dementia with Lewy bodies","Vascular dementia","Frontotemporal dementia","Creutzfeldt-Jakob disease"],
   correct:"B",
   explanation:"Dementia with Lewy bodies (DLB): the second most common neurodegenerative dementia. SUPPORTIVE features: severe NEUROLEPTIC SENSITIVITY (this patient — typical antipsychotics can cause life-threatening rigidity / NMS-like reaction), autonomic dysfunction (orthostatic hypotension, constipation, urinary), repeated falls, syncope, transient unexplained loss of consciousness, hyposmia, depression, delusions. INDICATIVE BIOMARKERS: REDUCED DOPAMINE TRANSPORTER UPTAKE on DaTscan (this patient); reduced ¹²³I-MIBG cardiac uptake; polysomnography-confirmed REM sleep without atonia. \n\nMANAGEMENT: CHOLINESTERASE INHIBITORS (rivastigmine, donepezil) are FIRST-LINE — improve cognition AND attention/hallucinations effectively (sometimes more than in Alzheimer's). LEVODOPA cautiously for parkinsonism — may worsen psychosis (lower threshold than in Parkinson's disease).\n\n(A) Alzheimer's: predominant memory loss without prominent fluctuation, hallucinations or parkinsonism early; DaTscan normal; CSF amyloid/tau biomarkers diagnostic.\n\n(C) Vascular dementia: stepwise progression, focal neurological signs, vascular risk factors, MRI white-matter / lacunar disease.\n\n(D) FTD: behavioural / personality change or progressive aphasia, frontal atrophy, often younger onset (50s–60s).\n\n(E) CJD: rapid progression over months to death, myoclonus, ataxia, EEG periodic complexes, MRI cortical ribboning, CSF 14-3-3 / RT-QuIC.\n\n💎 PEARL: Fluctuating cognition + recurrent vivid visual hallucinations + spontaneous parkinsonism + REM sleep behaviour disorder = dementia with Lewy bodies. SEVERE NEUROLEPTIC SENSITIVITY — typical antipsychotics can cause life-threatening NMS-like reactions. Cholinesterase inhibitors first-line. DaTscan: reduced uptake.",
   references:[{label:"NICE NG97 — Dementia (2018)", url:"https://www.nice.org.uk/guidance/ng97"}]},

  {section:"neurology", specialty:"Neurology", topic:"Parkinson disease — initial therapy",
   stem:"A 65-year-old man is newly diagnosed with idiopathic Parkinson disease (PD). Features: asymmetric resting tremor (right hand, 4–6 Hz pill-rolling), bradykinesia (impaired finger-tapping, micrographia), and rigidity (cogwheeling). DaTscan confirms presynaptic dopaminergic deficit. Updrs motor score 28. He is a draughtsman whose work is significantly affected by tremor and slowness. He is otherwise well, on no medications.\n\nWhich is the most appropriate first-line therapy?",
   options:["Levodopa-carbidopa (or levodopa-benserazide) titrated to control symptoms","Anticholinergic monotherapy","Long-term oral prednisolone","Amantadine alone","Withhold treatment until severe disability"],
   correct:"A",
   explanation:"PARKINSON'S DISEASE management — NICE NG71. CARDINAL DIAGNOSTIC FEATURES: bradykinesia plus at least one of resting tremor, rigidity, or postural instability — supported by asymmetric onset, response to levodopa, DaTscan. WHEN MOTOR SYMPTOMS AFFECT QUALITY OF LIFE, first-line is LEVODOPA combined with peripheral DOPA-decarboxylase inhibitor (carbidopa or benserazide) — the MOST EFFECTIVE for improving motor function and ADLs (PDMED, LEAP, ELLDOPA trials). Side effects: nausea (mitigated by domperidone — caution QT), orthostatic hypotension, dyskinesias and motor fluctuations after years of treatment ('wearing off', 'on-off'). Adjunctive: catechol-O-methyltransferase (COMT) inhibitors (entacapone, opicapone) for wearing-off; amantadine for dyskinesias.\n\n(B) Anticholinergics (trihexyphenidyl) are mainly used in young patients with tremor-predominant disease — limited efficacy on bradykinesia, side effects (dry mouth, urinary retention, cognitive impairment) limit use, especially in older patients.\n\n(C) Steroids have no role in idiopathic PD.\n\n(D) Amantadine alone has weak antiparkinsonian effect; mainly used as adjunct for dyskinesias.\n\n(E) Withholding treatment in symptomatic PD denies effective therapy and there is no evidence early levodopa accelerates disease progression (LEAP trial).\n\n💎 PEARL: Idiopathic Parkinson's affecting quality of life: levodopa + dopa-decarboxylase inhibitor (carbidopa or benserazide) is most effective for motor symptoms (PDMED, LEAP, ELLDOPA). Side effects: nausea (domperidone — caution QT), dyskinesias and motor fluctuations after years. DaTscan confirms presynaptic dopaminergic deficit.",
   references:[{label:"NICE NG71 — Parkinson's disease in adults (2017)", url:"https://www.nice.org.uk/guidance/ng71"}]},

  {section:"neurology", specialty:"Neurology", topic:"Amyotrophic lateral sclerosis (ALS)",
   stem:"A 58-year-old man has 9 months of progressive limb weakness, with both upper motor neurone signs (brisk reflexes, spasticity, upgoing plantars) and lower motor neurone signs (wasting, fasciculations) in three regions (bulbar, cervical, lumbar). He has tongue fasciculations, dysarthria with nasal speech, and is starting to choke on liquids. Sensation is intact throughout; sphincters preserved; ocular movements full. CSF normal.\n\nWhich is the most likely diagnosis?",
   options:["Multiple sclerosis","Amyotrophic lateral sclerosis (ALS / MND)","Polymyositis","Cervical spondylotic myelopathy","Guillain-Barré syndrome"],
   correct:"B",
   explanation:"MOTOR NEURONE DISEASE (MND) — ALS is the most common form. DIAGNOSIS is clinical, supported by EMG (denervation in multiple regions, fasciculations, fibrillations) and exclusion of mimics by imaging and CSF. PROGNOSIS: median survival 2–4 years from symptom onset; bulbar-onset disease has worse prognosis. MANAGEMENT — multidisciplinary specialist MND clinic: RILUZOLE (50 mg BD, glutamate-release inhibitor) — modest survival benefit ~3 months; EDARAVONE (free-radical scavenger) in selected eligible patients (early disease, preserved respiratory function); TOFERSEN (antisense oligonucleotide) for SOD1-mutation ALS. GASTROSTOMY (PEG / RIG) for swallowing failure / weight loss / unsafe oral intake. Cough assist devices, secretion management.\n\n(A) MS: CNS demyelination — UMN signs only, sensory involvement, optic neuritis, multifocal CNS lesions on MRI.\n\n(C) Polymyositis: proximal muscle weakness, raised CK, no UMN signs, intact reflexes (or reduced), normal sensation.\n\n(D) Cervical myelopathy: UMN below the lesion + LMN at the lesion level only, sensory involvement (NOT preserved), MRI shows cord compression.\n\n(E) GBS: ascending LMN weakness with areflexia, sensory involvement, albuminocytological dissociation in CSF — different timecourse and pattern.\n\n💎 PEARL: UMN + LMN signs in ≥3 regions + intact sensation + spared sphincters + spared eye movements = MND/ALS. Riluzole gives modest survival benefit (~3 months); edaravone in selected early cases. NIV + gastrostomy + multidisciplinary specialist clinic. Median survival 2–4 years; bulbar onset has worse prognosis.",
   references:[{label:"NICE NG42 — Motor neurone disease (2016)", url:"https://www.nice.org.uk/guidance/ng42"}]},

  {section:"neurology", specialty:"Neurology", topic:"Anterior spinal artery syndrome",
   stem:"A 65-year-old man with severe peripheral vascular disease and a recent open AAA repair (intra-operative hypotension) presents post-operatively with sudden-onset complete paraplegia, loss of pain and temperature sensation below the T6 dermatome, but full preservation of light touch, vibration sense and joint position sense below the lesion. Acute urinary retention.\n\nWhich is the most likely diagnosis?",
   options:["Anterior spinal artery syndrome","Brown-Séquard syndrome","Posterior cord syndrome","Central cord syndrome","Cauda equina syndrome"],
   correct:"A",
   explanation:"SPINAL CORD VASCULAR ANATOMY: the anterior spinal artery supplies the ANTERIOR TWO-THIRDS of the cord (corticospinal tracts, spinothalamic tracts, autonomic columns); the paired posterior spinal arteries supply the POSTERIOR ONE-THIRD (dorsal columns). Autonomic dysfunction (bladder / bowel / sphincter). The mid-thoracic region (T4–T8 watershed zone) is particularly vulnerable. \n\nINVESTIGATION: urgent MRI cord with DWI (anterior cord T2 hyperintensity, 'pencil-like' lesion), CT/MR angio thoracic aorta to exclude dissection, vascular workup. \n\nMANAGEMENT: BP and CSF DRAINAGE protocols may improve perfusion if recognised early in postoperative aortic surgery; otherwise SUPPORTIVE — rehabilitation, bladder / bowel management, VTE prophylaxis, pressure care.\n\n(B) BROWN-SÉQUARD (hemicord lesion — usually penetrating trauma, MS, tumour): IPSILATERAL motor and dorsal column loss + CONTRALATERAL spinothalamic loss below the lesion.\n\n(C) POSTERIOR CORD syndrome (rare): isolated loss of dorsal columns (vibration, proprioception, light touch) — sensory ataxia; motor and pain/temperature preserved.\n\n(D) CENTRAL CORD syndrome: typically older patients with hyperextension injury and pre-existing cervical spondylosis; UPPER LIMB > lower limb weakness with variable sacral sparing of sensation, classic 'man-in-a-barrel' pattern.\n\n(E) CAUDA EQUINA: lumbar root compression — bilateral leg pain / numbness / weakness, saddle anaesthesia, bladder / bowel dysfunction; LMN signs only (cord ends at L1).\n\n💎 PEARL: Sudden paraplegia + loss of pain/temperature below lesion + PRESERVED dorsal column sensation (light touch, vibration, proprioception) after AAA repair / aortic dissection / hypotension = anterior spinal artery infarct. Watershed zone T4–T8 most vulnerable. CSF drainage and BP support may help if recognised early postoperatively.",
   references:[{label:"ABN Spinal Cord Disease Guidance", url:"https://www.theabn.org/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Carpal tunnel syndrome",
   stem:"A 50-year-old woman has 4 months of nocturnal paraesthesia in the right thumb, index and middle fingers (waking her at night, relieved by shaking the hand), with progressive weakness of thumb opposition. Examination: phalen sign positive at 30 seconds, tinel sign positive over the wrist, mild thenar wasting. She is otherwise well; thyroid function and HbA1c normal.\n\nWhich is the most likely diagnosis?",
   options:["Carpal tunnel syndrome","Ulnar nerve entrapment at the elbow","C6 cervical radiculopathy","Multiple sclerosis","Fibromyalgia"],
   correct:"A",
   explanation:"CARPAL TUNNEL SYNDROME: the most common entrapment neuropathy — compression of the MEDIAN nerve as it passes through the carpal tunnel beneath the flexor retinaculum at the wrist. MANAGEMENT LADDER: NICE-recommended (1) NOCTURNAL WRIST SPLINT in neutral position + activity modification — first-line;\n(2) CORTICOSTEROID INJECTION into the carpal tunnel for persistent symptoms (effective short-term, ~70% relief at 6 weeks but recurrence common);\n(3) SURGICAL DECOMPRESSION (open or endoscopic carpal tunnel release) for severe disease, refractory symptoms, OR motor involvement (thenar wasting — operate before more atrophy occurs); generally good outcomes. Treat any underlying cause (thyroid, diabetes, weight).\n\n(B) Ulnar nerve at elbow (cubital tunnel): paraesthesia in little finger and ULNar half of ring finger; weakness of intrinsic hand muscles (interossei, hypothenar) — different distribution.\n\n(C) C6 radiculopathy: thumb and index finger paraesthesia, biceps reflex affected, neck pain, MRI shows nerve root compression.\n\n(D) MS: CNS demyelinating disease — central UMN signs, multifocal, normal NCS at the periphery.\n\n(E) Fibromyalgia: widespread pain, normal exam and NCS.\n\n💎 PEARL: Nocturnal paraesthesia in median distribution (thumb/index/middle) + Phalen+ + Tinel+ + thenar wasting = carpal tunnel syndrome. Confirm with NCS (prolonged median latency at wrist, normal above). Splint first-line; steroid injection second; surgical decompression for severe disease, refractory symptoms or motor involvement (operate before more atrophy).",
   references:[{label:"NICE CKS — Carpal tunnel syndrome", url:"https://cks.nice.org.uk/topics/carpal-tunnel-syndrome/"}]},

  {section:"neurology", specialty:"Ophthalmology", topic:"Optic neuritis with high-risk MRI",
   stem:"A 28-year-old woman presents with 4 days of progressive painful loss of vision in her left eye, worse on eye movement (retrobulbar pain), with reduced colour vision (red desaturation). Visual acuity 6/36 left (corrected), 6/6 right. Relative afferent pupillary defect (rapd) on the left. Fundoscopy: optic disc appears normal (retrobulbar neuritis — disc swelling visible in only ~1/3). Aquaporin-4 and MOG antibodies pending.\n\nWhich is the most appropriate management?",
   options:["IV methylprednisolone 1 g daily for 3 days, urgent neurology referral for MS workup, counselling about disease-modifying therapy","Oral prednisolone alone (no IV pulse)","Empirical broad-spectrum antibiotics","Intravitreal anti-vegf injection","Acetazolamide"],
   correct:"A",
   explanation:"OPTIC NEURITIS — typical features: SUBACUTE MONOCULAR visual loss (over hours to days), PAIN ON EYE MOVEMENT, RAPD, dyschromatopsia (red desaturation), central scotoma. The OPTIC NEURITIS TREATMENT TRIAL (ONTT, Beck 1992): IV methylprednisolone (1 g daily for 3 days, optionally followed by oral taper) SPEEDS visual recovery but does NOT affect FINAL visual outcome at 6 months / 1 year; oral prednisolone ALONE (low dose) increased recurrence rates and was harmful. MRI BRAIN with abnormal white-matter lesions identifies HIGH RISK of conversion to MS — ~50% at 5 years, ~75% at 15 years (CHAMPS, ETOMS trials). These have DIFFERENT TREATMENT.\n\n(B) Oral steroid alone is inferior and harmful (increased recurrence per ONTT).\n\n(C) Antibiotics treat infection — not autoimmune demyelination.\n\n(D) Anti-VEGF treats neovascular AMD / diabetic macular oedema — wrong pathology.\n\n(E) Acetazolamide is for IIH — does not treat optic neuritis.\n\n💎 PEARL: Painful monocular vision loss + RAPD + dyschromatopsia (red desaturation) = optic neuritis. IV methylprednisolone 1 g × 3 days SPEEDS recovery but doesn't change FINAL outcome (ONTT). Oral prednisolone alone INCREASES recurrence — avoid. Abnormal MRI = ~50% MS at 5 years (CHAMPS) — needs DMT discussion.",
   references:[{label:"NICE NG220 — MS in adults (covers ON)", url:"https://www.nice.org.uk/guidance/ng220"},{label:"ABN MS DMT Guidance", url:"https://www.theabn.org/page/MS_DMT_guidelines"}]},

  {section:"neurology", specialty:"Neurology", topic:"Neuromyelitis optica spectrum disorder",
   stem:"A 32-year-old woman presents with concurrent severe optic neuritis (visual acuity 6/60 right, 6/24 left — bilateral, severe) and acute transverse myelitis (paraplegia 0/5 power below T6, sensory level T6, urinary retention, bilateral upgoing plantars). Anti-AQUAPORIN-4 (AQP4-IgG) antibody strongly positive.\n\nWhich is the most likely diagnosis?",
   options:["Multiple sclerosis","Neuromyelitis optica spectrum disorder (nmosd)","Acute disseminated encephalomyelitis","Neurosarcoidosis","Subacute combined degeneration of the cord (B12 deficiency)"],
   correct:"B",
   explanation:"NEUROMYELITIS OPTICA SPECTRUM DISORDER (NMOSD): a CNS autoimmune disease distinct from MS, with the AQP4 water channel on astrocyte foot processes as the autoantigen (vs MS where the target is myelin / oligodendrocytes). CSF: pleocytosis often more marked than MS; oligoclonal bands often ABSENT (~30% present, vs >90% in MS — a useful distinguishing feature). MANAGEMENT — ACUTE attack: IV methylprednisolone 1 g/day for 3–5 days; if poor response, PLASMA EXCHANGE (PLEX) — particularly important for severe attacks (plasmapheresis trials show benefit).\n\n(A) MS: shorter cord lesions (<3 segments), positive oligoclonal bands, less severe ON, older clinical course; AQP4 negative.\n\n(C) ADEM: typically MONOPHASIC, often post-infectious, paediatric > adult, encephalopathy, large confluent lesions on MRI.\n\n(D) Neurosarcoidosis: cranial neuropathies (especially CN VII), meningeal disease, hypothalamic-pituitary involvement, raised serum / CSF ACE; biopsy granulomas.\n\n(E) B12 / SCDC: progressive sensory ataxia, dorsal column signs, megaloblastic anaemia, low B12; no AQP4 antibodies.\n\n💎 PEARL: Bilateral severe optic neuritis + LONGITUDINALLY EXTENSIVE transverse myelitis (≥3 vertebral segments) + AQP4-IgG positive + minimal brain lesions + often NEGATIVE oligoclonal bands = NMOSD. Acute: IV methylprednisolone, plasma exchange for poor response. Maintenance: rituximab/eculizumab/inebilizumab/satralizumab. NOT MS DMTs (some worsen NMOSD).",
   references:[{label:"Wingerchuk et al. — International NMOSD Diagnostic Criteria (2015)", url:"https://n.neurology.org/content/85/2/177"},{label:"UK NMO Specialist Service", url:"https://www.nmouk.nhs.uk/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Anti-NMDA receptor encephalitis",
   stem:"A 28-year-old woman presents with subacute psychiatric symptoms (acute psychosis, paranoia, agitation, behavioural change) over 4 weeks, followed by new-onset focal seizures, prominent orofacial dyskinesias (chewing, lip-smacking), autonomic instability (BP and HR lability) and reduced consciousness with intermittent hypoventilation. Initial CSF: lymphocytic pleocytosis (WCC 25), raised protein 0.8 g/L, normal glucose. Serum and CSF anti-nmda receptor (NR1 subunit) antibodies strongly positive. Pelvic ultrasound: 6 cm right ovarian teratoma.\n\nWhich is the most likely diagnosis?",
   options:["Primary schizophrenia","Anti-nmda receptor encephalitis","Viral encephalitis","Neuroleptic malignant syndrome","Catatonia (primary)"],
   correct:"B",
   explanation:"ANTI-NMDA RECEPTOR ENCEPHALITIS: the most common autoimmune encephalitis. \n\nINVESTIGATIONS: CSF — lymphocytosis, raised protein, sometimes oligoclonal bands; MRI often near-normal or subtle medial temporal / cingulate changes; EEG — characteristic 'EXTREME DELTA BRUSH' pattern (~30%) is highly suggestive; ANTIBODY against NMDA receptor NR1 subunit — MORE SENSITIVE IN CSF than serum (always test CSF); search for underlying tumour with pelvic / scrotal imaging. \n\nTREATMENT: FIRST-LINE immunotherapy — high-dose IV methylprednisolone + IVIg OR plasma exchange; SECOND-LINE for refractory disease — RITUXIMAB and / or CYCLOPHOSPHAMIDE; tertiary — bortezomib, tocilizumab. ICU care frequently needed for autonomic instability, hypoventilation, status epilepticus, dyskinesias.\n\n(A) Schizophrenia: gradual onset, no autonomic instability, no movement disorder, no CSF abnormality, no antibody — primary psychiatric diagnosis is one of exclusion when organic features (seizures, autonomic) are present.\n\n(C) Viral encephalitis: HSV gives temporal lobe MRI changes and HSV PCR positive; this patient is PCR negative.\n\n(D) NMS: precipitated by neuroleptic exposure, fever, rigidity, raised CK; absent here as initial presentation.\n\n(E) Catatonia: mutism, posturing, waxy flexibility — can OCCUR in NMDAR encephalitis but is a syndrome not the underlying cause.\n\n💎 PEARL: Young woman + subacute psychosis + seizures + orofacial dyskinesias + autonomic instability + reduced consciousness + 'extreme delta brush' on EEG = anti-NMDA receptor encephalitis. Test CSF (more sensitive than serum). Search for ovarian teratoma. First-line: steroids + IVIg or plasma exchange; rituximab/cyclophosphamide for refractory.",
   references:[{label:"ABN/BIA Encephalitis Guidelines (2012)", url:"https://www.encephalitis.info/healthcare-professionals"}]},

  {section:"neurology", specialty:"Neurology", topic:"Brain stem death testing",
   stem:"A 45-year-old man is on the neurocritical care unit 5 days after a devastating intracerebral haemorrhage. He is mechanically ventilated, deeply unconscious off all sedation for 24 hours, with no spontaneous movements and no brainstem reflexes on initial examination. Core temperature 36.8°C, map maintained on minimal noradrenaline, no neuromuscular blockade, recent biochemistry / endocrine results within permissible limits. The team are preparing formal brain stem death testing.\n\nWhich is the most appropriate process?",
   options:["A single doctor's assessment is sufficient","Two senior, appropriately experienced doctors (at least one consultant; neither involved in transplant) perform two complete sets of tests on separate occasions","Cerebral perfusion imaging alone is sufficient","Decision is made by the family alone","One complete set of tests by two doctors is sufficient"],
   correct:"B",
   explanation:"UK ACADEMY OF MEDICAL ROYAL COLLEGES (AoMRC) Code of Practice for the Diagnosis and Confirmation of Death — brain stem death testing requires: (1) the CAUSE of irreversible brain damage is established and is consistent with the diagnosis;\n(2) REVERSIBLE causes are excluded — sedatives, neuromuscular blocking drugs (use peripheral nerve stimulator), HYPOTHERMIA (core <34°C), severe metabolic / endocrine disturbance (Na, K, glucose, Mg, phosphate, thyroid, cortisol, urea — typically required to be within permissible limits), HYPOTENSION (typically MAP ≥60), HYPOXAEMIA / HYPERCAPNIA outside permissible limits. (4) TWO COMPLETE SETS of tests on SEPARATE OCCASIONS (typically several hours apart).\n\n(A) Single-doctor assessment is unsafe and not permitted by AoMRC.\n\n(C) Imaging alone is not sufficient — clinical bedside testing is the standard in the UK; ancillary tests are supportive when bedside is impossible.\n\n(D) Brain death is a clinical / legal definition — family input is important for ongoing care and donation but they don't make the diagnosis.\n\n(E) ONE set is insufficient — TWO complete sets are required.\n\n💎 PEARL: Brain stem death testing (UK AoMRC): TWO senior, appropriately experienced doctors (≥1 consultant; neither involved in transplantation) perform TWO complete sets of tests on separate occasions. Exclude reversible causes — sedation, paralysis, hypothermia <34°C, severe metabolic/endocrine disturbance, hypotension.",
   references:[{label:"Academy of Medical Royal Colleges — Code of Practice for Diagnosis and Confirmation of Death (2008, updated 2024)", url:"https://www.aomrc.org.uk/reports-guidance/ukdec-reports-and-guidance/code-practice-diagnosis-confirmation-death/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Functional neurological disorder",
   stem:"A 28-year-old woman presents with new-onset left-sided weakness and recurrent shaking episodes. Examination: positive hoover sign (give-way weakness in left hip extension that improves significantly with contralateral hip flexion against resistance — a positive 'rule-in' clinical sign for FND); shaking episodes are characterised by variable frequency, side-to-side head movement (rather than unilateral tonic-clonic), persistent eye closure during 'unconsciousness' (the patient resists eye opening), pelvic thrusting, and post-event recall with intact awareness. Routine bloods normal.\n\nWhich is the most likely diagnosis?",
   options:["Diagnosis of exclusion only — extensive further workup needed","Functional neurological disorder","Myalgic encephalomyelitis / chronic fatigue syndrome","Conversion disorder requiring antipsychotics","Malingering"],
   correct:"B",
   explanation:"FUNCTIONAL NEUROLOGICAL DISORDER (FND) is now defined as a POSITIVE CLINICAL DIAGNOSIS based on RULE-IN signs — NOT a diagnosis of exclusion. DSM-5 / ICD-11: FND requires neurological symptoms incompatible with recognised neurological disease, demonstrated by POSITIVE EXAMINATION FINDINGS. MANAGEMENT — TRANSPARENT, VALIDATING DIAGNOSIS is itself THERAPEUTIC: explain that the nervous system is structurally healthy but coordination / signalling is disrupted ('software not hardware'); avoid implying the symptoms are 'made up' or 'all in the mind' — they are real and disabling. SPECIALIST FND units (CODES, Stone et al.) significantly improve outcomes.\n\n(A) The diagnostic paradigm has shifted — FND is a POSITIVE diagnosis, not exclusion.\n\n(C) ME/CFS: post-exertional malaise, fatigue, cognitive dysfunction, autonomic features — different syndrome (though overlap exists).\n\n(D) 'Conversion disorder' is the older term; treatment is NOT antipsychotics — those harm.\n\n(E) Malingering implies deliberate fabrication for secondary gain — distinct from FND, which is involuntary and the patient is not feigning.\n\n💎 PEARL: FND is now a POSITIVE CLINICAL DIAGNOSIS based on rule-in signs (Hoover sign, tremor entrainment) — NOT a diagnosis of exclusion. Transparent validating diagnosis is itself therapeutic ('software not hardware'). Specialist FND units improve outcomes (CODES). Avoid implying 'made up' or 'all in the mind'.",
   references:[{label:"ABN Functional Neurological Disorder Guidance", url:"https://www.theabn.org/"},{label:"FND Society Resources", url:"https://fndsociety.org/"}]},

  {section:"neurology", specialty:"Neurology", topic:"Cerebral venous sinus thrombosis",
   stem:"A 32-year-old woman on the combined oral contraceptive pill, recently dehydrated after gastroenteritis, presents with a 5-day history of progressive worsening headache, nausea, blurred vision, two focal motor seizures involving the right arm, and new right-sided weakness. CT head: small left frontal lobar haemorrhage with surrounding oedema; 'cord sign' in the superior sagittal sinus. CT venogram: filling defect in the superior sagittal sinus extending into the right transverse sinus.\n\nWhich is the most appropriate management?",

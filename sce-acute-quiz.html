  {section:"critical_care", specialty:"Critical Care", topic:"ARDS — Berlin definition",
   stem:"A 50-year-old woman is admitted with severe community-acquired pneumonia (CURB-65 4, septic shock requiring noradrenaline). Over 36 hours she becomes increasingly tachypnoeic and hypoxic. SpO₂ 86% on 15 L non-rebreather (FiO₂ ~0.85), now requiring intubation. Post-intubation ABG on FiO₂ 0.6, peep 8: PaO₂ 8.4 kPa (PaO₂/FiO₂ ratio = 14 kPa or 105 mmHg — moderate-severe range). CXR: bilateral diffuse patchy infiltrates ('white-out'). Bedside echo: normal LV systolic function (EF 60%), no diastolic dysfunction, no significant valvular disease, IVC slim — no evidence of cardiogenic origin. No pneumothorax.\n\nWhich is the most likely diagnosis?",
   options:["Acute decompensated heart failure","Massive pulmonary embolism","Acute respiratory distress syndrome (ards)","Tension pneumothorax","Diffuse alveolar haemorrhage"],
   correct:"C",
   explanation:"ACUTE RESPIRATORY DISTRESS SYNDROME (ARDS): a syndrome of acute hypoxaemic respiratory failure due to NON-CARDIOGENIC PULMONARY OEDEMA caused by INCREASED ALVEOLAR-CAPILLARY PERMEABILITY. MANAGEMENT — supportive; treat underlying cause (this patient — pneumonia, source identification, antibiotics): (1) LUNG-PROTECTIVE VENTILATION — landmark ARMA / ARDSNet TRIAL 2000 (NEJM): low tidal volume 6 mL/kg PREDICTED body weight (NOT actual; based on height to estimate lean lung volume — KEY teaching point), plateau pressure ≤30 cmH₂O, and tolerating permissive hypercapnia → REDUCED MORTALITY (31% vs 40% with traditional 12 mL/kg); paradigm-shifting result.\n\n(A) Acute heart failure — would have echo evidence (LV dysfunction, raised LA pressure, dilated IVC, B-lines on ultrasound), often elevated JVP, raised BNP, response to diuretics; not seen here.\n\n(B) Massive PE: would have RV strain on echo (dilated RV, septal flattening, McConnell sign), elevated D-dimer / troponin, CT-PA diagnostic; unlikely cause of bilateral diffuse infiltrate.\n\n(D) Tension pneumothorax: tracheal deviation, hyperresonance, absent breath sounds unilaterally, CXR shows pneumothorax (excluded).\n\n(E) Diffuse alveolar haemorrhage: haemoptysis, anaemia, vasculitis features, BAL shows haemosiderin-laden macrophages.\n\n💎 PEARL: ARDS Berlin definition: acute (≤1 week) + bilateral infiltrates + NOT cardiac + PaO₂/FiO₂ ≤40 kPa (300 mmHg) on PEEP ≥5. Severity: mild (200–300), moderate (100–200), severe (<100). Lung-protective ventilation: TV 6 mL/kg PREDICTED body weight, plateau ≤30, permissive hypercapnia (ARMA). Prone positioning for moderate-severe (PROSEVA). Conservative fluid balance.",
   references:[{label:"Berlin Definition of ARDS (JAMA 2012, updated 2023 'Global')", url:"https://www.atsjournals.org/doi/10.1164/rccm.202303-0558WS"},{label:"Faculty of Intensive Care Medicine ARDS Guidelines", url:"https://www.ficm.ac.uk/standardssafetyguidelinesstandards"}]},

  {section:"critical_care", specialty:"Critical Care", topic:"Adrenal crisis on chronic steroids — emergency stress dose",
   stem:"A 70-year-old man on long-term oral prednisolone 7.5 mg daily for polymyalgia rheumatica (started 2 years ago, stable maintenance dose) is admitted with sepsis from cellulitis of his right leg. T 38.8°C, BP 86/50 (despite 2 L crystalloid), HR 130, lactate 3.2, glucose 4.0 (low normal), Na 128 (low), K 5.6 (high). Initial IV antibiotics started.\n\nWhich is the most appropriate next step regarding glucocorticoid management?",
   options:["Continue usual oral prednisolone dose only — no adjustment needed","Stop steroids and treat with vasopressors only","IV hydrocortisone 100 mg STAT then 200 mg/24 h infusion (or 50 mg QDS), in addition to managing the underlying sepsis","Switch to oral dexamethasone for stronger effect","Add fludrocortisone IV"],
   correct:"C",
   explanation:"ADRENAL CRISIS in CHRONIC GLUCOCORTICOID USERS: a life-threatening emergency caused by inability to mount an adequate cortisol response to physiological stress (sepsis, surgery, trauma, burns, severe illness) due to TERTIARY ADRENAL INSUFFICIENCY (suppressed HPA axis from exogenous glucocorticoid feedback). MANAGEMENT — TIME-CRITICAL — DO NOT DELAY for confirmatory testing (the cosyntropin / Synacthen test in chronic steroid users is unreliable and inappropriate in acute crisis): (1) IV HYDROCORTISONE 100 mg STAT (do not delay) — life-saving; PLUS (2) HYDROCORTISONE 200 mg/24 hours IV — by continuous infusion or as 50 mg QDS bolus — provides physiological-stress equivalent (~10x basal cortisol).\n\n(A) Continuing usual dose insufficient — physiological cortisol output increases 5-10x in stress; usual maintenance can't meet demand; patient will continue to deteriorate.\n\n(B) Stopping steroids in adrenal crisis is DEATH SENTENCE — opposite of indicated treatment; vasopressors won't work without adequate cortisol.\n\n(D) Oral dexamethasone — bioavailability concerns in shock / vomiting / gut hypoperfusion; dexamethasone has NO mineralocorticoid effect (unlike hydrocortisone) — doesn't address mineralocorticoid deficiency contributing to electrolyte / haemodynamic disturbance; not first-line for adrenal crisis.\n\n(E) Fludrocortisone unnecessary at high-dose hydrocortisone (which has sufficient mineralocorticoid activity) and not available IV.\n\n💎 PEARL: Long-term steroid use + acute illness + hypotension despite fluids = ADRENAL CRISIS. IV HYDROCORTISONE 100 mg STAT then 200 mg/24 h infusion (or 50 mg QDS). Synacthen test UNRELIABLE in chronic steroid users (atrophic adrenals). Treat empirically — don't delay for tests. Patients need a steroid card and 'sick day rules' (double dose during illness).",
   references:[{label:"Society for Endocrinology Emergency Endocrine Guidance — Adrenal Crisis", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Septic shock — first-hour bundle",
   stem:"A 64-year-old man is admitted with 24 hours of fever, confusion and rigors. BP 88/52, HR 122, RR 28, SpO₂ 92% on air, lactate 4.6 mmol/L. NEWS2 12. Source is not yet identified. Which set of actions should be completed within the first hour?",
   options:["Lactate, blood cultures, broad-spectrum IV antibiotics, IV crystalloid 30 mL/kg, vasopressors if map <65 after fluid, urine output monitoring, oxygen to SpO₂ ≥94%","Routine paracetamol and observation; CT abdomen first to find a source","IV vasopressors before any fluid resuscitation","Hold antibiotics until blood culture results are available","Crystalloid 10 mL/kg only and reassess at 6 hours"],
   correct:"A",
   explanation:"Surviving Sepsis Campaign 1-hour bundle / UK Sepsis Six in suspected septic shock: measure lactate; take blood cultures BEFORE antibiotics; give broad-spectrum IV antibiotics within 1 hour; 30 mL/kg IV crystalloid for hypotension or lactate ≥4; commence vasopressor (noradrenaline first-line, SOAP-II) if MAP remains <65 after fluids; monitor urine output; give oxygen to maintain SpO₂ ≥94% (88–92% in COPD). Time-to-antibiotics is the strongest modifiable mortality factor.\n\n(B) Delay to identify the source via imaging risks deterioration; antibiotics and fluids run concurrently with workup.\n\n(C) Vasopressors should normally follow adequate fluid resuscitation in distributive shock; pre-emptive vasopressor without fluid worsens tissue perfusion.\n\n(D) Antibiotics must NOT be held for cultures — give within 1 hour of suspicion; cultures still inform de-escalation hours later.\n\n(E) Inadequate fluid resuscitation in septic shock with lactate ≥4 worsens mortality.\n\n💎 PEARL: Sepsis-6 / Surviving Sepsis Campaign 1-hour bundle: lactate + blood cultures + IV antibiotics WITHIN 1 HOUR + 30 mL/kg crystalloid (lactate ≥4 or hypotensive) + vasopressor (noradrenaline) if MAP <65 after fluids + urine output monitoring + oxygen to SpO₂ ≥94% (88–92% in COPD). Time-to-antibiotics is the strongest modifiable mortality factor.",
   references:[{label:"Surviving Sepsis Campaign 2021 Guidelines", url:"https://www.sccm.org/Clinical-Resources/Guidelines/Guidelines/Surviving-Sepsis-Guidelines-2021"},{label:"NICE NG51 — Sepsis (2024 update)", url:"https://www.nice.org.uk/guidance/ng51"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Septic shock — first-line vasopressor",
   stem:"A 70-year-old woman with septic shock from urinary tract source (E. coli bacteraemia, urosepsis) remains hypotensive (map 58 mmHg, BP 86/50) despite 30 mL/kg crystalloid resuscitation over 1 hour and appropriate IV antibiotics started. Lactate 3.8 (was 4.5), HR 122, SpO₂ 95% on 4 L. Urine output 0.3 mL/kg/h (low). Central venous access being secured.\n\nWhich is the most appropriate next step?",
   options:["IV adrenaline infusion as first-line","Noradrenaline IV infusion (peripheral large-bore until central access available, then central)","IV dopamine infusion","IV phenylephrine bolus","Further crystalloid 30 mL/kg before vasopressor"],
   correct:"B",
   explanation:"VASOPRESSOR THERAPY IN SEPTIC SHOCK — Surviving Sepsis Campaign (SSC) 2021 guideline. INDICATIONS: persistent hypotension (MAP <65 mmHg) despite adequate fluid resuscitation (typically 30 mL/kg crystalloid in first hour); aim to RESTORE TISSUE PERFUSION while underlying infection is treated. Initial management hypovolaemia from extravascular fluid loss / vasodilation is corrected with FLUIDS; then vasopressors counter persistent vasoplegia. DOSING: typically 0.05-0.5 µg/kg/min; titrate to MAP target ≥65 mmHg (some patients with prior hypertension benefit from higher MAP target 75-80 — consider individual case). Now standard ADJUNCT to noradrenaline at moderate doses.\n\n(A) Adrenaline first-line is incorrect — used as third-line / when need additional inotropy; SSC clearly recommends noradrenaline first.\n\n(C) Dopamine is no longer first-line; associated with arrhythmia.\n\n(D) Phenylephrine (pure alpha-1) not preferred for septic shock — risk of bradycardia, reduced cardiac output through reflex; useful in some cases (e.g. obstetric, AS where need to maintain afterload without tachycardia) but not in septic shock.\n\n(E) Further fluid before vasopressor in patient with adequate initial resuscitation can cause overload and worsen outcomes; vasopressor is the next step.\n\n💎 PEARL: Septic shock with persistent hypotension after 30 mL/kg crystalloid: NORADRENALINE first-line (SOAP-II — lower arrhythmia and mortality vs dopamine). Initial peripheral via large-bore until central access. Titrate to MAP ≥65 (75–80 in chronic hypertension). Add vasopressin (catecholamine-sparing — VASST, VANISH) at 0.03 U/min for refractory shock. Hydrocortisone if persistently refractory.",
   references:[{label:"Surviving Sepsis Campaign 2021 Guidelines", url:"https://www.sccm.org/Clinical-Resources/Guidelines/Guidelines/Surviving-Sepsis-Guidelines-2021"},{label:"NICE NG51 — Sepsis (2024 update)", url:"https://www.nice.org.uk/guidance/ng51"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Anaphylaxis — IM adrenaline",
   stem:"A 28-year-old woman develops widespread urticaria, peri-oral and tongue angioedema, audible wheeze, hoarseness ('hot potato voice'), and a fall in BP from 130/80 to 76/40 within 10 minutes of starting an IV infusion of co-amoxiclav (started for cellulitis). She has known nut allergy. SpO₂ 92% on air, RR 28, GCS 15 (anxious, distressed). The infusion is stopped. Resus call put out.\n\nWhich is the most appropriate immediate management?",
   options:["IV chlorphenamine 10 mg as first-line","IV hydrocortisone 200 mg as first-line","IM adrenaline 500 micrograms (0.5 mL of 1:1000) into the anterolateral thigh; repeat every 5 minutes if no response","IV adrenaline 1 mg as first-line","Nebulised salbutamol alone"],
   correct:"C",
   explanation:"ANAPHYLAXIS: severe, life-threatening, generalised or systemic HYPERSENSITIVITY reaction. Sudden onset, rapid progression, life-threatening. DIAGNOSIS — UK RESUS COUNCIL 2021 guideline: SUDDEN ONSET and RAPID PROGRESSION OF SYMPTOMS, with LIFE-THREATENING AIRWAY (stridor, hoarseness, tongue swelling), and/or BREATHING (wheeze, dyspnoea, hypoxia, respiratory arrest), and/or CIRCULATION (hypotension, shock, cardiac arrest) PROBLEMS, USUALLY with SKIN / mucosal changes (urticaria, angio-oedema, flushing — present in ~80%; absent in 20% — DON'T exclude anaphylaxis if skin signs absent). INITIAL MANAGEMENT — THE 'ABCDE' approach with focus on rapid administration of adrenaline: (1) STOP TRIGGER if identified (this patient — stop IV infusion of suspected drug).\n\n(A) IV chlorphenamine 10 mg is second-line, for skin symptoms, AFTER adrenaline.\n\n(B) IV hydrocortisone 200 mg no longer routinely recommended, second-line at most.\n\n(D) IV adrenaline 1 mg is for CARDIAC ARREST (1:10,000 = 100 mcg/mL — 10 mL = 1 mg) — NOT first-line for anaphylaxis with circulation present; risks arrhythmia / severe hypertension if given IV bolus to anaphylaxis patient.\n\n(E) Nebulised salbutamol alone treats bronchospasm but won't treat shock or angio-oedema.\n\n💎 PEARL: Anaphylaxis (sudden ABC compromise + usually skin/mucosal change): IM ADRENALINE 500 mcg (0.5 mL of 1:1000) into ANTEROLATERAL THIGH IMMEDIATELY — repeat every 5 min if no response. NOT IV (arrhythmia risk; IV reserved for trained ICU/anaesthetics). Lay flat + raise legs (unless airway/breathing dictates upright). Oxygen + IV fluid + adjuncts.",
   references:[{label:"Resuscitation Council UK Anaphylaxis Guidelines (2021)", url:"https://www.resus.org.uk/library/2021-resuscitation-guidelines/emergency-treatment-anaphylaxis"},{label:"BSACI Anaphylaxis Guidelines (2021)", url:"https://onlinelibrary.wiley.com/doi/10.1111/cea.14005"}]},

  {section:"critical_care", specialty:"Respiratory", topic:"NIV in COPD type 2 respiratory failure",
   stem:"A 68-year-old man with severe COPD (fev₁ 28% predicted, gold D, ex-smoker, on triple inhaled therapy + home nebs + ltot 2 L/min) is admitted with infective exacerbation. After 60 minutes of controlled oxygen (24% Venturi, target SpO₂ 88-92%), nebulised salbutamol + ipratropium, IV hydrocortisone, IV antibiotics, and a CXR confirming no pneumothorax (just hyperinflation, mild infective changes), he remains tachypnoeic and confused. ABG: pH 7.28 (acidotic), PaCO₂ 9.2 kPa (markedly raised, hypercapnic), PaO₂ 7.4 kPa (hypoxia despite supplemental O₂), hco₃ 30 (chronic compensation). RR 28, SpO₂ 89%, GCS 14, drowsy but able to cooperate. He is for full active treatment per advance care planning.\n\nWhich is the most appropriate next step?",
   options:["Intubate and ventilate immediately","Increase oxygen to 60% via face mask","Start non-invasive ventilation (Bipap) — ipap 14 / epap 4-5 cmH₂O, titrate ipap up to 20-25 cmH₂O","IV aminophylline","IV doxapram"],
   correct:"C",
   explanation:"NON-INVASIVE VENTILATION (NIV) — BiPAP / Bi-level positive airway pressure ventilation: provides positive pressure ventilatory support via tight-fitting face mask without endotracheal intubation. INDICATIONS: PERSISTENT HYPERCAPNIC ACIDOSIS — pH <7.35 AND PaCO₂ >6.5 kPa (>45 mmHg) — DESPITE ≥1 HOUR of OPTIMAL MEDICAL THERAPY — bronchodilators, steroids, antibiotics — AND CONTROLLED OXYGEN.\n\n(A) Intubation may be required if NIV fails or contraindicated, but NIV is appropriate first step here (evidence-based, less invasive, fewer complications); reserve intubation for failure / contraindication.\n\n(B) Increasing oxygen to 60% would WORSEN hypercapnia by suppressing respiratory drive and altering V/Q matching — KEY teaching point about controlled oxygen in COPD; aim SpO₂ 88-92%.\n\n(D) IV aminophylline — limited evidence in acute exacerbation; narrow therapeutic window, arrhythmia risk; not first-line.\n\n(E) IV doxapram — central respiratory stimulant; HISTORICAL use; NOT recommended (no benefit shown over NIV; significant side effects — agitation, arrhythmia, hypertension).\n\n💎 PEARL: AECOPD + type 2 respiratory failure (pH <7.35, PaCO₂ >6.5) DESPITE optimal medical therapy + controlled oxygen for ≥1 hour: BiPAP (IPAP 14/EPAP 4–5, titrate IPAP up to 20–25). NIV first-line — fewer complications than intubation. NIV failure (RR >25, GCS <8, persistent acidosis) → consider intubation. Don't reach for higher FiO₂ — worsens hypercapnia (Haldane).",
   references:[{label:"NICE NG115 — COPD in over 16s (2018)", url:"https://www.nice.org.uk/guidance/ng115"},{label:"GOLD 2024 Strategy", url:"https://goldcopd.org/2024-gold-report/"}]},

  {section:"critical_care", specialty:"Hepatology", topic:"Paracetamol ALF — King's College Criteria",
   stem:"A 32-year-old woman is admitted 36 hours after a deliberate paracetamol overdose (estimated 25 g — 350 mg/kg). She presented late — outside the 8-hour window for guaranteed N-acetylcysteine efficacy. NAC was started on arrival. She has progressed to acute liver failure: jaundiced (bilirubin 250), drowsy (grade 2 encephalopathy — confused, drowsy but rousable), INR 6.2 (uncorrected, after vitamin K), creatinine 280 µmol/L (AKI), arterial pH 7.22 (after fluid resuscitation — post-resuscitation acidosis), lactate 4.1 (post-resuscitation), glucose 3.0 (hypoglycaemia — sign of failing liver synthesis), bilirubin 250.\n\nWhich is the most appropriate next step?",
   options:["Continue NAC and observe locally","Refer urgently to a liver transplant centre — meets King's College Criteria for paracetamol-induced alf","Liver biopsy to confirm","Plasmapheresis","High-dose dexamethasone"],
   correct:"B",
   explanation:"PARACETAMOL OVERDOSE — most common cause of acute liver failure (ALF) in the UK and US. STAGGERED OVERDOSE (>1 dose over >1 hour) and POOR HISTORY treated with same threshold for treatment as risk-stratification harder. (2) PARACETAMOL LEVEL — measured at ≥4 hours post-ingestion (earlier inaccurate due to absorption); plot on UK NOMOGRAM; ABOVE THE LINE → TREAT WITH NAC; BELOW LINE → no NAC needed (assuming single, accurately timed ingestion). (6) MONITORING: serial INR (most useful), pH, lactate, creatinine, encephalopathy grade. EARLY HEPATOLOGY input. \n\nPRESENTATION: nausea, vomiting, jaundice, RUQ pain, encephalopathy, coagulopathy, hypoglycaemia, AKI, sepsis. MELD also used.\n\n(A) Local observation in established ALF meeting transplant criteria denies access to potentially life-saving intervention.\n\n(C) Liver biopsy in ALF rarely changes management; bleeding risk high with coagulopathy.\n\n(D) Plasmapheresis — high-volume plasma exchange (HVPE) emerging in some specialist centres for ALF; not standard / not first-line; not yet established benefit.\n\n(E) High-dose dexamethasone — for some non-paracetamol ALF (autoimmune); not for paracetamol ALF.\n\n💎 PEARL: King's College Criteria for emergency liver transplant in PARACETAMOL ALF: pH <7.3 ALONE after fluid resuscitation, OR ALL THREE of: INR >6.5 + creatinine >300 + grade 3–4 encephalopathy. Refer URGENTLY to liver transplant centre when criteria approach. Continue NAC; supportive care. Non-paracetamol KCC: INR >6.5 alone, OR 3 of 5 minor criteria.",
   references:[{label:"AASLD Acute Liver Failure Position Paper", url:"https://aasldpubs.onlinelibrary.wiley.com/doi/10.1002/hep.31144"},{label:"Larson et al. — Acetaminophen-induced ALF (Hepatology 2005)", url:"https://aasldpubs.onlinelibrary.wiley.com/doi/10.1002/hep.20948"}]},

  {section:"critical_care", specialty:"Hepatology", topic:"Hepatic encephalopathy",
   stem:"A 58-year-old man with known alcohol-related cirrhosis (Child-Pugh C, 3 prior decompensations, abstinent 6 months) presents with new confusion, disorientation (unaware of date or place), asterixis (flapping tremor on outstretched hands), and personality change. His wife reports he had a recent ugi bleed 1 week ago (treated, discharged) and has been constipated for several days, also using more lactulose intermittently. He is afebrile. Examination: jaundiced, ascites (mild), spider naevi, palmar erythema, asterixis, no focal neurology, GCS 13 (drowsy). Investigations: ammonia 110 µmol/L (raised), Na 132, K 3.4, creatinine 90, INR 1.8, bilirubin 90, albumin 25; sepsis screen — afebrile but ascitic tap PMN 250 (elevated — possible SBP). He grade 2 (West Haven).\n\nWhich is the most appropriate management?",
   options:["Lactulose titrated orally / via NG to 2-3 soft stools daily, plus identification and treatment of all precipitants (SBP empirical antibiotics, electrolytes, constipation, GI bleed)","Strict dietary protein restriction","Oral neomycin alone","Therapeutic large-volume paracentesis","Plasmapheresis"],
   correct:"A",
   explanation:"HEPATIC ENCEPHALOPATHY (HE): a complex neuropsychiatric syndrome arising from advanced liver disease and / or porto-systemic shunting; reversible if precipitants identified and treated. MANAGEMENT — TREAT PRECIPITANT + reduce ammoniagenesis: (1) IDENTIFY and TREAT PRECIPITANT — the SINGLE most important step (this patient — likely SBP + constipation + recent bleed; treat each).\n\n(B) Routine protein restriction is HARMFUL — outdated practice; worsens sarcopenia and outcomes.\n\n(C) Neomycin (older non-absorbable antibiotic) — used historically but ototoxicity / nephrotoxicity from systemic absorption risks; rifaximin safer / preferred; not first-line.\n\n(D) Therapeutic paracentesis: appropriate for tense ascites symptom relief but not first-line for HE per se; may be needed if SBP / large ascites.\n\n(E) Plasmapheresis: not standard; emerging role in ACLF (acute-on-chronic liver failure) but not first-line for HE.\n\n💎 PEARL: Hepatic encephalopathy in cirrhosis: identify and treat the PRECIPITANT (infection — especially SBP, GI bleed, constipation, electrolyte disturbance, dehydration, sedatives, recent TIPS). Lactulose to 2–3 soft stools daily (oral or via NG). Add rifaximin for recurrent or severe disease. Protein restriction is HARMFUL (worsens sarcopenia) — outdated practice.",
   references:[{label:"EASL HE Guidelines (J Hepatol 2014)", url:"https://www.journal-of-hepatology.eu/article/S0168-8278(14)00383-6/fulltext"},{label:"AASLD HE Guideline", url:"https://aasldpubs.onlinelibrary.wiley.com/doi/10.1002/hep.27210"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Refeeding syndrome — cardinal abnormality",
   stem:"A 28-year-old woman with severe anorexia nervosa is admitted; BMI 13 (very low; severe malnutrition), weight 33 kg, height 160 cm. She has had minimal oral intake for 10 days (sips of water only). Examination: cachectic, lanugo, bradycardia (HR 42), hypotensive (BP 88/52), hypothermic (T 35.4°C), severe muscle wasting. Initial bloods: phosphate 0.8 mmol/L (low-normal), magnesium 0.65 (low), potassium 3.2 (low), albumin 28, glucose 3.2, WCC 3, Hb 100. ECG: sinus bradycardia, no QTc prolongation. The dietitian recommends commencing nutrition cautiously.\n\nWhich is the cardinal electrolyte abnormality of refeeding syndrome?",
   options:["Hypernatraemia is the cardinal abnormality","Hyperkalaemia is the cardinal abnormality","Hypophosphataemia is the cardinal abnormality — start nutrition very cautiously, with thiamine and B-vitamin replacement","Hyperphosphataemia is the cardinal abnormality","Hyperchloraemia is the cardinal abnormality"],
   correct:"C",
   explanation:"REFEEDING SYNDROME (RFS): a potentially FATAL constellation of metabolic and clinical abnormalities that occurs when nutrition is reintroduced (oral, enteral, or parenteral) to severely malnourished or starved patients — historically described in concentration camp survivors after liberation; now recognised in anorexia nervosa, severe alcoholism, prolonged starvation, severe acute malnutrition, post-surgical / oncological cachexia, prolonged ICU NPO. VERY HIGH RISK: BMI <14, negligible intake >15 days, electrolytes very low. THIS PATIENT — clearly very high risk (BMI 13, 10 days minimal intake, electrolytes low). MANAGEMENT — PREVENTION is BEST: (1) IDENTIFY at-risk patients on admission.\n\n(A) Hypernatraemia not characteristic — sodium / water retention may occur but hyponatraemia more common from dilution.\n\n(B) Hyperkalaemia opposite — hypoKalaemia is feature.\n\n(D) Hyperphosphataemia opposite — hypoPhosphataemia is THE feature.\n\n(E) Hyperchloraemia not relevant.\n\n💎 PEARL: Severe malnutrition + reintroduced nutrition → refeeding syndrome. CARDINAL ABNORMALITY = HYPOPHOSPHATAEMIA (insulin drives phosphate intracellularly with glucose). Also low Mg, low K, thiamine deficiency. Start nutrition CAUTIOUSLY (5–10 kcal/kg/day, increase over 4–7 days). THIAMINE BEFORE feeds (200–300 mg IV). Monitor electrolytes daily and replace aggressively (NICE NG32).",
   references:[{label:"NICE CG32 — Nutrition support for adults (2006, updated)", url:"https://www.nice.org.uk/guidance/cg32"},{label:"ASPEN Refeeding Syndrome Consensus (Nutr Clin Pract 2020)", url:"https://aspenjournals.onlinelibrary.wiley.com/doi/10.1002/ncp.10474"}]},

  {section:"critical_care", specialty:"Haematology", topic:"Major haemorrhage protocol — transfusion ratio",
   stem:"A 38-year-old man with known cirrhosis is admitted with massive fresh haematemesis (estimated 2 L blood loss in 30 minutes) from suspected variceal bleeding. On arrival: BP 78/44 (shock), HR 132, RR 28, GCS 14, peripherally cold and clammy. Hb 62 g/L (severe anaemia, ongoing loss). The major haemorrhage protocol (MHP) is activated. Initial steps: large-bore IV access (×2 14G antecubital), bloods sent for crossmatch / FBC / clotting / U&E / LFTs / lactate / VBG. Empirical terlipressin given.\n\nWhich is the most appropriate transfusion approach?",
   options:["Red cells alone, awaiting clotting results","Empirical near-1:1:1 ratio of red cells : FFP : platelets, plus IV tranexamic acid 1 g","Fresh whole blood","Cryoprecipitate alone","IV albumin 4.5%"],
   correct:"B",
   explanation:"MAJOR HAEMORRHAGE: definitions vary but commonly: blood loss exceeding circulating volume (~70 mL/kg) within 24 hours, OR >50% volume loss within 3 hours, OR ongoing loss >150 mL/min, OR transfusion of >10 units packed red cells in 24 hours, OR clinical haemorrhage requiring resuscitation. (4) TRANEXAMIC ACID (TXA) — IV 1 g over 10 minutes, repeat 1 g over 8 hours: ANTIFIBRINOLYTIC (synthetic lysine analogue blocks plasminogen → plasmin conversion). WOMAN trial (post-partum haemorrhage): also benefit; routinely used in obstetric MHP.\n\n(A) Red cells alone causes dilutional coagulopathy, perpetuates / worsens bleeding.\n\n(C) Fresh whole blood — used in some military / battlefield settings; not standard in UK civilian.\n\n(D) Cryoprecipitate alone treats fibrinogen but not other components.\n\n(E) Albumin colloid — no role in acute haemorrhagic resuscitation; expensive, no benefit over crystalloid; may be used in cirrhosis with SBP / HRS / large-volume paracentesis.\n\n💎 PEARL: Major haemorrhage: empirical near 1:1:1 ratio of red cells:FFP:platelets — better outcomes than red cells alone (PROPPR). Tranexamic acid 1 g IV over 10 min + 1 g over 8 hours (CRASH-2 in trauma; HALT-IT showed NO benefit in GI bleeding). Cryoprecipitate for fibrinogen <1.5. Source control + reverse anticoagulation.",
   references:[{label:"BSH Transfusion Guidelines", url:"https://b-s-h.org.uk/guidelines/"},{label:"SHOT Annual Report (Serious Hazards of Transfusion)", url:"https://www.shotuk.org/"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Massive PE — peri-arrest thrombolysis",
   stem:"A 60-year-old man, 2 weeks post-elective left total knee replacement, has sudden collapse on the AMU during physiotherapy. He is in pea cardiac arrest; CPR commenced within 1 minute. Point-of-care bedside TTE during a CPR pause shows a markedly dilated, akinetic right ventricle with septal flattening (D-shaped LV in short-axis), small underfilled left ventricle (volume contracted), no pericardial effusion. He has no overt bleeding source; he had been on prophylactic LMWH but missed the previous dose. CPR continues with adrenaline given.\n\nWhich is the most appropriate next step?",
   options:["Standard ALS only with adrenaline","Intra-arrest IV alteplase 50 mg bolus and continue CPR for 60–90 minutes; consider mechanical CPR, va-ecmo or surgical embolectomy","Defibrillation regardless of rhythm","Insert IVC filter immediately","Aspirin and observe"],
   correct:"B",
   explanation:"MASSIVE PULMONARY EMBOLISM (PE) WITH CARDIAC ARREST: catastrophic obstruction of pulmonary circulation causing acute right ventricular (RV) failure → reduced LV preload → cardiogenic shock → cardiac arrest (typically PEA from severe RV failure / electromechanical dissociation). DURATION of post-PE anticoagulation: 3 months minimum for provoked; indefinite for unprovoked or recurrent or persistent risk factor (cancer); DOAC / warfarin per guideline.\n\n(A) Standard ALS only without addressing reversible cause (massive PE) misses life-saving opportunity.\n\n(C) Defibrillation only for shockable rhythm (VF / pulseless VT) — this is PEA.\n\n(D) IVC filter is for prevention of recurrent PE, not acute treatment of arrest.\n\n(E) Aspirin alone inadequate for massive PE.\n\n💎 PEARL: Cardiac arrest + suspected/confirmed massive PE on bedside echo (RV dilatation, septal flattening, McConnell sign): IV alteplase 50 mg bolus DURING CPR + continue CPR for 60–90 minutes (gives thrombolytic time to work). Consider mechanical CPR, VA-ECMO, or surgical embolectomy. Risk of bleeding outweighed by certain death without thrombolysis.",
   references:[{label:"NICE NG128 — Stroke and TIA (2019)", url:"https://www.nice.org.uk/guidance/ng128"},{label:"RCP National Clinical Guideline for Stroke (2023)", url:"https://www.strokeguideline.org/"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Heat stroke — rapid cooling",
   stem:"A previously well 65-year-old man is found collapsed outdoors during a heatwave (ambient 37°C) after several hours of physical labour. Core temperature 41.6°C (rectal probe), GCS 9 (E2 V2 M5 — confused / drowsy), HR 138, BP 88/50 (hypotensive), RR 28, SpO₂ 95%, dry hot skin. Investigations: CK 22,000 (markedly raised — rhabdomyolysis), creatinine 240 (AKI from baseline ~80), ALT 380 / AST 510 (deranged LFTs — hepatic injury), lactate 5.2 (raised), prothrombin time prolonged (INR 1.8 — early coagulopathy), platelets dropping. Glucose 5.0.\n\nWhich is the most appropriate immediate management?",
   options:["Standard antipyretics (paracetamol, ibuprofen)","Rapid active cooling — cold-water immersion (or evaporative cooling) targeting core <39°C as quickly as possible, plus aggressive resuscitation and ICU support","Cold IV fluids alone","High-dose corticosteroid","Vasopressor before cooling"],
   correct:"B",
   explanation:"HEAT STROKE: a life-threatening medical emergency defined as CORE TEMPERATURE >40°C with CNS DYSFUNCTION (confusion, ataxia, agitation, seizures, coma). \n\nINVESTIGATIONS: serial core temperature, FBC (haemolysis), U&E, LFTs, CK, troponin, lactate, glucose, coagulation (DIC screen), ABG, urinalysis (myoglobin), urine output, ECG, CXR.\n\n(A) Antipyretics ineffective and potentially harmful.\n\n(C) Cold IV fluids alone insufficient (cooling effect modest); need surface cooling.\n\n(D) Steroids no role.\n\n(E) Vasopressor without cooling treats hypotension symptomatically but doesn't address underlying hyperthermic injury.\n\n💎 PEARL: Heat stroke = core temperature >40°C + CNS dysfunction. RAPID ACTIVE COOLING is life-saving — cold-water immersion (gold standard, fastest) or evaporative cooling targeting core <39°C ASAP. Antipyretics ineffective (set point not raised). Aggressive resuscitation + ICU. Watch for rhabdomyolysis, AKI, DIC, hepatic injury. Mortality correlates with duration of hyperthermia.",
   references:[{label:"NICE NG128 — Stroke and TIA in over 16s (2019)", url:"https://www.nice.org.uk/guidance/ng128"},{label:"RCP National Clinical Guideline for Stroke (2023)", url:"https://www.strokeguideline.org/"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Severe accidental hypothermia",
   stem:"An 80-year-old man with dementia is found at home on the floor after many hours (last seen the previous evening; brought in by neighbour). Core temperature (rectal probe) 28.4°C (severe hypothermia, stage III). HR 38 bradycardic, BP unrecordable. GCS 6 (E1 V1 M4). ECG: bradycardia with classical osborn (J) waves at the J-point in lateral leads, prolonged QT, atrial fibrillation. Glucose 4.2; investigations show K 5.8, lactate 6.0, mildly raised troponin. Soon after arrival in ED he develops ventricular fibrillation arrest (hypothermic).\n\nWhich is the most appropriate management?",
   options:["Withdraw active treatment given low GCS and arrest","Active rewarming (extracorporeal preferred for severe / arrest), warmed IV fluids, modify ALS for hypothermia, do not declare death until rewarmed >35°C","Active cooling for theoretical neuroprotection","Standard acls / drug doses without modification","Warm bath only"],
   correct:"B",
   explanation:"ACCIDENTAL HYPOTHERMIA: core body temperature <35°C; SEVERE <28°C; PROFOUND <24°C (rare survival without ECMO). NOTABLE survivors: avalanche victims rescued after >2 hours; cold-water drowning victims with neurologically intact recovery after 30+ minutes submersion. EXCEPTIONS to active rewarming attempts: obvious lethal injury, snow burial >35 min with airway packed with snow + asystole + serum K >12 (suggests pre-arrest cardiac death rather than hypothermic cause), frozen body. (3) PROLONGED RESUSCITATION often required — continue CPR for at least 1-2 hours during rewarming; consider mechanical CPR (LUCAS / AutoPulse); transport to ECMO centre.\n\n(A) Withdrawal premature — must rewarm to >35°C before declaring death.\n\n(C) Active COOLING is for hyperthermia, not hypothermia.\n\n(D) Standard drug doses risk drug accumulation / toxicity in hypothermia.\n\n(E) Warm bath alone insufficient for severe hypothermia.\n\n💎 PEARL: Severe accidental hypothermia (core <28°C): ACTIVE REWARMING (extracorporeal preferred — VA-ECMO or CPB — for severe disease or arrest), warmed IV fluids, warmed humidified oxygen. Modify ALS: hold drugs until core >30°C, then every 6–10 min between 30–35°C. 'NOT DEAD UNTIL WARM AND DEAD' — continue resuscitation until rewarmed >35°C. HOPE score guides ECMO candidacy.",
   references:[{label:"ERC Hypothermia Guidelines (Resuscitation 2021)", url:"https://www.resus.org.uk/library/2021-resuscitation-guidelines"},{label:"Wilderness Medical Society Hypothermia Guidelines (2019)", url:"https://www.wemjournal.org/article/S1080-6032(19)30090-1/fulltext"}]},

  {section:"critical_care", specialty:"Endocrinology", topic:"Adrenal crisis in chronic steroid use",
   stem:"A 65-year-old woman on long-term oral prednisolone (10 mg daily for 18 months for polymyalgia rheumatica) is admitted with severe right lower limb cellulitis. She is started on IV co-amoxiclav. Despite 2 litres of crystalloid IV resuscitation she remains hypotensive (BP 78/42), tachycardic (HR 124), nauseated and confused. Investigations: K 5.6 (hyperkalaemia), Na 128 (hyponatraemia), glucose 3.2 (low), creatinine 145 (mild AKI), lactate 3.8, mildly raised CRP, blood cultures pending. Cortisol level sent but result pending.\n\nWhich is the most appropriate immediate management?",
   options:["Give further IV fluid only","IV hydrocortisone 100 mg STAT (do not delay for confirmatory tests), then 200 mg/24 h infusion (or 50 mg QDS); identify and treat precipitant; correct glucose / electrolytes","Stop the prednisolone and observe","Vasopressor as first step","IV potassium replacement"],
   correct:"B",
   explanation:"ADRENAL CRISIS (acute adrenal insufficiency / 'Addisonian crisis'): a LIFE-THREATENING emergency caused by acute deficiency of glucocorticoid (and often mineralocorticoid) action. DIAGNOSIS — TREAT FIRST, INVESTIGATE SECOND in suspected crisis; do NOT delay treatment. \n\nINITIAL: random cortisol (often low, but sample early); ACTH (raised in primary, low / inappropriately normal in secondary / tertiary); aldosterone, renin (low aldosterone with high renin in primary). DEFINITIVE diagnosis later — SHORT SYNACTHEN TEST, insulin tolerance test (hypoglycaemia stress test, gold standard but contraindicated in cardiac / seizure risk).\n\n(A) Fluid alone fails in adrenal crisis — vasoplegia is steroid-deficient, not fluid-deficient.\n\n(C) Stopping steroid worsens crisis — opposite of what's needed.\n\n(D) Vasopressor without cortisol fails — adrenoreceptor responsiveness depends on cortisol.\n\n(E) Potassium replacement WORSENS hyperkalaemia.\n\n💎 PEARL: Long-term oral prednisolone (any dose) + acute illness + relative hypotension + hyponatraemia ± hyperkalaemia ± hypoglycaemia = adrenal crisis. IV hydrocortisone 100 mg STAT + 200 mg/24 h infusion. Synacthen test UNRELIABLE in chronic steroid users. Don't delay treatment for tests. Steroid card; sick day rules; double dose during illness.",
   references:[{label:"Society for Endocrinology Emergency Endocrine Guidance — Adrenal Crisis", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Refractory septic shock — second-line vasopressor",
   stem:"A 70-year-old man with septic shock from urosepsis (E. coli bacteraemia, source: obstructed left ureter from staghorn calculus). On ICU after adequate fluid resuscitation (received 4 L crystalloid; CVP 12, no further fluid responsiveness on passive leg raise; lactate stabilised); started on noradrenaline 0.5 µg/kg/min via central line — at maximum recommended dose. He remains hypotensive (map 56 mmHg, target ≥65); urine output dropping to 15 mL/hour; lactate now rising again from 3.2 to 4.5; mottled peripheries. Source control underway with urgent ureteric stent.\n\nWhich is the most appropriate next step?",
   options:["Add adrenaline as first add-on","Add vasopressin 0.03 U/min — catecholamine-sparing per Surviving Sepsis Campaign 2021 (vasst, vanish); consider hydrocortisone if persistently refractory; ensure source control","Stop noradrenaline","High-dose IV furosemide","Further large fluid bolus"],
   correct:"B",
   explanation:"SEPTIC SHOCK: subset of sepsis with profound circulatory, cellular and metabolic abnormalities. MANAGEMENT — SURVIVING SEPSIS CAMPAIGN 2021 GUIDELINES — comprehensive bundle: HOUR-1 BUNDLE (used to be 3 / 6 hour bundles): (1) MEASURE LACTATE; re-measure if elevated;\n(2) BLOOD CULTURES before antibiotics;\n(3) BROAD-SPECTRUM ANTIBIOTICS within 1 hour (delay associated with increased mortality);\n(4) RAPID FLUID RESUSCITATION 30 mL/kg crystalloid for hypotension or lactate ≥4 mmol/L;\n(5) VASOPRESSORS to MAP ≥65 if hypotensive after fluids. Doses higher than 0.04 U/min not recommended (ischaemic complications — digital, splanchnic, cardiac).\n\n(A) Adrenaline second-line for septic shock; vasopressin preferred per evidence.\n\n(C) Stopping noradrenaline catastrophic.\n\n(D) Furosemide no role in unresolved hypoperfusion / oliguria from shock.\n\n(E) Excess fluid harmful — FACTT and SMART trials inform restrictive approach after initial resuscitation.\n\n💎 PEARL: Refractory septic shock on noradrenaline ≥0.5 mcg/kg/min: ADD VASOPRESSIN 0.03 U/min as catecholamine-sparing (VASST, VANISH — non-inferior to noradrenaline alone, spares catecholamine doses). Don't exceed 0.04 U/min (ischaemic complications — digital, splanchnic, cardiac). Add hydrocortisone 200 mg/24 h for persistent refractoriness. Ensure SOURCE CONTROL.",
   references:[{label:"Surviving Sepsis Campaign 2021 Guidelines", url:"https://www.sccm.org/Clinical-Resources/Guidelines/Guidelines/Surviving-Sepsis-Guidelines-2021"},{label:"NICE NG51 — Sepsis (2024 update)", url:"https://www.nice.org.uk/guidance/ng51"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Massive haemoptysis — airway protection",
   stem:"A 62-year-old patient with established bronchiectasis (P. aeruginosa colonised) presents acutely with fresh blood haemoptysis — has expectorated approximately 600 mL bright red blood over the past 2 hours, with ongoing bleeding. He is now desaturating (SpO₂ 86% despite 15 L/min via non-rebreather), tachypnoeic (RR 32), tachycardic (HR 120), hypotensive (BP 100/60). He is on aspirin for IHD. Prior imaging shows worst bronchiectatic disease in the left lower lobe — bleeding is suspected to originate from the left lung.\n\nWhich is the most appropriate immediate management?",
   options:["Position with the bleeding side up","Position with bleeding side down, secure airway with large ett, reverse anticoagulation, urgent CT angiography and bronchial artery embolisation","High-flow nasal oxygen alone","Routine NIV","Conservative oral tranexamic acid only"],
   correct:"B",
   explanation:"MASSIVE HAEMOPTYSIS: variably defined; common thresholds are >100-150 mL in single expectoration, >500 mL in 24 hours, OR ANY haemoptysis with HAEMODYNAMIC INSTABILITY / RESPIRATORY COMPROMISE / RISK OF AIRWAY OBSTRUCTION. CRITICAL TEACHING POINT — DEATH from massive haemoptysis is by ASPHYXIATION (airway obstruction by blood) NOT EXSANGUINATION (the average adult tracheobronchial tree volume is ~200 mL — even relatively small volumes can drown both lungs); MORTALITY ~30-50% without prompt intervention. PLAIN CXR less helpful.\n\n(A) Bleeding side UP: REVERSE — gravity drains blood into unaffected lung; risk of asphyxia.\n\n(C) HFNO alone fails airway protection in massive bleed.\n\n(D) NIV inappropriate — potential for blood aspiration, pressure displaces clot.\n\n(E) Oral tranexamic acid alone insufficient for massive haemoptysis — needs IV / nebulised + airway / source measures.\n\n💎 PEARL: Massive haemoptysis (>200 mL once, >600 mL/24 h, or compromise): death is from ASPHYXIATION not exsanguination. Position bleeding side DOWN (gravity protects unaffected lung). Secure airway with large-bore ETT (≥8.0 — allows bronchoscopy, balloon tamponade). Reverse anticoagulation. Urgent CT angiography → bronchial artery embolisation (~85% success). Surgery for refractory.",
   references:[{label:"BTS Lung Cancer Guidance", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/lung-cancer/"}]},

  {section:"other", specialty:"Dermatology", topic:"Pemphigus vulgaris",
   stem:"A 55-year-old man has 6 weeks of progressive painful oral erosions (preventing eating, weight loss 4 kg) and now flaccid bullae on the trunk and scalp that rupture readily, leaving raw painful erosions. Nikolsky sign is positive (light shearing pressure on apparently normal skin produces blistering). Direct immunofluorescence of perilesional skin: intercellular IgG deposition throughout the epidermis in a 'chicken-wire' / 'fishnet' pattern.\n\nWhich is the most likely diagnosis?",
   options:["Bullous pemphigoid","Pemphigus vulgaris","Stevens-Johnson syndrome","Erythema multiforme","Linear IgA disease"],
   correct:"B",
   explanation:"PEMPHIGUS VULGARIS (PV): a rare, potentially life-threatening AUTOIMMUNE intra-epidermal blistering disease. 1-0.5 per 100,000 per year; peak age 40-60; M:F roughly equal; HIGHER in people of Mediterranean, Eastern European Jewish, and Middle Eastern descent; HLA-DR4 and HLA-DR14 association. Two main subtypes: PV (Dsg3 ± Dsg1 — mucosal-dominant or mucocutaneous), and PEMPHIGUS FOLIACEUS (Dsg1 only — superficial skin only, no mucosal). Drug-induced PV — penicillamine, captopril, rifampicin, NSAIDs (rare). MANAGEMENT — specialist DERMATOLOGY centre; multidisciplinary; depends on severity: HIGH-DOSE CORTICOSTEROIDS (oral prednisolone 1 mg/kg) traditionally first-line — typically achieve disease control over weeks; long-term steroid morbidity significant.\n\n(A) Bullous pemphigoid: SUBEPIDERMAL split (basement membrane); LINEAR IgG / C3 at BMZ (not intercellular); TENSE bullae; mucosal SPARING usually; older patients.\n\n(C) Stevens-Johnson syndrome: drug reaction; targetoid lesions; mucosal involvement but DIFFERENT immunology.\n\n(D) Erythema multiforme: targetoid lesions; HSV / mycoplasma trigger; less severe.\n\n(E) Linear IgA disease: linear IgA at BMZ; subepidermal; vancomycin trigger common.\n\n💎 PEARL: Painful oral erosions + flaccid bullae that rupture readily + Nikolsky POSITIVE + INTRA-EPIDERMAL split (suprabasal) + 'chicken-wire' INTERCELLULAR IgG on DIF + anti-DESMOGLEIN 1+3 antibodies = pemphigus vulgaris. Mucosa typically affected first. High-dose prednisolone + RITUXIMAB first-line (PEMPHIX — superior to steroid alone). Specialist dermatology centre.",
   references:[{label:"BAD Guidelines for Pemphigus (Br J Dermatol)", url:"https://www.bad.org.uk/clinical-services/guidelines/"}]},

  {section:"other", specialty:"Dermatology", topic:"IgA vasculitis (Henoch-Schönlein purpura)",
   stem:"A 35-year-old man develops palpable purpura on his lower legs and buttocks (non-blanching, slightly raised) 10 days after an upper respiratory tract infection. He also reports mild abdominal pain (cramping, intermittent) and arthralgia in both knees and ankles. Examination: extensive palpable purpura on extensor surfaces of legs and buttocks, mild bilateral knee effusions, no synovitis, no ulcers. Investigations: urinalysis blood ++ and protein +, creatinine normal, FBC normal, ESR 35, CRP 28, ANCA negative, ANA negative, complement normal, immunoglobulins show raised IgA.\n\nWhich is the most likely diagnosis?",
   options:["IgA vasculitis (Henoch-Schönlein purpura)","Anca-associated vasculitis","Cryoglobulinaemic vasculitis","Erythema nodosum","Drug-induced urticarial vasculitis"],
   correct:"A",
   explanation:"IgA VASCULITIS (formerly HENOCH-SCHÖNLEIN PURPURA, HSP — name change reflects modern classification by mechanism rather than eponym): a SMALL-VESSEL VASCULITIS characterised by IgA1-IMMUNE COMPLEX deposition in vessel walls of skin, joints, GI tract, and kidneys. DIAGNOSIS — CLINICAL in classic presentation; SKIN BIOPSY useful when atypical or to confirm — LEUCOCYTOCLASTIC VASCULITIS (perivascular neutrophilic infiltrate with karyorrhexis / nuclear dust); DIF — IgA-dominant immune complex deposition in vessel walls (DISTINGUISHING from other vasculitides). EXCLUDE other vasculitides — ANCA-associated (cANCA / pANCA), cryoglobulins, hepatitis B/C, blood cultures (endocarditis can mimic).\n\n(B) ANCA-vasculitis: ANCA positive (would explain GPA / MPA / EGPA); typically more systemic, renal-pulmonary syndrome.\n\n(C) Cryoglobulinaemic vasculitis: low complement, cryoglobulins detected; HCV association strong; palpable purpura but other features.\n\n(D) Erythema nodosum: tender RAISED red nodules on shins; not purpuric; different mechanism.\n\n(E) Drug-induced urticarial vasculitis: urticarial plaques with vasculitis; drug history; less abdominal / renal involvement.\n\n💎 PEARL: Post-URTI + palpable purpura on extensor surfaces of legs/buttocks + arthralgia + abdominal pain + haematuria/proteinuria = IgA vasculitis (HSP). Skin biopsy: leucocytoclastic vasculitis with IgA-dominant deposits on DIF. Most adults have self-limiting disease — supportive. Steroids for severe (GI, renal). IgA NEPHRITIS is the major morbidity — monitor BP and urinalysis for 6 months.",
   references:[{label:"EULAR Recommendations Vasculitides", url:"https://ard.bmj.com/"}]},

  {section:"other", specialty:"Allergy", topic:"Food anaphylaxis — post-event management",
   stem:"A 28-year-old woman with known peanut allergy accidentally ingests peanut traces in a restaurant dessert (cross-contamination). Within 15 minutes she develops urticaria, lip and tongue swelling, audible wheeze, sense of impending doom, and a fall in BP from 130/80 to 84/48. She self-administers her adrenaline auto-injector (EpiPen 0.3 mg IM into anterolateral thigh) before paramedics arrive. On ED arrival 30 minutes later: BP recovered to 110/70, mild residual urticaria; she received a second IM adrenaline 0.3 mg by paramedics, IV fluids, and high-flow oxygen. SpO₂ 98%, comfortable, no further wheeze. Serum tryptase taken at 1, 4, and 24 hours.\n\nWhich is the most appropriate post-event management?",
   options:["Continue current management — no additional steps","Observe for ≥6-12 hours (biphasic risk), provide two replacement adrenaline auto-injectors with training, refer to specialist allergy clinic with written emergency plan","No long-term follow-up needed","Switch from adrenaline to oral antihistamine PRN","Long-term oral prednisolone"],
   correct:"B",
   explanation:"ANAPHYLAXIS: a SEVERE, LIFE-THREATENING, generalised or systemic HYPERSENSITIVITY REACTION; rapid onset (typically minutes) with potentially fatal airway, breathing, or circulatory compromise. (4) INTRAMUSCULAR ADRENALINE (epinephrine) — FIRST-LINE, MOST IMPORTANT intervention; give EARLY (delay associated with increased mortality); ADULT dose 500 mcg (0.5 mL of 1:1000) IM into ANTEROLATERAL THIGH (mid-outer aspect); REPEAT every 5 minutes if no response (typically 1-3 doses needed); IV adrenaline only by experienced clinicians (anaesthetics / ICU) with continuous monitoring (cardiac arrhythmia risk); peripheral IV adrenaline 50 mcg boluses (0.5 mL of 1:10,000) — never give 1:1000 IV (lethal). EDUCATION KEY.\n\n(A) Continuing without follow-up risks future fatal episode.\n\n(C) No follow-up misses opportunity to prevent recurrence — central to anaphylaxis care is referral and education.\n\n(D) Antihistamine alone is INADEQUATE — doesn't address airway / cardiovascular collapse.\n\n(E) Long-term prednisolone not appropriate.\n\n💎 PEARL: After anaphylaxis: observe ≥6–12 HOURS for biphasic reaction risk (~5%). Provide TWO replacement adrenaline auto-injectors + training. Refer to specialist allergy clinic for confirmation, education, written emergency plan. Serum mast cell tryptase at 1–2 h and 24 h confirms anaphylaxis (transient rise). Avoid causative agent + medical alert bracelet.",
   references:[{label:"Resuscitation Council UK Anaphylaxis Guidelines (2021)", url:"https://www.resus.org.uk/library/2021-resuscitation-guidelines/emergency-treatment-anaphylaxis"},{label:"BSACI Anaphylaxis Guidelines (2021)", url:"https://onlinelibrary.wiley.com/doi/10.1111/cea.14005"}]},

  {section:"other", specialty:"Statistics", topic:"Bayes' theorem and post-test probability",
   stem:"A diagnostic test for a clinical condition has sensitivity 90% and specificity 95%. The pre-test probability (prevalence) of the condition in the patient's population is 5%. The patient tests positive. Approximately what is the post-test probability of disease?",
   options:["95% (close to test specificity)","45–50%","90% (close to test sensitivity)","5% (unchanged from prevalence)","99%"],
   correct:"B",
   explanation:"BAYES' THEOREM and DIAGNOSTIC TEST INTERPRETATION: a CRITICAL concept for the SCE — even with apparently 'good' test characteristics (high sensitivity AND specificity), POST-TEST PROBABILITY is HEAVILY DEPENDENT ON PRE-TEST PROBABILITY (prevalence).\n\nSTEP 2: LR+ = sensitivity / (1 - specificity) = 0.90 / (1 - 0.95) = 0.90 / 0.05 = 18 (strongly positive test).\n\nSTEP 3: Post-test odds = pre-test odds × LR+ = 0.053 × 18 ≈ 0.95.\n\nSTEP 4: Post-test probability = post-test odds / (1 + post-test odds) = 0.95 / 1.95 ≈ 0.487 ≈ 49%.\n\n(A) 95% would be appropriate for high-prevalence population (e.g. clinically very likely disease); too high here.\n\n(C) 90% close to sensitivity but doesn't reflect prevalence — wrong reasoning.\n\n(D) Pre-test probability unchanged means test result is uninformative — but a positive test from a meaningful test changes probability.\n\n(E) 99% would require near-certainty in pre-test or perfect test.\n\n💎 PEARL: Bayes: post-test probability depends HEAVILY on pre-test probability (prevalence). Sensitivity 90% + specificity 95% + prevalence 5% → positive test gives only ~49% post-test probability (LR+ = 18; pre-test odds 0.053 × 18 ≈ 0.95; PPV ≈ 49%). Low prevalence → many false positives even with an apparently excellent test.",
   references:[{label:"BMJ Best Practice — Statistical Concepts", url:"https://bestpractice.bmj.com/topics/en-gb/685"},{label:"Cochrane Methods — Bayesian Methods", url:"https://training.cochrane.org/handbook/current/chapter-08"}]},

  {section:"other", specialty:"Statistics", topic:"Forest plot interpretation",
   stem:"A meta-analysis of 8 randomised controlled trials investigating a new statin's effect on stroke prevention is shown as a forest plot. Individual trial point estimates appear with 95% confidence intervals as horizontal lines. Vertical 'line of no effect' is at OR = 1.0. Pooled estimate diamond lies entirely to the left of 1.0 (favouring intervention). Heterogeneity statistics: I² = 12% (low), Cochran's Q P-value = 0.32 (non-significant). Trials were of moderate-high quality (Cochrane risk-of-bias assessment).\n\nWhich is the most appropriate interpretation?",
   options:["Significant heterogeneity present, do not pool","Low heterogeneity allows fixed-effects pooling, pooled estimate statistically significant for benefit, interpret in context of trial quality","Pooled estimate is non-significant","Random-effects model is mandatory","Funnel plot is required to interpret"],
   correct:"B",
   explanation:"FOREST PLOT — graphical display of meta-analysis results showing individual trial estimates and pooled summary; ESSENTIAL for evidence appraisal in modern medicine. STATISTICAL SIGNIFICANCE: a trial CI / pooled diamond CROSSING the line of no effect = NOT statistically significant at the conventional 5% level; ENTIRELY ON ONE SIDE = STATISTICALLY SIGNIFICANT (this patient — pooled diamond entirely left of 1.0 = significant favourable effect). I² = 12% in this question = LOW heterogeneity. (2) COCHRAN's Q TEST — chi-squared test; significant P (<0.10 conventionally, more lenient than 0.05) suggests heterogeneity. NON-significant P (= 0.32 here) supports homogeneity.\n\n(A) Significant heterogeneity is incorrect — I² = 12% and Q P-value 0.32 indicate LOW heterogeneity; pooling appropriate.\n\n(C) Non-significant pooled estimate would have a CI crossing 1.0 — diamond entirely left of 1.0 indicates significance.\n\n(D) Random-effects mandatory only with substantial heterogeneity — fixed-effects appropriate here given low heterogeneity.\n\n(E) Funnel plot is for publication bias — useful adjunct but not required to interpret main effect.\n\n💎 PEARL: Forest plot: individual trial estimates with 95% CI as horizontal lines; pooled estimate diamond. CI/diamond crossing line of no effect = NOT significant; entirely on one side = significant. Heterogeneity: I² <25% low (fixed-effects pooling), 25–50% moderate, >50% substantial (random-effects, explore sources). Always interpret in context of trial quality.",
   references:[{label:"Cochrane Handbook — Reporting Meta-analysis Results", url:"https://training.cochrane.org/handbook"},{label:"BMJ — How to read a forest plot", url:"https://www.bmj.com/content/335/7626/914"}]},

  {section:"other", specialty:"Patient Safety", topic:"WHO surgical safety checklist",
   stem:"A patient is having an elective laparoscopic cholecystectomy. The theatre team performs a structured pause before skin incision. The anaesthetist, surgeon, theatre staff, and patient (where applicable) collectively confirm: patient identity, surgical site marking, planned procedure, allergies, anticipated blood loss, antibiotic prophylaxis administration, equipment availability, and any team concerns or critical events anticipated. Earlier, before anaesthesia, a different structured check was performed; another check will follow before the patient leaves theatre.\n\nWhich is being described?",
   options:["Routine team practice — not specifically required","Who Surgical Safety Checklist — three components (sign in, time out, sign out)","Mandatory only for emergency operations","Restricts the surgical team","Replaces consent"],
   correct:"B",
   explanation:"WHO SURGICAL SAFETY CHECKLIST: a globally adopted patient safety intervention developed by the World Health Organisation in 2008, demonstrably improving outcomes through structured team communication. EVIDENCE: Haynes et al. THREE-PART STRUCTURE: (1) 'SIGN IN' — BEFORE INDUCTION OF ANAESTHESIA; team includes patient (where conscious), anaesthetist, anaesthetic assistant: patient identity, site, procedure, consent confirmed; surgical site MARKED (or marking confirmed not applicable); anaesthetic safety check completed; pulse oximeter on and functioning; allergies known; airway risk / aspiration risk identified; risk of blood loss >500 mL anticipated and IV access / fluids ready.\n\n(A) Routine practice — by definition this IS routine practice now, but specifically the WHO checklist; question asks identification.\n\n(C) Required for ALL surgical procedures, not only emergencies.\n\n(D) Empowers, not restricts.\n\n(E) Complements consent — separate process.\n\n💎 PEARL: WHO Surgical Safety Checklist (Haynes 2009 — reduced mortality from 1.5% to 0.8%): SIGN IN before anaesthesia (identity, site, consent, allergies, airway, blood loss); TIME OUT before incision (introductions, identity, procedure, antibiotics, equipment, concerns); SIGN OUT before leaving theatre (procedure recorded, instrument/sponge counts, specimens labelled).",
   references:[{label:"WHO Surgical Safety Checklist", url:"https://www.who.int/teams/integrated-health-services/patient-safety/research/safe-surgery"},{label:"Haynes et al. — Original Safety Checklist Trial (NEJM 2009)", url:"https://www.nejm.org/doi/full/10.1056/NEJMsa0810119"}]},

  {section:"other", specialty:"Patient Safety", topic:"Patient Safety Incident Response Framework (PSIRF)",
   stem:"A serious incident occurs on the medical assessment unit: a patient receives an overdose of low-molecular-weight heparin (received treatment dose 1.5 mg/kg instead of prophylactic 40 mg) following a verbal handover miscommunication between the night and day teams (different prescribing template confused with a different patient with PE). The patient develops bleeding requiring transfusion. No permanent harm; significant moderate harm. The trust commissions a structured investigation involving the staff involved, the patient and family, and a clinical safety lead.\n\nWhich is the most appropriate response?",
   options:["Immediate disciplinary action against the prescriber","Structured investigation under PSIRF (Patient Safety Incident Response Framework) examining contributory factors at multiple system levels, supporting just culture, with duty of candour","Discharge of the patient","No action — no permanent harm","Avoid documenting the incident"],
   correct:"B",
   explanation:"PATIENT SAFETY INCIDENT RESPONSE FRAMEWORK (PSIRF — NHS England 2022): replaced the previous SERIOUS INCIDENT FRAMEWORK (2015) — the major shift in how the NHS manages patient safety incidents. Threshold: any incident causing 'moderate harm' (significant injury), 'severe harm' (long-term or major impact), or 'death'. Failure to comply is a regulatory offence (CQC). INVESTIGATION TOOLS within PSIRF approach: STRUCTURED TIMELINES; FISHBONE (Ishikawa) DIAGRAMS — categorise contributory factors by people, processes, equipment, environment, materials, management; '5 WHYS' — iteratively asking 'why?' to drill down to root cause; SEIPS framework (work system analysis); CONTRIBUTORY FACTORS framework.\n\n(A) Disciplinary action against the prescriber alone misses systemic factors and damages safety culture (deters reporting).\n\n(C) Discharge of patient irrelevant to incident management.\n\n(D) 'No permanent harm' threshold for action is wrong — moderate harm requires investigation; near-misses also valuable learning.\n\n(E) Failure to document the incident is a regulatory breach and prevents learning.\n\n💎 PEARL: Patient Safety Incident Response Framework (PSIRF — NHS England 2022, replaced Serious Incident Framework): structured investigation using systems-based tools (timelines, fishbone, 5 whys, SEIPS). Emphasises JUST CULTURE — focus on system contributory factors not individual blame. Statutory Duty of Candour (Reg 20) for moderate harm or worse.",
   references:[{label:"NHS England Patient Safety Incident Response Framework (PSIRF, 2022)", url:"https://www.england.nhs.uk/patient-safety/patient-safety-incident-response-framework/"}]},

  {section:"other", specialty:"Genetics", topic:"Lynch syndrome",
   stem:"A 38-year-old woman is diagnosed with right-sided ascending colon adenocarcinoma. Family history: mother had endometrial cancer aged 50, maternal uncle had colorectal cancer aged 48, maternal grandmother had ovarian cancer aged 60, and a maternal cousin had bladder TCC aged 45. Tumour testing (universal MMR / msi testing for new colorectal cancer per NICE NG151): microsatellite instability high (msi-h) on PCR; immunohistochemistry shows loss of MSH2 protein expression (MLH1, MSH6, PMS2 retained). She is referred to clinical genetics.\n\nWhich is the most likely underlying syndrome?",
   options:["Sporadic colorectal cancer","Lynch syndrome","Familial adenomatous polyposis","Peutz-Jeghers syndrome","Brca-associated cancer"],
   correct:"B",
   explanation:"LYNCH SYNDROME (formerly HEREDITARY NON-POLYPOSIS COLORECTAL CANCER, HNPCC): the MOST COMMON HEREDITARY COLORECTAL CANCER syndrome — accounts for 3-5% of all colorectal cancers; AUTOSOMAL DOMINANT with high penetrance. DIAGNOSIS — multi-step: (1) AMSTERDAM CRITERIA (clinical, restrictive, missed many cases): ≥3 relatives with Lynch-spectrum cancer, across 2 generations, ≥1 diagnosed before 50, FAP excluded — (2) BETHESDA CRITERIA — broader screening for tumour MMR testing. (3) UNIVERSAL TESTING — current NICE NG151 (2020) recommends ALL new colorectal cancer patients have tumour MSI / IHC testing AT DIAGNOSIS — captures cases missed by family-history-based criteria; similar approach for endometrial cancer.\n\n(A) Sporadic CRC: doesn't account for striking family history and tumour genetics; MSI / loss of MSH2 strongly suggests germline mutation.\n\n(C) FAP: hundreds-thousands of colonic adenomas, APC gene; different phenotype.\n\n(D) Peutz-Jeghers: hamartomatous polyposis, mucocutaneous pigmentation, STK11 gene.\n\n(E) BRCA: breast / ovarian cancer predisposition; doesn't typically cause CRC clusters or MSI; can co-occur but distinct.\n\n💎 PEARL: Universal MMR/MSI testing for all new colorectal cancer (NICE NG151): MSI-H + MMR protein loss (MLH1, MSH2, MSH6, PMS2) → suspect Lynch syndrome (autosomal dominant, MMR gene mutation). 50–80% lifetime CRC risk; high risks of endometrial, ovarian, gastric, urothelial. Cascade family testing + intensive surveillance (colonoscopy from 25). Aspirin reduces CRC risk (CAPP2).",
   references:[{label:"NICE DG27 — Molecular testing for Lynch syndrome (2017)", url:"https://www.nice.org.uk/guidance/dg27"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"Local anaesthetic systemic toxicity (LAST)",
   stem:"A 60-year-old patient receives an interscalene brachial plexus block with bupivacaine 0.5% (20 mL) for shoulder surgery, performed under ultrasound guidance. Within 5 minutes, she develops perioral tingling and metallic taste, then a generalised tonic-clonic seizure, followed by ventricular fibrillation cardiac arrest unresponsive to standard ALS (3 shocks delivered, 1 mg adrenaline given, no ROSC). She has no history of cardiac disease.\n\nWhich is the most appropriate next step?",
   options:["Continue standard ALS only","Stop the offending drug, modified ALS, IV lipid emulsion 20% bolus 1.5 mL/kg then infusion; consider va-ecmo if refractory","Adrenaline at high dose only","Sodium bicarbonate alone","Saline bolus only"],
   correct:"B",
   explanation:"LOCAL ANAESTHETIC SYSTEMIC TOXICITY (LAST): a rare but life-threatening complication of regional / local anaesthesia caused by INADVERTENT INTRAVASCULAR INJECTION or systemic absorption of high-dose local anaesthetic. PRESENTATION — biphasic / progressive: EARLY (CNS excitation): perioral / tongue numbness, METALLIC TASTE, tinnitus, light-headedness, diplopia, agitation, slurred speech (often preceded by transient prodrome that may be masked by sedation / GA); progresses to SEIZURES (often generalised tonic-clonic). PRESENTATION may be ATYPICAL — late-onset (>30 min), without prodromal CNS signs (especially under GA), with cardiovascular collapse first. MANAGEMENT — Association of Anaesthetists (AAGBI) / ASRA GUIDELINES: (1) STOP injecting local anaesthetic IMMEDIATELY.\n\n(A) Standard ALS without LAST modifications fails.\n\n(C) High-dose adrenaline can worsen LAST-induced arrhythmias.\n\n(D) Bicarbonate alone insufficient (mild role in metabolic acidosis correction).\n\n(E) Saline bolus alone treats nothing definitively.\n\n💎 PEARL: Local anaesthetic systemic toxicity: perioral tingling + metallic taste → seizures → cardiovascular collapse + arrhythmia. INTRALIPID 20% bolus 1.5 mL/kg + infusion 0.25 mL/kg/min — extracts lipid-soluble local anaesthetic from cardiac myocytes. Modified ALS — AVOID lidocaine, vasopressin, calcium-channel blockers, beta-blockers; small-dose adrenaline (1 mcg/kg). Refractory: VA-ECMO (AAGBI guideline).",
   references:[{label:"NICE NG185 — Acute coronary syndromes (2020)", url:"https://www.nice.org.uk/guidance/ng185"},{label:"ESC 2023 ACS Guidelines (Eur Heart J)", url:"https://academic.oup.com/eurheartj/article/44/38/3720/7243210"}]},

  {section:"critical_care", specialty:"Acute Medicine", topic:"High-altitude pulmonary oedema",
   stem:"A 35-year-old previously well trekker has rapidly ascended to 4500 m altitude (Annapurna circuit; ascended ~1200 m in past 2 days). Over 36 hours he developed progressive headache (frontal, throbbing), fatigue, and nausea (acute mountain sickness — ams); now new-onset dyspnoea at rest, dry cough that has progressed to pink frothy sputum, and chest discomfort. SpO₂ 78% on air at this altitude (vs expected 88-90% acclimatised; baseline ~96% at sea level). Examination: bilateral fine crackles, especially right mid-zone; central cyanosis; HR 130 (tachycardic). No fever, no infectious symptoms. He has been resting in his tent.\n\nWhich is the most appropriate immediate management?",
   options:["Continue ascent — symptoms will improve with acclimatisation","Immediate descent (≥500–1000 m) is life-saving; supplemental oxygen; nifedipine to lower pulmonary artery pressure; portable hyperbaric chamber if descent impossible","Long-term oral prednisolone","Aspirin 75 mg","Empirical antibiotics for pneumonia"],
   correct:"B",
   explanation:"HIGH-ALTITUDE ILLNESS: spectrum of conditions related to hypobaric hypoxia at altitudes typically >2500 m (8000 ft); rapid ascent (>500 m/day above 2500 m without acclimatisation), individual susceptibility, exertion, sleep at altitude all increase risk. Management: STOP ASCENT (do not climb higher with AMS — 'climb high, sleep low' principle); rest, hydration; PARACETAMOL / ibuprofen for headache; ANTIEMETICS for nausea; ACETAZOLAMIDE 250 mg BD orally — speeds acclimatisation through bicarbonate diuresis (metabolic acidosis stimulates ventilation, improving PaO2); useful for both PROPHYLAXIS (start 24 h before ascent, continue 2-3 days at altitude) and treatment; sulfa-allergy alternative — short-course dexamethasone.\n\n(A) Continuing ascent in HAPE = death.\n\n(C) Steroid is for HACE (dexamethasone), not first-line for HAPE (though may help adjunctively).\n\n(D) Aspirin no role.\n\n(E) Antibiotics inappropriate (no infectious features); but fever / focal consolidation with sputum production might suggest pneumonia as differential — exclude clinically.\n\n💎 PEARL: Rapid altitude ascent + AMS symptoms + new dyspnoea at rest + pink frothy sputum + hypoxia at altitude = HAPE. IMMEDIATE DESCENT (≥500–1000 m) is life-saving. Supplemental oxygen + nifedipine (lowers pulmonary artery pressure). Portable hyperbaric chamber (Gamow bag) if descent impossible. Acetazolamide for prevention. 'Climb high, sleep low' — 500 m/day max above 2500 m.",
   references:[{label:"Wilderness Medical Society Altitude Illness Guidelines (2019)", url:"https://www.wemjournal.org/article/S1080-6032(19)30090-1/fulltext"}]},

   explanation:"ABPA: hypersensitivity reaction to Aspergillus fumigatus colonising the airways, classically in known asthma or cystic fibrosis. Diagnostic criteria include asthma or CF, total IgE >1000 kU/L, raised Aspergillus-specific IgE, central bronchiectasis on HRCT, and peripheral eosinophilia. Treatment: oral corticosteroids (typical course of prednisolone tapered over 3–6 months) ± itraconazole as steroid-sparing antifungal. Recurrent exacerbations are common — long-term monitoring of total IgE guides response.\n\n(A) Aspergilloma is a fungal ball within a pre-existing cavity (often post-TB), seen on imaging as a mobile mass; presents with haemoptysis, not asthma flares; total IgE not characteristically elevated.\n\n(C) EGPA has asthma + eosinophilia but adds vasculitis (mononeuritis multiplex, purpura, cardiac involvement) and ANCA positivity (~30–40%) — none described here.\n\n(D) Chronic eosinophilic pneumonia has peripheral 'photographic-negative' infiltrates with eosinophilia but lacks the central bronchiectasis and Aspergillus serology.\n\n(E) Invasive pulmonary aspergillosis occurs in profoundly immunocompromised patients (neutropenia, post-transplant) with cavitating pulmonary lesions and the 'halo sign' on CT — life-threatening, not associated with asthma exacerbation.\n\n💎 PEARL: Poorly-controlled asthma + brown sputum plugs + fleeting infiltrates + IgE >1000 + raised Aspergillus IgE/IgG + central bronchiectasis = ABPA. Oral steroids ± itraconazole. Total IgE tracks response.",
   references:[{label:"BTS Aspergillus Lung Diseases Guidelines (Thorax 2023)", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/"},{label:"Infectious Diseases Society of America Aspergillosis Guidelines (2016)", url:"https://academic.oup.com/cid/article/63/4/e1/2197185"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Pulmonary sarcoidosis with hypercalcaemia",
   stem:"A 45-year-old African-Caribbean man has a 6-month history of progressive dyspnoea and dry cough. CXR: bilateral hilar lymphadenopathy with reticulonodular parenchymal infiltrates (Stage II). Serum ACE raised; corrected calcium 2.78 mmol/L; ALP and 1,25-vitamin D both elevated. Bronchoscopy with ebus-tbna: non-caseating granulomas; AFB stains and cultures negative.\n\nWhich is the most appropriate first-line treatment?",
   options:["Observation alone — spontaneous resolution is likely","Oral prednisolone 30–40 mg daily, tapered","Methotrexate","Infliximab","Itraconazole"],
   correct:"B",
   explanation:"Symptomatic pulmonary sarcoidosis with hypercalcaemia is an indication for systemic corticosteroid. Hypercalcaemia in sarcoidosis is driven by 1α-hydroxylation of 25-vitamin D within granulomas (independent of PTH) — corticosteroids reduce granuloma activity and rapidly correct calcium. Typical regimen: prednisolone 30–40 mg daily for 4–6 weeks, then taper over 6–12 months. Other treatment indications: progressive parenchymal disease, neurological / cardiac / ocular involvement, refractory hypercalcaemia, severe constitutional symptoms.\n\n(A) Asymptomatic Stage I sarcoidosis (BHL only) often resolves spontaneously — but hypercalcaemia and symptoms here mandate active treatment.\n\n(C) Methotrexate is a steroid-sparing second-line agent for chronic disease, refractory cases, or steroid-intolerance — used after steroid failure or for taper, not first-line.\n\n(D) Anti-TNF (infliximab, adalimumab) is reserved for refractory neurosarcoidosis, severe cutaneous (lupus pernio), or refractory uveitis — not first-line.\n\n(E) Itraconazole has no role in sarcoidosis (it treats fungal disease such as ABPA).\n\n💎 PEARL: Sarcoid hypercalcaemia is driven by 1α-hydroxylation of vitamin D within granulomas (PTH-independent). Symptoms or hypercalcaemia mandate prednisolone 30–40 mg taper. Asymptomatic Stage I often resolves spontaneously.",
   references:[{label:"Endocrine Society Primary Hyperparathyroidism Guidelines (2014)", url:"https://academic.oup.com/jcem/article/99/10/3561/2836268"},{label:"Society for Endocrinology Emergency Endocrine Guidance — Hypercalcaemia", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"COPD — escalation to triple therapy",
   stem:"A 70-year-old ex-smoker (50 pack-years) with COPD has spirometry: FEV1 38% predicted, FEV1/FVC 0.42 (post-bronchodilator). He has had 3 moderate exacerbations and 1 hospitalised exacerbation in the last 12 months despite tiotropium and salmeterol. Blood eosinophils 0.41 × 10⁹/L. MMRC dyspnoea grade 3. He has completed pulmonary rehabilitation, is vaccinated and not currently smoking.\n\nWhich is the most appropriate next step?",
   options:["Add inhaled corticosteroid (laba/lama/ics triple therapy)","Add azithromycin 250 mg three times weekly","Add roflumilast","Long-term oxygen therapy","Stop the laba and add ipratropium"],
   correct:"A",
   explanation:"GOLD / NICE NG115 escalation pathway for COPD with persistent exacerbations on LABA + LAMA: blood eosinophils ≥0.3 × 10⁹/L (or 100–300 with ≥2 exacerbations or any hospitalisation) → escalate to LABA/LAMA/ICS triple therapy. IMPACT, ETHOS and KRONOS trials demonstrated reduction in exacerbations and (for fluticasone furoate / budesonide combinations) all-cause mortality vs LAMA / LABA dual therapy. Counsel about pneumonia risk with ICS.\n\n(B) Azithromycin (long-term suppressive) is reserved for those still exacerbating despite optimised triple therapy, after exclusion of active mycobacterial infection and ECG screening for QT prolongation.\n\n(C) Roflumilast (PDE4 inhibitor) is for severe COPD with chronic bronchitis and frequent exacerbations despite triple therapy; significant GI side-effects and weight loss limit use.\n\n(D) LTOT criteria: PaO₂ ≤7.3 kPa on air, OR 7.3–8 kPa with secondary polycythaemia, peripheral oedema or pulmonary hypertension — assessed when stable on optimal therapy; not relevant before pharmacological optimisation.\n\n(E) Switching to a short-acting agent (ipratropium) from a long-acting one (tiotropium) is a step backwards in COPD therapy.\n\n💎 PEARL: COPD on LABA + LAMA still exacerbating + blood eosinophils ≥0.3 (or 100–300 with ≥2 exacerbations) → add ICS (IMPACT, ETHOS). Counsel pneumonia risk. Azithromycin and roflumilast for those still flaring.",
   references:[{label:"NICE NG115 — COPD in over 16s (2018)", url:"https://www.nice.org.uk/guidance/ng115"},{label:"GOLD 2024 Strategy", url:"https://goldcopd.org/2024-gold-report/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Tension pneumothorax — CXR",
   stem:"A 24-year-old tall, thin man presents with sudden severe right-sided pleuritic chest pain and worsening breathlessness. HR 130, BP 92/56, SpO₂ 88% on air. Trachea deviated to the left, breath sounds absent on the right, hyper-resonant percussion. The portable CXR taken before clinical assessment is shown:",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Chest_X-ray_of_pneumothorax.png",
   imageAlt:"Chest X-ray showing pneumothorax",
   options:["Erect CXR before any intervention","Immediate needle decompression in the 4th–5th intercostal space, anterior axillary line","Aspiration with a 16G cannula in the 5th intercostal space","Insertion of a 28F surgical chest drain","CT thorax to confirm the diagnosis"],
   correct:"B",
   explanation:"This is a clinical diagnosis — haemodynamic compromise with tracheal deviation and absent breath sounds is tension pneumothorax until proven otherwise. Definitive emergency management is needle decompression at the 4th–5th ICS anterior axillary line (current ATLS, replacing the older 2nd ICS mid-clavicular line approach), followed by a formal chest drain for definitive treatment.\n\n(A) Erect CXR delays intervention in a peri-arrest patient; the diagnosis is clinical.\n\n(C) Aspiration in the 5th ICS is for stable spontaneous pneumothorax — this patient is too unstable for aspiration alone.\n\n(D) Formal chest drain takes 5–10 minutes; needle decompression first, then formal drain after stabilisation.\n\n(E) CT confirmation delays life-saving treatment in a patient with classical features.\n\n💎 PEARL: Tension pneumothorax is a CLINICAL diagnosis — don't wait for CXR. Immediate needle decompression at the 4th–5th ICS anterior axillary line (current ATLS — supersedes the older 2nd ICS mid-clavicular approach), then chest drain.",
   references:[{label:"BTS Pleural Disease Guidelines (2023, Thorax)", url:"https://thorax.bmj.com/content/78/Suppl_3/s1"},{label:"NICE NG138 — Spontaneous pneumothorax", url:"https://www.nice.org.uk/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Asthma severity classification",
   stem:"A 24-year-old woman with known asthma presents with severe breathlessness over 2 hours, having used her salbutamol inhaler frequently in the past week. Examination: exhausted, unable to complete sentences, RR 32, HR 128, SpO₂ 91% on 15 L oxygen, silent chest, PEFR 32% predicted. ABG (after 30 min of treatment): pH 7.42, PaCO₂ 5.4 kPa (was 4.0 on arrival), PaO₂ 8.2 kPa.\n\nWhich is the most accurate description of her asthma severity?",
   options:["Moderate exacerbation","Acute severe asthma","Life-threatening asthma","Near-fatal asthma","Anxiety with hyperventilation"],
   correct:"C",
   explanation:"BTS/SIGN classification — life-threatening features (any one): PEFR <33%, SpO₂ <92%, silent chest, cyanosis, poor effort, exhaustion, altered consciousness, arrhythmia, hypotension. She has PEFR 32%, SpO₂ 91% on 15 L, silent chest and exhaustion → life-threatening.\n\n(A) Moderate: PEFR 50–75%, no acute severe features.\n\n(B) Acute severe: PEFR 33–50%, RR ≥25, HR ≥110, can't complete sentences — she meets HR/RR/sentence criteria but is BEYOND acute severe (silent chest and PEFR <33%).\n\n(D) Near-fatal: PaCO₂ raised (>6 kPa) ± mechanical ventilation; her PaCO₂ is normal but the trajectory (4.0 → 5.4) is concerning and signals impending exhaustion-related ventilatory failure — not yet near-fatal but anaesthetic/ICU input is now urgent.\n\n(E) Anxiety/hyperventilation does not cause silent chest, PEFR drop or hypoxia.\n\n💎 PEARL: Life-threatening asthma (any of): PEFR <33%, SpO₂ <92%, silent chest, exhaustion, cyanosis, altered consciousness, hypotension, arrhythmia. Near-fatal: raised PaCO₂ ± mechanical ventilation.",
   references:[{label:"BTS/SIGN/NICE 2024 Joint Asthma Guideline (NG244/QS25)", url:"https://www.nice.org.uk/guidance/ng244"},{label:"BTS Asthma Guidance", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/asthma/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Refractory acute asthma — escalation",
   stem:"A 28-year-old man with brittle asthma has had back-to-back nebulised salbutamol, ipratropium nebs, IV hydrocortisone 100 mg and IV magnesium sulfate 2 g over 30 minutes. PEFR remains 28% predicted, SpO₂ 88% on 15 L oxygen, HR 132. ABG: pH 7.30, PaCO₂ 6.1 kPa (rising from 4.2), PaO₂ 8.0 kPa. He looks exhausted and is becoming drowsy.\n\nWhich is the most appropriate next step?",
   options:["Continue salbutamol nebulisers and observe on the ward","Repeat IV magnesium sulfate","Anaesthetic / ICU referral for likely intubation","Heliox","Ecmo referral"],
   correct:"C",
   explanation:"Rising PaCO₂ + exhaustion + drowsiness in severe asthma despite full medical therapy (oxygen, back-to-back beta-agonist + ipratropium, IV steroid, IV magnesium) signals impending ventilatory failure — anaesthetic / ICU input is needed urgently for ventilatory support. Delay risks cardiorespiratory arrest. Once intubated, ventilation strategy is permissive hypercapnia with low respiratory rate, prolonged expiratory time, and low tidal volumes (avoid breath-stacking and dynamic hyperinflation / barotrauma).\n\n(A) Ward management is unsafe in near-fatal asthma — needs critical-care environment.\n\n(B) Repeated IV magnesium has no additional benefit and delays definitive escalation.\n\n(D) Heliox may reduce work of breathing in selected patients but is rarely available promptly and does not reverse the trajectory.\n\n(E) ECMO is a tertiary consideration, considered after intubation if conventional ventilation fails — not the immediate next step.\n\n💎 PEARL: Asthma + rising PaCO₂ + drowsy + exhausted despite full medical therapy = impending ventilatory failure. Anaesthetic/ICU input immediately. Ventilation strategy: permissive hypercapnia, low rate, prolonged expiration.",
   references:[{label:"BTS/SIGN/NICE 2024 Joint Asthma Guideline (NG244/QS25)", url:"https://www.nice.org.uk/guidance/ng244"},{label:"BTS Asthma Guidance", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/asthma/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Community-acquired pneumonia — CURB-65 severity",
   stem:"A 72-year-old man presents with fever, productive cough and right basal crackles. BP 95/62 mmHg, HR 110, RR 32, AMT 9/10. Urea 7.8 mmol/L. CXR: right lower lobe consolidation. CRP 180.\n\nWhich is the correct CURB-65 score and corresponding disposition?",
   options:["Score 1 — community management","Score 2 — short-stay ward assessment","Score 3 — severe pneumonia, hospital admission, consider HDU","Score 4 — ICU admission","Score 5 — terminal pneumonia"],
   correct:"C",
   explanation:"CURB-65 components score 1 each: Confusion (AMT ≤8 or new disorientation — 0 here, AMT 9), Urea >7 mmol/L (1 — urea 7.8), RR ≥30 (1 — RR 32), BP <90 systolic OR ≤60 diastolic (0 — BP 95/62), age ≥65 (1 — age 72). Total = 3. Score 3–5: severe pneumonia → hospital admission, consider HDU/ICU, broad-spectrum IV antibiotic per local protocol (typically co-amoxiclav + clarithromycin, or levofloxacin if penicillin allergy).\n\n(A) Score 1: outpatient management with oral antibiotic — would miss the severity here.\n\n(B) Score 2: hospital admission for short stay — under-triage.\n\n(D) Score 4 requires four points; he scores three (the systolic BP is 95, NOT <90).\n\n(E) Score 5 requires all five components — there is no 'terminal pneumonia' category, but score 4–5 carries 25–30% mortality and warrants ICU consideration.\n\n💎 PEARL: CURB-65 (1 point each): Confusion (AMT ≤8), Urea >7, RR ≥30, BP <90 systolic OR ≤60 diastolic, age ≥65. Score ≥3 = severe pneumonia, admit, consider HDU.",
   references:[{label:"BTS Pneumonia in Adults Guidelines", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/pneumonia-adults/"},{label:"NICE NG138 — Pneumonia in adults: diagnosis and management", url:"https://www.nice.org.uk/guidance/ng138"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Legionella pneumonia — antibiotic choice",
   stem:"A 56-year-old man returns from a Mediterranean holiday with high fever (39.6°C), dry cough, severe headache and confusion. Sodium 128 mmol/L, lymphopenia, mildly raised transaminases. Urinary antigen positive for Legionella pneumophila serogroup 1.\n\nWhich is the most appropriate antibiotic?",
   options:["Amoxicillin 500 mg three times daily","Co-amoxiclav 625 mg three times daily","Levofloxacin 500 mg daily","Vancomycin","Ceftriaxone alone"],
   correct:"C",
   explanation:"Legionella is an intracellular pathogen — beta-lactams cannot penetrate. Levofloxacin is first-line; macrolides (clarithromycin, azithromycin) and doxycycline are alternatives. Notify Public Health (notifiable disease in the UK). Classic features: hyponatraemia (SIADH), confusion, raised transaminases, lymphopenia, GI symptoms (diarrhoea), recent travel, hot tubs or contaminated water systems.\n\n(A) Amoxicillin is first-line for typical CAP (Streptococcus pneumoniae) — does NOT cover intracellular Legionella; this patient would deteriorate on amoxicillin alone.\n\n(B) Co-amoxiclav extends Gram-negative cover but the beta-lactam still does not penetrate intracellularly to kill Legionella.\n\n(D) Vancomycin is for MRSA / Gram-positive resistant infection — no Legionella activity.\n\n(E) Ceftriaxone alone misses Legionella (intracellular); combine with macrolide for severe CAP if Legionella suspected, or use levofloxacin monotherapy when confirmed.\n\n💎 PEARL: Travel + dry cough + confusion + hyponatraemia + raised LFTs + lymphopenia + positive urinary antigen = Legionella. Beta-lactams DO NOT work (intracellular). Levofloxacin first-line. Notifiable.",
   references:[{label:"BTS Pneumonia in Adults Guidelines", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/pneumonia-adults/"},{label:"NICE NG138 — Pneumonia in adults", url:"https://www.nice.org.uk/guidance/ng138"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Hospital-acquired pneumonia — antibiotic choice",
   stem:"A 78-year-old man hospitalised for 7 days post-stroke develops new fever 38.4°C, productive cough and right lower zone consolidation on CXR. He has had no recent antibiotics and no known MRSA carriage. Local guidance recommends piperacillin-tazobactam unless MRSA risk.\n\nWhich is the most appropriate empirical antibiotic?",
   options:["Oral amoxicillin","IV co-amoxiclav","IV piperacillin-tazobactam","Oral doxycycline","IV cefuroxime monotherapy"],
   correct:"C",
   explanation:"Hospital-acquired pneumonia (HAP) — onset >48 hours after admission — requires broader cover than CAP for nosocomial Gram-negative pathogens including Pseudomonas, plus consideration of MRSA. Piperacillin-tazobactam (or a carbapenem) is the standard empirical choice in UK practice; add vancomycin / teicoplanin if MRSA risk factors (recent admission, long-term care, known carriage, dialysis). De-escalate based on culture sensitivities and clinical response — typical course 5–7 days for uncomplicated HAP.\n\n(A) Amoxicillin is first-line for typical CAP — narrow spectrum, misses Gram-negatives and Pseudomonas.\n\n(B) Co-amoxiclav extends to some Gram-negatives but lacks reliable Pseudomonas cover — inadequate for HAP.\n\n(D) Doxycycline covers atypicals — inappropriate first-line for HAP.\n\n(E) Cefuroxime has no Pseudomonas activity — inadequate for HAP and increasingly avoided due to C. difficile risk.\n\n💎 PEARL: Hospital-acquired pneumonia (>48 h after admission): broader cover than CAP for nosocomial Gram-negatives including Pseudomonas. Piperacillin-tazobactam empirically; add vancomycin for MRSA risk. De-escalate on culture.",
   references:[{label:"BTS Pneumonia in Adults Guidelines", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/pneumonia-adults/"},{label:"NICE NG138 — Pneumonia in adults", url:"https://www.nice.org.uk/guidance/ng138"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Massive haemoptysis — initial management",
   stem:"A 65-year-old man with bronchiectasis presents with 800 mL fresh haemoptysis over 24 hours, ongoing. SpO₂ 88% on 15 L oxygen, HR 130, BP 100/64. CT thorax: a left lower lobe cavitating lesion. He is on rivaroxaban for AF.\n\nWhich is the most appropriate immediate priority?",
   options:["IV tranexamic acid alone and observe","Position bleeding side dependent (left lateral decubitus); secure airway; reverse anticoagulation; urgent CT angiography → bronchial artery embolisation","Immediate emergency thoracotomy","IV antibiotics alone","Non-invasive ventilation (Bipap)"],
   correct:"B",
   explanation:"Massive haemoptysis (>200 mL in one episode or >600 mL in 24 hours) is an AIRWAY emergency — death is from asphyxiation, not exsanguination. Sequence: position with the bleeding side DOWN (left lateral decubitus when the bleed is left-sided — gravity protects the unaffected lung from soiling); secure the airway with a large-bore endotracheal tube (≥8.0) to allow bronchoscopy and balloon tamponade; reverse anticoagulation (PCC for rivaroxaban / apixaban; idarucizumab for dabigatran); urgent CT angiography to localise the source; bronchial artery embolisation is first-line definitive treatment (~85% success). Surgery is reserved for refractory cases or those unsuitable for embolisation.\n\n(A) Tranexamic acid as adjunct may help (HALT-IT does not extend to airway haemoptysis but inhaled or systemic TXA is sometimes used) — alone, it is inadequate without source control.\n\n(C) Emergency thoracotomy carries very high mortality and is only for embolisation failure.\n\n(D) Antibiotics treat infection but do not stop active bleeding.\n\n(E) BiPAP increases risk of aspiration of blood and barotrauma; intubation is preferred for airway protection.\n\n💎 PEARL: Massive haemoptysis (>200 mL once or >600 mL/24 h) is an AIRWAY emergency — death is asphyxiation, not blood loss. Bleeding side DOWN, secure airway, reverse anticoagulation, urgent CT angio → bronchial artery embolisation.",
   references:[{label:"BTS Lung Cancer Guidance", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/lung-cancer/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"PE — PERC rule",
   stem:"A 45-year-old woman presents with pleuritic chest pain and breathlessness. HR 72, BP 124/78, SpO₂ 97% on air. No leg symptoms, no haemoptysis, no previous VTE, not pregnant, no recent surgery or immobilisation, no active cancer, no oestrogen use. Wells score 0 (low pre-test probability).\n\nWhich is the most appropriate next step?",
   options:["Empirical anticoagulation","CTPA without further risk stratification","Ventilation-perfusion scan","Apply perc rule — if all 8 criteria are negative in a low-pre-test-probability patient, no further PE testing is required","D-dimer in all suspected PE regardless of probability"],
   correct:"D",
   explanation:"PERC (Pulmonary Embolism Rule-out Criteria) — applied to LOW pre-test-probability patients (Wells <2 / clinician gestalt low), all 8 criteria negative excludes PE without further testing: age <50, HR <100, SpO₂ ≥95%, no haemoptysis, no oestrogen use, no prior VTE, no recent surgery / trauma, no unilateral leg swelling. PERC reduces unnecessary D-dimer and CTPA in low-risk patients. She fulfils all 8 — no further testing. If Wells ≥4: proceed directly to CTPA. If Wells <4 and PERC fails: use age-adjusted D-dimer (cutoff = age × 10 ng/mL in patients >50).\n\n(A) Empirical anticoagulation in low pre-test probability with PERC negative exposes the patient to bleeding risk without benefit.\n\n(B) CTPA in PERC-negative low-risk patients exposes to radiation and contrast risks unnecessarily.\n\n(C) V/Q scan is an alternative to CTPA when CTPA contraindicated (renal impairment, contrast allergy, pregnancy) — but the test itself is not needed here.\n\n(E) D-dimer is NOT mandatory in all suspected PE — PERC obviates the need in low-risk patients.\n\n💎 PEARL: PERC: low pre-test probability + all 8 criteria negative = no further PE testing. Criteria: age <50, HR <100, SpO₂ ≥95%, no haemoptysis, no oestrogen, no prior VTE, no recent surgery or trauma, no unilateral leg swelling.",
   references:[{label:"ESC 2019 Pulmonary Embolism Guidelines (PERC criteria)", url:"https://academic.oup.com/eurheartj/article/41/4/543/5556136"},{label:"Kline et al. — PERC Rule (2008)", url:"https://onlinelibrary.wiley.com/doi/10.1111/j.1538-7836.2008.02944.x"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Pleural effusion — Light's criteria",
   stem:"A 60-year-old woman with progressive breathlessness has a unilateral right-sided pleural effusion drained for diagnostic analysis. Pleural fluid: protein 38 g/L, LDH 280 U/L. Serum: protein 64 g/L, LDH 220 U/L (normal upper limit 250). Which classification is correct?",
   options:["Transudate — consider heart failure, hypoalbuminaemia, cirrhosis","Exudate — consider infection, malignancy, PE, pancreatitis, connective tissue disease","Indeterminate — repeat the sample","Empyema — frank pus","Haemothorax"],
   correct:"B",
   explanation:"Light's criteria classify pleural fluid as exudate if ANY of: pleural protein/serum protein >0.5; pleural LDH/serum LDH >0.6; pleural LDH > two-thirds of upper-limit-normal serum LDH. This sample: protein ratio 38/64 = 0.59 (>0.5 ✓); LDH ratio 280/220 = 1.27 (>0.6 ✓); pleural LDH 280 > 0.67 × 250 = 167 (✓). All three are positive — exudate. Causes of exudate: infection (parapneumonic / empyema, TB), malignancy (lung, breast, lymphoma, mesothelioma), pulmonary embolism, pancreatitis, connective tissue disease (RA, SLE), drug-induced. Causes of transudate: heart failure (most common), hypoalbuminaemia, cirrhosis, nephrotic syndrome, peritoneal dialysis.\n\n(A) Transudate would have protein ratio ≤0.5 and LDH ratio ≤0.6 — not fitting here.\n\n(C) The criteria are met clearly — no need to repeat.\n\n(D) Empyema is frank pus or pH <7.2 in the setting of infection — fluid was clear (not specified pus); empyema is a subset of exudate.\n\n(E) Haemothorax has visible blood and pleural haematocrit >50% of peripheral blood — not described here.\n\n💎 PEARL: Light's criteria — exudate if ANY of: pleural/serum protein >0.5, pleural/serum LDH >0.6, or pleural LDH > 2/3 upper-limit-normal serum LDH. Exudate = infection, malignancy, PE, pancreatitis, CTD.",
   references:[{label:"BTS Pleural Disease Guidelines (2023, Thorax)", url:"https://thorax.bmj.com/content/78/Suppl_3/s1"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Complicated parapneumonic effusion / empyema",
   stem:"A 58-year-old man being treated for left lower lobe community-acquired pneumonia develops a moderate left pleural effusion. He remains febrile despite 48 hours of IV co-amoxiclav. Diagnostic aspirate (uss-guided): cloudy fluid, pH 6.8, glucose 1.5 mmol/L, LDH 1800 U/L. Gram stain: Gram-positive cocci in chains.\n\nWhich is the most appropriate next step?",
   options:["Continue IV antibiotics alone","Intercostal chest drain insertion","Therapeutic aspiration only","Closed pleural biopsy","Bronchoscopy"],
   correct:"B",
   explanation:"BTS pleural infection guideline. Indications for chest drain in pleural infection: pleural fluid pH <7.2 in the setting of likely parapneumonic effusion, frank pus (empyema), or positive Gram stain / culture. This sample meets all three. Drain choice: small-bore (10–14 Fr) is generally adequate and better tolerated than large-bore. Empirical IV antibiotics for community-acquired empyema include broad-spectrum cover with anaerobic activity. Intrapleural alteplase + DNase improves drainage of loculated empyema (MIST-2 trial — combination superior to either agent alone or placebo). Refer to thoracic surgery (VATS decortication) for refractory disease.\n\n(A) Antibiotics alone are inadequate for established empyema or complicated parapneumonic effusion.\n\n(C) Therapeutic aspiration only (without drain) typically fails for empyema or pH <7.2 — fluid reaccumulates.\n\n(D) Pleural biopsy is for suspected malignancy or TB on dry tap, not for established empyema.\n\n(E) Bronchoscopy is appropriate when looking for endobronchial obstruction (e.g. malignancy as cause of post-obstructive pneumonia) — not first-line for empyema management.\n\n💎 PEARL: Pleural fluid pH <7.2, frank pus, or positive Gram stain → chest drain (small-bore adequate). Intrapleural alteplase + DNase for loculated empyema (MIST-2 trial). VATS decortication if refractory.",
   references:[{label:"BTS Pleural Disease Guidelines (2023)", url:"https://thorax.bmj.com/content/78/Suppl_3/s1"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"PCP in advanced HIV — antimicrobial therapy",
   stem:"A 32-year-old man with newly diagnosed HIV (CD4 80) presents with 3 weeks of progressive exertional dyspnoea, dry cough and 5 kg weight loss. SpO₂ 92% at rest on air, drops to 86% on exertion. CXR: bilateral perihilar interstitial infiltrates. LDH 580 U/L. ABG on air: PaO₂ 8.4 kPa.\n\nWhich is the most appropriate empirical antimicrobial therapy?",
   options:["High-dose IV co-trimoxazole 21 days plus adjunctive prednisolone","Voriconazole 200 mg twice daily","IV liposomal amphotericin B","Oral fluconazole","Standard four-drug anti-tuberculous therapy"],
   correct:"A",
   explanation:"Pneumocystis jirovecii pneumonia (PCP) is the leading AIDS-defining pneumonia. Clinical and radiological features here are classical (subacute progression, exertional desaturation, perihilar infiltrates, raised LDH, low CD4). Treatment: high-dose co-trimoxazole IV (15–20 mg/kg/day TMP component, divided 6-hourly) for 21 days; adjunctive prednisolone for moderate-severe disease (PaO₂ <9.3 kPa on air OR A–a gradient >35 mmHg) reduces respiratory failure and mortality. Diagnosis confirmed by induced sputum or BAL with silver / immunofluorescence / PCR staining. Start ART within 2 weeks (no later than completion of treatment); risk of immune reconstitution inflammatory syndrome but earlier ART improves outcomes (ACTG A5164).\n\n(B) Voriconazole is for invasive aspergillosis.\n\n(C) Liposomal amphotericin B is for invasive fungal infection (cryptococcus, histoplasma, severe aspergillus).\n\n(D) Fluconazole is for cryptococcal and candidal infection.\n\n(E) ATT would treat TB — would not cover PCP, and the radiological pattern here is not typical pulmonary TB.\n\n💎 PEARL: Subacute dyspnoea + exertional desaturation + perihilar infiltrates + raised LDH + low CD4 = PCP. High-dose IV co-trimoxazole 21 days + adjunctive prednisolone if PaO₂ <9.3 kPa on air. Start ART within 2 weeks.",
   references:[{label:"BHIVA Guidelines (2023)", url:"https://www.bhiva.org/guidelines"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Acute exacerbation of COPD — initial management",
   stem:"A 72-year-old man with COPD (FEV1 45% predicted) presents with 3 days of increased breathlessness, increased sputum volume and new sputum purulence. RR 24, SpO₂ 89% on air, target 88–92%. CXR: no consolidation. ABG: pH 7.36, PaCO₂ 6.0 kPa, PaO₂ 7.4 kPa. He is admitted to the ward.\n\nWhich is the most appropriate initial management?",
   options:["Nebulised bronchodilators alone","Bronchodilators, controlled oxygen 88–92%, oral amoxicillin (or doxycycline) 5 days, oral prednisolone 30 mg 5 days","Bronchodilators + 14 days of antibiotics + 14 days of prednisolone","NIV (Bipap) immediately","Long-term azithromycin commenced from admission"],
   correct:"B",
   explanation:"NICE NG114 acute exacerbation of COPD: increase short-acting bronchodilators (salbutamol nebs, ipratropium nebs); controlled oxygen targeting 88–92% SpO₂ in chronic type 2 respiratory failure (excessive O₂ worsens hypercapnia via V/Q mismatch and the Haldane effect); antibiotic if sputum is purulent or pneumonia is suspected — amoxicillin or doxycycline 5 days first-line (5 days adequate per NICE; macrolide if penicillin-allergic). Oral prednisolone 30 mg for 5 days (REDUCE trial — equivalent to longer courses). NIV (BiPAP) for persistent type 2 respiratory failure (pH <7.35, PaCO₂ >6) DESPITE optimal medical therapy and controlled oxygen.\n\n(A) Bronchodilators alone miss antibiotics (purulent sputum) and steroid (reduces hospital stay and treatment failure).\n\n(C) 14-day courses are unnecessary and increase side effects without additional benefit (REDUCE trial).\n\n(D) NIV is reserved for persistent T2RF after optimal medical therapy — not first-line; this patient has pH 7.36, PaCO₂ 6.0 — not yet meeting criteria for NIV.\n\n(E) Long-term azithromycin is for selected patients with frequent exacerbations after optimisation of inhaled therapy and smoking cessation — not in the acute setting.\n\n💎 PEARL: AECOPD: controlled O₂ 88–92% (uncontrolled O₂ worsens hypercapnia via Haldane and V/Q), bronchodilators, prednisolone 30 mg × 5 days (REDUCE), antibiotic if purulent. NIV if pH <7.35 + PaCO₂ >6 despite optimal therapy.",
   references:[{label:"NICE NG115 — COPD in over 16s (2018)", url:"https://www.nice.org.uk/guidance/ng115"},{label:"GOLD 2024 Strategy", url:"https://goldcopd.org/2024-gold-report/"}]},

  {section:"respiratory", specialty:"Cardiology", topic:"Acute cardiogenic pulmonary oedema",
   stem:"A 78-year-old man wakes at 03:00 with sudden severe breathlessness, sitting bolt upright. BP 162/92 mmHg, HR 106, RR 32, SpO₂ 88% on air. Bilateral fine crackles to mid-zones, raised JVP, third heart sound. ECG: AF with rapid ventricular response. NT-proBNP 4500 ng/L. CXR: bilateral perihilar 'bat-wing' interstitial shadowing.\n\nWhich is the most appropriate immediate management?",
   options:["IV crystalloid 1 L bolus","Sit upright; oxygen to SpO₂ ≥94%; IV furosemide 40–80 mg; IV/SL nitrate; CPAP if persistently hypoxic; address rapid AF","IV beta-blocker as first step","NIV (Bipap) immediately","IV thrombolysis"],
   correct:"B",
   explanation:"Acute cardiogenic pulmonary oedema is a hypertensive heart failure syndrome — the priority is preload and afterload reduction with airway support. Standard ladder: position upright (improves V/Q matching, reduces venous return); high-flow oxygen to ≥94%; IV loop diuretic (furosemide 40–80 mg — quicker venodilation than diuresis); IV/SL nitrate if SBP allows (reduces preload and afterload — caution in severe AS); CPAP for refractory hypoxaemia (improves work of breathing and oxygenation; may avoid intubation; reduces preload); treat the precipitant — here, the rapid AF. TTE for LV function, valvular cause, ACS workup.\n\n(A) Fluid bolus would worsen pulmonary oedema.\n\n(C) IV beta-blocker as the FIRST step risks worsening cardiac output before perfusion is supported and pulmonary congestion addressed; rate control comes after diuresis and oxygen.\n\n(D) NIV (BiPAP) is for hypercapnic respiratory failure — CPAP is preferred in cardiogenic pulmonary oedema (continuous distending pressure reduces preload).\n\n(E) Thrombolysis has no role unless there is concurrent STEMI / massive PE — neither is described.\n\n💎 PEARL: Acute pulmonary oedema: sit upright, oxygen, IV furosemide, IV/SL nitrate (if SBP allows — caution in severe AS), CPAP if refractory hypoxaemia. Treat the precipitant — here rapid AF. Avoid fluid bolus and acute IV beta-blockers.",
   references:[{label:"NICE NG106 — Chronic heart failure (covers acute decompensation)", url:"https://www.nice.org.uk/guidance/ng106"},{label:"ESC 2021 Heart Failure Guidelines", url:"https://academic.oup.com/eurheartj/article/42/36/3599/6358045"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Pulmonary embolism — risk stratification",
   stem:"A 62-year-old man is diagnosed with a saddle pulmonary embolism on CTPA. BP 118/72 mmHg (sustained), HR 96, SpO₂ 94% on air, lactate 2.0. Bedside echo: RV dilatation with reduced tapse. Troponin mildly raised. Pesi score III (intermediate-high). No bleeding risk.\n\nWhich is the most appropriate management?",
   options:["Outpatient anticoagulation with apixaban","Admission with anticoagulation (LMWH or DOAC) and close monitoring on a high-dependency or specialist bed; rescue thrombolysis if haemodynamic deterioration","Immediate systemic thrombolysis","IVC filter as first-line","Aspirin alone"],
   correct:"B",
   explanation:"ESC PE risk stratification: HIGH-RISK — sustained hypotension or shock → systemic thrombolysis; INTERMEDIATE-HIGH — haemodynamically stable + RV dysfunction on imaging + raised cardiac biomarkers → admit, anticoagulate, monitor closely on HDU / specialist bed for clinical deterioration, rescue thrombolysis (or catheter-directed thrombolysis) if decompensates; INTERMEDIATE-LOW — RV dysfunction OR raised biomarkers (not both) → admission, anticoagulation; LOW-RISK — sPESI 0 / PESI I–II AND no RV dysfunction or raised biomarkers → outpatient management may be appropriate. This patient is intermediate-high (RV dysfunction AND raised troponin).\n\n(A) Outpatient management is unsafe in intermediate-high-risk PE — close monitoring needed.\n\n(C) Immediate systemic thrombolysis in stable intermediate-high PE has unfavourable bleeding-to-benefit ratio (PEITHO) — reserve for clinical deterioration.\n\n(D) IVC filters are for absolute contraindications to anticoagulation or recurrent PE despite anticoagulation — not first-line.\n\n(E) Aspirin is inadequate anticoagulation in acute PE.\n\n💎 PEARL: Intermediate-high PE = stable + RV dysfunction + raised troponin → admit, anticoagulate, monitor on HDU; rescue thrombolysis if decompensates. Don't routinely thrombolyse stable patients — bleeding risk outweighs benefit.",
   references:[{label:"NICE NG158 — VTE diseases: diagnosis, management, thrombophilia testing (2020)", url:"https://www.nice.org.uk/guidance/ng158"},{label:"ESC 2019 PE Guidelines", url:"https://academic.oup.com/eurheartj/article/41/4/543/5556136"},{label:"BTS PE Guidelines", url:"https://www.brit-thoracic.org.uk/quality-improvement/clinical-statements/pulmonary-embolism/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Bronchiectasis — diagnosis and aetiology workup",
   stem:"A 58-year-old non-smoking woman has a 3-year history of chronic productive cough with copious purulent sputum, recurrent chest infections (5 in the past year), and intermittent haemoptysis. Sputum culture: Pseudomonas aeruginosa.\n\nWhich is the most likely diagnosis?",
   options:["Idiopathic pulmonary fibrosis","Bronchiectasis","Chronic obstructive pulmonary disease","Asthma","Sarcoidosis"],
   correct:"B",
   explanation:"Bronchiectasis: chronic productive cough with copious sputum, recurrent infections, and intermittent haemoptysis. HRCT confirms. Management: airway clearance is the cornerstone (chest physiotherapy, devices); vaccinate (influenza, pneumococcal); treat exacerbations promptly with prolonged courses (often 14 days), covering Pseudomonas if colonised; long-term azithromycin reduces exacerbations in those with frequent flares (BLESS, EMBRACE, BAT trials). Investigate for underlying cause: cystic fibrosis (sweat test, CFTR genetic testing — even in adults), primary ciliary dyskinesia, immunoglobulin deficiency (IgG, IgA, IgM, IgG subclasses, vaccine response), ABPA (total IgE, Aspergillus precipitins), alpha-1 antitrypsin deficiency, post-infective (TB, severe pneumonia), connective-tissue disease (RA, Sjögren).\n\n(A) IPF gives basal honeycombing and clubbing — not bronchial dilatation; cough is dry.\n\n(C) COPD gives airflow obstruction in a smoker, with emphysema or chronic bronchitis pattern; bronchiectasis can coexist but the HRCT pattern here is primarily bronchiectatic.\n\n(D) Asthma gives reversible airflow obstruction with no airway dilatation.\n\n(E) Sarcoidosis gives bilateral hilar lymphadenopathy and reticulonodular parenchymal disease, not the bronchiectatic pattern.\n\n💎 PEARL: Chronic productive cough + recurrent infections + 'signet ring' on HRCT (bronchus larger than artery) = bronchiectasis. Investigate underlying cause: CF (sweat test in adults too), PCD, immunoglobulin deficiency, ABPA. Airway clearance is the cornerstone.",
   references:[{label:"BTS Guidelines for Bronchiectasis in Adults (2019)", url:"https://thorax.bmj.com/content/74/Suppl_1/1"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Cystic fibrosis in adults — disease-modifying therapy",
   stem:"A 25-year-old man with cystic fibrosis (homozygous F508del genotype) has FEV1 50% predicted, recurrent Pseudomonas aeruginosa exacerbations, pancreatic insufficiency on Creon, and CF-related diabetes on insulin. He is on inhaled hypertonic saline and dornase alfa, with chest physiotherapy twice daily. He is reviewed in the adult CF clinic.\n\nWhich is the most appropriate addition to address the underlying CFTR defect?",
   options:["Increase inhaled corticosteroid","Elexacaftor / tezacaftor / ivacaftor (Kaftrio)","Long-term oral prednisolone","Bronchodilator monotherapy","Lung transplantation as first-line"],
   correct:"B",
   explanation:"Adult CF care is delivered by specialist multidisciplinary CF centres. Pillars of management: airway clearance (chest physiotherapy, dornase alfa, hypertonic saline); aggressive treatment of exacerbations with culture-directed antibiotics (often two anti-pseudomonal agents IV for 14 days for severe exacerbations); CFTR modulator therapy — for F508del-bearing genotypes (~90% of patients), elexacaftor / tezacaftor / ivacaftor (Kaftrio) is transformative, improving FEV1, reducing exacerbations and improving quality of life (VX17-445-102 trial); ivacaftor alone for gating mutations (G551D); pancreatic enzyme replacement (Creon); CF-related diabetes management; nutritional support (high-calorie); vaccinations; lung transplantation eligibility in advanced disease. Genetic counselling for partners.\n\n(A) ICS has no role in CF unless coexisting asthma.\n\n(C) Long-term oral steroid carries unacceptable cumulative morbidity — only for selected severe exacerbations or refractory ABPA.\n\n(D) Bronchodilator monotherapy treats one component; misses CFTR modulator (the disease-modifying breakthrough), enzyme replacement, and antimicrobial strategy.\n\n(E) Lung transplantation is reserved for advanced disease (FEV1 <30%, frequent exacerbations, declining despite optimal therapy) — not first-line at FEV1 50%.\n\n💎 PEARL: Adult CF with F508del-bearing genotype: elexacaftor/tezacaftor/ivacaftor (Kaftrio) is transformative — improves FEV1, reduces exacerbations. Ivacaftor alone for gating mutations (G551D). MDT specialist CF centre delivery essential.",
   references:[{label:"NICE NG78 — Cystic fibrosis: diagnosis and management", url:"https://www.nice.org.uk/guidance/ng78"},{label:"CF Trust UK Guidelines", url:"https://www.cysticfibrosis.org.uk/the-work-we-do/clinical-care/consensus-documents"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Small cell lung cancer — extensive stage",
   stem:"A 68-year-old smoker (45 pack-years) presents with 6 weeks of weight loss, dry cough and confusion. Sodium 122 mmol/L (SIADH biochemistry — low plasma osmolality 258, high urine osmolality 480, urine Na⁺ 65). CT thorax/abdomen/pelvis: 4 cm central right hilar mass with bulky mediastinal lymphadenopathy and liver metastases. Bronchoscopy + biopsy: small cell lung carcinoma. ECOG performance status 1.\n\nWhich is the most appropriate first-line therapy?",
   options:["Surgical resection","Platinum-etoposide chemotherapy plus immunotherapy (atezolizumab or durvalumab)","Best supportive care alone","EGFR tyrosine kinase inhibitor","Stereotactic radiotherapy alone"],
   correct:"B",
   explanation:"Small cell lung cancer (~15% of lung cancers) is highly chemo- and radiosensitive but typically presents with extensive disease and recurs early; median survival 8–13 months. First-line for extensive-stage SCLC: platinum-etoposide chemotherapy PLUS immunotherapy (atezolizumab — IMpower133, or durvalumab — CASPIAN trial), with modest survival benefit. Limited-stage disease: concurrent chemoradiotherapy. Prophylactic cranial irradiation reduces brain metastases in good responders. Paraneoplastic syndromes are common: SIADH (here), ectopic ACTH (Cushing's), Lambert-Eaton myasthenic syndrome. Manage SIADH with fluid restriction, demeclocycline or tolvaptan; treat the cancer. Smoking cessation and palliative care input from diagnosis.\n\n(A) SCLC is rarely operable — micrometastatic disease is almost always present at diagnosis.\n\n(C) Best supportive care is reasonable for ECOG 4 / very poor prognosis — this patient is ECOG 1 and treatable.\n\n(D) EGFR-TKIs treat EGFR-mutated NSCLC adenocarcinoma — wrong tumour type.\n\n(E) Stereotactic radiotherapy treats localised disease — does not address widespread metastases.\n\n💎 PEARL: Extensive-stage SCLC: platinum-etoposide + immunotherapy (atezolizumab — IMpower133, or durvalumab — CASPIAN). Watch for paraneoplastic SIADH, ectopic ACTH, Lambert-Eaton. Limited-stage: concurrent chemoradiotherapy + prophylactic cranial irradiation.",
   references:[{label:"NICE NG122 — Lung cancer (2019)", url:"https://www.nice.org.uk/guidance/ng122"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"NSCLC — EGFR-mutated advanced disease",
   stem:"A 60-year-old non-smoking woman of East Asian heritage has stage IV adenocarcinoma of the lung (bone and brain metastases). Tumour molecular profiling: EGFR exon 19 deletion. PD-L1 30%. ALK / ROS1 / KRAS / BRAF wild-type. ECOG performance status 1. She has had whole-brain radiotherapy with good symptomatic response.\n\nWhich is the most appropriate first-line systemic therapy?",
   options:["Platinum-doublet chemotherapy alone","Osimertinib","Best supportive care","Curative surgical lobectomy","Pembrolizumab monotherapy"],
   correct:"B",
   explanation:"Advanced non-squamous NSCLC management is now driven by molecular profiling. For sensitising EGFR mutations (exon 19 deletion or L858R), osimertinib (third-generation EGFR-TKI) is first-line — superior PFS and OS vs first-generation TKIs (FLAURA trial), with better CNS penetration (relevant here given brain metastases). Other matched targeted therapies in advanced non-squamous NSCLC: ALK (alectinib, brigatinib, lorlatinib); ROS1 (crizotinib, entrectinib); BRAF V600E (dabrafenib + trametinib); KRAS G12C (sotorasib, adagrasib); RET (selpercatinib); MET exon 14 (capmatinib, tepotinib); NTRK (larotrectinib, entrectinib); HER2 (trastuzumab deruxtecan). For tumours WITHOUT driver mutations, immunotherapy decisions are guided by PD-L1 (KEYNOTE-024, KEYNOTE-189). Liquid biopsy (ctDNA) is increasingly used.\n\n(A) Chemotherapy alone is inferior to TKI in EGFR-mutated disease — TKIs deliver better PFS, response and quality of life.\n\n(C) Best supportive care is for ECOG 4 / very poor prognosis — she is ECOG 1 with a highly treatable molecular subtype.\n\n(D) Stage IV disease is incurable — surgery has no role.\n\n(E) Pembrolizumab as monotherapy is reserved for PD-L1 ≥50% AND no driver mutation — EGFR-mutated tumours respond poorly to single-agent immunotherapy and have higher pneumonitis risk if combined with TKIs.\n\n💎 PEARL: Advanced non-squamous NSCLC: molecular profile FIRST. EGFR exon 19 deletion or L858R → osimertinib (FLAURA — superior PFS/OS, better CNS penetration). Don't reach for immunotherapy or chemo before checking driver mutations.",
   references:[{label:"NICE NG122 — Lung cancer (2019)", url:"https://www.nice.org.uk/guidance/ng122"},{label:"ESMO Metastatic NSCLC Guidelines (2023)", url:"https://www.esmo.org/guidelines/lung-and-chest-tumours"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Severe obstructive sleep apnoea — first-line therapy",
   stem:"A 52-year-old man (BMI 38) reports loud snoring, witnessed apnoeas, daytime somnolence (Epworth Sleepiness Scale 16/24) and morning headaches. He has resistant hypertension despite three antihypertensives and a history of AF. Polysomnography: ahi 38 events/h with frequent oxygen desaturations to <90%. He drives an HGV.\n\nWhich is the most appropriate first-line management?",
   options:["Continuous positive airway pressure (CPAP)","Long-term oral prednisolone","Long-term thiazide diuretic","Aspirin 75 mg daily","Long-term oral theophylline"],
   correct:"A",
   explanation:"OSA severity classification by apnoea-hypopnoea index (AHI): mild 5–14, moderate 15–29, severe ≥30. Severe OSA causes cardiovascular morbidity (resistant hypertension, AF, stroke, MI), metabolic disturbance, daytime sleepiness and accidents. CPAP is first-line and most effective treatment — adherence is critical (target ≥4 hours/night). Adjuncts: weight loss (≥10% body weight is highly effective); mandibular advancement device for mild-moderate disease or CPAP intolerance; positional therapy; bariatric surgery, hypoglossal nerve stimulation, or upper airway surgery in selected patients. DVLA: HGV (Group 2) drivers must inform the DVLA, stop driving until effective treatment confirmed and documented adherence — much stricter than Group 1.\n\n(B) Steroids have no role in OSA; would worsen weight gain.\n\n(C) Diuretic does not address the upper airway obstruction; this patient already has resistant HT — addition unlikely to help and may worsen sleep.\n\n(D) Aspirin is appropriate for cardiovascular secondary prevention but does not treat OSA; he likely needs anticoagulation for AF, not aspirin.\n\n(E) Theophylline has no current role in OSA; toxic narrow therapeutic window.\n\n💎 PEARL: Severe OSA (AHI ≥30) + daytime sleepiness + cardiovascular sequelae: CPAP first-line. Adherence (≥4 h/night) is critical. HGV drivers must inform DVLA and stop driving until effective treatment confirmed. Weight loss ≥10% is highly effective adjunct.",
   references:[{label:"NICE NG202 — OSA, OHS, COPD-OSA Overlap (2021)", url:"https://www.nice.org.uk/guidance/ng202"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Eosinophilic granulomatosis with polyangiitis (EGPA)",
   stem:"A 50-year-old man with adult-onset asthma, chronic rhinosinusitis with nasal polyps and eosinophilia (3.4 × 10⁹/L) presents with new foot drop (mononeuritis multiplex), purpuric rash on his lower limbs and fleeting pulmonary infiltrates. ANCA: p-ANCA / MPO positive. Renal function normal.\n\nWhich is the most likely diagnosis?",
   options:["Asthma exacerbation","Eosinophilic granulomatosis with polyangiitis (EGPA, formerly Churg–Strauss)","Allergic rhinitis only","Allergic bronchopulmonary aspergillosis","Sarcoidosis"],
   correct:"B",
   explanation:"EGPA: small-to-medium-vessel ANCA-associated vasculitis. Three classic phases: prodromal (asthma, rhinosinusitis with polyps); eosinophilic (peripheral eosinophilia, infiltrative organ involvement — pulmonary, GI, cardiac); vasculitic (mononeuritis multiplex, palpable purpura, cardiac involvement, glomerulonephritis). MPO / p-ANCA positive in ~30–40%. Five-Factor Score (cardiac, GI, severe renal, severe neurological, age) guides intensity: high-dose corticosteroids alone for limited disease; add cyclophosphamide or rituximab for severe organ involvement. Cardiac involvement is the major cause of death — needs urgent imaging and aggressive treatment. Mepolizumab (anti-IL-5) reduces relapses (MIRRA trial).\n\n(A) Asthma exacerbation does not cause mononeuritis multiplex, purpura, myocarditis or ANCA positivity.\n\n(C) Allergic rhinitis is upper-airway atopy without systemic vasculitis.\n\n(D) ABPA causes worsening asthma + central bronchiectasis + Aspergillus serology — no vasculitis or ANCA.\n\n(E) Sarcoidosis can affect lungs, heart and nerves but the histology is non-caseating granuloma without vasculitis or eosinophilia, and ANCA is negative.\n\n💎 PEARL: Adult-onset asthma + nasal polyps + eosinophilia + mononeuritis multiplex + purpura ± cardiac involvement + p-ANCA/MPO = EGPA. Cardiac involvement is the major killer. Steroids ± cyclophosphamide or rituximab for severe disease; mepolizumab for relapses.",
   references:[{label:"EULAR/ERA-EDTA AAV Guidelines (2023 update)", url:"https://ard.bmj.com/content/82/1/30"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Pulmonary arterial hypertension (Group 1)",
   stem:"A 38-year-old woman has 6 months of progressive exertional dyspnoea and pre-syncope. Examination: loud P2, parasternal heave, raised JVP with a prominent v wave, peripheral oedema. Echo: RV dilatation, estimated systolic pap 78 mmHg, normal LV systolic function. Right heart catheterisation: mpap 52 mmHg, PCWP 8 mmHg, PVR 10 Wood units. CTPA negative for chronic thromboembolic disease; lung function and HRCT normal; HIV and connective-tissue disease screen negative.\n\nWhich is the most likely diagnosis?",
   options:["Heart failure with reduced ejection fraction","Pulmonary arterial hypertension (Group 1)","Chronic obstructive pulmonary disease","Heart failure with preserved ejection fraction","Stable angina"],
   correct:"B",
   explanation:"Pulmonary hypertension is mean pulmonary artery pressure ≥20 mmHg at rest, confirmed by right heart catheterisation. PCWP <15 with raised PVR ≥2 Wood units defines pre-capillary PH; PCWP >15 indicates post-capillary (Group 2). This patient is pre-capillary with normal LV, normal lungs and negative CTPA — Group 1 PAH. Management: refer to specialist PH centre; risk-stratify (REVEAL or ESC/ERS); initial combination therapy (endothelin-receptor antagonist — ambrisentan / macitentan / bosentan + PDE5 inhibitor — sildenafil / tadalafil) in low-intermediate risk; add prostacyclin agents (selexipag, treprostinil, IV epoprostenol) in higher risk. Lung transplantation for refractory disease.\n\n(A) HFrEF would show reduced LV systolic function on echo and raised PCWP.\n\n(C) COPD would have abnormal lung function and HRCT — neither described.\n\n(D) HFpEF would have raised PCWP (>15) — this patient has 8.\n\n(E) Stable angina presents with exertional chest pain, not progressive dyspnoea + pre-syncope, and does not produce these RHC findings.\n\n💎 PEARL: Pre-capillary PH: mPAP ≥20, PCWP <15, PVR ≥2 Wood units, normal LV/lungs, negative CTPA = Group 1 PAH. Refer to specialist PH centre. Initial COMBINATION therapy (ERA + PDE5i); add prostacyclin if higher risk. Lung transplant for refractory disease.",
   references:[{label:"NICE NG136 — Hypertension in adults (2019)", url:"https://www.nice.org.uk/guidance/ng136"},{label:"ESC/ESH 2023 Hypertension Guidelines", url:"https://academic.oup.com/eurheartj/article/44/38/3824/7246265"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Hypersensitivity pneumonitis ('bird-fancier's lung')",
   stem:"A 48-year-old pigeon-fancier presents with 6 months of progressive exertional dyspnoea, dry cough, fatigue and weight loss, with episodic flu-like symptoms 4–6 hours after handling his birds (improving on holiday). BAL: lymphocytosis with low CD4:CD8 ratio. Avian precipitins positive.\n\nWhich is the most likely diagnosis?",
   options:["Idiopathic pulmonary fibrosis","Hypersensitivity pneumonitis","Asthma","Sarcoidosis","Tuberculosis"],
   correct:"B",
   explanation:"Hypersensitivity pneumonitis (formerly extrinsic allergic alveolitis): immunological reaction to inhaled organic antigens — bird proteins (bird-fancier's lung), thermophilic actinomycetes (farmer's lung), fungi, isocyanates, hot tubs. Acute (4–8 hours post-exposure: flu-like, dyspnoea, hypoxia), subacute, or chronic (insidious dyspnoea and fibrosis). HRCT in chronic disease: centrilobular ground-glass nodules, mosaic attenuation with air-trapping, mid-upper-zone predominant — distinct from the basal honeycombing of UIP. BAL lymphocytosis with low CD4:CD8 ratio supports the diagnosis; specific precipitins identify the antigen. Improvement away from exposure ('Monday morning fever' in farmer's lung; symptom-free on holiday) is highly suggestive. Cornerstone treatment: antigen avoidance (with the highest impact on outcome).\n\n(A) IPF: basal-predominant honeycombing in older patients, no exposure history, no BAL lymphocytosis.\n\n(C) Asthma: reversible airflow obstruction, atopy; no infiltrates or BAL lymphocytosis.\n\n(D) Sarcoidosis: bilateral hilar lymphadenopathy with non-caseating granulomas; BAL CD4:CD8 ratio HIGH (not low).\n\n(E) Tuberculosis: cavitating apical disease with caseating granulomas, AFB-positive; no relation to bird exposure.\n\n💎 PEARL: Bird-fancier or farmer + episodic flu-like illness 4–6 h post-exposure + improvement away from antigen + mid-upper-zone HRCT changes + BAL lymphocytosis with low CD4:CD8 = hypersensitivity pneumonitis. Antigen avoidance is the cornerstone — curative if early.",
   references:[{label:"ATS/JRS/ALAT HP Guideline (2020)", url:"https://www.atsjournals.org/doi/10.1164/rccm.202005-2032ST"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Cardiac sarcoidosis with multisystem disease",
   stem:"A 42-year-old African-Caribbean woman has new dyspnoea, atypical chest pain and an incidental hilar mass on CXR. Echo: regional wall motion abnormalities and reduced LVEF (40%). Serum calcium 2.72 mmol/L; ACE raised.\n\nWhich is the most likely diagnosis?",
   options:["Idiopathic dilated cardiomyopathy","Cardiac sarcoidosis with multisystem involvement","Hypertrophic cardiomyopathy","Cardiac amyloidosis","Constrictive pericarditis"],
   correct:"B",
   explanation:"Sarcoidosis: multisystem granulomatous disorder. CXR stages — 0 normal, I bilateral hilar lymphadenopathy (BHL), II BHL + parenchymal infiltrates, III parenchymal infiltrates only, IV fibrosis. Extrapulmonary disease often defines management urgency: cardiac (AV block, VT, heart failure — major mortality contributor); neurological (cranial nerve palsies, especially VII; hypothalamic-pituitary axis; meningitis); ocular (uveitis); skin (lupus pernio, erythema nodosum); hepatic; hypercalcaemia (1α-hydroxylation in granulomas — present here). Treatment of cardiac involvement: corticosteroids ± steroid-sparing agents (methotrexate, azathioprine, mycophenolate); pacemaker for AV block; ICD per criteria (sustained VT, LVEF ≤35%, extensive scar). Specialist multidisciplinary care.\n\n(A) Dilated cardiomyopathy gives global hypokinesis, no characteristic LGE pattern, no granulomas, no BHL.\n\n(C) HCM: asymmetric LV hypertrophy with SAM and LVOT obstruction; no granulomas.\n\n(D) Amyloidosis: diffuse sub-endocardial LGE, abnormal native T1 mapping, DPD scan positive in ATTR — no granulomas.\n\n(E) Constrictive pericarditis: thickened/calcified pericardium on imaging, prominent x and y descents, Kussmaul sign — not myocardial inflammation.\n\n💎 PEARL: Sarcoidosis is multisystem. CARDIAC involvement (AV block, VT, HF) is the major mortality contributor. Hypercalcaemia is granuloma 1α-hydroxylase activity (PTH-independent). Steroids + steroid-sparing agents for cardiac/neuro/renal/severe ocular disease.",
   references:[{label:"BTS Sarcoidosis Position Statement", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/sarcoidosis/"},{label:"ATS Sarcoidosis Guideline (2020)", url:"https://www.atsjournals.org/doi/10.1164/rccm.202002-0251ST"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Severe eosinophilic asthma — biologic therapy",
   stem:"A 52-year-old woman with severe asthma is on maximal inhaled therapy (high-dose ics-laba-lama) plus maintenance oral prednisolone 10 mg daily. She has had 4 exacerbations requiring oral steroid bursts in the last 12 months. Adherence is documented as good. Blood eosinophils 0.6 × 10⁹/L; Feno 78 ppb; total IgE 350 kU/L (perennial aeroallergen-sensitised on skin-prick testing). She has been referred to the severe asthma clinic.\n\nWhich is the most appropriate next step?",
   options:["Increase oral prednisolone to 20 mg daily","Refer for biologic therapy (e.g. Mepolizumab, benralizumab or dupilumab)","Add long-term azithromycin","Bronchial thermoplasty as first-line","No further therapy options available"],
   correct:"B",
   explanation:"Severe asthma despite maximal inhaler therapy and good adherence: refer to a specialist severe asthma centre and consider phenotype-/endotype-driven biologic therapy. Choices: omalizumab (anti-IgE) for allergic asthma with raised IgE and aeroallergen sensitisation; mepolizumab / reslizumab / benralizumab (anti-IL-5 / IL-5R) for eosinophilic asthma (eos ≥0.3 × 10⁹/L); dupilumab (anti-IL-4Rα) for type-2-high asthma (eosinophilic OR raised FeNO ≥25 ppb), also licensed for atopic dermatitis and CRSwNP; tezepelumab (anti-TSLP) targets multiple type-2 cytokines and reduces exacerbations regardless of eosinophil count (NAVIGATOR). Trials: MENSA / SIRIUS (mepolizumab), CALIMA / SIROCCO (benralizumab), QUEST / VENTURE (dupilumab).\n\n(A) Increasing oral steroid worsens long-term morbidity and is the LAST resort, not the next step.\n\n(C) Long-term azithromycin (AMAZES trial) reduces exacerbations in severe asthma but is reserved for those not eligible for, or failing, biologics; ECG QT screening required.\n\n(D) Bronchial thermoplasty is for selected non-eosinophilic, non-T2-high severe asthmatics — not first-line in T2-high disease where biologics are highly effective.\n\n(E) Multiple effective therapies exist — biologics in particular have transformed severe asthma management.\n\n💎 PEARL: Severe asthma despite maximal inhaled therapy + good adherence: refer for biologic, phenotype-driven. Eos ≥0.3 → mepolizumab/benralizumab; FeNO ≥25 + eos → dupilumab; allergic + raised IgE → omalizumab; tezepelumab works regardless of eosinophil count.",
   references:[{label:"BTS/SIGN/NICE 2024 Joint Asthma Guideline (NG244/QS25)", url:"https://www.nice.org.uk/guidance/ng244"},{label:"BTS Asthma Guidance", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/asthma/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Incidental pulmonary nodule — surveillance",
   stem:"A 55-year-old current smoker (30 pack-years) has a CT abdomen for renal colic that incidentally identifies a 7 mm solid pulmonary nodule in the right upper lobe. He has no respiratory symptoms. No previous CT for comparison. Brock model risk score: 4% (intermediate).\n\nWhich is the most appropriate next step?",
   options:["Immediate CT-guided biopsy","CT thorax surveillance at 3 months, then 9 and 24 months from baseline (BTS / Fleischner pathway)","Discharge — no follow-up needed","Empirical broad-spectrum antibiotics","Empirical chemotherapy"],
   correct:"B",
   explanation:"BTS / Fleischner Society pulmonary nodule guidance: management depends on size, attributes (solid vs sub-solid), and the patient's lung-cancer risk (Brock or Herder model — age, smoking, family history, COPD, asbestos exposure, nodule size, location, spiculation). Solid nodules: <5 mm — no follow-up needed for low-risk patients; 5–8 mm — CT surveillance (typically 3, 9 and 24 months from baseline depending on size and risk per BTS); ≥8 mm — risk-stratify with PET-CT, consider biopsy or resection. Sub-solid nodules require longer follow-up (up to 5 years) because adenocarcinoma can be slow-growing. Smoking cessation should be addressed at every interaction.\n\n(A) Immediate biopsy is for nodules ≥8 mm with elevated risk on PET-CT, or definitively suspicious features — disproportionate for a 7 mm nodule.\n\n(C) Discharge without follow-up is unsafe in an intermediate-risk smoker.\n\n(D) Antibiotics are for established infection; an asymptomatic incidental nodule is unlikely to be infective without symptoms or features of consolidation.\n\n(E) Chemotherapy without histological diagnosis is never appropriate.\n\n💎 PEARL: Solid pulmonary nodule surveillance: <5 mm low-risk = no follow-up; 5–8 mm = CT at 3, 9 and 24 months from baseline (BTS/Fleischner); ≥8 mm = PET-CT, biopsy or resection. Sub-solid nodules need longer follow-up (up to 5 years — slow-growing adenocarcinoma).",
   references:[{label:"BTS Pulmonary Nodule Guidelines (Thorax 2015)", url:"https://thorax.bmj.com/content/70/Suppl_2/ii1"},{label:"Fleischner Society Guidelines (Radiology 2017)", url:"https://pubs.rsna.org/doi/10.1148/radiol.2017161659"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Asbestos exposure with pleural effusion — suspected mesothelioma",
   stem:"A 70-year-old retired shipyard worker with a 40-year prior history of heavy asbestos exposure presents with new pleuritic chest pain and progressive breathlessness. CXR: bilateral pleural plaques and a unilateral right-sided pleural effusion. Diagnostic aspirate: bloody, exudative; cytology shows atypical mesothelial cells.\n\nWhich is the most likely diagnosis?",
   options:["Benign pleural plaques — no further action","Malignant pleural mesothelioma","Empyema","Tuberculous pleurisy","Bronchiectasis"],
   correct:"B",
   explanation:"Asbestos-related lung disease spectrum: pleural plaques (benign markers of exposure; not premalignant), benign asbestos pleural effusion, asbestosis (parenchymal fibrosis), lung cancer (synergistic risk with smoking) and malignant pleural mesothelioma. Diagnosis: image-guided pleural biopsy is more sensitive than fluid cytology for mesothelioma (cytology often equivocal). Treatment: most have unresectable disease — first-line systemic therapy is nivolumab + ipilimumab (CheckMate 743); platinum + pemetrexed remains an option; radical surgery (extended pleurectomy/decortication or extra-pleural pneumonectomy) only in highly selected fit patients with early-stage epithelioid disease; palliative pleurodesis or indwelling catheter for recurrent effusions; symptom and palliative care input early.\n\n(A) Plaques alone are benign but coexisting unilateral effusion with bloody cytology demands urgent investigation.\n\n(C) Empyema gives frank pus, neutrophilic pH <7.2 fluid, positive Gram stain — not described here.\n\n(D) TB pleurisy: lymphocytic exudate, raised adenosine deaminase, AFB / culture / TB IGRA — different cytological picture, no atypical mesothelial cells.\n\n(E) Bronchiectasis is an airway disease, not a pleural malignancy.\n\n💎 PEARL: Asbestos exposure + new pleural effusion + bloody exudate + atypical mesothelial cells = suspected mesothelioma. Image-guided pleural BIOPSY beats fluid cytology. First-line: nivolumab + ipilimumab (CheckMate 743). Pleural plaques alone are exposure markers, not premalignant.",
   references:[{label:"BTS Pleural Disease Guidelines (2023, Thorax)", url:"https://thorax.bmj.com/content/78/Suppl_3/s1"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Long-term oxygen therapy — assessment",
   stem:"A 68-year-old man with severe COPD (FEV1 28% predicted) is being assessed for long-term oxygen therapy. He has been a non-smoker for 6 weeks (last cigarette confirmed by family). Two stable arterial blood gases on air, 3 weeks apart: PaO₂ 7.0 kPa, PaCO₂ 6.4 kPa, SpO₂ 88%. No peripheral oedema, no polycythaemia, no pulmonary hypertension on echo. Optimal inhaler therapy is in place.\n\nWhich is the most appropriate management?",
   options:["Withhold ltot — patient stopped smoking too recently","Prescribe ltot for ≥15 hours/day","Ambulatory oxygen only","Short-burst oxygen alone","NIV (Bipap) as alternative to ltot"],
   correct:"B",
   explanation:"BTS Home Oxygen guideline. LTOT criteria require: clinical stability on optimal medical therapy; ex-smoker (smoking is an absolute contraindication — fire and burn risk; carboxyhaemoglobin reduces benefit); two stable ABGs at least 3 weeks apart on air showing PaO₂ ≤7.3 kPa, OR PaO₂ 7.3–8.0 kPa with secondary polycythaemia, peripheral oedema or pulmonary hypertension. Prescribe ≥15 hours/day — improves survival in chronic hypoxaemic COPD (NOTT and MRC trials, ~50% mortality reduction over 5 years if used >15h/day). Titrate to PaO₂ ≥8 kPa during oxygen therapy. Annual review.\n\n(A) BTS does not specify a minimum duration of smoking cessation — clinical stability and exposure to fire risk matter; '6 weeks abstinent with confirmation' is acceptable.\n\n(C) Ambulatory oxygen is for exercise-induced desaturation in patients not meeting LTOT criteria — this patient meets criteria for the more impactful long-duration LTOT.\n\n(D) Short-burst oxygen has limited evidence for symptomatic relief, no survival benefit.\n\n(E) NIV is for chronic hypercapnic respiratory failure (PaCO₂ persistently >7) with frequent admissions — not an alternative to LTOT for resting hypoxaemia.\n\n💎 PEARL: LTOT criteria: clinical stability + ex-smoker + two ABGs ≥3 weeks apart on air showing PaO₂ ≤7.3 kPa, OR 7.3–8.0 with polycythaemia/oedema/PH. Use ≥15 hours/day reduces mortality (NOTT, MRC). Smoking is an absolute contraindication (fire risk).",
   references:[{label:"BTS Guideline for Oxygen Use in Adults in Healthcare and Emergency Settings (2017)", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/"},{label:"BTS Long-term Oxygen Therapy Guidance", url:"https://www.brit-thoracic.org.uk/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Asthma — confirming the diagnosis",
   stem:"A 30-year-old woman has 4 months of episodic dyspnoea, wheeze and dry cough, worse at night and after exercise. She is atopic with childhood eczema. PEFR diary over 2 weeks: >20% diurnal variability. Spirometry: FEV1/FVC 0.65 (post-bronchodilator FEV1 increases by 14% and 350 mL). Feno 64 ppb.\n\nWhich is the most likely diagnosis?",
   options:["Anxiety-related hyperventilation","Asthma","COPD","Bronchiectasis","Vocal cord dysfunction"],
   correct:"B",
   explanation:"Updated asthma diagnostic pathway (NICE NG244 / BTS-SIGN 2024): an OBJECTIVE diagnosis is required — features supporting it include compatible symptoms PLUS one or more of: FeNO ≥40 ppb (≥35 in children); positive bronchodilator reversibility (≥12% AND ≥200 mL FEV1 increase post-bronchodilator); PEF variability ≥20% over 2 weeks; positive bronchial challenge test. Initial management: as-needed combination ICS/formoterol (budesonide-formoterol — AIR strategy, GINA-aligned) for adults with mild asthma — superior to SABA monotherapy (SYGMA, START); MART (Maintenance and Reliever Therapy) for those needing regular treatment — single-inhaler ICS-formoterol used both daily and as needed.\n\n(A) Anxiety / hyperventilation does not cause reversible airflow obstruction or raised FeNO.\n\n(C) COPD: post-bronchodilator FEV1/FVC <0.7 (this patient's is 0.65 — overlap), but typically in older smokers with progressive symptoms; reversibility usually <12%; FeNO is normal.\n\n(D) Bronchiectasis gives chronic productive cough, copious sputum, recurrent infections, signet-ring sign on HRCT — different picture.\n\n(E) Vocal cord dysfunction can mimic asthma but lacks objective airway changes; FeNO normal; flow-volume loop shows inspiratory flattening.\n\n💎 PEARL: Asthma needs OBJECTIVE diagnosis (NICE NG244): FeNO ≥40, OR bronchodilator reversibility ≥12% AND ≥200 mL, OR PEF variability ≥20% over 2 weeks, OR positive bronchial challenge. First-line: as-needed ICS-formoterol (AIR strategy).",
   references:[{label:"BTS/SIGN/NICE 2024 Joint Asthma Guideline (NG244/QS25)", url:"https://www.nice.org.uk/guidance/ng244"},{label:"BTS Asthma Guidance", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/asthma/"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Recurrent malignant pleural effusion — definitive option",
   stem:"A 75-year-old man with confirmed malignant pleural mesothelioma has a recurrent symptomatic right pleural effusion despite three thoracocenteses over the last 6 weeks. Imaging shows the lung re-expands on aspiration. ECOG performance status 1. Estimated prognosis: 6–9 months.\n\nWhich is the most appropriate definitive intervention?",
   options:["Continue repeated thoracocentesis","Talc pleurodesis (slurry via chest drain or thoracoscopic insufflation)","No further pleural intervention","Empirical broad-spectrum antibiotics","Surgical pleural decortication"],
   correct:"B",
   explanation:"BTS pleural disease guideline (2023) for recurrent malignant pleural effusion. Definitive options after repeated diagnostic / therapeutic aspirations: (1) Talc pleurodesis — chemical pleurodesis via slurry through a chest drain or via thoracoscopic insufflation; achieves 60–80% success when the lung re-expands; requires hospitalisation. (2) Indwelling pleural catheter (IPC) — outpatient drainage at home; improves dyspnoea and quality of life equivalent to pleurodesis (TIME-2 trial); IPC-PLUS (combined IPC + talc) increases pleurodesis rate. IPC is preferred when the lung does NOT re-expand (trapped lung, where pleurodesis would fail) or where rapid discharge / home-based palliative care is the priority.\n\n(A) Repeated thoracocentesis is exhausting for the patient, has cumulative procedure risk and does not address the recurrence pattern — definitive control is needed.\n\n(C) No intervention abandons a patient with a treatable symptom.\n\n(D) Antibiotics are for infection — this is malignant effusion.\n\n(E) Surgical decortication is reserved for trapped lung where IPC has failed, or for highly selected fit patients — disproportionate as first definitive step in a 75-year-old with limited prognosis.\n\n💎 PEARL: Recurrent malignant pleural effusion + lung re-expands: talc pleurodesis (60–80% success) OR indwelling pleural catheter (TIME-2 — equivalent QoL, outpatient drainage). Trapped lung (no re-expansion) → IPC, not pleurodesis (which would fail).",
   references:[{label:"BTS Pleural Disease Guidelines (2023, Thorax)", url:"https://thorax.bmj.com/content/78/Suppl_3/s1"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Smoking cessation — pharmacotherapy",
   stem:"A 55-year-old man with COPD (FEV1 50% predicted) and a 30-pack-year smoking history wants to quit smoking. He has tried briefly with willpower alone and once with single-form nicotine patches with limited success. He is keen to make another attempt.\n\nWhich is the most effective strategy to recommend?",
   options:["Behavioural support alone","Combination NRT (patch + short-acting form) plus structured behavioural support","Long-term oral prednisolone","Aspirin","Reassurance — 'cessation is impossible to achieve'"],
   correct:"B",
   explanation:"Smoking cessation is the most cost-effective intervention in COPD, and for cardiovascular and cancer risk. NICE NG209 (Tobacco — preventing uptake, promoting quitting and treating dependence) recommends behavioural support PLUS pharmacotherapy as the most effective combination. Specialist Stop Smoking Services significantly improve quit rates and should be offered. Address relapse — most quitters take multiple attempts.\n\n(A) Behavioural support alone has lower quit rates than combination behavioural + pharmacotherapy; given prior single-NRT failure, combination NRT is the natural escalation.\n\n(C) Long-term steroid is not a cessation aid — would worsen comorbidities.\n\n(D) Aspirin is for cardiovascular prevention, not smoking cessation.\n\n(E) Most smokers can quit with appropriate support — defeatist messaging is unhelpful and incorrect.\n\n💎 PEARL: Smoking cessation: behavioural support PLUS pharmacotherapy is most effective. Combination NRT (patch + short-acting form) beats single-form NRT. Specialist Stop Smoking Services improve quit rates. Multiple attempts are the norm — keep offering.",
   references:[{label:"NICE NG209 — Tobacco: preventing uptake, promoting quitting (2021)", url:"https://www.nice.org.uk/guidance/ng209"},{label:"NICE PH45 — Smoking: harm reduction", url:"https://www.nice.org.uk/guidance/ph45"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Refractory pleural empyema — intrapleural therapy",
   stem:"A 60-year-old man has been on 5 days of IV co-amoxiclav for left-sided community-acquired empyema. A small-bore chest drain is in situ. He remains febrile (38.5°C) with a residual loculated effusion on bedside ultrasound. CRP has fallen but remains elevated at 180. Drain output has reduced markedly.\n\nWhich is the most appropriate next step?",
   options:["Continue current antibiotic alone and observe","Intrapleural alteplase (tPA) plus DNase via the chest drain","Stop all antibiotics","Long-term oral prednisolone","No further treatment indicated"],
   correct:"B",
   explanation:"Pleural infection (parapneumonic effusion progressing to empyema) commonly becomes loculated, limiting effective drainage despite antibiotics. The MIST-2 trial showed that intrapleural alteplase (tPA) PLUS DNase administered through the chest drain twice daily for 3 days each significantly improves drainage in loculated empyema, reduces the need for surgical referral, and shortens hospital stay — neither agent alone is effective. BTS pleural infection guideline endorses this combination for refractory disease. Total antibiotic course is typically 4–6 weeks (much longer than for pneumonia), with oral switch and step-down based on clinical and biochemical response.\n\n(A) Continued IV antibiotics alone with poor drainage and persistent fever is unlikely to succeed without addressing the loculated collection.\n\n(C) Stopping antibiotics during ongoing infection risks relapse and complications.\n\n(D) Long-term steroid has no role in pleural infection — would worsen the infection.\n\n(E) Inaction in refractory empyema risks chronic pleural fibrosis and decortication needs.\n\n💎 PEARL: Loculated empyema with residual collection + ongoing fever despite drain + antibiotics: intrapleural alteplase (tPA) PLUS DNase, BD for 3 days each (MIST-2 — combination superior to either agent alone). Total antibiotic course 4–6 weeks.",
   references:[{label:"BTS Pleural Disease Guidelines (2023)", url:"https://thorax.bmj.com/content/78/Suppl_3/s1"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Aspiration pneumonia — antibiotic choice",
   stem:"An 80-year-old man with advanced Parkinson disease and known dysphagia develops a fever 38.4°C, productive cough and right basal consolidation on CXR after a witnessed aspiration event during a meal. He has been previously well-managed at home. CRP 120, WCC 14. He is haemodynamically stable.\n\nWhich is the most appropriate empirical antibiotic?",
   options:["No antibiotic — observe","IV co-amoxiclav","IV co-amoxiclav plus metronidazole","Long-term oral prednisolone","Aspirin"],
   correct:"B",
   explanation:"Aspiration pneumonia: lower respiratory infection from aspirated oropharyngeal / gastric content, common in patients with impaired swallow (stroke, Parkinson disease, dementia, head and neck cancer, post-extubation), reduced consciousness, oesophageal disease, NG tube. Empirical antibiotics: broad-spectrum to cover oral flora — co-amoxiclav for community-acquired aspiration; piperacillin-tazobactam for severe or hospital-acquired aspiration. CRITICAL POINT: metronidazole alone is NO LONGER routinely added to a beta-lactam / beta-lactamase-inhibitor combination — modern beta-lactam combinations cover anaerobes adequately, and empirical metronidazole over-treatment promotes resistance and C. difficile. PEG feeding does NOT eliminate aspiration risk.\n\n(A) Pneumonia with fever, raised inflammatory markers and imaging findings warrants antibiotic.\n\n(C) Adding metronidazole is no longer routinely needed alongside co-amoxiclav (already covers anaerobes); contributes to antimicrobial harm without added benefit.\n\n(D) Steroid has no role and may worsen infection.\n\n(E) Aspirin treats vascular events, not pneumonia.\n\n💎 PEARL: Aspiration pneumonia: co-amoxiclav for community-acquired; piperacillin-tazobactam for severe or hospital-acquired. Routine metronidazole add-on is OBSOLETE — modern beta-lactam-BLI combinations cover anaerobes. Address swallow with SLT.",
   references:[{label:"BTS Pneumonia in Adults Guidelines", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/pneumonia-adults/"},{label:"NICE NG138 — Pneumonia in adults", url:"https://www.nice.org.uk/guidance/ng138"}]},

  {section:"gastro", specialty:"Gastroenterology", topic:"Ulcerative colitis — diagnosis",
   stem:"A 32-year-old woman has 6 weeks of bloody diarrhoea (up to 8 stools daily), abdominal cramping, urgency and 4 kg weight loss. No recent antibiotics. Stool cultures and C. difficile toxin negative. Colonoscopy: continuous mucosal inflammation extending from the rectum to the splenic flexure with loss of vascular pattern, granularity, and superficial ulceration; the proximal colon is normal. Biopsies show crypt distortion, crypt abscesses, and no granulomas.\n\nWhich is the most likely diagnosis?",
   options:["Crohn's disease","Ulcerative colitis","Ischaemic colitis","Pseudomembranous colitis","Microscopic colitis"],
   correct:"B",

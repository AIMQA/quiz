  {section:"other", specialty:"Dermatology", topic:"Bullous pemphigoid",
   stem:"A 78-year-old man has 6 weeks of widespread tense bullae on the trunk and limbs (intact, fluid-filled, non-fragile, ranging 1-3 cm), some on an erythematous base, others on apparently normal skin. The lesions are intensely itchy and may have begun as urticarial pre-bullous lesions weeks earlier. The mouth and other mucous membranes are spared. Nikolsky sign negative (skin doesn't shear with pressure). Direct immunofluorescence of perilesional skin: linear IgG and C3 deposition along the basement membrane zone (BMZ). Indirect immunofluorescence: anti-BP180 and anti-BP230 antibodies positive.\n\nWhich is the most likely diagnosis?",
   options:["Pemphigus vulgaris","Bullous pemphigoid","Dermatitis herpetiformis","Linear IgA disease","Epidermolysis bullosa acquisita"],
   correct:"B",
   explanation:"BULLOUS PEMPHIGOID (BP): the MOST COMMON AUTOIMMUNE BLISTERING DISEASE in older adults; typically affects patients aged >60-70 (mean ~75; can occur younger but rare); incidence ~10-20 per million per year, RISING with ageing populations and possibly drug-induced cases (DPP-4 inhibitors — see below). PRESENTATION typically biphasic: PRE-BULLOUS PHASE (weeks-months — sometimes much longer; often misdiagnosed) — pruritic, urticarial, eczematous, or polymorphic plaques; intense itching; can persist as 'pre-bullous pemphigoid' without ever blistering — diagnostic challenge; INDIRECT IMMUNOFLUORESCENCE / serological testing useful in this phase. Stop suspected drug if temporal association. DRUG-INDUCED BP — STOP suspected drug.\n\n(A) Pemphigus vulgaris: FLACCID bullae (vs tense in BP); MUCOSAL involvement common; INTRA-EPIDERMAL split; INTERCELLULAR IgG (chicken-wire pattern); typically YOUNGER (40-60).\n\n(C) Dermatitis herpetiformis: severely itchy grouped vesicles on extensor surfaces (elbows, knees, scalp, buttocks); GLUTEN-SENSITIVE (almost universal coeliac disease); GRANULAR IgA at dermal papillae; treat with gluten-free diet ± dapsone.\n\n(D) Linear IgA disease: linear IgA at BMZ (vs IgG in BP); often DRUG-INDUCED (vancomycin classic); 'cluster of jewels' rosette pattern of bullae.\n\n(E) Epidermolysis bullosa acquisita: bullae over trauma sites; antibodies to type VII collagen (anchoring fibrils); chronic; difficult to treat.\n\n💎 PEARL: Older adult + intensely pruritic urticarial pre-bullous phase → tense bullae on intact skin + mucosa SPARED + Nikolsky NEGATIVE + LINEAR IgG/C3 along basement membrane on DIF + anti-BP180/BP230 = bullous pemphigoid. Subepidermal split. Topical clobetasol very effective for limited disease. Oral prednisolone or doxycycline + nicotinamide for extensive. DPP-4 inhibitors increasingly recognised as triggers.",
   references:[{label:"BAD Guidelines for Bullous Pemphigoid (Br J Dermatol 2021)", url:"https://www.bad.org.uk/clinical-services/guidelines/"}]},

  {section:"other", specialty:"Dermatology", topic:"Toxic epidermal necrolysis (TEN)",
   stem:"A 24-year-old woman starts trimethoprim-sulfamethoxazole (co-trimoxazole) for a urinary tract infection. Eight days later (within typical scar window of 5-28 days), she develops fever (39°C), painful targetoid lesions spreading rapidly across the body, then bullae forming and detachment of epidermis over >30% of body surface area (bsa — assessed by 'palm method' approximating 1% bsa per palm — see image). Mucosal involvement of mouth (haemorrhagic crusting of lips, oral ulceration preventing eating), conjunctivae (keratitis, photophobia), genital ulceration. Nikolsky sign positive (lateral pressure on apparently normal skin causes shearing). Investigations: SCORTEN score 4 (predicting mortality ~58%). She is being transferred to a regional burns / dermatology unit.\n\nWhich is the most likely diagnosis?",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Necrolysis_epidermalis_toxica_01.JPG",
   imageAlt:"Toxic epidermal necrolysis showing widespread sheet-like detachment of epidermis with raw red dermis exposed",
   options:["Erythema multiforme major","Stevens-Johnson syndrome","Toxic epidermal necrolysis","Staphylococcal scalded skin syndrome","Dress syndrome"],
   correct:"C",
   explanation:"STEVENS-JOHNSON SYNDROME / TOXIC EPIDERMAL NECROLYSIS (SJS/TEN): a SPECTRUM of severe cutaneous adverse drug reactions characterised by widespread KERATINOCYTE APOPTOSIS, EPIDERMAL DETACHMENT, and MUCOSAL INVOLVEMENT — DERMATOLOGICAL EMERGENCY with significant mortality. NB ERYTHEMA MULTIFORME (EM) is now considered a SEPARATE entity. PATHOGENESIS: T-cell-mediated cytotoxic immune response to DRUG-protein adducts; widespread keratinocyte apoptosis. \n\nPRESENTATION: latency 5-28 DAYS after starting culprit drug; PRODROME (1-3 days) — fever, malaise, conjunctivitis, sore throat, diffuse erythema. MANAGEMENT — TIME-CRITICAL: (1) IDENTIFY and STOP CULPRIT DRUG immediately — single most important intervention; mortality higher with delayed withdrawal; STOP all non-essential drugs.\n\n(A) Erythema multiforme major: post-HSV typically; mucosal involvement but limited extent; no extensive epidermal detachment; not >30% BSA.\n\n(B) Stevens-Johnson syndrome: by definition <10% BSA; this patient has >30% so qualifies as TEN.\n\n(D) Staphylococcal scalded skin syndrome (SSSS): toxin-mediated (S. aureus exfoliative toxins); SUBCORNEAL split (very superficial; vs subepidermal in TEN); typically children; rarely mucosal involvement; biopsy distinctive.\n\n(E) DRESS syndrome (Drug Reaction with Eosinophilia and Systemic Symptoms): typically 2-8 weeks after drug; FACIAL EDEMA, morbilliform rash, fever, lymphadenopathy, eosinophilia, organ involvement (hepatitis, nephritis, pneumonitis, myocarditis); does NOT have widespread epidermal detachment; HHV-6 reactivation often.\n\n💎 PEARL: Drug exposure 5–28 days earlier (allopurinol, anticonvulsants, sulfonamides, NSAIDs) + targetoid lesions + bullae + EPIDERMAL DETACHMENT >30% BSA + mucosal involvement (≥2 sites) = TEN. STOP culprit immediately + transfer to burns/specialist unit + supportive (fluid, nutrition, infection prevention, eye care, wound care). SCORTEN scores severity. Ciclosporin or anti-TNF improves outcomes; IVIg/steroids controversial.",
   references:[{label:"UK Guidelines for Management of SJS/TEN in Adults (Br J Dermatol 2016)", url:"https://onlinelibrary.wiley.com/doi/10.1111/bjd.14530"}]},

  {section:"other", specialty:"Statistics", topic:"Positive predictive value (PPV) calculation",
   stem:"In a study comparing a new screening test against a gold-standard diagnostic test in 1000 people: of 100 people with the disease, 80 test positive on the new test (and 20 test negative — false negatives); of 900 people without the disease, 90 test positive on the new test (false positives, and 810 test negative — true negatives). Disease prevalence in the study population is 10%. What is the test's positive predictive value (PPV)?",
   options:["10%","47%","80%","89%","91%"],
   correct:"B",
   explanation:"DIAGNOSTIC TEST CHARACTERISTICS — fundamental concepts for clinical interpretation; CRITICAL for the SCE: BUILD A 2x2 TABLE FROM THE DATA — gold-standard rows; new test columns: TRUE POSITIVES (TP) = 80 (have disease, test positive); FALSE NEGATIVES (FN) = 20 (have disease, test negative); FALSE POSITIVES (FP) = 90 (don't have disease, test positive); TRUE NEGATIVES (TN) = 810 (don't have disease, test negative). DEFINITIONS: SENSITIVITY = TP / (TP + FN) = the proportion of those WITH disease who CORRECTLY TEST POSITIVE = 80 / (80 + 20) = 80 / 100 = 80%. (THIS QUESTION).\n\n(A) 10% would equal disease prevalence — describes pre-test probability, not PPV.\n\n(C) 80% is sensitivity — different concept.\n\n(D) 89% is overall accuracy — different metric.\n\n(E) 91% — likely confusion of NPV / specificity with PPV.\n\n💎 PEARL: PPV = TP/(TP+FP) — proportion of test-positives who actually have disease. With 80 TP + 90 FP: PPV = 80/170 ≈ 47%. PPV depends on PREVALENCE — at low prevalence, PPV is low even with a good test. NPV = TN/(TN+FN). Sensitivity = TP/(TP+FN); specificity = TN/(TN+FP). Use a 2×2 table for clarity.",
   references:[{label:"BMJ Best Practice — Diagnostic Test Statistics", url:"https://bestpractice.bmj.com/info/toolkit/learn-ebm/diagnostic-test-statistics/"}]},

  {section:"other", specialty:"Statistics", topic:"Number needed to treat (NNT)",
   stem:"A randomised controlled trial of a new antihypertensive shows the relative risk reduction (RRR) for stroke is 25% over 5 years. Baseline 5-year stroke risk in the placebo arm is 4%. The trial enrolled 5000 patients (matched to the typical clinic population by age, comorbidity, baseline BP). Confidence intervals around the RRR are tight; the result is statistically significant. Approximately how many people need to be treated for 5 years to prevent one stroke?",
   options:["25","50","100","250","400"],
   correct:"C",
   explanation:"NUMBER NEEDED TO TREAT (NNT): one of the most CLINICALLY USEFUL outputs from a clinical trial — the average number of patients who must be treated with the intervention (vs placebo / control) for one additional patient to benefit. FOR THIS QUESTION: STEP 1 — Baseline risk (control arm) = 4% over 5 years = 0.04.\n\nSTEP 2 — Relative risk reduction = 25% = 0.25 (proportion of baseline risk reduced).\n\nSTEP 3 — Absolute risk reduction = 0.04 × 0.25 = 0.01 = 1%.\n\nSTEP 4 — NNT = 1 / ARR = 1 / 0.01 = 100.\n\n(A) 25 — too low; would represent ARR of 4% (the entire baseline risk reduced — would be 100% RRR, nonsensical).\n\n(B) 50 — would correspond to ARR 2% (50% RRR — twice the actual).\n\n(D) 250 — would correspond to ARR 0.4% (10% RRR — too low).\n\n(E) 400 — would correspond to ARR 0.25% (very small RRR).\n\n💎 PEARL: NNT = 1 / absolute risk reduction. ARR = baseline risk × RRR. Baseline 4% × RRR 25% = ARR 1% → NNT 100. RRR exaggerates benefit when baseline risk is low — always demand the absolute number.",
   references:[{label:"BMJ — How to calculate NNT", url:"https://www.bmj.com/content/318/7197/1492"},{label:"Cochrane Handbook — NNT", url:"https://training.cochrane.org/handbook"}]},

  {section:"other", specialty:"Immunology", topic:"X-linked agammaglobulinaemia (Bruton's)",
   stem:"A 6-year-old boy has had recurrent bacterial sinopulmonary infections since the age of 8 months — recurrent otitis media (5 episodes), pneumonias (3 — S. pneumoniae and H. influenzae cultured), and one episode of bacterial meningitis. No opportunistic infections (no PCP, no fungal, no viral atypical). No viral susceptibility (recovered normally from chickenpox). Examination: tonsils and palpable LYMPH nodes absent. Investigations: IgG 1.2 g/L (very low), IgA <0.07 g/L (very low), IgM 0.2 g/L (very low) — panhypogammaglobulinaemia; B cells (CD19+) absent in peripheral blood; T cells normal numbers and function; flow cytometry confirms absent CD19+ B cells. Maternal uncle died age 14 from 'lung infection' — suggests X-linked family history.\n\nWhich is the most likely diagnosis?",
   options:["Common variable immunodeficiency","X-linked agammaglobulinaemia (Bruton's)","Selective IgA deficiency","Severe combined immunodeficiency","DiGeorge syndrome"],
   correct:"B",
   explanation:"X-LINKED AGAMMAGLOBULINAEMIA (XLA, Bruton agammaglobulinaemia): primary immunodeficiency caused by mutations in the BTK gene (Bruton tyrosine kinase) on the X chromosome (Xq21.3-q22) — encodes a kinase essential for B-CELL development from pre-B-cell to mature B-cell stage. \n\nPRESENTATION: ONSET TYPICALLY 6-12 MONTHS of age — coincides with WANING of MATERNAL IgG (which is transferred trans-placentally and provides passive protection for first 4-6 months); before this period, infants may be asymptomatic. Eventually develop BRONCHIECTASIS from repeated lower respiratory infection. INVESTIGATIONS to monitor / detect complications: CXR / HRCT for bronchiectasis, sinus imaging, infection screen during infections, surveillance for autoimmune / lymphoproliferative complications.\n\n(A) CVID: similar antibody deficiency but B cells PRESENT in normal numbers; later onset (typically 20s-30s); not familial classically.\n\n(C) Selective IgA deficiency: only IgA deficient; usually mild / asymptomatic; risk of anaphylaxis to blood products with IgA antibodies.\n\n(D) SCID: T-cell deficiency dominant; opportunistic infections (PCP, fungal, viral); fatal in infancy without bone marrow transplant; presents earlier (3 months).\n\n(E) DiGeorge syndrome: 22q11 deletion; cardiac defects, hypocalcaemia, characteristic facies, T-cell deficiency from thymic hypoplasia.\n\n💎 PEARL: Boy + recurrent encapsulated bacterial infections (Strep pneumoniae, H. influenzae) starting 6–12 months (as maternal IgG wanes) + absent tonsils and nodes + all Ig classes low = X-linked agammaglobulinaemia. BTK gene. Lifelong IVIG.",
   references:[{label:"UKPID/IPOPI Primary Immunodeficiency Resources", url:"https://www.ukpin.org.uk/guidelines/"},{label:"ESID Diagnostic Criteria PID", url:"https://esid.org/Working-Parties/Clinical/Resources"}]},

  {section:"other", specialty:"Psychiatry", topic:"Depression after MI — antidepressant choice",
   stem:"A 70-year-old man, 6 weeks post-NSTEMI on aspirin / ticagrelor / atorvastatin / bisoprolol / ramipril, with AF on apixaban, and chronic pain on tramadol, has new-onset moderate depression (PHQ-9 score 17 — early waking, anhedonia, low mood, hopelessness, fatigue). No active suicidal ideation, no psychosis, no prior depression episode. He has had 4 sessions of CBT with his GP without significant improvement. He requests pharmacological help. ECG: QTc 470 ms (mildly prolonged). LFTs and U&E normal. He has full capacity.\n\nWhich is the most appropriate antidepressant?",
   options:["Citalopram 20 mg daily","Sertraline 50 mg daily, with caution about bleeding (apixaban) and serotonergic interaction with tramadol","Long-term benzodiazepine","Increase tramadol dose","No specific intervention — observation only"],
   correct:"B",
   explanation:"DEPRESSION AFTER MI: extremely common (post-MI prevalence 15-30%); WORSENS cardiovascular outcomes (mortality, recurrent MI, hospitalisation) — likely via mediators (poor adherence, behavioural risk factors, inflammation, autonomic dysregulation, platelet activity); SCREEN routinely after MI (PHQ-2 / PHQ-9), and treat. Treatment improves both mood and cardiovascular outcomes (modestly). Sertraline minimal QTc effect; few cardiovascular interactions. CITALOPRAM and ESCITALOPRAM — CAUTION in cardiovascular disease and OLDER ADULTS (≥65) — DOSE-DEPENDENT QT PROLONGATION (MHRA / FDA warnings 2011-2012); maximum CITALOPRAM 20 mg/day in over-65s (vs 40 mg in younger adults), maximum ESCITALOPRAM 10 mg/day in over-65s (vs 20 mg).\n\n(A) Citalopram — QT-prolongation risk; in older adult with already QTc 470 — relatively contraindicated.\n\n(C) Long-term benzodiazepine — DEPENDENCY, falls, cognitive impairment, especially in elderly; STOPP-listed; not appropriate for primary depression management.\n\n(D) Increased tramadol — addiction / dependence risk, no antidepressant efficacy.\n\n(E) No intervention — undertreatment of significant depression with cardiovascular consequences.\n\n💎 PEARL: Post-MI depression worsens cardiovascular outcomes — screen and treat. Sertraline first-line: minimal QT effect, few interactions. Citalopram and escitalopram cause dose-dependent QT prolongation (MHRA 2011) — avoid in older patients with cardiovascular disease.",
   references:[{label:"NICE NG222 — Depression in adults (2022)", url:"https://www.nice.org.uk/guidance/ng222"}]},

  {section:"other", specialty:"Statistics", topic:"Kaplan-Meier and hazard ratio interpretation",
   stem:"A randomised trial reports overall survival in two groups (new chemotherapy regimen vs standard care for advanced lung cancer) using kaplan-meier curves. The log-rank test has a P value of 0.003. The hazard ratio is 0.62 (95% confidence interval 0.45 to 0.85). The Kaplan-Meier curves diverge progressively over time without crossing. Median survival improved from 9 months in the control arm to 14 months in the experimental arm. 5-year survival 8% (control) vs 18% (experimental).\n\nWhich is the most accurate interpretation of these results?",
   options:["The hazard ratio means a 38% absolute reduction in mortality","The hazard ratio represents the ratio of instantaneous event rates between groups; HR 0.62 = approximately 38% relative reduction in hazard, statistically significant","P=0.003 means treatment is universally effective in all individuals","Statistically not significant — confidence interval includes the null","Curves diverging means the treatment is unsafe"],
   correct:"B",
   explanation:"SURVIVAL ANALYSIS — KAPLAN-MEIER (KM) AND HAZARD RATIOS: standard methods for analysing TIME-TO-EVENT data (survival, recurrence, treatment failure, hospital admission, etc.). KEY CONCEPTS: TIME-TO-EVENT outcomes — event of interest (death, recurrence, etc.) occurring at variable times; not all participants reach the event during follow-up. CENSORING — participants who don't reach the event during follow-up (still alive, lost to follow-up, end of study) — are CENSORED at the time of last observation; standard analytical approach handles this rather than excluding them. Limitation: simply tests whether curves differ; does NOT quantify the magnitude or direction of the difference.\n\n(A) HR is RELATIVE not absolute — 38% relative hazard reduction; absolute differences depend on baseline rate.\n\n(C) P = 0.003 is the average effect; individual response varies and not all benefit.\n\n(D) The CI 0.45-0.85 EXCLUDES 1.0 — IS significant.\n\n(E) Diverging curves = ONGOING benefit accumulating, not safety signal.\n\n💎 PEARL: Hazard ratio 0.62 (95% CI 0.45–0.85) = 38% relative reduction in instantaneous event rate, statistically significant (CI excludes 1.0). Log-rank tests whether KM curves differ; HR quantifies the magnitude. Both assume proportional hazards over follow-up.",
   references:[{label:"BMJ — Kaplan-Meier survival analysis", url:"https://www.bmj.com/content/317/7172/1572"}]},

  {section:"other", specialty:"Allergy", topic:"ACE-inhibitor-induced angioedema",
   stem:"A 65-year-old man on ramipril 5 mg daily for 6 years for hypertension presents to ED with sudden onset of lip and facial swelling (over 30 minutes), tongue swelling, and a sense of throat tightness. No urticaria, no pruritus, no rash, no GI symptoms. He took his last ramipril dose this morning as usual. He had been completely well, no recent food / medication changes, no insect stings, no allergies known. Examination: tense lip and lower face oedema, tongue protruding, mild stridor, voice slightly hoarse, no rash, lungs clear, BP 145/85, HR 88, SpO₂ 98% on air, no hypotension or wheeze. Investigations: tryptase normal (1.5 µg/L), C4 normal, C1-ESTERASE inhibitor (C1-INH) level normal, complement components normal.\n\nWhich is the most likely diagnosis?",
   options:["Hereditary angioedema","Ace-inhibitor-induced angioedema (bradykinin-mediated)","Anaphylaxis","Mast cell activation syndrome","Eczema"],
   correct:"B",
   explanation:"ANGIOEDEMA: rapid-onset SWELLING of subcutaneous and submucosal tissues, distinct from urticaria (deeper layer affected); typically NON-PRURITIC, asymmetric; affects face / lips / tongue / oropharynx (life-threatening if airway obstruction), genitalia, hands, feet; gut (abdominal pain mimicking acute abdomen). MANAGEMENT — ACE INHIBITOR ANGIOEDEMA: (1) DISCONTINUE ACE INHIBITOR PERMANENTLY — note clearly in medical records, allergy bracelet / wallet card, primary care notification; lifelong avoidance of all ACE inhibitors.\n\n(A) Hereditary angioedema: low C4, low / dysfunctional C1-INH (this patient — both normal), positive family history.\n\n(C) Anaphylaxis: would have urticaria, pruritus, hypotension, wheeze, tryptase elevated; not present here.\n\n(D) Mast cell activation syndrome: typically tryptase elevated during episodes; multi-system.\n\n(E) Eczema: chronic skin condition, not acute angioedema.\n\n💎 PEARL: ACE-inhibitor angioedema is bradykinin-mediated (not histamine) — non-pruritic, no urticaria, often face/lips/tongue. Can occur YEARS after starting. Adrenaline, antihistamines and steroids don't reverse the bradykinin pathway. STOP the ACEi permanently — record on alerts.",
   references:[{label:"BSACI Hereditary Angioedema Guidelines (2017)", url:"https://onlinelibrary.wiley.com/doi/10.1111/cea.12886"},{label:"WAO/EAACI HAE Guidelines (2022)", url:"https://onlinelibrary.wiley.com/doi/10.1002/aler.13513"}]},

  {section:"other", specialty:"Patient Safety", topic:"Structured handover — SBAR",
   stem:"A junior doctor is handing over a deteriorating patient at shift change to the night team. The patient is a 72-year-old man admitted yesterday with community-acquired pneumonia, now becoming hypoxic on the ward (SpO₂ 90% on 4 L/min, RR 28, BP 100/65 dropping, HR 110, T 38.5°C, NEWS2 = 8). Initial discussion is unstructured and the receiving doctor is unclear on what action is needed.\n\nWhich is the most appropriate communication framework?",
   options:["Free-text narrative without structure","Sbar — Situation, Background, Assessment, Recommendation","Speak only to the patient, not the team","Avoid documentation of the handover","Hand over only if specifically asked"],
   correct:"B",
   explanation:"CLINICAL HANDOVER — STRUCTURED COMMUNICATION: handover is one of the most error-prone moments in clinical care. Failures of communication during handover are a recurrent theme in NEVER EVENTS, serious incidents, and patient safety reviews (Joint Commission USA — communication failure cited in >70% of sentinel events; UK NPSA repeated alerts). SBAR (Situation, Background, Assessment, Recommendation): a structured communication tool ORIGINALLY developed by US NAVY for nuclear submarine communications, ADOPTED in healthcare via Kaiser Permanente in early 2000s; promoted by IHI, NHS England / NHS Improvement, the Royal Colleges, NICE, and clinical specialties. He looks tired and confused, fingertips cool.\n\n(A) Free-text narrative leads to omission and confusion.\n\n(C) Speak only to patient — patient input valuable but doesn't constitute clinical handover to next team.\n\n(D) Avoiding documentation undermines continuity, auditability, accountability.\n\n(E) Handing over only if asked guarantees missed handovers and harm.\n\n💎 PEARL: SBAR — Situation, Background, Assessment, Recommendation. Originally US Navy submarine communication; adopted via Kaiser Permanente. Communication failure cited in >70% of Joint Commission sentinel events. Use it for every escalation call.",
   references:[{label:"NHS England SBAR Communication Tool", url:"https://www.england.nhs.uk/improvement-hub/publication/sbar-communication-tool/"}]},

  // MEDICINE IN THE ELDERLY  (target 33 — current 16)

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Hyperactive delirium in the older adult",
   stem:"An 84-year-old man is admitted from a care home with fluctuating confusion that started 48 hours ago. He is normally independently mobile with mild cognitive impairment. He is now drowsy at times and agitated at others, with vivid visual hallucinations of cats on the bed and inattention on serial 7s and digit-span. Urinalysis: leucocytes ++, nitrites positive. T 37.8°C. Co-amoxiclav was started by his GP 24 hours ago. Routine bloods unremarkable. CT head: age-related atrophy only.\n\nWhich is the most appropriate management?",
   options:["Lorazepam 1 mg as-required for agitation","Treat the underlying UTI, address constipation/dehydration/pain/environment, reorientate, minimise sedatives","Risperidone 1 mg twice daily","Stop co-amoxiclav and observe","Urgent transfer to a psychiatric ward"],
   correct:"B",
   explanation:"DELIRIUM is an acute neuropsychiatric syndrome characterised by FLUCTUATING course, INATTENTION (the cardinal feature; CAM and 4AT diagnostic tools), disturbed CONSCIOUSNESS, and DISORGANISED THINKING. NICE CG103 management: IDENTIFY AND TREAT THE UNDERLYING CAUSE (mnemonic 'PINCH ME': Pain, Infection, Nutrition, Constipation, Hydration, Medication, Environment); UTI is reasonable to treat here given symptoms + dipstick. MINIMISE OFFENDING DRUGS — anticholinergics, benzodiazepines, opioids, sedating antihistamines. ANTIPSYCHOTICS (haloperidol 0.5 mg, or olanzapine — short-acting, low D2 affinity options) are reserved for severe distress or risk to self / others, at the LOWEST DOSE for the SHORTEST DURATION; AVOID in DLB / Parkinson's (severe sensitivity).\n\n(A) Benzodiazepines as first-line risk worsening confusion, falls, respiratory depression, paradoxical disinhibition.\n\n(C) Risperidone scheduled BD is excessive and inappropriate as first-line — non-pharmacological measures plus targeted treatment of the cause come first.\n\n(D) Stopping appropriate antibiotic for confirmed UTI worsens the precipitant.\n\n(E) Psychiatric ward transfer is wrong — delirium is a MEDICAL diagnosis requiring management of the underlying cause; psychiatric admission can worsen outcomes.\n\n💎 PEARL: Delirium = acute, fluctuating, INATTENTION, disorganised thinking. Assess with 4AT or CAM. Always look for the cause (PINCH ME — Pain, Infection, Nutrition, Constipation, Hydration, Medication, Environment). Antipsychotics last resort and contraindicated in Lewy body / Parkinson's.",
   references:[{label:"NICE CG103 — Delirium: prevention, diagnosis and management (2010, updated 2023)", url:"https://www.nice.org.uk/guidance/cg103"},{label:"BGS Delirium Guidelines", url:"https://www.bgs.org.uk/resources/clinical-guidelines"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Frailty admission — comprehensive geriatric assessment",
   stem:"An 87-year-old woman is admitted to the AMU after a mechanical fall at home. She lives alone, walks indoors with a frame, has type 2 DM, mild CKD (eGFR 45), takes 9 regular medications, and has had two unscheduled admissions in the last 6 months (one with pneumonia, one with fluid overload). She is fully oriented (AMT 9/10). Clinical Frailty Scale on admission is 6 (moderately frail). No acute injury identified on examination or imaging.\n\nWhich is the most appropriate next step?",
   options:["Early discharge once medically optimised, with safety-netting","Refer for comprehensive geriatric assessment (cga) by the geriatric medicine team","Refer to community falls clinic only","Admit to the stroke unit","Refer to social services without further medical review"],
   correct:"B",
   explanation:"COMPREHENSIVE GERIATRIC ASSESSMENT (CGA) is a multidimensional, multidisciplinary, evidence-based process that addresses MEDICAL, FUNCTIONAL, PSYCHOLOGICAL, SOCIAL, ENVIRONMENTAL and SPIRITUAL domains in parallel — and produces a co-ordinated plan with regular review. CGA in older adults presenting with unscheduled admission, particularly those with FRAILTY (Clinical Frailty Scale 5–7) and / or geriatric syndromes (falls, delirium, polypharmacy, frailty, immobility, incontinence) IMPROVES OUTCOMES — Cochrane review (Ellis 2017): increases the chance of being ALIVE AND IN THEIR OWN HOME at 3–12 months (NNT ~13), reduces length of stay, reduces functional decline, reduces readmissions.\n\n(A) Early discharge without addressing the broader geriatric issues misses the opportunity for comprehensive assessment and likely leads to readmission.\n\n(C) Falls clinic alone addresses one domain — the multi-domain issues (polypharmacy, multimorbidity, social) need wider review.\n\n(D) No clinical features point to stroke; would not address her actual issues.\n\n(E) Social services without medical review misses reversible medical causes of decline.\n\n💎 PEARL: Frailty (CFS 5–7) + unscheduled admission + geriatric syndromes → comprehensive geriatric assessment. CGA increases the chance of being alive and in own home at 3–12 months (Ellis Cochrane 2017). Multidimensional, multidisciplinary, with regular review.",
   references:[{label:"BGS Comprehensive Geriatric Assessment", url:"https://www.bgs.org.uk/resources/cga"},{label:"Clinical Frailty Scale (Rockwood)", url:"https://www.bgs.org.uk/resources/cfs"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Drug-induced orthostatic hypotension (STOPP)",
   stem:"A 79-year-old man on the AMU has had two falls at home in the past month. Regular medications: amlodipine 10 mg, ramipril 10 mg, doxazosin 4 mg, simvastatin 40 mg, citalopram 20 mg, omeprazole 20 mg, bisoprolol 5 mg. Lying BP 132/76 mmHg, standing BP at 1 minute 96/52 mmHg with reproducible dizziness on standing. No focal deficit, ECG sinus rhythm 62 bpm. Clinical frailty 5.\n\nWhich is the single most appropriate medication change?",
   options:["Stop simvastatin","Stop doxazosin","Stop omeprazole","Stop citalopram","Add midodrine without medication review"],
   correct:"B",
   explanation:"SYMPTOMATIC ORTHOSTATIC HYPOTENSION (drop ≥20 mmHg systolic and/or ≥10 mmHg diastolic on standing OR symptomatic drop) is one of the LEADING REVERSIBLE CAUSES OF FALLS in older adults — and crucially, it is OFTEN DRUG-INDUCED. ON THIS PATIENT: doxazosin is the highest-yield drug to stop FIRST — explicit STOPP recommendation, weak evidence base, high-risk side effect, and specific to falls / orthostasis. CITALOPRAM and BISOPROLOL may also contribute — DEPRESCRIBE SEQUENTIALLY, monitoring BP / mood / falls between changes (sequential not simultaneous to avoid rebound, mood relapse, AF / IHD destabilisation).\n\n(A) Statins are not significantly contributing to orthostasis.\n\n(C) PPI is not a major orthostasis cause; review separately for indication / duration.\n\n(D) Citalopram contributes (SSRIs cause orthostasis and hyponatraemia) but is lower-yield than doxazosin and stopping abruptly risks discontinuation syndrome / mood.\n\n(E) Adding midodrine WITHOUT medication review treats the symptom not the cause; STOPP review FIRST.\n\n💎 PEARL: Symptomatic orthostatic hypotension is a leading reversible cause of falls — and it is usually drug-induced. Stop alpha-blockers (doxazosin) first per STOPP. Then deprescribe antihypertensives, citalopram, beta-blockers SEQUENTIALLY (not simultaneously) with BP and falls re-check between changes.",
   references:[{label:"ESC 2018 Syncope Guidelines", url:"https://academic.oup.com/eurheartj/article/39/21/1883/4939241"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Fragility hip fracture — timing of surgery",
   stem:"An 86-year-old woman presents with a left intertrochanteric fragility hip fracture after a fall from standing. She has well-controlled paroxysmal AF on apixaban (last dose 8 hours ago), normal renal function, and is normally independent indoors with a stick. Clinical frailty 4. Investigations: Hb 110 g/L, INR 1.0, platelets 220 × 10⁹/L, eGFR 72. ECG: sinus rhythm. CXR: clear. Pre-op anaesthetic and orthogeriatric assessment have been completed and she is medically optimised.\n\nWhich is the most appropriate timing for hip surgery?",
   options:["Surgery within 36 hours of admission","Wait 5 days for full apixaban washout","Conservative management with traction; reassess at 7 days","Surgery only after cardiology review for AF","Surgery only when haemoglobin >120 g/L"],
   correct:"A",
   explanation:"NICE NG124 / British Orthopaedic Association BOAST: HIP FRACTURE SURGERY WITHIN 36 HOURS of admission whenever the patient is medically fit. Delay >48 hours is associated with INCREASED 30-DAY MORTALITY, increased pressure ulcers, increased pneumonia, increased delirium, prolonged length of stay, and worse functional recovery (Simunovic 2010 meta-analysis; HEALTH and FAITH trials). NHFD (National Hip Fracture Database) tracks 36-hour metric. APIXABAN with normal renal function does NOT require routine reversal pre-hip surgery — surgery can usually proceed at 24 hours after the last dose for low-bleeding-risk procedures or 48 hours for high-bleeding-risk; tranexamic acid and meticulous haemostasis suffice.\n\n(B) 5-day apixaban washout is unnecessary, increases delay-associated mortality and morbidity.\n\n(C) Conservative management is for very few selected non-displaced fractures or palliative cases — for displaced hip fracture, surgery is overwhelmingly the standard.\n\n(D) AF on stable rate control does not need cardiology review pre hip surgery.\n\n(E) Hb 110 is acceptable for surgery; restrictive transfusion (Hb 70 / 80 with cardiovascular disease per FOCUS trial) — pre-op transfusion to >120 is unnecessary and harmful.\n\n💎 PEARL: Hip fracture surgery within 36 hours of admission — every 24-hour delay raises 30-day mortality, pressure ulcers, pneumonia and delirium (NICE NG124, NHFD metric). Apixaban with normal renal function does NOT require routine reversal — proceed at 24 h after the last dose.",
   references:[{label:"NICE NG124 — Hip fracture: management (2017, updated)", url:"https://www.nice.org.uk/guidance/ng124"},{label:"BGS / BOA Blue Book on Care of Patients with Fragility Fracture", url:"https://www.bgs.org.uk/sites/default/files/content/attachment/2018-05-02/Blue%20Book%20on%20fragility%20fracture%20care.pdf"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Bone protection after fragility fracture",
   stem:"A 78-year-old woman is on the orthogeriatric ward 5 days post-surgical fixation of a left intracapsular hip fracture. She had a previous T10 vertebral fragility fracture aged 71 (managed conservatively, no bone protection started since). No glucocorticoid use. Calcium 2.35 mmol/L (normal), 25-OH vitamin D 65 nmol/L (replete), eGFR 70. DEXA scan has not been performed. She is independently mobile pre-fall.\n\nWhich is the most appropriate bone protection?",
   options:["Calcium and vitamin D only; arrange outpatient DEXA, treat if T-score ≤-2.5","Oral alendronic acid 70 mg weekly","Denosumab 60 mg subcutaneously","Strontium ranelate","Teriparatide as first-line"],
   correct:"B",
   explanation:"NICE TA464 / NOGG (National Osteoporosis Guideline Group) / Royal Osteoporosis Society. ALENDRONIC ACID 70 mg weekly is the standard initial choice (cheap, generic, evidence base — NHANES, FIT, FLEX trials), with COLE-CO-PRESCRIPTION of CALCIUM (≥1000 mg/day) AND VITAMIN D (800–1000 IU/day) — important because bisphosphonates require adequate vitamin D, and untreated low calcium causes hypocalcaemia. Counsel on AKIN-WAKE-WAIT-WAIT instructions: take in the morning on an empty stomach with at least 200 mL plain water; remain upright (sitting / standing) for 30 minutes; no other food / drink / drugs for 30 minutes (oesophagitis prevention).\n\n(A) DEXA is unnecessary BEFORE starting treatment in this scenario — the fracture is diagnostic; DEXA is for monitoring response or in lower-risk cases.\n\n(C) Denosumab is alternative, not first-line — start with cheaper oral bisphosphonate and reserve denosumab for failure / intolerance.\n\n(D) Strontium ranelate is largely withdrawn.\n\n(E) Teriparatide is for severe disease, not first-line.\n\n💎 PEARL: Fragility fracture in patient ≥75 → start oral alendronic acid 70 mg weekly with calcium and vitamin D — no DEXA needed (NICE TA464, NOGG). Counsel on upright + plain water + 30-min wait. Switch to IV zoledronate if oral not tolerated or upper GI contraindicated.",
   references:[{label:"NICE NG104 / NG12 — Fragility fractures, bone health", url:"https://www.nice.org.uk/guidance/ng104"},{label:"NOGG 2021 Guidelines for Osteoporosis", url:"https://www.nogg.org.uk/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Anticholinergic burden",
   stem:"A 76-year-old woman is admitted with a 4-week history of progressive cognitive decline (worsening memory, slowed thinking, visual hallucinations) and a recent fall. Regular medications: amitriptyline 50 mg nocte (chronic back pain), oxybutynin 5 mg three times daily (urge incontinence), promethazine 25 mg nocte (sleep), citalopram 20 mg, omeprazole, atorvastatin, amlodipine. Examination: dry mouth and eyes, urinary retention 350 mL on bladder scan, AMT 6/10. Bloods: U&E normal, B12 / folate normal, TSH normal, glucose normal. CT head: age-related atrophy only. CSF unremarkable.\n\nWhich is the most likely cause of her cognitive decline?",
   options:["Antihypertensive polypharmacy","High anticholinergic burden","Ssri-induced hyponatraemia","Statin-related cognitive impairment","Ppi-induced delirium"],
   correct:"B",
   explanation:"ANTICHOLINERGIC BURDEN is a major REVERSIBLE cause of cognitive impairment, falls, urinary retention, constipation and delirium in older adults — a key SCE / clinical teaching point. The cumulative burden of multiple anticholinergic-active drugs adds up — even drugs with mild individual activity become problematic in combination. MODERATE (score 2 or 1): cetirizine, loperamide, paroxetine, ranitidine, prednisolone. CLINICAL EFFECTS: peripheral — dry mouth, blurred vision (mydriasis, accommodation paralysis), constipation, URINARY RETENTION (precipitates AKI), tachycardia, hot/dry skin; central — cognitive impairment, confusion, delirium, hallucinations, sedation, falls. STOPP CRITERIA EXPLICITLY FLAG concurrent anticholinergic prescribing. Cognition often improves within weeks of stopping.\n\n(A) BP 5 antihypertensives are not contributing here without evidence of orthostasis.\n\n(C) SSRI-induced hyponatraemia — sodium not provided as low here, citalopram has SIADH risk but other clues absent.\n\n(D) Statin-related cognitive impairment is rare and not supported by the constellation here.\n\n(E) PPIs can rarely contribute to cognitive issues but this is not the dominant burden.\n\n💎 PEARL: Worsening cognition + falls + retention + dry mouth + visual change in older patient on amitriptyline / oxybutynin / promethazine / TCAs / antihistamines = anticholinergic burden. Reversible. Use the ACB scale, deprescribe sequentially. Common driver of admissions and 'pseudo-dementia'.",
   references:[{label:"STOPP/START Criteria (Age and Ageing 2023)", url:"https://academic.oup.com/ageing/article/52/4/afad037/7099906"},{label:"Anticholinergic Cognitive Burden Scale", url:"https://www.acbcalc.com/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"DLB — neuroleptic sensitivity reaction",
   stem:"A 78-year-old man with a 2-year history of fluctuating cognition, recurrent visual hallucinations of children in the house, mild parkinsonism, and a 5-year prior history of rem sleep behaviour disorder is admitted with hyperactive delirium triggered by UTI. The on-call team gives haloperidol 1 mg IM for severe agitation. Two hours later: marked generalised rigidity, drowsy (GCS 9), pyrexial (38.6°C), labile blood pressure (swinging 90–180 systolic), CK 850, autonomic features (sweating). DaTscan during a recent assessment had shown reduced striatal dopamine transporter uptake.\n\nWhich is the most likely diagnosis underlying his sensitivity reaction?",
   options:["Alzheimer's dementia with delirium","Dementia with Lewy bodies","Vascular dementia","Frontotemporal dementia","Creutzfeldt-Jakob disease"],
   correct:"B",
   explanation:"DEMENTIA WITH LEWY BODIES (DLB): the second most common neurodegenerative dementia after Alzheimer's. SUPPORTIVE features: SEVERE NEUROLEPTIC SENSITIVITY, autonomic dysfunction, falls, syncope, hyposmia, depression, delusions. INDICATIVE biomarkers: DaTscan (reduced striatal dopamine transporter — this patient), reduced ¹²³I-MIBG cardiac uptake, polysomnography-confirmed REM sleep without atonia. The mechanism of neuroleptic sensitivity in DLB is thought to be already compromised dopaminergic system + alpha-synuclein pathology in the substantia nigra; D2 antagonism precipitates extrapyramidal disaster. MANAGEMENT — DLB-specific approach: AVOID typical antipsychotics (haloperidol, chlorpromazine — life-threatening reactions). Levodopa CAUTIOUSLY for parkinsonism (lower threshold for psychosis). CLONAZEPAM or MELATONIN for RBD.\n\n(A) Alzheimer's: predominantly memory loss without prominent hallucinations / parkinsonism early; severe neuroleptic sensitivity less common (though atypicals still preferred).\n\n(C) Vascular dementia: stepwise progression, focal signs, no parkinsonism / RBD pattern.\n\n(D) FTD: behavioural / personality change or progressive aphasia, frontal atrophy, no parkinsonism / RBD typically.\n\n(E) CJD: rapid progression, myoclonus, ataxia, EEG periodic complexes, MRI cortical ribboning, CSF 14-3-3 / RT-QuIC.\n\n💎 PEARL: Fluctuating cognition + visual hallucinations + parkinsonism + REM sleep behaviour disorder = DLB. NEVER give haloperidol or other typical antipsychotic — severe neuroleptic sensitivity reaction (rigidity, fever, autonomic instability) in up to 50%. Quetiapine / clozapine if essential.",
   references:[{label:"BSH DIC Guidelines", url:"https://b-s-h.org.uk/guidelines/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Chronic subdural haematoma",
   stem:"An 81-year-old man on apixaban for AF presents with 3 weeks of progressive headache, gait unsteadiness, mild left-sided weakness (4/5) and increasing forgetfulness. He fell from standing 6 weeks ago without obvious head injury (no loc; no seek of medical attention at the time). Examination: GCS 14 (mild drowsiness), left pronator drift, mild left hemiparesis. CT head (without contrast): large right-sided crescentic hypodense extra-axial collection (chronic blood — black) with 7 mm midline shift and effacement of the right lateral ventricle.\n\nWhich is the most appropriate next step?",
   options:["Discharge with outpatient neurology review","Reverse anticoagulation; urgent neurosurgical referral for burr-hole evacuation","Dexamethasone alone and observe","Lumbar puncture","MRI brain only"],
   correct:"B",
   explanation:"CHRONIC SUBDURAL HAEMATOMA (CSDH): a common, often under-recognised condition in older adults — particularly those on anticoagulation. \n\nPRESENTATION: insidious progressive headache, gait disturbance, focal weakness, cognitive decline, drowsiness, sometimes seizures. MANAGEMENT (URGENT): (1) ANTICOAGULATION REVERSAL — apixaban / rivaroxaban (factor Xa inhibitors): ANDEXANET ALFA where available (recombinant factor Xa decoy — ANNEXA-4 trial), or 4-FACTOR PCC if andexanet not available; dabigatran: IDARUCIZUMAB (specific antibody, REVERSE-AD trial); warfarin: 4-factor PCC + IV vitamin K 5–10 mg.\n(2) URGENT NEUROSURGICAL referral for BURR-HOLE EVACUATION.\n\n(A) Discharge with outpatient review is unsafe — significant midline shift and progressive deficit.\n\n(C) Dexamethasone alone is inferior to surgery for mass effect CSDH.\n\n(D) LP risks tonsillar / transtentorial herniation in mass effect — contraindicated.\n\n(E) MRI characterises better but does not change urgent management.\n\n💎 PEARL: Older patient on DOAC + insidious headache + gait change + drop in GCS or focal weakness + crescentic HYPODENSE collection on CT = chronic subdural. Reverse anticoagulation (andexanet — ANNEXA-4 — for apixaban/rivaroxaban; PCC if unavailable). Burr-hole evacuation.",
   references:[{label:"NICE NG41 — Head injury: assessment and early management", url:"https://www.nice.org.uk/guidance/ng232"},{label:"BTNS UK Chronic SDH Trial (Brodbelt et al.)", url:"https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(20)30733-X/fulltext"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Mental Capacity Act — capacity assessment",
   stem:"An 82-year-old woman with moderate Alzheimer's dementia and severe community-acquired pneumonia (sepsis, RR 28, SpO₂ 88% on air, lactate 3.2, requiring IV antibiotics and oxygen) is refusing IV access and antibiotics, saying repeatedly 'I just want to go home — leave me alone.' On structured assessment of the specific decision: she fluctuates between agreement and refusal; she does not retain the information that not having antibiotics may worsen her condition or be life-threatening; she cannot weigh the alternatives or consequences. There is no advance directive and no Lasting Power of Attorney for health and welfare.\n\nWhich is the most appropriate next step?",
   options:["Respect her refusal and discharge her home","Treat under common law as 'incompetent'","Perform a formal Mental Capacity Act 2005 assessment for the specific decision; if she lacks capacity, treat in her best interests","Refer to psychiatry to enforce treatment under Mental Health Act","Apply for an urgent court order"],
   correct:"C",
   explanation:"MENTAL CAPACITY ACT 2005 (England and Wales) — the legal framework for decision-making for adults aged ≥16 who may lack capacity. CAPACITY IS DECISION-SPECIFIC AND TIME-SPECIFIC — assess for THIS specific decision, at THIS specific time. A person may have capacity for some decisions and not others (e.g. capacity for what to eat, but not for major surgery). Treatment (antibiotics, IV access) proceeds under the doctrine of best interests — this is LAWFUL despite her refusal because she lacks capacity. REVIEW capacity regularly — capacity may return as sepsis treats.\n\n(A) Respecting refusal of someone who lacks capacity for a life-threatening decision is unlawful and unethical.\n\n(B) 'Incompetent' is not a legal term in this context — formal MCA assessment is required.\n\n(D) MENTAL HEALTH ACT (1983) is for treatment of MENTAL disorder — not appropriate for medical (physical) treatment of pneumonia in someone with dementia; MCA is correct framework for decisions about physical illness in adults lacking capacity.\n\n(E) Court of Protection is for serious / contested cases (e.g. withdrawal of life-sustaining treatment, or where the family disputes a best-interests decision) — most clinical decisions are managed under standard MCA framework.\n\n💎 PEARL: Mental Capacity Act: capacity is DECISION-SPECIFIC and TIME-SPECIFIC. Two-stage test: diagnostic (impairment of mind) + functional (understand, retain, weigh, communicate). If lacks capacity → treat in best interests, document, review (capacity may return).",
   references:[{label:"Mental Capacity Act 2005 Code of Practice", url:"https://www.gov.uk/government/publications/mental-capacity-act-code-of-practice"},{label:"NICE NG108 — Decision-making and mental capacity", url:"https://www.nice.org.uk/guidance/ng108"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"ReSPECT discussion in advanced frailty",
   stem:"A 91-year-old woman with severe heart failure (NYHA IV, three admissions in 6 months for fluid overload despite optimal medical therapy), advanced Alzheimer's dementia (Clinical Frailty Scale 8 — 'very severely frail'), and recurrent aspiration pneumonia (third presentation in 4 months despite SLT review and modified diet) is admitted with another aspiration event. She is bed-bound, no longer recognises family members, and is unable to participate in detailed discussion. There is no advance directive and no LPA for health. Her family (two adult children) request a meeting with the consultant.\n\nWhich is the most appropriate next step?",
   options:["Default to full active management including itu and CPR until contraindicated","Respect-style discussion with family (and patient if able) about realistic ceiling of care, recognising the irreversible trajectory and very high mortality","Withdraw all treatment now without discussion","Compulsory psychiatric assessment to enforce treatment","Refer to palliative care without informing the family"],
   correct:"B",
   explanation:"ReSPECT (Recommended Summary Plan for Emergency Care and Treatment): a structured PROCESS and DOCUMENT for shared decision-making about emergency treatment. Designed for any patient at risk of clinical deterioration / sudden cardiac arrest. ReSPECT is NOT just a DNACPR form — it is a holistic, person-centred care plan covering: priorities and values, ceiling of treatment (full active care, ward-based care, comfort care), CPR status, specific clinical recommendations, and the involvement of family / advocates. Replaces previous fragmented systems. Family members (without LPA) do NOT have legal authority to make decisions but are CONSULTED to inform best-interests decision-making.\n\n(A) Default to full active management is harmful in this context — would not benefit the patient and goes against her likely wishes.\n\n(C) Sudden withdrawal without discussion is wrong process and traumatic for family.\n\n(D) MHA is for mental disorder treatment — irrelevant.\n\n(E) Palliative referral without family communication breaks trust.\n\n💎 PEARL: Advanced frailty (CFS ≥7) + irreversible trajectory + recurrent admissions = trigger for ReSPECT-style conversation. Family WITHOUT LPA cannot consent on the patient's behalf — they inform best-interests discussion. The clinician makes the recommendation; the document travels with the patient.",
   references:[{label:"BGS Comprehensive Geriatric Assessment", url:"https://www.bgs.org.uk/resources/cga"},{label:"Clinical Frailty Scale (Rockwood)", url:"https://www.bgs.org.uk/resources/cfs"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Asymptomatic bacteriuria in delirium",
   stem:"A 79-year-old woman is admitted with new confusion attributed by the GP to a UTI. On systematic review: no urinary frequency, no dysuria, no suprapubic pain, no fever (she is now afebrile 37.0°C), no flank tenderness; she does have long-standing oab symptoms predating admission. Urinalysis: leucocytes ++, nitrites positive (no urine culture sent yet by GP). Bloods: WCC 14.5 (neutrophilia), CRP 110 (raised), lactate 1.6. Chest examination: right basal crackles. CXR: right lower lobe consolidation. Stool: not described.\n\nWhich is the most appropriate antimicrobial management?",
   options:["Trimethoprim 200 mg BD for the urine result","Nitrofurantoin 100 mg modified-release BD for the urine result","Treat the pneumonia; do not treat the urine (asymptomatic bacteriuria)","Treat both UTI and pneumonia with separate courses","No antibiotics; observe"],
   correct:"C",
   explanation:"ASYMPTOMATIC BACTERIURIA (ASB): the presence of bacteria in the urine WITHOUT urinary symptoms. ASB SHOULD NOT BE TREATED in most situations (IDSA / NICE / SHEA / BSAC guidance) — exceptions are: PREGNANT women (treat — risk of pyelonephritis and preterm labour); patients undergoing UROLOGICAL PROCEDURES with mucosal trauma; AFTER kidney transplantation in the early period. Treatment of ASB does NOT prevent symptomatic UTI, does NOT prevent renal failure or mortality, and DRIVES antimicrobial resistance, Clostridioides difficile infection, and adverse drug effects. Treat the PNEUMONIA per local CAP guideline (CURB-65 stratified — likely co-amoxiclav or amoxicillin + macrolide).\n\n(A) Trimethoprim for ASB is standard mistake to avoid; resistance high; not benign (bone marrow, hyperkalaemia).\n\n(B) Nitrofurantoin similarly inappropriate for ASB; also avoided in eGFR <45.\n\n(D) Double antibiotic for non-existent UTI compounds the harm.\n\n(E) No antibiotic at all undertreats the pneumonia.\n\n💎 PEARL: Asymptomatic bacteriuria should NOT be treated (IDSA, NICE). Exceptions: pregnancy, pre-urological-procedure, early post-renal-transplant. Treating ASB does not prevent symptomatic UTI, drives resistance and C. difficile. In delirium, find the actual cause (here pneumonia).",
   references:[{label:"NICE CG103 — Delirium: prevention, diagnosis and management (2010, updated 2023)", url:"https://www.nice.org.uk/guidance/cg103"},{label:"BGS Delirium Guidelines", url:"https://www.bgs.org.uk/resources/clinical-guidelines"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Atypical infection presentation in older adults",
   stem:"An 83-year-old man with mild Alzheimer's dementia is admitted from a care home with new-onset confusion, reduced oral intake (2 days of poor eating and drinking) and a fall (mechanical, no head injury). He is afebrile (36.4°C), HR 96, BP 110/68, RR 24, SpO₂ 92% on air. Examination: right basal crackles. Bloods: WCC 14.2 (neutrophilia), CRP 165 (raised), lactate 2.1, urea 9, sodium 132. CXR: right lower lobe consolidation. Urinalysis: trace leucocytes only, no nitrites.\n\nWhich is the most likely diagnosis?",
   options:["Acute kidney injury alone","Community-acquired pneumonia presenting atypically","Acute coronary syndrome","Pulmonary embolism","Subdural haematoma"],
   correct:"B",
   explanation:"OLDER ADULTS FREQUENTLY PRESENT ATYPICALLY with infection — a fundamental teaching point for SCE and clinical practice. FEVER MAY BE ABSENT (or even hypothermia in severe sepsis) in up to 30% of older adults with bacterial infection — due to attenuated febrile response (immunosenescence, reduced thermoregulation, beta-blocker / paracetamol use). RISK STRATIFICATION: CURB-65 score (Confusion AMT ≤8 / new confusion = 1, Urea >7 = 1, RR ≥30, BP <90 systolic / ≤60 diastolic, age ≥65 = 1) — this patient scores 3 (confusion + urea 9 + age) → MODERATE-HIGH RISK; admit for IV antibiotics, consider HDU level care.\n\n(A) AKI alone does not explain consolidation, raised CRP and tachypnoea.\n\n(C) ACS would have chest pain (less reliable in older adults), ECG / troponin changes; no pleuropulmonary signs typically.\n\n(D) PE: pleuritic pain, sinus tachycardia, raised D-dimer, abnormal CTPA — but the focal consolidation here is more consistent with pneumonia.\n\n(E) SDH: focal neurological signs, head injury history, CT changes — none described.\n\n💎 PEARL: Older adults with infection often present ATYPICALLY: fever absent in up to 30%, may be hypothermic. Confusion, falls, reduced intake or functional decline can be the only signs. Use CURB-65 (≥3 = severe), check lactate, treat early — diagnostic anchoring delays kill.",
   references:[{label:"BGS Older People with Sepsis Guidance", url:"https://www.bgs.org.uk/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"SSRI-induced SIADH",
   stem:"A 76-year-old woman is admitted with confusion and a fall. Sodium 118 mmol/L (138 four weeks earlier). She was started on citalopram 20 mg five weeks ago for low mood. She is clinically euvolaemic (no postural drop, no oedema, JVP normal). Plasma osmolality 254 mOsm/kg (low), urine osmolality 480 mOsm/kg (inappropriately concentrated), urine sodium 62 mmol/L (>30). TFTs normal; short Synacthen test normal; chest, abdominal and pelvic imaging unremarkable.\n\nWhich is the most likely cause of her hyponatraemia?",
   options:["Hypovolaemic hyponatraemia from poor oral intake","Ssri-induced syndrome of inappropriate antidiuresis","Primary hypothyroidism","Adrenal insufficiency","Cerebral salt wasting"],
   correct:"B",
   explanation:"HYPONATRAEMIA APPROACH (key SCE topic): assess VOLUME STATUS first, then PLASMA + URINE OSMOLALITY + URINE SODIUM. CAUSES of SIADH: (1) MALIGNANCY — small cell lung cancer (most classic), pancreas, lymphoma, head/neck;\n(2) PULMONARY — pneumonia, TB, abscess, asthma;\n(3) CNS — stroke, meningitis, encephalitis, head injury, SAH, MS;\n(4) DRUGS — SSRIs (citalopram, sertraline, fluoxetine — particularly the FIRST 4 WEEKS of treatment in OLDER WOMEN), antiepileptics (carbamazepine, oxcarbazepine, lamotrigine), TCAs, antipsychotics, MDMA, opiates, NSAIDs, chemotherapy (vincristine, cyclophosphamide), thiazide diuretics (often classed separately as 'thiazide-induced' rather than true SIADH);\n(5) Other: post-operative, severe pain, nausea, exercise.\n\n(A) Hypovolaemic hyponatraemia: clinically dehydrated, urinary Na <20, postural BP drop.\n\n(C) Hypothyroidism causes hyponatraemia but TFTs were normal.\n\n(D) Adrenal insufficiency causes hyponatraemia (low aldosterone) — Synacthen normal.\n\n(E) Cerebral salt wasting: similar biochemistry but volume DEPLETED (negative fluid balance) following acute brain injury — different management (fluid replacement, fludrocortisone).\n\n💎 PEARL: Older woman + new hyponatraemia 4–6 weeks after starting an SSRI (citalopram, sertraline, fluoxetine) + euvolaemic + plasma osmolality low + urine osmolality inappropriately concentrated = SSRI-induced SIADH. Stop the SSRI, fluid-restrict, monitor sodium, alternative antidepressant.",
   references:[{label:"Society for Endocrinology Emergency Endocrine Guidance — SIADH/Hyponatraemia", url:"https://www.endocrinology.org/clinical-practice/clinical-guidance/"},{label:"European Society Hyponatraemia Guideline (2014)", url:"https://academic.oup.com/ejendo/article/170/3/G1/6660525"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Apixaban dose reduction in older adults",
   stem:"An 84-year-old woman is admitted with new asymptomatic AF (incidentally on routine ECG). Past history: ischaemic stroke 4 years ago with mild residual dysphasia, well-controlled hypertension on amlodipine, no prior bleeding. Weight 58 kg, eGFR 48 mL/min/1.73m², creatinine 118 µmol/L. Cha₂DS₂-vasc score 6 (high stroke risk), HAS-BLED 2 (low-moderate bleeding risk). She is keen to start anticoagulation.\n\nWhich is the most appropriate anticoagulation regimen?",
   options:["No anticoagulation due to age alone","Aspirin 75 mg daily","Apixaban 5 mg twice daily","Apixaban 2.5 mg twice daily","Warfarin with INR target 2.5–3.5"],
   correct:"D",
   explanation:"APIXABAN DOSE REDUCTION CRITERIA — reduce to 2.5 mg BD if patient meets ≥2 of the following 3 criteria: AGE ≥80 years; WEIGHT ≤60 kg; CREATININE ≥133 µmol/L (1.5 mg/dL). This patient: AGE 84 (✓) AND WEIGHT 58 kg (✓) — meets 2/3, so 2.5 mg BD is correct. Creatinine 118 alone would not require dose reduction, but is <133 in any case. The eGFR of 48 ml/min/1.73m² (CKD stage 3a) is acceptable — apixaban is generally OK down to CrCl 15 (eGFR proxy), with dose reduction triggered by the criteria above (not by eGFR alone).\n\n(A) Withholding anticoagulation due to age alone is poor practice — denies effective therapy.\n\n(B) Aspirin is INFERIOR to DOAC for stroke prevention in AF and has comparable bleeding risk — no longer recommended for AF stroke prevention (ACTIVE-W trial).\n\n(C) Apixaban 5 mg BD is appropriate for those who do NOT meet 2/3 dose-reduction criteria — overdosing in this patient increases bleeding risk.\n\n(E) Warfarin INR 2.5–3.5 is for mechanical valves; AF target is INR 2.0–3.0 — and DOACs are preferred.\n\n💎 PEARL: Apixaban dose reduction to 2.5 mg BD if ≥2 of: age ≥80, weight ≤60 kg, creatinine ≥133 µmol/L. eGFR alone does not trigger reduction — apixaban is acceptable down to CrCl 15. Don't withhold for age alone — high CHA₂DS₂-VASc patients need anticoagulation.",
   references:[{label:"NICE NG196 — Atrial fibrillation (DOAC dosing)", url:"https://www.nice.org.uk/guidance/ng196"},{label:"BNF — Apixaban dosing", url:"https://bnf.nice.org.uk/drugs/apixaban/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Falls — multifactorial assessment",
   stem:"A 79-year-old man is admitted after his fourth fall in 6 months. He lives alone, on multiple medications (amlodipine, ramipril, doxazosin, citalopram, omeprazole, simvastatin), and has had two ED attendances this year. The on-call team performs a timed up and go (TUG) test as part of bedside assessment: he takes 18 seconds to rise from a chair, walk 3 metres, turn, return and sit down (normal <12 sec).\n\nWhich is the most appropriate next step?",
   options:["Reassure — TUG of 18 seconds is within normal limits","Multifactorial falls assessment","Urgent neurology referral for severe parkinsonism","Admit under orthopaedics","Dementia screen alone"],
   correct:"B",
   explanation:"FALLS in older adults are a leading cause of injury, hospitalisation, loss of independence and mortality — a third of community-dwelling adults aged ≥65 fall each year. TIMED UP AND GO (TUG) test is a brief screening tool for mobility and falls risk: ≥12 SECONDS in community-dwelling older adults indicates INCREASED FALLS RISK and warrants formal assessment (≥14 sec in some studies).\n\n(A) TUG ≥12 sec is increased risk — requires action.\n\n(C) Single TUG result alone does not diagnose Parkinson's; further neurological history and exam needed.\n\n(D) Admission under orthopaedics is for fracture; this patient has had falls without fracture documented here.\n\n(E) Dementia screen is part of multifactorial assessment but not the only step.\n\n💎 PEARL: Recurrent falls + TUG ≥12 sec → multifactorial falls assessment (NICE CG161): medication review, orthostatic BP, cardiovascular and ECG, vision, gait/balance, cognition, continence, footwear, home hazards. Strength + balance training (Otago, FaME) reduces falls.",
   references:[{label:"NICE CG161 — Falls in older people (2013)", url:"https://www.nice.org.uk/guidance/cg161"},{label:"BGS Falls Guidance", url:"https://www.bgs.org.uk/resources/falls-prevention-and-management"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Recognising the dying phase — AMU",
   stem:"A 92-year-old man with end-stage COPD (FEV1 22% predicted, on home NIV for the past year), advanced heart failure (recurrent admissions), and recurrent admissions for the same is brought to the AMU drowsy and unable to communicate. He has lost 8 kg over 3 months, is bedbound at home, has stopped eating, and ceased to engage with family. The previous discharge summary documents a recent ReSPECT plan: ward-level care, no NIV escalation, not for CPR. He is in respiratory distress with central cyanosis. Family at the bedside.\n\nWhich is the most appropriate management?",
   options:["Intubate and mechanically ventilate","Override the existing plan and trial full Bipap settings","Recognise the patient is dying; switch to symptom-focused care with anticipatory medications and family support","Routine antibiotics, IV fluids and observation pending consultant review","Refer to ICU for review"],
   correct:"C",
   explanation:"RECOGNISING THE DYING PHASE — fundamental clinical skill, often missed. SOCIETY FOR ACUTE MEDICINE (SAM) ACUTE CARE TOOLKIT 6 (END-OF-LIFE CARE in the AMU) and NICE NG142 (End of life care for adults: service delivery): EARLY RECOGNITION of dying allows transition to symptom-focused care, dignified death, family preparation.\n\n(A) Intubation and mechanical ventilation against pre-expressed wishes is harmful — prolongs dying, causes distress and indignity.\n\n(B) Overriding the documented ReSPECT plan would breach the patient's clear advance care planning.\n\n(D) Routine medical care 'just in case' may be appropriate as a trial early in admission, but in this clearly dying patient with established trajectory, prolongs death without symptom benefit.\n\n(E) ICU referral against the documented plan is similarly inappropriate — escalation would not reverse the underlying processes.\n\n💎 PEARL: End-stage organ failure + advanced frailty + ReSPECT plan limiting escalation + no oral intake + cyanosis = dying phase. Recognise it. Switch to symptom-focused care, anticipatory subcutaneous medications (morphine, midazolam, glycopyrronium) and family support — don't intubate.",
   references:[{label:"NICE NG31 — Care of dying adults in last days of life (2015)", url:"https://www.nice.org.uk/guidance/ng31"}]},

  {section:"other", specialty:"Dermatology", topic:"DRESS syndrome (carbamazepine)",
   stem:"A 34-year-old woman started carbamazepine 4 weeks ago for trigeminal neuralgia. She presents with widespread morbilliform rash (over >50% body surface area, blanching, no mucosal involvement, no blistering), prominent facial oedema, fever 39.1°C, generalised lymphadenopathy (cervical, axillary), tender hepatomegaly, and arthralgia. Investigations: ALT 480 (raised — hepatitis), eosinophil count 2.4 × 10⁹/L (markedly raised), atypical lymphocytes on blood film, normal renal function (creatinine 75), CXR clear, no evidence of pulmonary involvement. Regiscar score for dress = 6 (definite). HHV-6 PCR pending.\n\nWhich is the most appropriate management?",
   options:["Continue carbamazepine and add antihistamine","Stop carbamazepine immediately, initiate supportive care, systemic corticosteroids for visceral involvement, avoid related aromatic anticonvulsants in future","Topical steroid alone, continue drug","Empirical antibiotics","Ivig as first-line therapy"],
   correct:"B",
   explanation:"DRESS SYNDROME (Drug Reaction with Eosinophilia and Systemic Symptoms) — also known as DIHS (Drug-Induced Hypersensitivity Syndrome): severe, potentially LIFE-THREATENING idiosyncratic drug reaction characterised by widespread RASH, FEVER, LYMPHADENOPATHY, EOSINOPHILIA, and VISCERAL ORGAN INVOLVEMENT. \n\nDIAGNOSIS: clinical (REGISCAR DRESS criteria - well validated) + temporal relationship to drug; biopsy supports but not specific (interface dermatitis, eosinophils); HHV-6 / HHV-7 / EBV / CMV PCR (positive = severe disease marker). \n\nMANAGEMENT: (1) IDENTIFY and STOP the offending drug IMMEDIATELY — most important step; failure to stop = ongoing harm and potential death. (10) GENETIC testing in selected cases.\n\n(A) Continue carbamazepine guarantees worsening, organ failure, death.\n\n(C) Topical steroid alone insufficient for severe systemic reaction with hepatitis; doesn't address ongoing drug exposure.\n\n(D) Empirical antibiotics not indicated (no infection); risk of further drug reactions in already-sensitised immune system.\n\n(E) IVIG is reserved for severe / refractory cases — not first-line; corticosteroids first-line in DRESS with visceral involvement.\n\n💎 PEARL: Carbamazepine / lamotrigine / allopurinol / sulfa / phenytoin started 2–8 weeks ago + morbilliform rash + facial oedema + fever + lymphadenopathy + eosinophilia + raised ALT = DRESS. Stop the drug, supportive care, steroids if visceral organ involvement. Avoid the whole drug class lifelong.",
   references:[{label:"BAD UK Guidelines for SCAR (Br J Dermatol 2024)", url:"https://www.bad.org.uk/clinical-services/guidelines/"},{label:"RegiSCAR DRESS Diagnostic Criteria", url:"https://onlinelibrary.wiley.com/doi/10.1111/j.1346-8138.2011.01277.x"}]},

  {section:"other", specialty:"Dermatology", topic:"Erythroderma — psoriatic flare",
   stem:"A 65-year-old man with chronic plaque psoriasis abruptly stops his potent topical steroid (clobetasol propionate ointment used twice daily for 6 months) without consultation. Over 5 days he develops widespread erythema involving >90% of his body surface area, fine scaling, fever (38.2°C), tachycardia (HR 110), peripheral oedema, and feels unwell. Examination: erythroderma, skin warm to touch, palpable cervical and axillary lymphadenopathy, lower limb pitting oedema. Investigations: albumin 26 g/L (low), creatinine 130 (mildly raised), Na 132 (slightly low), Hb 110, WCC 12 (mildly raised), CRP 80, blood cultures pending.\n\nWhich is the most appropriate management?",
   options:["Outpatient topical management","Admit, monitor temperature and fluid balance, bland emollients, treat the underlying cause, avoid systemic steroids in psoriasis (risk of pustular flare on withdrawal), senior dermatology input","Oral antihistamine alone as outpatient","Cytotoxic chemotherapy","No further treatment needed — observation only"],
   correct:"B",
   explanation:"ERYTHRODERMA (exfoliative dermatitis): generalised erythema affecting >90% of body surface area; a DERMATOLOGICAL EMERGENCY due to systemic complications: TEMPERATURE DYSREGULATION; FLUID and ELECTROLYTE LOSS; HIGH-OUTPUT CARDIAC FAILURE; SEPSIS; HYPOALBUMINAEMIA (massive protein loss); HYPOCALCAEMIA; LYMPHADENOPATHY (reactive 'dermatopathic lymphadenitis' or true lymphoma); DEEP VEIN THROMBOSIS risk. \n\nPRESENTATION: extensive erythema, fine scaling (psoriasis), fluid loss, fever, lymphadenopathy, pruritus, eyelid ectropion, palmoplantar keratoderma, alopecia (chronic). MANAGEMENT — DERMATOLOGICAL \n\nEMERGENCY: (1) ADMIT — typically dermatology / acute medicine ward; monitor in HDU / ICU if haemodynamically unstable; SENIOR DERMATOLOGY INPUT EARLY (specialist nursing also crucial). DRUG REACTION — STOP the drug.\n\n(A) Outpatient management of erythroderma is unsafe — dermatological emergency.\n\n(C) Antihistamine alone doesn't address fluid loss / temperature dysregulation / underlying cause.\n\n(D) Cytotoxic chemotherapy not appropriate as first-line; reserved for confirmed Sézary / lymphoma.\n\n(E) Observation alone risks fatal complications.\n\n💎 PEARL: Abrupt withdrawal of potent topical or systemic steroid in plaque psoriasis can flip into erythroderma (>90% BSA) — temperature dysregulation, fluid loss, high-output failure, sepsis risk. Bland emollients, fluid balance, treat the cause. AVOID systemic steroids — they trigger pustular flare on withdrawal.",
   references:[{label:"BAD Erythroderma Guidance", url:"https://www.bad.org.uk/clinical-services/guidelines/"}]},

  {section:"other", specialty:"Allergy", topic:"Hereditary angioedema (C1-INH deficiency)",
   stem:"A 28-year-old man has had recurrent episodes of non-pruritic, non-urticarial swelling of the face, lips, and intermittent severe abdominal pain (one episode mimicked acute appendicitis 2 years ago — exploratory laparoscopy unrevealing). Episodes started in adolescence (mid-teens), occur every 2-3 months, last 2-5 days, may be triggered by minor trauma (recent dental extraction precipitated current attack), stress, infection. His father had similar episodes. He is on no medications (including no ACE inhibitors). Examination: tense lip and lower face oedema, no tongue, no urticaria, no rash, no bronchospasm, BP 130/80. Investigations: tryptase normal, C4 low (0.05 g/L; normally 0.15-0.4), C1-ESTERASE inhibitor (C1-INH) antigenic level low (0.05 g/L; normal 0.18-0.35), C1q normal.\n\nWhich is the most likely diagnosis?",
   options:["Allergic angioedema — prescribe self-injectable adrenaline","Hereditary angioedema (Type I C1-INH deficiency)","Anaphylaxis","Mast cell activation syndrome","Eczema"],
   correct:"B",
   explanation:"HEREDITARY ANGIOEDEMA (HAE): rare autosomal dominant condition characterised by recurrent attacks of BRADYKININ-MEDIATED ANGIOEDEMA. PRESENTATION — typically begins in childhood / adolescence; recurrent episodes throughout life; THREE main attack patterns: (1) PERIPHERAL angioedema — face, lips, tongue, hands, feet, genitals; non-pruritic, non-urticarial, may be tense and distorting;\n(2) ABDOMINAL angioedema — submucosal swelling of GI tract — severe colicky abdominal pain; ascites can occur;\n(3) LARYNGEAL angioedema — life-threatening airway obstruction; typically slower onset (hours) than allergic but can compromise airway suddenly; LIFETIME RISK of laryngeal attacks ~50%, mortality of LARYNGEAL HAE attack ~25% if untreated.\n\n(A) Allergic angioedema: associated with urticaria, pruritus, allergic trigger; would respond to standard anaphylaxis treatments (this patient has none of these).\n\n(C) Anaphylaxis: rapid onset multi-system reaction (urticaria, bronchospasm, hypotension); tryptase usually elevated; not familial.\n\n(D) MCAS: episodic mast-cell mediator release; tryptase often elevated during episodes; multi-system.\n\n(E) Eczema: chronic atopic skin condition, not episodic angioedema.\n\n💎 PEARL: Recurrent angioedema (face, GI 'abdominal attacks', laryngeal) without urticaria + family history = HAE. Low C4 is the screening test (always low between attacks); confirm with low or dysfunctional C1-INH. Avoid ACE inhibitors and oestrogens. Acute attack: icatibant or C1-INH concentrate — adrenaline and steroids don't work.",
   references:[{label:"WAO/EAACI HAE Guidelines (2022)", url:"https://onlinelibrary.wiley.com/doi/10.1002/aler.13513"},{label:"BSACI HAE Guidelines (2017)", url:"https://onlinelibrary.wiley.com/doi/10.1111/cea.12886"}]},

  {section:"other", specialty:"Immunology", topic:"Common variable immunodeficiency (CVID)",
   stem:"A 35-year-old woman has had recurrent bacterial sinopulmonary infections for 5 years (S. pneumoniae, H. influenzae — multiple chest infections, frequent sinusitis, recurrent otitis media), with development of bronchiectasis on HRCT (cylindrical, lower lobe predominant). She has had two episodes of giardiasis (chronic diarrhoea, weight loss) plus recurrent Campylobacter, splenomegaly, and recently developed autoimmune thrombocytopenia (ITP) requiring corticosteroids. Investigations: IgG 4.0 g/L (low; normal 7-16), IgA <0.07 g/L (low; normal 0.7-4), IgM 0.3 g/L (low; normal 0.4-2.5); B cells (CD19+) present in normal numbers (this distinguishes from xla); poor / absent antibody response to test vaccinations (pneumococcal polysaccharide / tetanus toxoid challenge); HIV negative; protein loss (urinary, GI) ruled out; no medications causing immunoglobulin loss; no haematological malignancy on initial workup.\n\nWhich is the most likely diagnosis?",
   options:["Selective IgA deficiency","Common variable immunodeficiency (cvid)","X-linked agammaglobulinaemia","Severe combined immunodeficiency","HIV"],
   correct:"B",
   explanation:"COMMON VARIABLE IMMUNODEFICIENCY (CVID): the MOST COMMON SYMPTOMATIC PRIMARY ANTIBODY DEFICIENCY in adults; prevalence ~1 in 25,000-50,000; PRESENTS at any age but typically in 20s-30s (peak), with 25% presenting in childhood and bimodal distribution; M = F. DIAGNOSIS — ESID criteria (European Society for Immunodeficiencies): (1) markedly REDUCED IgG (typically >2 SD below mean for age) PLUS markedly reduced IgA AND/OR IgM;\n(2) POOR or ABSENT response to vaccinations;\n(3) EXCLUSION of secondary causes; (4) age >2-4 years (cannot diagnose in young children — physiological hypogammaglobulinaemia of infancy).\n\n(A) Selective IgA deficiency: only IgA low; IgG and IgM normal; usually asymptomatic (most never present); IVIG NOT given (most preparations contain trace IgA — risk of IgA antibody anaphylaxis).\n\n(C) X-linked agammaglobulinaemia: B cells ABSENT in peripheral blood; presents earlier (6-12 months); X-linked; usually male.\n\n(D) SCID: T-cell deficiency dominant; opportunistic infections (PCP, fungal, viral); fatal in infancy.\n\n(E) HIV: secondary cause; serology positive.\n\n💎 PEARL: Adult onset + recurrent sinopulmonary infections + bronchiectasis + low IgG + low IgA/IgM + poor vaccine response (after excluding secondary causes) = CVID. Most common symptomatic primary antibody deficiency in adults. IVIG / SCIG replacement; surveillance for autoimmunity, lymphoma and granulomatous disease.",
   references:[{label:"UKPID/IPOPI Primary Immunodeficiency Resources", url:"https://www.ukpin.org.uk/guidelines/"},{label:"ESID Diagnostic Criteria PID", url:"https://esid.org/Working-Parties/Clinical/Resources"}]},

  {section:"other", specialty:"Statistics", topic:"Specificity, PPV and prevalence",
   stem:"A new biomarker for early-stage lung cancer is being evaluated. In a study of 10,000 high-risk smokers, 200 have the cancer, of whom 180 test positive for the biomarker (true positive). Of the 9800 without cancer, 490 test positive (false positive). The remaining without-cancer participants test negative (true negative). The remaining with-cancer participants test negative (false negative). What is the specificity of the test?",
   options:["80%","95%","27%","73%","100%"],
   correct:"B",
   explanation:"DIAGNOSTIC TEST PERFORMANCE — KEY CONCEPTS: every diagnostic test produces a 2x2 table that summarises performance against the GOLD-STANDARD reference. WORK out the table from the question: TP = 180; FN = 200 - 180 = 20; FP = 490; TN = 9800 - 490 = 9310; total = 10,000; with disease = 200; without = 9800. Here: 180/200 = 90% — good sensitivity. Here: 9310/9800 = 95% — good specificity. POSITIVE PREDICTIVE VALUE (PPV) = TP / (TP + FP) — the proportion of those who test POSITIVE who have the disease; here: 180/(180+490) = 180/670 = 27%.\n\n(A) 80% incorrect — would be calculated as TN / total non-cancer; but that IS 9310/9800 = 95% (some answer options wrong arithmetic).\n\n(C) 27% is the PPV not specificity.\n\n(D) 73% is the false-positive proportion of positive tests = 1-PPV (not specificity).\n\n(E) 100% would mean no false positives — not the case (490 here).\n\n💎 PEARL: Build the 2×2 from the question: TP 180, FN 20, FP 490, TN 9310. Sensitivity = TP/(TP+FN) = 90%. Specificity = TN/(TN+FP) = 95%. PPV = TP/(TP+FP) = 27% — depends on PREVALENCE (low prevalence drags PPV down even with a great test).",
   references:[{label:"BMJ Best Practice — Diagnostic Test Statistics", url:"https://bestpractice.bmj.com/info/toolkit/learn-ebm/diagnostic-test-statistics/"}]},

  {section:"other", specialty:"Statistics", topic:"Confidence intervals — interpretation",
   stem:"A randomised controlled trial reports the 95% confidence interval for the relative risk of stroke with a new antihypertensive vs placebo as RR 0.62 (95% CI 0.45 to 0.85). Sample size 5,000; primary outcome was time to first stroke; intention-to-treat analysis; mean follow-up 3 years. Author claims this means the new drug significantly reduces stroke risk.\n\nWhich is the most accurate interpretation of these results?",
   options:["The result is not statistically significant","Statistically significant — the 95% CI for relative risk does not cross 1.0; we are 95% confident the true population RR lies between 0.45 and 0.85","The result has a P value >0.05","The result indicates the new drug increases stroke risk","Sample size is inadequate for inference"],
   correct:"B",
   explanation:"CONFIDENCE INTERVALS (CI) — A FUNDAMENTAL CONCEPT IN STATISTICS: a confidence interval is a RANGE OF VALUES that is likely to contain the TRUE POPULATION PARAMETER, with a specified level of confidence (most commonly 95%). PRECISE INTERPRETATION: 'If we repeated this study many times, drawing different samples from the same population, 95% of the calculated 95% CIs would contain the TRUE population parameter' — this is the FREQUENTIST interpretation.\n\n(A) Result IS statistically significant — CI does not cross 1.0.\n\n(C) P value can be calculated approximately from CI.\n\n(D) RR 0.62 = LOWER risk in intervention group (i.e. PROTECTIVE / risk reducing), not increased.\n\n(E) Sample size is sufficient — narrow CI reflects adequate precision.\n\n💎 PEARL: 95% CI for an effect estimate that does NOT cross the null (1.0 for ratios, 0 for differences) = statistically significant. The interpretation: 'if we repeated the study many times, 95% of computed CIs would contain the true value.' P value can be inferred from the CI.",
   references:[{label:"NICE NG42 — Motor neurone disease / ALS (2016)", url:"https://www.nice.org.uk/guidance/ng42"}]},

  {section:"other", specialty:"Statistics", topic:"Study design — case-control vs cohort",
   stem:"Researchers want to investigate whether occupational solvent exposure (a rare exposure — only ~0.5% of the population) is associated with primary hepatic angiosarcoma (an extremely rare cancer — incidence <1 per million per year, with median latency from exposure of 20-30 years). They have limited research funding and need results within 2 years.\n\nWhich is the most appropriate study design?",
   options:["Cross-sectional study","Case-control study","Prospective cohort study","Randomised controlled trial","Ecological study"],
   correct:"B",

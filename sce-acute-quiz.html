   references:[{label:"NICE NG185 — Acute coronary syndromes (2020)", url:"https://www.nice.org.uk/guidance/ng185"},{label:"ESC 2023 ACS Guidelines (Eur Heart J)", url:"https://academic.oup.com/eurheartj/article/44/38/3720/7243210"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"ARVC — exertional sudden cardiac death",
   stem:"A 22-year-old footballer collapses during a match and is resuscitated from VF. ECG: tall R waves in V1, deep S in V5–V6, T-wave inversion V1–V3, and an epsilon wave at the end of the QRS. There is a family history of an unexplained sudden death in his uncle aged 30.\n\nWhich is the most likely diagnosis?",
   options:["Hypertrophic cardiomyopathy","Brugada syndrome","Arrhythmogenic right ventricular cardiomyopathy","Long QT syndrome type 1","Catecholaminergic polymorphic VT"],
   correct:"C",
   explanation:"Arrhythmogenic right ventricular cardiomyopathy: autosomal dominant desmosomal protein disorder with fibro-fatty replacement of the RV myocardium. Classic features here — epsilon waves (low-amplitude signal at the end of the QRS in right precordial leads), T-wave inversion V1–V3, and characteristic MRI findings. Presents with exertional VT or sudden death, often in young adults; family history of unexplained sudden death is common. Treatment: beta-blockade, exercise restriction, ICD per risk stratification, cascade family screening.\n\n(A) HCM produces LV hypertrophy on echo and shows deep narrow Q waves on ECG, not RV-pattern changes.\n\n(B) Brugada gives a coved-type ST elevation in V1–V3 (type 1 pattern), not epsilon waves; structurally normal heart on imaging.\n\n(D) LQT1 — prolonged QTc and exertional torsades, especially with swimming; ECG and MRI here are not consistent.\n\n(E) CPVT — exertional bidirectional or polymorphic VT in a structurally normal heart with a normal resting ECG; no fibro-fatty changes.\n\n💎 PEARL: Young athlete + exertional VT or sudden death + family history + epsilon waves + RV fibro-fatty change on MRI = ARVC. Beta-blockade, exercise restriction, ICD per risk.",
   references:[{label:"ESC 2022 Guidelines on ventricular arrhythmias and SCD", url:"https://academic.oup.com/eurheartj/article/43/40/3997/6675633"},{label:"Padua Criteria for ARVC (2020)", url:"https://pubmed.ncbi.nlm.nih.gov/32173241/"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Severe primary mitral regurgitation — surgical referral",
   stem:"A 74-year-old woman with rate-controlled AF on warfarin presents with new exertional dyspnoea. She has no significant comorbidity and is otherwise active.\n\nWhich is the most appropriate next step?",
   options:["Continue medical therapy and review in 6 months","Refer for surgical mitral valve repair","Refer for transcatheter edge-to-edge repair (MitraClip)","Add an ACE inhibitor","Cardiac MRI before further decision"],
   correct:"B",
   explanation:"Severe primary MR with a flail leaflet is a Class I indication for intervention even if asymptomatic; here she has symptoms. Surgical repair is preferred over replacement when leaflet anatomy is favourable, with excellent long-term outcomes and durable preservation of LV function (ESC/AHA valvular heart disease guidelines).\n\n(A) Watchful waiting risks irreversible LV dysfunction — flail leaflet has poor prognosis without intervention.\n\n(C) MitraClip (transcatheter edge-to-edge repair) is reserved for inoperable or high-surgical-risk patients with primary MR; in a fit candidate, surgical repair gives better and more durable results (COAPT and MITRA-FR addressed secondary MR specifically).\n\n(D) ACE inhibition is indicated in secondary MR or LV dysfunction — it does not address mechanical primary MR and should not delay surgical referral.\n\n(E) Echo has already established the diagnosis and severity — MRI does not change the indication for surgery here and would simply delay treatment.\n\n💎 PEARL: Symptomatic severe primary MR with flail leaflet is a Class I surgical indication. In fit candidates, surgical repair beats replacement and beats MitraClip — don't watchful-wait.",
   references:[{label:"ESC/EACTS 2021 Valvular Heart Disease Guidelines", url:"https://academic.oup.com/eurheartj/article/43/7/561/6358470"},{label:"NICE NG208 — Heart valve disease", url:"https://www.nice.org.uk/guidance/ng208"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Uncomplicated Type B aortic dissection",
   stem:"A 60-year-old man develops sudden severe tearing interscapular pain. BP 188/102 right arm, 142/86 left arm. CT aortogram: dissection flap originating distal to the left subclavian artery and extending to the iliacs. No end-organ malperfusion, no rupture, no refractory pain. He is haemodynamically stable.\n\nWhich is the most appropriate initial management?",
   options:["Emergency open aortic repair","Thoracic endovascular aortic repair (tevar) within 24 hours","IV labetalol infusion to target heart rate <60 and SBP 100–120 mmHg","IV nitroprusside as monotherapy","Oral metoprolol and discharge with outpatient follow-up"],
   correct:"C",
   explanation:"Uncomplicated Stanford type B (DeBakey III) aortic dissection — initial management is medical: aggressive HEART RATE control first, then BP control. IV beta-blockade (labetalol or esmolol) reduces dP/dt and shear stress on the dissection flap; titrate to HR <60 and SBP 100–120 mmHg. Add a vasodilator only after adequate beta-blockade. Pain control is essential.\n\n(A) Open surgery for type B is reserved for complications (rupture, malperfusion, refractory pain or hypertension despite optimal medical therapy) — high mortality if used reflexively in uncomplicated disease.\n\n(B) TEVAR is increasingly used for complicated type B dissection and was investigated for prevention of late complications in INSTEAD-XL, but it is NOT first-line in acute uncomplicated disease.\n\n(D) Vasodilator without prior beta-blockade causes reflex tachycardia and increases shear stress — extending the dissection.\n\n(E) Acute aortic dissection requires immediate inpatient management; outpatient management is unsafe.\n\n💎 PEARL: Uncomplicated Type B dissection: medical first. Beta-blockade BEFORE vasodilator — drop dP/dt then drop BP. Surgery and TEVAR only for malperfusion, rupture or refractory pain.",
   references:[{label:"ESC 2024 Aortic & Peripheral Arterial Diseases Guidelines", url:"https://academic.oup.com/eurheartj/article/45/36/3538/7747895"},{label:"NICE CKS — Aortic dissection", url:"https://cks.nice.org.uk/topics/abdominal-aortic-aneurysm/"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Renovascular hypertension — fibromuscular dysplasia",
   stem:"A 42-year-old woman with hypertension since age 30 has BP 168/104 mmHg despite three antihypertensives. Examination: bilateral abdominal bruits. Plasma renin activity is markedly elevated; aldosterone is also elevated. Renal ultrasound: a smaller right kidney with reduced corticomedullary differentiation. CT angiography: a 'string-of-beads' appearance in the right renal artery.\n\nWhich is the most likely cause?",
   options:["Primary hyperaldosteronism","Renal artery stenosis from fibromuscular dysplasia","Phaeochromocytoma","Coarctation of the aorta","Cushing syndrome"],
   correct:"B",
   explanation:"Refractory hypertension in a young woman with abdominal bruit, asymmetric kidneys and a 'string-of-beads' appearance on angiography points to fibromuscular dysplasia (FMD) — the leading cause of renovascular hypertension in patients under 50, particularly women. RAAS activation drives the secondary hyperaldosteronism (raised renin AND raised aldosterone — the renin:aldosterone ratio is preserved or low). Treatment: ACE inhibitor / ARB; percutaneous transluminal renal angioplasty in selected refractory cases; surveillance for vascular involvement elsewhere (cervical, intracranial).\n\n(A) Primary hyperaldosteronism shows SUPPRESSED renin and an elevated aldosterone:renin ratio — the opposite picture.\n\n(C) Phaeochromocytoma causes paroxysmal symptoms (headache, palpitations, sweating) with elevated metanephrines — no biochemical clues here.\n\n(D) Aortic coarctation gives radio-femoral delay and a discrepancy between upper- and lower-limb BPs, not a renal bruit, and would have been noted in a 30-year-old hypertensive workup.\n\n(E) Cushing syndrome has characteristic clinical features (central obesity, striae, proximal myopathy, glucose intolerance) and a different biochemical signature.\n\n💎 PEARL: Young woman + refractory hypertension + abdominal bruit + asymmetric kidneys + 'string-of-beads' on angio = FMD. Renin AND aldosterone both raised — distinguishes from Conn's.",
   references:[{label:"Heritage et al. — FMD Diagnosis and Management (Hypertension 2019)", url:"https://www.ahajournals.org/doi/10.1161/HYP.0000000000000070"},{label:"NICE CKS — Hypertension in adults", url:"https://cks.nice.org.uk/topics/hypertension/"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"HFrEF — CRT-D indication",
   stem:"A 70-year-old man with non-ischaemic dilated cardiomyopathy is on optimal medical therapy: bisoprolol, sacubitril/valsartan, spironolactone and dapagliflozin, all titrated to maximum tolerated doses for ≥3 months. He remains NYHA class III with LVEF 32%. He is in sinus rhythm. ECG: left bundle branch block with QRS 158 ms. EGFR 62, K⁺ 4.4.\n\nWhich is the most appropriate next step?",
   options:["Add ivabradine","Add digoxin","Cardiac resynchronisation therapy with defibrillator (CRT-D)","Implantable cardioverter defibrillator alone","No further intervention — continue current therapy"],
   correct:"C",
   explanation:"Persistent symptomatic HFrEF (LVEF ≤35%) on optimal medical therapy WITH sinus rhythm and LBBB with QRS ≥150 ms is a Class I indication for CRT-D — improves both symptoms and mortality (CARE-HF, MADIT-CRT). Benefit is greatest with wider QRS, typical LBBB, female sex and non-ischaemic aetiology.\n\n(A) Ivabradine is for sinus rhythm with HR ≥75 on maximum tolerated beta-blocker — useful for symptoms but does not match CRT-D's mortality benefit and is not first-line here.\n\n(B) Digoxin reduces hospitalisations but has no mortality benefit (DIG trial); reserved for symptom control after device therapy is considered.\n\n(D) ICD alone provides primary prevention of sudden death but does NOT improve symptoms or reverse remodelling — the LBBB pattern means CRT-D (which delivers both resynchronisation AND defibrillation) is preferred over an ICD-only device.\n\n(E) Continuing current therapy alone leaves modifiable mortality benefit on the table.\n\n💎 PEARL: Symptomatic HFrEF on optimal medical therapy + sinus rhythm + LBBB + QRS ≥150 ms = Class I CRT-D (CARE-HF, MADIT-CRT). ICD alone misses the resynchronisation benefit.",
   references:[{label:"NICE TA314 — CRT and ICDs for arrhythmias / heart failure", url:"https://www.nice.org.uk/guidance/ta314"},{label:"ESC 2021 Heart Failure Guidelines (McDonagh et al)", url:"https://academic.oup.com/eurheartj/article/42/36/3599/6358045"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"HCM — inheritance and family screening",
   stem:"A 28-year-old man is referred after his father died suddenly aged 45. Echo: asymmetric septal hypertrophy of 18 mm with systolic anterior motion of the mitral valve and a resting LVOT gradient of 30 mmHg. He has a 6-year-old son and a 24-year-old sister. What is the most appropriate advice regarding family screening?",
   options:["No screening — disease is sporadic in young adults","Cascade clinical and genetic screening of first-degree relatives — autosomal dominant","Cascade screening of male relatives only — X-linked recessive","Screening only required if relatives become symptomatic","Mitochondrial inheritance — only maternal relatives need screening"],
   correct:"B",
   explanation:"Hypertrophic cardiomyopathy is most commonly autosomal dominant; sarcomeric gene mutations MYH7 and MYBPC3 account for the majority. Each first-degree relative has a 50% risk of inheriting the mutation, regardless of sex. Cascade screening of all first-degree relatives — clinical assessment with ECG and echo, plus targeted genetic testing for the family-specific variant — is indicated, with children typically screened from age 10–12 and at intervals through adolescence and early adulthood (AHA/ESC HCM guidelines).\n\n(A) HCM is heritable in most cases — sporadic disease occurs but cannot be assumed.\n\n(C) HCM is autosomal dominant, NOT X-linked — both sexes are affected and both can transmit.\n\n(D) Pre-symptomatic identification permits risk stratification (HCM Risk-SCD), exercise advice, and ICD consideration in high-risk cases — waiting for symptoms misses the chance of primary prevention.\n\n(E) Sarcomeric HCM is nuclear-encoded, autosomal dominant — mitochondrial inheritance does not apply.\n\n💎 PEARL: HCM is autosomal dominant — 50% transmission to each first-degree relative regardless of sex. Cascade ECG, echo and family-specific genetic testing; screen children from age 10–12.",
   references:[{label:"ESC 2023 HCM Guidelines (Eur Heart J)", url:"https://academic.oup.com/eurheartj/article/45/30/2698/7766816"},{label:"AHA/ACC 2024 HCM Guideline", url:"https://www.jacc.org/doi/10.1016/j.jacc.2024.02.014"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"NSTEMI — invasive timing",
   stem:"A 65-year-old man with hypertension, type 2 diabetes and current smoking presents 2 hours after central chest pain at rest lasting 30 minutes. ECG: T-wave inversion in V4–V6, no ST elevation. High-sensitivity troponin elevated and rising. BP 138/86, HR 78, no signs of heart failure or haemodynamic compromise. GRACE score 145.\n\nWhich is the most appropriate management?",
   options:["Discharge with outpatient cardiology follow-up","Conservative medical therapy alone","Aspirin, ticagrelor, fondaparinux and invasive coronary angiography within 72 hours","Immediate primary PCI as for STEMI","IV thrombolysis"],
   correct:"C",
   explanation:"NSTEMI risk-stratified to intermediate-to-high risk (GRACE >140, dynamic ECG changes, raised troponin) warrants invasive coronary angiography within 72 hours per NICE NG185 / ESC. Initiate dual antiplatelet therapy (aspirin + ticagrelor or prasugrel) and parenteral anticoagulation (fondaparinux unless angiography is imminent). Statin, beta-blocker, ACE inhibitor and cardiac rehabilitation form secondary prevention. Very-high-risk features (haemodynamic instability, ongoing chest pain, life-threatening arrhythmia, mechanical complications) warrant angiography within 2 hours.\n\n(A) Discharge would miss a high-risk acute coronary syndrome.\n\n(B) Conservative management alone forfeits the prognostic benefit of revascularisation in higher-risk NSTEMI.\n\n(D) Primary PCI is the strategy for STEMI — without ST elevation, the standard pathway is risk-stratified invasive strategy.\n\n(E) Thrombolysis has no role in NSTEMI — it is harmful in the absence of total coronary occlusion.\n\n💎 PEARL: Intermediate-to-high-risk NSTEMI (GRACE >140, dynamic ECG, raised troponin) = angiogram within 72 hours. Very-high-risk features (instability, ongoing pain, lethal arrhythmia) = within 2 hours.",
   references:[{label:"NICE NG185 — Acute coronary syndromes (2020)", url:"https://www.nice.org.uk/guidance/ng185"},{label:"ESC 2023 ACS Guidelines (Eur Heart J)", url:"https://academic.oup.com/eurheartj/article/44/38/3720/7243210"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Factor Xa inhibitor reversal — life-threatening bleeding",
   stem:"A 75-year-old man on rivaroxaban for atrial fibrillation presents with reduced GCS after a fall. CT head: large acute right-sided intracerebral haemorrhage with midline shift. Last rivaroxaban dose 4 hours ago. Weight 80 kg, eGFR 60.\n\nWhich is the most appropriate reversal strategy?",
   options:["Fresh frozen plasma 4 units","IV vitamin K 10 mg","Andexanet alfa (or 4-factor PCC 50 IU/kg if andexanet unavailable)","Tranexamic acid alone","Cryoprecipitate"],
   correct:"C",
   explanation:"Specific reversal of factor Xa inhibitors (apixaban, rivaroxaban, edoxaban) for life-threatening bleeding is with andexanet alfa (a recombinant decoy factor Xa). Where andexanet is unavailable or unaffordable, 4-factor prothrombin complex concentrate (Beriplex/Octaplex) at 50 IU/kg is used (ANNEXA-4 supports andexanet; ANNEXA-I addressed ICH specifically). Discontinue the DOAC, supportive care, neurosurgical consultation and source control. For dabigatran the specific reversal agent is idarucizumab (RE-VERSE AD).\n\n(A) FFP contains coagulation factors but is ineffective for DOAC reversal — slow infusion, large volumes, no factor Xa inhibition.\n\n(B) Vitamin K reverses warfarin (vitamin-K-dependent factors II, VII, IX, X) — not factor Xa inhibitors.\n\n(D) Tranexamic acid is an antifibrinolytic with limited evidence in ICH (CRASH-3; modest benefit if very early); does not reverse anticoagulant effect.\n\n(E) Cryoprecipitate provides fibrinogen — useful for hypofibrinogenaemia but not for DOAC reversal.\n\n💎 PEARL: Life-threatening bleed on apixaban / rivaroxaban / edoxaban: andexanet alfa first-line; 4-factor PCC 50 IU/kg if unavailable. FFP doesn't reverse DOACs. Dabigatran = idarucizumab.",
   references:[{label:"UK Guidelines for SJS/TEN (Br J Dermatol 2016)", url:"https://onlinelibrary.wiley.com/doi/10.1111/bjd.14530"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"High-risk pulmonary embolism — definitive therapy",
   stem:"A 58-year-old man presents with acute severe breathlessness and a syncopal episode. BP 82/50 mmHg (sustained), HR 125, SpO₂ 88% on air. Bedside echocardiogram: RV dilatation, septal flattening, McConnell sign. CTPA: large bilateral central pulmonary emboli. Lactate 3.6.\n\nWhich is the most appropriate definitive treatment?",
   options:["Therapeutic LMWH alone","Apixaban orally","Systemic thrombolysis with IV alteplase","Inferior vena cava filter alone","Aspirin"],
   correct:"C",
   explanation:"High-risk (massive) PE — sustained hypotension or shock with imaging-confirmed pulmonary embolism — is an indication for systemic thrombolysis (IV alteplase 100 mg over 2 hours, or 0.6 mg/kg as bolus during cardiac arrest). Contraindications (recent surgery, active bleeding, recent stroke) shift management to catheter-directed thrombolysis or surgical embolectomy in expert centres. Concurrent unfractionated heparin throughout.\n\n(A) LMWH alone is the strategy for low- and intermediate-risk PE — inadequate for shock from massive central thrombus.\n\n(B) DOACs are appropriate first-line oral anticoagulation for stable PE — they do not lyse the existing clot in this haemodynamically unstable scenario.\n\n(D) IVC filters prevent further embolism but do nothing for the existing central thrombus causing shock; their role is mostly as adjunct in patients with absolute contraindications to anticoagulation.\n\n(E) Aspirin has no acute role in PE management.\n\n💎 PEARL: Sustained hypotension or shock + confirmed PE = high-risk (massive) PE. Systemic alteplase is definitive; LMWH and DOACs alone are inadequate. Catheter or surgical embolectomy if thrombolysis contraindicated.",
   references:[{label:"NICE NG158 — VTE diseases: diagnosis, management, thrombophilia testing (2020)", url:"https://www.nice.org.uk/guidance/ng158"},{label:"ESC 2019 PE Guidelines", url:"https://academic.oup.com/eurheartj/article/41/4/543/5556136"},{label:"BTS PE Guidelines", url:"https://www.brit-thoracic.org.uk/quality-improvement/clinical-statements/pulmonary-embolism/"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Cardiogenic shock post-STEMI",
   stem:"A 70-year-old man underwent primary PCI of the LAD 6 hours ago for anterior STEMI. He becomes hypotensive (BP 78/44 mmHg), oliguric, with bibasal crackles, mottled peripheries, lactate 5.6 mmol/L and SvO₂ 50%. ECG: persistent ST elevation. Bedside echo: LVEF 18%, severe anterior wall akinesis. There is no pericardial effusion, no new murmur, no RV dilatation.\n\nWhich is the most likely diagnosis and most appropriate immediate management?",
   options:["Hypovolaemic shock — give 2 L crystalloid","Septic shock — broad-spectrum antibiotics","Cardiogenic shock — noradrenaline, inotrope (dobutamine), and urgent consideration of mechanical circulatory support","Pulmonary embolism — systemic thrombolysis","Cardiac tamponade — urgent pericardiocentesis"],
   correct:"C",
   explanation:"Cardiogenic shock complicates 5–10% of STEMIs and carries ~40% in-hospital mortality. Phenotype: hypotension + hypoperfusion (oliguria, mottling, raised lactate, low SvO₂) + pulmonary congestion in the setting of severely impaired LV function. Management: vasopressor (noradrenaline preferred over dopamine — SOAP-II showed lower arrhythmia and mortality), inotrope (dobutamine or milrinone for additional contractility) once MAP is supported, careful fluid optimisation guided by haemodynamics, early consideration of mechanical circulatory support (intra-aortic balloon pump, Impella, VA-ECMO — pathway depends on local availability), and treatment of cause (confirm vessel patency, exclude mechanical complications by serial echo).\n\n(A) Hypovolaemic shock would not show pulmonary congestion or severe LV dysfunction — fluid challenge here will worsen pulmonary oedema.\n\n(B) Septic shock is unlikely 6 hours post-PCI without other sepsis features; post-MI inflammatory response can confound markers.\n\n(D) Pulmonary embolism is uncommon in this window; bedside echo would show RV dilatation and McConnell's sign rather than LV akinesis — and they are absent.\n\n(E) Tamponade requires pericardial effusion — explicitly not present on bedside echo.\n\n💎 PEARL: Post-MI cardiogenic shock: noradrenaline first (SOAP-II — lower arrhythmia and mortality vs dopamine), add dobutamine for contractility once MAP supported, then mechanical support. Mortality ~40%.",
   references:[{label:"ESC 2021 Heart Failure Guidelines (McDonagh et al)", url:"https://academic.oup.com/eurheartj/article/42/36/3599/6358045"},{label:"ESC-HFA Cardiogenic Shock Position Statement (2020)", url:"https://onlinelibrary.wiley.com/doi/10.1002/ejhf.1922"},{label:"SCAI Shock Classification (2022 update)", url:"https://www.jacc.org/doi/10.1016/j.jacc.2022.01.018"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Malignant cardiac tamponade — initial management",
   stem:"A 62-year-old woman with metastatic breast cancer presents with progressive breathlessness and pre-syncope over 24 hours. BP 86/56 with pulsus paradoxus 18 mmHg, raised JVP, and quiet heart sounds. ECG: low-voltage QRS with electrical alternans. CXR: enlarged cardiac silhouette. Bedside echo (Focus): large circumferential pericardial effusion with right atrial systolic collapse and right ventricular early-diastolic collapse.\n\nWhich is the most appropriate immediate management?",
   options:["CT pulmonary angiogram before any treatment","Echo-guided pericardiocentesis; cautious volume support beforehand; avoid positive-pressure ventilation if possible","IV furosemide","IV beta-blocker","Coronary angiography"],
   correct:"B",
   explanation:"Cardiac tamponade — Beck's triad (hypotension, raised JVP, muffled heart sounds), pulsus paradoxus (>10 mmHg fall in SBP on inspiration), low-voltage QRS, electrical alternans. Echocardiographic features: pericardial effusion, RA systolic collapse, RV early-diastolic collapse, dilated IVC with reduced respiratory variation, exaggerated respirophasic mitral and tricuspid inflow. Treatment: echo-guided pericardiocentesis is life-saving; cautious volume support beforehand to maintain RV filling. AVOID positive-pressure ventilation if possible — raised intrathoracic pressure further reduces venous return. Recurrent malignant effusion may need a prolonged drain, pericardial window, or intrapericardial therapy.\n\n(A) CT delays definitive treatment in a haemodynamically unstable patient; the diagnosis is already established.\n\n(C) Furosemide reduces preload and worsens the obstructive shock physiology of tamponade.\n\n(D) Beta-blockade reduces compensatory tachycardia, which is essential to maintaining cardiac output in tamponade.\n\n(E) Coronary angiography is irrelevant — this is a pericardial, not ischaemic, problem.\n\n💎 PEARL: Tamponade: Beck's triad + pulsus paradoxus + RA/RV diastolic collapse on echo. Echo-guided pericardiocentesis is life-saving. AVOID positive-pressure ventilation — it tanks venous return.",
   references:[{label:"ESC 2015 Pericardial Diseases Guidelines", url:"https://academic.oup.com/eurheartj/article/36/42/2921/2293375"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Takotsubo cardiomyopathy",
   stem:"A 65-year-old post-menopausal woman presents with central chest pain 24 hours after the unexpected death of her husband. ECG: anterolateral ST elevation; troponin mildly elevated (peaks lower than expected for STEMI). Left ventriculography: apical ballooning with hyperkinetic basal segments. LVEF 35%.\n\nWhich is the most likely diagnosis?",
   options:["Anterior STEMI","Takotsubo (apical ballooning) cardiomyopathy","Myocarditis","Spontaneous coronary artery dissection","Acute pericarditis"],
   correct:"B",
   explanation:"Takotsubo ('broken heart' / apical ballooning) syndrome: typically post-menopausal women after physical or emotional stress; regional wall motion abnormalities extending BEYOND a single coronary territory (apical ballooning is classical, though variant forms exist), normal coronaries, and modest troponin elevation. Most patients recover ventricular function within weeks. Beware acute heart failure, arrhythmia, and dynamic LVOT obstruction — AVOID inotropes if obstruction present.\n\n(A) Anterior STEMI would show an occluded LAD on angiography — by definition not Takotsubo.\n\n(C) Myocarditis: cardiac MRI shows mid-myocardial / sub-epicardial late gadolinium enhancement (non-coronary distribution) and oedema; viral prodrome is often present.\n\n(D) SCAD (more common in young to middle-aged women) shows angiographic dissection of a coronary artery — angiography here was clean.\n\n(E) Acute pericarditis gives saddle ST elevation across multiple territories with PR depression and a friction rub; LV systolic function is preserved.\n\n💎 PEARL: Post-menopausal woman + emotional or physical stressor + chest pain + apical ballooning + clean coronaries = Takotsubo. Recovery within weeks. Avoid inotropes if dynamic LVOT obstruction present.",
   references:[{label:"InterTAK Diagnostic Criteria (Eur Heart J 2018)", url:"https://academic.oup.com/eurheartj/article/39/22/2032/4924712"},{label:"ESC 2024 Heart Failure Statement on Takotsubo", url:"https://academic.oup.com/eurheartj/"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"New-onset AF — onset <48 hours",
   stem:"A 68-year-old man with no prior cardiac history presents with palpitations of 18 hours' duration. He has no chest pain, dyspnoea or syncope. Pulse 138 irregular, BP 134/82, lungs clear, no peripheral oedema. Cha₂DS₂-vasc 1. The 12-lead ECG is shown:",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/ECG_Atrial_Fibrillation_98_bpm.jpg",
   imageAlt:"12-lead ECG showing irregularly irregular QRS rhythm with absent P waves consistent with atrial fibrillation",
   options:["IV digoxin and admit for observation","IV amiodarone 300 mg load","Synchronised DC cardioversion under sedation","Rate control with bisoprolol; offer cardioversion (electrical or flecainide); start anticoagulation guided by cha₂DS₂-vasc","IV adenosine 6 mg"],
   correct:"D",
   explanation:"Symptomatic AF of <48 hours' duration in a haemodynamically stable patient: rate or rhythm control is acceptable (AFFIRM, RACE — equivalent outcomes). NICE NG196: first-line rate control with a beta-blocker (or a non-DHP CCB if asthmatic). Cardioversion can be offered within the 48-hour window without prior 3-week anticoagulation; flecainide is suitable if there is no structural heart disease (otherwise amiodarone). Anticoagulation is guided by CHA₂DS₂-VASc.\n\n(A) Digoxin alone is reserved for sedentary patients or as add-on; it controls resting rate poorly and does not reliably control exertional rate.\n\n(B) IV amiodarone is for haemodynamic instability or as a pharmacological cardioversion agent — not first-line in stable AF.\n\n(C) DC cardioversion is for haemodynamic instability — unnecessarily aggressive in a stable patient and risks sedation hazard.\n\n(E) Adenosine terminates AV-nodal tachycardias; it does not terminate AF, although the brief AV block during its action confirms rhythm diagnosis.\n\n💎 PEARL: Stable AF <48 hours: rate or rhythm control both acceptable (AFFIRM, RACE). Beta-blocker first (NICE NG196). Cardioversion possible without 3-week anticoagulation if onset <48 h. Anticoagulate per CHA₂DS₂-VASc.",
   references:[{label:"NICE NG196 — Atrial fibrillation (2021)", url:"https://www.nice.org.uk/guidance/ng196"},{label:"ESC 2024 AF Guidelines", url:"https://academic.oup.com/eurheartj/article/45/36/3314/7738779"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"VF cardiac arrest — ALS algorithm",
   stem:"An adult inpatient has a witnessed cardiac arrest on the ward. CPR is in progress with a manual biphasic defibrillator at the bedside. The first rhythm check (after the initial 2 minutes of CPR) shows ventricular fibrillation. IV access is in place. Reversible causes are being considered.\n\nWhich is the most appropriate immediate action?",
   options:["Continue CPR for 2 more minutes before any shock","Single defibrillation shock (manual biphasic 150–200 J) then immediately resume CPR for 2 minutes before next rhythm check","IV adrenaline 1 mg before any defibrillation","IV amiodarone 300 mg before any defibrillation","Synchronised cardioversion"],
   correct:"B",
   explanation:"Resus Council UK ALS algorithm for shockable rhythms (VF / pulseless VT): single defibrillation shock (manual biphasic 150–200 J or per device, escalating with subsequent shocks), then immediately resume CPR for 2 minutes before the next rhythm check. Adrenaline 1 mg IV is given AFTER the third shock and every 3–5 minutes thereafter; amiodarone 300 mg IV is given AFTER the third shock (further 150 mg after fifth shock). Identify and treat reversible causes.\n\n(A) Delaying defibrillation in confirmed VF reduces survival — every minute of unshocked VF reduces survival by ~10%.\n\n(C) Adrenaline is reserved for after the third shock in shockable rhythms (it is given immediately for non-shockable rhythms — PEA / asystole).\n\n(D) Amiodarone after the third shock — defibrillation comes first.\n\n(E) Synchronised cardioversion is for tachyarrhythmias with a pulse; pulseless VF requires asynchronous defibrillation.\n\n💎 PEARL: Shockable rhythm: shock immediately, 2 min CPR, repeat. Adrenaline AFTER the third shock and every 3–5 min; amiodarone 300 mg AFTER the third shock. Don't delay defibrillation.",
   references:[{label:"Resuscitation Council UK — Adult ALS Guidelines (2021)", url:"https://www.resus.org.uk/library/2021-resuscitation-guidelines/adult-advanced-life-support-guidelines"},{label:"ERC/ESICM Post-Resuscitation Care Guidelines (2021)", url:"https://www.resus.org.uk/library/2021-resuscitation-guidelines/post-resuscitation-care-guidelines"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Severe symptomatic aortic stenosis — definitive treatment",
   stem:"A 76-year-old man presents with exertional syncope and breathlessness on minimal exertion (NYHA III). Examination: ejection systolic murmur radiating to the carotids, slow-rising pulse, soft S2. Echo: aortic valve area 0.7 cm², mean gradient 52 mmHg, peak velocity 4.6 m/s, LVEF 55%. STS score 4% (intermediate operative risk).\n\nWhich is the most appropriate management?",
   options:["Medical management with diuretics","Aortic valve replacement — surgical (SAVR) or transcatheter (TAVI), choice guided by surgical risk and anatomy","Balloon valvuloplasty as definitive treatment","Statin therapy alone","Beta-blocker only"],
   correct:"B",
   explanation:"Severe symptomatic aortic stenosis (AVA <1 cm², mean gradient ≥40 mmHg, Vmax ≥4 m/s) requires aortic valve replacement — survival without it is poor (mean ~2 years from symptom onset). Choice between SAVR and TAVI depends on operative risk (STS / EuroSCORE), age, anatomy and patient preference. TAVI is now first-line for older patients and for intermediate-to-high surgical risk (PARTNER, CoreValve, EVOLUT trials); SAVR is preferred in younger, lower-risk patients with bicuspid anatomy or significant concomitant disease (multivessel CAD requiring CABG, mitral or tricuspid disease).\n\n(A) Diuretics alone provide no survival benefit and risk hypoperfusion in fixed obstruction.\n\n(C) Balloon valvuloplasty provides only short-term symptomatic relief — used as a bridge to definitive treatment, not as definitive treatment.\n\n(D) Statin therapy is appropriate for cardiovascular risk reduction but does not modify the natural history of severe AS.\n\n(E) Beta-blockade has no role in severe symptomatic AS — fixed obstruction means cardiac output cannot rise with rate.\n\n💎 PEARL: Severe symptomatic AS: AVR (SAVR or TAVI by surgical risk and anatomy) — survival without intervention is ~2 years from symptom onset. Diuretics don't help fixed obstruction.",
   references:[{label:"ESC/EACTS 2021 Valvular Heart Disease Guidelines", url:"https://academic.oup.com/eurheartj/article/43/7/561/6358470"},{label:"NICE NG208 — Heart valve disease", url:"https://www.nice.org.uk/guidance/ng208"},{label:"PARTNER trials (TAVI vs SAVR)", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa1814052"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Acute pericarditis — diagnosis",
   stem:"A 32-year-old man presents with sharp, central, pleuritic chest pain that improves on sitting forward, 1 week after an upper respiratory tract illness. ECG: widespread saddle-shaped ST elevation with PR depression, and reciprocal changes in aVR (PR elevation, ST depression). Troponin marginally elevated. Echo: small pericardial effusion, normal LV systolic function. CRP raised.\n\nWhich is the most likely diagnosis?",
   options:["Acute STEMI","Acute pericarditis (likely viral)","Pulmonary embolism","Aortic dissection","Stable angina"],
   correct:"B",
   explanation:"Acute pericarditis classic features: pleuritic central chest pain relieved by sitting forward, pericardial friction rub, widespread saddle-shaped ST elevation with PR depression, and reciprocal aVR changes (PR elevation, ST depression — highly specific). Most cases are viral or idiopathic. Treatment: NSAID (ibuprofen or aspirin) PLUS colchicine 0.5 mg BD for ≥3 months — colchicine reduces recurrence (COPE, ICAP, CORP). Admit if high-risk features: fever >38°C, subacute course, large effusion or tamponade, anticoagulation, immunosuppression, trauma, no NSAID response after 1 week, or raised troponin (myopericarditis).\n\n(A) STEMI gives localised ST elevation with reciprocal depression in opposite leads — not the widespread saddle pattern with PR depression seen here; troponin rise is much higher.\n\n(C) PE gives sinus tachycardia, S1Q3T3 (rare), and right heart strain on imaging — not saddle ST elevation.\n\n(D) Aortic dissection has tearing chest/back pain and BP discrepancy — different clinical picture.\n\n(E) Stable angina is exertional and reversible at rest, not pleuritic with positional component.\n\n💎 PEARL: Pleuritic pain relieved sitting forward + widespread saddle ST + PR depression + reciprocal aVR (PR elevation, ST depression — highly specific) = acute pericarditis. NSAID + colchicine ≥3 months reduces recurrence.",
   references:[{label:"ESC 2015 Pericardial Diseases Guidelines", url:"https://academic.oup.com/eurheartj/article/36/42/2921/2293375"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Atrial flutter with 2:1 conduction",
   stem:"A 68-year-old man presents with palpitations of 6 hours' duration. ECG: regular narrow-complex tachycardia at 150 bpm. After IV adenosine 12 mg, transient AV block reveals sawtooth flutter waves at 300/min in the inferior leads (II, III, aVF). BP 128/78, no chest pain or breathlessness. Cha₂DS₂-vasc 3.\n\nWhich is the most likely diagnosis?",
   options:["Atrial fibrillation","Typical (cavotricuspid-isthmus-dependent) atrial flutter with 2:1 AV conduction","AV nodal re-entrant tachycardia","Sinus tachycardia","Ventricular tachycardia"],
   correct:"B",
   explanation:"Typical atrial flutter has a macro-reentrant circuit around the cavotricuspid isthmus producing characteristic 'sawtooth' flutter waves at ~300/min in the inferior leads, often with 2:1 AV conduction giving a regular ventricular rate of ~150. Diagnostic clue: a regular narrow-complex tachycardia at exactly 150 bpm should always raise suspicion of flutter with 2:1 conduction; vagal manoeuvres or adenosine briefly slow AV conduction and reveal the flutter waves. Management: synchronised electrical cardioversion is highly effective (often <50 J); catheter ablation of the cavotricuspid isthmus is the preferred long-term strategy (~95% success). Anticoagulation per CHA₂DS₂-VASc as for AF.\n\n(A) AF is irregularly irregular with no organised atrial activity — flutter is regular with sawtooth waves.\n\n(C) AVNRT typically presents at 150–220 bpm with no clear P waves and a pseudo-R' in V1; vagal manoeuvres often terminate the rhythm rather than just slow conduction.\n\n(D) Sinus tachycardia shows clearly preceded P waves; rate rarely exceeds 150 in the absence of underlying physiological stress.\n\n(E) VT is wide-complex (QRS >120 ms) by definition — this is narrow-complex.\n\n💎 PEARL: Regular narrow-complex tachycardia at exactly 150 bpm = think flutter with 2:1 conduction until proven otherwise. Adenosine reveals sawtooth waves. Cavotricuspid-isthmus ablation is curative (~95%).",
   references:[{label:"NICE NG196 — Atrial fibrillation (covers flutter)", url:"https://www.nice.org.uk/guidance/ng196"},{label:"ESC 2024 AF Guidelines (covers atrial flutter)", url:"https://academic.oup.com/eurheartj/article/45/36/3314/7738779"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"AVNRT — acute management",
   stem:"A 28-year-old woman presents with sudden-onset palpitations. ECG: regular narrow-complex tachycardia at 180 bpm with no clearly visible P waves (a pseudo-R' at the end of the QRS in V1, pseudo-S in inferior leads). BP 118/72, no chest pain. She has had similar self-limiting episodes before. No history of asthma or pre-excitation.\n\nWhich is the most appropriate initial step?",
   options:["Vagal manoeuvres (modified Valsalva)","IV amiodarone 300 mg","IV beta-blocker","IV verapamil 5 mg","IV lidocaine"],
   correct:"A",
   explanation:"AVNRT is the most common SVT — re-entry circuit within the AV node. Acute management ladder: vagal manoeuvres FIRST. If unsuccessful: IV adenosine 6 mg rapid bolus, then 12 mg, then 18 mg if needed (cause brief AV block to terminate re-entry). Synchronised cardioversion if haemodynamically unstable. Long-term: catheter ablation of the slow pathway is curative in >95%.\n\n(B) IV amiodarone is reserved for refractory or wide-complex tachycardia — overkill for stable AVNRT.\n\n(C) IV beta-blocker may be used if adenosine fails; not first-line.\n\n(D) IV verapamil is an alternative when adenosine is contraindicated (severe asthma) but is contraindicated in pre-excited AF (WPW) — not first-line.\n\n(E) Lidocaine has no role in supraventricular tachycardia.\n\n💎 PEARL: Stable narrow-complex SVT: vagal manoeuvres FIRST. If unsuccessful, IV adenosine 6 → 12 → 18 mg. Cardioversion only if unstable. Verapamil contraindicated in pre-excited AF.",
   references:[{label:"ESC 2019 Supraventricular Tachycardia Guidelines", url:"https://academic.oup.com/eurheartj/article/41/5/655/5556821"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Mobitz type II AV block",
   stem:"A 70-year-old man presents with syncope and breathlessness. ECG: PR interval is constant (180 ms) before each conducted P wave, with intermittent failure to conduct (P waves not followed by a QRS) without preceding progressive PR prolongation. QRS is broad. HR 38, BP 96/58.\n\nWhich is the most likely diagnosis?",
   options:["First-degree AV block","Mobitz type I (Wenckebach) AV block","Mobitz type II AV block","Sinus bradycardia","Asystole"],
   correct:"C",
   explanation:"Mobitz type II AV block: constant PR interval with intermittent failure of conduction (no progressive PR prolongation). Typically infranodal disease (His-Purkinje), broad QRS escape rhythm, often haemodynamically unstable, and HIGH RISK of progressing to complete heart block — a Class I indication for permanent pacemaker. Admit to a monitored bed; correct reversible causes (drugs, ischaemia, electrolytes); transcutaneous or temporary transvenous pacing as a bridge.\n\n(A) First-degree AV block has a prolonged PR (>200 ms) with EVERY P wave conducted — no dropped beats; usually benign and rarely needs pacing.\n\n(B) Mobitz I (Wenckebach) shows progressive PR prolongation before a dropped beat, then resumes — typically AV-nodal, more benign, narrow QRS, often does not require pacing unless symptomatic.\n\n(D) Sinus bradycardia has 1:1 P-QRS conduction at slow rates — every P wave conducts.\n\n(E) Asystole has no electrical activity at all — incompatible with the description here.\n\n💎 PEARL: Mobitz II: constant PR with intermittent dropped beats, broad QRS escape. Infranodal disease — high risk of complete heart block. Class I pacemaker indication. Don't mistake for benign Wenckebach.",
   references:[{label:"ESC 2021 Cardiac Pacing & CRT Guidelines", url:"https://academic.oup.com/eurheartj/article/42/35/3427/6358547"},{label:"NICE TA88 — Dual-chamber pacemakers for symptomatic bradycardia", url:"https://www.nice.org.uk/guidance/ta88"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Resistant hypertension — fourth-line agent",
   stem:"A 55-year-old man has BP 156/92 mmHg confirmed on home monitoring despite full-dose ramipril, amlodipine and indapamide. K⁺ 3.8 mmol/L, eGFR >60. Adherence is confirmed (urine drug screen). Secondary causes (renovascular disease, primary aldosteronism, phaeochromocytoma, OSA, NSAID use) have been excluded.\n\nWhich is the most appropriate next step?",
   options:["Add doxazosin","Add spironolactone 25 mg daily","Increase amlodipine to 20 mg daily","Add a beta-blocker","Stop indapamide and switch to bendroflumethiazide"],
   correct:"B",
   explanation:"NICE NG136: resistant hypertension is BP uncontrolled on optimal doses of ACEi/ARB + CCB + thiazide-like diuretic. Step 4 is low-dose spironolactone 25 mg daily if K⁺ ≤4.5 (PATHWAY-2 confirmed superiority of spironolactone over doxazosin and bisoprolol in this setting); alpha- or beta-blocker if K⁺ >4.5. Monitor potassium and renal function carefully (especially with concurrent ACEi/ARB — risk of hyperkalaemia and AKI). Confirm adherence and exclude secondary causes BEFORE labelling resistant.\n\n(A) Doxazosin is a step-4 alternative when spironolactone is contraindicated by hyperkalaemia (K⁺ >4.5) — not first choice in this normokalaemic patient.\n\n(C) Amlodipine 20 mg is above the maximum licensed dose; further uptitration risks oedema without proportional BP benefit.\n\n(D) Beta-blocker is a step-4 alternative if K⁺ >4.5 or spironolactone not tolerated; less effective than spironolactone.\n\n(E) Indapamide and bendroflumethiazide are equivalent thiazide-like / thiazide diuretics in the relevant doses; switching is unlikely to improve control.\n\n💎 PEARL: Resistant hypertension on ACEi + CCB + thiazide: add spironolactone 25 mg if K⁺ ≤4.5 (PATHWAY-2). Alpha- or beta-blocker if K⁺ >4.5. Confirm adherence and exclude secondary causes first.",
   references:[{label:"NICE NG136 — Hypertension in adults (2019)", url:"https://www.nice.org.uk/guidance/ng136"},{label:"ESC/ESH 2023 Hypertension Guidelines", url:"https://academic.oup.com/eurheartj/article/44/38/3824/7246265"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Stable angina — first-line antianginal",
   stem:"A 64-year-old man with hypertension and hypercholesterolaemia presents with central chest tightness predictably brought on by walking up hills, relieved within 5 minutes by rest. CT coronary angiography: 70% stenosis of the proximal LAD; otherwise non-obstructive disease. LV function is normal. He is already on atorvastatin and aspirin.\n\nWhich is the most appropriate addition?",
   options:["Sublingual GTN PRN only","Bisoprolol (or rate-limiting CCB if contraindicated) plus sublingual GTN PRN","Routine PCI to the proximal LAD lesion","Coronary artery bypass graft as first step","Therapeutic anticoagulation"],
   correct:"B",
   explanation:"NICE NG185 stable angina: secondary prevention (aspirin, statin, ACEi where comorbidity warrants) plus first-line antianginal — beta-blocker (bisoprolol, atenolol) OR rate-limiting calcium-channel blocker (diltiazem, verapamil) if beta-blocker contraindicated. Sublingual GTN PRN for breakthrough pain (and pre-emptively for predictable triggers). Add a second antianginal if symptoms persist (long-acting nitrate, ivabradine, nicorandil, ranolazine).\n\n(A) GTN alone treats episodes but does not reduce frequency — first-line antianginal background therapy is needed.\n\n(C) ISCHEMIA showed no mortality benefit from routine revascularisation in chronic stable disease — revascularisation is for refractory symptoms despite optimal medical therapy or for prognostic indications (left main, three-vessel disease, especially with reduced LVEF or diabetes).\n\n(D) CABG as first step is reserved for prognostic indications (left main, multivessel disease, especially diabetes — FREEDOM, SYNTAX) — not for single-vessel proximal LAD with normal LV function.\n\n(E) Anticoagulation has no role in stable angina; aspirin antiplatelet therapy is sufficient.\n\n💎 PEARL: Stable angina first-line: beta-blocker (or rate-limiting CCB) PLUS GTN PRN. Add a second antianginal if symptoms persist. ISCHEMIA: routine PCI gives no mortality benefit in stable disease.",
   references:[{label:"NICE CG126 — Stable angina (2011, updated)", url:"https://www.nice.org.uk/guidance/cg126"},{label:"ESC 2024 Chronic Coronary Syndromes Guidelines", url:"https://academic.oup.com/eurheartj/article/45/36/3415/7747895"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Pre-excited atrial fibrillation in WPW",
   stem:"A 22-year-old man with no known cardiac history presents with palpitations and dizziness. ECG: irregularly irregular, very rapid (peak rate 280 bpm) wide-complex tachycardia with bizarre QRS complexes of varying morphology. BP 88/50 mmHg, GCS 14, looking unwell.\n\nWhich is the most appropriate immediate management?",
   options:["IV adenosine 6 mg","IV digoxin 500 µg","Synchronised DC cardioversion","IV verapamil 5 mg","IV bisoprolol"],
   correct:"C",
   explanation:"Pre-excited atrial fibrillation in WPW (very rapid, irregular, wide-complex tachycardia with varying QRS morphology) — atrial fibrillation conducted antegradely down the accessory pathway, which has a much shorter refractory period than the AV node. Risk of degeneration to ventricular fibrillation. With haemodynamic compromise (BP 88/50), synchronised DC cardioversion is the immediate treatment. If stable, IV procainamide or flecainide is the pharmacological option (these slow accessory-pathway conduction). Definitive treatment: catheter ablation of the accessory pathway.\n\n(A) Adenosine is CONTRAINDICATED — it blocks the AV node, leaving the accessory pathway as the sole route, paradoxically accelerating ventricular rate.\n\n(B) Digoxin is CONTRAINDICATED for the same reason — AV-nodal block.\n\n(D) Verapamil (and other CCBs) are CONTRAINDICATED — AV-nodal block.\n\n(E) Beta-blockers are CONTRAINDICATED — AV-nodal block.\n\n💎 PEARL: Irregular wide-complex tachycardia with varying QRS = pre-excited AF in WPW. Unstable: synchronised cardioversion. Adenosine, verapamil, diltiazem and digoxin CONTRAINDICATED — they accelerate accessory-pathway conduction.",
   references:[{label:"NICE NG196 — Atrial fibrillation: diagnosis & management (2021)", url:"https://www.nice.org.uk/guidance/ng196"},{label:"ESC 2024 AF Management Guidelines", url:"https://academic.oup.com/eurheartj/article/45/36/3314/7738779"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Cardiac sarcoidosis",
   stem:"A 48-year-old African-Caribbean woman with biopsy-confirmed pulmonary sarcoidosis presents with palpitations and pre-syncope. ECG: complete heart block.\n\nWhich is the most likely diagnosis?",
   options:["Ischaemic cardiomyopathy","Cardiac sarcoidosis","Hypertrophic cardiomyopathy","Constrictive pericarditis","Cardiac amyloidosis"],
   correct:"B",
   explanation:"Cardiac sarcoidosis: granulomatous infiltration of the myocardium and conduction system. Common presentations: AV block (especially in younger patients with high-grade block), ventricular arrhythmia, heart failure, sudden death. Diagnosis combines compatible clinical setting (here, established systemic sarcoidosis), imaging, and tissue biopsy where feasible. Treatment: corticosteroids (typically 30–40 mg prednisolone tapered) ± steroid-sparing immunosuppression (methotrexate, azathioprine, mycophenolate); permanent pacemaker for AV block; ICD per criteria (sustained VT, LVEF ≤35%, extensive scar).\n\n(A) Ischaemic cardiomyopathy gives a sub-endocardial / transmural LGE pattern in a coronary territory — not patchy mid-myocardial.\n\n(C) HCM shows asymmetric LV hypertrophy with SAM and LVOT obstruction; LGE is patchy but in an area of hypertrophy.\n\n(D) Constrictive pericarditis shows pericardial thickening on imaging and right-heart-failure haemodynamics — not myocardial inflammation.\n\n(E) Amyloidosis gives diffuse sub-endocardial LGE, abnormal native T1 mapping and DPD scan positivity in ATTR — not focal mid-myocardial uptake.\n\n💎 PEARL: AV block in a younger patient + known sarcoid + patchy mid-myocardial LGE + focal FDG-PET uptake = cardiac sarcoidosis. Steroids; pacemaker for AV block; ICD per criteria.",
   references:[{label:"BTS Sarcoidosis Position Statement", url:"https://www.brit-thoracic.org.uk/quality-improvement/guidelines/sarcoidosis/"},{label:"ATS Sarcoidosis Guideline (2020)", url:"https://www.atsjournals.org/doi/10.1164/rccm.202002-0251ST"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Cardiac amyloidosis (ATTR-CM)",
   stem:"A 75-year-old man presents with progressive heart failure. ECG: low voltage QRS. He had bilateral carpal tunnel release 8 years ago. Serum free light chains, serum and urine immunofixation: normal.\n\nWhich is the most likely diagnosis?",
   options:["Hypertensive heart disease","Hypertrophic cardiomyopathy","Transthyretin (ATTR) cardiac amyloidosis","Constrictive pericarditis","Athlete's heart"],
   correct:"C",
   explanation:"Cardiac amyloidosis — increasingly recognised cause of HFpEF in older adults. Red flags here: 'LVH' on echo with low-voltage ECG (a classic discordance), bi-atrial enlargement, restrictive filling, prior bilateral carpal tunnel syndrome (often years earlier), sub-endocardial LGE, abnormal T1 mapping. Two main types — AL (clonal plasma-cell disorder, suspected if monoclonal protein on immunofixation or abnormal free light chains) and ATTR (wild-type or hereditary). DPD/PYP/HMDP bone scintigraphy with grade 2–3 cardiac uptake AND a NEGATIVE monoclonal screen is highly specific for ATTR-CM (Gillmore criteria — non-biopsy diagnosis). Tafamidis improves survival in ATTR-CM (ATTR-ACT trial). Specialist amyloid centre input.\n\n(A) Hypertensive heart disease gives concentric LVH with elevated voltages — opposite voltage-wall-thickness discordance.\n\n(B) HCM has asymmetric septal hypertrophy with SAM and LVOT obstruction; family history is common; no DPD avidity.\n\n(D) Constrictive pericarditis shows thickened, often calcified pericardium on imaging — not myocardial infiltration.\n\n(E) Athlete's heart shows physiological LVH with normal diastolic function and regression with detraining.\n\n💎 PEARL: Echo LVH + low-voltage ECG (the giveaway discordance) + bi-atrial enlargement + prior carpal tunnel = think amyloid. DPD grade 2–3 with NEGATIVE monoclonal screen = ATTR-CM (no biopsy). Tafamidis.",
   references:[{label:"ESC 2021 Heart Failure Guidelines (cardiac amyloidosis)", url:"https://academic.oup.com/eurheartj/article/42/36/3599/6358045"},{label:"NICE TA696 — Tafamidis for ATTR-CM", url:"https://www.nice.org.uk/guidance/ta696"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Drug-induced torsades de pointes",
   stem:"A 65-year-old inpatient woman is on citalopram, ondansetron, clarithromycin and amiodarone. She has a brief loss of consciousness on the ward; cardiac monitoring captures a polymorphic VT with twisting QRS axis ('torsades'), self-terminating after 12 seconds. ECG in sinus rhythm: QTc 620 ms. K⁺ 3.2 mmol/L, Mg²⁺ 0.6 mmol/L.\n\nWhich is the most appropriate immediate management?",
   options:["Increase amiodarone","IV magnesium sulfate 2 g over 10 minutes; correct K⁺ and Mg²⁺; stop all QT-prolonging drugs","IV beta-blocker bolus","IV class IA antiarrhythmic","Aspirin 300 mg"],
   correct:"B",
   explanation:"Drug-induced long QT predisposes to polymorphic VT (torsades de pointes). Common precipitants in hospital: macrolides (clarithromycin, erythromycin), fluoroquinolones, antipsychotics, methadone, ondansetron, citalopram, antihistamines, antiarrhythmics (Class IA, Class III — including amiodarone). Multiple culprits in combination greatly amplify risk. Acute management: IV magnesium sulfate 2 g over 10 minutes (suppresses early afterdepolarisations even if Mg²⁺ is 'normal'), correct potassium (target K⁺ >4.5) and magnesium (target Mg²⁺ >1.0), stop all QT-prolonging drugs. For pause-dependent or refractory torsades: transvenous overdrive pacing (90–110 bpm) or isoprenaline. Defibrillation if degenerates to VF. CredibleMeds.org maintains an up-to-date list of culprit drugs.\n\n(A) Amiodarone itself prolongs the QT — increasing it would worsen the problem.\n\n(C) Beta-blockade may help in congenital LQTS but is NOT first-line in acute drug-induced torsades; magnesium is.\n\n(D) Class IA antiarrhythmics (procainamide, quinidine) prolong the QT and are PRO-arrhythmic in this setting.\n\n(E) Aspirin has no role in arrhythmia.\n\n💎 PEARL: Polymorphic VT + long QT + multiple QT-prolonging drugs + low K⁺/Mg²⁺ = drug-induced torsades. IV magnesium 2 g (even if Mg²⁺ normal); K⁺ >4.5, Mg²⁺ >1.0; stop ALL culprits.",
   references:[{label:"ESC 2022 Ventricular Arrhythmias and SCD Guidelines", url:"https://academic.oup.com/eurheartj/article/43/40/3997/6675633"},{label:"CredibleMeds list (QT-prolonging drugs)", url:"https://www.crediblemeds.org/"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Constrictive pericarditis vs restrictive cardiomyopathy",
   stem:"A 56-year-old man treated for tuberculous pericarditis 4 years ago presents with progressive ascites, peripheral oedema, and exertional breathlessness. JVP raised with prominent x and y descents. Kussmaul sign present (rise in JVP on inspiration). On auscultation: pericardial knock. Echo: thickened pericardium, septal bounce, respirophasic ventricular interdependence.\n\nWhich is the most likely diagnosis?",
   options:["Restrictive cardiomyopathy","Constrictive pericarditis","Severe tricuspid regurgitation","Cirrhosis","Right ventricular infarction"],
   correct:"B",
   explanation:"Constrictive pericarditis: stiffened, often calcified pericardium impairs diastolic filling. Causes: post-cardiac surgery (most common in developed countries), TB (most common worldwide), radiation, connective tissue disease, malignancy, idiopathic. Features: signs of right heart failure with PRESERVED systolic function; raised JVP with prominent x AND y descents (M or W pattern); Kussmaul sign (rise in JVP on inspiration); pericardial knock; respirophasic ventricular interdependence on echo / MRI; thickened or calcified pericardium on imaging. Treatment: pericardiectomy is the only curative treatment; medical therapy is for symptomatic relief and the underlying cause.\n\n(A) Restrictive cardiomyopathy gives similar clinical features but with abnormal myocardium (raised T1 mapping in amyloidosis; iron-loaded myocardium in haemochromatosis); pericardium is not thickened; ventricular interdependence is absent.\n\n(C) Severe TR has prominent v wave (not preserved x descent), peripheral cyanosis, pulsatile liver — different JVP morphology.\n\n(D) Cirrhosis has stigmata of chronic liver disease, low albumin, deranged LFTs, no raised JVP / Kussmaul.\n\n(E) RV infarct has acute presentation in the setting of inferior STEMI, ECG changes, troponin rise.\n\n💎 PEARL: TB or post-cardiac surgery + raised JVP with prominent x AND y descents + Kussmaul + pericardial knock + thickened pericardium = constriction. Pericardiectomy curative. Restrictive cardiomyopathy lacks pericardial thickening.",
   references:[{label:"ESC 2015 Pericardial Diseases Guidelines", url:"https://academic.oup.com/eurheartj/article/36/42/2921/2293375"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Mobitz type I (Wenckebach) AV block",
   stem:"A 60-year-old woman presents to the AMU with mild dizziness while on bisoprolol for AF rate control. ECG: progressive PR prolongation over 4 beats culminating in a non-conducted P wave, then the cycle resumes. The pattern repeats. QRS is narrow. HR 56, BP 122/76, asymptomatic between episodes.\n\nWhich is the most likely diagnosis?",
   options:["Mobitz type II AV block","Mobitz type I (Wenckebach) AV block","Complete (third-degree) heart block","Sinus bradycardia","Atrial flutter with variable conduction"],
   correct:"B",
   explanation:"Mobitz type I (Wenckebach) AV block: progressive PR prolongation followed by a non-conducted P wave and resumption of the cycle. Typically AV-nodal disease (often vagal- or drug-mediated — beta-blockers, non-DHP CCBs, digoxin), narrow QRS escape, stable haemodynamics. May be a normal finding in athletes, during sleep, or with vagotonic states. Generally benign — review and adjust medications, address reversible causes; pacemaker rarely needed unless symptomatic or associated with structural disease (e.g. inferior MI involving the AV node).\n\n(A) Mobitz type II shows CONSTANT PR before each conducted beat with intermittent dropped QRS — infranodal disease, broad QRS, high risk of progression to complete heart block, pacemaker indicated.\n\n(C) Complete heart block shows COMPLETE AV dissociation with independent atrial and ventricular rhythms — neither rate is conducting to the other.\n\n(D) Sinus bradycardia: every P wave is conducted (1:1) at a slow rate — no dropped beats.\n\n(E) Atrial flutter with variable conduction has flutter waves at ~300/min in the inferior leads — different morphology entirely.\n\n💎 PEARL: Progressive PR prolongation → dropped beat = Wenckebach (Mobitz I). Usually AV-nodal, narrow QRS, drug- or vagal-mediated. Generally benign — review meds; pacing rarely needed.",
   references:[{label:"ESC 2021 Cardiac Pacing & CRT Guidelines", url:"https://academic.oup.com/eurheartj/article/42/35/3427/6358547"},{label:"NICE TA88 — Dual-chamber pacemakers for symptomatic bradycardia", url:"https://www.nice.org.uk/guidance/ta88"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Hypertensive emergency — controlled BP reduction",
   stem:"A 50-year-old man presents with severe headache and blurred vision. BP 240/138 mmHg. Examination: bilateral papilloedema, retinal haemorrhages, exudates and cotton-wool spots. Urinalysis: protein +++, blood +. Creatinine 168 µmol/L (baseline 90). ECG: LV strain pattern. He is alert with no focal neurological deficit.\n\nWhich is the most appropriate management?",
   options:["Outpatient antihypertensive titration with safety-netting","Admit; IV labetalol or nicardipine to reduce BP by ~25% in the first hour, then to 160/100 over the next 2–6 hours","Sublingual nifedipine for rapid BP reduction","IV labetalol to reduce BP to <140/90 within 30 minutes","No acute treatment — observe only"],
   correct:"B",
   explanation:"Hypertensive emergency: severely elevated BP with acute end-organ damage (encephalopathy, intracranial haemorrhage, retinopathy, acute LV failure, dissection, MI / ACS, AKI, eclampsia). Distinct from hypertensive urgency (severely elevated BP without acute end-organ damage). Management: admit to a monitored bed; cautious controlled BP reduction with IV agent (labetalol, nicardipine, or GTN if pulmonary oedema; sodium nitroprusside; phentolamine for catecholamine excess). Target ~25% reduction in the first hour, then to 160/100 over the next 2–6 hours. Aortic dissection requires more aggressive control (SBP <120 within 20 minutes). Eclampsia: labetalol, hydralazine, magnesium. Investigate for secondary causes after stabilisation.\n\n(A) End-organ damage requires inpatient management — outpatient titration is unsafe.\n\n(C) Sublingual nifedipine causes uncontrolled, rapid drops in BP — risk of cerebral, coronary or renal hypoperfusion (and stroke).\n\n(D) Reducing BP too rapidly (≤140/90 within 30 minutes) causes the same hypoperfusion risk — the cerebral and coronary autoregulatory range has shifted upwards in chronic hypertension.\n\n(E) Without treatment, end-organ damage will progress — observation alone is unsafe.\n\n💎 PEARL: Hypertensive emergency = severe BP + acute end-organ damage. IV labetalol or nicardipine; reduce by ~25% in the first hour, then 160/100 over 2–6 hours. Dissection needs faster control (SBP <120 within 20 min).",
   references:[{label:"NICE NG136 — Hypertension in adults (2019)", url:"https://www.nice.org.uk/guidance/ng136"},{label:"ESC/ESH 2023 Hypertension Guidelines", url:"https://academic.oup.com/eurheartj/article/44/38/3824/7246265"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"AF — anticoagulation choice (non-valvular)",
   stem:"A 75-year-old man with new-onset paroxysmal atrial fibrillation is being considered for stroke prophylaxis. He has hypertension and type 2 diabetes. Cha₂DS₂-vasc 4, HAS-BLED 1. EGFR 72. He has no mechanical heart valve and no significant mitral stenosis.\n\nWhich is the most appropriate anticoagulation?",
   options:["Aspirin 75 mg daily","Apixaban 5 mg twice daily","Warfarin (target INR 2–3)","No anticoagulation","Clopidogrel 75 mg daily"],
   correct:"B",
   explanation:"NICE NG196 / ESC: in non-valvular AF with CHA₂DS₂-VASc ≥2 (men) or ≥3 (women), oral anticoagulation is recommended. DOACs (apixaban, rivaroxaban, edoxaban, dabigatran) are PREFERRED over warfarin — easier monitoring, fewer interactions, and better safety in most populations (especially intracranial haemorrhage). Apixaban has the most favourable major bleeding profile in many comparative analyses (ARISTOTLE). Warfarin is reserved for valvular AF (mechanical valve, moderate-severe mitral stenosis) where DOACs lack evidence. Counselling about adherence (DOACs have short half-lives — missed doses leave the patient unprotected), bleeding signs and renal-dose adjustment is essential.\n\n(A) Aspirin alone is NOT recommended for stroke prevention in AF (BAFTA, AVERROES) — significantly inferior to oral anticoagulation with similar bleeding risk.\n\n(C) Warfarin is no longer first-line for non-valvular AF — DOAC preferred.\n\n(D) No anticoagulation in CHA₂DS₂-VASc 4 carries unacceptable stroke risk (~4% per year).\n\n(E) Clopidogrel (alone or with aspirin — ACTIVE-A) is inferior to warfarin/DOACs and not used for stroke prevention in AF.\n\n💎 PEARL: Non-valvular AF + CHA₂DS₂-VASc ≥2 (men) or ≥3 (women): DOAC over warfarin (apixaban — best bleeding profile, ARISTOTLE). Aspirin is NOT adequate stroke prevention. Warfarin only for mechanical valve or significant mitral stenosis.",
   references:[{label:"NICE NG196 — Atrial fibrillation: diagnosis & management (2021)", url:"https://www.nice.org.uk/guidance/ng196"},{label:"ESC 2024 AF Management Guidelines", url:"https://academic.oup.com/eurheartj/article/45/36/3314/7738779"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Hypertrophic cardiomyopathy — symptomatic obstruction",
   stem:"A 32-year-old man with known HCM (asymmetric septal hypertrophy 22 mm, sam, resting LVOT gradient 65 mmHg, peak provoked 100 mmHg) presents with progressive exertional breathlessness and pre-syncope despite maximally tolerated bisoprolol. NYHA III. His brother died suddenly aged 35. ECG: deep narrow Q waves and lateral T-wave inversion. He is in sinus rhythm.\n\nWhich is the most appropriate next step?",
   options:["Add a high-dose ACE inhibitor","Add disopyramide or refer for mavacamten / septal reduction therapy; consider ICD per HCM Risk-SCD","Add furosemide and amlodipine","Permanent pacemaker only","Routine PCI of the LAD"],
   correct:"B",
   explanation:"Hypertrophic cardiomyopathy with symptomatic LVOT obstruction (resting gradient ≥30 mmHg or provoked ≥50 mmHg) NOT controlled on a beta-blocker: add disopyramide (negative inotrope, reduces gradient) or refer for mavacamten — a cardiac myosin inhibitor — which reduces the LVOT gradient and improves symptoms (EXPLORER-HCM, VALOR-HCM). Septal reduction therapy (surgical myectomy or alcohol septal ablation) is considered for refractory obstruction. Concurrent ICD assessment: HCM Risk-SCD model incorporates age, syncope, family history of SCD, NSVT, LV thickness, LA size, LVOT gradient — primary-prevention ICD if 5-year SCD risk ≥6%. Avoid competitive sport.\n\n(A) High-dose ACE inhibitor REDUCES afterload and can worsen LVOT obstruction by reducing LV cavity size — contraindicated in dynamic obstruction.\n\n(C) Furosemide reduces preload and worsens obstruction; dihydropyridine CCBs (amlodipine) similarly reduce afterload — both are contraindicated.\n\n(D) Pacing alone does not address obstruction — at most provides marginal symptomatic benefit; not appropriate as primary therapy.\n\n(E) PCI is for atherosclerotic coronary disease — not HCM.\n\n💎 PEARL: Symptomatic HCM with LVOT obstruction not controlled on a beta-blocker: add disopyramide or mavacamten (cardiac myosin inhibitor — EXPLORER-HCM). Septal reduction for refractory cases. ACE inhibitors WORSEN outflow obstruction.",
   references:[{label:"ESC 2023 HCM Guidelines (Eur Heart J)", url:"https://academic.oup.com/eurheartj/article/45/30/2698/7766816"},{label:"AHA/ACC 2024 HCM Guideline", url:"https://www.jacc.org/doi/10.1016/j.jacc.2024.02.014"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Tamponade physiology — Kussmaul vs pulsus paradoxus",
   stem:"A 60-year-old woman is being assessed for progressive breathlessness and oedema. On the bedside, her systolic BP falls by 22 mmHg on inspiration. Her JVP rises with inspiration. She has prominent x descents on the JVP waveform with attenuated y descents. Heart sounds are muffled. Which combination of bedside findings is most consistent with cardiac tamponade rather than constrictive pericarditis?",
   options:["Pulsus paradoxus present, Kussmaul sign absent, prominent x descent with attenuated y descent","Pulsus paradoxus absent, Kussmaul sign present, prominent x and y descents","Pulsus paradoxus and Kussmaul sign both absent","No JVP elevation in either condition","Pulsus paradoxus and S3 gallop together"],
   correct:"A",
   explanation:"Tamponade and constriction both cause raised JVP and right-heart-failure features but their bedside physiology differs. TAMPONADE: pericardial fluid compresses the heart throughout the cardiac cycle. Pulsus paradoxus is PRESENT. The y descent is ATTENUATED (early-diastolic filling is restricted because the heart is compressed throughout diastole), giving prominent x but blunted y. Kussmaul sign (rise in JVP on inspiration) is typically ABSENT — venous return can still increase to fill the heart during inspiration in the early-diastolic period. CONSTRICTION: a stiffened pericardium permits early-diastolic filling but abruptly halts filling later. Pulsus paradoxus is usually ABSENT (no exaggerated ventricular interdependence).\n\n(B) Describes constriction physiology.\n\n(C) Both signs absent — not specific for either.\n\n(D) JVP IS elevated in both.\n\n(E) S3 is a feature of restrictive cardiomyopathy, not tamponade.\n\n💎 PEARL: Tamponade: pulsus paradoxus PRESENT, Kussmaul ABSENT, attenuated y descent. Constriction: pulsus paradoxus ABSENT, Kussmaul PRESENT, prominent x AND y descents. Easy bedside discriminator.",
   references:[{label:"ESC 2015 Pericardial Diseases Guidelines", url:"https://academic.oup.com/eurheartj/article/36/42/2921/2293375"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"HFpEF — disease-modifying therapy",
   stem:"A 78-year-old woman with hypertension, type 2 diabetes, AF and obesity (BMI 36) has progressive exertional dyspnoea (NYHA III) and peripheral oedema. NT-proBNP 1200 ng/L. CMR: no infiltrative cardiomyopathy. She is on furosemide for symptoms.\n\nWhich is the most appropriate addition to her therapy?",
   options:["Sacubitril/valsartan","Empagliflozin (or dapagliflozin)","Aspirin 75 mg daily","Long-term oral prednisolone","Digoxin"],
   correct:"B",
   explanation:"Heart failure with preserved ejection fraction (HFpEF, LVEF ≥50%): increasingly recognised, particularly in older women with hypertension, AF, diabetes and obesity. Diagnosis combines symptoms/signs of HF, raised NT-proBNP, and echocardiographic features of diastolic dysfunction (raised E/e', LA enlargement, LVH). Exclude infiltrative causes (amyloidosis on CMR / DPD scan), constrictive pericarditis and high-output failure. Management: SGLT2 inhibitor (empagliflozin or dapagliflozin) is now first-line disease-modifying therapy regardless of diabetes status — EMPEROR-Preserved and DELIVER both showed reduction in HF hospitalisation and cardiovascular death. Loop diuretic for congestion (already in place). MRA (spironolactone — TOPCAT subgroup data; finerenone — FINEARTS-HF) considered selectively.\n\n(A) Sacubitril/valsartan was studied in HFpEF (PARAGON-HF) — narrowly missed primary endpoint; not first-line in HFpEF (it IS first-line in HFrEF).\n\n(C) Aspirin has no role in HFpEF without atherosclerotic cardiovascular disease — and she needs anticoagulation for AF anyway.\n\n(D) Long-term steroid is not a heart failure therapy and worsens fluid retention.\n\n(E) Digoxin reduces hospitalisations in HFrEF (DIG); no clear role in HFpEF.\n\n💎 PEARL: HFpEF (LVEF ≥50%) + symptoms + raised NT-proBNP + diastolic dysfunction on echo: SGLT2 inhibitor first-line disease modifier (EMPEROR-Preserved, DELIVER), regardless of diabetes status. Loop diuretic for congestion.",
   references:[{label:"ESC 2023 HF Focused Update (Eur Heart J)", url:"https://academic.oup.com/eurheartj/article/44/37/3627/7246292"},{label:"DELIVER trial (NEJM 2022) — dapagliflozin in HFpEF", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2206286"},{label:"EMPEROR-Preserved (NEJM 2021) — empagliflozin in HFpEF", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2107038"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"AF — left atrial appendage occlusion",
   stem:"A 75-year-old man with non-valvular AF (cha₂DS₂-vasc 5) has had two life-threatening upper GI bleeds while on apixaban (after an earlier bleed on warfarin). Source-controlled at endoscopy each time. Repeated DOAC dose reductions have not prevented bleeding. He has refused to continue any oral anticoagulation. He is otherwise fit.\n\nWhich is the most appropriate stroke-prevention strategy?",
   options:["No further intervention possible","Left atrial appendage occlusion (e.g. Watchman device)","Resume apixaban at full dose","Aspirin 75 mg daily as equivalent stroke prevention","Long-term oral prednisolone"],
   correct:"B",
   explanation:"In non-valvular AF, ~90% of stroke-causing thrombi originate in the left atrial appendage (LAA). Left atrial appendage occlusion (most commonly the Watchman device) provides an alternative for patients with high stroke risk in whom long-term anticoagulation is contraindicated, has failed (recurrent bleeding) or is refused. PROTECT-AF and PREVAIL demonstrated non-inferiority for stroke prevention versus warfarin, with reduced major bleeding (especially haemorrhagic stroke). Post-implant: short-term antiplatelet therapy (e.g. aspirin + clopidogrel, then aspirin alone) before transitioning to long-term aspirin once endothelialisation is documented on imaging. Selection requires multidisciplinary discussion (cardiology, haematology, GI / neuro / renal as relevant) and shared decision-making.\n\n(A) Effective stroke prevention exists — LAAO.\n\n(C) Resuming a drug that has caused two life-threatening bleeds AND that the patient refuses is unsafe and unethical.\n\n(D) Aspirin alone is INFERIOR for stroke prevention in AF (BAFTA, AVERROES) with a similar bleeding risk profile — not equivalent.\n\n(E) Long-term steroid has no role in stroke prevention and increases bleeding (mucosal effects).\n\n💎 PEARL: Non-valvular AF + recurrent life-threatening bleeding on anticoagulation (or contraindication): LAA occlusion (Watchman). ~90% of AF thrombi originate in the appendage. PROTECT-AF/PREVAIL — non-inferior to warfarin.",
   references:[{label:"NICE IPG 349 — Percutaneous LAA Occlusion", url:"https://www.nice.org.uk/guidance/ipg349"},{label:"ESC 2024 AF Guidelines (LAA occlusion)", url:"https://academic.oup.com/eurheartj/article/45/36/3314/7738779"}]},

  {section:"cardiovascular", specialty:"Cardiology", topic:"Anthracycline-induced cardiotoxicity (CTRCD)",
   stem:"A 50-year-old woman has completed adjuvant doxorubicin-containing chemotherapy and is on trastuzumab for HER2-positive breast cancer. Six months on, she develops exertional dyspnoea (NYHA II). Troponin elevated; NT-proBNP 1500 ng/L. There is no obstructive coronary disease on CT angiography.\n\nWhich is the most appropriate management?",
   options:["Stop monitoring; reassure","Cardio-oncology referral; start full HFrEF therapy (ACEi or ARNI, beta-blocker, MRA, SGLT2i); discuss modifying cardiotoxic therapy with the oncology team","Aspirin 75 mg daily","Long-term oral prednisolone","Furosemide alone"],
   correct:"B",
   explanation:"Cancer-therapy-related cardiac dysfunction (CTRCD) is recognised with anthracyclines (cumulative dose-dependent), trastuzumab and other HER2-targeted agents (often reversible on holding therapy), tyrosine kinase inhibitors, immune checkpoint inhibitors (myocarditis — high mortality) and radiotherapy. Diagnosis: ≥10-percentage-point fall in LVEF to <50%, OR new systolic dysfunction, OR raised cardiac biomarkers, with or without symptoms. Management: prompt HFrEF therapy with all four pillars (ACE inhibitor or ARNI; beta-blocker; MRA; SGLT2 inhibitor — based on PARADIGM-HF, EMPEROR-Reduced, DAPA-HF). Long-term cardiology follow-up; address cardiovascular risk factors. Recovery is possible, particularly with prompt diagnosis.\n\n(A) Reassurance with established cardiac dysfunction misses a treatable cause of mortality.\n\n(C) Aspirin has no role in non-ischaemic cardiomyopathy.\n\n(D) Long-term steroid is not a heart failure therapy and worsens fluid retention.\n\n(E) Furosemide alone treats congestion but does not modify disease — none of the four mortality-modifying agents.\n\n💎 PEARL: Anthracycline ± trastuzumab + drop in LVEF ≥10 points to <50% = CTRCD. Start full HFrEF therapy (ACEi/ARNI, beta-blocker, MRA, SGLT2i) and discuss modifying chemotherapy. Recovery possible if treated early.",
   references:[{label:"ESC 2022 Cardio-Oncology Guidelines", url:"https://academic.oup.com/eurheartj/article/43/41/4229/6673925"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Idiopathic pulmonary fibrosis — diagnosis",
   stem:"A 65-year-old non-smoker presents with progressive exertional dyspnoea over 18 months and a dry cough. Examination: fine, 'Velcro-like' bibasal end-inspiratory crackles and finger clubbing. Spirometry: restrictive pattern with reduced TLco. Connective-tissue and hypersensitivity-pneumonitis screen negative.\n\nWhich is the most likely diagnosis?",
   options:["Hypersensitivity pneumonitis","Non-specific interstitial pneumonia (NSIP)","Idiopathic pulmonary fibrosis","Sarcoidosis","Cryptogenic organising pneumonia (cop)"],
   correct:"C",
   explanation:"HRCT showing peripheral, subpleural, basal-predominant honeycombing with traction bronchiectasis and absence of features that suggest an alternative diagnosis is the definite UIP pattern. With no identifiable cause (no exposure, no autoimmune features, no drug aetiology), this is idiopathic pulmonary fibrosis. Antifibrotic therapy with pirfenidone or nintedanib slows decline (CAPACITY, ASCEND, INPULSIS); supportive care includes pulmonary rehabilitation, oxygen for hypoxaemia, vaccination, and consideration of lung transplantation in advanced disease. Median survival historically 3–5 years, improving with antifibrotics.\n\n(A) Hypersensitivity pneumonitis (chronic) has mid-upper-zone predominant ground-glass and centrilobular nodules with mosaic attenuation; antigen exposure history is the key clue.\n\n(B) NSIP shows ground-glass with subpleural sparing, less honeycombing; often associated with connective-tissue disease (negative here).\n\n(D) Sarcoidosis: bilateral hilar lymphadenopathy with mid-upper-zone reticulonodular pattern; biopsy shows non-caseating granulomas.\n\n(E) COP: peripheral or peribronchovascular consolidation with the 'reverse halo' or 'atoll' sign; responds to steroids.\n\n💎 PEARL: Older patient + dry cough + fine 'Velcro' crackles + clubbing + restrictive spirometry + UIP pattern (basal subpleural honeycombing) on HRCT = IPF. Pirfenidone or nintedanib slow decline; transplant in advanced cases.",
   references:[{label:"NICE CG163 — Idiopathic pulmonary fibrosis", url:"https://www.nice.org.uk/guidance/cg163"},{label:"NICE TA379 — Pirfenidone for IPF", url:"https://www.nice.org.uk/guidance/ta379"},{label:"NICE TA504 — Nintedanib for IPF", url:"https://www.nice.org.uk/guidance/ta504"}]},

  {section:"respiratory", specialty:"Respiratory", topic:"Allergic bronchopulmonary aspergillosis (ABPA)",
   stem:"A 28-year-old woman with poorly controlled asthma despite high-dose ics-laba presents with a 6-week history of worsening cough, breathlessness and brown sputum plugs. CXR: fleeting upper-zone infiltrates. Eosinophil count 1.6 × 10⁹/L, total IgE 1820 kU/L, raised Aspergillus-specific IgE and IgG (precipitins).\n\nWhich is the most likely diagnosis?",
   options:["Aspergilloma","Allergic bronchopulmonary aspergillosis","Eosinophilic granulomatosis with polyangiitis","Chronic eosinophilic pneumonia","Invasive pulmonary aspergillosis"],
   correct:"B",

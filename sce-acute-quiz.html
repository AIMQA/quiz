   references:[{label:"ESMO Immune-Related Adverse Events Guidelines (2022)", url:"https://www.esmo.org/guidelines/guidelines-by-topic/supportive-and-palliative-care"},{label:"UK Oncology Society irAE Guidance", url:"https://www.ukons.org/site/assets/files/1144/oncology_emergency_treatment_guidelines.pdf"}]},

  // ═══════════════════════════════════════════════════════════
  // CLINICAL PHARMACOLOGY & POISONING  (target 18 — current 18 ✓)

  {section:"pharm_tox", specialty:"Toxicology", topic:"Paracetamol overdose",
   stem:"A 28-year-old man presents 6 hours after ingesting 30 paracetamol tablets (15 g, ~250 mg/kg) with suicidal intent. He is currently asymptomatic, GCS 15, normal observations, no pain. Paracetamol level at 6 hours is 180 mg/L — above the treatment line on the modified UK nomogram (the single 100 mg/L line at 4 hours, declining to 15 mg/L at 16 hours — adopted post-2012 MHRA update which abolished separate 'high-risk' and 'normal-risk' lines). Bloods: ALT 25 (normal), INR 1.0, creatinine 80, lactate 1.5, no acidosis, paracetamol level 180 mg/L.\n\nWhich is the most appropriate management?",
   options:["Activated charcoal","IV N-acetylcysteine — snap regimen 21-hour infusion","Oral methionine","Haemodialysis","Observation and re-check at 12 hours"],
   correct:"B",
   explanation:"PARACETAMOL (acetaminophen) OVERDOSE: most common drug overdose worldwide; UK leading cause of acute liver failure. PRESENTATION — STAGES: stage 1 (0-24 h): often asymptomatic; nausea, vomiting, malaise; stage 2 (24-72 h): RUQ pain, transaminitis begins, INR rises (synthetic dysfunction earliest sign of severe injury); stage 3 (72-96 h): peak hepatotoxicity — fulminant hepatic failure, coagulopathy, encephalopathy, jaundice, AKI, lactic acidosis, hypoglycaemia, multi-organ failure; stage 4 (4-14 days): recovery in survivors, or progression to death. MANAGEMENT — N-ACETYLCYSTEINE (NAC, Parvolex): the antidote — replenishes glutathione stores and provides direct sulfhydryl groups that neutralise NAPQI.\n\n(A) Charcoal beyond 1 hour ineffective; this patient at 6 h.\n\n(C) Oral methionine — outdated alternative used in remote settings or where IV not available; less reliable absorption with vomiting; rarely first-line in modern UK practice.\n\n(D) Haemodialysis rarely indicated.\n\n(E) Observation alone with level above treatment line risks hepatotoxicity / death.\n\n💎 PEARL: Acute paracetamol overdose ≥4 hours ago: level vs the single 100 mg/L line at 4 hours (UK MHRA 2012 — abolished separate 'high-risk' line). Above the line → IV NAC. SNAP regimen (12-hour) is now NICE-approved alternative — fewer adverse reactions vs traditional 21-h regimen. King's: pH <7.3 alone, OR all of INR >6.5 + creatinine >300 + grade 3–4 encephalopathy.",
   references:[{label:"MHRA Paracetamol Overdose Treatment", url:"https://www.gov.uk/drug-safety-update/treating-paracetamol-overdose-with-intravenous-acetylcysteine-new-guidance"},{label:"TOXBASE — Paracetamol", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Supratherapeutic INR on warfarin",
   stem:"A 70-year-old man on warfarin for chronic atrial fibrillation (target INR 2-3, chads-vasc 4) attends his routine anticoagulation clinic. INR today 9.2 (markedly supratherapeutic). He has no bleeding (no haematuria, melaena, haematemesis, epistaxis, bruising, intracranial symptoms), no recent injury, no change in medication recently, no recent acute illness, no antibiotic exposure. He has been on a stable dose 3 mg daily for 2 years; previous INRs in range. Haemodynamically stable, no signs of bleeding on examination. FBC normal, U&E normal.\n\nWhich is the most appropriate management?",
   options:["Continue warfarin at usual dose; recheck in 24 hours","Withhold warfarin, give oral vitamin K 1-5 mg, recheck INR in 24 hours, restart warfarin at lower dose","IV vitamin K 10 mg","Prothrombin complex concentrate (PCC)","Fresh frozen plasma"],
   correct:"B",
   explanation:"WARFARIN: oral VITAMIN K ANTAGONIST anticoagulant; inhibits vitamin K epoxide reductase → reduces functional vitamin-K-dependent CLOTTING FACTORS (II, VII, IX, X) and the natural anticoagulants (PROTEIN C and S). PHARMACOLOGY: long half-life ~36 hours; full anticoagulant effect 5-7 days after dose change (because of the half-lives of clotting factors); slow elimination. INR rises ~24-72 hours after dose change. NO BLEEDING (this patient): INR <5 — REDUCE / withhold dose; recheck in 1-2 days. REASONING: high INR > 8 carries appreciable spontaneous bleeding risk; oral vitamin K reverses gradually over 24-48 hours; preserves ability to re-anticoagulate; AVOID over-correction.\n\n(A) Continue / recheck without action: INR 9.2 carries appreciable bleeding risk in older patient; intervention is needed.\n\n(C) IV vitamin K 10 mg: reserved for bleeding / urgent reversal; in stable patient over-corrects, makes re-anticoagulation hard.\n\n(D) PCC: for major bleeding only; not for asymptomatic high INR.\n\n(E) FFP: outdated for warfarin reversal where PCC available; inferior and slower.\n\n💎 PEARL: INR 5–8 + no bleeding: withhold warfarin, recheck. INR 8–10 + no bleeding: withhold + ORAL vitamin K 1–5 mg + recheck in 24 h. INR >10 + no bleeding: oral vitamin K 5 mg. MAJOR BLEEDING (any INR): IV vitamin K 5–10 mg + 4-factor PCC (faster, more complete than FFP). Investigate cause — drug interaction, illness, dietary change.",
   references:[{label:"BCSH Guidelines on Oral Anticoagulation with Warfarin", url:"https://b-s-h.org.uk/guidelines/"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Severe lithium toxicity",
   stem:"A 45-year-old man on lithium 800 mg daily for bipolar disorder (10 years; previously stable, target 0.6-0.8 mmol/L) is started on a thiazide diuretic (bendroflumethiazide 2.5 mg) 2 weeks ago for newly diagnosed hypertension. He now presents with coarse tremor (worse than baseline), ataxia, dysarthria, nausea, vomiting, and confusion (GCS 12). Examination: hyperreflexia, gait ataxia, mild dehydration. T 37.2, HR 105, BP 110/70. Investigations: lithium level 2.8 mmol/L (severe toxicity — toxic >1.5, severe >2.5), Na 132 (mildly low), creatinine 145 (raised from baseline 90 — AKI), eGFR 45.\n\nWhich is the most appropriate management?",
   options:["Reduce lithium dose; recheck level in 1 week","Stop lithium; haemodialysis (severe toxicity with neurological features and AKI); IV fluids while awaiting dialysis","Activated charcoal","Continue lithium and observe","Forced alkaline diuresis"],
   correct:"B",
   explanation:"LITHIUM: mood stabiliser; first-line for BIPOLAR DISORDER (mania prophylaxis, depression prophylaxis); also for treatment-resistant depression (augmentation), schizoaffective disorder. Half-life 18-36 hours; longer in renal impairment. \n\nINVESTIGATIONS: serum LITHIUM level (12-hour POST-DOSE — 'trough'); U&E (AKI, sodium); TFTs; calcium; ECG; toxicology screen (co-ingestion); blood gas. MONITORING: LFTs, electrolytes, glucose, renal function, lithium levels every 4-6 hours during recovery; ECG; neurological assessment. ROUTINE LITHIUM MONITORING (NICE TA): every 6 months when stable; 12-hourly post-dose; TFTs annually; U&E annually; calcium annually; pregnancy planning.\n\n(A) Reducing dose alone in severe toxicity is inadequate.\n\n(C) Charcoal not effective.\n\n(D) Continuing lithium dangerous; toxicity escalating.\n\n(E) Forced alkaline diuresis ineffective and harmful.\n\n💎 PEARL: Lithium + new thiazide / ACE-i / NSAID / dehydration → toxicity (level >1.5 toxic, >2.5 severe). Coarse tremor + ataxia + dysarthria + confusion + hyperreflexia. STOP lithium. HAEMODIALYSIS for severe toxicity (level >4, OR >2.5 with neuro / cardiac / AKI features). Isotonic saline. Activated charcoal does NOT bind lithium. Monitor levels post-dialysis (rebound).",
   references:[{label:"NICE CG185 — Bipolar disorder", url:"https://www.nice.org.uk/guidance/cg185"},{label:"TOXBASE — Lithium", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Isoniazid-induced peripheral neuropathy",
   stem:"A 60-year-old man with newly diagnosed pulmonary TB is started on standard quadruple therapy (rifampicin + isoniazid + pyrazinamide + ethambutol). He has type 2 diabetes (HbA1c 68) and a long history of harmful alcohol use (now reduced). Pyridoxine (vitamin B6) was omitted at initiation. Three weeks later he develops paraesthesia in both feet (burning, tingling — symmetrical 'glove and stocking' distribution), with mild hyperaesthesia. Examination: distal sensory loss to pinprick / vibration / proprioception, normal motor power, reflexes preserved. Glucose 9.5 (suboptimal but no marked DKA / HHS). LFTs normal.\n\nWhich is the most appropriate next step?",
   options:["Stop isoniazid","Add pyridoxine (vitamin B6) 10–25 mg daily","Stop ethambutol","Add thiamine","Reduce rifampicin dose"],
   correct:"B",
   explanation:"ISONIAZID-INDUCED PERIPHERAL NEUROPATHY: a well-recognised side effect of isoniazid (one of the cornerstone TB drugs); occurs via PYRIDOXINE (vitamin B6) ANTAGONISM. Onset typically within weeks-months of starting isoniazid; dose-related (more common with higher doses). PREVENTION: prophylactic PYRIDOXINE 10–25 mg ORALLY DAILY co-prescribed with isoniazid in ALL at-risk patients, AND increasingly in ALL patients on isoniazid (modern UK practice — universal pyridoxine). TREATMENT of established neuropathy: HIGHER DOSE pyridoxine (50–100 mg daily); reduce isoniazid dose if severe; symptomatic management (gabapentinoids, amitriptyline as for diabetic neuropathy if persistent neuropathic pain).\n\n(A) Stop isoniazid: not necessary for mild neuropathy that responds to pyridoxine; would compromise TB treatment.\n\n(C) Stop ethambutol: ethambutol's classic side effect is OPTIC NEURITIS (visual acuity / colour vision changes), not peripheral neuropathy — wrong drug to blame.\n\n(D) Thiamine: useful in alcohol-related neuropathy (dry beri-beri, Wernicke-Korsakoff) but not the specific antidote for isoniazid antagonism — pyridoxine is.\n\n(E) Reduce rifampicin: rifampicin doesn't cause peripheral neuropathy; its toxicities are hepatotoxicity, orange secretions, drug interactions through CYP induction.\n\n💎 PEARL: Isoniazid causes peripheral neuropathy through pyridoxine antagonism. Pyridoxine 10–25 mg daily prophylactically (universal in modern UK practice). Established neuropathy: 50–100 mg daily ± dose reduction. Risk increased by diabetes, alcohol, malnutrition, HIV, renal failure.",
   references:[{label:"BNF — Isoniazid", url:"https://bnf.nice.org.uk/drugs/isoniazid/"},{label:"NICE NG33 — Tuberculosis (covers ATT toxicity)", url:"https://www.nice.org.uk/guidance/ng33"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Toxic alcohol ingestion",
   stem:"A 24-year-old man presents with abdominal pain, vomiting and confusion 8 hours after a 'wild night out' — companions said he 'drank from a bottle of antifreeze for a dare'. He is tachycardic (HR 115), BP 128/80, RR 26 (Kussmaul breathing). Investigations: glucose 4.6 (normal), pH 7.20 (severe metabolic acidosis), HCO3 12 (low), lactate 2.6 (mildly raised), anion gap 28 (markedly raised; normal 8–12), ketones 1.8 (mild ketonaemia, but inadequate to explain), ethanol 0.0 mg/dL (not alcohol), osmolar gap 28 (markedly raised; normal <10). Urinary calcium oxalate crystals visible. Ophthalmology consult: blurred vision, optic disc swelling.\n\nWhich is the most likely diagnosis?",
   options:["Diabetic ketoacidosis","Alcoholic ketoacidosis","Methanol or ethylene glycol poisoning","Salicylate poisoning","Lactic acidosis from sepsis"],
   correct:"C",
   explanation:"TOXIC ALCOHOL POISONING: METHANOL (windscreen washer fluid, antifreeze, illicitly distilled alcohol — 'moonshine'); ETHYLENE GLYCOL (antifreeze, brake fluid, deicers); also ISOPROPANOL (rubbing alcohol — different pattern, no acidosis). KEY DIAGNOSTIC SIGNATURE: HIGH ANION GAP METABOLIC ACIDOSIS + RAISED OSMOLAR GAP. \n\nPRESENTATION: METHANOL — 6-30h after ingestion (delay due to slow metabolism); CNS depression, then visual disturbance (blurred vision, photophobia, scotomata, BLINDNESS — irreversible from optic nerve injury), severe metabolic acidosis, abdominal pain, headache, parkinsonism (basal ganglia toxicity from formate); 'snowfield vision' with bright haloes. MANAGEMENT — TIME-CRITICAL: (1) ABCDE, IV access.\n\n(A) DKA: glucose markedly elevated (>11), ketones markedly raised, no osmolar gap; this patient glucose normal, ketones mild.\n\n(B) Alcoholic ketoacidosis: history of alcohol misuse with starvation; ethanol negative here; ketones modest; osmolar gap not significantly raised.\n\n(D) Salicylate: history of aspirin overdose; raised lactate / anion gap, RESPIRATORY ALKALOSIS early, then metabolic acidosis; tinnitus / hyperventilation; salicylate level diagnostic; oxalate crystals not feature.\n\n(E) Sepsis lactic acidosis: lactate is raised but not enough to explain anion gap of 28; osmolar gap not raised; clinical picture differs.\n\n💎 PEARL: High anion gap metabolic acidosis + RAISED OSMOLAR GAP + risk exposure (windscreen washer, antifreeze, moonshine) = methanol or ethylene glycol. Methanol → blindness (formate, snowfield vision). Ethylene glycol → AKI + calcium oxalate crystals. Treatment: FOMEPIZOLE first-line (or ethanol) + bicarbonate + DIALYSIS for severe disease.",
   references:[{label:"TOXBASE — Methanol / Ethylene Glycol", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Tricyclic antidepressant overdose",
   stem:"A 24-year-old woman is brought to ED 2 hours after intentional ingestion of an unknown quantity of amitriptyline (her own prescription, recently restarted). On arrival: GCS 9 (drowsy, responsive to voice), BP 86/52 (hypotensive), HR 130 (sinus tachycardia), dilated pupils (8 mm, sluggish to light), DRY skin and mucosae, urinary retention (palpable bladder), absent bowel sounds. ECG: QRS 160 ms (markedly widened), terminal R wave in aVR (>3 mm — sodium channel block signature), prolonged QTc 540 ms, sinus tachycardia. ABG: pH 7.30, mild metabolic acidosis. Ingestion <4 hours ago.\n\nWhich is the most appropriate immediate management?",
   options:["IV sodium bicarbonate boluses to target pH 7.45–7.55, full supportive care","Activated charcoal alone","IV calcium","Class III antiarrhythmic (amiodarone)","Naloxone"],
   correct:"A",
   explanation:"TRICYCLIC ANTIDEPRESSANT (TCA) OVERDOSE: a SERIOUS toxicological emergency; one of the most lethal medication overdoses (high mortality even with 10x daily dose); responsible for many deaths in self-poisoning despite declining UK prescribing. CLINICAL: typically rapid onset within 2-4 hours; deterioration can be precipitous; 'walking-talking' patients can deteriorate within minutes. MANAGEMENT — TIME CRITICAL: (1) ABCDE — airway protection (intubate if GCS <8 / inadequate airway), oxygen, IV access, monitoring (continuous ECG, BP, SpO2, capnography).\n\n(B) Activated charcoal alone insufficient for cardiotoxicity — wouldn't address ongoing absorption or established toxicity; only adjunct in early presentation with airway protection.\n\n(C) IV calcium for CCB / hyperkalaemia, not TCA.\n\n(D) Class III (amiodarone) — sodium channel block — would WORSEN.\n\n(E) Naloxone for OPIOID overdose — not relevant here.\n\n💎 PEARL: TCA overdose = anticholinergic + sodium-channel block + alpha-blockade. ECG: WIDENED QRS >100 ms + terminal R wave in aVR + tachycardia. IV SODIUM BICARBONATE bolus to target pH 7.45–7.55 (treats sodium-channel block AND acidosis). Risk of seizures, arrhythmia, hypotension, coma. Avoid class IA/IC/III antiarrhythmics.",
   references:[{label:"TOXBASE — Tricyclic antidepressants", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Beta-blocker overdose",
   stem:"A 60-year-old man with depression takes an overdose of propranolol (~80 tablets, 80 mg each — estimated 6.4 g; he had it from a previous prescription for migraine). On arrival 90 minutes later: bradycardic (HR 38), hypotensive (BP 78/40), depressed mental state (GCS 12), bronchospasm. ECG: sinus bradycardia with widened QRS 130 ms (propranolol has Na-channel blocking properties — like a class I antiarrhythmic). Glucose 4.0 (low-normal). He has not responded to atropine 3 mg total IV (asystolic dose) or 1 L IV crystalloid.\n\nWhich is the most appropriate next intervention?",
   options:["IV adrenaline (epinephrine) alone","IV high-dose glucagon (5–10 mg bolus then infusion), high-dose insulin–euglycaemia therapy, vasopressors, consider ecmo","Activated charcoal as primary therapy","Sodium bicarbonate (for QRS) and beta-agonist alone","Beta-agonist alone"],
   correct:"B",
   explanation:"BETA-BLOCKER OVERDOSE: a serious toxicological emergency; PROPRANOLOL is particularly dangerous. PRESENTATION — typically within 1-3 hours of ingestion (sustained-release preparations later, up to 12-24h): bradycardia, hypotension, AV block, cardiogenic shock; CNS — drowsiness, coma, seizures (propranolol); bronchospasm; HYPOGLYCAEMIA (especially in children, fasting, diabetics). Sometimes hard to differentiate clinically — treat both possibilities.\n\n(A) Adrenaline alone insufficient for refractory severe BB overdose; beta-receptor saturation by overdose limits response.\n\n(C) Activated charcoal alone is supportive — won't address established cardiotoxicity.\n\n(D) Bicarbonate + beta-agonist alone — doesn't bypass beta-receptor like glucagon / HIET.\n\n(E) Beta-agonist alone — ineffective at saturated beta-receptors.\n\n💎 PEARL: Beta-blocker overdose: bradycardia + hypotension + bronchospasm ± hypoglycaemia ± seizure (propranolol). After failed atropine: HIGH-DOSE GLUCAGON (5–10 mg bolus then infusion) — bypasses the beta-receptor. Add HIGH-DOSE INSULIN-EUGLYCAEMIA THERAPY + vasopressors. Lipid emulsion for lipid-soluble agents. ECMO for refractory.",
   references:[{label:"TOXBASE — Beta-blockers", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Calcium-channel blocker overdose",
   stem:"A 70-year-old woman with hypertension takes an overdose of amlodipine (~30 tablets, 10 mg each — estimated 300 mg) and presents 6 hours later. Profound hypotension (BP 70/38), HR 56 (relatively bradycardic for her shock state — atypical, would expect tachycardia), hyperglycaemia (glucose 14.5 — characteristic of CCB toxicity), lactic acidosis (lactate 6.2, pH 7.18). She has not responded to 3 L IV crystalloid or atropine 3 mg total. Liver and renal function normal pre-overdose.\n\nWhich is the most appropriate management?",
   options:["IV calcium gluconate / chloride boluses, high-dose insulin–euglycaemia therapy as primary inotrope, vasopressors, lipid emulsion","Sodium bicarbonate alone","IV beta-blocker (esmolol)","Aspirin","Naloxone"],
   correct:"A",
   explanation:"CALCIUM-CHANNEL BLOCKER (CCB) OVERDOSE: an increasingly common toxicological emergency; AMONG MOST LETHAL of common drug overdoses (high mortality, especially with non-DHP CCBs). \n\nPRESENTATION: typically 1-3 hours after ingestion (longer with sustained-release: amlodipine peak effects 24h post-ingestion — DELAYED toxicity, monitor at least 24h). SEIZURES uncommon (vs propranolol). MANAGEMENT — TIME-CRITICAL: (1) ABCDE, IV access, continuous monitoring, ICU. Onset of effect 30-60 min — patience needed. (6) IV LIPID EMULSION (Intralipid 20%) — for highly LIPID-SOLUBLE CCBs (verapamil, dihydropyridines especially amlodipine); 1.5 mL/kg bolus over 1 min, then 0.25 mL/kg/min infusion; reserved for severe / refractory disease.\n\n(B) Bicarbonate alone: useful for QRS widening; not enough for refractory shock.\n\n(C) Beta-blocker would WORSEN — patient already in shock.\n\n(D) Aspirin no role.\n\n(E) Naloxone for opioid OD.\n\n💎 PEARL: CCB overdose: hypotension + relative bradycardia + HYPERGLYCAEMIA (insulin secretion blocked — distinguishes from beta-blocker) + lactic acidosis. IV calcium gluconate + HIGH-DOSE INSULIN-EUGLYCAEMIA THERAPY (1 U/kg bolus + 1 U/kg/h with dextrose) — primary inotrope. Vasopressors. Lipid emulsion for lipid-soluble agents. Sustained-release: monitor 24 h.",
   references:[{label:"TOXBASE — Calcium Channel Blockers", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Salicylate (aspirin) poisoning",
   stem:"A 45-year-old man with depression took 60 aspirin tablets (estimated 18 g) 6 hours ago. He presents with tinnitus, deafness, sweating, nausea / vomiting, hyperpnoea (RR 30, deep breathing — Kussmaul), agitation. ABG: pH 7.32 (mild acidosis — early respiratory alkalosis now combined with metabolic acidosis), PaCO2 2.4 kPa (low — hyperventilation), HCO3 12 (low), anion gap 22 (raised); salicylate level 750 mg/L (4.0 mmol/L — severe toxicity, threshold >700 mg/L). Glucose 4.2, K+ 3.0 (hypokalaemia), creatinine normal, lactate 3. He is alert (GCS 15) but agitated. Urine output 30 mL/h.\n\nWhich is the most appropriate next step?",
   options:["Activated charcoal only","Aggressive IV fluids, urinary alkalinisation with 1.26% sodium bicarbonate (target urine pH 7.5–8.0), potassium replacement, urgent haemodialysis given level >700 mg/L","Forced acid diuresis","Bicarbonate alone with no urinary monitoring","IV beta-blocker"],
   correct:"B",
   explanation:"SALICYLATE (aspirin) POISONING: a classic toxicological presentation; potentially fatal. \n\nINVESTIGATIONS: SALICYLATE LEVEL — DEONE NOMOGRAM (no longer reliably used); LEVEL itself — therapeutic <300 mg/L; toxic >300; severe toxicity >700 mg/L (>5 mmol/L). MANAGEMENT — STEPWISE: (1) ABCDE: airway protection if reduced GCS, fluid resuscitation. KEY POINT — BLOOD pH should also be alkalotic (>7.45) for shift effect; HYPOKALAEMIA prevents renal alkalinisation (renal H+/K+ exchange — kidneys conserve K+ at expense of acidifying urine); MUST replete potassium aggressively (target K+ >4.0). EXTRIP guidelines support early dialysis.\n\n(A) Activated charcoal alone insufficient for established toxicity at this level.\n\n(C) Forced ACID diuresis is wrong direction — would drive salicylate INTO tissues.\n\n(D) Bicarbonate without monitoring may achieve too high or too low urinary pH; alkalinisation requires active monitoring.\n\n(E) Beta-blocker no role in salicylate toxicity.\n\n💎 PEARL: Salicylate poisoning: tinnitus + hyperventilation + mixed respiratory ALKALOSIS (early) + metabolic acidosis (late) + hypokalaemia. URINARY ALKALINISATION with 1.26% bicarbonate (target urine pH 7.5–8.0) — must REPLACE POTASSIUM aggressively (target K >4) for renal alkalinisation to work. HAEMODIALYSIS for level >700 mg/L, severe acidosis, AKI, altered mental state, or pulmonary oedema.",
   references:[{label:"TOXBASE — Salicylate", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Carbon monoxide poisoning",
   stem:"A young couple is brought to ED from a holiday cottage in winter, having stayed there for 3 days. Both have headache, nausea, dizziness, fatigue and confusion since waking this morning. Both have SpO2 99% on the pulse oximeter (paradoxically normal despite their symptoms). The woman is 24 weeks pregnant. Investigations confirmed by ABG with co-oximetry: cohb 28% (woman), 35% (man — non-pregnant); both have mild metabolic acidosis. Examination: cherry-red lips (classic but unreliable sign), no other findings. Subsequent investigation reveals a faulty gas boiler in the cottage.\n\nWhich is the most appropriate management?",
   options:["100% oxygen via tight-fitting non-rebreather mask; consider hyperbaric oxygen given pregnancy and severe toxicity; environmental health investigation","Salbutamol nebulisers","Naloxone","Aspirin","Sodium bicarbonate"],
   correct:"A",
   explanation:"CARBON MONOXIDE (CO) POISONING: a critical TOXICOLOGICAL EMERGENCY; estimated ~50 deaths and ~4000 attendances annually in UK; significantly UNDER-RECOGNISED ('great mimicker' — vague non-specific symptoms in winter often misdiagnosed as viral illness, depression, fatigue). \n\nPRESENTATION: KEY CLINICAL CLUES — multiple people from same environment with similar non-specific symptoms (this case — couple from holiday cottage); winter / heating season; symptoms IMPROVE when away from environment (workplace, home); exposure to fumes (fire smoke); pets unwell. CHILDREN — higher metabolic rate → more affected. MANAGEMENT — TIME-CRITICAL: (1) ABCDE: REMOVE from CO source IMMEDIATELY; rescuer safety first (don't re-enter without breathing apparatus).\n\n(B) Salbutamol no role in CO poisoning.\n\n(C) Naloxone for opioids.\n\n(D) Aspirin no role.\n\n(E) Bicarbonate not specific therapy.\n\n💎 PEARL: Multiple people from same environment + winter + headache, nausea, dizziness, confusion + improvement away = CO poisoning. Pulse oximetry FALSELY normal (COHb absorbs at oxyHb wavelength). Diagnose with ABG co-oximetry. 100% O₂ via NRB (CO half-life 4–6 h → 60–90 min). Hyperbaric for pregnancy, neuro features, COHb >25%. Watch for delayed neuro sequelae 2–40 days later.",
   references:[{label:"TOXBASE — Carbon Monoxide", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Serotonin syndrome",
   stem:"A 38-year-old man on a long-term SSRI (fluoxetine 40 mg/day for depression) is started on tramadol 50 mg QDS for a leg injury. Within 12 hours he develops agitation, sweating, confusion, fine tremor, ocular clonus (downward jerks visible), hyperreflexia (3+ widely), and inducible lower-limb clonus (sustained, brisk). Examination: T 39.4°C (hyperthermia), HR 128, BP 168/92, mydriasis (dilated pupils), bowel sounds present, mild muscle rigidity (lower limb > upper). No lead-pipe rigidity. CK 4500. Onset within hours of starting tramadol.\n\nWhich is the most appropriate management?",
   options:["Stop all serotonergic drugs, supportive care including aggressive cooling, IV benzodiazepines (lorazepam) for agitation / autonomic instability, cyproheptadine if benzodiazepines insufficient","Continue current medications and monitor","Dantrolene (used in NMS / malignant hyperthermia)","Bromocriptine (used in NMS)","Naloxone"],
   correct:"A",
   explanation:"SEROTONIN SYNDROME (or serotonin TOXICITY): a potentially LIFE-THREATENING condition resulting from excess serotonergic activity, typically from drug interaction or overdose. \n\nINVESTIGATIONS: CK (rhabdomyolysis); FBC (elevated WCC); U&E / creatinine (AKI from rhabdomyolysis); LFTs; coagulation (DIC); ECG; CT head if focal deficit / persistent confusion; toxicology screen if indicated. NO specific lab test for SS. MANAGEMENT — depends on severity: (1) STOP ALL serotonergic drugs — primary.\n\n(B) Continue medications: would worsen / fatal.\n\n(C) Dantrolene: for malignant hyperthermia / NMS, not SS.\n\n(D) Bromocriptine: dopamine agonist — increases SEROTONIN through complex mechanism — would WORSEN.\n\n(E) Naloxone for opioid toxicity, but stopping the opioid is more appropriate.\n\n💎 PEARL: Serotonergic drug + new serotonergic agent (especially tramadol, MAOIs, linezolid) → within HOURS: agitation + hyperreflexia + CLONUS (especially lower-limb, ocular) + hyperthermia + autonomic instability. Stop serotonergic drugs + supportive (cooling, fluids, benzodiazepines). Cyproheptadine for refractory. Distinguishes from NMS by SPEED of onset (hours not days) and CLONUS (vs lead-pipe rigidity).",
   references:[{label:"TOXBASE — Serotonin Syndrome", url:"https://www.toxbase.org/"},{label:"Hunter Serotonin Toxicity Criteria", url:"https://academic.oup.com/qjmed/article/96/9/635/1533773"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Neuroleptic malignant syndrome",
   stem:"A 30-year-old man with treatment-resistant schizophrenia was started on haloperidol 5 mg BD 5 days ago. Over the past 3 days, he has developed progressive: confusion (now obtunded, GCS 11), 'lead-pipe' muscle rigidity (generalised, head-to-toe; resists passive movement throughout range), hyperthermia (T 40.1°C), tachycardia (HR 124), labile BP (148-180/95-110), profuse sweating, urinary incontinence, sialorrhoea (drooling). Reduced bowel sounds. No clonus. Investigations: CK 18,000 (markedly raised — rhabdomyolysis), WCC 16 (leukocytosis), urine myoglobin positive, creatinine 165 (AKI from rhabdomyolysis), LDH raised, mild metabolic acidosis. Lumbar puncture: normal CSF (rules out meningitis / encephalitis).\n\nWhich is the most appropriate management?",
   options:["Stop antipsychotic, ICU admission, aggressive supportive care including cooling and IV fluids, benzodiazepines for agitation, dantrolene or bromocriptine in severe cases","Increase the antipsychotic dose","Cyproheptadine","Aspirin","Beta-blocker alone"],
   correct:"A",
   explanation:"NEUROLEPTIC MALIGNANT SYNDROME (NMS): RARE but POTENTIALLY FATAL idiosyncratic reaction to medications that block CENTRAL DOPAMINE D2 RECEPTORS. DEVELOPS GRADUALLY over 1-3 days (vs serotonin syndrome — within hours), often after starting medication or dose increase. \n\nINVESTIGATIONS: CK (markedly RAISED — typically 10,000+; rhabdomyolysis from rigidity); LEUCOCYTOSIS (modest); LFTs (mildly raised LDH, AST); creatinine (AKI from rhabdomyolysis / dehydration); urine myoglobin; ABG (acidosis); LP and brain imaging often performed to exclude meningitis / encephalitis (typically negative). MANAGEMENT — TIME-CRITICAL: (1) STOP THE OFFENDING DRUG immediately — fundamental. (2) ICU ADMISSION for severe disease.\n\n(B) Increase antipsychotic: would worsen / fatal — opposite intervention.\n\n(C) Cyproheptadine: for serotonin syndrome; would not help NMS.\n\n(D) Aspirin: no role in NMS.\n\n(E) Beta-blocker alone: would not address the underlying mechanism.\n\n💎 PEARL: Antipsychotic (or sudden dopamine agonist withdrawal) + GRADUAL onset over days + 'lead-pipe' rigidity + hyperthermia + autonomic instability + altered mental state + markedly raised CK = NMS. STOP the antipsychotic. ICU + cooling + fluids + benzodiazepines. Dantrolene or bromocriptine for severe cases. Distinguishes from serotonin syndrome by gradual onset and lead-pipe rigidity (not clonus).",
   references:[{label:"TOXBASE — Neuroleptic Malignant Syndrome", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Rifampicin — CYP enzyme induction",
   stem:"A 32-year-old woman is started on standard 6-month TB therapy (rifampicin + isoniazid + pyrazinamide + ethambutol) for active pulmonary disease. She has been taking the combined oral contraceptive pill (Microgynon) for 5 years. She seeks contraception advice — she does not want to become pregnant during her TB treatment. She also takes warfarin for a prior DVT (target INR 2.5) and is anxious about her medication regimen.\n\nWhich is the most appropriate counselling and management?",
   options:["No interaction — continue coc unchanged","Use a non-hormonal contraceptive method (e.g. Copper iud) during and for at least 4 weeks after rifampicin; expect to need higher warfarin doses with INR closely monitored","Increase coc dose only — keep contraception as is","Use progestogen-only pill with no other change","Rifampicin is a CYP inhibitor"],
   correct:"B",
   explanation:"RIFAMPICIN is one of the MOST POTENT CYP450 ENZYME INDUCERS in clinical use — induces multiple CYP isoenzymes (CYP3A4 most importantly, also 2C9, 2C19, 1A2, 2B6) AND P-glycoprotein efflux pump and UGT (uridine glucuronosyltransferase) enzymes; ALSO induces phase 2 metabolism. Onset of induction over ~1-2 WEEKS (gene transcription takes time); persists for ~2-4 WEEKS after stopping (enzyme levels need to fall back). POSTPONE pregnancy planning until after TB treatment course (6 months minimum; rifampicin avoided in pregnancy except in TB management).\n\n(A) No interaction is wrong — major interaction.\n\n(C) Increase COC dose: not reliable for pregnancy prevention; recommendation is non-hormonal method.\n\n(D) Progestogen-only pill — NOT EFFECTIVE with rifampicin (also CYP-metabolised, similar effect).\n\n(E) Rifampicin is the prototype CYP INDUCER, not inhibitor.\n\n💎 PEARL: Rifampicin is a POTENT CYP450 inducer (especially CYP3A4) AND P-glycoprotein inducer. Reduces effectiveness of: COC, warfarin, DOACs, methadone, antiepileptics, ART, ciclosporin, tacrolimus, statins. Use NON-HORMONAL contraception (copper IUD) during AND for 4 weeks after rifampicin. Effect persists 2–4 weeks after stopping. Warfarin: expect higher dose with close INR monitoring.",
   references:[{label:"BNF — Rifampicin (CYP induction)", url:"https://bnf.nice.org.uk/drugs/rifampicin/"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Haemophagocytic lymphohistiocytosis",
   stem:"A 28-year-old man with relapsing fever (5 days, peaking 39.5°C), splenomegaly (4 cm below costal margin), jaundice (bilirubin 95), pancytopenia (Hb 78, WCC 1.8, platelets 45), hypertriglyceridaemia (4.8 mmol/L) and striking hyperferritinaemia (32,000 µg/L — markedly raised) deteriorates over 5 days. EBV PCR positive (viraemia 50,000 copies/mL). He was started on lamotrigine 3 weeks ago for new-onset epilepsy. Soluble CD25 markedly elevated; NK cell function reduced. Fibrinogen 1.2 (low). Meets HLH-2004 criteria (≥5 of 8).\n\nWhich is the most likely diagnosis?",
   options:["Sepsis with multi-organ failure","Haemophagocytic lymphohistiocytosis (secondary, ebv-driven ± lamotrigine dress overlap)","DIC","Iron overload from haemochromatosis","Viral hepatitis"],
   correct:"B",
   explanation:"HAEMOPHAGOCYTIC LYMPHOHISTIOCYTOSIS (HLH): rare but life-threatening hyperinflammatory syndrome characterised by uncontrolled activation of macrophages and T-cells with cytokine storm and multi-organ failure. \n\nPRESENTATION: prolonged FEVER (essentially universal); SPLENOMEGALY (often substantial); CYTOPENIAS (multilineage); HEPATIC dysfunction (jaundice, transaminitis, hepatomegaly, coagulopathy — ferritin sky-high, fibrinogen LOW); CNS — encephalopathy, seizures (~30%); RASH; lymphadenopathy. MANAGEMENT — URGENT specialist haematology / HLH-experienced centre input: (1) TREAT THE TRIGGER aggressively — antiviral (rituximab for EBV-driven), anti-malarial (leishmaniasis), anti-bacterial / fungal as indicated; STOP suspected drug; treat underlying malignancy; immunosuppression for MAS / autoimmune flare.\n\n(A) Sepsis alone doesn't account for the haemophagocytosis on biopsy or extreme ferritin.\n\n(C) DIC: coagulopathy + haemorrhage prominent, but DIC alone doesn't meet HLH-2004 criteria with bone marrow haemophagocytosis.\n\n(D) Iron overload: chronic transfusions / haemochromatosis; liver / cardiac iron deposition not acute systemic.\n\n(E) Viral hepatitis: prominent ALT / AST elevation, focused on liver, doesn't explain pancytopenia / haemophagocytosis.\n\n💎 PEARL: Persistent fever + splenomegaly + cytopenias (≥2 lineages) + hypertriglyceridaemia + LOW fibrinogen + STRIKING HYPERFERRITINAEMIA (>10,000 highly suggestive) + haemophagocytosis on marrow + raised soluble IL-2R = HLH. HLH-2004 criteria. Treat the trigger AND immunosuppress (HLH-94 protocol — etoposide, dexamethasone). Mortality high; specialist haematology centre.",
   references:[{label:"HLH-2004 Diagnostic Criteria (Pediatr Blood Cancer 2007)", url:"https://onlinelibrary.wiley.com/doi/10.1002/pbc.21039"},{label:"BSH HLH Guideline", url:"https://b-s-h.org.uk/guidelines/"}]},

  {section:"haem_onc", specialty:"Oncology", topic:"Superior vena cava obstruction",
   stem:"A 60-year-old man (40 pack-year smoker) with recently diagnosed bulky right hilar mass on CXR (likely small cell lung cancer pending biopsy) presents to ED with progressive facial and upper-limb swelling, distended neck and chest-wall veins (pemberton's sign positive — facial plethora when arms raised), headache (worse on lying flat), breathlessness, and stridor at rest. He is anxious, sitting upright, RR 28, SpO₂ 92% on air. Examination: facial / upper-limb oedema, dilated chest-wall collateral veins, conjunctival injection, no focal neurology. CT thorax with contrast: bulky right hilar mass with subcarinal nodes encasing the SVC and proximal trachea; SVC luminal diameter <30%; airway compromised. No tissue diagnosis yet.\n\nWhich is the most appropriate immediate management?",
   options:["Routine outpatient management — schedule diagnostic biopsy","Sit upright, oxygen, urgent SVC stenting via interventional radiology, dexamethasone, then tissue diagnosis and chemo/radiotherapy","Aspirin","IV diuretics alone","No intervention — palliative only"],
   correct:"B",
   explanation:"SUPERIOR VENA CAVA OBSTRUCTION (SVCO): mechanical obstruction or compression of the superior vena cava → impaired venous drainage from head, neck, upper limbs, upper thorax. \n\nPRESENTATION: PROGRESSIVE FACIAL / UPPER-LIMB SWELLING (often acutely worse on lying down — postural pattern); FACIAL PLETHORA, conjunctival injection; DILATED CHEST-WALL COLLATERAL VEINS (chronic SVCO); cough, dyspnoea, ORTHOPNOEA; HEADACHE — worse on lying down (cerebral venous hypertension); HOARSENESS (recurrent laryngeal nerve compression — also Horner's, brachial plexus from Pancoast tumour); STRIDOR (airway compromise — emergency); CYANOSIS, conjunctival oedema; SEIZURES / focal neurological signs / drowsiness (cerebral oedema — emergency). (3) DEFINITIVE TREATMENT options: A. B.\n\n(A) Routine outpatient with airway compromise is unsafe.\n\n(C) Aspirin doesn't address mechanical obstruction.\n\n(D) Diuretics alone won't address mass effect; risk hypotension.\n\n(E) Palliative without intervention denies effective treatment options.\n\n💎 PEARL: Mediastinal malignancy + progressive facial/upper-limb swelling + dilated chest-wall collateral veins + Pemberton's sign + headache worse on lying flat ± stridor (emergency) = SVCO. Sit upright + oxygen + URGENT SVC STENTING via interventional radiology + dexamethasone. Tissue diagnosis BEFORE chemotherapy where possible (chemo-sensitive tumours = SCLC, lymphoma).",
   references:[{label:"NICE Cancer Pathways — SVC Obstruction", url:"https://www.nice.org.uk/"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Sickle cell vaso-occlusive crisis",
   stem:"A 22-year-old man with known HbSS sickle cell disease (homozygous, regular outpatient follow-up; characteristic blood film appearance — see image) presents to ED with 6 hours of severe back, chest and limb pain (similar to previous painful crises but worse). Pain score 9/10. Triggered by recent dehydration / cold exposure / minor urti. Examination: appears in significant pain but alert, no focal neurology, afebrile, no respiratory symptoms, normal chest examination, SpO₂ 96% on air. Investigations: Hb 75 g/L (baseline 80), reticulocytes 8%, no leukocytosis, lactate normal, urinalysis clear, normal CXR. He is on regular hydroxycarbamide 1 g daily and folic acid; lifelong penicillin V; up-to-date vaccinations. Adequate analgesia not yet given.\n\nWhich is the most appropriate immediate management?",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sickle_Cell_Blood_Smear.JPG",
   imageAlt:"Peripheral blood film in HbSS sickle cell disease showing classic crescent / sickle-shaped erythrocytes",
   options:["Adequate analgesia (often opioids — morphine titrated to effect within 30 min), hydration, oxygen if hypoxic, treat any precipitant, vigilance for acute chest syndrome","Iron supplementation","Aspirin alone","Withhold analgesia until pain settles spontaneously","Therapeutic venesection"],
   correct:"A",
   explanation:"SICKLE CELL DISEASE: autosomal recessive haemoglobinopathy due to point mutation in beta-globin chain (HbS = β6 Glu→Val). MANAGEMENT — VASO-OCCLUSIVE CRISIS (NICE NG143; British Society of Haematology 2018): (1) RAPID PAIN ASSESSMENT and TREATMENT — within 30 MINUTES of arrival in ED (NICE quality standard); pain score; opioids first-line for severe crisis: STRONG OPIOIDS — morphine titrated IV / SC (5-10 mg starting, repeat every 20 min PRN), PCA when stabilised; PETHIDINE AVOIDED (seizure risk from norpethidine accumulation, less effective); paracetamol + NSAID adjunct (caution renal).\n\n(B) Iron supplementation INAPPROPRIATE — these patients have iron overload from haemolysis / transfusion; iron worsens.\n\n(C) Aspirin alone inadequate.\n\n(D) Withholding analgesia is harmful and unethical — KEY teaching point: sickle pain is undertreated due to misperception of opioid-seeking behaviour; pain must be treated promptly and adequately.\n\n(E) Therapeutic venesection: not for sickle crisis (would worsen anaemia); EXCHANGE transfusion is indicated for ACS / stroke.\n\n💎 PEARL: Sickle vaso-occlusive crisis: ANALGESIA WITHIN 30 MINUTES (NICE quality standard) — strong opioids titrated to effect (morphine, NOT pethidine — seizure risk from norpethidine). Hydration + oxygen if hypoxic + treat precipitant. Vigilance for ACUTE CHEST SYNDROME (new infiltrate + respiratory symptoms) — emergency, may need exchange transfusion.",
   references:[{label:"NICE NG143 — Sickle cell disease: managing acute painful episode", url:"https://www.nice.org.uk/guidance/ng143"},{label:"BSH Sickle Cell Acute Painful Episode Guideline (2018)", url:"https://b-s-h.org.uk/guidelines/"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Hospital VTE prophylaxis",
   stem:"A 72-year-old man is admitted to AMU with severe community-acquired pneumonia (CURB-65 = 3) requiring IV antibiotics, oxygen and bed-rest. Expected length of stay >5 days. He is currently immobile, weight 80 kg, eGFR 50 (CKD3). No active bleeding (no recent surgery, no GI bleed, no intracranial pathology); platelets 220, normal INR. Padua VTE risk score 6 (high — pneumonia + age >70 + immobility + acute infection); HAS-BLED bleeding risk low. Mechanical and pharmacological prophylaxis both available.\n\nWhich is the most appropriate prophylaxis?",
   options:["No prophylaxis — natural mobility","Pharmacological VTE prophylaxis with LMWH (e.g. Enoxaparin 40 mg SC daily, dose-adjusted), reviewed daily, with mechanical prophylaxis if bleeding risk emerges","Aspirin 75 mg daily","DOAC (off-licence routine prophylaxis)","Warfarin"],
   correct:"B",
   explanation:"VENOUS THROMBOEMBOLISM (VTE) PROPHYLAXIS in HOSPITAL: a NICE QUALITY STANDARD and CQC priority — failure to risk-assess every adult inpatient within 24 hours of admission is a NEVER EVENT. PHARMACOLOGICAL OPTIONS: LMWH FIRST-LINE — ENOXAPARIN 40 mg SC daily (or 20 mg if eGFR <30); DALTEPARIN 5000 IU SC daily; tinzaparin alternatives. Renal dose adjustment: ENOXAPARIN — 30 mg if eGFR <30; consider unfractionated heparin in severe renal failure. FONDAPARINUX 2.5 mg SC daily — alternative; in HIT or LMWH-allergic. TRAVEL VTE — long-haul flight >4-8 hours; lifestyle measures, compression stockings, LMWH for highest risk.\n\n(A) No prophylaxis high-risk medical inpatient = significant preventable morbidity / mortality risk.\n\n(C) Aspirin not first-line for medical inpatients.\n\n(D) DOAC not licensed for routine medical prophylaxis.\n\n(E) Warfarin not used for prophylaxis (slow onset; impractical).\n\n💎 PEARL: Hospital VTE prophylaxis: failure to risk-assess every adult inpatient within 24 h of admission is a NEVER EVENT. Acute medical admission + high VTE risk + low bleeding risk: LMWH (enoxaparin 40 mg SC daily — reduce to 20 mg if eGFR <30). Add mechanical prophylaxis if bleeding risk. Daily review.",
   references:[{label:"NICE NG89 — Venous thromboembolism in over 16s: reducing the risk of HA-VTE (2018)", url:"https://www.nice.org.uk/guidance/ng89"}]},

  {section:"haem_onc", specialty:"Haematology", topic:"Acute promyelocytic leukaemia",
   stem:"A 45-year-old man presents with 2 weeks of fatigue, easy bruising (extensive ecchymoses), low-grade fever (38.0°C), and gum bleeding. Investigations: Hb 80 (anaemia), WCC 80 × 10⁹/L (markedly raised, with circulating blasts — 80% blast count on film), platelets 22 (severe thrombocytopenia). Coagulation: PT 18 s (prolonged), APTT 45 s (prolonged), fibrinogen 1.0 (low), d-dimer markedly raised (15,000 — DIC pattern). Film: many promyelocytes with bundles of auer rods ('faggot cells' — pathognomonic).\n\nWhich is the most appropriate immediate management?",
   options:["Standard 7+3 AML chemotherapy alone","Start ATRA (all-trans retinoic acid) on suspicion before cytogenetic confirmation, with arsenic trioxide / chemotherapy and aggressive blood-product support","No treatment","Imatinib","Stem cell transplant immediately"],
   correct:"B",
   explanation:"ACUTE PROMYELOCYTIC LEUKAEMIA (APL) — 'AML M3' in the older FAB classification: a distinct subtype of acute myeloid leukaemia with unique pathophysiology, complications, and treatment. CYTOGENETICS — t(15;17)(q22;q21) translocation results in PML-RARα fusion protein (PROMYELOCYTIC LEUKAEMIA gene fused with RETINOIC ACID RECEPTOR alpha); rare variants — t(11;17), t(5;17). \n\nPRESENTATION: fatigue (anaemia), bleeding (mucosal, ecchymoses, GI, intracranial — DIC; petechiae from thrombocytopenia), infections (neutropenia despite high WCC), thrombosis (paradoxically — DIC also causes thrombosis), bone pain. \n\nDIAGNOSIS: morphology + immunophenotype (MPO+, CD13+, CD33+, CD34-, HLA-DR-, CD117+); CYTOGENETICS — t(15;17); FISH for PML-RARα; RT-PCR — rapid (24-h turnaround) for treatment decisions.\n\n(A) Standard 7+3 chemotherapy alone risks worsening DIC; ATRA is essential.\n\n(C) No treatment is uniformly fatal.\n\n(D) Imatinib treats CML (BCR-ABL), not APL.\n\n(E) SCT not first-line; reserved for relapse / refractory.\n\n💎 PEARL: Suspected APL (DIC + Auer rods or 'faggot cells' + hypergranular promyelocytes): START ATRA IMMEDIATELY on suspicion BEFORE cytogenetic confirmation — early DIC bleeding (especially intracranial) is the major killer in untreated APL. Combine with arsenic trioxide ± chemo. Aggressive blood-product support (fibrinogen >1.5, platelets >50). Watch for differentiation syndrome.",
   references:[{label:"BSH Acute Leukaemia Guidelines", url:"https://b-s-h.org.uk/guidelines/"},{label:"ELN Recommendations 2022 (AML)", url:"https://ashpublications.org/blood/article/140/12/1345/485842"}]},

  {section:"haem_onc", specialty:"Palliative Medicine", topic:"Breakthrough opioid dosing",
   stem:"A 65-year-old man with metastatic prostate cancer (bony metastases) is on regular oral morphine modified-release 60 mg twice daily (oral morphine total dose = 120 mg / 24 h). He is having recurrent episodes of breakthrough pain (incident, on movement, also unprovoked breakthrough) ~3 times per day, severity 7/10, lasting 30 minutes; his current PRN dose of 5 mg immediate-release morphine is providing inadequate relief. Renal function normal (eGFR 75); LFTs normal; constipation already managed with macrogol; antiemetic in place. He has good cognitive function and asks about an appropriate breakthrough dose. What is the correct calculated breakthrough dose?",
   options:["10 mg oral morphine immediate-release","20 mg oral morphine immediate-release (1/6 of total daily dose: 120 ÷ 6 = 20 mg)","60 mg oral morphine immediate-release","30 mg oral morphine immediate-release","No breakthrough dose needed"],
   correct:"B",
   explanation:"OPIOID PRESCRIBING in CANCER PAIN — based on WHO ANALGESIC LADDER and good practice (NICE NG140, BPS, ESMO, NCCN guidance): WHO LADDER: STEP 1 — non-opioid (paracetamol, NSAID) ± adjuvant;\n\nSTEP 2 — weak opioid (codeine, dihydrocodeine, low-dose tramadol) ± non-opioid ± adjuvant;\n\nSTEP 3 — strong opioid (morphine first-line, oxycodone, fentanyl, methadone, buprenorphine) ± non-opioid ± adjuvant. PRINCIPLES of OPIOID PRESCRIBING: (1) START LOW — 5 mg immediate-release morphine 4-hourly (or 10 mg if previously on weak opioid). (2) TITRATE based on response and side effects every 24 hours.\n\n(A) 10 mg is too small (1/12 of total — under-dose).\n\n(C) 60 mg is too high — would equal half the regular MR dose; risks toxicity.\n\n(D) 30 mg is closer but doesn't follow 1/6 rule exactly.\n\n(E) 'No breakthrough' contradicts every guideline.\n\n💎 PEARL: Breakthrough opioid dose = 1/6 to 1/10 of total daily oral morphine equivalent (NICE NG140 — 1/6 most common). 120 mg/day total → 20 mg oral morphine immediate-release PRN. For incident pain: pre-emptive dose ~30 min before activity. Recurrent breakthrough → increase the background dose.",
   references:[{label:"BNF — Prescribing in palliative care", url:"https://bnf.nice.org.uk/"},{label:"Palliative Adult Network Guidelines", url:"https://book.pallcare.info/"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"CO poisoning — pulse oximetry pitfall",
   stem:"A family of four (mother, father, two children aged 8 and 12) are brought to ED in midwinter complaining of headache, nausea, dizziness, and confusion since waking that morning. They live in a house with a faulty gas heater (they had been worried about it for weeks). Pulse oximetry on all four family members reads 99% on air (apparently normal despite their symptoms). ABG with co-oximetry: cohb 32% (mother — index patient), 28% (father), 30% (10-year-old), 35% (8-year-old). Mild metabolic acidosis on ABG (pH 7.35).\n\nWhich is the most appropriate next step?",
   options:["Trust the pulse oximetry — discharge as viral illness","Recognise pulse oximetry is unreliable in CO poisoning, treat with 100% oxygen via non-rebreather, consider hyperbaric oxygen, and notify environmental health for source investigation","SpO2 alone is sufficient assessment — no further workup needed","Empirical antibiotics for viral illness","Aspirin for headache"],
   correct:"B",
   explanation:"CARBON MONOXIDE (CO) POISONING — KEY DIAGNOSTIC PITFALL: STANDARD PULSE OXIMETRY IS COMPLETELY UNRELIABLE in CO poisoning. \n\nMANAGEMENT: (1) REMOVE from CO source. (2) IMMEDIATE 100% O2 via TIGHT-FITTING NON-REBREATHER MASK with reservoir (FLOW ≥15 L/min) — for ALL suspected / confirmed cases; reduces CO half-life from 4-6 hours (room air) to ~60-90 minutes; CONTINUE until COHb <3% AND symptomatic resolution (typically 6-12 hours). (5) DELAYED NEUROLOGICAL SEQUELAE (DNS) — 10-40% of moderate-severe; cognitive impairment, parkinsonism, dystonia; 2-40 days post-exposure; warn patient, follow-up.\n\n(A) Trust pulse oximetry: CRITICAL ERROR — pulse oximetry FALSELY normal in CO poisoning.\n\n(C) SpO2 alone is INSUFFICIENT — diagnosis requires co-oximetry.\n\n(D) Empirical antibiotics: misses diagnosis; viral illness wouldn't cause acute family cluster.\n\n(E) Aspirin for headache: misses the diagnosis.\n\n💎 PEARL: Standard pulse oximetry is COMPLETELY UNRELIABLE in CO poisoning — COHb absorbs at the same wavelength as oxyHb, falsely reading 99–100% even with severe toxicity. Diagnose with ABG co-oximetry. 100% O₂ via NRB. Hyperbaric for pregnancy, neuro features, COHb >25%. Source investigation (environmental health). Watch for delayed neurological sequelae 2–40 days post-exposure.",
   references:[{label:"TOXBASE — Carbon Monoxide", url:"https://www.toxbase.org/"},{label:"UDIS / Public Health UK CO Poisoning Guidance", url:"https://www.gov.uk/government/publications/carbon-monoxide-public-health-information"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Pregnancy and anticoagulation — mechanical valve",
   stem:"A 32-year-old woman with a mechanical mitral valve (St Jude bileaflet, replaced age 25 for severe rheumatic mitral stenosis) on warfarin (target INR 3.0; current dose 7 mg daily; INRs stable) is now planning pregnancy (trying to conceive). She has no other significant medical history (no APS, no thrombophilia). Pre-pregnancy assessment: ECG normal, echo confirms well-functioning prosthesis, no atrial dilation, normal LV function. She seeks counselling about her anticoagulation strategy during pregnancy.\n\nWhich is the most appropriate counselling and management?",
   options:["Continue warfarin throughout pregnancy without modification","Multidisciplinary specialist input (cardiology + haematology + obstetrics); discuss risks and dose-dependent options — high-dose LMWH throughout, or LMWH first trimester then warfarin to 36 weeks then LMWH; avoid DOACs","Switch to a direct oral anticoagulant (DOAC) routinely","Aspirin alone","Stop all anticoagulation during pregnancy"],
   correct:"B",
   explanation:"PREGNANCY in WOMEN with MECHANICAL HEART VALVES: HIGH-RISK pregnancy with major maternal and foetal morbidity / mortality; requires MULTIDISCIPLINARY pre-pregnancy COUNSELLING and detailed antenatal management. STRATEGIES (ESC guideline 2018, RCOG / Task Force, UK practice): (1) HIGH-DOSE LMWH THROUGHOUT pregnancy with anti-Xa MONITORING (target peak 4-6 hours post-dose 0.8-1.2 IU/mL for mitral, 0.6-1.0 IU/mL for aortic; trough >0.6 IU/mL): SAFER for foetus; less effective for valve, requires close monitoring; CRITICAL — anti-Xa monitoring must be PEAK and TROUGH levels (NOT random levels); BD dosing typically.\n\n(A) Continue warfarin without modification: ignores embryopathy risk; not standard.\n\n(C) DOAC routinely: CONTRAINDICATED in pregnancy.\n\n(D) Aspirin alone: INADEQUATE for mechanical valve thrombo-prophylaxis — major valve thrombosis.\n\n(E) Stop anticoagulation: maternal valve thrombosis / death risk — never appropriate in mechanical valve.\n\n💎 PEARL: Mechanical heart valve + pregnancy = HIGH-RISK pregnancy. Multidisciplinary (cardiology + haematology + obstetrics). Options: high-dose LMWH throughout with anti-Xa monitoring; LMWH 1st trimester then warfarin to 36 weeks then LMWH; warfarin throughout (best for valve, worst for fetus). DOACs CONTRAINDICATED. Avoid warfarin >5 mg/day in 1st trimester (teratogenic).",
   references:[{label:"RCOG Green-top Guideline 37a — Reducing VTE Risk in Pregnancy (2015)", url:"https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/reducing-the-risk-of-venous-thromboembolism-during-pregnancy-and-the-puerperium-green-top-guideline-no-37a/"},{label:"ESC 2018 Cardiovascular Diseases in Pregnancy Guidelines", url:"https://academic.oup.com/eurheartj/article/39/34/3165/5078465"}]},

  {section:"pharm_tox", specialty:"Toxicology", topic:"Iron overdose — chelation therapy",
   stem:"A 45-year-old woman is brought to ED 4 hours after a deliberate ingestion of approximately 60 ferrous sulfate 200 mg tablets (each contains 65 mg elemental iron; estimated total ~3.9 g elemental, ~55 mg/kg in a 70 kg adult — significant overdose). She has had repeated vomiting (one with fresh blood), profuse diarrhoea, severe abdominal pain. Now drowsy (GCS 13), hypotensive (BP 88/54), tachycardic (HR 130), with metabolic acidosis (pH 7.22, lactate 5.8). Investigations: serum iron 110 µmol/L at 4 hours (markedly raised — peak >90 µmol/L predicts severe toxicity), ALT 250 (rising — early hepatotoxicity), INR 1.8, glucose 13 (stress hyperglycaemia). AXR: radio-opaque tablets visible in stomach.\n\nWhich is the most appropriate management?",
   options:["Activated charcoal as first-line","IV desferrioxamine (deferoxamine) chelation, aggressive supportive care, whole-bowel irrigation if undissolved tablets visible, ICU admission","Aspirin","No specific treatment, observe","IV bicarbonate alone"],
   correct:"B",
   explanation:"IRON OVERDOSE / TOXICITY: a serious but often UNDER-RECOGNISED poisoning, particularly in children and in adults with deliberate self-harm. \n\nINVESTIGATIONS: SERUM IRON at 4-6 hours (peak — earlier may be misleading as still absorbing); FBC (anaemia), INR, U&E (AKI), LFTs (hepatitis), VBG (acidosis, lactate), glucose (initially raised, later hypoglycaemia), AXR. MANAGEMENT — supportive plus chelation: (1) ABCDE — airway, oxygen, IV access, fluid resuscitation (often required in significant volumes — third-space loss, vomiting, diarrhoea, shock); ICU admission for severe cases. CHRONIC iron toxicity.\n\n(A) Activated charcoal does NOT bind iron — common error.\n\n(C) Aspirin no role and worsens GI bleeding.\n\n(D) No treatment risks fatal multi-organ failure.\n\n(E) Bicarbonate alone treats acidosis symptomatically but not the underlying iron toxicity.\n\n💎 PEARL: Iron overdose stages: GI (vomiting, bleeding) → latent → shock + metabolic acidosis + multi-organ failure → hepatotoxicity → late strictures. Serum iron at 4–6 hours (peak — earlier is misleading). IV DESFERRIOXAMINE chelation for severe toxicity (level >90 µmol/L, severe symptoms, metabolic acidosis). Whole-bowel irrigation if undissolved tablets visible on AXR. Activated charcoal does NOT bind iron.",
   references:[{label:"TOXBASE — Iron", url:"https://www.toxbase.org/"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Yellow Card Scheme — adverse drug reaction reporting",
   stem:"A 45-year-old woman started a newly licensed biologic agent (black triangle ▼ medication — under additional MHRA monitoring) for severe psoriasis 3 weeks ago. She now develops a severe rash (extensive maculopapular eruption with mucosal involvement — concerning for SJS / ten spectrum), jaundice, and biochemical hepatitis (ALT 850, bilirubin 80, ALP raised). The dermatology and hepatology teams are convinced this is a drug-induced reaction. The biologic has been stopped, supportive care started, and she is admitted for monitoring and treatment.\n\nWhich is the most appropriate next administrative step regarding this adverse drug reaction?",
   options:["Take no action — the team are managing it clinically","Report the suspected adr to the MHRA via the yellow card scheme (online, app, or paper) — for black-triangle drugs all suspected adrs (including minor) must be reported","Inform only the patient verbally","Document only in the case notes — no formal report needed","Avoid future use of the drug class without further investigation"],
   correct:"B",
   explanation:"YELLOW CARD SCHEME (YCS): the United Kingdom's voluntary, post-marketing PHARMACOVIGILANCE system, established 1964. Run by the MHRA (Medicines and Healthcare products Regulatory Agency) and the Commission on Human Medicines. Report submission free, confidential, easy. WHAT TO REPORT: (1) BLACK TRIANGLE (▼) medications — newer drugs / vaccines / biologics under ADDITIONAL SURVEILLANCE for typically 5 years post-licensing — ALL SUSPECTED ADRs must be reported, however minor (this patient — biologic on black-triangle list, severe ADR). Black-triangle status is denoted on packaging, BNF, EMC, MHRA Drug Safety Update. MHRA targets: acknowledgment within 5 days; investigation by Pharmacovigilance Risk Assessment Committee.\n\n(A) No action would deprive future patients of safety information about this drug.\n\n(C) Patient communication is essential but separate from MHRA reporting.\n\n(D) Documentation in notes is necessary but does NOT substitute for formal Yellow Card reporting.\n\n(E) Avoiding future drug class use is appropriate clinically but doesn't fulfil pharmacovigilance reporting duty.\n\n💎 PEARL: Yellow Card Scheme (MHRA): suspected ADRs reported via online/app/paper. ALL suspected ADRs to BLACK TRIANGLE (▼) drugs (newer drugs under additional surveillance — typically 5 years post-licensing) — even minor reactions. For other drugs: serious or unusual ADRs. Reporting is voluntary but a professional duty. Reports inform pharmacovigilance and regulatory action.",
   references:[{label:"MHRA Yellow Card Scheme", url:"https://yellowcard.mhra.gov.uk/"}]},

  {section:"pharm_tox", specialty:"Clinical Pharmacology", topic:"Renal-dose drug adjustment",
   stem:"A 75-year-old man (eGFR 22 ml/min/1.73 m², CKD stage 4) is admitted to AMU with new atrial fibrillation and a urinary tract infection. The team plans to start: (1) gentamicin for the UTI; (2) restart his usual atenolol (renally-cleared); (3) morphine for hip pain; (4) allopurinol (he had a recent gout attack); (5) a DOAC for the new AF. He weighs 68 kg, has no proteinuria, no liver disease.\n\nWhich is the most appropriate prescribing approach?",
   options:["Use standard adult doses for all medications","Adjust each drug for renal function — extend gentamicin interval with TDM, switch atenolol to bisoprolol, switch morphine to oxycodone or alfentanil, start low-dose allopurinol, choose apixaban (avoid dabigatran)","Avoid all medications until eGFR improves","Use standard doses for opioids — they don't need adjustment","Use only one drug at a time"],
   correct:"B",
   explanation:"RENAL DRUG DOSING — fundamental to safe prescribing in CKD / AKI; prescribing errors in renal impairment are a MAJOR cause of preventable harm in hospital. KEY DRUG GROUPS: AMINOGLYCOSIDES (gentamicin, amikacin, tobramycin) — narrow therapeutic index; nephrotoxic AND ototoxic; renally cleared; APPROACH — dose calculated by weight + renal function; duration short (5-7 days max); avoid combination with other nephrotoxins where possible. ALLOPURINOL: hepatic metabolism but active metabolite OXYPURINOL is renally excreted; HIGH DOSES in CKD risk SEVERE CUTANEOUS ADVERSE REACTIONS; START LOW (50-100 mg in eGFR <60), TITRATE UP slowly to control urate without increasing toxicity.\n\n(A) Standard doses risk significant accumulation, toxicity, harm.\n\n(C) Avoiding all medications denies indicated treatment — appropriate doses are the answer.\n\n(D) Opioids absolutely DO need adjustment — significant overdose / respiratory depression risk.\n\n(E) Polypharmacy in CKD is normal — focus on safety not avoidance.\n\n💎 PEARL: Renal-dose drug adjustment: gentamicin (extend interval, TDM, avoid prolonged courses); ATENOLOL (renally cleared, accumulates) → switch to BISOPROLOL; MORPHINE (active metabolites accumulate) → switch to OXYCODONE or ALFENTANIL (dialysis); allopurinol — start LOW (50–100 mg) in eGFR <60; DOACs in CKD: APIXABAN preferred (least renal); AVOID DABIGATRAN if eGFR <30.",
   references:[{label:"Renal Drug Database (UK)", url:"https://renaldrugdatabase.com/"},{label:"BNF — Prescribing in renal impairment", url:"https://bnf.nice.org.uk/"}]},

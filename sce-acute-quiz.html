  {section:"elderly", specialty:"Geriatric Medicine", topic:"Acute subdural haematoma on apixaban",
   stem:"An 84-year-old man on apixaban for AF (cha₂DS₂-vasc 6) has a witnessed minor head injury after a fall from standing 2 hours ago. CT head 6 hours later: hyperdense (bright) crescentic extra-axial collection conforming to the right cerebral surface, no midline shift, no skull fracture, no contusion. He is GCS 15 with no focal neurological deficit. Last apixaban dose 4 hours pre-injury.\n\nWhich is the most appropriate management?",
   options:["Discharge with safety-netting and outpatient follow-up","Admit, reverse anticoagulation, neurosurgical referral, and serial neurological observations","Discharge with antiemetics","Outpatient repeat CT in 48 hours; continue apixaban","Continue apixaban unchanged and observe at home"],
   correct:"B",
   explanation:"SUBDURAL HAEMATOMA on CT — appearance varies with age of blood: ACUTE (<3 days) is HYPERDENSE (bright, density similar to fresh whole blood, +50–100 HU); SUBACUTE (3 days – 3 weeks) is ISODENSE (may be missed — look for asymmetric ventricular size, sulcal effacement, mass effect); CHRONIC (>3 weeks) is HYPODENSE (dark, fluid density). RESTART OF ANTICOAGULATION: typically deferred ~4 WEEKS to 6–8 weeks depending on bleeding pattern, location, comorbidities; restart with shared decision-making weighing thromboembolic vs rebleeding risk; consider DOAC (lower ICH risk than warfarin); for AF, consider LEFT ATRIAL APPENDAGE OCCLUSION (Watchman) if recurrent ICH risk is high.\n\n(A) Discharge of a fresh acute SDH on anticoagulation is unsafe — risk of expansion, deterioration.\n\n(C) Antiemetics alone misses the structural injury.\n\n(D) Outpatient delayed scan is unsafe in acute SDH on DOAC.\n\n(E) Continuing apixaban with active acute haemorrhage exposes the patient to ongoing bleeding.\n\n💎 PEARL: Acute SDH on apixaban (HYPERDENSE crescent on CT) + minor head injury → reverse anticoagulation (andexanet — ANNEXA-4; PCC if not available), neurosurgical referral, serial neuro obs even if GCS 15. Restart anticoagulation typically deferred 4–8 weeks with shared decision-making.",
   references:[{label:"NICE NG41 — Head injury: assessment and early management", url:"https://www.nice.org.uk/guidance/ng232"},{label:"BTNS UK Chronic SDH Trial (Brodbelt et al.)", url:"https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(20)30733-X/fulltext"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Sarcopenia — management",
   stem:"A 78-year-old man has lost 6 kg over the last 6 months without dieting. He has reduced gait speed (0.6 m/s — slow), and weak handgrip (16 kg, well below age-norm; cut-off ~27 kg in men). Dexa-derived appendicular lean mass index is well below the EWGSOP2 cut-off. He has no malignancy on workup, no thyroid dysfunction, no overt malabsorption; B12, vitamin D, and HbA1c are within normal limits. He is on no relevant medications. He lives alone and reports declining activity over the past year.\n\nWhich is the most appropriate management?",
   options:["Long-term oral prednisolone","Multimodal: progressive resistance training, adequate protein intake (1.2 g/kg/day), correct vitamin D if deficient, treat reversible causes, address polypharmacy","Strict bedrest","Anabolic steroids","Sedatives for sleep"],
   correct:"B",
   explanation:"SARCOPENIA: progressive, generalised loss of skeletal muscle MASS and FUNCTION with age — now formally recognised (ICD-10 since 2016) as a disease entity.\n\n(A) Steroids worsen muscle wasting (steroid myopathy).\n\n(C) Bedrest is HARMFUL — accelerates muscle loss (1–5% per day).\n\n(D) Anabolic steroids are not licensed / appropriate.\n\n(E) Sedatives reduce activity, worsen falls — wrong direction.\n\n💎 PEARL: Sarcopenia (low mass + low function) — diagnose with EWGSOP2 (low handgrip, slow gait, low DEXA lean mass). Multimodal management: progressive resistance training (most evidence) + protein 1.2 g/kg/day + vitamin D if deficient. AVOID bedrest — accelerates loss 1–5% per day.",
   references:[{label:"EWGSOP2 European Sarcopenia Definition (Age and Ageing 2019)", url:"https://academic.oup.com/ageing/article/48/1/16/5126243"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Pressure ulcer prevention — high-risk patient",
   stem:"An 85-year-old woman with a severe right MCA stroke (NIHSS 18) is admitted to the AMU. She is bedbound (dense left hemiplegia), doubly incontinent, with very low albumin (22 g/L), BMI 17 (underweight), and reduced mobility for the past 5 days at home prior to admission. Skin examination: blanchable erythema over the sacrum, intact heels. Waterlow score 28 (very high risk).\n\nWhich is the most appropriate prevention strategy?",
   options:["No specific intervention required at this stage","SSKIN bundle — high-specification mattress, regular skin assessment, repositioning every 2–4 hours, incontinence care, nutritional support, heel offloading","Tight-fitting bedsheets to reduce friction","Daily soap and water washing of pressure areas","Strict bedrest with no repositioning to avoid skin shear"],
   correct:"B",
   explanation:"PRESSURE ULCER (DECUBITUS ULCER, 'PRESSURE INJURY'): localised damage to skin and underlying tissue due to PRESSURE, SHEAR, FRICTION over a prominent bony area or related to medical devices. Common in OLDER, IMMOBILE, INCONTINENT, MALNOURISHED patients with reduced sensation.\n\n(A) High Waterlow score MANDATES intervention.\n\n(C) Tight bedsheets increase shear / friction — wrong.\n\n(D) Frequent soap-water washing damages skin barrier.\n\n(E) Bedrest WITHOUT repositioning is the leading cause of pressure damage.\n\n💎 PEARL: Bedbound + incontinent + low albumin + Waterlow ≥20 = high pressure ulcer risk. SSKIN bundle: high-spec mattress, regular Skin assessment, repositioning every 2–4 hours, Keep moving, Incontinence care, Nutrition. Heels are the second commonest site after sacrum — offload them.",
   references:[{label:"NICE CG179 — Pressure ulcers: prevention and management (2014)", url:"https://www.nice.org.uk/guidance/cg179"},{label:"EPUAP/NPIAP/PPPIA Guidelines (2019)", url:"https://internationalguideline.com/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Faecal impaction in an older adult",
   stem:"An 80-year-old care-home resident with mild Alzheimer's dementia has had 5 days without a bowel motion despite encouragement. She is on regular co-codamol (codeine + paracetamol), hyoscine butylbromide (for IBS), amlodipine (HTN), and ferrous sulfate (iron deficiency). She has reduced mobility, limited fluid intake, recently started declining meals. Examination: abdomen mildly distended, mild generalised tenderness, palpable indentable mass in the left iliac fossa. PR examination: hard, impacted stool filling the rectum. New confusion (4at 6/16) over 24 hours.\n\nWhich is the most appropriate management?",
   options:["Manual evacuation only","Glycerol suppository or phosphate enema; once cleared, regular macrogol; review and reduce constipating drugs; ensure hydration and mobilisation","Long-term laxative without lifestyle change","Senna alone","Surgical referral for resection"],
   correct:"B",
   explanation:"CONSTIPATION is HIGHLY PREVALENT in older adults (up to 50% of nursing home residents) and is a LEADING CAUSE of: DELIRIUM ('constipation-induced delirium' is a recognised entity); FALLS (straining, postural / vagal); URINARY RETENTION (bladder compression); OVERFLOW DIARRHOEA / FAECAL INCONTINENCE; abdominal pain; loss of appetite; reduced quality of life. THIS PATIENT HAS FAECAL IMPACTION (palpable rectal stool, abdominal distension) WITH NEW DELIRIUM. For HIGHER (sigmoid / descending) impaction: HIGH-DOSE MACROGOL (Movicol — 8 sachets in 1 L water over 6 hours, repeated up to 3 days; resolves up to 70% of impactions).\n\n(A) Manual evacuation alone is uncomfortable and unnecessary if simple suppository / enema effective.\n\n(C) Long-term laxative without addressing the causes is suboptimal.\n\n(D) Senna alone for impaction without softening is ineffective.\n\n(E) Surgery for routine constipation has no role.\n\n💎 PEARL: Older adult + opioid + reduced mobility + new delirium + distended abdomen + impacted rectum = faecal impaction precipitating delirium. Hard rectal stool: glycerol suppository or phosphate enema first. Then maintenance macrogol, review constipating drugs, hydrate, mobilise.",
   references:[{label:"NICE CG99 — Constipation in children (informs adult)", url:"https://cks.nice.org.uk/topics/constipation/"},{label:"Royal College of Physicians Bowel Care Guidance", url:"https://www.rcplondon.ac.uk/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Stress urinary incontinence — first-line management",
   stem:"A 72-year-old woman has had urinary leakage for 18 months — she leaks small amounts when she coughs, sneezes, laughs, or rises from sitting. She has no urgency, no nocturia, no haematuria. Three children, vaginal deliveries, completed menopause aged 51 (no HRT). Cognition normal. Examination: anterior vaginal wall prolapse (cystocele), positive cough leak test, no atrophic features on exam. Urinalysis clear. Post-void residual 30 mL (normal). She is keen to try non-surgical treatment.\n\nWhich is the most appropriate first-line management?",
   options:["Solifenacin (anticholinergic)","Supervised pelvic floor muscle training for ≥3 months","Mirabegron (beta-3 agonist)","Long-term indwelling urinary catheter","Reassurance — no treatment available"],
   correct:"B",
   explanation:"URINARY INCONTINENCE — types and approach (NICE NG123 / Cochrane reviews): (1) STRESS — leakage on raised intra-abdominal pressure (cough, laugh, sneeze, exercise); urethral sphincter / pelvic floor weakness (multiparity, obesity, ageing, post-menopausal oestrogen deficiency, prior pelvic surgery, neurological);\n(2) URGE / OAB — sudden compelling urgency, often with frequency and nocturia; detrusor overactivity;\n(3) MIXED — both (most common in older women);\n(4) OVERFLOW — chronic retention with overflow leakage (post-void residual >150 mL); BPH, neurogenic bladder, anticholinergic medications;\n(5) FUNCTIONAL — physical / cognitive impairment preventing timely toileting (mobility issues, dementia, environment).\n\n(A) Anticholinergics treat URGE incontinence — wrong for stress; risk of anticholinergic burden.\n\n(C) Mirabegron is for urge incontinence.\n\n(D) Indwelling catheter is invasive, infection risk, last resort for retention.\n\n(E) Effective treatments exist.\n\n💎 PEARL: Stress incontinence first-line: SUPERVISED pelvic floor muscle training for ≥3 months (NICE NG123). Surgery (mid-urethral sling, colposuspension, autologous sling) only after PFMT failure. Vaginal mesh slings withdrawn from routine NHS use 2018 — counsel accordingly.",
   references:[{label:"NICE NG123 — Urinary incontinence and pelvic organ prolapse in women (2019)", url:"https://www.nice.org.uk/guidance/ng123"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Vasovagal syncope — diagnosis",
   stem:"A 78-year-old woman attends the same-day emergency clinic after a witnessed faint while standing in a queue at the supermarket on a hot day. There was a typical prodrome of nausea, sweating, light-headedness, and pallor for 30 seconds, followed by a brief loss of consciousness lasting <30 seconds with rapid full recovery (alert immediately upon awakening, no confusion, no incontinence, no tongue biting). She has had two similar episodes over the past 2 years (both warm crowded environments). ECG normal sinus rhythm; echocardiogram normal; orthostatic blood pressures (1 and 3 minutes) all normal. No family history of sudden cardiac death.\n\nWhich is the most likely diagnosis?",
   options:["Vasovagal (reflex) syncope","Cardiac syncope from undiagnosed arrhythmia","Severe orthostatic hypotension","Generalised tonic-clonic seizure","Transient ischaemic attack"],
   correct:"A",
   explanation:"SYNCOPE: transient loss of consciousness due to global cerebral hypoperfusion, with rapid onset, brief duration, and spontaneous COMPLETE recovery. CARDIAC SYNCOPE RED FLAGS — seek urgently: NO PRODROME; EXERTIONAL syncope (severe AS, HOCM, ARVC); SUDDEN UNHERALDED LOC; structural heart disease known; abnormal ECG (especially long QT >500 ms, Brugada pattern, sinus pause >3 sec, complete heart block, sustained VT); FAMILY HISTORY of sudden cardiac death <40 years (channelopathies, HOCM, ARVC).\n\n(B) Cardiac syncope: lacks prodrome, exertional, family history, abnormal ECG — none here.\n\n(C) Severe orthostatic: postural BPs were normal.\n\n(D) Seizure: post-ictal confusion, tongue bite, incontinence — none here.\n\n(E) TIA: focal neurological deficit — none described.\n\n💎 PEARL: Typical prodrome (nausea, sweating, light-headed, pallor) + warm crowded environment + brief LOC + rapid full recovery + normal ECG = vasovagal syncope. Cardiac syncope red flags: NO prodrome, EXERTIONAL, family history of sudden cardiac death <40, abnormal ECG (long QT, Brugada, complete heart block).",
   references:[{label:"ESC 2018 Syncope Guidelines", url:"https://academic.oup.com/eurheartj/article/39/21/1883/4939241"},{label:"NICE CG109 — Transient loss of consciousness", url:"https://www.nice.org.uk/guidance/cg109"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Bone protection in older men post-fracture",
   stem:"An 82-year-old man has had a left intertrochanteric fragility hip fracture surgically managed 5 days ago. He had a previous T7 vertebral fragility fracture aged 76 (self-resolved with analgesia). No bone protection started since. He is on no glucocorticoids. Calcium 2.32 mmol/L (normal), 25-OH vitamin D 78 nmol/L (replete), eGFR 50, testosterone in normal range, TFTs normal. He drinks 4 units of alcohol per week. DEXA not performed.\n\nWhich is the most appropriate management?",
   options:["No bone protection — osteoporosis is rare in men","Oral alendronic acid 70 mg weekly with continued calcium and vitamin D, plus screen for secondary causes","Strontium ranelate","Aspirin 75 mg daily","No DEXA needed in men, observe"],
   correct:"B",
   explanation:"OSTEOPOROSIS IN MEN is COMMONLY UNDER-DIAGNOSED and UNDER-TREATED — affects ~1 in 5 men over 50 (in contrast to 1 in 2 women). MEN HAVE HIGHER MORTALITY post-hip fracture (~30% at 1 year vs ~20% in women) and are LESS LIKELY to be initiated on bone protection — a significant treatment gap. \n\nTREATMENT: ALENDRONIC ACID 70 mg WEEKLY oral — first-line per NICE TA464 (regardless of DEXA in patients with prior fragility fracture aged ≥75); cheap, generic, evidence base across both sexes (Orwoll 2000 — alendronate in men). RISEDRONATE / IBANDRONATE oral as alternatives.\n\n(A) Osteoporosis is COMMON in men, especially post-hip fracture — myth to dispel.\n\n(C) Strontium has been WITHDRAWN from most markets due to cardiovascular concerns.\n\n(D) Aspirin is not bone protection.\n\n(E) DEXA not needed BEFORE treatment in this scenario but is appropriate for monitoring response.\n\n💎 PEARL: Osteoporosis is under-diagnosed in men — 1 in 5 men over 50 affected, with HIGHER post-hip-fracture mortality (~30% at 1 year) than women. Same regimen: alendronic acid 70 mg weekly + calcium + vitamin D. Screen for secondary causes (testosterone, TFTs, coeliac, myeloma).",
   references:[{label:"NOGG Osteoporosis Guidelines (2021)", url:"https://www.nogg.org.uk/"},{label:"NICE NG104 — Fragility fracture", url:"https://www.nice.org.uk/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"NSAIDs in older adults — STOPP",
   stem:"A 78-year-old woman with bilateral hip osteoarthritis is prescribed regular naproxen 500 mg BD by her GP for ongoing knee and hip pain. Past history: hypertension on ramipril (well-controlled), heart failure with mildly reduced LVEF on bisoprolol and furosemide, eGFR 52, prior duodenal ulcer 10 years ago. She has been on naproxen for 6 weeks. New labs: creatinine 142 (baseline 88), eGFR 38, BP 158/92.\n\nWhich is the most appropriate management?",
   options:["Continue naproxen — no concerns","Stop naproxen; use paracetamol and topical NSAID first-line; consider alternative analgesia and refer for joint review","Add aspirin","Switch to ibuprofen instead","Withhold all pain relief"],
   correct:"B",
   explanation:"NSAIDs IN OLDER ADULTS — multiple risks, often unrecognised in routine practice. ALSO DRUG INTERACTIONS: lithium (raised levels), methotrexate (toxicity), digoxin, SSRIs (bleeding); STEROIDS + NSAIDs particularly hazardous for GI bleed. NICE OSTEOARTHRITIS GUIDELINE NG226 (2022): EDUCATION, EXERCISE (strengthening + aerobic — most evidence-based), WEIGHT LOSS, FOOTWEAR, ASSISTIVE DEVICES are first-line. Paracetamol has been DOWNGRADED in OA guidelines (NICE NG226) — limited efficacy; no longer first-line as routinely as previously, but reasonable adjunct. INTRA-ARTICULAR steroid injections for short-term relief (NICE NG226 — limited efficacy beyond 2–6 weeks); INTRA-ARTICULAR HA (limited evidence). Address comorbidities — depression, sleep, weight, sarcopenia.\n\n(A) Continuation in this patient with multiple STOPP-flagged risks AND now manifesting AKI is harmful.\n\n(C) Aspirin adds bleeding risk without benefit for OA pain.\n\n(D) Ibuprofen has the SAME problems — switching to a different NSAID does not address the contraindications.\n\n(E) Refusing pain relief is harmful — alternative analgesia exists.\n\n💎 PEARL: NSAID in older adult on ACEi + diuretic = 'triple whammy' AKI risk. Also raises BP, worsens heart failure, GI bleed risk, drug interactions (lithium, methotrexate, SSRIs). Per STOPP — avoid in CKD, heart failure, hypertension. Use paracetamol + topical NSAID + exercise (NICE NG226).",
   references:[{label:"STOPP/START Criteria v3 (Age and Ageing 2023)", url:"https://academic.oup.com/ageing/article/52/4/afad037/7099906"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Frailty and pre-operative assessment (POPS)",
   stem:"An 86-year-old woman with Clinical Frailty Scale 6 (moderately frail), 4 long-term conditions (HFpEF, type 2 DM, CKD stage 3a, mild cognitive impairment), and 11 regular medications is being considered for elective laparoscopic cholecystectomy (recurrent biliary colic). She lives alone with daily home help, walks indoors with a stick, and has had two unplanned admissions in the past 12 months. Hb 102 g/L (anaemia), albumin 28 g/L (low). She is keen on surgery but anxious about how she will recover.\n\nWhich is the most appropriate next step?",
   options:["Proceed to surgery without further modification","Refer for Comprehensive Geriatric Assessment-based pre-operative optimisation (POPS — Proactive care of Older People undergoing Surgery)","Cancel all surgery in patients with frailty","Avoid pre-operative anaesthetic input","Proceed only with general anaesthesia (no regional)"],
   correct:"B",
   explanation:"FRAILTY is a major perioperative risk factor — independently associated with INCREASED complications, length of stay, post-operative DELIRIUM, cardiovascular events, infection, pressure ulcers, mortality (30-day, 90-day, 1-year), and post-operative functional decline. CLINICAL FRAILTY SCALE (Rockwood, 1–9) is widely used pre-operatively in the UK; CFS ≥5 = increased risk.\n\n(A) Proceeding without optimisation in a frail multimorbid patient is suboptimal — risks avoidable harm.\n\n(C) Cancelling surgery solely because of frailty denies treatment — many frail patients benefit.\n\n(D) Pre-op anaesthetic input is essential.\n\n(E) Anaesthetic technique should be individualised — regional often preferred.\n\n💎 PEARL: Frail older patient + planned surgery → POPS (Proactive care of Older People undergoing Surgery) — CGA-based pre-op optimisation. Reduces post-op delirium, complications, length of stay and readmission. Don't cancel for frailty alone — many frail patients benefit from surgery if optimised.",
   references:[{label:"BGS Comprehensive Geriatric Assessment", url:"https://www.bgs.org.uk/resources/cga"},{label:"Clinical Frailty Scale (Rockwood)", url:"https://www.bgs.org.uk/resources/cfs"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Constipation-induced delirium",
   stem:"A 90-year-old man with mild Alzheimer's dementia is admitted with new agitation and confusion (4at 8/16, fluctuating) over 3 days, with reduced oral intake. Regular medications include co-codamol 30/500 QDS (recently increased) for hip OA, plus omeprazole and amlodipine. Examination: visibly distended abdomen, mild generalised tenderness, no peritonism; PR — hard impacted stool. AXR: extensive faecal loading throughout the colon, no obstruction or volvulus. Urinalysis clear. CXR clear. Bloods: WCC 9, CRP 12, U&E normal, calcium 2.36, glucose 5.4. Septic and metabolic workup unremarkable.\n\nWhich is the most appropriate next step?",
   options:["Antipsychotic for agitation","Treat the constipation: rectal evacuation followed by oral macrogol, review opioid analgesia, hydration, mobilisation; reassess delirium","Long-term physical restraint","Benzodiazepine for sedation","Discharge to care home"],
   correct:"B",
   explanation:"CONSTIPATION is a leading and HIGHLY REVERSIBLE PRECIPITANT of DELIRIUM in older adults — particularly in those on OPIOIDS, ANTIMUSCARINICS, with cognitive impairment, low mobility, dehydration, or new admission. PINCH ME mnemonic for delirium causes: PAIN, INFECTION, NUTRITION, CONSTIPATION, HYDRATION, MEDICATIONS, ENVIRONMENT — constipation features prominently.\n\n(A) Antipsychotics treat the symptom not the cause; risks listed above.\n\n(C) Restraint is harmful, traumatic, and should never be a first-line approach to behaviour disturbance.\n\n(D) Benzodiazepines worsen delirium.\n\n(E) Discharging an agitated, dehydrated, faecally-impacted older man is unsafe.\n\n💎 PEARL: New delirium + opioid + reduced mobility + distended abdomen + impacted rectum + AXR faecal loading = constipation-induced delirium. PINCH ME mnemonic. Treat the constipation (rectal evacuation → macrogol), review opioid, hydrate. Antipsychotics treat the symptom not the cause.",
   references:[{label:"NICE CG103 — Delirium: prevention, diagnosis and management (2010, updated 2023)", url:"https://www.nice.org.uk/guidance/cg103"},{label:"BGS Delirium Guidelines", url:"https://www.bgs.org.uk/resources/clinical-guidelines"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Driving and dementia — DVLA notification",
   stem:"A 76-year-old man has been newly diagnosed with mild Alzheimer's dementia (AMTS 7/10, MMSE 24/30, MOCA 22/30 — recent diagnosis confirmed in memory clinic). He has good insight and is concerned about his ability to continue driving. Cognitive assessment shows preserved visuospatial function (clock drawing intact), reaction time within normal limits on bedside testing, no significant judgement / executive deficit. He drives a small car only locally for shopping. He attends with his wife who reports he is still 'driving fine'.\n\nWhich is the most appropriate advice?",
   options:["Stop driving immediately","Inform him of his statutory duty to notify DVLA; document the discussion; respect dvla's role in licensing","Allow him to continue driving with no notification","Dvsa, not DVLA, manages this — refer there","Take his keys away unilaterally"],
   correct:"B",
   explanation:"DRIVING and DEMENTIA — common, important, sensitive issue with legal, ethical, and clinical dimensions. Failure to notify is a CRIMINAL OFFENCE and may invalidate insurance. DVLA OUTCOMES: mild dementia does NOT automatically preclude driving — many drivers with early dementia can continue safely for a period; DVLA may issue a Group 1 licence for 1 year subject to medical review (renewable annually), require a medical examination, or request an ON-ROAD ASSESSMENT (specialist Mobility Centre — £200–400, very informative). PROGRESSIVE DECLINE: licence is reviewed periodically, typically annually, and the patient may need to surrender their licence as disease progresses.\n\n(A) Stopping immediately denies the patient legitimate statutory process and dignity — DVLA should determine.\n\n(C) No notification breaks the law.\n\n(D) DVSA (Driver and Vehicle Standards Agency) handles testing of vehicles / instructors — not licensing.\n\n(E) Removing keys unilaterally is paternalistic and potentially inappropriate; respect autonomy and statutory process.\n\n💎 PEARL: Newly diagnosed dementia: it is the patient's STATUTORY duty to notify DVLA — failure is a criminal offence and may invalidate insurance. Document the discussion. Mild dementia does not automatically preclude driving — DVLA may issue a 1-year licence with annual review or request an on-road assessment.",
   references:[{label:"NICE NG97 — Dementia (2018)", url:"https://www.nice.org.uk/guidance/ng97"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"PEG feeding in advanced dementia",
   stem:"A 90-year-old woman with severe end-stage Alzheimer's dementia (CFS 8 — fully dependent for personal care; non-communicative; no longer recognises family) has had recurrent aspiration pneumonia (third admission in 4 months despite SLT review and modified consistency diet). Over the past 2 weeks she has stopped eating and drinking, despite hand-feeding by family. SLT review: unsafe swallow with all consistencies. Albumin 22 g/L, weight loss 5 kg in 4 months. She has no advance directive and no LPA, but family report she has previously expressed strong preferences for comfort over intervention ('don't keep me alive on machines'). The family ask whether a peg feeding tube would help.\n\nWhich is the most appropriate response?",
   options:["Insert a peg tube urgently to prevent further decline","Switch to comfort-focused care: careful hand-feeding for pleasure, oral hygiene, palliative input, family support","Long-term IV fluids","NG feeding indefinitely","Force-feeding by team members"],
   correct:"B",
   explanation:"PEG (PERCUTANEOUS ENDOSCOPIC GASTROSTOMY) FEEDING IN ADVANCED DEMENTIA — a key clinical and ethical SCE / clinical teaching point with strong evidence base. AND PEG IS ASSOCIATED WITH SIGNIFICANT HARM: procedural complications (peritonitis, bleeding, perforation, tube site infection), mechanical complications (blockage, displacement), increased use of physical / chemical restraint to prevent tube removal, deprives the patient of pleasure of taste / oral feeding, distress, increased delirium.\n\n(A) PEG inappropriate per evidence — would harm the patient.\n\n(C) IV fluids beyond comfort hydration prolongs dying without benefit.\n\n(D) NG feeding indefinitely is similarly not in keeping with comfort goals.\n\n(E) Force-feeding is unethical and physically harmful (aspiration, distress).\n\n💎 PEARL: Advanced dementia + recurrent aspiration + stops eating = dying trajectory. PEG feeding does NOT improve survival, reduce aspiration, prevent pressure ulcers or improve quality of life — and adds harm (procedural complications, restraint, lost pleasure of taste). Switch to careful hand-feeding for pleasure and palliative care.",
   references:[{label:"NICE NG97 — Dementia (2018)", url:"https://www.nice.org.uk/guidance/ng97"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Polypharmacy review — STOPP/START",
   stem:"An 86-year-old man with mild Alzheimer's dementia, AF on warfarin (INR 2.4, stable), hypertension (BP 138/80), type 2 diabetes (HbA1c 58 mmol/mol), bilateral hip OA, and depression takes 14 regular medications: warfarin, ramipril, amlodipine, doxazosin, bisoprolol, simvastatin, metformin, gliclazide, sertraline, mirtazapine, omeprazole, codeine, oxybutynin, and zopiclone. Recent admissions for falls (2) and an episode of postural hypotension. He has not had a structured medication review for 4 years. Bloods: eGFR 48, sodium 132, potassium 4.0. The team performs a structured medication review.\n\nWhich is the most appropriate framework for this medication review?",
   options:["Continue all current medications","Apply STOPP/START criteria as a structured framework, deprescribe sequentially with patient involvement, pharmacist input","Stop all medications except the anticoagulant","Add an additional medication to address each symptom","Refer to psychiatry for assessment"],
   correct:"B",
   explanation:"POLYPHARMACY (≥5 regular medications) is a leading reversible cause of adverse drug reactions, falls, hospitalisation, and avoidable harm in older adults. ~30% of older adults take ≥5 medications; ~10% take ≥10. Each additional medication compounds the risk of drug-drug interactions, drug-disease interactions, adherence problems, anticholinergic / sedative burden, and prescribing cascades (a side effect of one drug being treated with another drug).\n\n(A) Continuing all medications without review misses opportunity to reduce harm.\n\n(C) Stopping all but anticoagulant is wholesale and unsafe — sequential, individualised approach is correct.\n\n(D) Prescribing cascades worsen polypharmacy.\n\n(E) Psychiatric referral does not address the polypharmacy issue.\n\n💎 PEARL: Polypharmacy (≥5 meds) → falls, ADRs, prescribing cascades. STOPP/START provides a structured framework: STOPP highlights potentially inappropriate prescriptions (anticholinergics, long benzos, NSAIDs in CKD); START prompts under-prescribed indications (anticoagulation in AF, statin in vascular disease). Deprescribe sequentially with pharmacist input.",
   references:[{label:"NICE NG5 — Medicines optimisation (2015)", url:"https://www.nice.org.uk/guidance/ng5"},{label:"STOPP/START Criteria (Age and Ageing 2023)", url:"https://academic.oup.com/ageing/article/52/4/afad037/7099906"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Hip fracture — orthogeriatric care model",
   stem:"An 88-year-old woman with mild Alzheimer's dementia, hypertension and AF on apixaban presents with a left intracapsular displaced hip fracture from a low-energy fall. She is medically fit for theatre (no decompensated heart failure, no severe anaemia, no active sepsis). She lives alone, normally walks with a frame indoors, has had two recent falls. Daughter is her main support. Last apixaban dose 6 hours pre-injury. Hb 102 g/L, INR 1.0, eGFR 55. Pre-op cognitive screen: AMTS 6/10, has fluctuating capacity for surgical decision.\n\nWhich is the most appropriate care pathway?",
   options:["Surgery within 24 hours under general anaesthesia, with no orthogeriatric input","NICE NG124 orthogeriatric care: surgery within 36 hours, joint multidisciplinary review, NHFD-aligned bundle","Conservative non-operative management","Wait 7 days for medical optimisation","Avoid all opioid analgesia in older adults"],
   correct:"B",
   explanation:"HIP FRACTURE care for older adults is one of the BEST-EVIDENCED examples of integrated orthogeriatric medicine, with substantial mortality and outcome improvements over the past 20 years. NHFD performance benchmark — UK-wide annual report; centres compared on 30-day mortality, surgery <36 h, pre-op orthogeriatric review, mobilisation by day 1.\n\n(A) No orthogeriatric input is suboptimal and below standard.\n\n(C) Conservative management for displaced intracapsular fracture in a fit-for-surgery patient is harmful — surgery is standard.\n\n(D) Unnecessary 7-day delay increases mortality.\n\n(E) Avoiding opioids entirely is over-restrictive — multimodal pain control including opioids when needed is essential (uncontrolled pain itself causes delirium).\n\n💎 PEARL: Hip fracture care = orthogeriatric MDT model: surgery <36 h, joint orthopaedic-orthogeriatric review, daily mobilisation, bone protection, falls assessment, delirium prevention. NHFD audits centres on this bundle. 30-day mortality has fallen since the model became standard.",
   references:[{label:"BGS / BOA Blue Book on Fragility Fracture Care", url:"https://www.bgs.org.uk/sites/default/files/content/attachment/2018-05-02/Blue%20Book%20on%20fragility%20fracture%20care.pdf"},{label:"NICE NG124 — Hip fracture", url:"https://www.nice.org.uk/guidance/ng124"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Suspected elder abuse — safeguarding",
   stem:"An 86-year-old woman with mild Alzheimer's dementia is brought to the AMU by her son. Findings: bruising in different stages of healing on the upper arms (consistent with grip marks) and back; clinical dehydration; 6 kg unintentional weight loss over 3 months; poor personal hygiene. Her son (with whom she lives, recent retirement) is impatient, answers all questions on her behalf, repeatedly interrupts, and acknowledges he has 'told' the GP and district nurses not to visit. She is reluctant to speak when he is present and avoids eye contact with him. Capacity is fluctuating but she retains some capacity for some decisions. Bedside MCA assessment shows she has capacity for the specific decision about whether to discharge home.\n\nWhich is the most appropriate next step?",
   options:["Discharge her home with safety-netting and opd review","Recognise as possible elder abuse, raise a Safeguarding Adults referral, speak to her alone, document objective findings, involve safeguarding team and social work","Confront the son about the bruising in the patient's presence","Take no action without documentary proof of abuse","Discharge and report to police only if injuries are severe"],
   correct:"B",
   explanation:"ELDER ABUSE: a hidden, common, and often missed problem. UK estimates: 1 in 6 adults over 65 experience some form of abuse annually.\n\n(A) Discharging home into a possibly abusive environment without action is unsafe and unethical.\n\n(C) Confronting the son in front of the patient may escalate risk to her.\n\n(D) Documentary proof is not required to raise a concern — reasonable suspicion suffices.\n\n(E) Police involvement comes through formal safeguarding pathway.\n\n💎 PEARL: Bruising in different stages + grip marks + dehydration + weight loss + carer who interrupts and isolates = possible elder abuse. Speak to the patient ALONE. Raise a Safeguarding Adults referral (Care Act 2014) — reasonable suspicion is enough; documentary proof not required. Don't confront the suspected abuser in front of the patient.",
   references:[{label:"Care Act 2014 — Statutory Guidance on Safeguarding", url:"https://www.gov.uk/government/publications/care-act-statutory-guidance/care-and-support-statutory-guidance"},{label:"Action on Elder Abuse / Hourglass UK", url:"https://wearehourglass.org/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Discharge to Assess pathway",
   stem:"An 82-year-old man is admitted with community-acquired pneumonia (CURB-65 = 2; treated with co-amoxiclav and clarithromycin). After 5 days he is medically optimised: afebrile 24 hours, off oxygen, eating and drinking, mobilising with support but deconditioned — he previously walked outdoors with a stick, now requires a frame. He needs increased support to return home — possibly a short rehabilitation stay or an enhanced package of care. He has capacity and wants to go home, not to a care facility. His daughter lives 30 minutes away and can visit daily but cannot move in.\n\nWhich is the most appropriate discharge pathway?",
   options:["Long-stay hospital admission until full recovery","Discharge to Assess (D2A) pathway — Pathway 1 with intensive home reablement","Permanent care home placement directly from hospital","Self-discharge against medical advice","Long-term IV antibiotics in hospital"],
   correct:"B",
   explanation:"DISCHARGE TO ASSESS (D2A): the model recommended in the NHS HOSPITAL DISCHARGE SERVICE GUIDANCE (2020 / 2022 updates) and KING'S FUND analyses. PRINCIPLES: assessment by the right team in the right place; multidisciplinary input from physiotherapy, occupational therapy, social work, community matron, GP; clear communication with patient and family; capacity respected; rapid response (within 1–2 days of medical fitness); time-limited support to maximise independence (REABLEMENT improves outcomes — Cochrane review); avoid hospital-acquired complications.\n\n(A) Long-stay hospital admission causes harm — prolonged length of stay = increased deconditioning, infection, delirium, pressure ulcers; unnecessary if D2A available.\n\n(C) Direct hospital-to-care-home placement for a recovering patient who wants to go home is wrong — overrides his capacity-respected wish, and the assessment is unreliable in acute hospital.\n\n(D) Self-discharge is patient-led not team-led, doesn't address his real needs.\n\n(E) IV antibiotics not needed once medically optimised.\n\n💎 PEARL: Medically optimised + needs ongoing rehabilitation or assessment + has capacity + wants to go home → Discharge to Assess Pathway 1 (intensive home reablement). Assess in the right place, not the hospital. Deconditioning costs ~10% muscle per week of bed rest — every avoidable hospital day causes harm.",
   references:[{label:"NHS England — Discharge to Assess Pathway Guidance", url:"https://www.england.nhs.uk/urgent-emergency-care/reducing-length-of-stay/reducing-long-term-stays/discharge-to-assess/"}]},

  {section:"elderly", specialty:"Geriatric Medicine", topic:"Anticipatory care planning",
   stem:"An 88-year-old woman with severe heart failure (NYHA IV — symptomatic at rest, three admissions in the past 6 months for fluid overload despite optimal medical therapy), CKD stage 4 (eGFR 22), and mild cognitive impairment (MMSE 26/30, retains capacity for most decisions) is in clinic for review. She is on bisoprolol, sacubitril-valsartan, eplerenone, furosemide, dapagliflozin. She has capacity and explicitly raises that she wants to discuss future care — she is concerned about being resuscitated, going to itu, or dying alone in hospital. She has no LPA, no advance directive.\n\nWhich is the most appropriate next step?",
   options:["Avoid the discussion to prevent distress","Anticipatory care planning conversation supported by ReSPECT and Advance Decision frameworks: explore preferences, document a shared treatment plan, share with GP, community team, family (with consent)","Make decisions on her behalf without consultation","Document only that she is 'not for resuscitation'","Refer all decision-making to the family"],
   correct:"B",
   explanation:"ANTICIPATORY CARE PLANNING (ACP, also 'advance care planning') — a structured, voluntary, ongoing process of discussion between a person, their healthcare team, family / carers about their VALUES, preferences, fears, and desired care, particularly relevant when facing advancing or life-limiting illness. ALLOWS individuals to express PREFERENCES while they have CAPACITY for future care if / when they lose capacity. ASSOCIATED WITH: better quality of end-of-life care, MORE care delivered in keeping with patient wishes, FEWER unwanted interventions, FEWER inappropriate hospital admissions / ITU stays, MORE deaths in PREFERRED place (often home), better family bereavement outcomes (less PTSD, complicated grief).\n\n(A) Avoiding the discussion — paternalism; deprives the patient of opportunity she is explicitly requesting; evidence shows ACP discussions REDUCE distress and improve outcomes.\n\n(C) Making decisions without consultation when she has capacity is unlawful (MCA breach) and unethical.\n\n(D) Documenting only DNACPR is incomplete — ReSPECT / ACP captures broader preferences (admission, ITU, antibiotics, place of care).\n\n(E) Family alone do not have legal authority while the patient has capacity.\n\n💎 PEARL: Patient with capacity + advanced life-limiting disease + raises preferences = open the anticipatory care planning conversation. Use ReSPECT and Advance Decision frameworks. Document, share with GP and community team. Associated with more care matching wishes, fewer unwanted ITU admissions and better bereavement outcomes.",
   references:[{label:"Resuscitation Council UK ReSPECT Process", url:"https://www.resus.org.uk/respect"},{label:"NICE NG142 — End of life care for adults", url:"https://www.nice.org.uk/guidance/ng142"}]},

  // ═══════════════════════════════════════════════════════════
  // IMAGE-BASED ECG QUESTION (Cardiovascular)
  // ═══════════════════════════════════════════════════════════
  {section:"cardiovascular", specialty:"Cardiology", topic:"Anterior STEMI on 12-lead ECG",
   stem:"A 58-year-old smoker presents to the ED 45 minutes into severe central chest pain with diaphoresis. HR 96 sinus rhythm, BP 142/88, JVP not elevated, lungs clear. The 12-lead ECG is shown:",
   imageUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/12_lead_generated_anterior_MI.JPG",
   imageAlt:"12-lead ECG showing convex (tombstoning) ST elevation in V1–V4 consistent with anterior STEMI",
   options:["Pericarditis — high-dose ibuprofen and discharge","Anterior STEMI — activate primary PCI pathway and load with dual antiplatelets","NSTEMI — start fondaparinux and ticagrelor; angiography within 72 hours","Benign early repolarisation — discharge with safety-netting","Brugada pattern — refer to electrophysiology"],
   correct:"B",
   explanation:"Convex ('tombstoning') ST elevation across the precordial leads V1–V4 with reciprocal inferior changes is anterior STEMI from proximal LAD occlusion ('widow-maker'). Door-to-balloon target is <90 minutes from first medical contact (or <120 minutes if presenting to a non-PCI centre). Load with aspirin 300 mg + ticagrelor (or prasugrel) and activate primary PCI. Adjuncts: parenteral anticoagulant (UFH or bivalirudin per local protocol).\n\n(A) Pericarditis gives WIDESPREAD saddle-shaped ST elevation (not localised to a coronary territory) with PR depression — and is not the classic tombstoning shape.\n\n(C) NSTEMI is a clinical-pathological diagnosis without persistent ST elevation; ECG here clearly shows STE — primary PCI takes precedence.\n\n(D) Benign early repolarisation gives concave ST elevation (notch / J wave at the J-point) often with reciprocal aVR changes only; rare cause of severe chest pain with diaphoresis at age 58.\n\n(E) Brugada gives a coved-type ST elevation IN V1–V3 only with negative T waves (type 1 pattern); usually presents with syncope or arrhythmia, not severe central chest pain in a smoker.\n\n💎 PEARL: Convex 'tombstoning' ST elevation V1–V4 with reciprocal inferior changes = anterior STEMI from proximal LAD ('widow-maker'). Activate primary PCI within 90 min of first medical contact (or 120 min from non-PCI centre). Aspirin 300 mg + ticagrelor / prasugrel + parenteral anticoagulant.",

// Helper: count current questions per blueprint section
window.coverageStats = function() {
  const counts = {};
  for (const q of window.QBANK) counts[q.section] = (counts[q.section] || 0) + 1;
  return window.BLUEPRINT.map(b => ({
    ...b,
    have: counts[b.key] || 0,
    pct: Math.min(100, Math.round(((counts[b.key] || 0) / b.target) * 100))

<!-- ─────────────────── APP LOGIC ─────────────────── -->
<script>
const $ = (id) => document.getElementById(id);
const QUESTION_DURATION_MS = 60_000;
const POINTS_BASE = 1000;

const S = {
  view: 'landing',
  roomCode: null, isHost: false,
  playerId: null, playerName: null,
  room: null, questionIdx: 0,
  selectedAnswer: null, answerSubmitted: false,
  unsubRoom: null,
  msalApp: null, importedQ: [],
  deck: [], qbankShuffled: [],
  // Solo mode (no Firebase, no room) — a single user answering on their own
  soloQ: null,         // current question object
  soloMode: null,      // 'daily' | 'random' | 'random-specialty'
  soloChoice: null,    // option index they picked
  soloAnswered: false  // have they revealed yet?
};

function uid()  { return Math.random().toString(36).slice(2,10); }
function code() { return Math.random().toString(36).slice(2,8).toUpperCase(); }
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}
function shuffle(a) {
  const x = [...a];
  for (let i = x.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [x[i],x[j]] = [x[j],x[i]];
  }
  return x;
}
function fmtTime(ms) { return Math.max(0, Math.ceil(ms/1000)).toString(); }

// ───────── DAILY QUESTION MODE ─────────
// One question per day, mapped to day-of-year via a deterministic
// shuffle. Same question for everyone on a given date, every year.
// Uses a seeded PRNG so the mapping never changes.
function dailySeededShuffle(arr) {
  const a = [...arr];
  let seed = 42 ^ a.length; // stable seed; changes only if QBANK length changes
  const rand = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function dayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  return Math.floor(diff / 86400000); // 1..365 (or 366)
}
function todaysQuestion() {
  const shuffled = dailySeededShuffle(window.QBANK);
  const idx = (dayOfYear(new Date()) - 1) % shuffled.length;
  return shuffled[idx];
}

// Solo daily question — uses a DIFFERENT seed so individual users get
// a different question than the team / hospital quiz on the same day.
function soloDailySeededShuffle(arr) {
  const a = [...arr];
  let seed = 9173 ^ a.length; // different seed = different rotation
  const rand = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function soloTodaysQuestion() {
  const shuffled = soloDailySeededShuffle(window.QBANK);
  const idx = (dayOfYear(new Date()) - 1) % shuffled.length;
  return shuffled[idx];
}
// Random question — optionally constrained to a specialty
function randomQuestion(specialty) {
  const pool = specialty
    ? window.QBANK.filter(q => q.specialty === specialty)
    : window.QBANK;
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function waitForFb() {
  return new Promise(resolve => {
    if (window.fb) return resolve();
    window.addEventListener('fb-ready', () => resolve(), {once:true});
  });
}

async function createRoom(hostName) {
  const c = code();
  // Daily mode: deck contains only today's question (mapped by day-of-year).
  // Imported MS Forms questions, if any, still play first as a teaching extra.
  const deck = [...S.importedQ, todaysQuestion()];
  const playerId = uid();
  const room = {
    code: c, state: 'lobby',
    questionIdx: 0, questionStartedAt: null,
    hostId: playerId,
    players: { [playerId]: { name: hostName, score: 0, joinedAt: Date.now() } },
    deck, createdAt: Date.now()
  };
  await window.fb.set(`rooms/${c}`, room);
  S.roomCode = c; S.playerId = playerId;
  S.playerName = hostName; S.isHost = true; S.deck = deck;
  subscribeRoom(c);
  S.view = 'lobby'; render();
}

async function joinRoom(roomCode, name) {
  const rc = roomCode.trim().toUpperCase();
  const room = await window.fb.get(`rooms/${rc}`);
  if (!room) { alert(`Room ${rc} not found.`); return; }
  if (room.state !== 'lobby') { alert('This game has already started.'); return; }
  const playerId = uid();
  await window.fb.update(`rooms/${rc}/players/${playerId}`, {
    name, score: 0, joinedAt: Date.now()
  });
  S.roomCode = rc; S.playerId = playerId;
  S.playerName = name; S.isHost = false; S.deck = room.deck || [];
  subscribeRoom(rc);
  S.view = 'lobby'; render();
}

function subscribeRoom(rc) {
  if (S.unsubRoom) S.unsubRoom();
  S.unsubRoom = window.fb.listen(`rooms/${rc}`, room => {
    if (!room) { alert('The room was closed.'); resetToLanding(); return; }
    const prevState = S.room && S.room.state;
    S.room = room; S.deck = room.deck || S.deck;
    if (room.state === 'question' && prevState !== 'question') {
      S.selectedAnswer = null; S.answerSubmitted = false;
      S.view = 'question'; startQuestionTimer();
    } else if (room.state === 'reveal' && prevState !== 'reveal') {
      S.view = 'reveal';
    } else if (room.state === 'finished') S.view = 'finished';
    else if (room.state === 'lobby') S.view = 'lobby';
    render();
  });
}

async function startQuiz() {
  if (!S.isHost) return;
  await window.fb.update(`rooms/${S.roomCode}`, {
    state: 'question', questionIdx: 0, questionStartedAt: Date.now()
  });
  await window.fb.set(`rooms/${S.roomCode}/answers/0`, {});
}

async function submitAnswer(idx) {
  if (S.answerSubmitted) return;
  if (S.room.state !== 'question') return;
  S.selectedAnswer = idx; S.answerSubmitted = true;
  const elapsedMs = Date.now() - S.room.questionStartedAt;
  const remaining = Math.max(0, QUESTION_DURATION_MS - elapsedMs);
  const speedRatio = remaining / QUESTION_DURATION_MS;
  await window.fb.set(
    `rooms/${S.roomCode}/answers/${S.room.questionIdx}/${S.playerId}`,
    { answer: idx, elapsedMs, speedRatio, name: S.playerName }
  );
  render();
}

async function endQuestion() {
  if (!S.isHost) return;
  const idx = S.room.questionIdx;
  const q = S.deck[idx]; if (!q) return;
  const correctIdx = 'ABCDE'.indexOf(q.correct);
  const answers = await window.fb.get(`rooms/${S.roomCode}/answers/${idx}`) || {};
  const updates = {};
  for (const [pid, a] of Object.entries(answers)) {
    if (a.answer === correctIdx) {
      const player = S.room.players[pid];
      const gained = Math.round(POINTS_BASE * (0.5 + 0.5 * a.speedRatio));
      updates[`players/${pid}/score`] = (player?.score || 0) + gained;
    }
  }
  updates['state'] = 'reveal';
  await window.fb.update(`rooms/${S.roomCode}`, updates);
}

async function nextQuestion() {
  if (!S.isHost) return;
  const next = S.room.questionIdx + 1;
  if (next >= S.deck.length) {
    await window.fb.update(`rooms/${S.roomCode}`, { state: 'finished' });
    return;
  }
  await window.fb.set(`rooms/${S.roomCode}/answers/${next}`, {});
  await window.fb.update(`rooms/${S.roomCode}`, {
    state: 'question', questionIdx: next, questionStartedAt: Date.now()
  });
}

async function endQuiz() {
  if (!S.isHost) return;
  await window.fb.update(`rooms/${S.roomCode}`, { state: 'finished' });
}

async function leaveRoom() {
  if (S.isHost && S.roomCode) {
    if (confirm('You are the host — leaving will close the room for everyone. Continue?')) {
      await window.fb.set(`rooms/${S.roomCode}`, null);
      resetToLanding();
    }
  } else if (S.roomCode && S.playerId) {
    await window.fb.set(`rooms/${S.roomCode}/players/${S.playerId}`, null);
    resetToLanding();
  }
}

function resetToLanding() {
  if (S.unsubRoom) S.unsubRoom(); S.unsubRoom = null;
  S.roomCode = null; S.playerId = null; S.playerName = null;
  S.isHost = false; S.room = null; S.view = 'landing';
  render();
}

let timerInterval = null;
function startQuestionTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!S.room || S.room.state !== 'question') {
      clearInterval(timerInterval); timerInterval = null; return;
    }
    const elapsed = Date.now() - S.room.questionStartedAt;
    if (elapsed >= QUESTION_DURATION_MS) {
      clearInterval(timerInterval); timerInterval = null;
      if (S.isHost) endQuestion();
    } else {
      const t = $('timer');
      if (t) {
        const remain = QUESTION_DURATION_MS - elapsed;
        t.textContent = '⏱ ' + fmtTime(remain) + 's';
        if (remain < 10_000) t.classList.add('urgent');
        else t.classList.remove('urgent');
      }
    }
  }, 200);
}

async function initMsal() {
  if (!window.MSAL_CFG?.clientId) return;
  S.msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: window.MSAL_CFG.clientId,
      authority: window.MSAL_CFG.authority,
      redirectUri: window.MSAL_CFG.redirectUri
    },
    cache: { cacheLocation: 'sessionStorage' }
  });
  await S.msalApp.initialize();
}
async function importMSForm(formId) {
  if (!S.msalApp) { alert('MSAL not configured.'); return; }
  try {
    const login = await S.msalApp.loginPopup({ scopes: ['Forms.Read', 'User.Read'] });
    const t = await S.msalApp.acquireTokenSilent({
      account: login.account, scopes: ['Forms.Read']
    });
    const resp = await fetch(
      `https://graph.microsoft.com/beta/me/forms/${formId}/questions`,
      { headers: { Authorization: `Bearer ${t.accessToken}` } }
    );
    if (!resp.ok) throw new Error('Graph API error: ' + resp.status);
    const data = await resp.json();
    const questions = (data.value || [])
      .filter(q => q.questionType === 'choice' && q.choices?.length >= 2)
      .map(q => ({
        section: 'other',
        specialty: 'Imported (MS Forms)',
        topic: q.title || '',
        stem: q.title || q.questionText || '',
        options: q.choices.map(c => c.displayName || c.text || ''),
        correct: 'ABCDE'[Math.max(0, q.choices.findIndex(c => c.isAnswer))] || 'A',
        explanation: q.explanation || ''
      }));
    S.importedQ = questions;
    alert(`Imported ${questions.length} question(s) from MS Forms.`);
    render();
  } catch (e) { alert('Import failed: ' + e.message); }
}

// ─────── Rendering ───────
function brand() {

    <div class="logo">SCE</div>
    <div>
      <div class="title">Acute Medicine Team Quiz</div>

    </div>
  </div>`;
}

function renderCoverage() {
  const stats = window.coverageStats();
  const total = stats.reduce((s,r) => s + r.have, 0);
  const target = stats.reduce((s,r) => s + r.target, 0);
  const rows = stats.map(r => {
    const full = r.have >= r.target;
    return `<tr>
      <td>${escapeHtml(r.name)}</td>
      <td class="num">${r.have} / ${r.target}</td>
      <td><span class="cov-bar"><span class="fill ${full?'full':''}" style="width:${r.pct}%"></span></span></td>
    </tr>`;
  }).join('');
  return `
    <details>
      <summary>Question bank coverage — ${total} / ${target} (${Math.round(100*total/target)}%)</summary>
      <table class="coverage">
        <thead><tr><th>Blueprint domain</th><th class="num">Have / target</th><th></th></tr></thead>
        <tbody>${rows}
          <tr class="total"><td>Total</td><td class="num">${total} / ${target}</td>
            <td><span class="cov-bar"><span class="fill" style="width:${Math.round(100*total/target)}%"></span></span></td>
          </tr>
        </tbody>
      </table>
      <p class="tiny" style="margin-top:8px">Targets are pro-rated from the official MRCP(UK) SCE Acute Medicine blueprint to 366 questions (one for every day of the year, leap years included).</p>
    </details>
  `;
}

function renderLanding() {
  // Auto-join if arriving via QR scan (URL contains ?room=ABC123)
  const pre = new URLSearchParams(window.location.search).get('room');
  if (pre) {
    joinRoom(pre.toUpperCase(), autoName());
    return;
  }
  // Read remembered hospital name from localStorage (or fall back to HOST_NAME default)
  let savedHospital = '';
  try { savedHospital = localStorage.getItem('aimQuizHospital') || ''; } catch (e) {}
  const hospitalDefault = savedHospital || (window.HOST_NAME && window.HOST_NAME !== 'Hospital Name' ? window.HOST_NAME : '');
  const dateStr = (() => {
    const d = new Date();
    const day = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
    return `Day ${day} of ${d.getFullYear()} · ${d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'})}`;
  })();
  
  $('root').innerHTML = `
    <header class="l-hero">
      <div class="l-date">${dateStr}</div>
      <h1>One question. <em>Every day.</em></h1>
      <p class="l-sub">Hand-authored Acute Medicine SBAs with comprehensive explanations and current UK guideline links. Pick how you want to answer today.</p>
    </header>

    <div class="l-modes">
      
      <div class="l-mode l-mode-feature">
        <span class="l-tag">multiplayer</span>
        <div class="l-mode-text">
          <div class="l-mode-num"><span class="dot"></span>01 / Team quiz</div>
          <h2>Host today's question for your team</h2>
          <p>Players join from their own devices via QR. Same question for every team today; different one tomorrow. Anonymous codes, live response counter, leaderboard at the end.</p>
        </div>
        <div class="l-mode-input-group">
          <label class="l-input-label" for="hospital-input">Hospital or team name</label>
          <input id="hospital-input" type="text" class="l-input" placeholder="e.g. QEHB Acute Medicine" value="${escapeHtml(hospitalDefault)}" autocomplete="off">
          <button class="l-btn l-btn-primary" onclick="hostClick()">
            Start team question <span class="l-btn-arrow">→</span>
          </button>
        </div>
      </div>
      
      <div class="l-mode">
        <span class="l-tag">solo</span>
        <div class="l-mode-num"><span class="dot"></span>02 / Daily</div>
        <h2>Question of the day</h2>
        <p>A different daily SBA for individual revision — distinct from the team question, so you can do both. Just answer and reveal; no room, no leaderboard.</p>
        <button class="l-btn" onclick="startSoloDaily()">
          Today's solo question <span class="l-btn-arrow">→</span>
        </button>
      </div>
      
      <div class="l-mode">
        <span class="l-tag">random</span>
        <div class="l-mode-num"><span class="dot"></span>03 / Practice</div>
        <h2>Random practice</h2>
        <p>Pull a random question from the bank. Answer, see the explanation, then continue — staying on the specialty for focused practice or jumping to a fresh topic.</p>
        <button class="l-btn" onclick="startSoloRandom()">
          Random question <span class="l-btn-arrow">→</span>
        </button>
      </div>
      
    </div>
    
    <div class="l-stats">
      <span><strong>${window.QBANK.length}</strong> questions in rotation${S.importedQ.length ? ` · <strong>${S.importedQ.length}</strong> imported` : ''}</span>
      <a href="#coverage" class="l-coverage-link" onclick="document.getElementById('coverage-details').open=true;return true;">View blueprint coverage ↓</a>
    </div>
    
    <details id="coverage-details" style="margin-top:18px">
      <summary>Curriculum coverage</summary>
      <div id="coverage" style="margin-top:10px">${renderCoverage()}</div>
    </details>
    ${window.MSAL_CFG?.clientId ? `<div style="text-align:center;margin-top:14px"><button class="btn sm" onclick="msImportClick()">Import MS Forms</button></div>` : ''}
  `;
}

// ───────── SOLO MODE RENDERERS ─────────

function renderSoloQuestion() {
  const q = S.soloQ;
  if (!q) { S.view = 'landing'; render(); return; }
  
  const modeBadge = S.soloMode === 'daily' ? "Today's solo question"
                  : S.soloMode === 'random-specialty' ? `Practice · ${escapeHtml(q.specialty)}`
                  : 'Random practice';
  
  $('root').innerHTML = brand() + `
    <div class="card q-card fade-in">
      <div class="qhead">
        <div class="row between" style="margin-bottom:4px">
          <span class="specialty-tag">${escapeHtml(q.specialty)}</span>
          <span class="tiny muted">${modeBadge}</span>
        </div>
      </div>
      <div class="qbody">
        <div class="stem-pane">
          <div class="stem">${escapeHtml(q.stem)}</div>
          ${q.imageUrl ? `<img class="stem-img" src="${escapeHtml(q.imageUrl)}" alt="${escapeHtml(q.imageAlt||'')}" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="options-pane">
          <div id="opts">
            ${q.options.map((opt, i) => `
              <button class="opt ${S.soloChoice===i?'selected':''}"
                      onclick="pickSoloAnswer(${i})">
                <span class="letter">${'ABCDE'[i]}</span>${escapeHtml(opt)}
              </button>`).join('')}
          </div>
        </div>
      </div>
      <div class="qfoot">
        <span class="muted tiny">${S.soloChoice !== null ? 'Click reveal when ready' : 'Pick an answer to continue'}</span>
        <div style="display:flex;gap:8px">
          <button class="btn sm" onclick="exitSolo()">Back</button>
          <button class="btn sm primary" onclick="revealSoloAnswer()" ${S.soloChoice===null?'disabled':''}>Reveal answer →</button>
        </div>
      </div>
    </div>
  `;
}

function renderSoloReveal() {
  const q = S.soloQ;
  if (!q) { S.view = 'landing'; render(); return; }
  
  const correctIdx = 'ABCDE'.indexOf(q.correct);
  const yourIdx = S.soloChoice;
  const correct = yourIdx === correctIdx;
  
  $('root').innerHTML = brand() + `
    <div class="card fade-in" style="max-width:780px;margin:0 auto">
      <div class="row between" style="margin-bottom:8px">
        <span class="specialty-tag">${escapeHtml(q.specialty)}${q.topic?` · ${escapeHtml(q.topic)}`:''}</span>
        <span class="tiny" style="font-weight:600;color:${correct ? 'var(--good)' : 'var(--bad)'}">
          ${correct ? '✓ Correct' : '✗ Incorrect'}
        </span>
      </div>
      <div class="stem">${escapeHtml(q.stem)}</div>
      ${q.imageUrl ? `<img class="stem-img" src="${escapeHtml(q.imageUrl)}" alt="${escapeHtml(q.imageAlt||'')}" onerror="this.style.display='none'" style="max-height:35vh">` : ''}
      <div style="margin-top:14px">
        ${q.options.map((opt, i) => {
          let cls = 'opt';
          if (i === correctIdx) cls += ' correct';
          else if (i === yourIdx) cls += ' incorrect';
          return `<div class="${cls}" style="cursor:default">
            <span class="letter">${'ABCDE'[i]}</span>${escapeHtml(opt)}
            ${i === correctIdx ? '<span style="margin-left:auto;font-size:12px;color:var(--good)">✓ correct answer</span>' : ''}
            ${i === yourIdx && i !== correctIdx ? '<span style="margin-left:auto;font-size:12px;color:var(--bad)">your answer</span>' : ''}
          </div>`;
        }).join('')}
      </div>
      ${(() => {
        const pearlMatch = (q.explanation || '').match(/💎\s*PEARL:\s*([\s\S]+?)$/);
        if (!pearlMatch) return '';
        return `<div style="margin-bottom:14px;padding:12px 16px;background:#FFF8E7;border-left:3px solid #B45309;border-radius:var(--radius-sm);font-size:14px;line-height:1.55">
          <strong style="font-size:11px;color:#B45309;text-transform:uppercase;letter-spacing:0.08em">💎 Pearl</strong>
          <div style="margin-top:4px;color:var(--ink)">${escapeHtml(pearlMatch[1].trim())}</div>
        </div>`;
      })()}
      <div class="explanation">${(() => {
        // Strip the pearl from the main explanation since we render it above
        const text = q.explanation || '';
        const pearlMatch = text.match(/💎\s*PEARL:\s*([\s\S]+?)$/);
        if (pearlMatch) {
          const main = text.slice(0, pearlMatch.index).trim();
          return escapeHtml(main);
        }
        return escapeHtml(text);
      })()}</div>
      ${q.references && q.references.length ? `
        <div style="margin-top:12px;padding:10px 14px;background:#f6f8fb;border-radius:var(--radius-sm);font-size:13px">
          <strong style="font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.04em">References</strong>
          <ul style="margin:6px 0 0;padding-left:20px;line-height:1.5">
            ${q.references.map(r => `<li><a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.label)}</a></li>`).join('')}
          </ul>
        </div>
      ` : ''}
      <div class="divider"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" onclick="nextSoloRandom()">Next random question →</button>
        <button class="btn" onclick="nextSoloSpecialty()">Another ${escapeHtml(q.specialty)} question →</button>
        <button class="btn sm" onclick="exitSolo()" style="margin-left:auto">Back to start</button>
      </div>
    </div>
  `;
}

// ───────── SOLO MODE HANDLERS ─────────

function startSoloDaily() {
  S.soloQ = soloTodaysQuestion();
  S.soloMode = 'daily';
  S.soloChoice = null;
  S.soloAnswered = false;
  S.view = 'solo-question';
  render();
}
function startSoloRandom(specialty) {
  S.soloQ = randomQuestion(specialty);
  S.soloMode = specialty ? 'random-specialty' : 'random';
  S.soloChoice = null;
  S.soloAnswered = false;
  S.view = 'solo-question';
  render();
}
function pickSoloAnswer(idx) {
  S.soloChoice = idx;
  render();
}
function revealSoloAnswer() {
  if (S.soloChoice === null) return;
  S.soloAnswered = true;
  S.view = 'solo-reveal';
  render();
}
function nextSoloRandom() {
  startSoloRandom();
}
function nextSoloSpecialty() {
  if (!S.soloQ) return;
  startSoloRandom(S.soloQ.specialty);
}
function exitSolo() {
  S.soloQ = null;
  S.soloMode = null;
  S.soloChoice = null;
  S.soloAnswered = false;
  S.view = 'landing';
  render();
}

function renderLobby() {
  const room = S.room; if (!room) return;
  const players = Object.entries(room.players || {});
  const joinUrl = `${window.location.origin}${window.location.pathname}?room=${room.code}`;
  $('root').innerHTML = brand() + `
    <div class="card fade-in">
      <h2>Waiting room — ${escapeHtml(room.code)}</h2>
      <div class="grid-2" style="margin-top:10px">
        <div class="qr-wrap">
          <div id="qr"></div>
          <div class="muted">Scan to join</div>
          <div class="room-code">${escapeHtml(room.code)}</div>
        </div>
        <div>
          <h3>Players (${players.length})</h3>
          <div style="margin:10px 0">
            ${players.map(([pid,p]) => `
              <span class="players-chip">${escapeHtml(p.name)}${pid === room.hostId ? ' ★' : ''}</span>`).join('')}
          </div>
          <p class="tiny">★ host</p>
          <div class="divider"></div>
          ${S.isHost
            ? `<button class="btn primary" ${players.length<1?'disabled':''} onclick="startQuiz()">
                 Start ${S.deck.length === 1 ? "today's question" : `quiz · ${S.deck.length} questions`} →
               </button>
               <button class="btn danger sm" style="margin-top:8px" onclick="leaveRoom()">Close room</button>`
            : `<p class="muted">Waiting for the host to start…</p>
               <button class="btn sm" style="margin-top:8px" onclick="leaveRoom()">Leave</button>`}
        </div>
      </div>
    </div>
  `;
  const qrDiv = $('qr');
  if (qrDiv) new QRCode(qrDiv, { text: joinUrl, width: 160, height: 160 });
}

function renderQuestion() {
  const room = S.room; if (!room) return;
  const q = S.deck[room.questionIdx]; if (!q) return;
  const total = S.deck.length;
  // Live response count (no answer-distribution leaked) — visible to host
  const answersThisQ = (room.answers && room.answers[room.questionIdx]) || {};
  const answeredCount = Object.keys(answersThisQ).length;
  const playerCount = Object.keys(room.players || {}).length;
  const responseRate = playerCount > 0 ? `${answeredCount} / ${playerCount} answered` : '';
  
  $('root').innerHTML = brand() + `
    <div class="card q-card fade-in">
      <div class="qhead">
        <div class="row between" style="margin-bottom:4px">
          <span class="specialty-tag">${escapeHtml(q.specialty)}</span>
          <span class="timer" id="timer">⏱ 60s</span>
        </div>
        <div class="row between" style="margin-bottom:0">
          <div class="muted tiny">Question ${room.questionIdx+1} / ${total}</div>
          ${S.isHost ? `<div class="tiny" style="font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600">${responseRate}</div>` : ''}
        </div>
      </div>
      <div class="qbody">
        <div class="stem-pane">
          <div class="stem">${escapeHtml(q.stem)}</div>
          ${q.imageUrl ? `<img class="stem-img" src="${escapeHtml(q.imageUrl)}" alt="${escapeHtml(q.imageAlt||'')}" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="options-pane">
          <div id="opts">
            ${q.options.map((opt, i) => `
              <button class="opt ${S.selectedAnswer===i?'selected':''}" 
                      ${S.answerSubmitted?'disabled':''}
                      onclick="submitAnswer(${i})">
                <span class="letter">${'ABCDE'[i]}</span>${escapeHtml(opt)}
              </button>`).join('')}
          </div>
        </div>
      </div>
      <div class="qfoot">
        <span class="muted tiny">${S.answerSubmitted ? '✓ Answer locked in — waiting for others…' : ''}</span>
        ${S.isHost ? `<button class="btn sm" onclick="endQuestion()">End question${answeredCount > 0 ? ` · ${answeredCount}/${playerCount} in` : ''}</button>` : '<span></span>'}
      </div>
    </div>
  `;
}

async function renderReveal() {
  const room = S.room; if (!room) return;
  const q = S.deck[room.questionIdx]; if (!q) return;
  const correctIdx = 'ABCDE'.indexOf(q.correct);
  const answers = await window.fb.get(`rooms/${room.code}/answers/${room.questionIdx}`) || {};
  const counts = [0,0,0,0,0];
  for (const a of Object.values(answers)) {
    if (typeof a.answer === 'number' && a.answer >= 0 && a.answer < 5) counts[a.answer]++;
  }
  const total = counts.reduce((s,n)=>s+n,0) || 1;
  const myAns = answers[S.playerId]?.answer;
  const players = Object.entries(room.players||{})
    .map(([pid,p]) => ({...p, pid}))
    .sort((a,b)=>(b.score||0)-(a.score||0));

  $('root').innerHTML = brand() + `
    <div class="card fade-in">
      <span class="specialty-tag">${escapeHtml(q.specialty)}${q.topic?` · ${escapeHtml(q.topic)}`:''}</span>
      <div class="muted tiny" style="margin:6px 0">Question ${room.questionIdx+1} / ${S.deck.length}</div>
      <div class="stem">${escapeHtml(q.stem)}</div>
      ${q.imageUrl ? `<img class="stem-img" src="${escapeHtml(q.imageUrl)}" alt="${escapeHtml(q.imageAlt||'')}" onerror="this.style.display='none'">` : ''}
      <div>
        ${q.options.map((opt,i)=>{
          const cls = i===correctIdx ? 'correct'
            : (myAns===i && i!==correctIdx) ? 'incorrect' : '';
          const pct = Math.round((counts[i]/total)*100);
          return `
            <div class="opt ${cls}" style="cursor:default">
              <span class="letter">${'ABCDE'[i]}</span>${escapeHtml(opt)}
              <div class="dist-bar">
                <div class="bar"><div class="fill ${i===correctIdx?'correct':''}" style="width:${pct}%"></div></div>
                <span>${counts[i]} (${pct}%)</span>
              </div>
            </div>`;
        }).join('')}
      </div>
      ${(() => {
        const pearlMatch = (q.explanation || '').match(/💎\s*PEARL:\s*([\s\S]+?)$/);
        if (!pearlMatch) return '';
        return `<div style="margin-bottom:12px;padding:12px 16px;background:#FFF8E7;border-left:3px solid #B45309;border-radius:var(--radius-sm);font-size:14px;line-height:1.55">
          <strong style="font-size:11px;color:#B45309;text-transform:uppercase;letter-spacing:0.08em">💎 Pearl</strong>
          <div style="margin-top:4px;color:var(--ink)">${escapeHtml(pearlMatch[1].trim())}</div>
        </div>`;
      })()}
      <div class="explanation">
        <strong>Answer: ${q.correct}</strong> · ${(() => {
          const text = q.explanation || '';
          const pearlMatch = text.match(/💎\s*PEARL:\s*([\s\S]+?)$/);
          if (pearlMatch) return escapeHtml(text.slice(0, pearlMatch.index).trim());
          return escapeHtml(text);
        })()}
      </div>
      ${q.references && q.references.length ? `
      <div class="references">
        <strong>📚 References & guidelines</strong>
        <ul>
          ${q.references.map(r => `<li><a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.label)}</a></li>`).join('')}
        </ul>
      </div>` : ''}
    </div>
    <div class="card">
      <h3>Leaderboard</h3>
      <ol class="leaderboard">
        ${players.map((p,i) => `
          <li class="${p.pid===S.playerId?'you':''}">
            <span class="pos">${i+1}</span>
            <span class="name">${escapeHtml(p.name)}${p.pid===room.hostId?' ★':''}</span>
            <span class="score">${p.score||0}</span>
          </li>`).join('')}
      </ol>
      ${S.isHost ? `<div class="divider"></div>
        <div class="row">
          <button class="btn primary" onclick="nextQuestion()">
            ${room.questionIdx+1>=S.deck.length ? 'Show final results →' : 'Next question →'}
          </button>
          <button class="btn danger sm" onclick="endQuiz()">End quiz</button>
        </div>` : `<p class="muted" style="margin-top:8px">Host will advance shortly…</p>`}
    </div>
  `;
}

function renderFinished() {
  const room = S.room; if (!room) return;
  const players = Object.entries(room.players||{})
    .map(([pid,p]) => ({...p, pid}))
    .sort((a,b)=>(b.score||0)-(a.score||0));
  const winner = players[0];
  $('root').innerHTML = brand() + `
    <div class="card fade-in" style="text-align:center">
      <h1 style="font-size:28px;margin-bottom:8px">🏆 Quiz finished</h1>
      <p class="muted" style="margin-bottom:14px">${S.deck.length} questions completed</p>
      ${winner ? `<p style="font-size:18px"><strong>${escapeHtml(winner.name)}</strong> — ${winner.score||0} points</p>` : ''}
    </div>
    <div class="card">
      <h3>Final standings</h3>
      <ol class="leaderboard">
        ${players.map((p,i) => `
          <li class="${p.pid===S.playerId?'you':''}">
            <span class="pos">${i+1}</span>
            <span class="name">${escapeHtml(p.name)}${i===0?' 🏆':''}</span>
            <span class="score">${p.score||0}</span>
          </li>`).join('')}
      </ol>
      <div class="divider"></div>
      <button class="btn" onclick="leaveRoom()">${S.isHost?'Close room':'Leave'} & start over</button>
    </div>
  `;
}

function render() {
  if (!window.fb || !window.fb.ready()) { renderSetup(); return; }
  // qmode body class when answering a question (team or solo)
  document.body.classList.toggle('qmode', S.view === 'question' || S.view === 'solo-question');
  // landing class for the editorial-styled home screen
  document.body.classList.toggle('landing', S.view === 'landing' || !S.view);
  switch (S.view) {
    case 'lobby':         renderLobby(); break;
    case 'question':      renderQuestion(); break;
    case 'reveal':        renderReveal(); break;
    case 'finished':      renderFinished(); break;
    case 'solo-question': renderSoloQuestion(); break;
    case 'solo-reveal':   renderSoloReveal(); break;
    default:              renderLanding();
  }
}

// Auto-generate an anonymous player label like "Player KFMR"
function autoName() {
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // omit easily-confused I O
  let code = '';
  for (let i = 0; i < 4; i++) code += letters[Math.floor(Math.random() * letters.length)];
  return 'Player ' + code;
}

window.hostClick = function() {
  const inputEl = document.getElementById('hospital-input');
  let hospital = inputEl ? inputEl.value.trim() : '';
  if (!hospital) {
    hospital = window.HOST_NAME && window.HOST_NAME !== 'Hospital Name' ? window.HOST_NAME : autoName();
  } else {
    // Persist for next session on this browser
    try { localStorage.setItem('aimQuizHospital', hospital); } catch (e) {}
  }
  createRoom(hospital);
};
window.joinClick = function(code) {
  // Retained for any external callers; UI no longer exposes this.
  if (!code) { alert('Room code required.'); return; }
  joinRoom(code.toUpperCase(), autoName());
};
window.msImportClick = function() {
  const id = prompt('Enter the MS Form ID (from the form URL):');
  if (id) importMSForm(id);
};
window.startQuiz = startQuiz;
window.submitAnswer = submitAnswer;
window.endQuestion = endQuestion;
window.nextQuestion = nextQuestion;
window.endQuiz = endQuiz;
window.leaveRoom = leaveRoom;
// Solo mode
window.startSoloDaily = startSoloDaily;
window.startSoloRandom = startSoloRandom;
window.pickSoloAnswer = pickSoloAnswer;
window.revealSoloAnswer = revealSoloAnswer;
window.nextSoloRandom = nextSoloRandom;
window.nextSoloSpecialty = nextSoloSpecialty;
window.exitSolo = exitSolo;

(async function() {
  await waitForFb();
  if (window.MSAL_CFG?.clientId) await initMsal();
  render();
})();
</script>
